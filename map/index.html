<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ece7d7">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>AT map | keegan.biz</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="./styles.css?v=20">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="./config.js?v=20"></script>
  <script defer src="./app.js?v=20"></script>
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <div class="site-identity">
        <a class="home-scarf" href="/" aria-label="Return to keegan.biz homepage">
          <img src="/assets/home/home-scarf-update.png" alt="keegan.biz">
        </a>
      </div>
    </header>

    <main class="workarea">
      <aside class="key-panel" aria-label="Map key">
        <div class="key-scroll">
          <h1 class="key-title">Map key</h1>
          <section class="legend-group" aria-labelledby="key-trails">
            <h2 id="key-trails">Trails</h2>
            <div class="legend-row"><span class="swatch line-at"></span><span>Appalachian Trail</span></div>
            <div class="legend-row"><span class="swatch line-near"></span><span>Nearby trails</span></div>
          </section>
          <section class="legend-group" aria-labelledby="key-fishing">
            <h2 id="key-fishing">Fishing</h2>
            <div class="legend-row"><span class="swatch fish-release"></span><span>Catch and release</span></div>
            <div class="legend-row"><span class="swatch fish-keep"></span><span>Keep</span></div>
          </section>
          <section class="legend-group" aria-labelledby="key-places">
            <h2 id="key-places">Places</h2>
            <div class="legend-row"><span class="swatch camp"></span><span>Camps and shelters</span></div>
            <div class="legend-row"><span class="swatch peak"></span><span>Peaks</span></div>
            <div class="legend-row"><span class="swatch poi"></span><span>Points of interest</span></div>
            <div class="legend-row"><span class="swatch historic"></span><span>Historic sites</span></div>
            <div class="legend-row"><span class="swatch dam"></span><span>Dams</span></div>
            <div class="legend-row"><span class="swatch waterfall"></span><span>Waterfalls</span></div>
          </section>
          <section class="legend-group" aria-labelledby="key-terrain">
            <h2 id="key-terrain">Terrain and water</h2>
            <div class="legend-row"><span class="swatch river"></span><span>Rivers and streams</span></div>
            <div class="legend-row"><span class="swatch lake"></span><span>Lakes and ponds</span></div>
            <div class="legend-row"><span class="swatch forest"></span><span>Forest / protected land</span></div>
            <div class="legend-row"><span class="swatch contour"></span><span>Contours</span></div>
          </section>
        </div>
        <div class="key-footer">
          <div class="distance" aria-live="polite">
            <div class="measurement-heading">
              <span class="footer-label">Distance</span>
              <button type="button" class="key-measure-button" id="measure-button" aria-pressed="false">Measure</button>
            </div>
            <div class="distance-value"><strong id="measurement-value">0.00</strong><span>mi</span></div>
            <div class="measure-actions" id="measure-actions" hidden>
              <button type="button" class="text-button" id="undo-measure">Undo</button>
              <button type="button" class="text-button" id="clear-measure">Clear</button>
            </div>
          </div>
          <div class="scale-host" id="scale-host" aria-label="Map scale"></div>
        </div>
      </aside>

      <div class="map-wrap" id="map-wrap">
        <div id="map" role="application" aria-label="Interactive Appalachian Trail map of northwest Connecticut"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </main>
  </div>
</body>
</html>
