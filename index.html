        0;


      matchWinner =
        null;


      currentWinImage =
        null;


      game.reset();


      clearCapturePhysics();


      capturedPieces.w.length =
        0;


      capturedPieces.b.length =
        0;


      lastCaptureToken =
        0;


      pieceRestingPositions.clear();


      whiteTime =
        startingMinutes *
        60 *
        1000;


      blackTime =
        startingMinutes *
        60 *
        1000;


      timerStarted =
        false;


      timerFinished =
        false;


      activeClock =
        "w";


      lastTick =
        performance.now();


      hideResultUI();


      resetHistory();


      renderBoard();


      renderCapturedPieces();


      updateClocks();

    }


    function startReview() {

      if (
        matchHistory.length <
        1
      ) {
        return;
      }


      cancelSelection();


      reviewing =
        true;


      reviewIndex =
        matchHistory.length -
        1;


      winOverlay.classList.remove(
        "is-visible"
      );


      winOverlay.hidden =
        true;


      winOverlay.setAttribute(
        "aria-hidden",
        "true"
      );


      resultActions.classList.remove(
        "is-visible"
      );


      resultActions.setAttribute(
        "aria-hidden",
        "true"
      );


      reviewControls.classList.add(
        "is-visible"
      );


      reviewControls.setAttribute(
        "aria-hidden",
        "false"
      );


      renderBoard();

    }


    function updateReviewControls() {

      const lastIndex =
        matchHistory.length -
        1;


      reviewStartButton.disabled =
        reviewIndex ===
        0;


      reviewPrevButton.disabled =
        reviewIndex ===
        0;


      reviewNextButton.disabled =
        reviewIndex ===
        lastIndex;


      reviewEndButton.disabled =
        reviewIndex ===
        lastIndex;


      if (
        reviewIndex ===
        0
      ) {

        reviewLabel.textContent =
          "start";

      }

      else {

        const step =
          matchHistory[
            reviewIndex
          ];


        reviewLabel.textContent =
          `move ${reviewIndex} / ${lastIndex} · ${step.san}`;

      }

    }


    function goToReviewIndex(
      index
    ) {

      reviewIndex =
        clampChess(
          index,
          0,
          matchHistory.length -
          1
        );


      renderBoard();

    }


    function returnToResult() {

      reviewing =
        false;


      renderBoard();


      renderCapturedPieces();


      reviewControls.classList.remove(
        "is-visible"
      );


      reviewControls.setAttribute(
        "aria-hidden",
        "true"
      );


      if (
        matchWinner
      ) {

        showWin(
          matchWinner
        );

      }

    }


    boardElement.addEventListener(
      "click",
      boardClick
    );


    window.addEventListener(
      "pointermove",
      event => {

        if (
          !selected ||
          !selected.floating
        ) {
          return;
        }


        selected.x =
          event.clientX;


        selected.y =
          event.clientY;


        moveFloatingPiece(
          selected.x,
          selected.y
        );

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
        ) {

          if (
            selected
          ) {

            cancelSelection();

          }

          else if (
            reviewing
          ) {

            returnToResult();

          }

        }

      }
    );


    flipButton.addEventListener(
      "click",
      () => {

        cancelSelection();


        orientation =
          orientation ===
          "white"
            ? "black"
            : "white";


        renderBoard();


        if (
          reviewing
        ) {
          renderCapturedPieces(
            null,
            matchHistory[reviewIndex].captures,
            true,
            true
          );
        }

        else {
          renderCapturedPieces(
            null,
            capturedPieces,
            true,
            true
          );
        }


        if (
          gameMode ===
          "autoplay"
        ) {

          updateAutoplayInfo();

        }

      }
    );


    resetButton.addEventListener(
      "click",
      resetGame
    );


    resignButton.addEventListener(
      "click",
      resignGame
    );


    playAgainButton.addEventListener(
      "click",
      () => {

        if (
          gameMode ===
          "bot"
        ) {

          prepareBotGame();

        }

        else if (
          gameMode ===
          "autoplay"
        ) {

          prepareAutoplayGame(
            autoplayGame
          );

        }

        else {

          resetGame();

        }

      }
    );


    exploreMatchButton.addEventListener(
      "click",
      startReview
    );


    reviewStartButton.addEventListener(
      "click",
      () => {

        goToReviewIndex(
          0
        );

      }
    );


    reviewPrevButton.addEventListener(
      "click",
      () => {

        goToReviewIndex(
          reviewIndex -
          1
        );

      }
    );


    reviewNextButton.addEventListener(
      "click",
      () => {

        goToReviewIndex(
          reviewIndex +
          1
        );

      }
    );


    reviewEndButton.addEventListener(
      "click",
      () => {

        goToReviewIndex(
          matchHistory.length -
          1
        );

      }
    );


    reviewResultButton.addEventListener(
      "click",
      returnToResult
    );


    localModeButton.addEventListener(
      "click",
      startLocalGame
    );


    botModeButton.addEventListener(
      "click",
      () => {

        startBotGame(
          botDifficulty
        );

      }
    );


    autoplayModeButton.addEventListener(
      "click",
      startAutoplayGame
    );


    autoplayStartButton.addEventListener(
      "click",
      () => {

        if (
          gameMode !==
          "autoplay"
        ) {
          return;
        }


        autoplayGoTo(
          0
        );

      }
    );


    autoplayPrevButton.addEventListener(
      "click",
      () => {

        if (
          gameMode !==
          "autoplay"
        ) {
          return;
        }


        autoplayGoTo(
          autoplayMoveIndex -
          1
        );

      }
    );


    autoplayToggleButton.addEventListener(
      "click",
      () => {

        if (
          gameMode !==
          "autoplay"
          ||
          timerFinished
        ) {
          return;
        }


        autoplayPlaying =
          !autoplayPlaying;


        updateAutoplayInfo();


        updateStatus();


        if (
          autoplayPlaying
        ) {

          scheduleAutoplayMove(
            900
          );

        }

        else {

          clearAutoplayTimer();

        }

      }
    );


    autoplayNextButton.addEventListener(
      "click",
      () => {

        if (
          gameMode !==
          "autoplay"
        ) {
          return;
        }


        autoplayGoTo(
          autoplayMoveIndex +
          1,
          autoplayMoveIndex +
          1 >=
          autoplayMoves.length
        );

      }
    );


    autoplayEndButton.addEventListener(
      "click",
      () => {

        if (
          gameMode !==
          "autoplay"
        ) {
          return;
        }


        autoplayGoTo(
          autoplayMoves.length,
          true
        );

      }
    );


    autoplayNewButton.addEventListener(
      "click",
      () => {

        prepareAutoplayGame();

      }
    );


    difficultyButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            startBotGame(
              button.dataset.level
            );

          }
        );

      }
    );


    setTimeButton.addEventListener(
      "click",
      setClockMinutes
    );


    timeInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
        ) {

          setClockMinutes();

        }

      }
    );


    window.addEventListener(
      "resize",
      () => {

        if (
          !captureEngine
        ) {
          return;
        }


        rebuildCaptureWalls();


        const width =
          captureBin.clientWidth;


        const height =
          captureBin.clientHeight;


        captureBodies.forEach(
          item => {

            Matter.Body.setPosition(
              item.body,
              {
                x:
                  clampChess(
                    item.body.position.x,
                    item.body.bounds.max.x - item.body.position.x,
                    Math.max(
                      item.body.bounds.max.x - item.body.position.x,
                      width
                      -
                      (
                        item.body.bounds.max.x
                        -
                        item.body.position.x
                      )
                    )
                  ),

                y:
                  Math.min(
                    item.body.position.y,
                    height
                    -
                    (
                      item.body.bounds.max.y
                      -
                      item.body.position.y
                    )
                  )
              }
            );


            updateCapturedElement(
              item
            );

          }
        );

      }
    );


    window.setInterval(
      tickClock,
      250
    );


    updateModeUI();


    hideResultUI();


    resetHistory();


    renderBoard();


    renderCapturedPieces();


    updateClocks();

  </script>

  <script src="/assets/sports/sports.js" defer></script>
  <script src="/assets/site-nav.js" defer></script>

</body>
</html>
