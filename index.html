<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>keegan.biz</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="page-shell">

    <!-- =====================================================
         SCARF MENU
         ===================================================== -->

    <nav class="scarf-rack" aria-label="Site sections">

      <a
        href="#"
        class="scarf-rack__item scarf-rack__item--home audio-trigger"
        aria-label="Play soundtrack"
      >
        <img
          src="assets/home/home-scarf-update.png"
          alt="keegan.biz"
        />
      </a>

      <a
        href="#"
        class="scarf-rack__item audio-trigger"
        aria-label="Illustration"
      >
        <img
          src="assets/home/scarf-illustration.png"
          alt="Illustration"
        />
      </a>

      <a
        href="#"
        class="scarf-rack__item audio-trigger"
        aria-label="Photography"
      >
        <img
          src="assets/home/scarf-photography.png"
          alt="Photography"
        />
      </a>

      <a
        href="#"
        class="scarf-rack__item audio-trigger"
        aria-label="Graphic design"
      >
        <img
          src="assets/home/scarf-design.png"
          alt="Graphic design"
        />
      </a>

      <a
        href="#"
        class="scarf-rack__item audio-trigger"
        aria-label="Music"
      >
        <img
          src="assets/home/scarf-music.png"
          alt="Music"
        />
      </a>

      <a
        href="#"
        class="scarf-rack__item audio-trigger"
        aria-label="Motion"
      >
        <img
          src="assets/home/scarf-motion.png"
          alt="Motion"
        />
      </a>

      <a
        href="#"
        class="scarf-rack__item audio-trigger"
        aria-label="Misc"
      >
        <img
          src="assets/home/scarf-misc.png"
          alt="Misc"
        />
      </a>

    </nav>


    <!-- =====================================================
         HERO
         ===================================================== -->

    <main class="hero">

      <div class="hero-inner">

        <!-- SLOT MACHINE -->

        <div
          class="welcome-slot"
          aria-live="polite"
          aria-atomic="true"
        >

          <div
            class="welcome-track"
            id="welcome-track"
          >

            <span
              class="welcome-word welcome-word--current"
              id="welcome-current"
              dir="auto"
            >
              Welcome
            </span>

            <span
              class="welcome-word welcome-word--next"
              id="welcome-next"
              dir="auto"
            >
              Welcome
            </span>

          </div>

        </div>


        <!-- STATIC TITLE -->

        <h1 class="main-title">
          <span class="main-title__to">to</span>
          <span class="main-title__brand">keegan.biz</span>
        </h1>

      </div>

    </main>


    <!-- =====================================================
         YOUTUBE PLAYER
         appears only after scarf click
         ===================================================== -->

    <div
      class="player-shell"
      id="player-shell"
      aria-hidden="true"
    >

      <button
        class="player-close"
        id="player-close"
        type="button"
        aria-label="Close soundtrack"
      >
        ×
      </button>

      <div id="youtube-player"></div>

    </div>

  </div>


  <script src="https://www.youtube.com/iframe_api"></script>


  <script>
    /* =======================================================
       WELCOME LANGUAGES
       ======================================================= */

    const welcomes = [
      { text: "Welcome" },
      { text: "Ласкаво просимо" },
      { text: "Benvenuti" },
      { text: "Fáilte" },
      { text: "Bienvenidos" },
      { text: "欢迎" },
      { text: "Benvinguts" },

      {
        text: "WELCOME",
        className: "is-wingdings"
      },

      { text: "Sveiki atvykę" },
      { text: "Yá’át’ééh" },
      { text: "Velkomin" },
      { text: "Willkommen" },
      { text: "ようこそ" },
      { text: "Bienvenue" },
      { text: "Bem-vindos" },
      { text: "أهلاً وسهلاً" },
      { text: "Mae govannen" },
      { text: "Croeso" },

      {
        text:
          "01010111 01100101 01101100 01100011 01101111 01101101 01100101",
        className: "is-binary"
      },

      { text: "Karibu" },
      { text: "Siyakwamukela" },
      { text: "Ẹ káàbọ̀" },
      { text: "እንኳን ደህና መጡ" },
      { text: "स्वागत है" },
      { text: "خوش آمدید" }
    ];


    const welcomeColors = [
      "#FDB913",
      "#006A44",
      "#C1272D"
    ];


    const welcomeTrack =
      document.getElementById("welcome-track");

    const welcomeCurrent =
      document.getElementById("welcome-current");

    const welcomeNext =
      document.getElementById("welcome-next");


    let currentWelcome = 0;
    let currentColor = 0;
    let rolling = false;


    function differentIndex(length, previous) {

      let next;

      do {
        next = Math.floor(Math.random() * length);
      }
      while (
        length > 1 &&
        next === previous
      );

      return next;
    }


    function applyWelcome(element, entry) {

      element.classList.remove(
        "is-wingdings",
        "is-binary"
      );

      element.textContent =
        entry.text;

      if (entry.className) {
        element.classList.add(
          entry.className
        );
      }

    }


    function rollWelcome() {

      if (rolling) {
        return;
      }

      rolling = true;


      const nextWelcome =
        differentIndex(
          welcomes.length,
          currentWelcome
        );


      const nextColor =
        differentIndex(
          welcomeColors.length,
          currentColor
        );


      applyWelcome(
        welcomeNext,
        welcomes[nextWelcome]
      );


      welcomeNext.style.color =
        welcomeColors[nextColor];


      welcomeTrack.classList.add(
        "is-rolling"
      );


      setTimeout(() => {

        applyWelcome(
          welcomeCurrent,
          welcomes[nextWelcome]
        );


        welcomeCurrent.style.color =
          welcomeColors[nextColor];


        welcomeTrack.classList.add(
          "no-transition"
        );


        welcomeTrack.classList.remove(
          "is-rolling"
        );


        void welcomeTrack.offsetHeight;


        welcomeTrack.classList.remove(
          "no-transition"
        );


        currentWelcome =
          nextWelcome;

        currentColor =
          nextColor;

        rolling = false;

      }, 560);

    }


    welcomeCurrent.style.color =
      welcomeColors[0];


    setInterval(
      rollWelcome,
      2600
    );


    /* =======================================================
       YOUTUBE SOUNDTRACK
       ======================================================= */

    const playerShell =
      document.getElementById(
        "player-shell"
      );

    const playerClose =
      document.getElementById(
        "player-close"
      );

    const scarfTriggers =
      document.querySelectorAll(
        ".audio-trigger"
      );


    let youtubePlayer = null;
    let youtubeReady = false;
    let playRequested = false;


    function onYouTubeIframeAPIReady() {

      youtubePlayer =
        new YT.Player(
          "youtube-player",
          {

            width: 300,
            height: 200,

            videoId:
              "Hqxdn-MbpE0",

            playerVars: {

              autoplay: 0,

              controls: 1,

              playsinline: 1,

              rel: 0,

              loop: 1,

              playlist:
                "Hqxdn-MbpE0"

            },

            events: {

              onReady: function() {

                youtubeReady = true;

                if (playRequested) {
                  startSoundtrack();
                }

              }

            }

          }
        );

    }


    function startSoundtrack() {

      playerShell.classList.add(
        "is-visible"
      );

      playerShell.setAttribute(
        "aria-hidden",
        "false"
      );


      playRequested = true;


      if (
        youtubeReady &&
        youtubePlayer
      ) {

        youtubePlayer.setVolume(35);

        youtubePlayer.playVideo();

      }

    }


    scarfTriggers.forEach(
      function(trigger) {

        trigger.addEventListener(
          "click",
          function(event) {

            event.preventDefault();

            startSoundtrack();

          }
        );

      }
    );


    playerClose.addEventListener(
      "click",
      function() {

        if (
          youtubeReady &&
          youtubePlayer
        ) {

          youtubePlayer.pauseVideo();

        }


        playerShell.classList.remove(
          "is-visible"
        );


        playerShell.setAttribute(
          "aria-hidden",
          "true"
        );

      }
    );

  </script>

</body>
</html>
