<body>

  <!-- =====================================================
       HOME
       ===================================================== -->

  <main class="home">

    <section class="hero">

        <span

          id="welcome-word"

        >

  <!-- =====================================================
       AUDIO
       ===================================================== -->

  <audio id="wip-audio" preload="auto">
    <source
      src="assets/home/crickets.mp3"
      type="audio/mpeg"
    >
  </audio>


  <!-- =====================================================
       WIP
       ===================================================== -->

  <div
    class="wip-overlay"
    id="wip-overlay"
    aria-hidden="true"
  >

    <div class="wip-inner">

      <div class="wip-header">

        <p class="wip-text">
          sorry, i'm still working on this.
        </p>

        <button
          class="wip-close"
          id="wip-close"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <div
        class="collage-stage"
        id="collage-stage"
        aria-hidden="true"
      >

        <!-- TWO TEXTURES UNDER HORSE -->

        <div

        ></div>

        <div

        <!-- COLOR / GRADIENT UNDER HORSE -->

          class="color-layer color-under"
          id="color-under"
        ></div>


        <!-- HORSE -->

        <div class="horse-stage">

          <img
            class="horse horse-shadow"
            src="assets/home/horse.gif"
            alt=""
          >

          <img
            class="horse horse-main"
            src="assets/home/horse.gif"
            alt=""
          >

        </div>


        <!-- TWO TEXTURES OVER HORSE -->

        <div
          class="texture-layer texture-over texture-over-1"
          id="over-1"
        ></div>

        <div
          class="texture-layer texture-over texture-over-2"
          id="over-2"
        ></div>


        <!-- COLOR / GRADIENT ABOVE HORSE -->

        <div
          class="color-layer color-over"
          id="color-over"
        ></div>


        <!--
          Very faint final horse line layer.
          Keeps the drawing legible even when
          color-burn layers are strong.
        -->

        <img
          class="horse horse-anchor"
          src="assets/home/horse.gif"
          alt=""
        >

      </div>

    </div>

  <!-- =====================================================
       SCRIPT
       ===================================================== -->

  <script>
  (() => {

    /* =====================================================
       HELPERS
       ===================================================== */

    const clamp = (value, min, max) =>
      Math.min(Math.max(value, min), max);

    const lerp = (a, b, amount) =>
      a + ((b - a) * amount);

    const random = (min, max) =>
      min + Math.random() * (max - min);

    const pick = array =>
      array[Math.floor(Math.random() * array.length)];

    const shuffle = array => {
      const copy = [...array];

      for (
        let i = copy.length - 1;
        i > 0;
        i--
      ) {
        const j =
          Math.floor(Math.random() * (i + 1));

        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];
      }

      return copy;
    };


    /* =====================================================
       WELCOME
       ===================================================== */

    const welcomeWord =
      document.getElementById("welcome-word");


    const greetings = [

      "Welcome",
      "Fáilte",
      "Benvenuti",
      "Bienvenue",
      "Bienvenidos",
      "Benvinguts",
      "Bem-vindos",

      "Welkom",
      "Willkommen",
      "Velkommen",
      "Välkommen",
      "Velkomin",

      "Tervetuloa",
      "Sveiki atvykę",
      "Laipni lūdzam",
      "Tere tulemast",

      "Witamy",
      "Vítejte",
      "Vitajte",

      "Добродошли",
      "Добре дошли",
      "Ласкаво просимо",

      "Bun venit",
      "Üdvözöljük",
      "Mirë se vini",

      "Ongi etorri",
      "Καλώς ήρθατε",
      "Hoş geldiniz",

      "Croeso",
      "Nau mai",

      "Karibu",
      "Siyakwamukela",
      "Ẹ káàbọ̀",

      "እንኳን ደህና መጡ",
      "स्वागत है",
      "স্বাগতম",

      "欢迎",
      "ようこそ",
      "환영합니다",
      "ยินดีต้อนรับ",

      "Chào mừng",
      "Selamat datang",
      "Maligayang pagdating",

      "ברוכים הבאים",
      "أهلاً وسهلاً",
      "خوش آمدید",

      "Bonvenon",
      "Salvete",

      "Yá’át’ééh",
      "Aloha",

      "Mae govannen",

      "01010111 01100101 01101100 01100011 01101111 01101101 01100101"

    ];


    const welcomeColors = [
      "#fdb913",
      "#006a44",
      "#c1272d"
    ];


    let greetingIndex = 0;
    let colorIndex = 1;
    let greetingBusy = false;


    function differentIndex(
      length,
      oldIndex
    ) {

      let nextIndex;

      do {
        nextIndex =
          Math.floor(
            Math.random() * length
          );
      }
      while (
        length > 1 &&
        nextIndex === oldIndex
      );

      return nextIndex;
    }


    function fitWelcome() {

      welcomeWord.style.fontSize = "";

      const maxWidth =
        welcomeWord.parentElement.clientWidth;

      let fontSize =
        parseFloat(
          getComputedStyle(
            welcomeWord
          ).fontSize
        );


      while (
        welcomeWord.scrollWidth > maxWidth &&
        fontSize > 27
      ) {

        fontSize -= 2;

        welcomeWord.style.fontSize =
          `${fontSize}px`;

      }

    }


    function changeGreeting() {

      if (greetingBusy) {
        return;
      }

      greetingBusy = true;


      const nextGreeting =
        differentIndex(
          greetings.length,
          greetingIndex
        );


      const nextColor =
        differentIndex(
          welcomeColors.length,
          colorIndex
        );


      welcomeWord.classList.add(
        "is-fading"
      );


      setTimeout(() => {

        greetingIndex =
          nextGreeting;

        colorIndex =
          nextColor;


        welcomeWord.textContent =
          greetings[greetingIndex];


        welcomeWord.style.color =
          welcomeColors[colorIndex];


        fitWelcome();


        welcomeWord.classList.remove(
          "is-fading"
        );


        setTimeout(() => {
          greetingBusy = false;
        }, 300);

      }, 260);

    }


    welcomeWord.style.color =
      welcomeColors[colorIndex];


    fitWelcome();


    window.addEventListener(
      "resize",
      fitWelcome
    );


    setInterval(
      changeGreeting,
      2500
    );


    /* =====================================================
       WIP
       ===================================================== */

    const audio =
      document.getElementById("wip-audio");

    const overlay =
      document.getElementById("wip-overlay");

    const closeButton =
      document.getElementById("wip-close");

    const stage =
      document.getElementById("collage-stage");


    const underLayers = [
      document.getElementById("under-1"),
      document.getElementById("under-2")
    ];


    const overLayers = [
      document.getElementById("over-1"),
      document.getElementById("over-2")
    ];


    const allTextureLayers = [
      ...underLayers,
      ...overLayers
    ];


    const colorUnder =
      document.getElementById("color-under");

    const colorOver =
      document.getElementById("color-over");


    /* =====================================================
       TEXTURE LIST
       ===================================================== */

    const TEXTURES = [

      "Texturelabs_Atmosphere_121S.jpg",
      "Texturelabs_Atmosphere_127S.jpg",
      "Texturelabs_Atmosphere_130S.jpg",
      "Texturelabs_Atmosphere_135S.jpg",
      "Texturelabs_Atmosphere_201S.jpg",

      "Texturelabs_Brick_124S.jpg",
      "Texturelabs_Brick_158S.jpg",

      "Texturelabs_Concrete_150S.jpg",
      "Texturelabs_Concrete_155S.jpg",
      "Texturelabs_Concrete_179S.jpg",
      "Texturelabs_Concrete_205S.jpg",
      "Texturelabs_Concrete_207S.jpg",

      "Texturelabs_Fabric_123S.jpg",
      "Texturelabs_Fabric_144S.jpg",
      "Texturelabs_Fabric_172S.jpg",

      "Texturelabs_Film_181S.jpg",
      "Texturelabs_Film_183S.jpg",
      "Texturelabs_Film_187S.jpg",

      "Texturelabs_Glass_134S.jpg",
      "Texturelabs_Glass_155S.jpg",

      "Texturelabs_Grunge_173S.jpg",
      "Texturelabs_Grunge_279L.jpg",
      "Texturelabs_Grunge_334S.jpg",
      "Texturelabs_Grunge_341S.jpg",

      "Texturelabs_InkPaint_126S.jpg",
      "Texturelabs_InkPaint_320S.jpg",
      "Texturelabs_InkPaint_332S.jpg",
      "Texturelabs_InkPaint_356S.jpg",

      "Texturelabs_LensFX_251S.jpg",
      "Texturelabs_LensFX_256S.jpg",

      "Texturelabs_Metal_129S.jpg",
      "Texturelabs_Metal_165S.jpg",
      "Texturelabs_Metal_285S.jpg",
      "Texturelabs_Metal_294S.jpg",

      "Texturelabs_Paper_273S.jpg",
      "Texturelabs_Paper_278L.jpg",
      "Texturelabs_Paper_280S.jpg",
      "Texturelabs_Paper_286S.jpg",
      "Texturelabs_Paper_303S.jpg",
      "Texturelabs_Paper_324S.jpg",
      "Texturelabs_Paper_380L.jpg",
      "Texturelabs_Paper_380S.jpg",

      "Texturelabs_Sky_171S.jpg",

      "Texturelabs_Soil_146S.jpg",
      "Texturelabs_Soil_149S.jpg",

      "Texturelabs_Stone_167S.jpg",
      "Texturelabs_Stone_169S.jpg",

      "Texturelabs_Water_124S.jpg",
      "Texturelabs_Water_141S.jpg",

      "Texturelabs_Wood_135S.jpg",
      "Texturelabs_Wood_280S.jpg",
      "Texturelabs_Wood_290S.jpg"

    ].map(
      filename =>
        `assets/home/${filename}`
    );


    /* =====================================================
       SESSION TEXTURES

       Use a randomized subset each time.
       This avoids trying to decode 50 giant JPGs
       while the animation is running.
       ===================================================== */

    let sessionTextures = [];
    let readyTextures = [];


    function prepareTextureSession() {

      /*
        18 gives plenty of variation while
        remaining much easier on the browser.
      */

      sessionTextures =
        shuffle(TEXTURES).slice(0, 18);


      readyTextures = [];


      sessionTextures.forEach(src => {

        const image =
          new Image();


        image.decoding =
          "async";


        image.onload = () => {

          if (
            !readyTextures.includes(src)
          ) {

            readyTextures.push(src);

          }

        };


        image.src =
          src;

      });

    }


    function getTexture() {

      if (
        readyTextures.length
      ) {

        return pick(
          readyTextures
        );

      }


      return pick(
        sessionTextures
      );

    }


    /* =====================================================
       COLOR SYSTEM
       ===================================================== */

    const colors = [

      "#c1272d",
      "#8d2027",

      "#006a44",
      "#1f533e",

      "#fdb913",
      "#c79721",

      "#17364d",
      "#566d83",

      "#704c63",
      "#b67f70",

      "#d9d0bb",
      "#ece7d7",

      "#2c211e"

    ];


    /*
      Weighted very heavily toward print /
      photographic darkroom modes.
    */

    const underBlendModes = [

      "color-burn",
      "color-burn",
      "color-burn",

      "multiply",
      "multiply",
      "multiply",

      "overlay",
      "overlay",

      "soft-light",
      "soft-light",

      "hard-light",

      "screen"

    ];


    const overBlendModes = [

      "color-burn",
      "color-burn",
      "color-burn",
      "color-burn",

      "multiply",
      "multiply",

      "overlay",
      "overlay",

      "hard-light",

      "soft-light",

      "screen",

      /*
        Occasional Lynch-y rupture rather
        than constant rainbow difference.
      */

      "difference",
      "exclusion"

    ];


    const internalBlendModes = [

      "color-burn",
      "color-burn",

      "multiply",
      "multiply",

      "overlay",

      "soft-light",

      "hard-light"

    ];


    /* =====================================================
       GRADIENTS / FILLS
       ===================================================== */

    function makeTintGradient() {

      const colorA =
        pick(colors);

      const colorB =
        pick(colors);

      const angle =
        random(0, 360);


      return `
        linear-gradient(
          ${angle}deg,
          ${colorA} 0%,
          transparent ${random(35, 55)}%,
          ${colorB} 100%
        )
      `;

    }


    function makeColorField() {

      const a =
        pick(colors);

      const b =
        pick(colors);

      const c =
        pick(colors);


      const type =
        Math.floor(
          Math.random() * 3
        );


      if (type === 0) {

        return `
          radial-gradient(
            circle at
            ${random(10, 90)}%
            ${random(10, 90)}%,
            ${a},
            transparent ${random(35, 65)}%
          ),
          radial-gradient(
            circle at
            ${random(10, 90)}%
            ${random(10, 90)}%,
            ${b},
            transparent ${random(40, 70)}%
          )
        `;

      }


      if (type === 1) {

        return `
          linear-gradient(
            ${random(0, 360)}deg,
            ${a},
            ${b},
            ${c}
          )
        `;

      }


      return `
        linear-gradient(
          ${random(0, 360)}deg,
          ${a} 0%,
          transparent 35%,
          transparent 65%,
          ${b} 100%
        )
      `;

    }


    /* =====================================================
       TEXTURE CONFIGURATION

       IMPORTANT:
       No transform animation.

       Each texture receives ONE crop, ONE zoom,
       ONE rotation and stays completely static
       until replaced.
       ===================================================== */

    function configureTexture(
      layer,
      intensity,
      isOver
    ) {

      const texture =
        getTexture();


      const tint =
        makeTintGradient();


      /*
        Every texture is full-bleed.

        It is intentionally zoomed beyond cover
        so we never see a small rectangle floating
        inside the horse image.
      */

      const zoom =
        random(
          1.10,
          lerp(
            1.30,
            1.62,
            intensity
          )
        );


      const x =
        random(-3, 3);


      const y =
        random(-3, 3);


      const rotation =
        random(-2.2, 2.2);


      layer.style.backgroundImage =
        `${tint}, url("${texture}")`;


      layer.style.backgroundSize =
        "cover, cover";


      layer.style.backgroundRepeat =
        "no-repeat, no-repeat";


      layer.style.backgroundPosition =
        `
          center,
          ${random(15, 85)}%
          ${random(15, 85)}%
        `;


      /*
        Blend tint INTO the texture.
      */

      layer.style.backgroundBlendMode =
        `${pick(internalBlendModes)}, normal`;


      /*
        Blend complete texture INTO composition.
      */

      layer.style.mixBlendMode =
        pick(
          isOver
            ? overBlendModes
            : underBlendModes
        );


      /*
        Static zoom / crop / rotation.
      */

      layer.style.transform =
        `
          translate(
            ${x}%,
            ${y}%
          )
          rotate(
            ${rotation}deg
          )
          scale(
            ${zoom}
          )
        `;


      /*
        No blur.
        This was one source of the previous
        smeary / expensive look.
      */

      layer.style.filter =
        `
          contrast(
            ${random(0.95, 1.42)}
          )
          saturate(
            ${random(0.68, 1.38)}
          )
          brightness(
            ${random(0.82, 1.12)}
          )
        `;


      let minOpacity;
      let maxOpacity;


      if (isOver) {

        minOpacity =
          lerp(
            0.06,
            0.13,
            intensity
          );


        maxOpacity =
          lerp(
            0.15,
            0.38,
            intensity
          );

      }

      else {

        minOpacity =
          lerp(
            0.11,
            0.20,
            intensity
          );


        maxOpacity =
          lerp(
            0.24,
            0.52,
            intensity
          );

      }


      layer.dataset.targetOpacity =
        random(
          minOpacity,
          maxOpacity
        ).toFixed(3);

    }


    /* =====================================================
       REPLACE ONE COLLAGE PIECE
       ===================================================== */

    function replaceTexture(
      layer,
      intensity,
      isOver
    ) {

      /*
        Fade old paper/image away.
      */

      layer.style.opacity =
        "0";


      setTimeout(() => {

        configureTexture(
          layer,
          intensity,
          isOver
        );


        /*
          Browser gets one frame with the new
          static crop before it fades in.
        */

        requestAnimationFrame(() => {

          requestAnimationFrame(() => {

            layer.style.opacity =
              layer.dataset.targetOpacity;

          });

        });

      }, 135);

    }


    /* =====================================================
       COLOR FIELDS
       ===================================================== */

    function changeColorLayer(
      layer,
      intensity,
      isOver
    ) {

      layer.style.opacity =
        "0";


      setTimeout(() => {

        layer.style.background =
          makeColorField();


        layer.style.mixBlendMode =
          pick(
            isOver
              ? overBlendModes
              : underBlendModes
          );


        const opacity =
          isOver
            ? random(
                0.02,
                lerp(
                  0.05,
                  0.17,
                  intensity
                )
              )
            : random(
                0.025,
                lerp(
                  0.07,
                  0.20,
                  intensity
                )
              );


        layer.style.opacity =
          opacity.toFixed(3);

      }, 150);

    }


    /* =====================================================
       TIMING
       ===================================================== */

    const VISUAL_START =
      9;

    const VISUAL_FULL =
      28;

    const NORMAL_TIME =
      243;


    /*
      120 BPM
      = 0.5 sec per quarter note.
    */

    const BEAT_LENGTH =
      0.5;


    function smoothStep(value) {

      const t =
        clamp(
          value,
          0,
          1
        );


      return (
        t *
        t *
        (3 - (2 * t))
      );

    }


    function revealAmount(time) {

      if (
        time < VISUAL_START
      ) {

        return 0;

      }


      if (
        time >= VISUAL_FULL
      ) {

        return 1;

      }


      return smoothStep(
        (
          time -
          VISUAL_START
        )
        /
        (
          VISUAL_FULL -
          VISUAL_START
        )
      );

    }


    /*
      Keeps beginning restrained,
      then increases toward 4:03.
    */

    function intensityAt(time) {

      if (
        time < VISUAL_START ||
        time >= NORMAL_TIME
      ) {

        return 0;

      }


      if (time < 71) {

        return lerp(
          0.08,
          0.24,
          (
            time -
            VISUAL_START
          )
          /
          (
            71 -
            VISUAL_START
          )
        );

      }


      if (time < 180) {

        return lerp(
          0.24,
          0.48,
          (
            time -
            71
          )
          /
          109
        );

      }


      if (time < 220) {

        return lerp(
          0.48,
          0.76,
          (
            time -
            180
          )
          /
          40
        );

      }


      return lerp(
        0.76,
        1,
        (
          time -
          220
        )
        /
        23
      );

    }


    /*
      Still tempo-locked, but doesn't try
      to load a new full-resolution JPG every
      120ms anymore.

      Mild:
      every 4 sec

      Building:
      every 2 sec

      Tense:
      every 1 sec

      Final:
      every 0.5 sec
    */

    function beatsPerChange(
      intensity
    ) {

      if (
        intensity < 0.25
      ) {

        return 8;

      }


      if (
        intensity < 0.50
      ) {

        return 4;

      }


      if (
        intensity < 0.78
      ) {

        return 2;

      }


      return 1;

    }


    /* =====================================================
       VISUAL STATE
       ===================================================== */

    let overlayOpen =
      false;

    let animationFrame =
      null;

    let lastBeatGroup =
      -1;

    let hasStartedVisual =
      false;

    let hasNormalized =
      false;


    function initializeFourTextures(
      intensity
    ) {

      replaceTexture(
        underLayers[0],
        intensity,
        false
      );

      replaceTexture(
        underLayers[1],
        intensity,
        false
      );

      replaceTexture(
        overLayers[0],
        intensity,
        true
      );

      replaceTexture(
        overLayers[1],
        intensity,
        true
      );


      changeColorLayer(
        colorUnder,
        intensity,
        false
      );


      changeColorLayer(
        colorOver,
        intensity,
        true
      );

    }


    function clearCollage() {

      allTextureLayers.forEach(
        layer => {

          layer.style.opacity =
            "0";

        }
      );


      colorUnder.style.opacity =
        "0";


      colorOver.style.opacity =
        "0";

    }


    function normalizeAtEnd() {

      if (hasNormalized) {
        return;
      }


      hasNormalized =
        true;


      clearCollage();


      stage.classList.add(
        "is-normal"
      );

    }


    /* =====================================================
       RANDOM COLLAGE CUT

       Usually 1 texture changes.
       Near climax sometimes 2.
       ===================================================== */

    function collageCut(
      intensity
    ) {

      const numberToChange =
        intensity > 0.78 &&
        Math.random() < 0.65
          ? 2
          : 1;


      const shuffled =
        shuffle(
          allTextureLayers
        );


      for (
        let i = 0;
        i < numberToChange;
        i++
      ) {

        const layer =
          shuffled[i];


        const isOver =
          overLayers.includes(
            layer
          );


        replaceTexture(
          layer,
          intensity,
          isOver
        );

      }


      /*
        Color washes don't change every time.
        More frequent toward climax.
      */

      if (
        Math.random() <
        lerp(
          0.18,
          0.60,
          intensity
        )
      ) {

        changeColorLayer(
          Math.random() < 0.5
            ? colorUnder
            : colorOver,
          intensity,
          Math.random() < 0.5
        );

      }

    }


    /* =====================================================
       FRAME LOOP
       ===================================================== */

    function visualLoop() {

      if (!overlayOpen) {
        return;
      }


      const time =
        audio.currentTime || 0;


      /*
        Entire visual box begins appearing
        at exactly 9 seconds.
      */

      const reveal =
        revealAmount(time);


      stage.style.setProperty(
        "--visual-reveal",
        reveal.toFixed(4)
      );


      /*
        4:03:
        all collage disappears.
      */

      if (
        time >= NORMAL_TIME
      ) {

        normalizeAtEnd();


        animationFrame =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      const intensity =
        intensityAt(time);


      if (
        time >= VISUAL_START &&
        !hasStartedVisual
      ) {

        hasStartedVisual =
          true;


        initializeFourTextures(
          intensity
        );

      }


      /*
        Audio-timeline beat grid.

        No drifting setInterval.
      */

      if (
        time >= VISUAL_START
      ) {

        const cadence =
          beatsPerChange(
            intensity
          );


        const beat =
          Math.floor(
            (
              time -
              VISUAL_START
            )
            /
            BEAT_LENGTH
          );


        const beatGroup =
          Math.floor(
            beat / cadence
          );


        if (
          beatGroup !==
          lastBeatGroup
        ) {

          lastBeatGroup =
            beatGroup;


          collageCut(
            intensity
          );

        }

      }


      animationFrame =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       OPEN
       ===================================================== */

    async function openWip() {

      overlayOpen =
        true;


      hasStartedVisual =
        false;


      hasNormalized =
        false;


      lastBeatGroup =
        -1;


      stage.classList.remove(
        "is-normal"
      );


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      clearCollage();


      /*
        Start loading a randomized texture pool
        immediately.

        We then have nine full seconds before
        the collage even begins.
      */

      prepareTextureSession();


      document.body.classList.add(
        "wip-open"
      );


      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.pause();


      audio.currentTime =
        0;


      audio.volume =
        0.72;


      try {

        await audio.play();

      }

      catch (error) {

        console.log(
          "Audio playback failed:",
          error
        );

      }


      cancelAnimationFrame(
        animationFrame
      );


      animationFrame =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       CLOSE
       ===================================================== */

    function closeWip() {

      overlayOpen =
        false;


      document.body.classList.remove(
        "wip-open"
      );


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      audio.pause();


      audio.currentTime =
        0;


      cancelAnimationFrame(
        animationFrame
      );


      clearCollage();


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );

    }


    /* =====================================================
       LINKS
       ===================================================== */

    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest("a");


        if (!link) {
          return;
        }


        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>
