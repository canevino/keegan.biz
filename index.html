<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>keegan.biz</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="page-shell">

    <!-- =====================================================
         SCARF MENU
         ===================================================== -->

    <nav class="scarf-rack" aria-label="Site sections">

      <a
        href="index.html"
        class="scarf-rack__item scarf-rack__item--home"
        aria-label="Home"
        title="Home"
      >
        <img
          src="assets/home/home-scarf-update.png"
          alt="keegan.biz"
        />
      </a>

      <a
        href="illustration.html"
        class="scarf-rack__item"
        aria-label="Illustration"
        title="Illustration"
      >
        <img
          src="assets/home/scarf-illustration.png"
          alt="Illustration"
        />
      </a>

      <a
        href="photo.html"
        class="scarf-rack__item"
        aria-label="Photography"
        title="Photography"
      >
        <img
          src="assets/home/scarf-photography.png"
          alt="Photography"
        />
      </a>

      <a
        href="design.html"
        class="scarf-rack__item"
        aria-label="Design"
        title="Design"
      >
        <img
          src="assets/home/scarf-design.png"
          alt="Design"
        />
      </a>

      <a
        href="music.html"
        class="scarf-rack__item"
        aria-label="Music"
        title="Music"
      >
        <img
          src="assets/home/scarf-music.png"
          alt="Music"
        />
      </a>

      <a
        href="motion.html"
        class="scarf-rack__item"
        aria-label="Motion"
        title="Motion"
      >
        <img
          src="assets/home/scarf-motion.png"
          alt="Motion"
        />
      </a>

      <a
        href="misc.html"
        class="scarf-rack__item"
        aria-label="Misc"
        title="Misc"
      >
        <img
          src="assets/home/scarf-misc.png"
          alt="Misc"
        />
      </a>

    </nav>


    <!-- =====================================================
         HERO
         ===================================================== -->

    <main class="hero">

      <div class="hero-inner">

        <div
          class="welcome-slot"
          aria-live="polite"
          aria-atomic="true"
        >
          <div
            class="welcome-track"
            id="welcome-track"
          >
            <span
              class="welcome-word welcome-word--current"
              id="welcome-current"
              dir="auto"
            >
              Welcome
            </span>

            <span
              class="welcome-word welcome-word--next"
              id="welcome-next"
              dir="auto"
            >
              Welcome
            </span>
          </div>
        </div>


        <h1 class="main-title">

          <span class="main-title__to">
            to
          </span>

          <span class="main-title__brand">
            <span class="brand-keegan">keegan</span><span class="brand-dot">.</span><span class="brand-biz">biz</span>
          </span>

        </h1>

      </div>

    </main>


    <!-- =====================================================
         BEHANCE
         ===================================================== -->

    <footer class="site-footer">

      <a
        class="behance-link"
        href="https://www.behance.net/keeganandrulis"
        target="_blank"
        rel="noopener noreferrer"
      >
        behance ↗
      </a>

    </footer>


    <!-- =====================================================
         OPTIONAL LOCAL BACKGROUND AUDIO

         When you have an audio file you are allowed to host,
         put it at:
         assets/audio/background.mp3

         Then remove "disabled" from this element in JS logic
         by simply leaving the src as-is.
         ===================================================== -->

    <audio
      id="background-audio"
      preload="auto"
      loop
    >
      <source
        src="assets/audio/background.mp3"
        type="audio/mpeg"
      />
    </audio>

  </div>


  <script>
    /* =======================================================
       WELCOME LANGUAGES
       ======================================================= */

    const welcomes = [
      { text: "Welcome" },
      { text: "Ласкаво просимо" },
      { text: "Benvenuti" },
      { text: "Fáilte" },
      { text: "Bienvenidos" },
      { text: "欢迎" },
      { text: "Benvinguts" },

      {
        text: "WELCOME",
        className: "is-wingdings"
      },

      { text: "Sveiki atvykę" },
      { text: "Yá’át’ééh" },
      { text: "Velkomin" },
      { text: "Willkommen" },
      { text: "ようこそ" },
      { text: "Bienvenue" },
      { text: "Bem-vindos" },
      { text: "أهلاً وسهلاً" },
      { text: "Mae govannen" },
      { text: "Croeso" },

      {
        text:
          "01010111 01100101 01101100 01100011 01101111 01101101 01100101",
        className: "is-binary"
      },

      { text: "Karibu" },
      { text: "Siyakwamukela" },
      { text: "Ẹ káàbọ̀" },
      { text: "እንኳን ደህና መጡ" },
      { text: "स्वागत है" },
      { text: "خوش آمدید" }
    ];


    const welcomeColors = [
      "#FDB913",
      "#006A44",
      "#C1272D"
    ];


    const welcomeTrack =
      document.getElementById("welcome-track");

    const welcomeCurrent =
      document.getElementById("welcome-current");

    const welcomeNext =
      document.getElementById("welcome-next");


    let currentWelcome = 0;
    let currentColor = 0;
    let rolling = false;


    function getDifferentIndex(length, previous) {
      let next;

      do {
        next = Math.floor(Math.random() * length);
      }
      while (
        length > 1 &&
        next === previous
      );

      return next;
    }


    function applyEntry(element, entry) {

      element.classList.remove(
        "is-wingdings",
        "is-binary"
      );

      element.textContent =
        entry.text;

      if (entry.className) {
        element.classList.add(
          entry.className
        );
      }

    }


    function rollWelcome() {

      if (rolling) {
        return;
      }

      rolling = true;


      const nextWelcome =
        getDifferentIndex(
          welcomes.length,
          currentWelcome
        );


      const nextColor =
        getDifferentIndex(
          welcomeColors.length,
          currentColor
        );


      applyEntry(
        welcomeNext,
        welcomes[nextWelcome]
      );


      welcomeNext.style.color =
        welcomeColors[nextColor];


      welcomeTrack.classList.add(
        "is-rolling"
      );


      setTimeout(() => {

        applyEntry(
          welcomeCurrent,
          welcomes[nextWelcome]
        );


        welcomeCurrent.style.color =
          welcomeColors[nextColor];


        welcomeTrack.classList.add(
          "no-transition"
        );


        welcomeTrack.classList.remove(
          "is-rolling"
        );


        void welcomeTrack.offsetHeight;


        welcomeTrack.classList.remove(
          "no-transition"
        );


        currentWelcome =
          nextWelcome;

        currentColor =
          nextColor;

        rolling = false;

      }, 560);

    }


    welcomeCurrent.style.color =
      welcomeColors[0];


    setInterval(
      rollWelcome,
      2600
    );


    /* =======================================================
       FIRST-INTERACTION AUDIO
       ======================================================= */

    const backgroundAudio =
      document.getElementById(
        "background-audio"
      );


    let audioStarted = false;


    async function startBackgroundAudio() {

      if (
        audioStarted ||
        !backgroundAudio
      ) {
        return;
      }


      try {

        backgroundAudio.volume = 0.35;

        await backgroundAudio.play();

        audioStarted = true;

      }
      catch (error) {

        /* Browser still blocked playback.
           Another interaction can try again. */

      }

    }


    document.addEventListener(
      "pointerdown",
      startBackgroundAudio
    );


    document.addEventListener(
      "keydown",
      startBackgroundAudio
    );

  </script>

</body>
</html>
