  <script>
  (() => {

    /* =====================================================
       GENERAL HELPERS
       ===================================================== */

    const clamp = (value, min, max) =>
      Math.min(
        Math.max(value, min),
        max
      );


    const lerp = (a, b, t) =>
      a + ((b - a) * t);


    const random = (min, max) =>
      min + Math.random() * (max - min);


    const pick = array =>
      array[
        Math.floor(
          Math.random() * array.length
        )
      ];


    function shuffle(array) {

      const result =
        [...array];


      for (
        let i = result.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }


      return result;

    }


    function differentIndex(
      length,
      current
    ) {

      let next;


      do {

        next =
          Math.floor(
            Math.random() * length
          );

      }
      while (
        length > 1 &&
        next === current
      );


      return next;

    }


    function smoothStep(value) {

      const t =
        clamp(
          value,
          0,
          1
        );


      return (
        t *
        t *
        (3 - (2 * t))
      );

    }

      "Aloha",

      "Mae govannen",

      "01010111 01100101 01101100 01100011 01101111 01101101 01100101"

    ];


    const welcomeColors = [
      "#fdb913",
      "#006a44",
      "#c1272d"
    ];


    let greetingIndex =
      0;


    let welcomeColorIndex =
      1;


    let greetingBusy =
      false;


    function fitWelcome() {

      welcomeWord.style.fontSize =
        "";


      const available =
        welcomeWord
          .parentElement
          .clientWidth;


      let size =
        parseFloat(
          getComputedStyle(
            welcomeWord
          ).fontSize
        );


      while (
        welcomeWord.scrollWidth >
        available &&
        size > 27
      ) {

        size -= 2;


        welcomeWord.style.fontSize =
          `${size}px`;

      }

    }


    function changeGreeting() {

      if (greetingBusy) {
        return;
      }


      greetingBusy =
        true;


      const nextGreeting =
        differentIndex(
          greetings.length,
          greetingIndex
        );


      const nextColor =
        differentIndex(
          welcomeColors.length,
          welcomeColorIndex
        );


      welcomeWord.classList.add(
        "is-fading"
      );


      window.setTimeout(() => {

        greetingIndex =
          nextGreeting;


        welcomeColorIndex =
          nextColor;


        welcomeWord.textContent =
          greetings[greetingIndex];


        welcomeWord.style.color =
          welcomeColors[
            welcomeColorIndex
          ];


        fitWelcome();


        welcomeWord.classList.remove(
          "is-fading"
        );


        window.setTimeout(() => {

          greetingBusy =
            false;

        }, 300);

      }, 250);

    }


    welcomeWord.style.color =
      welcomeColors[
        welcomeColorIndex
      ];


    fitWelcome();


    window.addEventListener(
      "resize",
      fitWelcome
    );


    window.setInterval(
      changeGreeting,
      2500

    /* =====================================================

       ===================================================== */

    const pageShell =
      document.getElementById(
        "page-shell"
      );


    const overlay =
      document.getElementById(
        "wip-overlay"
      );


    const audio =
      document.getElementById(
        "wip-audio"
      );


    const closeButton =

      );

      );

      );


    const horseKey =
      document.getElementById(
        "horse-key"

    /* =====================================================
       TEXTURE FILES
       ===================================================== */

    const ALL_TEXTURES = [

      "Texturelabs_Atmosphere_121S.jpg",

      "Texturelabs_Atmosphere_130S.jpg",

      "Texturelabs_Concrete_205S.jpg",
      "Texturelabs_Concrete_207S.jpg",

      "Texturelabs_Fabric_123S.jpg",
      "Texturelabs_Fabric_144S.jpg",

      "Texturelabs_Film_183S.jpg",

      "Texturelabs_Glass_134S.jpg",
      "Texturelabs_Glass_155S.jpg",

      "Texturelabs_Grunge_173S.jpg",
      "Texturelabs_Grunge_279L.jpg",

      "Texturelabs_Metal_294S.jpg",

      "Texturelabs_Paper_273S.jpg",
      "Texturelabs_Paper_278L.jpg",
      "Texturelabs_Paper_280S.jpg",
      "Texturelabs_Paper_286S.jpg",
      "Texturelabs_Paper_303S.jpg",
      "Texturelabs_Paper_324S.jpg",
      "Texturelabs_Paper_380L.jpg",
      "Texturelabs_Paper_380S.jpg",

      "Texturelabs_Sky_171S.jpg",

      "Texturelabs_Soil_146S.jpg",
      "Texturelabs_Soil_149S.jpg",

      "Texturelabs_Stone_167S.jpg",
      "Texturelabs_Stone_169S.jpg",

      "Texturelabs_Water_124S.jpg",
      "Texturelabs_Water_141S.jpg",

      "Texturelabs_Wood_135S.jpg",
      "Texturelabs_Wood_280S.jpg",
      "Texturelabs_Wood_290S.jpg"

    ].map(
      file =>
        `assets/home/${file}`
    );


    /* =====================================================
       TEXTURE PRELOADING
       ===================================================== */

    let sessionTextures =
      [];


    let readyTextures =
      [];


    let recentTextures =
      [];


    function markTextureReady(src) {

      if (
        !readyTextures.includes(
          src
        )
      ) {

        readyTextures.push(
          src
        );

      }

    }


    function prepareTextures() {

      /*
        Enough variety without asking the browser
        to decode every large image at once.
      */

      sessionTextures =
        shuffle(
          ALL_TEXTURES
        ).slice(
          0,
          28
        );


      readyTextures =
        [];


      sessionTextures.forEach(src => {

        const image =
          new Image();


        image.decoding =
          "async";


        image.onload =
          () => {

            markTextureReady(
              src
            );

          };


        image.src =
          src;


        /*
          Modern browsers can decode while
          we spend the first 30 seconds waiting
          for the collage to begin.
        */

        if (
          typeof image.decode ===
          "function"
        ) {

          image
            .decode()
            .then(() => {

              markTextureReady(
                src
              );

            })
            .catch(() => {});

        }

      });

    }


    function chooseTexture() {

      const pool =
        readyTextures.length >= 8
          ? readyTextures
          : sessionTextures;


      let selected;


      let tries =
        0;


      do {

        selected =
          pick(pool);


        tries++;

      }
      while (
        recentTextures.includes(
          selected
        ) &&
        tries < 16
      );


      recentTextures.push(
        selected
      );


      if (
        recentTextures.length > 9
      ) {

        recentTextures.shift();

      }


      return selected;

    }


    /* =====================================================
       COLOR PALETTES
       ===================================================== */

    const PALETTES = [

      [
        "#ff002b",
        "#ff8a00",
        "#ffe600"
      ],

      [
        "#ff005d",
        "#ff00ba",
        "#772cff"
      ],

      [
        "#00e5ff",
        "#0067ff",
        "#8a00ff"
      ],

      [
        "#00ff85",
        "#00b88a",
        "#d9ff00"
      ],

      [
        "#ff2400",
        "#ff8c00",
        "#ffdc00"
      ],

      [
        "#ff006e",
        "#3a0ca3",
        "#00b4d8"
      ],

      [
        "#d90429",
        "#ffb703",
        "#008f5a"
      ],

      [
        "#ff4d00",
        "#00d9ff",
        "#ff00b7"
      ],

        "#00ff66",
        "#ff0066",

      ],

        "#ff004c",
        "#ffb000",
        "#00ffd0"
      ],

        "#bb00ff",
        "#00f5ff"
      ],

      [
        "#00ff9d",

        "#ff006a"
      ]

    let paletteIndex =
      0;


    function nextPalette() {

      paletteIndex =
        differentIndex(
          PALETTES.length,
          paletteIndex
        );


      return PALETTES[
        paletteIndex
      ];

    }


    /* =====================================================
       BLEND MODES
       ===================================================== */

    const UNDER_BLEND = [

      "color-burn",
      "color-burn",
      "color-burn",

      "multiply",
      "multiply",

      "hard-light",
      "hard-light",

      "overlay",

      "screen"

    ];


    const OVER_BLEND = [

      "color-burn",
      "color-burn",
      "color-burn",

      "hard-light",
      "hard-light",

      "difference",
      "difference",

      "color-dodge",

      "exclusion",

      "overlay",

      "multiply"

    ];


    const INTERNAL_BLEND = [

      "color-burn",
      "color-burn",

      "hard-light",

      "multiply",

      "overlay"

    ];


    const HORSE_BLEND = [

      "multiply",
      "multiply",

      "color-burn",
      "color-burn",

      "hard-light",

      "difference",

      "screen",

      "overlay",

      "exclusion"

    ];


    /* =====================================================
       MORPH SLOT FACTORY
       ===================================================== */

    function makeSlot(
      id,
      options
    ) {

      const element =
        document.getElementById(
          id
        );


      const frames =
        Array.from(
          element.querySelectorAll(
            ".morph-frame"
          )
        );


      return {

        element,
        frames,

        active:
          0,

        isColor:
          options.isColor || false,

        isOver:
          options.isOver || false,

        slowFade:
          options.slowFade,

        fastFade:
          options.fastFade,

        phase:
          options.phase || 0,

        nextChange:
          Infinity,

        startTimer:
          null

      };

    }


    /*
      Different durations and phases make the
      composition feel organic rather than like
      six synchronized fades.
    */

    const slots = [

      makeSlot(
        "under-slot-1",
        {
          isOver: false,

          slowFade: 10.5,
          fastFade: 1.55,

          phase: 0.2
        }
      ),

      makeSlot(
        "under-slot-2",
        {
          isOver: false,

          slowFade: 12,
          fastFade: 1.8,

          phase: 1.7
        }
      ),

      makeSlot(
        "over-slot-1",
        {
          isOver: true,

          slowFade: 9,
          fastFade: 1.2,

          phase: 3.2
        }
      ),

      makeSlot(
        "over-slot-2",
        {
          isOver: true,

          slowFade: 11,
          fastFade: 1.45,

          phase: 5
        }
      ),

      makeSlot(
        "color-slot-under",
        {
          isColor: true,
          isOver: false,

          slowFade: 13,
          fastFade: 1.9,

          phase: 2.4
        }
      ),

      makeSlot(
        "color-slot-over",
        {
          isColor: true,
          isOver: true,

          slowFade: 10.5,
          fastFade: 1.45,

          phase: 6.2
        }
      )

    ];


    /* =====================================================
       TEXTURE DESIGN
       ===================================================== */

    function tintGradient(
      palette
    ) {

      return `
        linear-gradient(
          ${random(0, 360)}deg,
          ${palette[0]} 0%,
          ${palette[1]} 48%,
          ${palette[2]} 100%
        )
      `;

    }


    function configureTextureFrame(
      frame,
      intensity,
      isOver
    ) {

      const src =
        chooseTexture();


      const palette =
        nextPalette();


      frame.style.backgroundImage =
        `
          ${tintGradient(palette)},
          url("${src}")
        `;


      frame.style.backgroundSize =
        "cover, cover";


      frame.style.backgroundPosition =
        `
          center,
          ${random(10, 90)}%
          ${random(10, 90)}%
        `;


      frame.style.backgroundRepeat =
        "no-repeat, no-repeat";


      /*
        First burn color INTO the physical texture.
      */

      frame.style.backgroundBlendMode =
        `
          ${pick(INTERNAL_BLEND)},
          normal
        `;


      /*
        Then blend that combined plate into
        the full composition.
      */

      frame.style.mixBlendMode =
        pick(
          isOver
            ? OVER_BLEND
            : UNDER_BLEND
        );


      /*
        Random crop / zoom / rotation is chosen
        ONCE.

        It does not move after the image appears.
      */

      frame.style.transform =
        `
          translate(
            ${random(-3, 3)}%,
            ${random(-3, 3)}%
          )
          rotate(
            ${random(-3.5, 3.5)}deg
          )
          scale(
            ${random(1.07, 1.34)}
          )
        `;


      frame.style.filter =
        `
          contrast(
            ${random(1.08, 1.72)}
          )
          saturate(
            ${random(1.2, 2.3)}
          )
          brightness(
            ${random(0.74, 1.16)}
          )
        `;


      let opacity;


      if (isOver) {

        opacity =
          random(
            lerp(
              0.07,
              0.16,
              intensity
            ),
            lerp(
              0.22,
              0.47,
              intensity
            )
          );

      }

      else {

        opacity =
          random(
            lerp(
              0.26,
              0.38,
              intensity
            ),
            lerp(
              0.52,
              0.80,
              intensity
            )
          );

      }


      frame.dataset.targetOpacity =
        opacity.toFixed(3);

    }


    /* =====================================================
       COLOR FRAMES
       ===================================================== */

    function configureColorFrame(
      frame,
      intensity,
      isOver
    ) {

      const palette =
        nextPalette();


      const type =
        Math.floor(
          Math.random() * 4
        );


      if (type === 0) {

        frame.style.background =
          `
            linear-gradient(
              ${random(0, 360)}deg,
              ${palette[0]},
              ${palette[1]},
              ${palette[2]}
            )
          `;

      }

      else if (type === 1) {

        frame.style.background =
          `
            radial-gradient(
              circle at
              ${random(10, 90)}%
              ${random(10, 90)}%,
              ${palette[0]},
              transparent 54%
            ),

            radial-gradient(
              circle at
              ${random(10, 90)}%
              ${random(10, 90)}%,
              ${palette[1]},
              transparent 60%
            ),

            radial-gradient(
              circle at
              ${random(10, 90)}%
              ${random(10, 90)}%,
              ${palette[2]},
              transparent 62%
            )
          `;

      }

      else if (type === 2) {

        frame.style.background =
          `
            conic-gradient(
              from
              ${random(0, 360)}deg
              at
              ${random(30, 70)}%
              ${random(30, 70)}%,
              ${palette[0]},
              ${palette[1]},
              ${palette[2]},
              ${palette[0]}
            )
          `;

      }

      else {

        frame.style.background =
          `
            linear-gradient(
              ${random(0, 360)}deg,
              ${palette[0]} 0%,
              transparent 32%,
              ${palette[1]} 52%,
              transparent 72%,
              ${palette[2]} 100%
            )
          `;

      }


      frame.style.mixBlendMode =
        pick(
          isOver
            ? OVER_BLEND
            : UNDER_BLEND
        );


      frame.style.transform =
        `
          rotate(
            ${random(-3, 3)}deg
          )
          scale(
            ${random(1.02, 1.16)}
          )
        `;


      const opacity =
        isOver
          ? random(
              0.025,
              lerp(
                0.09,
                0.25,
                intensity
              )
            )
          : random(
              0.04,
              lerp(
                0.12,
                0.30,
                intensity
              )
            );


      frame.dataset.targetOpacity =
        opacity.toFixed(3);

    }


    /* =====================================================
       INITIALIZE A SLOT

       Initial contamination itself fades in.
       Different phases stagger the channels.
       ===================================================== */

    function initializeSlot(
      slot,
      intensity,
      time
    ) {

      slot.frames.forEach(
        frame => {

          if (
            frame._fadeTimer
          ) {

            clearTimeout(
              frame._fadeTimer
            );

            frame._fadeTimer =
              null;

          }


          frame.style.transitionDuration =
            "0s";


          frame.style.opacity =
            "0";

        }
      );


      const first =
        slot.frames[0];


      if (
        slot.isColor
      ) {

        configureColorFrame(
          first,
          intensity,
          slot.isOver
        );

      }

      else {

        configureTextureFrame(
          first,
          intensity,
          slot.isOver
        );

      }


      const fadeDuration =
        slot.slowFade;


      const initialDelay =
        slot.phase * 0.45;


      first.style.transitionDuration =
        `${fadeDuration}s`;


      slot.active =
        0;


      /*
        Stagger when each "projector" switches on.
      */

      slot.startTimer =
        window.setTimeout(
          () => {

            if (
              !overlayOpen ||
              normalState
            ) {

              return;

            }


            first.offsetHeight;


            requestAnimationFrame(() => {

              first.style.opacity =
                first.dataset.targetOpacity;

            });

          },
          initialDelay * 1000
        );


      /*
        Begin the NEXT dissolve before the
        initial one has even completely finished.
      */

      slot.nextChange =
        time +
        initialDelay +
        (
          fadeDuration *
          0.62
        );

    }


    /* =====================================================
       CONTINUOUS MORPH

       Three frames per channel allow:
       A -> B while C waits
       B -> C while A finishes dying
       C -> A while B finishes dying

       There is no "hold" state.
       ===================================================== */

    function morphSlot(
      slot,
      intensity,
      time
    ) {

      const outgoingIndex =
        slot.active;


      const incomingIndex =
        (
          slot.active + 1
        )
        %
        slot.frames.length;


      const outgoing =
        slot.frames[
          outgoingIndex
        ];


      const incoming =
        slot.frames[
          incomingIndex
        ];


      /*
        Clear any old fade timer belonging
        to a recycled frame.
      */

      if (
        incoming._fadeTimer
      ) {

        clearTimeout(
          incoming._fadeTimer
        );


        incoming._fadeTimer =
          null;

      }


      /*
        Long dissolves early.
        Rapid dissolves at the climax.
      */

      const fadeDuration =
        lerp(
          slot.slowFade,
          slot.fastFade,
          intensity
        );


      incoming.style.transitionDuration =
        `${fadeDuration}s`;


      outgoing.style.transitionDuration =
        `${fadeDuration}s`;


      /*
        Rebuild incoming plate while invisible.
      */

      incoming.style.opacity =
        "0";


      if (
        slot.isColor
      ) {

        configureColorFrame(
          incoming,
          intensity,
          slot.isOver
        );

      }

      else {

        configureTextureFrame(
          incoming,
          intensity,
          slot.isOver
        );

      }


      /*
        Make sure browser registers:
        NEW IMAGE + ZERO OPACITY
        before fade begins.
      */

      incoming.offsetHeight;


      requestAnimationFrame(() => {

        incoming.style.opacity =
          incoming.dataset.targetOpacity;

      });


      /*
        Don't immediately remove old layer.

        The new image accumulates over it first.
      */

      const fadeOutDelay =
        fadeDuration *
        random(
          0.28,
          0.42
        );


      if (
        outgoing._fadeTimer
      ) {

        clearTimeout(
          outgoing._fadeTimer
        );

      }


      outgoing._fadeTimer =
        window.setTimeout(
          () => {

            outgoing.style.opacity =
              "0";


            outgoing._fadeTimer =
              null;

          },
          fadeOutDelay * 1000
        );


      slot.active =
        incomingIndex;


      /*
        CRUCIAL:

        The next morph begins while this morph
        is still happening.

        Early:
        next begins around 60% through dissolve.

        Late:
        next begins around 50% through dissolve.
      */

      const overlapFactor =
        lerp(
          0.62,
          0.50,
          intensity
        );


      slot.nextChange =
        time +
        (
          fadeDuration *
          overlapFactor *
          random(
            0.92,
            1.08
          )
        );

    }


    /* =====================================================
       HORSE TREATMENT
       ===================================================== */

    let nextHorseChange =
      Infinity;


    function changeHorse(
      intensity,
      time
    ) {

      /*
        Smooth filters / opacity.

        Blend-mode itself changes immediately,
        giving occasional harder print shifts,
        while surrounding collage keeps dissolving.
      */

      const horseTransition =
        lerp(
          3.2,
          0.65,
          intensity
        );


      horseMain.style.transitionDuration =
        `${horseTransition}s`;


      horseOffset.style.transitionDuration =
        `${horseTransition}s`;


      horseKey.style.transitionDuration =
        `${horseTransition}s`;


      horseMain.style.mixBlendMode =
        pick(
          HORSE_BLEND
        );


      horseMain.style.filter =
        `
          hue-rotate(
            ${random(-180, 180)}deg
          )
          saturate(
            ${random(1.2, 3.0)}
          )
          contrast(
            ${random(1.05, 1.8)}
          )
          brightness(
            ${random(0.76, 1.18)}
          )
        `;


      horseMain.style.opacity =
        random(
          0.64,
          0.94
        );


      horseOffset.style.mixBlendMode =
        pick(
          [
            "hard-light",
            "difference",
            "screen",
            "color-burn",
            "multiply",
            "exclusion"
          ]
        );


      horseOffset.style.filter =
        `
          hue-rotate(
            ${random(-180, 180)}deg
          )
          saturate(
            ${random(1.5, 3.4)}
          )
          contrast(
            ${random(1.1, 1.8)}
          )
        `;


      horseOffset.style.opacity =
        random(
          0.04,
          lerp(
            0.13,
            0.32,
            intensity
          )
        );


      horseOffset.style.transform =
        `
          translate(
            ${random(-4, 4)}px,
            ${random(-4, 4)}px
          )
        `;


      horseKey.style.opacity =
        lerp(
          0.27,
          0.47,
          intensity
        ).toFixed(3);


      const interval =
        lerp(
          7,
          1.4,
          intensity
        );


      nextHorseChange =
        time +
        random(
          interval * 0.88,
          interval * 1.12
        );

    }


    function normalHorse() {

      horseMain.style.transitionDuration =
        "500ms";


      horseOffset.style.transitionDuration =
        "500ms";


      horseKey.style.transitionDuration =
        "500ms";


      horseMain.style.mixBlendMode =
        "normal";


      horseMain.style.filter =
        "none";


      horseMain.style.opacity =
        "1";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";

    }


    /* =====================================================
       TIMELINE
       ===================================================== */

    /*
      0:00–0:12
      Message only.

      0:12–0:20
      Horse fades in.

      0:20–0:30
      Clean horse alone.

      0:30–4:03
      Collage evolves continuously.

      4:03+
      Original clean GIF.
    */

    const HORSE_START =
      12;


    const HORSE_FULL =
      20;


    const COLLAGE_START =
      30;


    const NORMAL_TIME =
      243;


    function horseRevealAt(
      time
    ) {

      if (
        time <
        HORSE_START
      ) {

        return 0;

      }


      return smoothStep(
        (
          time -
          HORSE_START
        )
        /
        (
          HORSE_FULL -
          HORSE_START
        )
      );

    }


    function intensityAt(
      time
    ) {

      if (
        time <
        COLLAGE_START ||
        time >=
        NORMAL_TIME
      ) {

        return 0;

      }


      /*
        0:30–1:30
        Very gradual contamination.
      */

      if (
        time < 90
      ) {

        return lerp(
          0.08,
          0.28,
          (
            time -
            COLLAGE_START
          )
          /
          (
            90 -
            COLLAGE_START
          )
        );

      }


      /*
        1:30–2:55
        More layers / stronger interactions.
      */

      if (
        time < 175
      ) {

        return lerp(
          0.28,
          0.55,
          (
            time -
            90
          )
          /
          85
        );

      }


      /*
        2:55–3:40
        Tension increases.
      */

      if (
        time < 220
      ) {

        return lerp(
          0.55,
          0.80,
          (
            time -
            175
          )
          /
          45
        );

      }


      /*
        3:40–4:03
        Fastest / densest state.
      */

      return lerp(
        0.80,
        1,
        (
          time -
          220
        )
        /
        23
      );

    }


    /* =====================================================
       STATE
       ===================================================== */

    let overlayOpen =
      false;


    let collageStarted =
      false;


    let normalState =
      false;


    let raf =
      null;


    function clearSlotTimers() {

      slots.forEach(slot => {

        if (
          slot.startTimer
        ) {

          clearTimeout(
            slot.startTimer
          );


          slot.startTimer =
            null;

        }


        slot.frames.forEach(
          frame => {

            if (
              frame._fadeTimer
            ) {

              clearTimeout(
                frame._fadeTimer
              );


              frame._fadeTimer =
                null;

            }

          }
        );

      });

    }


    function clearSlots(
      instant = true
    ) {

      clearSlotTimers();


      slots.forEach(slot => {

        slot.nextChange =
          Infinity;


        slot.frames.forEach(
          frame => {

            frame.style.transitionDuration =
              instant
                ? "0s"
                : "450ms";


            frame.style.opacity =
              "0";

          }
        );

      });

    }


    function startCollage(
      time,
      intensity
    ) {

      if (
        collageStarted
      ) {

        return;

      }


      collageStarted =
        true;


      /*
        Until this point horse has been completely
        untouched.
      */

      normalHorse();


      /*
        Each visual channel begins independently,
        with slightly different starting times.
      */

      slots.forEach(
        slot => {

          initializeSlot(
            slot,
            intensity,
            time
          );

        }
      );


      /*
        Give the texture world a little time before
        contaminating the horse itself.
      */

      nextHorseChange =
        time + 5;

    }


    function enterNormalState() {

      if (
        normalState
      ) {

        return;

      }


      normalState =
        true;


      clearSlots(
        false
      );


      normalHorse();


      stage.classList.add(
        "is-normal"
      );

    }


    /* =====================================================
       MAIN VISUAL LOOP
       ===================================================== */

    function visualLoop() {

      if (
        !overlayOpen
      ) {

        return;

      }


      const time =
        audio.currentTime || 0;


      /*
        Only the artwork square appears gradually.

        The surrounding WIP page is already there.
      */

      const horseReveal =
        horseRevealAt(
          time
        );


      stage.style.setProperty(
        "--visual-reveal",
        horseReveal.toFixed(4)
      );


      /*
        0–12 seconds:
        message only.
      */

      if (
        time <
        HORSE_START
      ) {

        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      /*
        12–30 seconds:
        clean horse only.

        This allows the viewer to understand
        the source image before we contaminate it.
      */

      if (
        time <
        COLLAGE_START
      ) {

        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      /*
        At 4:03 return to completely normal GIF.
      */

      if (
        time >=
        NORMAL_TIME
      ) {

        enterNormalState();


        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      const intensity =
        intensityAt(
          time
        );


      if (
        !collageStarted
      ) {

        startCollage(
          time,
          intensity
        );

      }


      /*
        Six independent continuously-morphing
        "projectors".

        No global cut / no global pause.
      */

      slots.forEach(slot => {

        if (
          time >=
          slot.nextChange
        ) {

          morphSlot(
            slot,
            intensity,
            time
          );

        }

      });


      /*
        Horse is its own print plate and changes
        on a separate rhythm.
      */

      if (
        time >=
        nextHorseChange
      ) {

        changeHorse(
          intensity,
          time
        );

      }


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       OPEN WIP
       ===================================================== */

    async function openWip() {

      if (
        overlayOpen
      ) {

        return;

      }


      overlayOpen =
        true;


      collageStarted =
        false;


      normalState =
        false;


      recentTextures =
        [];


      paletteIndex =
        Math.floor(
          Math.random() *
          PALETTES.length
        );


      nextHorseChange =
        Infinity;


      /*
        Reset visual channels.
      */

      clearSlots(
        true
      );


      normalHorse();


      stage.classList.remove(
        "is-normal"
      );


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      /*
        Begin decoding texture pool immediately.

        Collage does not begin for 30 seconds,
        giving the browser plenty of time.
      */

      prepareTextures();


      /*
        Homepage disappears immediately.

        No expensive full-page opacity fade.
      */

      pageShell.classList.add(
        "is-hidden"
      );


      /*
        Cream WIP screen + note appear immediately.
      */

      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      /*
        Start soundtrack.
      */

      audio.pause();


      audio.currentTime =
        0;


      audio.volume =
        0.72;


      try {

        await audio.play();

      }

      catch (error) {

        console.log(
          "Audio could not start:",
          error
        );

      }


      cancelAnimationFrame(
        raf
      );


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       CLOSE WIP
       ===================================================== */

    function closeWip() {

      overlayOpen =
        false;


      cancelAnimationFrame(
        raf
      );


      clearSlots(
        true
      );


      audio.pause();


      audio.currentTime =
        0;


      normalHorse();


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      /*
        Restore homepage after short overlay close.
      */

      window.setTimeout(() => {

        pageShell.classList.remove(
          "is-hidden"
        );

      }, 160);

    }


    /* =====================================================
       LINKS
       ===================================================== */

    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );


        if (!link) {
          return;
        }


        /*
          Later, finished pages can bypass
          the WIP experience with:

          data-live-link
        */

        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
          &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>

</body>

</html>
