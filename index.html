<!DOCTYPE html>
<html lang="en">
<head>

  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="page-shell">

    <!-- =====================================================

        />
      </a>

      <a
        href="illustration.html"
        class="scarf-rack__item"
        aria-label="Illustration"
        title="Illustration"
      >
        <img
          src="assets/home/scarf-illustration.png"
          alt="Illustration"
        />
      </a>

      <a
        href="photo.html"
        class="scarf-rack__item"
        aria-label="Photography"
        title="Photography"
      >
        <img
          src="assets/home/scarf-photography.png"
          alt="Photography"
        />
      </a>

      <a
        href="design.html"
        class="scarf-rack__item"
        aria-label="Design"
        title="Design"
      >
        <img
          src="assets/home/scarf-design.png"
          alt="Design"
        />
      </a>

      <a
        href="music.html"
        class="scarf-rack__item"
        aria-label="Music"
        title="Music"
      >
        <img
          src="assets/home/scarf-music.png"
          alt="Music"
        />
      </a>

      <a
        href="motion.html"
        class="scarf-rack__item"
        aria-label="Motion"
        title="Motion"
      >
        <img
          src="assets/home/scarf-motion.png"
          alt="Motion"
        />
      </a>

      <a
        href="misc.html"
        class="scarf-rack__item"
        aria-label="Misc"
        title="Misc"
      >
        <img
          src="assets/home/scarf-misc.png"
          alt="Misc"
        />
      </a>

    </nav>


    <!-- =====================================================
         HERO
         ===================================================== -->

    <main class="hero">

      <div class="hero-inner">

        <!-- slot-machine welcome -->

        <div
          class="welcome-slot"
          aria-live="polite"
          aria-atomic="true"
        >
          <div
            class="welcome-track"
            id="welcome-track"
          >
            <span
              class="welcome-word welcome-word--current"
              id="welcome-current"
              dir="auto"
            >
              Welcome
            </span>

            <span
              class="welcome-word welcome-word--next"
              id="welcome-next"
              dir="auto"
            >
              Welcome
            </span>
          </div>
        </div>


        <!-- static second line -->

        <h1 class="main-title">

          <span class="main-title__to">
            to
          </span>

          <span class="main-title__brand">
            <span class="brand-keegan">keegan</span><span class="brand-dot">.</span><span class="brand-biz">biz</span>
          </span>

        </h1>

      </div>

    </main>


    <!-- =====================================================
         BEHANCE
         ===================================================== -->

    <footer class="site-footer">

      <a
        class="behance-link"
        href="https://www.behance.net/keeganandrulis"
        target="_blank"
        rel="noopener noreferrer"
      >
        behance ↗
      </a>

    </footer>


    <!-- =====================================================
         INVISIBLE YOUTUBE PLAYER
         ===================================================== -->

    <div
      id="youtube-player"
      class="background-player"
      aria-hidden="true"
    ></div>

  </div>


  <!-- =======================================================
       YOUTUBE IFRAME API
       ======================================================= -->

  <script src="https://www.youtube.com/iframe_api"></script>


  <script>
    /* =======================================================
       WELCOME LANGUAGES
       ======================================================= */

    const welcomes = [

      { text: "Welcome" },

      { text: "Ласкаво просимо" },

      { text: "Benvenuti" },

      { text: "Fáilte" },

      { text: "Bienvenidos" },

      { text: "欢迎" },

      { text: "Benvinguts" },

      {
        text: "WELCOME",
        className: "is-wingdings"
      },

      { text: "Sveiki atvykę" },

      { text: "Yá’át’ééh" },

      { text: "Velkomin" },

      { text: "Willkommen" },

      { text: "ようこそ" },

      { text: "Bienvenue" },

      { text: "Bem-vindos" },

      { text: "أهلاً وسهلاً" },

      { text: "Mae govannen" },

      { text: "Croeso" },

      {
        text:
          "01010111 01100101 01101100 01100011 01101111 01101101 01100101",
        className: "is-binary"
      },

      { text: "Karibu" },

      { text: "Siyakwamukela" },

      { text: "Ẹ káàbọ̀" },

      { text: "እንኳን ደህና መጡ" },

      { text: "स्वागत है" },

      { text: "خوش آمدید" }

    ];


    /* Lithuanian flag colors */

    const welcomeColors = [
      "#FDB913",
      "#006A44",
      "#C1272D"
    ];


    const welcomeTrack =
      document.getElementById("welcome-track");

    const welcomeCurrent =
      document.getElementById("welcome-current");

    const welcomeNext =
      document.getElementById("welcome-next");


    let currentWelcome = 0;

    let currentColor = -1;

    let rolling = false;


    function getDifferentIndex(length, previous) {

      let next;

      do {
        next = Math.floor(Math.random() * length);
      }
      while (
        length > 1 &&
        next === previous
      );

      return next;
    }


    function applyEntry(element, entry) {

      element.classList.remove(
        "is-wingdings",
        "is-binary"
      );

      element.textContent = entry.text;

      if (entry.className) {
        element.classList.add(entry.className);
      }
    }


    function rollWelcome() {

      if (rolling) {
        return;
      }


      rolling = true;


      const nextWelcome =
        getDifferentIndex(
          welcomes.length,
          currentWelcome
        );


      const nextColor =
        getDifferentIndex(
          welcomeColors.length,
          currentColor
        );


      applyEntry(
        welcomeNext,
        welcomes[nextWelcome]
      );


      welcomeNext.style.color =
        welcomeColors[nextColor];


      welcomeTrack.classList.add(
        "is-rolling"
      );


      setTimeout(() => {

        applyEntry(
          welcomeCurrent,
          welcomes[nextWelcome]
        );


        welcomeCurrent.style.color =
          welcomeColors[nextColor];


        welcomeTrack.classList.add(
          "no-transition"
        );


        welcomeTrack.classList.remove(
          "is-rolling"
        );


        void welcomeTrack.offsetHeight;


        welcomeTrack.classList.remove(
          "no-transition"
        );


        currentWelcome = nextWelcome;

        currentColor = nextColor;

        rolling = false;

      }, 560);

    }


    /* initial color */

    welcomeCurrent.style.color =
      welcomeColors[0];


    currentColor = 0;


    setInterval(
      rollWelcome,
      2600
    );


    /* =======================================================
       BACKGROUND YOUTUBE AUDIO
       ======================================================= */

    let youtubePlayer;

    let youtubeReady = false;

    let audioStarted = false;


    function onYouTubeIframeAPIReady() {

      youtubePlayer = new YT.Player(
        "youtube-player",
        {

          width: "200",

          height: "200",

          videoId: "Hqxdn-MbpE0",

          playerVars: {

            autoplay: 1,

            controls: 0,

            disablekb: 1,

            fs: 0,

            playsinline: 1,

            rel: 0,

            loop: 1,

            playlist: "Hqxdn-MbpE0"

          },

          events: {

            onReady: function(event) {

              youtubeReady = true;

              event.target.setVolume(35);

              tryStartAudio();

            }

          }

        }
      );

    }


    function tryStartAudio() {

      if (
        !youtubeReady ||
        !youtubePlayer
      ) {
        return;
      }


      try {

        youtubePlayer.unMute();

        youtubePlayer.setVolume(35);

        youtubePlayer.playVideo();

        audioStarted = true;

      }
      catch (error) {

        audioStarted = false;

      }

    }


    /*
      Browsers may block audible autoplay.

      If that happens, the visitor's first interaction
      starts the soundtrack.
    */

    function unlockAudio() {

      if (!audioStarted) {
        tryStartAudio();
      }


      document.removeEventListener(
        "pointerdown",
        unlockAudio
      );


      document.removeEventListener(
        "keydown",
        unlockAudio
      );

    }


    document.addEventListener(
      "pointerdown",
      unlockAudio,
      { once: true }
    );


    document.addEventListener(
      "keydown",
      unlockAudio,
      { once: true }
    );

  </script>

</body>
</html>
