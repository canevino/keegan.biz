<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>keegan.biz</title>
  <link rel="stylesheet" href="style.css">

  <style>
  .home-chess {
    width: min(100%, 660px);
    margin-top: clamp(42px, 6vw, 72px);
  }

  .home-chess .chess-topbar,
  .home-chess .chess-bottombar,
  .home-chess .chess-clock-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  .home-chess .chess-topbar {
    margin-bottom: 10px;
  }

  .home-chess .chess-clock-row {
    margin-bottom: 10px;
  }

  .home-chess .chess-bottombar {
    margin-top: 12px;
    align-items: flex-end;
  }

  .home-chess .status,
  .home-chess .clock,
  .home-chess .time-label {
    margin: 0;
    font-size: 14px;
    line-height: 1;
    font-weight: 700;
    color: #c1272d;
  }

  .home-chess .clock-group,
  .home-chess .time-setter {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .home-chess .clock {
    min-width: 92px;
  }

  .home-chess .clock.is-active {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .home-chess input {
    width: 62px;
    padding: 3px 5px;
    border: 1px solid #c1272d;
    border-radius: 0;
    background: transparent;
    color: #11110f;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    outline: none;
  }

  .home-chess input:focus {
    outline: 1px solid #c1272d;
    outline-offset: 1px;
  }

  .home-chess button {
    appearance: none;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: #c1272d;
    cursor: pointer;
  }

  .home-chess button:hover {
    text-decoration: underline;
  }

  .home-chess .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 100%;
    aspect-ratio: 1;
    border-top: 2px solid #c1272d;
    border-left: 2px solid #c1272d;
    background: #ece7d7;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .home-chess .square {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    border-right: 2px solid #c1272d;
    border-bottom: 2px solid #c1272d;
  }

  .home-chess .square.light {
    background: #ece7d7;
  }

  .home-chess .square.dark {
    background: #e5dfbd;
  }

  .home-chess .square.legal::after {
    content: "";
    position: absolute;
    width: 14%;
    aspect-ratio: 1;
    border: 2px solid #c1272d;
    border-radius: 50%;
    pointer-events: none;
  }

  .home-chess .piece {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-size: clamp(24px, 5vw, 66px);
    line-height: 1;
    font-weight: 700;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transform:
      translate(var(--rest-x, 0px), var(--rest-y, 0px))
      rotate(var(--rest-r, 0deg));
    transform-origin: center;
  }

  .home-chess .piece.white {
    color: #fdb913;
  }

  .home-chess .piece.black {
    color: #006a44;
  }

  .piece.dragging {
    position: fixed;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--drag-size);
    height: var(--drag-size);
    line-height: 1;
    font-weight: 700;
    pointer-events: none;
    cursor: grabbing;
    transform:
      translate(-50%, -50%)
      translateY(-6px)
      rotate(var(--drag-rotation, 0deg))
      scale(1.09);
    filter:
      drop-shadow(
        7px
        7px
        0
        rgba(193, 39, 45, .62)
      );
  }

  .home-chess .piece-source-hidden {
    visibility: hidden;
  }

  .home-chess .piece.just-dropped {
    animation:
      piece-drop
      210ms
      cubic-bezier(.18, .82, .23, 1);
  }

  @keyframes piece-drop {
    0% {
      transform:
        translate(
          calc(var(--rest-x, 0px) - 2px),
          calc(var(--rest-y, 0px) - 10px)
        )
        rotate(calc(var(--rest-r, 0deg) + 1.8deg))
        scale(1.10);
    }

    68% {
      transform:
        translate(
          calc(var(--rest-x, 0px) + .8px),
          calc(var(--rest-y, 0px) + 1.2px)
        )
        rotate(calc(var(--rest-r, 0deg) - .35deg))
        scale(.988);
    }

    100% {
      transform:
        translate(var(--rest-x, 0px), var(--rest-y, 0px))
        rotate(var(--rest-r, 0deg))
        scale(1);
    }
  }

  .home-chess .coordinate {
    position: absolute;
    pointer-events: none;
    color: #c1272d;
    font-size: 10px;
    line-height: 1;
    font-weight: 700;
  }

  .home-chess .coordinate.file {
    right: 4px;
    bottom: 3px;
  }

  .home-chess .coordinate.rank {
    top: 4px;
    left: 4px;
  }


  .home-chess .board-area {
    position: relative;
    width: 100%;
  }

  .home-chess .capture-pile {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 68px;
    pointer-events: none;
    overflow: visible;
  }

  .home-chess .capture-pile-yellow {
    right: calc(100% + 14px);
  }

  .home-chess .capture-pile-green {
    left: calc(100% + 14px);
  }

  .home-chess .captured-piece {
    position: absolute;
    left: 50%;
    bottom: var(--pile-y, 0px);
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    line-height: 1;
    font-weight: 700;
    transform:
      translateX(calc(-50% + var(--pile-x, 0px)))
      rotate(var(--pile-r, 0deg));
    transform-origin: center;
    opacity: .98;
  }

  .home-chess .captured-piece.white {
    color: #fdb913;
  }

  .home-chess .captured-piece.black {
    color: #006a44;
  }

  .home-chess .captured-piece.is-falling {
    animation:
      captured-fall
      var(--fall-time, 620ms)
      cubic-bezier(.20, .72, .24, 1);
  }

  @keyframes captured-fall {
    0% {
      transform:
        translateX(calc(-50% + var(--pile-x, 0px)))
        translateY(calc(-1 * var(--fall-distance, 260px)))
        rotate(calc(var(--pile-r, 0deg) - 8deg))
        scale(1.05);
    }

    72% {
      transform:
        translateX(calc(-50% + var(--pile-x, 0px)))
        translateY(5px)
        rotate(calc(var(--pile-r, 0deg) + 1.5deg))
        scale(.98);
    }

    88% {
      transform:
        translateX(calc(-50% + var(--pile-x, 0px)))
        translateY(-2px)
        rotate(calc(var(--pile-r, 0deg) - .6deg))
        scale(1.01);
    }

    100% {
      transform:
        translateX(calc(-50% + var(--pile-x, 0px)))
        translateY(0)
        rotate(var(--pile-r, 0deg))
        scale(1);
    }
  }

  @media (min-width: 701px) and (max-width: 1100px) {
    .home-chess {
      width: min(100%, 500px);
    }
  }

  @media (max-width: 700px) {
    .home-chess {
      width: 100%;
      margin-top: 38px;
    }

    .home-chess .piece {
      font-size: 9vw;
    }

    .home-chess .chess-bottombar {
      align-items: flex-start;
    }

    .home-chess .clock-group,
    .home-chess .time-setter {
      width: 100%;
      justify-content: space-between;
    }

    .home-chess .board-area {
      padding-bottom: 92px;
    }

    .home-chess .capture-pile {
      top: auto;
      bottom: 0;
      width: calc(50% - 6px);
      height: 78px;
    }

    .home-chess .capture-pile-yellow {
      left: 0;
      right: auto;
    }

    .home-chess .capture-pile-green {
      right: 0;
      left: auto;
    }

    .home-chess .captured-piece {
      bottom: 4px;
      left: 50%;
      width: 38px;
      height: 38px;
      font-size: 34px;
    }
  }
  </style>
</head>

  <script>
  (() => {
    const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

    function smoothStep(value) {
      const t = clamp(value, 0, 1);
      return t * t * (3 - (2 * t));
    }

    const welcomeWord = document.getElementById("welcome-word");
    if (welcomeWord) {
      welcomeWord.textContent = "Welcome";
      welcomeWord.style.color = "#006a44";
    }

    const pageShell = document.getElementById("page-shell");
    const overlay = document.getElementById("wip-overlay");
    const audio = document.getElementById("wip-audio");
    const closeButton = document.getElementById("wip-close");
    const stage = document.getElementById("collage-stage");

    const HORSE_START = 12;
    const HORSE_FULL = 20;

    let overlayOpen = false;
    let raf = null;
    let openedAt = 0;

    function horseRevealAt(time) {
      if (time < HORSE_START) return 0;
      return smoothStep((time - HORSE_START) / (HORSE_FULL - HORSE_START));
    }

    function visualLoop(now) {
      if (!overlayOpen) return;
      const elapsed = Math.max(0, (now - openedAt) / 1000);
      const time = audio.currentTime > 0 ? audio.currentTime : elapsed;
      stage.style.setProperty("--visual-reveal", horseRevealAt(time).toFixed(4));
      raf = requestAnimationFrame(visualLoop);
    }

    async function openWip() {
      if (overlayOpen) return;
      overlayOpen = true;
      openedAt = performance.now();
      stage.style.setProperty("--visual-reveal", "0");
      pageShell.classList.add("is-hidden");
      overlay.classList.add("is-visible");
      overlay.setAttribute("aria-hidden", "false");
      audio.pause();
      audio.currentTime = 0;
      audio.volume = 0.72;
      try { await audio.play(); } catch (error) { console.log("Audio could not start:", error); }
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(visualLoop);
    }

    function closeWip() {
      overlayOpen = false;
      cancelAnimationFrame(raf);
      audio.pause();
      audio.currentTime = 0;
      stage.style.setProperty("--visual-reveal", "0");
      overlay.classList.remove("is-visible");
      overlay.setAttribute("aria-hidden", "true");
      window.setTimeout(() => pageShell.classList.remove("is-hidden"), 160);
    }

    document.addEventListener("click", event => {
      const link = event.target.closest("a");
      if (!link) return;
      if (link.hasAttribute("data-live-link")) return;
      event.preventDefault();
      openWip();
    });

    closeButton.addEventListener("click", closeWip);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && overlayOpen) closeWip();
    });
  })();
  </script>

  <script type="module">

    import {
      Chess
    } from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";


    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");

    const flipButton = document.getElementById("flip-button");
    const resetButton = document.getElementById("reset-button");

    const whiteClockElement = document.getElementById("white-clock");
    const blackClockElement = document.getElementById("black-clock");
    const timeInput = document.getElementById("time-input");
    const setTimeButton = document.getElementById("set-time-button");

    const yellowCapturePile =
      document.getElementById("capture-pile-yellow");

    const greenCapturePile =
      document.getElementById("capture-pile-green");


    const game = new Chess();


    let orientation = "white";
    let drag = null;

    let startingMinutes = 60;
    let whiteTime = startingMinutes * 60 * 1000;
    let blackTime = startingMinutes * 60 * 1000;
    let timerStarted = false;
    let timerFinished = false;
    let activeClock = "w";
    let lastTick = performance.now();

    const capturedPieces = {
      w: [],
      b: []
    };

    let lastCaptureToken = 0;

    const pieceRestingPositions =
      new Map();


    const pieceLetters = {
      k: "K",
      q: "Q",
      r: "R",
      b: "B",
      n: "N",
      p: "P"
    };


    function getFiles() {
      return orientation === "white"
        ? ["a", "b", "c", "d", "e", "f", "g", "h"]
        : ["h", "g", "f", "e", "d", "c", "b", "a"];
    }


    function getRanks() {
      return orientation === "white"
        ? [8, 7, 6, 5, 4, 3, 2, 1]
        : [1, 2, 3, 4, 5, 6, 7, 8];
    }


    function hashString(value) {
      let hash = 2166136261;

      for (let i = 0; i < value.length; i++) {
        hash ^= value.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }

      return hash >>> 0;
    }


    function initialPlacementFor(squareName, piece) {
      const seed = hashString(
        `${squareName}-${piece.color}-${piece.type}`
      );

      const x =
        ((seed & 255) / 255 - .5) * 4.5;

      const y =
        (((seed >>> 8) & 255) / 255 - .5) * 4.5;

      const r =
        (((seed >>> 16) & 255) / 255 - .5) * 2.8;

      return {
        x,
        y,
        r
      };
    }


    function restingPlacementFor(squareName, piece) {
      if (
        pieceRestingPositions.has(
          squareName
        )
      ) {

        return pieceRestingPositions.get(
          squareName
        );

      }

      return initialPlacementFor(
        squareName,
        piece
      );
    }


    function dropPlacementFor(
      squareName,
      clientX,
      clientY
    ) {

      const squareElement =
        boardElement.querySelector(
          `[data-square="${squareName}"]`
        );


      if (!squareElement) {

        return {
          x: 0,
          y: 0,
          r: 0
        };

      }


      const rect =
        squareElement.getBoundingClientRect();


      const localX =
        clamp(
          clientX -
          rect.left,
          0,
          rect.width
        );


      const localY =
        clamp(
          clientY -
          rect.top,
          0,
          rect.height
        );


      /*
        Translate the piece toward the exact place
        where the user releases it.

        The range deliberately reaches beyond the
        square center enough for letters to sit on
        or slightly over the grid lines.
      */

      const x =
        (
          localX /
          rect.width -
          .5
        )
        *
        rect.width *
        .72;


      const y =
        (
          localY /
          rect.height -
          .5
        )
        *
        rect.height *
        .72;


      /*
        Rotation comes from the landing position,
        so the same release point produces a similar
        physical lean rather than a random wobble.
      */

      const r =
        clamp(
          (
            x /
            Math.max(
              rect.width,
              1
            )
          )
          *
          8
          +
          (
            y /
            Math.max(
              rect.height,
              1
            )
          )
          *
          -3,
          -5,
          5
        );


      return {
        x,
        y,
        r
      };
    }


    function renderBoard() {
      boardElement.innerHTML = "";

      const files = getFiles();
      const ranks = getRanks();


      for (let row = 0; row < 8; row++) {
        for (let column = 0; column < 8; column++) {

          const file = files[column];
          const rank = ranks[row];
          const squareName = `${file}${rank}`;

          const square = document.createElement("div");

          const fileIndex = file.charCodeAt(0) - 97;
          const isDark = (fileIndex + rank) % 2 === 0;

          square.className =
            `square ${isDark ? "dark" : "light"}`;

          square.dataset.square = squareName;


          const piece = game.get(squareName);


          if (piece) {
            const pieceElement = document.createElement("div");

            pieceElement.className =
              `piece ${piece.color === "w" ? "white" : "black"}`;

            pieceElement.textContent = pieceLetters[piece.type];
            pieceElement.dataset.square = squareName;

            const rest =
              restingPlacementFor(
                squareName,
                piece
              );

            pieceElement.style.setProperty(
              "--rest-x",
              `${rest.x}px`
            );

            pieceElement.style.setProperty(
              "--rest-y",
              `${rest.y}px`
            );

            pieceElement.style.setProperty(
              "--rest-r",
              `${rest.r}deg`
            );

            pieceElement.addEventListener(
              "pointerdown",
              startDrag
            );

            square.appendChild(pieceElement);
          }


          if (column === 0) {
            const rankCoordinate =
              document.createElement("span");

            rankCoordinate.className =
              "coordinate rank";

            rankCoordinate.textContent = rank;

            square.appendChild(rankCoordinate);
          }


          if (row === 7) {
            const fileCoordinate =
              document.createElement("span");

            fileCoordinate.className =
              "coordinate file";

            fileCoordinate.textContent = file;

            square.appendChild(fileCoordinate);
          }


          boardElement.appendChild(square);
        }
      }


      updateStatus();
      updateClocks();
    }


    function startDrag(event) {
      if (drag || timerFinished) {
        return;
      }


      const pieceElement = event.currentTarget;
      const fromSquare = pieceElement.dataset.square;
      const piece = game.get(fromSquare);


      if (!piece || piece.color !== game.turn()) {
        return;
      }


      event.preventDefault();


      const squareElement = pieceElement.closest(".square");
      const squareRect = squareElement.getBoundingClientRect();

      const clone = pieceElement.cloneNode(true);

      clone.classList.add("dragging");
      clone.classList.remove("just-dropped");


      const pieceStyle =
        window.getComputedStyle(pieceElement);

      clone.style.fontSize = pieceStyle.fontSize;
      clone.style.fontFamily = pieceStyle.fontFamily;
      clone.style.fontWeight = pieceStyle.fontWeight;
      clone.style.color = pieceStyle.color;

      clone.style.setProperty(
        "--drag-rotation",
        `${Math.random() < .5 ? -.8 : .8}deg`
      );

      clone.style.setProperty(
        "--drag-size",
        `${squareRect.width}px`
      );

      document.body.appendChild(clone);


      pieceElement.classList.add(
        "piece-source-hidden"
      );


      drag = {
        from: fromSquare,
        original: pieceElement,
        floating: clone
      };


      showLegalMoves(fromSquare);

      moveFloatingPiece(
        event.clientX,
        event.clientY
      );


      window.addEventListener(
        "pointermove",
        dragMove,
        {
          passive: false
        }
      );

      window.addEventListener(
        "pointerup",
        endDrag,
        {
          passive: false
        }
      );

      window.addEventListener(
        "pointercancel",
        cancelDrag,
        {
          passive: false
        }
      );
    }


    function dragMove(event) {
      if (!drag) {
        return;
      }

      event.preventDefault();

      moveFloatingPiece(
        event.clientX,
        event.clientY
      );
    }


    function moveFloatingPiece(x, y) {
      if (!drag) {
        return;
      }

      drag.floating.style.left = `${x}px`;
      drag.floating.style.top = `${y}px`;
    }


    function endDrag(event) {
      if (!drag) {
        return;
      }

      event.preventDefault();

      const destination =
        getSquareAtPoint(
          event.clientX,
          event.clientY
        );

      if (destination) {
        attemptMove(
          drag.from,
          destination,
          event.clientX,
          event.clientY
        );
      }

      finishDrag();
    }


    function cancelDrag() {
      if (!drag) {
        return;
      }

      finishDrag();
    }


    function finishDrag() {
      clearLegalMoves();

      if (drag?.floating) {
        drag.floating.remove();
      }

      if (drag?.original) {
        drag.original.classList.remove(
          "piece-source-hidden"
        );
      }

      drag = null;

      window.removeEventListener(
        "pointermove",
        dragMove
      );

      window.removeEventListener(
        "pointerup",
        endDrag
      );

      window.removeEventListener(
        "pointercancel",
        cancelDrag
      );
    }


    function getSquareAtPoint(x, y) {

      const rect =
        boardElement.getBoundingClientRect();


      if (
        x < rect.left ||
        x > rect.right ||
        y < rect.top ||
        y > rect.bottom
      ) {
        return null;
      }


      const column =
        Math.min(
          7,
          Math.max(
            0,
            Math.floor(
              (
                x -
                rect.left
              )
              /
              (
                rect.width /
                8
              )
            )
          )
        );


      const row =
        Math.min(
          7,
          Math.max(
            0,
            Math.floor(
              (
                y -
                rect.top
              )
              /
              (
                rect.height /
                8
              )
            )
          )
        );


      const files =
        getFiles();


      const ranks =
        getRanks();


      return `${files[column]}${ranks[row]}`;
    }


    function attemptMove(
      from,
      to,
      clientX,
      clientY
    ) {

      let move = null;


      const movingPiece =
        game.get(from);


      const landing =
        dropPlacementFor(
          to,
          clientX,
          clientY
        );

      try {
        move = game.move({
          from,
          to,
          promotion: "q"
        });
      }

      catch (error) {
        move = null;
      }


      if (!move) {
        return false;
      }


      pieceRestingPositions.delete(
        from
      );


      if (movingPiece) {

        pieceRestingPositions.set(
          to,
          landing
        );

      }


      let captureToken =
        null;


      if (move.captured) {

        captureToken =
          ++lastCaptureToken;


        const capturedColor =
          move.color === "w"
            ? "b"
            : "w";


        capturedPieces[capturedColor].push({
          type: move.captured,
          token: captureToken
        });

      }


      if (!timerStarted) {
        timerStarted = true;
      }

      activeClock = game.turn();
      lastTick = performance.now();


      renderBoard();
      renderCapturedPieces(
        captureToken
      );


      const droppedPiece =
        boardElement.querySelector(
          `[data-square="${to}"] .piece`
        );


      if (droppedPiece) {
        droppedPiece.classList.add(
          "just-dropped"
        );

        window.setTimeout(
          () => {
            droppedPiece.classList.remove(
              "just-dropped"
            );
          },
          240
        );
      }


      return true;
    }


    function showLegalMoves(square) {
      clearLegalMoves();

      const moves =
        game.moves({
          square,
          verbose: true
        });

      moves.forEach(move => {
        const squareElement =
          boardElement.querySelector(
            `[data-square="${move.to}"]`
          );

        if (squareElement) {
          squareElement.classList.add(
            "legal"
          );
        }
      });
    }


    function clearLegalMoves() {
      boardElement
        .querySelectorAll(".square.legal")
        .forEach(square => {
          square.classList.remove("legal");
        });
    }


    function colorName(color) {
      return color === "w"
        ? "yellow"
        : "green";
    }


    function updateStatus() {
      let status;


      if (timerFinished) {
        return;
      }


      if (game.isCheckmate()) {
        const winner =
          game.turn() === "w"
            ? "green"
            : "yellow";

        status = `${winner} wins — checkmate`;
      }

      else if (game.isStalemate()) {
        status = "draw — stalemate";
      }

      else if (game.isThreefoldRepetition()) {
        status = "draw — repetition";
      }

      else if (game.isInsufficientMaterial()) {
        status = "draw — insufficient material";
      }

      else if (game.isDrawByFiftyMoves()) {
        status = "draw — fifty-move rule";
      }

      else if (game.isDraw()) {
        status = "draw";
      }

      else {
        status = `${colorName(game.turn())} to move`;

        if (game.inCheck()) {
          status += " — check";
        }
      }


      statusElement.textContent = status;
    }


    function formatTime(milliseconds) {
      const safe = Math.max(0, milliseconds);
      const totalSeconds = Math.ceil(safe / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }


    function updateClocks() {
      whiteClockElement.textContent =
        `yellow ${formatTime(whiteTime)}`;

      blackClockElement.textContent =
        `green ${formatTime(blackTime)}`;

      whiteClockElement.classList.toggle(
        "is-active",
        timerStarted && !timerFinished && activeClock === "w"
      );

      blackClockElement.classList.toggle(
        "is-active",
        timerStarted && !timerFinished && activeClock === "b"
      );
    }


    function stopOnTime(loser) {
      timerFinished = true;
      timerStarted = false;

      const winner =
        loser === "w"
          ? "green"
          : "yellow";

      statusElement.textContent =
        `${winner} wins — time`;

      updateClocks();
    }


    function tickClock() {
      const now = performance.now();

      if (
        timerStarted &&
        !timerFinished &&
        !game.isGameOver()
      ) {
        const elapsed = now - lastTick;

        if (activeClock === "w") {
          whiteTime -= elapsed;

          if (whiteTime <= 0) {
            whiteTime = 0;
            stopOnTime("w");
          }
        }

        else {
          blackTime -= elapsed;

          if (blackTime <= 0) {
            blackTime = 0;
            stopOnTime("b");
          }
        }
      }

      lastTick = now;
      updateClocks();
    }


    function setClockMinutes() {
      const parsed = Number(timeInput.value);

      if (!Number.isFinite(parsed) || parsed <= 0) {
        timeInput.value = String(startingMinutes);
        return;
      }

      startingMinutes = parsed;
      whiteTime = parsed * 60 * 1000;
      blackTime = parsed * 60 * 1000;
      timerStarted = false;
      timerFinished = false;
      activeClock = game.turn();
      lastTick = performance.now();

      updateStatus();
      updateClocks();
    }


    flipButton.addEventListener(
      "click",
      () => {
        if (drag) {
          finishDrag();
        }

        orientation =
          orientation === "white"
            ? "black"
            : "white";

        renderBoard();
        renderCapturedPieces();
      }
    );


    resetButton.addEventListener(
      "click",
      () => {
        if (drag) {
          finishDrag();
        }

        game.reset();

        capturedPieces.w = [];
        capturedPieces.b = [];
        lastCaptureToken = 0;
        pieceRestingPositions.clear();

        whiteTime = startingMinutes * 60 * 1000;
        blackTime = startingMinutes * 60 * 1000;
        timerStarted = false;
        timerFinished = false;
        activeClock = "w";
        lastTick = performance.now();

        renderBoard();
      }
    );


    setTimeButton.addEventListener(
      "click",
      setClockMinutes
    );


    timeInput.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          setClockMinutes();
        }
      }
    );


    window.setInterval(
      tickClock,
      250
    );


    renderBoard();
    renderCapturedPieces();
    updateClocks();

  </script>
</body>
</html>
