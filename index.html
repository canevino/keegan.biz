<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>keegan.biz</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="page-shell">

    <!-- SCARF MENU -->
    <nav class="scarf-rack" aria-label="Site sections">

      <a
        href="index.html"
        class="scarf-rack__item scarf-rack__item--home"
        aria-label="Home"
        title="Home"
      >
        <img
          src="assets/home/home-scarf-update.png"
          alt="keegan.biz home scarf"
        />
      </a>

      <a
        href="illustration.html"
        class="scarf-rack__item"
        aria-label="Illustration"
        title="Illustration"
      >
        <img
          src="assets/home/scarf-illustration.png"
          alt="Illustration"
        />
      </a>

      <a
        href="photo.html"
        class="scarf-rack__item"
        aria-label="Photography"
        title="Photography"
      >
        <img
          src="assets/home/scarf-photography.png"
          alt="Photography"
        />
      </a>

      <a
        href="design.html"
        class="scarf-rack__item"
        aria-label="Design"
        title="Design"
      >
        <img
          src="assets/home/scarf-design.png"
          alt="Design"
        />
      </a>

      <a
        href="music.html"
        class="scarf-rack__item"
        aria-label="Music"
        title="Music"
      >
        <img
          src="assets/home/scarf-music.png"
          alt="Music"
        />
      </a>

      <a
        href="motion.html"
        class="scarf-rack__item"
        aria-label="Motion"
        title="Motion"
      >
        <img
          src="assets/home/scarf-motion.png"
          alt="Motion"
        />
      </a>

      <a
        href="misc.html"
        class="scarf-rack__item"
        aria-label="Misc"
        title="Misc"
      >
        <img
          src="assets/home/scarf-misc.png"
          alt="Misc"
        />
      </a>

    </nav>


    <!-- HERO -->
    <main class="hero">
      <div class="hero-inner">

        <p class="welcome-line">
          <span
            id="welcome-word"
            class="welcome-word"
            dir="auto"
          >
            Welcome
          </span>
        </p>

        <h1 class="brand-title" aria-label="keegan.biz">
          <span class="brand-title__keegan">keegan</span><span class="brand-title__dot">.</span><span class="brand-title__biz">biz</span>
        </h1>

        <p class="progress-line">
          <span id="progress-text">SITE STILL IN PROGRESS!!</span>
        </p>

      </div>
    </main>


    <!-- BEHANCE -->
    <footer class="site-footer">
      <a
        class="behance-link"
        href="https://www.behance.net/keeganandrulis"
        target="_blank"
        rel="noopener noreferrer"
      >
        behance ↗
      </a>
    </footer>

  </div>


  <script>
    const welcomeEntries = [
      { text: "Welcome" },                // English
      { text: "Ласкаво просимо" },        // Ukrainian
      { text: "Benvenuti" },              // Italian
      { text: "Fáilte" },                 // Irish
      { text: "Bienvenidos" },            // Spanish
      { text: "欢迎" },                    // Chinese
      { text: "Benvinguts" },             // Catalan
      { text: "WELCOME", className: "is-wingdings" }, // Wingdings
      { text: "Sveiki atvykę" },          // Lithuanian
      { text: "Yá’át’ééh" },              // Navajo
      { text: "Velkomin" },               // Icelandic
      { text: "Willkommen" },             // German
      { text: "ようこそ" },                // Japanese
      { text: "Bienvenue" },              // French
      { text: "Bem-vindos" },             // Portuguese
      { text: "أهلاً وسهلاً" },           // Arabic
      { text: "Mae govannen" },           // Sindarin
      { text: "Croeso" },                 // Welsh
      {
        text: "01010111 01100101 01101100 01100011 01101111 01101101 01100101",
        className: "is-binary"
      },
      { text: "Karibu" },                 // Swahili
      { text: "Ẹ káàbọ̀" },               // Yoruba
      { text: "Siyakwamukela" },          // Zulu
      { text: "स्वागत है" },               // Hindi
      { text: "خوش آمدید" },              // Persian
      { text: "እንኳን ደህና መጡ" }         // Amharic
    ];

    const palette = [
      "#FDB913", // yellow
      "#006A44", // green
      "#C1272D"  // red
    ];

    const welcomeWord = document.getElementById("welcome-word");
    const progressText = document.getElementById("progress-text");

    let lastWelcomeIndex = -1;
    let lastProgressColor = "";

    function randomIndex(length, lastIndex) {
      let next;
      do {
        next = Math.floor(Math.random() * length);
      } while (length > 1 && next === lastIndex);
      return next;
    }

    function randomColor(exclude = "") {
      let color;
      do {
        color = palette[Math.floor(Math.random() * palette.length)];
      } while (palette.length > 1 && color === exclude);
      return color;
    }

    function updateWelcome() {
      const nextIndex = randomIndex(welcomeEntries.length, lastWelcomeIndex);
      const entry = welcomeEntries[nextIndex];

      welcomeWord.classList.add("is-changing");

      setTimeout(() => {
        welcomeWord.textContent = entry.text;
        welcomeWord.classList.remove("is-wingdings", "is-binary");

        if (entry.className) {
          welcomeWord.classList.add(entry.className);
        }

        welcomeWord.style.color = randomColor();
        welcomeWord.classList.remove("is-changing");
        lastWelcomeIndex = nextIndex;
      }, 160);
    }

    function updateProgressColor() {
      const nextColor = randomColor(lastProgressColor);
      progressText.style.color = nextColor;
      lastProgressColor = nextColor;
    }

    updateWelcome();
    updateProgressColor();

    setInterval(updateWelcome, 2400);
    setInterval(updateProgressColor, 900);
  </script>
</body>
</html>
