<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>keegan.biz</title>

  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/assets/sports/sports.css">

  <style>
    .home {
      --home-left:
        clamp(
          40px,
          5.5vw,
          88px
        );
    }


    .chess-launcher {
      position: absolute;

      top: 50%;
      left: var(--home-left);

      display: inline-block;

      margin: 0;

      transform: translateY(-50%);

      padding: 0;

      border: 0;

      background: transparent;

      color: var(--board-red, #c1272d);

      font: inherit;
      font-size: 20px;
      line-height: 1;
      font-weight: 700;

      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;

      cursor: pointer;
    }

    .chess-launcher[hidden] {
      display: none !important;
    }

    .chess-panel {
      display: none;

      width: min(100%, 700px);

      margin:
        clamp(72px, 10vh, 126px)
        auto
        0;
    }

    .chess-panel.is-open {
      display: block;
    }

    .chess-panel-head {
      width: 100%;

      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 12px;
    }

    .chess-panel-title {
      margin: 0;

      color: var(--board-red, #c1272d);

      font-size: clamp(60px, 6.4vw, 96px);
      line-height: .88;
      letter-spacing: -.06em;
      font-weight: 700;
    }

    .chess-close {
      flex: 0 0 auto;

      margin: -5px 0 0;

      padding: 0;

      border: 0;

      background: transparent;

      color: var(--board-red, #c1272d);

      font-family: Helvetica, Arial, sans-serif;
      font-size: clamp(42px, 4vw, 62px);
      line-height: .75;
      font-weight: 400;

      cursor: pointer;
    }

    .chess-close:hover {
      transform: rotate(4deg);
    }

    .home-chess {
      --board-red: var(--red, #c1272d);
      --board-yellow: var(--yellow, #fdb913);
      --board-green: var(--green, #006a44);
      --board-ink: var(--ink, #11110f);
      --board-paper: var(--paper, #ece7d7);
      --square-a: #ece7d7;
      --square-b: #ddd7b6;
      width: min(100%, 700px);
      max-width: 100%;
      min-width: 0;
      margin-top: clamp(42px, 5vw, 68px);
    }

    .home-chess .play-controls {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 14px;

      margin-bottom: 8px;
    }

    .home-chess .play-controls-label {
      color: var(--board-red);

      font-size: 12px;
      line-height: 1;
      font-weight: 700;
    }

    .home-chess .mode-button,
    .home-chess .difficulty-button {
      min-height: 0;

      padding: 0;

      border: 0;

      background: transparent;

      text-align: left;
    }

    .home-chess .mode-button {
      color: var(--board-red);
    }

    .home-chess .mode-button.is-active {
      background: transparent;
      color: var(--board-red);

      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .home-chess .bot-difficulties {
      display: none;

      grid-template-columns: repeat(3, auto);

      gap: 12px;

      align-items: baseline;

      margin-left: 4px;
    }

    .home-chess.is-bot-mode .bot-difficulties {
      display: grid;
    }

    .home-chess .difficulty-button[data-level="easy"] {
      color: var(--board-green);
    }

    .home-chess .difficulty-button[data-level="medium"] {
      color: var(--board-yellow);
    }

    .home-chess .difficulty-button[data-level="hard"] {
      color: var(--board-red);
    }

    .home-chess .difficulty-button.is-active {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .home-chess .bot-state {
      display: none;

      margin: 0 0 8px;

      color: var(--board-red);

      font-size: 12px;
      line-height: 1;
      font-weight: 700;
    }

    .home-chess.is-bot-mode .bot-state {
      display: block;
    }


    .autoplay-panel {
      display: none;
      margin: 0 0 12px;
      padding: 0;
    }


    .home-chess.is-autoplay-mode .autoplay-panel {
      display: block;
    }


    .autoplay-context,
    .autoplay-game-title,
    .autoplay-game-detail {
      margin: 0;
      max-width: 720px;
      color: var(--board-red);
      font-size: 12px;
      line-height: 1.18;
    }


    .autoplay-game-title {
      font-weight: 700;
    }


    .autoplay-game-detail {
      margin-top: 2px;
      font-weight: 500;
    }


    .autoplay-context {
      margin-top: 4px;
      margin-bottom: 10px;
      font-weight: 500;
    }


    .autoplay-watch-controls {
      display: none;

      width:
        calc(
          100% -
          var(--capture-column, 132px) -
          12px
        );

      margin-top: 8px;

      border-top:
        1px
        solid
        var(--board-red);

      border-bottom:
        1px
        solid
        var(--board-red);
    }


    .home-chess.is-autoplay-mode .autoplay-watch-controls {
      display: grid;

      grid-template-columns:
        auto
        auto
        minmax(0, 1fr)
        auto
        auto
        auto;
    }


    .autoplay-watch-controls button {
      min-width: 0;

      padding:
        7px
        10px;

      border: 0;

      border-right:
        1px
        solid
        var(--board-red);

      background:
        transparent;

      color:
        var(--board-red);

      font-weight: 700;

      text-align:
        center;
    }


    .autoplay-watch-controls button:first-child {
      border-left:
        1px
        solid
        var(--board-red);
    }


    .autoplay-watch-controls button:hover:not(:disabled) {
      background:
        var(--board-red);

      color:
        var(--board-paper);
    }


    .autoplay-control-label {
      display: flex;

      align-items:
        center;

      justify-content:
        center;

      min-height: 34px;

      padding:
        7px
        10px;

      border-right:
        1px
        solid
        var(--board-red);

      overflow: hidden;

      color:
        var(--board-red);

      font-weight: 700;

      text-align:
        center;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;
    }


    .home-chess.is-autoplay-mode .clock-group,
    .home-chess.is-autoplay-mode .time-setter {
      display: none;
    }


    .home-chess.is-autoplay-mode .chess-bottombar {
      grid-template-columns:
        auto
        auto;

      grid-template-areas:
        "reset autoplay-new";

      justify-content:
        start;
    }

    .home-chess.is-bot-mode .clock-group,
    .home-chess.is-bot-mode .time-setter {
      display: none;
    }

    .home-chess.is-bot-mode .chess-bottombar {
      grid-template-columns: auto auto;
      grid-template-areas: "reset resign";
      justify-content: start;
    }
    .home-chess .chess-topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 16px;
      margin-bottom: 10px;
    }

    .home-chess .status,
    .home-chess .clock,
    .home-chess .time-label,
    .home-chess .review-label {
      margin: 0;
      font-size: 14px;
      line-height: 1;
      font-weight: 700;
    }

    .home-chess .status,
    .home-chess .time-label,
    .home-chess .review-label {
      color: var(--board-red);
    }

    #white-clock {
      color: var(--board-yellow);
    }

    #black-clock {
      color: var(--board-green);
    }

    .home-chess .clock.is-active {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    .home-chess button {
      appearance: none;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--board-red);
      font: inherit;
      font-size: 14px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
    }

    .home-chess button:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .home-chess button:disabled {
      opacity: .3;
      cursor: default;
      text-decoration: none;
    }

    .home-chess input {
      width: 56px;
      min-width: 0;
      padding: 4px 5px;
      border: 1px solid var(--board-red);
      border-radius: 0;
      background: transparent;
      color: var(--board-ink);
      font: inherit;
      font-size: 14px;
      line-height: 1;
      font-weight: 700;
      outline: 0;
    }

    .home-chess input:focus {
      outline: 2px solid var(--board-red);
      outline-offset: 2px;
    }

    .autoplay-player {
      display: none;
      width: calc(100% - var(--capture-column, 132px) - 12px);
      margin: 0;
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
      text-align: center;
    }


    .home-chess.is-autoplay-mode .autoplay-player {
      display: block;
    }


    .autoplay-player-top {
      margin-bottom: 7px;
    }


    .autoplay-player-bottom {
      margin-top: 7px;
    }


    .autoplay-player.is-yellow {
      color: var(--board-yellow);
    }


    .autoplay-player.is-green {
      color: var(--board-green);
    }


    .home-chess .board-area {
      --capture-column: clamp(96px, 11vw, 132px);

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        var(--capture-column);

      gap: 12px;

      width: 100%;
      min-width: 0;
    }


    .home-chess .board-frame {
      grid-column: 1;
      position: relative;
      width: 100%;
      min-width: 0;
    }



    .home-chess .board-frame::before {
      content: "";
      display: block;
      width: 100%;
      padding-top: 100%;
    }

    .home-chess .board {
      position: absolute;
      inset: 0;
      z-index: 2;

      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));

      border-top: 2px solid var(--board-red);
      border-left: 2px solid var(--board-red);
      background: var(--square-a);

      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .home-chess .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      border-right: 2px solid var(--board-red);
      border-bottom: 2px solid var(--board-red);
      cursor: pointer;
      overflow: visible;
    }

    .home-chess .square.light {
      background: var(--square-a);
    }

    .home-chess .square.dark {
      background: var(--square-b);
    }

    .home-chess .square.legal::after {
      content: "";
      position: absolute;
      z-index: 6;
      width: 13%;
      aspect-ratio: 1;
      border: 2px solid var(--board-red);
      border-radius: 50%;
      pointer-events: none;
    }

    .home-chess .piece {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;

      font-size: clamp(25px, 4vw, 56px);
      line-height: 1;
      font-weight: 700;

      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;

      transform:
        translate(var(--rest-x, 0px), var(--rest-y, 0px))
        rotate(var(--rest-r, 0deg));

      transform-origin: center;
    }

    .home-chess .piece.white {
      color: var(--board-yellow);
    }

    .home-chess .piece.black {
      color: var(--board-green);
    }

    .home-chess .piece.is-selected {
      z-index: 12;
      opacity: 1;

      transform:
        translate(
          var(--rest-x, 0px),
          calc(var(--rest-y, 0px) - 3px)
        )
        rotate(var(--rest-r, 0deg))
        scale(1.035);

      text-shadow:
        5px
        5px
        0
        rgba(193, 39, 45, .62);
    }

    @media (hover: hover) and (pointer: fine) {
      .home-chess .piece.is-selected {
        opacity: 0;
        text-shadow: none;
      }
    }


    .floating-piece {
      position: fixed;
      z-index: 999999;

      display: flex;
      align-items: center;
      justify-content: center;

      width: var(--float-size);
      height: var(--float-size);

      line-height: 1;
      font-weight: 700;

      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;

      transform:
        translate(-50%, -50%)
        translateY(-5px)
        rotate(var(--float-r, 0deg))
        scale(1.06);

      text-shadow:
        7px
        7px
        0
        rgba(193, 39, 45, .62);
    }

    .home-chess .piece.just-dropped {
      animation:
        piece-drop
        190ms
        cubic-bezier(.18, .82, .23, 1);
    }

    @keyframes piece-drop {
      0% {
        transform:
          translate(
            calc(var(--rest-x, 0px) - 2px),
            calc(var(--rest-y, 0px) - 9px)
          )
          rotate(calc(var(--rest-r, 0deg) + 1.5deg))
          scale(1.08);
      }

      72% {
        transform:
          translate(
            calc(var(--rest-x, 0px) + .6px),
            calc(var(--rest-y, 0px) + 1px)
          )
          rotate(calc(var(--rest-r, 0deg) - .3deg))
          scale(.99);
      }

      100% {
        transform:
          translate(var(--rest-x, 0px), var(--rest-y, 0px))
          rotate(var(--rest-r, 0deg))
          scale(1);
      }
    }

    .home-chess .coordinate {
      position: absolute;
      z-index: 7;
      color: var(--board-red);
      font-size: 9px;
      line-height: 1;
      font-weight: 700;
      pointer-events: none;
    }

    .home-chess .coordinate.file {
      right: 3px;
      bottom: 3px;
    }

    .home-chess .coordinate.rank {
      top: 3px;
      left: 3px;
    }

    .home-chess .capture-bin {
      grid-column: 2;
      grid-row: 1;

      position: relative;

      width: 100%;
      height: 100%;

      min-width: 0;

      overflow: hidden;

      pointer-events: none;

      border: 2px solid var(--board-red);

      background:
        rgba(236, 231, 215, .24);
    }

    .home-chess .captured-piece {
      position: absolute;

      left: 0;
      top: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      width: var(--piece-w, 28px);
      height: var(--piece-h, 34px);

      font-size: var(--piece-font, 32px);
      line-height: 1;
      font-weight: 700;

      transform:
        translate3d(
          calc(var(--x, 0px) - 50%),
          calc(var(--y, 0px) - 50%),
          0
        )
        rotate(var(--r, 0deg));

      transform-origin: center center;

      will-change: transform;

      user-select: none;
      -webkit-user-select: none;
    }

    .home-chess .captured-piece.white {
      color: var(--board-yellow);
    }

    .home-chess .captured-piece.black {
      color: var(--board-green);
    }

    .home-chess .promotion-picker {
      position: absolute;
      inset: 0;
      z-index: 40;

      display: none;
      place-items: center;

      background:
        rgba(236, 231, 215, .34);
    }

    .home-chess .promotion-picker.is-visible {
      display: grid;
    }

    .home-chess .promotion-options {
      display: grid;
      grid-template-columns: repeat(4, auto);
      gap: 0;

      background: var(--board-paper);

      border: 2px solid var(--board-red);

      box-shadow:
        6px
        6px
        0
        rgba(193, 39, 45, .62);
    }

    .home-chess .promotion-option {
      width: 58px;
      height: 58px;

      padding: 0;

      border: 0;
      border-right: 1px solid var(--board-red);

      background: transparent;

      font-size: 38px;
      line-height: 1;
      font-weight: 700;

      color: var(--promotion-color, var(--board-yellow));
    }

    .home-chess .promotion-option:last-child {
      border-right: 0;
    }

    .home-chess .promotion-option:hover {
      background: var(--board-red);
      color: var(--board-paper);
    }


    .home-chess .win-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;

      display: none;
      place-items: center;

      overflow: hidden;

      pointer-events: none;
    }

    .home-chess .win-overlay[hidden] {
      display: none !important;
    }

    .home-chess .win-overlay.is-visible {
      display: grid;
      pointer-events: auto;
    }

    .home-chess .win-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .home-chess .win-overlay::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(17, 17, 15, .12);
      pointer-events: none;
    }

    .home-chess .win-art-title {
      position: absolute;

      top: 10px;
      left: 10px;

      z-index: 3;

      width: min(72%, 280px);

      padding: 4px 6px 5px;

      background: var(--board-paper);

      color: var(--board-red);

      font-size: 9px;
      line-height: 1.18;
      font-weight: 500;

      letter-spacing: -.015em;

      text-align: left;
    }

    .home-chess .win-art-title strong {
      font-weight: 700;
    }


    .home-chess .win-title {
      position: relative;
      z-index: 2;
      width: fit-content;
      max-width: 62%;
      margin: 0;
      padding: 6px 10px 8px;
      background: var(--board-paper);
      color: var(--winner-color, var(--board-green));
      text-align: center;
      font-size: clamp(30px, 4vw, 52px);
      line-height: .92;
      letter-spacing: -.055em;
      font-weight: 700;
      box-shadow: 6px 6px 0 rgba(193, 39, 45, .72);

      transform:
        translateY(
          var(--win-title-y, -72px)
        );
    }

    .home-chess .win-condition {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
      width: max-content;
      max-width: 70%;
      margin: 0;
      padding: 3px 5px 4px;
      background: var(--board-paper);
      color: var(--board-red);
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      text-align: center;

      transform:
        translate(
          -50%,
          calc(
            -50% +
            var(--win-title-y, -72px) +
            64px
          )
        );
    }


    .home-chess .result-actions {
      display: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0;
      margin-top: 8px;
      border: 1px solid var(--board-red);
    }

    .home-chess .result-actions.is-visible {
      display: grid;
    }

    .home-chess .result-actions button {
      min-height: 36px;
      padding: 8px 10px;
      text-align: left;
    }

    .home-chess .result-actions button + button {
      border-left: 1px solid var(--board-red);
    }

    .home-chess .result-actions button:hover {
      background: var(--board-red);
      color: var(--board-paper);
      text-decoration: none;
    }

    .home-chess .review-controls {
      display: none;
      grid-template-columns: auto auto minmax(0, 1fr) auto auto auto;
      align-items: center;
      gap: 0;
      margin-top: 8px;
      border: 1px solid var(--board-red);
    }

    .home-chess .review-controls.is-visible {
      display: grid;
    }

    .home-chess .review-controls button {
      min-height: 34px;
      padding: 7px 9px;
    }

    .home-chess .review-controls button + button,
    .home-chess .review-controls .review-label + button,
    .home-chess .review-controls button + .review-label {
      border-left: 1px solid var(--board-red);
    }

    .home-chess .review-controls button:hover:not(:disabled) {
      background: var(--board-red);
      color: var(--board-paper);
      text-decoration: none;
    }

    .home-chess .review-label {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 7px 10px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .home-chess .chess-bottombar {
      display: grid;
      grid-template-columns:
        auto
        auto
        minmax(0, 1fr)
        auto;
      grid-template-areas:
        "reset resign clocks setter";
      align-items: end;
      gap: 14px 18px;
      margin-top: 12px;
    }

    #reset-button {
      grid-area: reset;
      justify-self: start;
    }


    #resign-button {
      grid-area: resign;
      justify-self: start;
    }


    .home-chess.is-autoplay-mode #resign-button {
      display: none;
    }


    #autoplay-new {
      display: none;

      grid-area:
        autoplay-new;

      justify-self:
        start;
    }


    .home-chess.is-autoplay-mode #autoplay-new {
      display: inline-block;
    }


    .home-chess .clock-group {
      grid-area: clocks;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .home-chess .time-setter {
      grid-area: setter;
      display: grid;
      grid-template-columns:
        auto
        56px
        auto;
      align-items: center;
      gap: 8px;
      justify-self: end;
    }

    @media (max-width: 1240px) {
      .home {
        --home-left:

  <script>
  (() => {

    const clamp = (
      value,
      min,
      max
    ) =>
      Math.min(
        Math.max(
          value,
          min
        ),
        max
      );


    function smoothStep(
      value
    ) {

      const t =
        clamp(
          value,
          0,
          1
        );


      return (
        t *
        t *
        (
          3 -
          2 *
          t
        )
      );

    }


    const welcomeWord =
      document.getElementById(
        "welcome-word"
      );


    if (
      welcomeWord
    ) {

      welcomeWord.textContent =
        "Welcome";


      welcomeWord.style.color =
        "#006a44";

    }


    const pageShell =
      document.getElementById(
        "page-shell"
      );


    const overlay =
      document.getElementById(
        "wip-overlay"
      );


    const audio =
      document.getElementById(
        "wip-audio"
      );


    const closeButton =
      document.getElementById(
        "wip-close"
      );


    const stage =
      document.getElementById(
        "collage-stage"
      );


    const HORSE_START =
      12;


    const HORSE_FULL =
      20;


    let overlayOpen =
      false;


    let raf =
      null;


    let openedAt =
      0;


    function horseRevealAt(
      time
    ) {

      if (
        time <
        HORSE_START
      ) {
        return 0;
      }


      return smoothStep(
        (
          time -
          HORSE_START
        )
        /
        (
          HORSE_FULL -
          HORSE_START
        )
      );

    }


    function visualLoop(
      now
    ) {

      if (
        !overlayOpen
      ) {
        return;
      }


      const elapsed =
        Math.max(
          0,
          (
            now -
            openedAt
          )
          /
          1000
        );


      const time =
        audio.currentTime >
        0
          ? audio.currentTime
          : elapsed;


      stage.style.setProperty(
        "--visual-reveal",
        horseRevealAt(
          time
        ).toFixed(4)
      );


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    async function openWip() {

      if (
        overlayOpen
      ) {
        return;
      }


      overlayOpen =
        true;


      openedAt =
        performance.now();


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      pageShell.classList.add(
        "is-hidden"
      );


      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.pause();


      audio.currentTime =
        0;


      audio.volume =
        .72;


      try {

        await audio.play();

      }

      catch (
        error
      ) {

        console.log(
          "Audio could not start:",
          error
        );

      }


      cancelAnimationFrame(
        raf
      );


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    function closeWip() {

      overlayOpen =
        false;


      cancelAnimationFrame(
        raf
      );


      audio.pause();


      audio.currentTime =
        0;


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      window.setTimeout(
        () => {

          pageShell.classList.remove(
            "is-hidden"
          );

        },
        160
      );

    }


    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );


        if (
          !link ||
          link.hasAttribute(
            "data-live-link"
          )
        ) {
          return;
        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape" &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>

    function hashString(
      value
    ) {

      let hash =
        2166136261;


      for (
        let i =
          0;
        i <
        value.length;
        i++

        hash ^=
          value.charCodeAt(

        hash =

            16777619
          );

      return hash >>>
        0;

    function dropPlacementFor(
      squareName,

      clientY

      const squareElement =
        boardElement.querySelector(

      if (
        !squareElement

        return {
          x: 0,
          y: 0,

        };

      const rect =
        squareElement.getBoundingClientRect();


      const localX =
        clampChess(
          clientX -
          rect.left,
          0,
          rect.width
        );


      const localY =
        clampChess(
          clientY -
          rect.top,
          0,
          rect.height
        );


      const x =
        (
          localX /
          rect.width
          -
          .5
        )
        *
        rect.width
        *
        .32;


      const y =
        (
          localY /
          rect.height
          -
          .5
        )
        *
        rect.height
        *
        .72;


      const r =
        clampChess(
          (
            x /
            Math.max(
              rect.width,
              1
            )
          )
          *
          8
          +
          (
            y /
            Math.max(
              rect.height,
              1
            )
          )
          *
          -3,
          -5,
          5
        );


      return {
        x,
        y,
        r
      };

      const measuredHeight =

        )
        ||
        fontSize *

      return {
        font:

            4
          ),

        visualHeight:
          Math.max(
            20,
            measuredHeight +
            6

        bodyWidth:

          )

          piece => ({
            ...piece,
            color:
              "b"
          })
        )
      ];

    }


    function capturedTokenKey(
      piece
    ) {

      return `${piece.color}:${piece.token}`;

    }


    function sourceTokenMap(
      source
    ) {

      const map =
        new Map();


      allCapturedPieces(
        source
      ).forEach(
        piece => {

          map.set(
            capturedTokenKey(
              piece
            ),
            piece
          );

        }
      );


      return map;

    }


    function createCaptureEngine() {

      if (
        captureEngine
      ) {
        return;
      }


      if (
        !window.Matter
      ) {

        console.error(
          "Matter.js failed to load."
        );


        return;
      }


      captureEngine =
        Matter.Engine.create({
          enableSleeping:
            false,

          positionIterations:
            10,

          velocityIterations:
            8,

          constraintIterations:
            2
        });


      captureWorld =
        captureEngine.world;


      captureWorld.gravity.x =
        0;


      captureWorld.gravity.y =
        1;


      captureWorld.gravity.scale =
        .00135;


      captureRunner =
        Matter.Runner.create({
          delta:
            1000 /
            60
        });


      captureSyncHandler =
        () => {

          let allSettled =
            captureBodies.length >
            0;


          const dynamicBodies =
            captureBodies.map(
              item =>
                item.body
            );


          captureBodies.forEach(
            item => {

              updateCapturedElement(
                item
              );


              const body =
                item.body;


              const collisions =
                Matter.Query.collides(
                  body,
                  [
                    ...dynamicBodies.filter(
                      other =>
                        other !==
                        body
                    ),

                    ...captureWalls
                  ]
                );


              const supported =
                collisions.some(
                  collision => {

                    const other =
                      collision.bodyA ===
                      body
                        ? collision.bodyB
                        : collision.bodyA;


                    if (
                      other.isStatic
                    ) {

                      return (
                        other.position.y >
                        body.position.y
                      );

                    }


                    return (
                      other.position.y >
                      body.position.y +
                      1
                    );

                  }
                );


              const slow =
                body.speed <
                .055
                &&
                Math.abs(
                  body.angularSpeed
                )
                <
                .0045;


              if (
                !supported ||
                !slow
              ) {

                allSettled =
                  false;

              }

            }
          );


          if (
            allSettled
          ) {

            captureStillFrames +=
              1;

          }

          else {

            captureStillFrames =
              0;

          }


          if (
            captureStillFrames >
            30
          ) {

            freezeCapturePile();

          }

        };


      Matter.Events.on(
        captureEngine,
        "afterUpdate",
        captureSyncHandler
      );


      rebuildCaptureWalls();

    }


    function runCapturePhysics() {

      createCaptureEngine();


      if (
        !captureRunner
        ||
        !captureEngine
      ) {
        return;
      }


      captureStillFrames =
        0;


      Matter.Runner.stop(
        captureRunner
      );


      Matter.Runner.run(
        captureRunner,
        captureEngine
      );

    }


    function freezeCapturePile() {

      if (
        captureRunner
      ) {

        Matter.Runner.stop(
          captureRunner
        );

      }


      captureBodies.forEach(
        item => {

          Matter.Body.setVelocity(
            item.body,
            {
              x:
                0,

              y:
                0
            }
          );


          Matter.Body.setAngularVelocity(
            item.body,
            0
          );


          updateCapturedElement(
            item
          );

        }
      );

    }


    function rebuildCaptureWalls() {

      if (
        !captureEngine
      ) {
        return;
      }


      captureWalls.forEach(
        wall => {

          Matter.Composite.remove(
            captureWorld,
            wall
          );

        }
      );


      captureWalls =
        [];


      const width =
        captureBin.clientWidth;


      const height =
        captureBin.clientHeight;


      const thickness =
        24;


      const wallOptions = {
        isStatic:
          true,

        restitution:
          .035,

        friction:
          .88,

        frictionStatic:
          1
      };


      const floor =
        Matter.Bodies.rectangle(
          width /
          2,
          height +
          thickness /
          2,
          width +
          thickness *
          2,
          thickness,
          wallOptions
        );


      const left =
        Matter.Bodies.rectangle(
          -thickness /
          2,
          height /
          2,
          thickness,
          height +
          thickness *
          2,
          wallOptions
        );


      const right =
        Matter.Bodies.rectangle(
          width +
          thickness /
          2,
          height /
          2,
          thickness,
          height +
          thickness *
          2,
          wallOptions
        );


      captureWalls = [
        floor,
        left,
        right
      ];


      Matter.Composite.add(
        captureWorld,
        captureWalls
      );

    }


    function makeCapturedElement(
      piece,
      metrics
    ) {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        `captured-piece ${
          piece.color ===
          "w"
            ? "white"
            : "black"
        }`;


      element.textContent =
        pieceLetters[
          piece.type
        ];


      element.style.setProperty(
        "--piece-w",
        `${metrics.visualWidth}px`
      );


      element.style.setProperty(
        "--piece-h",
        `${metrics.visualHeight}px`
      );


      element.style.setProperty(
        "--piece-font",
        `${metrics.font}px`
      );


      captureBin.appendChild(
        element
      );


      return element;

    }


    function updateCapturedElement(
      item
    ) {

      item.element.style.setProperty(
        "--x",
        `${item.body.position.x}px`
      );


      item.element.style.setProperty(
        "--y",
        `${item.body.position.y}px`
      );


      item.element.style.setProperty(
        "--r",
        `${item.body.angle * 180 / Math.PI}deg`
      );

    }


    function createCapturedBody(
      piece,
      index,
      simultaneous =
        false
    ) {

      createCaptureEngine();


      const fontSize =
        pieceFontForBin();


      const metrics =
        glyphBodyMetrics(
          piece.type,
          fontSize
        );


      const width =
        captureBin.clientWidth;


      const seed =
        hashString(
          `${piece.color}-${piece.type}-${piece.token}-${index}-${orientation}`
        );


      const randomA =
        (
          seed &
          65535
        )
        /
        65535;


      const randomB =
        (
          (
            seed >>>
            16
          )
          &
          65535
        )
        /
        65535;


      const minimumX =
        metrics.bodyWidth /
        2
        +
        3;


      const maximumX =
        Math.max(
          minimumX,
          width
          -
          metrics.bodyWidth /
          2
          -
          3
        );


      const x =
        Math.max(
          minimumX,
          Math.min(
            maximumX,
            width *
            (
              .12
              +
              randomA *
              .76
            )
          )
        );


      const y =
        simultaneous
          ? -metrics.bodyHeight
          : -metrics.bodyHeight
            -
            index *
            4;


      const body =
        Matter.Bodies.rectangle(
          x,
          y,
          metrics.bodyWidth,
          metrics.bodyHeight,
          {
            restitution:
              .055,

            friction:
              .82,

            frictionStatic:
              1,

            frictionAir:
              .035,

            density:
              .0025,

            slop:
              .035,

            chamfer: {
              radius:
                1
            }
          }
        );


      Matter.Body.setAngle(
        body,
        (
          randomB -
          .5
        )
        *
        .72
      );


      Matter.Body.setVelocity(
        body,
        {
          x:
            (
              randomA -
              .5
            )
            *
            .45,

          y:
            .35
            +
            randomB *
            .30
        }
      );


      Matter.Body.setAngularVelocity(
        body,
        (
          randomB -
          .5
        )
        *
        .018
      );


      const element =
        makeCapturedElement(
          piece,
          metrics
        );


      const item = {
        piece,
        body,
        element
      };


      Matter.Composite.add(
        captureWorld,
        body
      );


      updateCapturedElement(
        item
      );


      return item;

    }


    function wakeExistingCaptureBodies() {

      captureBodies.forEach(
        item => {

          const body =
            item.body;


          Matter.Body.setVelocity(
            body,
            {
              x:
                body.velocity.x,
              y:
                body.velocity.y -
                .08
            }
          );

        }
      );

    }


    function clearCapturePhysics() {

      if (
        captureRunner
      ) {

        Matter.Runner.stop(
          captureRunner
        );

      }


      if (
        captureWorld
      ) {

        captureBodies.forEach(
          item => {

            Matter.Composite.remove(
              captureWorld,
              item.body
            );

          }
        );

      }


      captureBodies =
        [];


      captureBin.innerHTML =
        "";

    }


    function rebuildCaptureBodies(
      source,
      simultaneous =
        true
    ) {

      clearCapturePhysics();


      createCaptureEngine();


      rebuildCaptureWalls();


      const pieces =
        allCapturedPieces(
          source
        );


      pieces.forEach(
        (
          piece,
          index
        ) => {

          captureBodies.push(
            createCapturedBody(
              piece,
              index,
              simultaneous
            )
          );

        }
      );


      if (
        pieces.length >
        0
      ) {

        runCapturePhysics();

      }

    }


    function addCapturedBody(
      piece
    ) {

      createCaptureEngine();


      rebuildCaptureWalls();


      wakeExistingCaptureBodies();


      const item =
        createCapturedBody(
          piece,
          captureBodies.length,
          true
        );


      captureBodies.push(
        item
      );


      runCapturePhysics();

    }


    function syncCaptureBodiesToSource(
      source
    ) {

      createCaptureEngine();


      const wanted =
        sourceTokenMap(
          source
        );


      const existing =
        new Map(
          captureBodies.map(
            item => [
              capturedTokenKey(
                item.piece
              ),
              item
            ]
          )
        );


      let changed =
        false;


      captureBodies
        .slice()
        .forEach(
          item => {

            const key =
              capturedTokenKey(
                item.piece
              );


            if (
              !wanted.has(
                key
              )
            ) {

              Matter.Composite.remove(
                captureWorld,
                item.body
              );


              item.element.remove();


              captureBodies =
                captureBodies.filter(
                  bodyItem =>
                    bodyItem !==
                    item
                );


              changed =
                true;

            }

          }
        );


      wanted.forEach(
        (
          piece,
          key
        ) => {

          if (
            existing.has(
              key
            )
          ) {
            return;
          }


          addCapturedBody(
            piece
          );


          changed =
            true;

        }
      );


      if (
        changed
      ) {

        runCapturePhysics();

      }

    }


    function renderCapturedPieces(
      animateToken =
        null,
      source =
        capturedPieces,
      dropAll =
        false,
      simultaneous =
        false
    ) {

      if (
        dropAll
      ) {

        rebuildCaptureBodies(
          source,
          simultaneous
        );


        return;

      }


      if (
        reviewing
      ) {

        syncCaptureBodiesToSource(
          source
        );


        return;

      }


      if (
        animateToken
      ) {

        const newest =
          [
            ...source.w,
            ...source.b
          ].find(
            piece =>
              piece.token ===
              animateToken
          );


        if (
          newest
        ) {

          const color =
            source.w.some(
              piece =>
                piece.token ===
                animateToken
            )
              ? "w"
              : "b";


          addCapturedBody({
            ...newest,
            color
          });

        }


        return;

      }


      // Ordinary non-capture moves must not disturb the pile.
      // Only initialize if captured pieces exist but the DOM/physics pile
      // has not been created yet.
      if (
        captureBodies.length ===
        0
        &&
        (
          source.w.length >
          0
          ||
          source.b.length >
          0
        )
      ) {

        rebuildCaptureBodies(
          source,
          true
        );

      }

    }


    function renderBoard() {

      const renderGame =
        currentRenderGame();


      boardElement.innerHTML =
        "";


      const files =
        getFiles();


      const ranks =
        getRanks();


      for (
        let row =
          0;
        row <
        8;
        row++
      ) {

        for (
          let column =
            0;
          column <
          8;
          column++
        ) {

          const file =
            files[
              column
            ];


          const rank =
            ranks[
              row
            ];


          const squareName =
            `${file}${rank}`;


          const square =
            document.createElement(
              "div"
            );


          const fileIndex =
            file.charCodeAt(
              0
            )
            -
            97;


          const isDark =
            (
              fileIndex +
              rank
            )
            %
            2 ===
            0;


          square.className =
            `square ${
              isDark
                ? "dark"
                : "light"
            }`;


          square.dataset.square =
            squareName;


          const piece =
            renderGame.get(
              squareName
            );


          if (
            piece
          ) {

            const pieceElement =
              document.createElement(
                "div"
              );


            pieceElement.className =
              `piece ${
                piece.color ===
                "w"
                  ? "white"
                  : "black"
              }`;


            pieceElement.textContent =
              pieceLetters[
                piece.type
              ];


            pieceElement.dataset.square =
              squareName;


            const rest =
              restingPlacementFor(
                squareName,
                piece
              );


            pieceElement.style.setProperty(
              "--rest-x",
              `${rest.x}px`
            );


            pieceElement.style.setProperty(
              "--rest-y",
              `${rest.y}px`
            );


            pieceElement.style.setProperty(
              "--rest-r",
              `${rest.r}deg`
            );


            square.appendChild(
              pieceElement
            );

          }


          if (
            column ===
            0
          ) {

            const rankCoordinate =
              document.createElement(
                "span"
              );


            rankCoordinate.className =
              "coordinate rank";


            rankCoordinate.textContent =
              rank;


            square.appendChild(
              rankCoordinate
            );

          }


          if (
            row ===
            7
          ) {

            const fileCoordinate =
              document.createElement(
                "span"
              );


            fileCoordinate.className =
              "coordinate file";


            fileCoordinate.textContent =
              file;


            square.appendChild(
              fileCoordinate
            );

          }


          boardElement.appendChild(
            square
          );

        }

      }


      if (
        reviewing
      ) {

        const snapshot =
          matchHistory[
            reviewIndex
          ].captures;


        renderCapturedPieces(
          null,
          snapshot
        );


        updateReviewControls();

      }

      else {

        updateStatus();


        updateClocks();

      }

    }

    function moveFloatingPiece(
      x,
      y
    ) {

      if (
        !selected?.floating
      ) {
        return;
      }


      selected.floating.style.left =
        `${x}px`;


      selected.floating.style.top =
        `${y}px`;

    }


    function cancelSelection() {

      clearLegalMoves();


      if (
        selected?.original
      ) {

        selected.original.classList.remove(
          "is-selected"
        );

      }


      if (
        selected?.floating
      ) {

        selected.floating.remove();

      }


      selected =
        null;

    }


    function selectPiece(
      squareName,
      pieceElement,
      event
    ) {

      cancelSelection();


      const finePointer =
        window.matchMedia(
          "(hover: hover) and (pointer: fine)"
        ).matches;


      let floating =
        null;


      if (
        finePointer
      ) {

        const rect =
          pieceElement
            .closest(
              ".square"
            )
            .getBoundingClientRect();


        const computed =
          window.getComputedStyle(
            pieceElement
          );


        floating =
          pieceElement.cloneNode(
            true
          );


        floating.classList.remove(
          "is-selected"
        );


        floating.classList.add(
          "floating-piece"
        );


        floating.style.setProperty(
          "--float-size",
          `${rect.width}px`
        );


        floating.style.setProperty(
          "--float-r",
          `${
            Math.random() <
            .5
              ? -.65
              : .65
          }deg`
        );


        floating.style.fontSize =
          computed.fontSize;


        floating.style.fontFamily =
          computed.fontFamily;


        floating.style.fontWeight =
          computed.fontWeight;


        floating.style.color =
          computed.color;


        document.body.appendChild(
          floating
        );

      }


      pieceElement.classList.add(
        "is-selected"
      );


      selected = {

        from:
          squareName,

        original:
          pieceElement,

        floating,

        x:
          event.clientX,

        y:
          event.clientY

      };


      showLegalMoves(
        squareName
      );


      if (
        floating
      ) {

        moveFloatingPiece(
          selected.x,
          selected.y
        );

      }

    }

    function destroyStockfish() {

      if (
        stockfishWorker
      ) {

        try {

          stockfishWorker.postMessage(
            "stop"
          );

        }

        catch (
          error
        ) {}


        stockfishWorker.terminate();

      }


      stockfishWorker =
        null;


      stockfishReadyPromise =
        null;


      resolveStockfishReady =
        null;


      botSearchResolve =
        null;


      botCandidates =
        new Map();

    }


    function handleStockfishMessage(
      event
    ) {

      const line =
        typeof event.data ===
        "string"
          ? event.data
          : String(
              event.data
            );


      if (
        line ===
        "uciok"
      ) {

        stockfishWorker.postMessage(
          "isready"
        );


        return;

      }


      if (
        line ===
        "readyok"
      ) {

        if (
          resolveStockfishReady
        ) {

          resolveStockfishReady();


          resolveStockfishReady =
            null;

        }


        return;

      }


      if (
        line.startsWith(
          "info "
        )
      ) {

        const multipvMatch =
          line.match(
            /\bmultipv\s+(\d+)/
          );


        const pvMatch =
          line.match(
            /\bpv\s+([a-h][1-8][a-h][1-8][qrbn]?)/
          );


        if (
          multipvMatch &&
          pvMatch
        ) {

          botCandidates.set(
            Number(
              multipvMatch[
                1
              ]
            ),
            pvMatch[
              1
            ]
          );

        }


        return;

      }


      if (
        line.startsWith(
          "bestmove "
        )
      ) {

        const match =
          line.match(
            /^bestmove\s+([a-h][1-8][a-h][1-8][qrbn]?|\(none\))/
          );


        if (
          botSearchResolve
        ) {

          const resolve =
            botSearchResolve;


          botSearchResolve =
            null;


          resolve(
            match
              ? match[
                  1
                ]
              : null
          );

        }

      }

    }


    function ensureStockfish() {

      if (
        stockfishReadyPromise
      ) {

        return stockfishReadyPromise;

      }


      stockfishReadyPromise =
        new Promise(
          (
            resolve,
            reject
          ) => {

            resolveStockfishReady =
              resolve;


            try {

              stockfishWorker =
                new Worker(
                  STOCKFISH_WORKER_URL
                );


              stockfishWorker.addEventListener(
                "message",
                handleStockfishMessage
              );


              stockfishWorker.addEventListener(
                "error",
                error => {

                  console.error(
                    "Stockfish failed to load:",
                    error
                  );


                  setBotState(
                    "computer unavailable"
                  );


                  reject(
                    error
                  );

                },
                {
                  once:
                    true
                }
              );


              stockfishWorker.postMessage(
                "uci"
              );

            }

            catch (
              error
            ) {

              setBotState(
                "computer unavailable"
              );


              reject(
                error
              );

            }

          }
        );


      return stockfishReadyPromise;

    }


    function weightedCandidateMove(
      fallback
    ) {

      const config =
        botLevelConfig();


      if (
        botDifficulty ===
        "hard"
      ) {

        return fallback;

      }


      const candidates =
        Array.from(
          botCandidates.entries()
        )
        .sort(
          (
            a,
            b
          ) =>
            a[
              0
            ]
            -
            b[
              0
            ]
        )
        .map(
          entry =>
            entry[
              1
            ]
        );


      if (
        candidates.length ===
        0
      ) {

        return fallback;

      }


      const weights =
        config.weights.slice(
          0,
          candidates.length
        );


      const total =
        weights.reduce(
          (
            sum,
            weight
          ) =>
            sum +
            weight,
          0
        );


      let roll =
        Math.random() *
        total;


      for (
        let i =
          0;
        i <
        weights.length;
        i++
      ) {

        roll -=
          weights[
            i
          ];


        if (
          roll <=
          0
        ) {

          return candidates[
            i
          ];

        }

      }


      return candidates[
        0
      ]
      ||
      fallback;

    }


    async function getBotMove() {

      await ensureStockfish();


      if (
        !stockfishWorker
      ) {

        return null;

      }


      const config =
        botLevelConfig();


      botCandidates =
        new Map();


      stockfishWorker.postMessage(
        "stop"
      );


      stockfishWorker.postMessage(
        "setoption name UCI_LimitStrength value false"
      );


      stockfishWorker.postMessage(
        `setoption name MultiPV value ${config.multipv}`
      );


      if (
        botDifficulty ===
        "hard"
      ) {

        stockfishWorker.postMessage(
          "setoption name UCI_LimitStrength value true"
        );


        stockfishWorker.postMessage(
          `setoption name UCI_Elo value ${config.elo}`
        );

      }

      else {

        stockfishWorker.postMessage(
          `setoption name Skill Level value ${config.skill}`
        );

      }


      stockfishWorker.postMessage(
        `position fen ${game.fen()}`
      );


      const resultPromise =
        new Promise(
          resolve => {

            botSearchResolve =
              resolve;

          }
        );


      if (
        config.movetime
      ) {

        stockfishWorker.postMessage(
          `go movetime ${config.movetime}`
        );

      }

      else {

        stockfishWorker.postMessage(
          `go depth ${config.depth}`
        );

      }


      const bestMove =
        await resultPromise;


      if (
        !bestMove ||
        bestMove ===
        "(none)"
      ) {

        return null;

      }


      return weightedCandidateMove(
        bestMove
      );

    }


    function uciMoveToParts(
      uci
    ) {

      if (
        !uci ||
        uci.length <
        4
      ) {

        return null;

      }


      return {
        from:
          uci.slice(
            0,
            2
          ),

        to:
          uci.slice(
            2,
            4
          ),

        promotion:
          uci.length >
          4
            ? uci[
                4
              ]
            : "q"
      };

    }


    function centerOfSquare(
      squareName
    ) {

      const square =
        boardElement.querySelector(
          `[data-square="${squareName}"]`
        );


      if (
        !square
      ) {

        return {
          x:
            0,
          y:
            0
        };

      }


      const rect =
        square.getBoundingClientRect();


      return {
        x:
          rect.left +
          rect.width *
          (
            .42 +
            Math.random() *
            .16
          ),

        y:
          rect.top +
          rect.height *
          (
            .42 +
            Math.random() *
            .16
          )
      };

    }


    async function maybeMakeBotMove() {

      if (
        gameMode !==
        "bot"
        ||
        reviewing
        ||
        timerFinished
        ||
        game.isGameOver()
        ||
        game.turn() !==
        botColor
        ||
        botThinking
      ) {

        return;

      }


      setBotThinking(
        true
      );


      const config =
        botLevelConfig();


      setBotState(
        `${config.label} · ${config.rating} · thinking`
      );


      try {

        const started =
          performance.now();


        const uci =
          await getBotMove();


        const minimumDelay =
          5000;


        const elapsed =
          performance.now() -
          started;


        if (
          elapsed <
          minimumDelay
        ) {

          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                minimumDelay -
                elapsed
              )
          );

        }


        if (
          gameMode !==
          "bot"
          ||
          game.turn() !==
          botColor
          ||
          reviewing
          ||
          timerFinished
        ) {

          return;

        }


        const move =
          uciMoveToParts(
            uci
          );


        if (
          !move
        ) {

          return;

        }


        const point =
          centerOfSquare(
            move.to
          );


        attemptMove(
          move.from,
          move.to,
          point.x,
          point.y,
          move.promotion
        );

      }

      catch (
        error
      ) {

        console.error(
          "Bot move failed:",
          error
        );


        setBotState(
          "computer unavailable"
        );

      }

      finally {

        setBotThinking(
          false
        );


        updateModeUI();

      }

    }

    function scheduleAutoplayMove(
      delay =
        AUTOPLAY_MOVE_DELAY
    ) {

      clearAutoplayTimer();


      if (
        gameMode !==
        "autoplay"
        ||
        !autoplayPlaying
        ||
        reviewing
        ||
        timerFinished
      ) {
        return;
      }


      autoplayTimer =
        window.setTimeout(
          playNextAutoplayMove,
          delay
        );

    }


    function playNextAutoplayMove() {

      clearAutoplayTimer();


      if (
        gameMode !==
        "autoplay"
        ||
        !autoplayPlaying
        ||
        reviewing
        ||
        timerFinished
      ) {
        return;
      }


      if (
        autoplayMoveIndex >=
        autoplayMoves.length
      ) {

        finishAutoplayGame();


        return;
      }


      const move =
        autoplayMoves[
          autoplayMoveIndex
        ];


      const point =
        centerOfSquare(
          move.to
        );


      const moved =
        attemptMove(
          move.from,
          move.to,
          point.x,
          point.y,
          move.promotion || "q"
        );


      if (
        !moved
      ) {

        console.error(
          "Autoplay move failed:",
          move
        );


        autoplayPlaying =
          false;


        updateAutoplayInfo();


        return;
      }


      autoplayMoveIndex +=
        1;


      updateAutoplayInfo();


      if (
        autoplayMoveIndex >=
        autoplayMoves.length
      ) {

        window.setTimeout(
          () => {

            if (
              !matchWinner
            ) {

              finishAutoplayGame();

            }

          },
          700
        );


        return;
      }


      scheduleAutoplayMove();

    }


    function rebuildAutoplayPosition(
      targetIndex
    ) {

      clearAutoplayTimer();


      autoplayPlaying =
        false;


      timerFinished =
        false;


      matchWinner =
        null;


      hideResultUI();


      game.reset();


      clearCapturePhysics();


      capturedPieces.w.length =
        0;


      capturedPieces.b.length =
        0;


      lastCaptureToken =
        0;


      pieceRestingPositions.clear();


      resetHistory();


      const limit =
        Math.max(
          0,
          Math.min(
            targetIndex,
            autoplayMoves.length
          )
        );


      for (
        let index = 0;
        index < limit;
        index += 1
      ) {

        const sourceMove =
          autoplayMoves[
            index
          ];


        const move =
          game.move({
            from:
              sourceMove.from,
            to:
              sourceMove.to,
            promotion:
              sourceMove.promotion
              ||
              "q"
          });


        if (
          !move
        ) {
          break;
        }


        if (
          move.captured
        ) {

          const capturedColor =
            move.color ===
            "w"
              ? "b"
              : "w";


          capturedPieces[
            capturedColor
          ].push({
            type:
              move.captured,
            token:
              ++lastCaptureToken,
            color:
              capturedColor
          });

        }


        matchHistory.push({
          fen:
            game.fen(),
          san:
            move.san,
          captures:
            copyCaptures()
        });

      }


      autoplayMoveIndex =
        limit;


      activeClock =
        game.turn();


      renderBoard();


      renderCapturedPieces(
        null,
        capturedPieces,
        true,
        true
      );


      updateAutoplayInfo();


      updateStatus();

    }


    function autoplayGoTo(
      targetIndex,
      showResult =
        false
    ) {

      rebuildAutoplayPosition(
        targetIndex
      );


      if (
        showResult
        &&

          "stop"
        );

      }


      if (
        selectedGame
      ) {

        autoplayGame =
          selectedGame;

      }

      else {

        const pool =
          famousGamesWithPgn.filter(
            item =>
              item &&
              typeof item.pgn ===
              "string" &&
              item.pgn.trim()
          );


        if (
          pool.length ===
          0
        ) {

          autoplayGameTitle.textContent =
            "autoplay unavailable";


          autoplayGameDetail.textContent =
            "No famous-game PGNs were found.";


          updateModeUI();


          return;

        }


        let next =
          pool[
            Math.floor(
              Math.random() *
              pool.length
            )
          ];


        if (
          pool.length >
          1 &&
          autoplayGame &&
          next.id ===
          autoplayGame.id
        ) {

          next =
            pool[
              (
                pool.findIndex(
                  item =>
                    item.id ===
                    next.id
                )
                +
                1
              )
              %
              pool.length
            ];

        }


        autoplayGame =
          next;

      }


      const replay =
        new Chess();


      try {

        replay.loadPgn(
          autoplayGame.pgn
        );

      }

      catch (
        error
      ) {

        console.error(
          "Could not load autoplay PGN:",

      event
    ) {

      if (
        reviewing ||
        timerFinished ||
        botThinking ||
        gameMode ===

      ) {

      }


      if (
        gameMode ===

        game.turn() !==
        humanColor

      const squareElement =
        event.target.closest(
          ".square"

      if (
        !squareElement ||
        !boardElement.contains(
          squareElement
        )
      ) {
        return;
      }


      const squareName =
        squareElement.dataset.square;


      const clickedPiece =
        game.get(
          squareName
        );


      if (
        !selected
      ) {

        if (
          clickedPiece &&
          clickedPiece.color ===
          game.turn()
        ) {

          const pieceElement =
            squareElement.querySelector(
              ".piece"
            );


          if (
            pieceElement
          ) {

            selectPiece(
              squareName,
              pieceElement,
              event
            );

          }

        }


        return;

      }


      if (
        squareName ===
        selected.from
      ) {

        cancelSelection();

        return;

      }


      const destinationMoves =
        game.moves({
          square:
            selected.from,
          verbose:
            true
        }).filter(
          move =>
            move.to ===
            squareName
        );


      if (
        destinationMoves.length >
        0
      ) {

        const from =
          selected.from;


        const movingPiece =
          game.get(
            from
          );


        const promotionMoves =
          destinationMoves.filter(
            move =>
              Boolean(
                move.promotion
              )
          );


        const releaseX =
          event.clientX;


        const releaseY =
          event.clientY;


        cancelSelection();


        let promotion =
          "q";

          promotionMoves.length >
          0
        ) {

          promotion =
            await choosePromotion(
              movingPiece
                ? movingPiece.color

            );

        attemptMove(
          from,
          squareName,
          releaseX,
          releaseY,

    const WIN_IMAGE_MIN_LONG_SIDE = 1800;
    const WIN_IMAGE_MIN_SHORT_SIDE = 1200;

    let lastWinImageIndex =
      -1;

    function testWinImage(
      item
    ) {
      return new Promise(
        resolve => {
          const image = new Image();
          image.onload = () => {
            const longSide = Math.max(image.naturalWidth, image.naturalHeight);
            const shortSide = Math.min(image.naturalWidth, image.naturalHeight);
            resolve(longSide >= WIN_IMAGE_MIN_LONG_SIDE && shortSide >= WIN_IMAGE_MIN_SHORT_SIDE);
          };
          image.onerror = () => resolve(false);
          image.src = item.src;
        }
      );
    }


    async function chooseWinImage() {
      const indexes = WIN_IMAGES.map((_, index) => index);

      for (let i = indexes.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indexes[i], indexes[j]] = [indexes[j], indexes[i]];
      }

      if (indexes.length > 1 && indexes[0] === lastWinImageIndex) {
        [indexes[0], indexes[1]] = [indexes[1], indexes[0]];
      }

      for (const index of indexes) {
        const item = WIN_IMAGES[index];
        if (await testWinImage(item)) {
          lastWinImageIndex = index;
          return item;
        }
      }

      lastWinImageIndex = 0;
      return WIN_IMAGES[0];
    }

    function attemptMove(
      from,
      to,
      clientX,
      clientY,
      promotion =
        "q"
    ) {

      const movingPiece =
        game.get(
          from
        );


      const landing =
        dropPlacementFor(
          to,
          clientX,
          clientY
        );


      let move =
        null;


      try {

        move =
          game.move({
            from,
            to,
            promotion
          });

      }

      catch (
        error
      ) {

        move =
          null;

      }


      if (
        !move
      ) {
        return false;
      }


      pieceRestingPositions.delete(
        from
      );


      pieceRestingPositions.delete(
        to
      );


      if (
        movingPiece
      ) {

        pieceRestingPositions.set(
          to,
          landing
        );

      }


      let captureToken =
        null;


      if (
        move.captured
      ) {

        captureToken =
          ++lastCaptureToken;


        const capturedColor =
          move.color ===
          "w"
            ? "b"
            : "w";


        capturedPieces[
          capturedColor
        ].push({
          type:
            move.captured,
          token:
            captureToken,
          color:
            capturedColor
        });

      }


      matchHistory.push({
        fen:
          game.fen(),

        san:
          move.san,

        captures:
          copyCaptures()
      });


      if (
        gameMode ===
        "local"
        &&
        !timerStarted
      ) {

        timerStarted =
          true;

      }


      activeClock =
        game.turn();


      lastTick =
        performance.now();


      renderBoard();


      renderCapturedPieces(
        captureToken
      );


      const droppedPiece =
        boardElement.querySelector(
          `[data-square="${to}"] .piece`
        );


      if (
        droppedPiece
      ) {

        droppedPiece.classList.add(
          "just-dropped"
        );


        window.setTimeout(
          () => {

            droppedPiece.classList.remove(
              "just-dropped"
            );

          },
          240
        );

      }


      if (
        game.isGameOver()
      ) {

        timerStarted =
          false;


        timerFinished =
          true;


        if (
          game.isCheckmate()
        ) {

          const winner =
            game.turn() ===
            "w"
              ? "b"
              : "w";


          showWin(
            winner,
            "by checkmate"
          );

        }

        else {

          let drawCondition =
            "draw";


          if (
            typeof game.isStalemate ===
            "function"
            &&
            game.isStalemate()
          ) {

            drawCondition =
              "by stalemate";

          }

          else if (
            typeof game.isThreefoldRepetition ===
            "function"
            &&
            game.isThreefoldRepetition()
          ) {

            drawCondition =
              "by repetition";

          }

          else if (
            typeof game.isInsufficientMaterial ===
            "function"
            &&
            game.isInsufficientMaterial()
          ) {

            drawCondition =
              "by insufficient material";

          }

          else if (
            typeof game.isDrawByFiftyMoves ===
            "function"
            &&
            game.isDrawByFiftyMoves()
          ) {

            drawCondition =
              "by fifty-move rule";

          }


          showWin(
            "draw",
            drawCondition
          );

        }

      }


      if (
        gameMode ===
        "bot"
        &&
        !game.isGameOver()
        &&
        game.turn() ===
        botColor
      ) {

        window.setTimeout(
          maybeMakeBotMove,
          90
        );

      }


      return true;

    }

      else if (

      }

      else if (
        game.isThreefoldRepetition()
      ) {

        status =
          "draw — repetition";

      }

      else if (
        game.isInsufficientMaterial()
      ) {

        status =
          "draw — insufficient material";

      }

      else if (
        game.isDrawByFiftyMoves()
      ) {

        status =
          "draw — fifty-move rule";

      }

      else if (
        game.isDraw()
      ) {

        status =
          "draw";

      }

      else {

        status =
          `${
            colorName(
              game.turn()
            )
          } to move`;


        if (
          game.inCheck()
        ) {

          status +=
            " — check";

        }

      }


      statusElement.textContent =
        status;

    function formatTime(
      milliseconds
    ) {

      const safe =
        Math.max(
          0,
          milliseconds
        );


      const totalSeconds =
        Math.ceil(
          safe /
          1000
        );


      const minutes =
        Math.floor(
          totalSeconds /
          60
        );


      const seconds =
        totalSeconds %
        60;


      return (
        `${minutes}:${
          String(
            seconds
          ).padStart(
            2,
            "0"
          )
        }`
      );

    }

    function tickClock() {

      const now =
        performance.now();


      if (
        gameMode ===
        "local" &&
        timerStarted &&
        !timerFinished &&
        !game.isGameOver() &&
        !reviewing
      ) {

        const elapsed =
          now -
          lastTick;


        if (
          activeClock ===
          "w"
        ) {

          whiteTime -=
            elapsed;


          if (
            whiteTime <=
            0
          ) {

            whiteTime =
              0;


            stopOnTime(
              "w"
            );

          }

        }

        else {

          blackTime -=
            elapsed;


          if (
            blackTime <=
            0
          ) {

            blackTime =
              0;


            stopOnTime(
              "b"
            );

          }

        }

      }


      lastTick =
        now;


      updateClocks();

    }


    function setClockMinutes() {

      if (
        reviewing
      ) {
        return;
      }


      const parsed =
        Number(
          timeInput.value
        );


      if (
        !Number.isFinite(
          parsed
        )
        ||
        parsed <=
        0
      ) {

        timeInput.value =
          String(
            startingMinutes
          );


        return;

      }


      startingMinutes =
        parsed;


      whiteTime =
        parsed *
        60 *
        1000;


      blackTime =
        parsed *
        60 *
        1000;


      timerStarted =
        false;


      timerFinished =
        false;


      matchWinner =
        null;


      activeClock =
        game.turn();


      lastTick =
        performance.now();


      cancelSelection();


      hideResultUI();


      updateStatus();


      updateClocks();

    }
