<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>keegan.biz</title>

  <!-- Existing sitewide colors, layout, and scarf navigation -->
  <link rel="stylesheet" href="/assets/site.css">
  <!-- Homepage-specific layout -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page-shell" id="page-shell">
    <!-- Populated by the existing /assets/site-nav.js -->
    <nav data-site-nav></nav>

    <main class="home">
      <section class="hero" aria-labelledby="home-title">
        <div class="welcome-slot">
          <span class="welcome-word">Welcome</span>
        </div>
        <h1 class="site-title" id="home-title">to keegan.biz</h1>

        <figure class="home-illustration">
          <img
            src="/illustration/group-03.webp"
            alt="Loose black-ink drawing of a crowded pub interior, with people talking and drinking."
            fetchpriority="high"
            decoding="async"
          >
        </figure>
      </section>
    </main>
  </div>

  <!-- Keep the site's existing scarf links and unfinished-page popup. -->
  <script src="/assets/site-nav.js" defer></script>
</body>
</html>
