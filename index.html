  <script>
  (() => {

    /* =====================================================
       HELPERS
       ===================================================== */

    const clamp = (value, min, max) =>
      Math.min(Math.max(value, min), max);

    const lerp = (a, b, t) =>
      a + ((b - a) * t);

    const random = (min, max) =>
      min + Math.random() * (max - min);

    const pick = array =>
      array[Math.floor(Math.random() * array.length)];


    function shuffle(array) {

      const copy = [...array];

      for (
        let i = copy.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }

      return copy;

    }


    function differentIndex(
      length,
      current
    ) {

      let next;

      do {

        next =
          Math.floor(
            Math.random() * length
          );

      }
      while (
        length > 1 &&
        next === current
      );

      return next;

    }


    function smoothStep(value) {

      const t =
        clamp(value, 0, 1);

      return (
        t *
        t *
        (3 - (2 * t))
      );

    }

    let greetingIndex = 0;
    let welcomeColorIndex = 1;

    function fitWelcome() {

      welcomeWord.style.fontSize = "";

      const available =
        welcomeWord
          .parentElement
          .clientWidth;

      let size =
        parseFloat(
          getComputedStyle(
            welcomeWord
          ).fontSize
        );

      while (
        welcomeWord.scrollWidth >
        available &&
        size > 27
      ) {

        size -= 2;

        welcomeWord.style.fontSize =
          `${size}px`;

      }

    }


    function changeGreeting() {

      if (greetingBusy) {
        return;
      }

      greetingBusy = true;

      const nextGreeting =
        differentIndex(
          greetings.length,
          greetingIndex
        );

      const nextColor =
        differentIndex(
          welcomeColors.length,
          welcomeColorIndex
        );

      welcomeWord.classList.add(
        "is-fading"
      );

      window.setTimeout(() => {

        greetingIndex =
          nextGreeting;

        welcomeColorIndex =
          nextColor;

        welcomeWord.textContent =
          greetings[greetingIndex];

        welcomeWord.style.color =
          welcomeColors[
            welcomeColorIndex
          ];

        fitWelcome();

        welcomeWord.classList.remove(
          "is-fading"
        );

        window.setTimeout(() => {

          greetingBusy =
            false;

        }, 300);

      }, 250);

    }


    welcomeWord.style.color =
      welcomeColors[

    fitWelcome();

    window.addEventListener(

    /* =====================================================
       PRELOAD
       ===================================================== */

    let sessionTextures = [];
    let readyTextures = [];
    let recentTextures = [];


    function markTextureReady(src) {

      if (
        !readyTextures.includes(
          src
        )
      ) {

        readyTextures.push(
          src
        );

      }

    }


    function prepareTextures() {

      sessionTextures =
        shuffle(
          ALL_TEXTURES
        ).slice(
          0,
          isMobile() ? 20 : 28
        );

      readyTextures = [];

      sessionTextures.forEach(src => {

        const image =
          new Image();

        image.decoding =
          "async";

        image.onload =
          () => {

            markTextureReady(
              src
            );

          };

        image.src =
          src;

        if (
          typeof image.decode ===
          "function"
        ) {

          image
            .decode()
            .then(() => {

              markTextureReady(
                src
              );

            })
            .catch(() => {});

        }

      });

    }


    function chooseTexture() {

      const pool =
        readyTextures.length >= 6
          ? readyTextures
          : sessionTextures;

      let selected;
      let tries = 0;

      do {

        selected =
          pick(pool);

        tries++;

      }
      while (
        recentTextures.includes(
          selected
        ) &&
        tries < 16
      );

      recentTextures.push(
        selected
      );

      if (
        recentTextures.length > 8
      ) {

        recentTextures.shift();

      }

      return selected;

    }


    /* =====================================================
       COLLAGE NEUTRALS
       ===================================================== */

    const MONO_PALETTES = [

      [
        "#080706",
        "#555047",
        "#e9e1d4"
      ],

      [
        "#14120f",
        "#6a6258",

      ],

      ],

        "#80776a",

    let monoPaletteIndex = 0;


    function nextMonoPalette() {

      monoPaletteIndex =
        differentIndex(
          MONO_PALETTES.length,
          monoPaletteIndex
        );

      return MONO_PALETTES[
        monoPaletteIndex

    }


    /* =====================================================

       The numbers are filter targets rather than
       screen-neon hues.

       Burnt sienna
       forest green
       ocean blue
       canyon red
       dirt brown
       pale sage
       blueberry blue
       ===================================================== */

    const HORSE_COLORS = [

      {
        name: "burnt sienna",
        hue: -6,
        saturation: 3.6,
        brightness: 0.94
      },

      {
        name: "forest green",
        hue: 72,
        saturation: 2.5,
        brightness: 0.78
      },

      {
        name: "ocean blue",
        hue: 160,
        saturation: 2.7,

    let horseColorIndex = 0;


    function nextHorseColor() {

      horseColorIndex =
        differentIndex(
          HORSE_COLORS.length,
          horseColorIndex
        );

      return HORSE_COLORS[
        horseColorIndex
      ];

    }


    /* =====================================================
       BLEND MODES
       ===================================================== */

    const DESKTOP_UNDER_BLEND = [

      "multiply",
      "multiply",
      "multiply",

      "color-burn",
      "color-burn",

      "overlay",
      "overlay",

      "soft-light",

      "hard-light",

      "screen"

    ];


    const DESKTOP_OVER_BLEND = [

      "multiply",
      "multiply",

      "color-burn",
      "color-burn",

      "hard-light",
      "hard-light",

      "difference",

      "exclusion",

      "overlay",

      "screen"

    ];


    const DESKTOP_INTERNAL_BLEND = [

      "multiply",
      "multiply",

      "color-burn",

      "overlay",

      "soft-light",

      "hard-light"

    ];


    /*
      Mobile is intentionally calmer.

      No difference.
      No exclusion.
      Almost no aggressive burns.
    */

    const MOBILE_UNDER_BLEND = [

      "multiply",
      "multiply",
      "multiply",

      "soft-light",
      "soft-light",

      "overlay",
      "overlay",

      "hard-light"
    ];


    const MOBILE_OVER_BLEND = [

      "multiply",
      "multiply",

      "soft-light",
      "soft-light",

      "overlay",
      "overlay",

      "hard-light"
    ];


    const MOBILE_INTERNAL_BLEND = [

      "multiply",
      "multiply",

      "soft-light",
      "soft-light",

      "overlay",

      "hard-light"
    ];


    const DESKTOP_HORSE_BLEND = [

      "multiply",
      "multiply",

      "overlay",

      "hard-light",

      "screen",

      "color-burn"
    ];


    const MOBILE_HORSE_BLEND = [

      "multiply",
      "multiply",

      "overlay",

    ];


    function underBlendPool() {

      return isMobile()
        ? MOBILE_UNDER_BLEND

    }


    function overBlendPool() {

      return isMobile()
        ? MOBILE_OVER_BLEND
        : DESKTOP_OVER_BLEND;

    }


    function internalBlendPool() {

      return isMobile()
        ? MOBILE_INTERNAL_BLEND
        : DESKTOP_INTERNAL_BLEND;

    }


    function horseBlendPool() {

      return isMobile()
        ? MOBILE_HORSE_BLEND
        : DESKTOP_HORSE_BLEND;

    }


    /* =====================================================
       SLOT FACTORY
       ===================================================== */

    function makeSlot(
      id,
      options
    ) {

      const element =
        document.getElementById(
          id
        );

      const frames =
        Array.from(
          element.querySelectorAll(
            ".morph-frame"
          )
        );

      return {

        frames,

        active: 0,

        isColor:
          options.isColor || false,

        isOver:
          options.isOver || false,

        slowFade:
          options.slowFade,

        fastFade:
          options.fastFade,

        phase:
          options.phase || 0,

        nextChange:
          Infinity,

        startTimer:
          null

      };

    }


    const slots = [

      makeSlot(
        "under-slot-1",
        {
          isOver: false,

          slowFade: 10.5,
          fastFade: 1.55,

          phase: 0.2
        }
      ),

      makeSlot(
        "under-slot-2",

          isOver: false,

          slowFade: 12,
          fastFade: 1.8,

          phase: 1.7

    /* =====================================================
       NEUTRAL TEXTURE
       ===================================================== */

    function neutralGradient(
      palette
    ) {

      return `
        linear-gradient(
          ${random(0, 360)}deg,
          ${palette[0]} 0%,
          ${palette[1]} 48%,
          ${palette[2]} 100%
        )
      `;

    }


    function configureTextureFrame(
      frame,
      intensity,
      isOver
    ) {

      const src =
        chooseTexture();

      const palette =
        nextMonoPalette();

      frame.style.backgroundImage =
        `
          ${neutralGradient(palette)},
          url("${src}")
        `;

      frame.style.backgroundSize =
        "cover, cover";

      frame.style.backgroundPosition =
        `
          center,
          ${random(10, 90)}%
          ${random(10, 90)}%
        `;

      frame.style.backgroundRepeat =
        "no-repeat, no-repeat";

      frame.style.backgroundBlendMode =
        `
          ${pick(
            internalBlendPool()
          )},
          normal
        `;

      frame.style.mixBlendMode =
        pick(
          isOver
            ? overBlendPool()
            : underBlendPool()
        );


      /*
        Smaller distortion on mobile.
      */

      const rotationRange =
        isMobile()
          ? 1.6
          : 3.5;

      const translationRange =
        isMobile()
          ? 1.5
          : 3;

      const scaleMin =
        isMobile()
          ? 1.05
          : 1.07;

      const scaleMax =
        isMobile()
          ? 1.20
          : 1.34;


      frame.style.transform =
        `
          translate(
            ${random(
              -translationRange,
              translationRange
            )}%,
            ${random(
              -translationRange,
              translationRange
            )}%
          )
          rotate(
            ${random(
              -rotationRange,
              rotationRange
            )}deg
          )
          scale(
            ${random(
              scaleMin,
              scaleMax
            )}
          )
        `;


      /*
        Mobile contrast is deliberately softer.
      */

      if (
        isMobile()
      ) {

        frame.style.filter =
          `
            grayscale(1)
            saturate(0)
            contrast(
              ${random(1.02, 1.38)}
            )
            brightness(
              ${random(0.84, 1.10)}
            )
          `;

      }

      else {

        frame.style.filter =
          `
            grayscale(1)
            saturate(0)
            contrast(
              ${random(1.08, 1.82)}
            )
            brightness(
              ${random(0.72, 1.14)}
            )
            sepia(
              ${random(0, 0.08)}
            )
          `;

      }


      let opacity;


      if (
        isMobile()
      ) {

        if (isOver) {

          opacity =
            random(
              0.04,
              lerp(
                0.12,
                0.24,
                intensity
              )
            );

        }

        else {

          opacity =
            random(
              0.20,
              lerp(
                0.42,
                0.60,
                intensity
              )
            );

        }

      }

      else if (isOver) {

        opacity =
          random(
            lerp(
              0.07,
              0.14,
              intensity
            ),
            lerp(
              0.18,
              0.36,
              intensity
            )
          );

      }

      else {

        opacity =
          random(
            lerp(
              0.24,
              0.36,
              intensity
            ),
            lerp(
              0.50,
              0.72,
              intensity
            )
          );

      }


      frame.dataset.targetOpacity =
        opacity.toFixed(3);

    }


    /* =====================================================
       NEUTRAL WASH
       ===================================================== */

    function configureColorFrame(
      frame,
      intensity,
      isOver
    ) {

      const palette =
        nextMonoPalette();

      const dark =
        palette[0];

      const mid =
        palette[1];

      const light =
        palette[2];

      const type =
        Math.floor(
          Math.random() * 4
        );


      if (type === 0) {

        frame.style.background =
          `
            linear-gradient(
              ${random(0, 360)}deg,
              ${dark},
              ${mid},
              ${light}
            )
          `;

      }

      else if (type === 1) {

        frame.style.background =
          `
            radial-gradient(
              circle at
              ${random(10, 90)}%
              ${random(10, 90)}%,
              ${light},
              transparent 56%
            ),

            radial-gradient(
              circle at
              ${random(10, 90)}%
              ${random(10, 90)}%,
              ${mid},
              transparent 62%
            ),

            radial-gradient(
              circle at
              ${random(10, 90)}%
              ${random(10, 90)}%,
              ${dark},
              transparent 64%
            )
          `;

      }

      else if (type === 2) {

        frame.style.background =
          `
            conic-gradient(
              from
              ${random(0, 360)}deg
              at
              ${random(30, 70)}%
              ${random(30, 70)}%,
              ${dark},
              ${mid},
              ${light},
              ${dark}
            )
          `;

      }

      else {

        frame.style.background =
          `
            linear-gradient(
              ${random(0, 360)}deg,
              ${dark} 0%,
              transparent 32%,
              ${mid} 52%,
              transparent 72%,
              ${light} 100%
            )
          `;

      }


      frame.style.mixBlendMode =
        pick(
          isOver
            ? overBlendPool()
            : underBlendPool()
        );


      frame.style.filter =
        `
          grayscale(1)
          saturate(0)
          contrast(
            ${
              isMobile()
                ? random(1.0, 1.18)
                : random(1.0, 1.4)
            }
          )
        `;


      frame.style.transform =
        `
          rotate(
            ${
              isMobile()
                ? random(-1, 1)
                : random(-3, 3)
            }deg
          )
          scale(
            ${
              isMobile()
                ? random(1.01, 1.08)
                : random(1.02, 1.16)
            }
          )
        `;


      const opacity =
        isMobile()
          ? (
              isOver
                ? random(
                    0.01,
                    lerp(
                      0.04,
                      0.09,
                      intensity
                    )
                  )
                : random(
                    0.02,
                    lerp(
                      0.06,
                      0.12,
                      intensity
                    )
                  )
            )
          : (
              isOver
                ? random(
                    0.02,
                    lerp(
                      0.06,
                      0.15,
                      intensity
                    )
                  )
                : random(
                    0.03,
                    lerp(
                      0.08,
                      0.18,
                      intensity
                    )
                  )
            );


      frame.dataset.targetOpacity =
        opacity.toFixed(3);

    }


    /* =====================================================
       INITIALIZE SLOT
       ===================================================== */

    function initializeSlot(
      slot,
      intensity,
      time
    ) {

      slot.frames.forEach(
        frame => {

          if (
            frame._fadeTimer
          ) {

            clearTimeout(
              frame._fadeTimer
            );

            frame._fadeTimer =
              null;

          }

          frame.style.transitionDuration =
            "0s";

          frame.style.opacity =
            "0";

        }
      );


      const first =
        slot.frames[0];


      if (
        slot.isColor
      ) {

        configureColorFrame(
          first,
          intensity,
          slot.isOver
        );

      }

      else {

        configureTextureFrame(
          first,
          intensity,
          slot.isOver
        );

      }


      const fadeDuration =
        slot.slowFade;

      const initialDelay =
        slot.phase * 0.45;


      first.style.transitionDuration =
        `${fadeDuration}s`;

      slot.active = 0;


      slot.startTimer =
        window.setTimeout(
          () => {

            if (
              !overlayOpen ||
              normalState
            ) {

              return;

            }

            first.offsetHeight;

            requestAnimationFrame(() => {

              first.style.opacity =
                first.dataset.targetOpacity;

            });

          },
          initialDelay * 1000
        );


      slot.nextChange =
        time +
        initialDelay +
        (
          fadeDuration *
          0.62
        );

    }


    /* =====================================================
       CONTINUOUS MORPH
       ===================================================== */

    function morphSlot(
      slot,
      intensity,
      time
    ) {

      const outgoing =
        slot.frames[
          slot.active
        ];

      const incomingIndex =
        (
          slot.active + 1
        )
        %
        slot.frames.length;

      const incoming =
        slot.frames[
          incomingIndex
        ];


      if (
        incoming._fadeTimer
      ) {

        clearTimeout(
          incoming._fadeTimer
        );

        incoming._fadeTimer =
          null;

      }


      let fadeDuration =
        lerp(
          slot.slowFade,
          slot.fastFade,
          intensity
        );


      /*
        Mobile remains fluid but doesn't accelerate
        quite as violently.
      */

      if (
        isMobile()
      ) {

        fadeDuration =
          Math.max(
            fadeDuration,
            1.8
          );

      }


      incoming.style.transitionDuration =
        `${fadeDuration}s`;

      outgoing.style.transitionDuration =
        `${fadeDuration}s`;

      incoming.style.opacity =
        "0";


      if (
        slot.isColor
      ) {

        configureColorFrame(
          incoming,
          intensity,
          slot.isOver
        );

      }

      else {

        configureTextureFrame(
          incoming,
          intensity,
          slot.isOver
        );

      }


      incoming.offsetHeight;


      requestAnimationFrame(() => {

        incoming.style.opacity =
          incoming.dataset.targetOpacity;

      });


      const fadeOutDelay =
        fadeDuration *
        random(
          0.28,
          0.42
        );


      if (
        outgoing._fadeTimer
      ) {

        clearTimeout(
          outgoing._fadeTimer
        );

      }


      outgoing._fadeTimer =
        window.setTimeout(
          () => {

            outgoing.style.opacity =
              "0";

            outgoing._fadeTimer =
              null;

          },
          fadeOutDelay * 1000
        );


      slot.active =
        incomingIndex;


      const overlap =
        lerp(
          0.62,
          isMobile() ? 0.54 : 0.50,
          intensity
        );


      slot.nextChange =
        time +
        (
          fadeDuration *
          overlap *
          random(
            0.92,
            1.08
          )
        );

    }


    /* =====================================================
       HORSE COLOR
       ===================================================== */

    let nextHorseChange =
      Infinity;


    function changeHorse(
      intensity,
      time
    ) {

      const color =
        nextHorseColor();


      const transition =
        lerp(
          5.2,
          isMobile() ? 1.7 : 1.0,
          intensity
        );


      horseMain.style.transitionDuration =
        `${transition}s`;

      horseOffset.style.transitionDuration =
        `${transition}s`;

      horseKey.style.transitionDuration =
        `${transition}s`;


      horseMain.style.mixBlendMode =
        pick(
          horseBlendPool()
        );


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(
            ${
              color.saturation *
              random(
                0.90,
                1.15
              )
            }
          )
          hue-rotate(
            ${
              color.hue +
              random(-5, 5)
            }deg
          )
          contrast(
            ${
              isMobile()
                ? random(1.08, 1.28)
                : random(1.10, 1.42)
            }
          )
          brightness(
            ${
              color.brightness *
              random(
                0.96,
                1.04
              )
            }
          )
        `;


      horseMain.style.opacity =
        isMobile()
          ? random(0.88, 1)
          : random(0.80, 0.98);


      /*
        Secondary print plate stays related
        to main pigment rather than becoming
        a completely different color.
      */

      horseOffset.style.mixBlendMode =
        pick(
          isMobile()
            ? [
                "multiply",
                "multiply",
                "overlay",
                "soft-light"
              ]
            : [
                "multiply",
                "overlay",
                "hard-light",
                "screen"
              ]
        );


      horseOffset.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(
            ${
              color.saturation *
              random(
                1.0,
                1.3
              )
            }
          )
          hue-rotate(
            ${
              color.hue +
              random(
                -9,
                9
              )
            }deg
          )
          contrast(
            ${
              isMobile()
                ? random(1.05, 1.22)
                : random(1.08, 1.48)
            }
          )
          brightness(
            ${color.brightness}
          )
        `;


      horseOffset.style.opacity =
        isMobile()
          ? random(
              0.02,
              lerp(
                0.06,
                0.14,
                intensity
              )
            )
          : random(
              0.03,
              lerp(
                0.12,
                0.28,
                intensity
              )
            );


      horseOffset.style.transform =
        `
          translate(
            ${
              isMobile()
                ? random(-1.5, 1.5)
                : random(-3, 3)
            }px,
            ${
              isMobile()
                ? random(-1.5, 1.5)
                : random(-3, 3)
            }px
          )
        `;


      horseKey.style.opacity =
        isMobile()
          ? lerp(
              0.12,
              0.22,
              intensity
            ).toFixed(3)
          : lerp(
              0.16,
              0.30,
              intensity
            ).toFixed(3);


      const interval =
        lerp(
          10,
          isMobile() ? 2.6 : 1.7,
          intensity
        );


      nextHorseChange =
        time +
        random(
          interval * 0.88,
          interval * 1.12
        );

    }


    function cleanColoredHorse() {

      const color =
        nextHorseColor();


      horseMain.style.transitionDuration =
        "2.5s";


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(
            ${color.saturation}
          )
          hue-rotate(
            ${color.hue}deg
          )
          contrast(1.18)
          brightness(
            ${color.brightness}
          )
        `;


      horseMain.style.opacity =
        "0";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";

    }


    function normalHorse() {

      horseMain.style.transitionDuration =
        "500ms";

      horseMain.style.mixBlendMode =
        "normal";

      horseMain.style.filter =
        "none";

      horseMain.style.opacity =
        "1";

      horseOffset.style.opacity =
        "0";

      horseKey.style.opacity =
        "0";

    }


    /* =====================================================
       TIMELINE
       ===================================================== */

    const HORSE_START =
      12;

    const HORSE_FULL =
      20;

    const COLLAGE_START =
      30;

    const NORMAL_TIME =
      243;


    function horseRevealAt(
      time
    ) {

      if (
        time <
        HORSE_START
      ) {

        return 0;

      }


      return smoothStep(
        (
          time -
          HORSE_START
        )
        /
        (
          HORSE_FULL -
          HORSE_START
        )
      );

    }


    function intensityAt(
      time
    ) {

      if (
        time <
        COLLAGE_START ||
        time >=
        NORMAL_TIME
      ) {

        return 0;

      }


      if (
        time < 90
      ) {

        return lerp(
          0.08,
          0.28,
          (
            time -
            COLLAGE_START
          )
          /
          (
            90 -
            COLLAGE_START
          )
        );

      }


      if (
        time < 175
      ) {

        return lerp(
          0.28,
          0.55,
          (
            time -
            90
          )
          /
          85
        );

      }


      if (
        time < 220
      ) {

        return lerp(
          0.55,
          0.80,
          (
            time -
            175
          )
          /
          45
        );

      }


      return lerp(
        0.80,
        1,
        (
          time -
          220
        )
        /
        23
      );

    }


    /* =====================================================
       STATE
       ===================================================== */

    let overlayOpen = false;
    let collageStarted = false;
    let normalState = false;
    let horseColorStarted = false;

    let raf = null;


    function clearSlotTimers() {

      slots.forEach(slot => {

        if (
          slot.startTimer
        ) {

          clearTimeout(
            slot.startTimer
          );

          slot.startTimer =
            null;

        }


        slot.frames.forEach(
          frame => {

            if (
              frame._fadeTimer
            ) {

              clearTimeout(
                frame._fadeTimer
              );

              frame._fadeTimer =
                null;

            }

          }
        );

      });

    }


    function clearSlots(
      instant = true
    ) {

      clearSlotTimers();


      slots.forEach(slot => {

        slot.nextChange =
          Infinity;


        slot.frames.forEach(
          frame => {

            frame.style.transitionDuration =
              instant
                ? "0s"
                : "500ms";


            frame.style.opacity =
              "0";

          }
        );

      });

    }


    function startCollage(
      time,
      intensity
    ) {

      if (
        collageStarted
      ) {

        return;

      }


      collageStarted =
        true;


      slots.forEach(
        slot => {

          initializeSlot(
            slot,
            intensity,
            time
          );

        }
      );


      nextHorseChange =
        time + 3;

    }


    function enterNormalState() {

      if (
        normalState
      ) {

        return;

      }


      normalState =
        true;


      clearSlots(
        false
      );


      normalHorse();


      stage.classList.add(
        "is-normal"
      );

    }


    /* =====================================================
       LOOP
       ===================================================== */

    function visualLoop() {

      if (
        !overlayOpen
      ) {

        return;

      }


      const time =
        audio.currentTime || 0;


      const reveal =
        horseRevealAt(
          time
        );


      stage.style.setProperty(
        "--visual-reveal",
        reveal.toFixed(4)
      );


      if (
        time <
        HORSE_START
      ) {

        raf =
          requestAnimationFrame(
            visualLoop
          );

        return;

      }


      if (
        !horseColorStarted
      ) {

        horseColorStarted =
          true;

        cleanColoredHorse();

      }


      if (
        time <
        COLLAGE_START
      ) {

        horseMain.style.opacity =
          reveal.toFixed(3);


        raf =
          requestAnimationFrame(
            visualLoop
          );

        return;

      }


      if (
        time >=
        NORMAL_TIME
      ) {

        enterNormalState();


        raf =
          requestAnimationFrame(
            visualLoop
          );

        return;

      }


      const intensity =
        intensityAt(
          time
        );


      if (
        !collageStarted
      ) {

        startCollage(
          time,
          intensity
        );


        changeHorse(
          intensity,
          time
        );

      }


      slots.forEach(slot => {

        if (
          time >=
          slot.nextChange
        ) {

          morphSlot(
            slot,
            intensity,
            time
          );

        }

      });


      if (
        time >=
        nextHorseChange
      ) {

        changeHorse(
          intensity,
          time
        );

      }


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       OPEN
       ===================================================== */

    async function openWip() {

      if (
        overlayOpen
      ) {

        return;

      }


      overlayOpen =
        true;

      collageStarted =
        false;

      normalState =
        false;

      horseColorStarted =
        false;

      recentTextures =
        [];


      monoPaletteIndex =
        Math.floor(
          Math.random() *
          MONO_PALETTES.length
        );


      horseColorIndex =
        Math.floor(
          Math.random() *
          HORSE_COLORS.length
        );


      nextHorseChange =
        Infinity;


      clearSlots(
        true
      );


      normalHorse();


      stage.classList.remove(
        "is-normal"
      );


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      prepareTextures();


      pageShell.classList.add(
        "is-hidden"
      );


      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.pause();

      audio.currentTime =
        0;

      audio.volume =
        0.72;


      try {

        await audio.play();

      }

      catch (error) {

        console.log(
          "Audio could not start:",
          error
        );

      }


      cancelAnimationFrame(
        raf
      );


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       CLOSE
       ===================================================== */

    function closeWip() {

      overlayOpen =
        false;


      cancelAnimationFrame(
        raf
      );


      clearSlots(
        true
      );


      audio.pause();

      audio.currentTime =
        0;


      normalHorse();


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      window.setTimeout(() => {

        pageShell.classList.remove(
          "is-hidden"
        );

      }, 160);

    }


    /* =====================================================
       LINKS
       ===================================================== */

    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );


        if (!link) {
          return;
        }


        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
          &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>
