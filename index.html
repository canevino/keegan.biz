<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>keegan.biz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell" id="pageShell">
    <!-- HOME SCARF -->
    <header class="site-header">
      <a class="home-scarf-link" href="index.html" aria-label="keegan.biz home">
        <img
          class="home-scarf-image"
          src="assets/home/home-scarf-update.png"
          alt="keegan.biz"
        />
      </a>
    </header>

    <!-- HOME CONTENT -->
    <main class="hero">
      <div class="hero-copy">
        <div class="welcome-wrap">
          <div
            class="welcome-rotator"
            id="welcomeRotator"
            aria-live="polite"
          >
            Fáilte
          </div>
        </div>

        <div class="hero-subline">to keegan.biz</div>
      </div>
    </main>

    <!-- SCARF MENU -->
    <nav class="scarf-rail" aria-label="Site sections">
      <button class="scarf-button" data-trigger-modal="illustration" type="button">
        <img src="assets/home/scarf-illustration.png" alt="Illustration" />
      </button>

      <button class="scarf-button" data-trigger-modal="photography" type="button">
        <img src="assets/home/scarf-photography.png" alt="Photography" />
      </button>

      <button class="scarf-button" data-trigger-modal="design" type="button">
        <img src="assets/home/scarf-design.png" alt="Graphic Design" />
      </button>

      <button class="scarf-button" data-trigger-modal="music" type="button">
        <img src="assets/home/scarf-music.png" alt="Music" />
      </button>

      <button class="scarf-button" data-trigger-modal="motion" type="button">
        <img src="assets/home/scarf-motion.png" alt="Motion" />
      </button>

      <button class="scarf-button" data-trigger-modal="misc" type="button">
        <img src="assets/home/scarf-misc.png" alt="Misc" />
      </button>

      <button class="scarf-button" data-trigger-modal="gastronomy" type="button">
        <img src="assets/home/scarf-gastronomy.png" alt="Gastronomy" />
      </button>
    </nav>
  </div>

  <!-- AUDIO -->
  <audio
    id="cricketsAudio"
    src="assets/home/crickets.mp3"
    preload="auto"
    playsinline
  ></audio>

  <!-- MODAL -->
  <div class="modal-shell" id="workModal" aria-hidden="true">
    <div class="modal-backdrop"></div>

    <!-- whole-screen background texture system -->
    <div class="modal-bg-layer modal-bg-layer--a"></div>
    <div class="modal-bg-layer modal-bg-layer--b"></div>
    <div class="modal-bg-color modal-bg-color--a"></div>
    <div class="modal-bg-color modal-bg-color--b"></div>

    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="workModalTitle">
      <div class="modal-note">
        <div class="modal-note__text" id="workModalTitle">
          sorry, i'm still working on this.
        </div>
        <button class="modal-close" id="modalClose" type="button" aria-label="Close">
          ×
        </button>
      </div>

      <div class="art-stage" id="artStage">
        <!-- underneath: always at least one visible -->
        <div class="stage-layer stage-layer--under js-stage-layer" data-layer="under-1"></div>
        <div class="stage-layer stage-layer--under js-stage-layer" data-layer="under-2"></div>
        <div class="stage-layer stage-layer--under js-stage-layer" data-layer="under-3"></div>

        <div class="stage-colorwash js-colorwash" data-colorwash="under-a"></div>
        <div class="stage-colorwash js-colorwash" data-colorwash="under-b"></div>

        <div class="horse-wrap" id="horseWrap">
          <img
            id="horseGif"
            class="horse-gif"
            src="assets/home/horse.gif"
            alt="Animated horse sketch"
          />
        </div>

        <!-- over the horse -->
        <div class="stage-layer stage-layer--over js-stage-layer" data-layer="over-1"></div>
        <div class="stage-layer stage-layer--over js-stage-layer" data-layer="over-2"></div>

        <div class="stage-colorwash js-colorwash" data-colorwash="over-a"></div>
        <div class="stage-colorwash js-colorwash" data-colorwash="over-b"></div>

        <div class="stage-grain"></div>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       WELCOME ROTATOR
       ========================================================= */

    const welcomeRotator = document.getElementById("welcomeRotator");

    const welcomes = [
      "Welcome",
      "Fáilte",
      "Benvenuti",
      "Bienvenidos",
      "Croeso",
      "Willkommen",
      "Bienvenue",
      "Bem-vindos",
      "Sveiki",
      "Ласкаво просимо",
      "Добро пожаловать",
      "خوش آمدید",
      "أهلاً وسهلاً",
      "स्वागत है",
      "Välkomin",
      "Ongi etorri",
      "Benvinguts",
      "歡迎",
      "ようこそ",
      "환영합니다",
      "ᏩᏙ",
      "Yá'át'ééh",
      "Karibu",
      "Mauya",
      "Welkom",
      "Aloha",
      "01010111 01100101 01101100 01100011 01101111 01101101 01100101",
      "☞︎♏︎●︎♍︎□︎❍︎♏︎"
    ];

    let welcomeIndex = 0;
    let welcomeTimer = null;

    function cycleWelcome() {
      welcomeRotator.classList.remove("is-in");
      welcomeRotator.classList.add("is-out");

      setTimeout(() => {
        welcomeIndex = (welcomeIndex + 1) % welcomes.length;
        welcomeRotator.textContent = welcomes[welcomeIndex];
        welcomeRotator.classList.remove("is-out");
        welcomeRotator.classList.add("is-in");
      }, 240);
    }

    welcomeRotator.classList.add("is-in");
    welcomeTimer = setInterval(cycleWelcome, 2200);


    /* =========================================================
       MODAL / AUDIO
       ========================================================= */

    const workModal = document.getElementById("workModal");
    const modalClose = document.getElementById("modalClose");
    const audio = document.getElementById("cricketsAudio");
    const pageShell = document.getElementById("pageShell");
    const scarfButtons = document.querySelectorAll("[data-trigger-modal]");
    const artStage = document.getElementById("artStage");
    const horseWrap = document.getElementById("horseWrap");
    const horseGif = document.getElementById("horseGif");

    const bgLayers = [
      document.querySelector(".modal-bg-layer--a"),
      document.querySelector(".modal-bg-layer--b")
    ];

    const bgColorLayers = [
      document.querySelector(".modal-bg-color--a"),
      document.querySelector(".modal-bg-color--b")
    ];

    const stageLayers = Array.from(document.querySelectorAll(".js-stage-layer"));
    const colorWashes = Array.from(document.querySelectorAll(".js-colorwash"));

    let modalIsOpen = false;
    let elapsedTimer = null;
    let stageStarted = false;
    let stageFullyVisible = false;
    let modalSeconds = 0;
    let stageIntensity = 0.18;
    let layerIntervals = [];
    let layerTimeouts = [];
    let horseInterval = null;
    let bgIntervals = [];
    let recentTextures = [];
    let recentBgTextures = [];
    let recentColors = [];


    scarfButtons.forEach((button) => {
      button.addEventListener("click", () => {
        openWorkModal();
      });
    });

    modalClose.addEventListener("click", closeWorkModal);

    workModal.addEventListener("click", (event) => {
      if (event.target === workModal || event.target.classList.contains("modal-backdrop")) {
        closeWorkModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modalIsOpen) {
        closeWorkModal();
      }
    });

    function openWorkModal() {
      if (modalIsOpen) return;

      modalIsOpen = true;
      workModal.setAttribute("aria-hidden", "false");
      workModal.classList.add("is-open");
      pageShell.classList.add("is-faded");

      resetVisualSystem();
      startAudio();
      startElapsedClock();
    }

    function closeWorkModal() {
      modalIsOpen = false;
      workModal.setAttribute("aria-hidden", "true");
      workModal.classList.remove("is-open");
      pageShell.classList.remove("is-faded");

      stopAudio();
      stopAllVisuals();
      resetVisualSystem();
    }

    function startAudio() {
      audio.currentTime = 0;
      audio.play().catch(() => {
        /* user interaction should cover this, but silently fail if needed */
      });
    }

    function stopAudio() {
      audio.pause();
      audio.currentTime = 0;
    }

    function startElapsedClock() {
      stopAllTimersOnly();

      elapsedTimer = setInterval(() => {
        modalSeconds += 1;
        updateTimeline();
      }, 1000);
    }

    function stopAllTimersOnly() {
      if (elapsedTimer) {
        clearInterval(elapsedTimer);
        elapsedTimer = null;
      }
    }

    function stopAllVisuals() {
      stopAllTimersOnly();

      layerIntervals.forEach(clearInterval);
      layerIntervals = [];

      layerTimeouts.forEach(clearTimeout);
      layerTimeouts = [];

      bgIntervals.forEach(clearInterval);
      bgIntervals = [];

      if (horseInterval) {
        clearInterval(horseInterval);
        horseInterval = null;
      }
    }

    function resetVisualSystem() {
      stopAllVisuals();

      modalSeconds = 0;
      stageStarted = false;
      stageFullyVisible = false;
      stageIntensity = 0.18;
      recentTextures = [];
      recentBgTextures = [];
      recentColors = [];

      workModal.classList.remove("stage-has-begun", "stage-is-full");
      artStage.style.opacity = "0";
      artStage.style.transform = "scale(0.985)";
      horseWrap.style.opacity = "0";

      stageLayers.forEach((layer) => {
        layer.style.opacity = "0";
        layer.style.backgroundImage = "none";
      });

      colorWashes.forEach((wash) => {
        wash.style.opacity = "0";
        wash.style.background = "none";
      });

      bgLayers.forEach((layer) => {
        layer.style.opacity = "0";
        layer.style.backgroundImage = "none";
      });

      bgColorLayers.forEach((layer) => {
        layer.style.opacity = "0";
        layer.style.background = "none";
      });

      horseGif.style.mixBlendMode = "multiply";
      horseGif.style.opacity = "0.55";
      horseGif.style.filter = "contrast(1.15) saturate(1.2) hue-rotate(0deg)";
    }

    function updateTimeline() {
      /* 0–8s: modal + note only */
      if (modalSeconds >= 9 && !stageStarted) {
        stageStarted = true;
        workModal.classList.add("stage-has-begun");
        fadeStageIn();
        startBackgroundSystem();
        startStageSystem();
      }

      /* build up */
      if (modalSeconds >= 45) {
        stageIntensity = 0.58;
      }

      if (modalSeconds >= 71 && !stageFullyVisible) {
        stageFullyVisible = true;
        workModal.classList.add("stage-is-full");
        horseWrap.style.opacity = "1";
        stageIntensity = 0.82;
      }

      /* tense / intense */
      if (modalSeconds >= 160) {
        stageIntensity = 0.95;
      }

      if (modalSeconds >= 220) {
        stageIntensity = 1.0;
      }

      /* back down / normalize at 4:03 */
      if (modalSeconds >= 243) {
        stageIntensity = 0.28;
      }
    }

    function fadeStageIn() {
      artStage.style.opacity = "1";
      artStage.style.transform = "scale(1)";
    }


    /* =========================================================
       TEXTURE SYSTEM
       ========================================================= */

    const texturePool = [
      "assets/home/Texturelabs_Atmosphere_121S.jpg",
      "assets/home/Texturelabs_Atmosphere_127S.jpg",
      "assets/home/Texturelabs_Atmosphere_130S.jpg",
      "assets/home/Texturelabs_Atmosphere_135S.jpg",
      "assets/home/Texturelabs_Atmosphere_201S.jpg",

      "assets/home/Texturelabs_Brick_124S.jpg",
      "assets/home/Texturelabs_Brick_158S.jpg",

      "assets/home/Texturelabs_Concrete_150S.jpg",
      "assets/home/Texturelabs_Concrete_155S.jpg",
      "assets/home/Texturelabs_Concrete_179S.jpg",
      "assets/home/Texturelabs_Concrete_205S.jpg",
      "assets/home/Texturelabs_Concrete_207S.jpg",

      "assets/home/Texturelabs_Fabric_123S.jpg",
      "assets/home/Texturelabs_Fabric_144S.jpg",
      "assets/home/Texturelabs_Fabric_172S.jpg",

      "assets/home/Texturelabs_Film_181S.jpg",
      "assets/home/Texturelabs_Film_183S.jpg",
      "assets/home/Texturelabs_Film_187S.jpg",

      "assets/home/Texturelabs_Glass_134S.jpg",
      "assets/home/Texturelabs_Glass_155S.jpg",

      "assets/home/Texturelabs_Grunge_173S.jpg",
      "assets/home/Texturelabs_Grunge_279L.jpg",
      "assets/home/Texturelabs_Grunge_334S.jpg",
      "assets/home/Texturelabs_Grunge_341S.jpg",

      "assets/home/Texturelabs_InkPaint_126S.jpg",
      "assets/home/Texturelabs_InkPaint_320S.jpg",
      "assets/home/Texturelabs_InkPaint_332S.jpg",
      "assets/home/Texturelabs_InkPaint_356S.jpg",

      "assets/home/Texturelabs_LensFX_251S.jpg",
      "assets/home/Texturelabs_LensFX_256S.jpg",

      "assets/home/Texturelabs_Metal_129S.jpg",
      "assets/home/Texturelabs_Metal_165S.jpg",
      "assets/home/Texturelabs_Metal_285S.jpg",
      "assets/home/Texturelabs_Metal_294S.jpg",

      "assets/home/Texturelabs_Paper_273S.jpg",
      "assets/home/Texturelabs_Paper_278L.jpg",
      "assets/home/Texturelabs_Paper_280S.jpg",
      "assets/home/Texturelabs_Paper_286S.jpg",
      "assets/home/Texturelabs_Paper_303S.jpg",
      "assets/home/Texturelabs_Paper_324S.jpg",
      "assets/home/Texturelabs_Paper_380L.jpg",
      "assets/home/Texturelabs_Paper_380S.jpg",

      "assets/home/Texturelabs_Sky_171S.jpg",

      "assets/home/Texturelabs_Soil_146S.jpg",
      "assets/home/Texturelabs_Soil_149S.jpg",

      "assets/home/Texturelabs_Stone_167S.jpg",
      "assets/home/Texturelabs_Stone_169S.jpg",

      "assets/home/Texturelabs_Water_124S.jpg",
      "assets/home/Texturelabs_Water_141S.jpg",

      "assets/home/Texturelabs_Wood_135S.jpg",
      "assets/home/Texturelabs_Wood_280S.jpg",
      "assets/home/Texturelabs_Wood_290S.jpg"
    ];

    const weightedDirtyTextures = texturePool.filter((src) =>
      /Grunge|Concrete|Metal|Film|InkPaint|Paper|Stone|Soil|Wood/i.test(src)
    );

    const weightedVividTextures = texturePool.filter((src) =>
      /Atmosphere|LensFX|Water|Glass|InkPaint|Film/i.test(src)
    );

    const horseBlendModes = [
      "multiply",
      "overlay",
      "hard-light",
      "screen",
      "difference",
      "color-dodge",
      "color-burn",
      "exclusion"
    ];

    const underBlendModes = [
      "multiply",
      "overlay",
      "hard-light",
      "soft-light",
      "screen",
      "color-burn"
    ];

    const overBlendModes = [
      "overlay",
      "hard-light",
      "screen",
      "difference",
      "exclusion",
      "color-dodge",
      "color-burn"
    ];

    const bgBlendModes = [
      "multiply",
      "overlay",
      "hard-light",
      "screen",
      "soft-light",
      "difference"
    ];

    const colorPalette = [
      ["rgba(255, 0, 76, 0.70)", "rgba(255, 199, 0, 0.45)", "rgba(0, 255, 198, 0.35)"],
      ["rgba(255, 110, 0, 0.78)", "rgba(255, 0, 166, 0.42)", "rgba(28, 144, 255, 0.36)"],
      ["rgba(0, 216, 255, 0.65)", "rgba(255, 86, 166, 0.40)", "rgba(252, 255, 0, 0.32)"],
      ["rgba(0, 255, 140, 0.58)", "rgba(255, 0, 89, 0.50)", "rgba(101, 0, 255, 0.34)"],
      ["rgba(255, 30, 30, 0.62)", "rgba(255, 241, 118, 0.42)", "rgba(34, 255, 184, 0.30)"],
      ["rgba(145, 0, 255, 0.56)", "rgba(255, 99, 0, 0.44)", "rgba(0, 218, 255, 0.32)"],
      ["rgba(255, 0, 153, 0.54)", "rgba(255, 214, 10, 0.44)", "rgba(60, 255, 120, 0.28)"],
      ["rgba(255, 70, 70, 0.50)", "rgba(34, 113, 255, 0.38)", "rgba(255, 255, 255, 0.22)"]
    ];

    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function pickTexture(pool, recentStore) {
      let tries = 0;
      let choice = pickRandom(pool);

      while (recentStore.includes(choice) && tries < 12) {
        choice = pickRandom(pool);
        tries++;
      }

      recentStore.push(choice);
      if (recentStore.length > 7) recentStore.shift();

      return choice;
    }

    function pickColors() {
      let tries = 0;
      let choice = pickRandom(colorPalette);

      while (recentColors.includes(choice) && tries < 12) {
        choice = pickRandom(colorPalette);
        tries++;
      }

      recentColors.push(choice);
      if (recentColors.length > 5) recentColors.shift();

      return choice;
    }

    function staticTransformString() {
      const scale = (1.14 + Math.random() * 0.52).toFixed(2);
      const rotate = (-11 + Math.random() * 22).toFixed(2);
      const translateX = (-10 + Math.random() * 20).toFixed(1);
      const translateY = (-10 + Math.random() * 20).toFixed(1);

      return `translate(${translateX}%, ${translateY}%) rotate(${rotate}deg) scale(${scale})`;
    }

    function backgroundSizeValue() {
      const size = 125 + Math.round(Math.random() * 60);
      return `${size}%`;
    }

    function applyTextureToLayer(layer, src, mode, opacityMin, opacityMax) {
      layer.style.backgroundImage = `url("${src}")`;
      layer.style.mixBlendMode = mode;
      layer.style.opacity = (
        opacityMin + Math.random() * (opacityMax - opacityMin)
      ).toFixed(2);
      layer.style.transform = staticTransformString();
      layer.style.backgroundSize = backgroundSizeValue();
      layer.style.filter = `
        saturate(${(1.18 + Math.random() * 1.0).toFixed(2)})
        contrast(${(1.0 + Math.random() * 0.75).toFixed(2)})
        brightness(${(0.82 + Math.random() * 0.34).toFixed(2)})
        hue-rotate(${Math.round(Math.random() * 360)}deg)
      `;
    }

    function applyColorWashToLayer(layer, opacityMin, opacityMax) {
      const colors = pickColors();
      const angle = Math.round(Math.random() * 360);

      layer.style.background = `
        linear-gradient(
          ${angle}deg,
          ${colors[0]} 0%,
          ${colors[1]} 50%,
          ${colors[2]} 100%
        )
      `;

      layer.style.mixBlendMode = pickRandom([
        "overlay",
        "hard-light",
        "screen",
        "color-dodge",
        "soft-light",
        "difference"
      ]);

      layer.style.opacity = (
        opacityMin + Math.random() * (opacityMax - opacityMin)
      ).toFixed(2);

      layer.style.transform = staticTransformString();
    }

    function applyHorseTreatment() {
      const hue = Math.round(Math.random() * 360);
      const saturate = (1.0 + Math.random() * 2.2).toFixed(2);
      const contrast = (1.0 + Math.random() * 0.9).toFixed(2);
      const brightness = (0.82 + Math.random() * 0.45).toFixed(2);
      const opacity =
        stageIntensity < 0.35
          ? 0.38 + Math.random() * 0.2
          : 0.58 + Math.random() * 0.32;

      horseGif.style.mixBlendMode = pickRandom(horseBlendModes);
      horseGif.style.opacity = opacity.toFixed(2);
      horseGif.style.filter = `
        hue-rotate(${hue}deg)
        saturate(${saturate})
        contrast(${contrast})
        brightness(${brightness})
      `;
    }

    function startStageSystem() {
      /* initial state so there is ALWAYS something underneath */
      const under1 = stageLayers.find((el) => el.dataset.layer === "under-1");
      const under2 = stageLayers.find((el) => el.dataset.layer === "under-2");
      const under3 = stageLayers.find((el) => el.dataset.layer === "under-3");
      const over1 = stageLayers.find((el) => el.dataset.layer === "over-1");
      const over2 = stageLayers.find((el) => el.dataset.layer === "over-2");

      applyTextureToLayer(
        under1,
        pickTexture(weightedDirtyTextures, recentTextures),
        pickRandom(underBlendModes),
        0.55,
        0.88
      );

      applyTextureToLayer(
        under2,
        pickTexture(weightedVividTextures, recentTextures),
        pickRandom(underBlendModes),
        0.16,
        0.46
      );

      applyTextureToLayer(
        under3,
        pickTexture(texturePool, recentTextures),
        pickRandom(underBlendModes),
        0.12,
        0.34
      );

      applyTextureToLayer(
        over1,
        pickTexture(weightedDirtyTextures, recentTextures),
        pickRandom(overBlendModes),
        0.10,
        0.36
      );

      applyTextureToLayer(
        over2,
        pickTexture(weightedVividTextures, recentTextures),
        pickRandom(overBlendModes),
        0.08,
        0.28
      );

      applyColorWashToLayer(colorWashes[0], 0.10, 0.24);
      applyColorWashToLayer(colorWashes[1], 0.08, 0.18);
      applyColorWashToLayer(colorWashes[2], 0.06, 0.16);
      applyColorWashToLayer(colorWashes[3], 0.04, 0.12);

      horseWrap.style.opacity = stageIntensity < 0.45 ? "0.42" : "0.82";
      applyHorseTreatment();

      animateLayerSwap(under2, weightedVividTextures, recentTextures, underBlendModes, 2500, 5000, 0.18, 0.45);
      animateLayerSwap(under3, texturePool, recentTextures, underBlendModes, 3200, 6200, 0.12, 0.30);
      animateLayerSwap(over1, weightedDirtyTextures, recentTextures, overBlendModes, 2100, 4300, 0.12, 0.34);
      animateLayerSwap(over2, weightedVividTextures, recentTextures, overBlendModes, 2800, 5400, 0.08, 0.26);

      animateColorWash(colorWashes[0], 2800, 5000, 0.12, 0.28);
      animateColorWash(colorWashes[1], 3200, 6000, 0.08, 0.22);
      animateColorWash(colorWashes[2], 2500, 4800, 0.06, 0.18);
      animateColorWash(colorWashes[3], 3500, 6500, 0.04, 0.14);

      /* one under layer NEVER fully disappears */
      const under1Interval = setInterval(() => {
        const opacityFloor = stageIntensity < 0.35 ? 0.48 : 0.62;
        const opacityCeil = stageIntensity < 0.35 ? 0.78 : 0.92;

        under1.style.opacity = "0";

        const t = setTimeout(() => {
          applyTextureToLayer(
            under1,
            pickTexture(weightedDirtyTextures, recentTextures),
            pickRandom(underBlendModes),
            opacityFloor,
            opacityCeil
          );
        }, 140);

        layerTimeouts.push(t);
      }, 4500);

      layerIntervals.push(under1Interval);

      horseInterval = setInterval(() => {
        applyHorseTreatment();
      }, 2600);
    }

    function animateLayerSwap(layer, pool, recentStore, modePool, minDelay, maxDelay, opacityMin, opacityMax) {
      const run = () => {
        const delay = Math.round(minDelay + Math.random() * (maxDelay - minDelay));

        const interval = setInterval(() => {
          layer.style.opacity = "0";

          const timeout = setTimeout(() => {
            applyTextureToLayer(
              layer,
              pickTexture(pool, recentStore),
              pickRandom(modePool),
              opacityMin * (0.7 + stageIntensity * 0.6),
              opacityMax * (0.85 + stageIntensity * 0.45)
            );
          }, 140);

          layerTimeouts.push(timeout);
        }, delay);

        layerIntervals.push(interval);
      };

      run();
    }

    function animateColorWash(layer, minDelay, maxDelay, opacityMin, opacityMax) {
      const delay = Math.round(minDelay + Math.random() * (maxDelay - minDelay));

      const interval = setInterval(() => {
        layer.style.opacity = "0";

        const timeout = setTimeout(() => {
          applyColorWashToLayer(
            layer,
            opacityMin * (0.7 + stageIntensity * 0.6),
            opacityMax * (0.9 + stageIntensity * 0.55)
          );
        }, 160);

        layerTimeouts.push(timeout);
      }, delay);

      layerIntervals.push(interval);
    }

    function startBackgroundSystem() {
      /* multiple full-frame things behind the stage */
      applyTextureToLayer(
        bgLayers[0],
        pickTexture(weightedDirtyTextures, recentBgTextures),
        pickRandom(bgBlendModes),
        0.08,
        0.18
      );

      applyTextureToLayer(
        bgLayers[1],
        pickTexture(weightedVividTextures, recentBgTextures),
        pickRandom(bgBlendModes),
        0.06,
        0.16
      );

      applyColorWashToLayer(bgColorLayers[0], 0.08, 0.18);
      applyColorWashToLayer(bgColorLayers[1], 0.06, 0.12);

      bgLayers.forEach((layer) => {
        layer.style.backgroundPosition = "center";
      });

      const bgIntervalA = setInterval(() => {
        bgLayers[0].style.opacity = "0";

        const t = setTimeout(() => {
          applyTextureToLayer(
            bgLayers[0],
            pickTexture(weightedDirtyTextures, recentBgTextures),
            pickRandom(bgBlendModes),
            0.08,
            0.20
          );
        }, 180);

        layerTimeouts.push(t);
      }, 5200);

      const bgIntervalB = setInterval(() => {
        bgLayers[1].style.opacity = "0";

        const t = setTimeout(() => {
          applyTextureToLayer(
            bgLayers[1],
            pickTexture(weightedVividTextures, recentBgTextures),
            pickRandom(bgBlendModes),
            0.05,
            0.14
          );
        }, 220);

        layerTimeouts.push(t);
      }, 6400);

      const bgColorA = setInterval(() => {
        bgColorLayers[0].style.opacity = "0";

        const t = setTimeout(() => {
          applyColorWashToLayer(bgColorLayers[0], 0.06, 0.16);
        }, 150);

        layerTimeouts.push(t);
      }, 4800);

      const bgColorB = setInterval(() => {
        bgColorLayers[1].style.opacity = "0";

        const t = setTimeout(() => {
          applyColorWashToLayer(bgColorLayers[1], 0.05, 0.12);
        }, 210);

        layerTimeouts.push(t);
      }, 7300);

      bgIntervals.push(bgIntervalA, bgIntervalB, bgColorA, bgColorB);
    }
  </script>
