<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>keegan.biz</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>
    .home-chess {
      --board-red: var(--red, #c1272d);
      --board-yellow: var(--yellow, #fdb913);
      --board-green: var(--green, #006a44);
      --board-ink: var(--ink, #11110f);
      --board-paper: var(--paper, #ece7d7);

      --square-a: #ece7d7;
      --square-b: #ddd7b6;

      --capture-width: 58px;

      width:
        min(
          100%,
          620px
        );

      max-width:
        100%;

      min-width:
        0;

      margin-top:
        clamp(
          42px,
          5vw,
          68px
        );
    }


    .home-chess .chess-topbar {
      display:
        grid;

      grid-template-columns:
        1fr
        auto;

      align-items:
        end;

      gap:
        16px;

      margin-bottom:
        10px;
    }


    .home-chess .status,
    .home-chess .clock,
    .home-chess .time-label {
      margin:
        0;

      font-size:
        14px;

      line-height:
        1;

      font-weight:
        700;
    }


    .home-chess .status,
    .home-chess .time-label {
      color:
        var(--board-red);
    }


    #white-clock {
      color:
        var(--board-yellow);
    }


    #black-clock {
      color:
        var(--board-green);
    }


    .home-chess .clock.is-active {
      text-decoration:
        underline;

      text-decoration-thickness:
        2px;

      text-underline-offset:
        4px;
    }


    .home-chess button {
      appearance:
        none;

      margin:
        0;

      padding:
        0;

      border:
        0;

      border-radius:
        0;

      background:
        transparent;

      color:
        var(--board-red);

      font:
        inherit;

      font-size:
        14px;

      line-height:
        1;

      font-weight:
        700;

      cursor:
        pointer;
    }


    .home-chess button:hover {
      text-decoration:
        underline;

      text-underline-offset:
        3px;
    }


    .home-chess input {
      width:
        56px;

      min-width:
        0;

      padding:
        4px
        5px;

      border:
        1px solid
        var(--board-red);

      border-radius:
        0;

      background:
        transparent;

      color:
        var(--board-ink);

      font:
        inherit;

      font-size:
        14px;

      line-height:
        1;

      font-weight:
        700;

      outline:
        0;
    }


    .home-chess input:focus {
      outline:
        2px solid
        var(--board-red);

      outline-offset:
        2px;
    }


    .home-chess .board-area {
      display:
        grid;

      grid-template-columns:
        var(--capture-width)
        minmax(0, 1fr)
        var(--capture-width);

      align-items:
        stretch;

      width:
        100%;

      min-width:
        0;
    }


    .home-chess .board {
      grid-column:
        2;

      position:
        relative;

      z-index:
        2;

      display:
        grid;

      grid-template-columns:
        repeat(
          8,
          minmax(0, 1fr)
        );

      grid-template-rows:
        repeat(
          8,
          minmax(0, 1fr)
        );

      width:
        100%;

      min-width:
        0;

      aspect-ratio:
        1;

      border-top:
        2px solid
        var(--board-red);

      border-left:
        2px solid
        var(--board-red);

      background:
        var(--square-a);

      user-select:
        none;

      -webkit-user-select:
        none;

      touch-action:
        manipulation;
    }


    .home-chess .square {
      position:
        relative;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      min-width:
        0;

      min-height:
        0;

      border-right:
        2px solid
        var(--board-red);

      border-bottom:
        2px solid
        var(--board-red);

      cursor:
        pointer;

      overflow:
        visible;
    }


    .home-chess .square.light {
      background:
        var(--square-a);
    }


    .home-chess .square.dark {
      background:
        var(--square-b);
    }


    .home-chess .square.legal::after {
      content:
        "";

      position:
        absolute;

      z-index:
        6;

      width:
        13%;

      aspect-ratio:
        1;

      border:
        2px solid
        var(--board-red);

      border-radius:
        50%;

      pointer-events:
        none;
    }


    .home-chess .piece {
      position:
        relative;

      z-index:
        4;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      width:
        100%;

      height:
        100%;

      font-size:
        clamp(
          25px,
          4.35vw,
          58px
        );

      line-height:
        1;

      font-weight:
        700;

      cursor:
        pointer;

      user-select:
        none;

      -webkit-user-select:
        none;

      transform:
        translate(
          var(--rest-x, 0px),
          var(--rest-y, 0px)
        )
        rotate(
          var(--rest-r, 0deg)
        );

      transform-origin:
        center;
    }


    .home-chess .piece.white {
      color:
        var(--board-yellow);
    }


    .home-chess .piece.black {
      color:
        var(--board-green);
    }


    .home-chess .piece.is-selected {
      z-index:
        12;

      opacity:
        .48;

      transform:
        translate(
          var(--rest-x, 0px),
          calc(
            var(--rest-y, 0px)
            -
            3px
          )
        )
        rotate(
          var(--rest-r, 0deg)
        )
        scale(1.035);

      text-shadow:
        5px
        5px
        0
        var(--board-red);
    }


    .floating-piece {
      position:
        fixed;

      z-index:
        999999;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      width:
        var(--float-size);

      height:
        var(--float-size);

      line-height:
        1;

      font-weight:
        700;

      pointer-events:
        none;

      user-select:
        none;

      -webkit-user-select:
        none;

      transform:
        translate(
          -50%,
          -50%
        )
        translateY(-5px)
        rotate(
          var(--float-r, 0deg)
        )
        scale(1.06);

      text-shadow:
        7px
        7px
        0
        var(--board-red);
    }


    .home-chess .piece.just-dropped {
      animation:
        piece-drop
        190ms
        cubic-bezier(
          .18,
          .82,
          .23,
          1
        );
    }


    @keyframes piece-drop {

      0% {
        transform:
          translate(
            calc(
              var(--rest-x, 0px)
              -
              2px
            ),
            calc(
              var(--rest-y, 0px)
              -
              9px
            )
          )
          rotate(
            calc(
              var(--rest-r, 0deg)
              +
              1.5deg
            )
          )
          scale(1.08);
      }


      72% {
        transform:
          translate(
            calc(
              var(--rest-x, 0px)
              +
              .6px
            ),
            calc(
              var(--rest-y, 0px)
              +
              1px
            )
          )
          rotate(
            calc(
              var(--rest-r, 0deg)
              -
              .3deg
            )
          )
          scale(.99);
      }


      100% {
        transform:
          translate(
            var(--rest-x, 0px),
            var(--rest-y, 0px)
          )
          rotate(
            var(--rest-r, 0deg)
          )
          scale(1);
      }

    }


    .home-chess .coordinate {
      position:
        absolute;

      z-index:
        7;

      color:
        var(--board-red);

      font-size:
        9px;

      line-height:
        1;

      font-weight:
        700;

      pointer-events:
        none;
    }


    .home-chess .coordinate.file {
      right:
        3px;

      bottom:
        3px;
    }


    .home-chess .coordinate.rank {
      top:
        3px;

      left:
        3px;
    }


    .home-chess .capture-pile {
      position:
        relative;

      align-self:
        stretch;

      min-width:
        0;

      overflow:
        hidden;

      pointer-events:
        none;
    }


    .home-chess .capture-pile-yellow {
      grid-column:
        1;
    }


    .home-chess .capture-pile-green {
      grid-column:
        3;
    }


    .home-chess .captured-piece {
      position:
        absolute;

      left:
        50%;

      bottom:
        var(--pile-y, 4px);

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      width:
        32px;

      height:
        32px;

      font-size:
        29px;

      line-height:
        1;

      font-weight:
        700;

      transform:
        translateX(
          calc(
            -50%
            +
            var(--pile-x, 0px)
          )
        )
        rotate(
          var(--pile-r, 0deg)
        );

      transform-origin:
        center;

      will-change:
        transform;
    }


    .home-chess .captured-piece.white {
      color:
        var(--board-yellow);
    }


    .home-chess .captured-piece.black {
      color:
        var(--board-green);
    }


    .home-chess .captured-piece.is-falling {
      animation:
        captured-fall
        var(--fall-time, 660ms)
        cubic-bezier(
          .17,
          .72,
          .18,
          1
        );
    }


    @keyframes captured-fall {

      0% {
        transform:
          translateX(
            calc(
              -50%
              +
              var(--pile-x, 0px)
            )
          )
          translateY(
            calc(
              -1
              *
              var(--fall-distance, 460px)
            )
          )
          rotate(
            calc(
              var(--pile-r, 0deg)
              -
              12deg
            )
          );
      }


      72% {
        transform:
          translateX(
            calc(
              -50%
              +
              var(--pile-x, 0px)
            )
          )
          translateY(7px)
          rotate(
            calc(
              var(--pile-r, 0deg)
              +
              2deg
            )
          );
      }


      87% {
        transform:
          translateX(
            calc(
              -50%
              +
              var(--pile-x, 0px)
            )
          )
          translateY(-2px)
          rotate(
            calc(
              var(--pile-r, 0deg)
              -
              .7deg
            )
          );
      }


      100% {
        transform:
          translateX(
            calc(
              -50%
              +
              var(--pile-x, 0px)
            )
          )
          translateY(0)
          rotate(
            var(--pile-r, 0deg)
          );
      }

    }


    .home-chess .chess-bottombar {
      display:
        grid;

      grid-template-columns:
        auto
        minmax(0, 1fr)
        auto;

      grid-template-areas:
        "reset clocks setter";

      align-items:
        end;

      gap:
        14px
        18px;

      margin-top:
        12px;
    }


    #reset-button {
      grid-area:
        reset;

      justify-self:
        start;
    }


    .home-chess .clock-group {
      grid-area:
        clocks;

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        18px;

      min-width:
        0;
    }


    .home-chess .time-setter {
      grid-area:
        setter;

      display:
        grid;

      grid-template-columns:
        auto
        56px
        auto;

      align-items:
        center;

      gap:
        8px;

      justify-self:
        end;
    }


    @media (
      max-width:
      1180px
    ) {

      .home-chess {
        --capture-width:
          46px;

        width:
          min(
            100%,
            540px
          );
      }


      .home-chess .captured-piece {
        width:
          30px;

        height:
          30px;

        font-size:
          27px;
      }


      .home-chess .chess-bottombar {
        grid-template-columns:
          auto
          1fr;

        grid-template-areas:
          "reset setter"
          "clocks clocks";
      }


      .home-chess .clock-group {
        justify-content:
          space-between;
      }

    }


    @media (
      max-width:
      700px
    ) {

      .home-chess {
        --capture-width:
          24px;

        width:
          100%;

        margin-top:
          34px;
      }


      .home-chess .chess-topbar {
        margin-bottom:
          8px;
      }


      .home-chess .status,
      .home-chess .clock,
      .home-chess .time-label,
      .home-chess button,
      .home-chess input {
        font-size:
          12px;
      }


      .home-chess .piece {
        font-size:
          clamp(
            23px,
            8.7vw,
            36px
          );
      }


      .home-chess .captured-piece {
        width:
          22px;

        height:
          22px;

        font-size:
          20px;
      }


      .home-chess .coordinate {
        font-size:
          7px;
      }


      .home-chess .chess-bottombar {
        grid-template-columns:
          auto
          1fr;

        grid-template-areas:
          "reset clocks"
          "setter setter";

        align-items:
          center;

        gap:
          14px
          12px;
      }


      .home-chess .time-setter {
        grid-template-columns:
          auto
          46px
          auto;

        gap:
          6px;

        justify-self:
          start;
      }


      .home-chess .time-setter input {
        width:
          46px;
      }


      .home-chess .clock-group {
        justify-content:
          flex-end;

        gap:
          14px;
      }

    }


    @media (
      max-width:
      420px
    ) {

      .home-chess {
        --capture-width:
          20px;
      }


      .home-chess .time-label {
        display:
          none;
      }


      .home-chess .time-setter {
        grid-template-columns:
          44px
          auto;
      }


      .home-chess .time-setter input {
        width:
          44px;
      }

    }
  </style>
</head>


<body>

  <div
    class="page-shell"
    id="page-shell"
  >

    <nav

      aria-label="Sections"
    >

      <a
        class="scarf-item scarf-home"

        data-live-link
        aria-label="Home"
      >

          src="assets/home/home-scarf-update.png"

      <a

        aria-label="Illustration"
      >

          src="assets/home/scarf-illustration.png"

      </a>

      <a
        class="scarf-item"
        href="photography/"
        data-live-link
        aria-label="Photography"
      >
        <img
          src="assets/home/scarf-photography.png"
          alt=""
        >
      </a>

      <a
        class="scarf-item"
        href="#"
        aria-label="Graphic Design"
      >
        <img
          src="assets/home/scarf-design.png"
          alt=""
        >
      </a>

      <a
        class="scarf-item"
        href="#"
        aria-label="Music"
      >
        <img
          src="assets/home/scarf-music.png"
          alt=""
        >
      </a>

      <a
        class="scarf-item"
        href="motion/"
        data-live-link
        aria-label="Motion"
      >
        <img
          src="assets/home/scarf-motion.png"
          alt=""
        >
      </a>

      <a
        class="scarf-item"
        href="#"
        aria-label="Miscellaneous"
      >
        <img
          src="assets/home/scarf-misc.png"
          alt=""
        >
      </a>

      <a
        class="scarf-item"
        href="#"
        aria-label="Gastronomy"
      >
        <img
          src="assets/home/scarf-gastronomy.png"

      </a>

    </nav>


    <main class="home">

      <section class="hero">

        <div class="welcome-slot">

          <span
            class="welcome-word"
            id="welcome-word"
            aria-hidden="true"
          >
            Welcome
          </span>

        </div>


        <div class="site-title">

        </div>


        <section
          class="home-chess"
          aria-label="Chess"
        >

          <div class="chess-topbar">

            <p
              class="status"
              id="status"
            >

            </p>

            <button
              id="flip-button"

            </button>

          </div>


          <div class="board-area">

            <div
              class="capture-pile capture-pile-yellow"
              id="capture-pile-yellow"

            ></div>


            <div

              id="board"
              aria-label="Chess board"
            ></div>


            <div
              class="capture-pile capture-pile-green"

            ></div>

          </div>

                id="white-clock"

                id="black-clock"

                green 60:00
              </span>

              <label

    </main>

  </div>


  <audio
    id="wip-audio"
    preload="auto"
  >
    <source
      src="assets/home/crickets.mp3"
      type="audio/mpeg"
    >
  </audio>


  <div
    class="wip-overlay"
    id="wip-overlay"
    aria-hidden="true"
  >

    <div class="wip-inner">

      <div class="wip-header">

        <p class="wip-text">
          sorry, i'm still working on this page.
        </p>

        <button
          class="wip-close"
          id="wip-close"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <div
        class="collage-stage"
        id="collage-stage"
        aria-hidden="true"
      >

        <img
          class="horse horse-main"
          id="horse-main"
          src="assets/home/horse.gif"
          alt=""
        >

      </div>

    </div>

  </div>


  <script>
  (() => {

    const clamp = (
      value,
      min,
      max
    ) =>
      Math.min(
        Math.max(
          value,
          min
        ),
        max
      );


    function smoothStep(
      value
    ) {

      const t =
        clamp(
          value,
          0,
          1
        );


      return (
        t *
        t *
        (
          3 -
          2 *
          t
        )
      );

    }


    const welcomeWord =
      document.getElementById(
        "welcome-word"
      );


    if (
      welcomeWord
    ) {

      welcomeWord.textContent =
        "Welcome";


      welcomeWord.style.color =
        "#006a44";

    }


    const pageShell =
      document.getElementById(
        "page-shell"
      );


    const overlay =
      document.getElementById(
        "wip-overlay"
      );


    const audio =
      document.getElementById(
        "wip-audio"
      );


    const closeButton =
      document.getElementById(
        "wip-close"
      );


    const stage =
      document.getElementById(
        "collage-stage"
      );


    const HORSE_START =
      12;


    const HORSE_FULL =
      20;


    let overlayOpen =
      false;


    let raf =
      null;


    let openedAt =
      0;


    function horseRevealAt(
      time
    ) {

      if (
        time <
        HORSE_START
      ) {
        return 0;
      }


      return smoothStep(
        (
          time -
          HORSE_START
        )
        /
        (
          HORSE_FULL -
          HORSE_START
        )
      );

    }


    function visualLoop(
      now
    ) {

      if (
        !overlayOpen
      ) {
        return;
      }


      const elapsed =
        Math.max(
          0,
          (
            now -
            openedAt
          )
          /
          1000
        );


      const time =
        audio.currentTime >
        0
          ? audio.currentTime
          : elapsed;


      stage.style.setProperty(
        "--visual-reveal",
        horseRevealAt(
          time
        ).toFixed(4)
      );


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    async function openWip() {

      if (
        overlayOpen
      ) {
        return;
      }


      overlayOpen =
        true;


      openedAt =
        performance.now();


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      pageShell.classList.add(
        "is-hidden"
      );


      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.pause();


      audio.currentTime =
        0;


      audio.volume =
        .72;


      try {

        await audio.play();

      }

      catch (
        error
      ) {

        console.log(
          "Audio could not start:",
          error
        );

      }


      cancelAnimationFrame(
        raf
      );


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    function closeWip() {

      overlayOpen =
        false;


      cancelAnimationFrame(
        raf
      );


      audio.pause();


      audio.currentTime =
        0;


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      window.setTimeout(
        () => {

          pageShell.classList.remove(
            "is-hidden"
          );

        },
        160
      );

    }


    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );


        if (
          !link ||
          link.hasAttribute(
            "data-live-link"
          )
        ) {
          return;
        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape" &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>


  <script type="module">

    import {
      Chess
    } from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";


    const boardElement =
      document.getElementById(
        "board"
      );


    const statusElement =
      document.getElementById(
        "status"
      );


    const flipButton =
      document.getElementById(
        "flip-button"
      );


    const resetButton =
      document.getElementById(
        "reset-button"
      );


    const whiteClockElement =
      document.getElementById(
        "white-clock"
      );


    const blackClockElement =
      document.getElementById(
        "black-clock"
      );


    const timeInput =
      document.getElementById(
        "time-input"
      );


    const setTimeButton =
      document.getElementById(
        "set-time-button"
      );


    const yellowCapturePile =
      document.getElementById(
        "capture-pile-yellow"
      );


    const greenCapturePile =
      document.getElementById(
        "capture-pile-green"
      );


    const game =
      new Chess();


    let orientation =
      "white";


    let selected =
      null;


    let startingMinutes =
      60;


    let whiteTime =
      startingMinutes *
      60 *
      1000;


    let blackTime =
      startingMinutes *
      60 *
      1000;


    let timerStarted =
      false;


    let timerFinished =
      false;


    let activeClock =
      "w";


    let lastTick =
      performance.now();


    const capturedPieces = {
      w: [],
      b: []
    };


    let lastCaptureToken =
      0;


    const pieceRestingPositions =
      new Map();


    const pieceLetters = {
      k: "K",
      q: "Q",
      r: "R",
      b: "B",
      n: "N",
      p: "P"
    };


    const clampChess = (
      value,
      min,
      max
    ) =>
      Math.min(
        Math.max(
          value,
          min
        ),
        max
      );


    function getFiles() {

      if (
        orientation ===
        "white"
      ) {

        return [
          "a",
          "b",
          "c",
          "d",
          "e",
          "f",
          "g",
          "h"
        ];

      }


      return [
        "h",
        "g",
        "f",
        "e",
        "d",
        "c",
        "b",
        "a"
      ];

    }


    function getRanks() {

      if (
        orientation ===
        "white"
      ) {

        return [
          8,
          7,
          6,
          5,
          4,
          3,
          2,
          1
        ];

      }


      return [
        1,
        2,
        3,
        4,
        5,
        6,
        7,
        8
      ];

    }


    function hashString(
      value
    ) {

      let hash =
        2166136261;


      for (
        let i =
          0;
        i <
        value.length;
        i++
      ) {

        hash ^=
          value.charCodeAt(
            i
          );


        hash =
          Math.imul(
            hash,
            16777619
          );

      }


      return hash >>>
        0;

    }


    function initialPlacementFor(
      squareName,
      piece
    ) {

      const seed =
        hashString(
          `${squareName}-${piece.color}-${piece.type}`
        );


      return {

        x:
          (
            (
              seed &
              255
            )
            /
            255
            -
            .5
          )
          *
          4.5,

        y:
          (
            (
              (
                seed >>>
                8
              )
              &
              255
            )
            /
            255
            -
            .5
          )
          *
          4.5,

        r:
          (
            (
              (
                seed >>>
                16
              )
              &
              255
            )
            /
            255
            -
            .5
          )
          *
          2.8

      };

    }


    function restingPlacementFor(
      squareName,
      piece
    ) {

      return (
        pieceRestingPositions.get(
          squareName
        )
        ||
        initialPlacementFor(
          squareName,
          piece
        )
      );

    }


    function dropPlacementFor(
      squareName,
      clientX,
      clientY
    ) {

      const squareElement =
        boardElement.querySelector(
          `[data-square="${squareName}"]`
        );


      if (
        !squareElement
      ) {

        return {
          x: 0,
          y: 0,
          r: 0
        };

      }


      const rect =
        squareElement.getBoundingClientRect();


      const localX =
        clampChess(
          clientX -
          rect.left,
          0,
          rect.width
        );


      const localY =
        clampChess(
          clientY -
          rect.top,
          0,
          rect.height
        );


      const x =
        (
          localX /
          rect.width
          -
          .5
        )
        *
        rect.width
        *
        .72;


      const y =
        (
          localY /
          rect.height
          -
          .5
        )
        *
        rect.height
        *
        .72;


      const r =
        clampChess(
          (
            x /
            Math.max(
              rect.width,
              1
            )
          )
          *
          8
          +
          (
            y /
            Math.max(
              rect.height,
              1
            )
          )
          *
          -3,
          -5,
          5
        );


      return {
        x,
        y,
        r
      };

    }


    function capturedPlacement(
      index,
      color,
      type
    ) {

      const seed =
        hashString(
          `${color}-${type}-${index}`
        );


      const column =
        index %
        2;


      const row =
        Math.floor(
          index /
          2
        );


      const jitterX =
        (
          (
            seed &
            255
          )
          /
          255
          -
          .5
        )
        *
        5;


      const jitterY =
        (
          (
            (
              seed >>>
              8
            )
            &
            255
          )
          /
          255
          -
          .5
        )
        *
        3;


      const rotation =
        (
          (
            (
              seed >>>
              16
            )
            &
            255
          )
          /
          255
          -
          .5
        )
        *
        18;


      return {

        x:
          (
            column ===
            0
              ? -9
              : 9
          )
          +
          jitterX,

        y:
          4
          +
          row *
          18
          +
          jitterY,

        r:
          rotation

      };

    }


    function renderCapturedPieces(
      animateToken =
        null
    ) {

      yellowCapturePile.innerHTML =
        "";


      greenCapturePile.innerHTML =
        "";


      [
        [
          "w",
          yellowCapturePile
        ],
        [
          "b",
          greenCapturePile
        ]
      ].forEach(
        (
          [
            color,
            pile
          ]
        ) => {

          capturedPieces[
            color
          ].forEach(
            (
              piece,
              index
            ) => {

              const element =
                document.createElement(
                  "div"
                );


              element.className =
                `captured-piece ${
                  color ===
                  "w"
                    ? "white"
                    : "black"
                }`;


              element.textContent =
                pieceLetters[
                  piece.type
                ];


              const placement =
                capturedPlacement(
                  index,
                  color,
                  piece.type
                );


              element.style.setProperty(
                "--pile-x",
                `${placement.x}px`
              );


              element.style.setProperty(
                "--pile-y",
                `${placement.y}px`
              );


              element.style.setProperty(
                "--pile-r",
                `${placement.r}deg`
              );


              if (
                animateToken &&
                piece.token ===
                animateToken
              ) {

                element.classList.add(
                  "is-falling"
                );


                element.style.setProperty(
                  "--fall-time",
                  `${
                    590 +
                    Math.random() *
                    160
                  }ms`
                );


                element.style.setProperty(
                  "--fall-distance",
                  `${
                    Math.max(
                      260,
                      boardElement.clientHeight *
                      .92
                    )
                  }px`
                );

              }


              pile.appendChild(
                element
              );

            }
          );

        }
      );

    }


    function renderBoard() {

      boardElement.innerHTML =
        "";


      const files =
        getFiles();


      const ranks =
        getRanks();


      for (
        let row =
          0;
        row <
        8;
        row++
      ) {

        for (
          let column =
            0;
          column <
          8;
          column++
        ) {

          const file =
            files[
              column
            ];


          const rank =
            ranks[
              row
            ];


          const squareName =
            `${file}${rank}`;


          const square =
            document.createElement(
              "div"
            );


          const fileIndex =
            file.charCodeAt(
              0
            )
            -
            97;


          const isDark =
            (
              fileIndex +
              rank
            )
            %
            2 ===
            0;


          square.className =
            `square ${
              isDark
                ? "dark"
                : "light"
            }`;


          square.dataset.square =
            squareName;


          const piece =
            game.get(
              squareName
            );


          if (
            piece
          ) {

            const pieceElement =
              document.createElement(
                "div"
              );


            pieceElement.className =
              `piece ${
                piece.color ===
                "w"
                  ? "white"
                  : "black"
              }`;


            pieceElement.textContent =
              pieceLetters[
                piece.type
              ];


            pieceElement.dataset.square =
              squareName;


            const rest =
              restingPlacementFor(
                squareName,
                piece
              );


            pieceElement.style.setProperty(
              "--rest-x",
              `${rest.x}px`
            );


            pieceElement.style.setProperty(
              "--rest-y",
              `${rest.y}px`
            );


            pieceElement.style.setProperty(
              "--rest-r",
              `${rest.r}deg`
            );


            square.appendChild(
              pieceElement
            );

          }


          if (
            column ===
            0
          ) {

            const rankCoordinate =
              document.createElement(
                "span"
              );


            rankCoordinate.className =
              "coordinate rank";


            rankCoordinate.textContent =
              rank;


            square.appendChild(
              rankCoordinate
            );

          }


          if (
            row ===
            7
          ) {

            const fileCoordinate =
              document.createElement(
                "span"
              );


            fileCoordinate.className =
              "coordinate file";


            fileCoordinate.textContent =
              file;


            square.appendChild(
              fileCoordinate
            );

          }


          boardElement.appendChild(
            square
          );

        }

      }


      updateStatus();


      updateClocks();

    }


    function clearLegalMoves() {

      boardElement
        .querySelectorAll(
          ".square.legal"
        )
        .forEach(
          square => {

            square.classList.remove(
              "legal"
            );

          }
        );

    }


    function showLegalMoves(
      squareName
    ) {

      clearLegalMoves();


      game.moves({
        square:
          squareName,
        verbose:
          true
      }).forEach(
        move => {

          const squareElement =
            boardElement.querySelector(
              `[data-square="${move.to}"]`
            );


          if (
            squareElement
          ) {

            squareElement.classList.add(
              "legal"
            );

          }

        }
      );

    }


    function moveFloatingPiece(
      x,
      y
    ) {

      if (
        !selected?.floating
      ) {
        return;
      }


      selected.floating.style.left =
        `${x}px`;


      selected.floating.style.top =
        `${y}px`;

    }


    function cancelSelection() {

      clearLegalMoves();


      if (
        selected?.original
      ) {

        selected.original.classList.remove(
          "is-selected"
        );

      }


      if (
        selected?.floating
      ) {

        selected.floating.remove();

      }


      selected =
        null;

    }


    function selectPiece(
      squareName,
      pieceElement,
      event
    ) {

      cancelSelection();


      const finePointer =
        window.matchMedia(
          "(hover: hover) and (pointer: fine)"
        ).matches;


      let floating =
        null;


      if (
        finePointer
      ) {

        const rect =
          pieceElement
            .closest(
              ".square"
            )
            .getBoundingClientRect();


        const computed =
          window.getComputedStyle(
            pieceElement
          );


        floating =
          pieceElement.cloneNode(
            true
          );


        floating.classList.remove(
          "is-selected"
        );


        floating.classList.add(
          "floating-piece"
        );


        floating.style.setProperty(
          "--float-size",
          `${rect.width}px`
        );


        floating.style.setProperty(
          "--float-r",
          `${
            Math.random() <
            .5
              ? -.65
              : .65
          }deg`
        );


        floating.style.fontSize =
          computed.fontSize;


        floating.style.fontFamily =
          computed.fontFamily;


        floating.style.fontWeight =
          computed.fontWeight;


        floating.style.color =
          computed.color;


        document.body.appendChild(
          floating
        );

      }


      pieceElement.classList.add(
        "is-selected"
      );


      selected = {

        from:
          squareName,

        original:
          pieceElement,

        floating,

        x:
          event.clientX,

        y:
          event.clientY

      };


      showLegalMoves(
        squareName
      );


      if (
        floating
      ) {

        moveFloatingPiece(
          selected.x,
          selected.y
        );

      }

    }


    function boardClick(
      event
    ) {

      const squareElement =
        event.target.closest(
          ".square"
        );


      if (
        !squareElement ||
        !boardElement.contains(
          squareElement
        )
      ) {
        return;
      }


      const squareName =
        squareElement.dataset.square;


      const clickedPiece =
        game.get(
          squareName
        );


      if (
        !selected
      ) {

        if (
          clickedPiece &&
          clickedPiece.color ===
          game.turn() &&
          !timerFinished
        ) {

          const pieceElement =
            squareElement.querySelector(
              ".piece"
            );


          if (
            pieceElement
          ) {

            selectPiece(
              squareName,
              pieceElement,
              event
            );

          }

        }


        return;

      }


      if (
        squareName ===
        selected.from
      ) {

        cancelSelection();

        return;

      }


      const legalMove =
        game.moves({
          square:
            selected.from,
          verbose:
            true
        }).find(
          move =>
            move.to ===
            squareName
        );


      if (
        legalMove
      ) {

        const from =
          selected.from;


        cancelSelection();


        attemptMove(
          from,
          squareName,
          event.clientX,
          event.clientY
        );


        return;

      }


      if (
        clickedPiece &&
        clickedPiece.color ===
        game.turn()
      ) {

        const pieceElement =
          squareElement.querySelector(
            ".piece"
        );


        if (
          pieceElement
        ) {

          selectPiece(
            squareName,
            pieceElement,
            event
          );

        }

      }

    }


    function attemptMove(
      from,
      to,
      clientX,
      clientY
    ) {

      const movingPiece =
        game.get(
          from
        );


      const landing =
        dropPlacementFor(
          to,
          clientX,
          clientY
        );


      let move =
        null;


      try {

        move =
          game.move({
            from,
            to,
            promotion:
              "q"
          });

      }

      catch (
        error
      ) {

        move =
          null;

      }


      if (
        !move
      ) {
        return false;
      }


      pieceRestingPositions.delete(
        from
      );


      pieceRestingPositions.delete(
        to
      );


      if (
        movingPiece
      ) {

        pieceRestingPositions.set(
          to,
          landing
        );

      }


      let captureToken =
        null;


      if (
        move.captured
      ) {

        captureToken =
          ++lastCaptureToken;


        const capturedColor =
          move.color ===
          "w"
            ? "b"
            : "w";


        capturedPieces[
          capturedColor
        ].push({
          type:
            move.captured,
          token:
            captureToken
        });

      }


      if (
        !timerStarted
      ) {

        timerStarted =
          true;

      }


      activeClock =
        game.turn();


      lastTick =
        performance.now();


      renderBoard();


      renderCapturedPieces(
        captureToken
      );


      const droppedPiece =
        boardElement.querySelector(
          `[data-square="${to}"] .piece`
        );


      if (
        droppedPiece
      ) {

        droppedPiece.classList.add(
          "just-dropped"
        );


        window.setTimeout(
          () => {

            droppedPiece.classList.remove(
              "just-dropped"
            );

          },
          240
        );

      }


      return true;

    }


    function colorName(
      color
    ) {

      return color ===
        "w"
          ? "yellow"
          : "green";

    }


    function updateStatus() {

      if (
        timerFinished
      ) {
        return;
      }


      let status;


      if (
        game.isCheckmate()
      ) {

        status =
          `${
            game.turn() ===
            "w"
              ? "green"
              : "yellow"
          } wins — checkmate`;

      }

      else if (
        game.isStalemate()
      ) {

        status =
          "draw — stalemate";

      }

      else if (
        game.isThreefoldRepetition()
      ) {

        status =
          "draw — repetition";

      }

      else if (
        game.isInsufficientMaterial()
      ) {

        status =
          "draw — insufficient material";

      }

      else if (
        game.isDrawByFiftyMoves()
      ) {

        status =
          "draw — fifty-move rule";

      }

      else if (
        game.isDraw()
      ) {

        status =
          "draw";

      }

      else {

        status =
          `${
            colorName(
              game.turn()
            )
          } to move`;


        if (
          game.inCheck()
        ) {

          status +=
            " — check";

        }

      }


      statusElement.textContent =
        status;

    }


    function formatTime(
      milliseconds
    ) {

      const safe =
        Math.max(
          0,
          milliseconds
        );


      const totalSeconds =
        Math.ceil(
          safe /
          1000
        );


      const minutes =
        Math.floor(
          totalSeconds /
          60
        );


      const seconds =
        totalSeconds %
        60;


      return (
        `${minutes}:${
          String(
            seconds
          ).padStart(
            2,
            "0"
          )
        }`
      );

    }


    function updateClocks() {

      whiteClockElement.textContent =
        `yellow ${
          formatTime(
            whiteTime
          )
        }`;


      blackClockElement.textContent =
        `green ${
          formatTime(
            blackTime
          )
        }`;


      whiteClockElement.classList.toggle(
        "is-active",
        timerStarted &&
        !timerFinished &&
        activeClock ===
        "w"
      );


      blackClockElement.classList.toggle(
        "is-active",
        timerStarted &&
        !timerFinished &&
        activeClock ===
        "b"
      );

    }


    function stopOnTime(
      loser
    ) {

      timerFinished =
        true;


      timerStarted =
        false;


      statusElement.textContent =
        `${
          loser ===
          "w"
            ? "green"
            : "yellow"
        } wins — time`;


      cancelSelection();


      updateClocks();

    }


    function tickClock() {

      const now =
        performance.now();


      if (
        timerStarted &&
        !timerFinished &&
        !game.isGameOver()
      ) {

        const elapsed =
          now -
          lastTick;


        if (
          activeClock ===
          "w"
        ) {

          whiteTime -=
            elapsed;


          if (
            whiteTime <=
            0
          ) {

            whiteTime =
              0;


            stopOnTime(
              "w"
            );

          }

        }

        else {

          blackTime -=
            elapsed;


          if (
            blackTime <=
            0
          ) {

            blackTime =
              0;


            stopOnTime(
              "b"
            );

          }

        }

      }


      lastTick =
        now;


      updateClocks();

    }


    function setClockMinutes() {

      const parsed =
        Number(
          timeInput.value
        );


      if (
        !Number.isFinite(
          parsed
        )
        ||
        parsed <=
        0
      ) {

        timeInput.value =
          String(
            startingMinutes
          );


        return;

      }


      startingMinutes =
        parsed;


      whiteTime =
        parsed *
        60 *
        1000;


      blackTime =
        parsed *
        60 *
        1000;


      timerStarted =
        false;


      timerFinished =
        false;


      activeClock =
        game.turn();


      lastTick =
        performance.now();


      cancelSelection();


      updateStatus();


      updateClocks();

    }


    boardElement.addEventListener(
      "click",
      boardClick
    );


    window.addEventListener(
      "pointermove",
      event => {

        if (
          !selected
        ) {
          return;
        }


        selected.x =
          event.clientX;


        selected.y =
          event.clientY;


        moveFloatingPiece(
          selected.x,
          selected.y
        );

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape" &&
          selected
        ) {

          cancelSelection();

        }

      }
    );


    flipButton.addEventListener(
      "click",
      () => {

        cancelSelection();


        orientation =
          orientation ===
          "white"
            ? "black"
            : "white";


        renderBoard();


        renderCapturedPieces();

      }
    );


    resetButton.addEventListener(
      "click",
      () => {

        cancelSelection();


        game.reset();


        capturedPieces.w.length =
          0;


        capturedPieces.b.length =
          0;


        lastCaptureToken =
          0;


        pieceRestingPositions.clear();


        whiteTime =
          startingMinutes *
          60 *
          1000;


        blackTime =
          startingMinutes *
          60 *
          1000;


        timerStarted =
          false;


        timerFinished =
          false;


        activeClock =
          "w";


        lastTick =
          performance.now();


        renderBoard();


        renderCapturedPieces();

      }
    );


    setTimeButton.addEventListener(
      "click",
      setClockMinutes
    );


    timeInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
        ) {

          setClockMinutes();

        }

      }
    );


    window.setInterval(
      tickClock,
      250
    );


    renderBoard();


    renderCapturedPieces();


    updateClocks();

  </script>

</body>
</html>
