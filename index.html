    </a>

  <!-- =====================================================
       HOME
       ===================================================== -->

  <main class="home">

    <section
      class="hero"
      aria-label="Welcome to keegan.biz"
    >

      <div class="welcome-slot">

        <span
          class="welcome-word"
          id="welcome-word"
          aria-hidden="true"
        >
          Welcome
        </span>

      </div>


      <div class="site-title">
        to keegan.biz
      </div>

    </section>

  </main>


  <!-- =====================================================
       AUDIO
       ===================================================== -->

  <audio
    id="wip-audio"
    preload="auto"
  >
    <source
      src="assets/home/crickets.mp3"
      type="audio/mpeg"
    >
  </audio>


  <!-- =====================================================
       WIP EXPERIENCE
       ===================================================== -->

  <div
    class="wip-overlay"
    id="wip-overlay"
    aria-hidden="true"
  >

    <div class="wip-inner">

      <!-- note + close button are now one object -->

      <div class="wip-header">

        <p class="wip-text">
          sorry, i'm still working on this.
        </p>

        <button
          class="wip-close"
          id="wip-close"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <!-- visual -->

      <div
        class="trippy-stage"
        id="trippy-stage"
        aria-hidden="true"
      >

        <!-- textures BEHIND horse -->

        <div
          class="texture-stack texture-under"
          id="texture-under"
        ></div>


        <!-- horse itself -->

        <div class="horse-stage">

          <img
            class="horse horse-shadow"
            src="assets/home/horse.gif"
            alt=""
          >

          <img
            class="horse horse-main"
            src="assets/home/horse.gif"
            alt=""
          >

        </div>


        <!-- textures OVER horse -->

        <div
          class="texture-stack texture-over"
          id="texture-over"
        ></div>


        <!--
          Quiet duplicate above everything.
          This keeps the drawing legible even
          during the densest part.
        -->

        <img
          class="horse horse-anchor"
          src="assets/home/horse.gif"
          alt=""
        >

      </div>

    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>
  (() => {

    /* =====================================================
       GENERAL HELPERS
       ===================================================== */

    const random = (min, max) =>
      min + Math.random() * (max - min);

    const clamp = (value, min, max) =>
      Math.min(Math.max(value, min), max);

    const lerp = (a, b, amount) =>
      a + (b - a) * amount;

    const pick = array =>
      array[Math.floor(Math.random() * array.length)];

    function pickDifferentIndex(length, currentIndex) {
      let next;

      do {
        next = Math.floor(Math.random() * length);
      } while (
        length > 1 &&
        next === currentIndex
      );

      return next;
    }


    /* =====================================================
       WELCOME
       Clean fade rather than scrolling two words
       over one another.
       ===================================================== */

    const welcomeWord =
      document.getElementById("welcome-word");


    const greetings = [

      "Welcome",

      "Fáilte",

      "Benvenuti",

      "Bienvenue",

      "Bienvenidos",

      "Benvinguts",

      "Bem-vindos",

      "Welkom",

      "Willkommen",

      "Velkommen",

      "Välkommen",

      "Velkomin",

      "Tervetuloa",

      "Sveiki atvykę",

      "Laipni lūdzam",

      "Tere tulemast",

      "Witamy",

      "Vítejte",

      "Vitajte",

      "Dobrodošli",

      "Добродошли",

      "Добре дошли",

      "Добро пожаловать",

      "Bun venit",

      "Üdvözöljük",

      "Mirë se vini",

      "Ongi etorri",

      "Καλώς ήρθατε",

      "Hoş geldiniz",

      "Ласкаво просимо",

      "Croeso",

      "Nau mai",

      "Aloha",

      "Karibu",

      "Siyakwamukela",

      "Ẹ káàbọ̀",

      "እንኳን ደህና መጡ",

      "स्वागत है",

      "স্বাগতম",

      "欢迎",

      "ようこそ",

      "환영합니다",

      "ยินดีต้อนรับ",

      "Chào mừng",

      "Selamat datang",

      "Maligayang pagdating",

      "ברוכים הבאים",

      "أهلاً وسهلاً",

      "خوش آمدید",

      "Bonvenon",

      "Salvete",

      "Yá’át’ééh",

      "Mae govannen",

      "01010111 01100101 01101100 01100011 01101111 01101101 01100101"

    ];


    const welcomeColors = [
      "#fdb913",
      "#006a44",
      "#c1272d"
    ];


    let greetingIndex = 0;
    let colorIndex = 1;
    let greetingBusy = false;


    function fitWelcomeText() {

      /*
        Start at CSS size, then shrink only
        if a particular language is too wide.
      */

      welcomeWord.style.fontSize = "";

      const slot =
        welcomeWord.parentElement;

      const maxWidth =
        slot.clientWidth;


      let size =
        parseFloat(
          getComputedStyle(welcomeWord).fontSize
        );


      while (
        welcomeWord.scrollWidth > maxWidth &&
        size > 28
      ) {

        size -= 2;

        welcomeWord.style.fontSize =
          `${size}px`;

      }

    }


    function changeGreeting() {

      if (greetingBusy) return;

      greetingBusy = true;


      const nextGreetingIndex =
        pickDifferentIndex(
          greetings.length,
          greetingIndex
        );


      const nextColorIndex =
        pickDifferentIndex(
          welcomeColors.length,
          colorIndex
        );


      welcomeWord.classList.add(
        "is-fading"
      );


      window.setTimeout(() => {

        greetingIndex =
          nextGreetingIndex;

        colorIndex =
          nextColorIndex;


        welcomeWord.textContent =
          greetings[greetingIndex];


        welcomeWord.style.color =
          welcomeColors[colorIndex];


        fitWelcomeText();


        welcomeWord.classList.remove(
          "is-fading"
        );


        window.setTimeout(() => {

          greetingBusy = false;

        }, 280);

      }, 260);

    }


    welcomeWord.style.color =
      welcomeColors[colorIndex];

    fitWelcomeText();


    window.addEventListener(
      "resize",
      fitWelcomeText
    );


    window.setInterval(
      changeGreeting,
      2450
    );


    /* =====================================================
       WIP ELEMENTS
       ===================================================== */

    const audio =
      document.getElementById("wip-audio");

    const overlay =
      document.getElementById("wip-overlay");

    const closeButton =
      document.getElementById("wip-close");

    const trippyStage =
      document.getElementById("trippy-stage");

    const textureUnder =
      document.getElementById("texture-under");

    const textureOver =
      document.getElementById("texture-over");


    /* =====================================================
       TEXTURE FILES
       ===================================================== */

    const TEXTURES = [

      "Texturelabs_Atmosphere_121S.jpg",
      "Texturelabs_Atmosphere_127S.jpg",
      "Texturelabs_Atmosphere_130S.jpg",
      "Texturelabs_Atmosphere_135S.jpg",
      "Texturelabs_Atmosphere_201S.jpg",

      "Texturelabs_Brick_124S.jpg",
      "Texturelabs_Brick_158S.jpg",

      "Texturelabs_Concrete_150S.jpg",
      "Texturelabs_Concrete_155S.jpg",
      "Texturelabs_Concrete_179S.jpg",
      "Texturelabs_Concrete_205S.jpg",
      "Texturelabs_Concrete_207S.jpg",

      "Texturelabs_Fabric_123S.jpg",
      "Texturelabs_Fabric_144S.jpg",
      "Texturelabs_Fabric_172S.jpg",

      "Texturelabs_Film_181S.jpg",
      "Texturelabs_Film_183S.jpg",
      "Texturelabs_Film_187S.jpg",

      "Texturelabs_Glass_134S.jpg",
      "Texturelabs_Glass_155S.jpg",

      "Texturelabs_Grunge_173S.jpg",
      "Texturelabs_Grunge_279L.jpg",
      "Texturelabs_Grunge_334S.jpg",
      "Texturelabs_Grunge_341S.jpg",

      "Texturelabs_InkPaint_126S.jpg",
      "Texturelabs_InkPaint_320S.jpg",
      "Texturelabs_InkPaint_332S.jpg",
      "Texturelabs_InkPaint_356S.jpg",

      "Texturelabs_LensFX_251S.jpg",
      "Texturelabs_LensFX_256S.jpg",

      "Texturelabs_Metal_129S.jpg",
      "Texturelabs_Metal_165S.jpg",
      "Texturelabs_Metal_285S.jpg",
      "Texturelabs_Metal_294S.jpg",

      "Texturelabs_Paper_273S.jpg",
      "Texturelabs_Paper_278L.jpg",
      "Texturelabs_Paper_280S.jpg",
      "Texturelabs_Paper_286S.jpg",
      "Texturelabs_Paper_303S.jpg",
      "Texturelabs_Paper_324S.jpg",
      "Texturelabs_Paper_380L.jpg",
      "Texturelabs_Paper_380S.jpg",

      "Texturelabs_Sky_171S.jpg",

      "Texturelabs_Soil_146S.jpg",
      "Texturelabs_Soil_149S.jpg",

      "Texturelabs_Stone_167S.jpg",
      "Texturelabs_Stone_169S.jpg",

      "Texturelabs_Water_124S.jpg",
      "Texturelabs_Water_141S.jpg",

      "Texturelabs_Wood_135S.jpg",
      "Texturelabs_Wood_280S.jpg",
      "Texturelabs_Wood_290S.jpg"

    ].map(
      file =>
        `assets/home/${file}`
    );


    /* =====================================================
       COLLAGE PALETTE

       Deliberately less neon.
       More stained paper / print / darkroom.
       ===================================================== */

    const COLORS = [

      "#c1272d",
      "#7f1d25",

      "#006a44",
      "#274f3c",

      "#fdb913",
      "#b78a19",

      "#182f4d",
      "#405f7c",

      "#8c5a72",
      "#b88876",

      "#dad0b8",
      "#ece7d7",

      "#2a2420"

    ];


    /*
      Repeated values deliberately weight the
      random selection toward color burn,
      multiply and soft light.
    */

    const UNDER_BLEND_MODES = [

      "multiply",
      "multiply",
      "multiply",

      "color-burn",
      "color-burn",
      "color-burn",

      "soft-light",
      "soft-light",

      "overlay",

      "darken",

      "screen"

    ];


    const OVER_BLEND_MODES = [

      "color-burn",
      "color-burn",
      "color-burn",

      "multiply",
      "multiply",

      "overlay",
      "overlay",

      "soft-light",
      "soft-light",

      "hard-light",

      "screen",

      /*
        Rarely weird rather than constantly weird.
      */

      "difference",
      "exclusion"

    ];


    /* =====================================================
       CREATE TEXTURE LAYERS
       ===================================================== */

    const UNDER_COUNT = 8;
    const OVER_COUNT = 6;

    const underLayers = [];
    const overLayers = [];


    function createTextureLayer(
      parent,
      isOver
    ) {

      const layer =
        document.createElement("div");

      layer.className =
        "texture-layer";

      layer.dataset.active =
        "false";

      layer.dataset.over =
        isOver
          ? "true"
          : "false";

      layer._version = 0;

      parent.appendChild(layer);

      return layer;

    }


    for (
      let i = 0;
      i < UNDER_COUNT;
      i += 1
    ) {

      underLayers.push(
        createTextureLayer(
          textureUnder,
          false
        )
      );

    }


    for (
      let i = 0;
      i < OVER_COUNT;
      i += 1
    ) {

      overLayers.push(
        createTextureLayer(
          textureOver,
          true
        )
      );

    }


    /* =====================================================
       STATIC COLLAGE VISUALS
       ===================================================== */

    function makeGradient() {

      const c1 = pick(COLORS);
      const c2 = pick(COLORS);

      const choice =
        Math.floor(
          Math.random() * 3
        );


      if (choice === 0) {

        return `
          linear-gradient(
            ${random(0, 360)}deg,
            ${c1},
            transparent 48%,
            ${c2}
          )
        `;

      }


      if (choice === 1) {

        return `
          radial-gradient(
            circle at
            ${random(15, 85)}%
            ${random(15, 85)}%,
            ${c1},
            transparent ${random(40, 70)}%
          ),
          radial-gradient(
            circle at
            ${random(15, 85)}%
            ${random(15, 85)}%,
            ${c2},
            transparent ${random(35, 70)}%
          )
        `;

      }


      return `
        linear-gradient(
          ${random(0, 360)}deg,
          ${c1} 0%,
          transparent 35%,
          transparent 65%,
          ${c2} 100%
        )
      `;

    }


    function configureLayer(
      layer,
      intensity
    ) {

      const isOver =
        layer.dataset.over === "true";


      const blendModes =
        isOver
          ? OVER_BLEND_MODES
          : UNDER_BLEND_MODES;


      /*
        Most layers are photographs/textures.

        Occasionally a color field or gradient
        appears instead.
      */

      const visualType =
        Math.random();


      layer.style.backgroundColor =
        "transparent";


      layer.style.backgroundImage =
        "none";


      if (visualType < 0.70) {

        layer.style.backgroundImage =
          `url("${pick(TEXTURES)}")`;


        layer.style.backgroundRepeat =
          Math.random() < 0.15
            ? "repeat"
            : "no-repeat";


        layer.style.backgroundSize =
          `${random(75, 185)}%`;


        layer.style.backgroundPosition =
          `${random(0, 100)}% ${random(0, 100)}%`;

      }

      else if (visualType < 0.90) {

        layer.style.backgroundImage =
          makeGradient();

        layer.style.backgroundSize =
          "100% 100%";

        layer.style.backgroundPosition =
          "center";

        layer.style.backgroundRepeat =
          "no-repeat";

      }

      else {

        layer.style.backgroundColor =
          pick(COLORS);

      }


      layer.style.mixBlendMode =
        pick(blendModes);


      /*
        STATIC random crop / rotation / zoom.

        This does NOT animate while visible.
      */

      layer.style.transform = `
        translate(
          ${random(-8, 8)}%,
          ${random(-8, 8)}%
        )
        rotate(
          ${random(-8, 8)}deg
        )
        scale(
          ${random(1.02, 1.48)}
        )
      `;


      /*
        Keep filters more photographic / printed
        instead of rainbow hallucination.
      */

      const grayscale =
        Math.random() < 0.22
          ? random(0.3, 0.9)
          : 0;


      layer.style.filter = `
        contrast(${random(0.9, 1.42)})
        saturate(${random(0.72, 1.45)})
        brightness(${random(0.82, 1.18)})
        grayscale(${grayscale})
        blur(${random(0, intensity * 1.4)}px)
      `;


      /*
        Over-layers stay weaker so the horse
        never disappears.
      */

      let opacity;


      if (isOver) {

        opacity =
          random(
            0.035,
            lerp(
              0.10,
              0.24,
              intensity
            )
          );

      }

      else {

        opacity =
          random(
            0.06,
            lerp(
              0.18,
              0.38,
              intensity
            )
          );

      }


      layer.dataset.targetOpacity =
        opacity.toFixed(3);

    }


    /*
      Fade a layer out, change it while invisible,
      then fade the new collage piece in.

      Transform never animates.
    */

    function replaceLayer(
      layer,
      intensity
    ) {

      layer._version += 1;

      const version =
        layer._version;


      layer.style.opacity =
        "0";


      window.setTimeout(() => {

        if (
          !overlayOpen ||
          version !== layer._version
        ) {

          return;

        }


        configureLayer(
          layer,
          intensity
        );


        layer.dataset.active =
          "true";


        /*
          Force styles to settle before
          opacity comes back.
        */

        requestAnimationFrame(() => {

          if (
            version !== layer._version
          ) {

            return;

          }


          layer.style.opacity =
            layer.dataset.targetOpacity;

        });

      }, 130);

    }


    function clearLayer(layer) {

      layer._version += 1;

      layer.dataset.active =
        "false";

      layer.style.opacity =
        "0";

    }


    function clearAllLayers() {

      underLayers.forEach(
        clearLayer
      );

      overLayers.forEach(
        clearLayer
      );

    }


    function activeLayers(layers) {

      return layers.filter(
        layer =>
          layer.dataset.active === "true"
      );

    }


    function inactiveLayers(layers) {

      return layers.filter(
        layer =>
          layer.dataset.active !== "true"
      );

    }


    function ensureLayerCount(
      layers,
      wanted,
      intensity
    ) {

      let active =
        activeLayers(layers);


      while (
        active.length < wanted
      ) {

        const inactive =
          inactiveLayers(layers);


        if (!inactive.length) break;


        const layer =
          pick(inactive);


        replaceLayer(
          layer,
          intensity
        );


        layer.dataset.active =
          "true";


        active =
          activeLayers(layers);

      }


      while (
        active.length > wanted
      ) {

        const layer =
          pick(active);


        clearLayer(layer);


        active =
          activeLayers(layers);

      }

    }


    /* =====================================================
       INTENSITY CURVE

       0:00–0:45
       barely-there collage

       0:45–1:11
       establishes visual world

       1:11–3:00
       gradual build

       3:00–3:40
       increasingly tense

       3:40–4:03
       strongest / fastest collage

       4:03
       completely normal again
       ===================================================== */

    const NORMAL_TIME = 243;


    function collageIntensity(time) {

      if (
        time >= NORMAL_TIME
      ) {

        return 0;

      }


      if (time < 45) {

        return 0.07;

      }


      if (time < 71) {

        return lerp(
          0.07,
          0.18,
          (time - 45) / 26
        );

      }


      if (time < 180) {

        return lerp(
          0.18,
          0.44,
          (time - 71) / 109
        );

      }


      if (time < 220) {

        return lerp(
          0.44,
          0.72,
          (time - 180) / 40
        );

      }


      return lerp(
        0.72,
        1,
        (time - 220) / 23
      );

    }


    /*
      These timings align nicely with
      120 BPM:

      2000ms = 4 beats
      1000ms = 2 beats
      500ms  = 1 beat
      250ms  = 1/2 beat
    */

    function collageInterval(
      intensity
    ) {

      if (intensity < 0.22) {
        return 2000;
      }

      if (intensity < 0.50) {
        return 1000;
      }

      if (intensity < 0.82) {
        return 500;
      }

      return 250;

    }


    /* =====================================================
       COLLAGE UPDATE
       ===================================================== */

    let lastCollageChange =
      -Infinity;

    let normalized =
      false;


    function updateCollage(
      time,
      intensity
    ) {

      /*
        At 4:03 everything disappears
        immediately, leaving only the
        original horse.
      */

      if (
        time >= NORMAL_TIME
      ) {

        if (!normalized) {

          normalized = true;

          clearAllLayers();


          trippyStage.style.setProperty(
            "--vignette-opacity",
            "0"
          );


          trippyStage.style.setProperty(
            "--shadow-opacity",
            "0"
          );

        }


        return;

      }


      normalized = false;


      const interval =
        collageInterval(
          intensity
        );


      const elapsedMs =
        time * 1000;


      if (
        elapsedMs -
        lastCollageChange <
        interval
      ) {

        return;

      }


      lastCollageChange =
        elapsedMs;


      /*
        More layers accumulate as tension rises,
        but never enough to bury the horse.
      */

      const wantedUnder =
        Math.round(
          lerp(
            2,
            7,
            intensity
          )
        );


      const wantedOver =
        Math.round(
          lerp(
            1,
            4,
            intensity
          )
        );


      ensureLayerCount(
        underLayers,
        wantedUnder,
        intensity
      );


      ensureLayerCount(
        overLayers,
        wantedOver,
        intensity
      );


      /*
        Only a FEW collage pieces change
        on each visual beat.
      */

      const changes =
        Math.round(
          lerp(
            1,
            4,
            intensity
          )
        );


      const allActive = [
        ...activeLayers(
          underLayers
        ),
        ...activeLayers(
          overLayers
        )
      ];


      const changed =
        new Set();


      for (
        let i = 0;
        i < changes;
        i += 1
      ) {

        if (!allActive.length) break;


        let layer;


        do {

          layer =
            pick(allActive);

        } while (
          changed.has(layer) &&
          changed.size <
          allActive.length
        );


        changed.add(layer);


        replaceLayer(
          layer,
          intensity
        );

      }


      /*
        Small darkroom-style edge tension.
      */

      trippyStage.style.setProperty(
        "--vignette-opacity",
        lerp(
          0.015,
          0.22,
          intensity
        ).toFixed(3)
      );


      trippyStage.style.setProperty(
        "--shadow-opacity",
        lerp(
          0.04,
          0.17,
          intensity
        ).toFixed(3)
      );

    }


    /* =====================================================
       PLAYBACK LOOP
       ===================================================== */

    let overlayOpen =
      false;

    let animationFrame =
      null;


    function visualLoop() {

      if (!overlayOpen) {
        return;
      }


      const time =
        audio.currentTime || 0;


      const intensity =
        collageIntensity(time);


      updateCollage(
        time,
        intensity
      );


      animationFrame =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       OPEN / CLOSE
       ===================================================== */

    function initializeMildCollage() {

      clearAllLayers();


      /*
        Start with a couple of extremely quiet
        layers rather than a blank square.
      */

      replaceLayer(
        underLayers[0],
        0.07
      );

      replaceLayer(
        underLayers[1],
        0.07
      );

      replaceLayer(
        overLayers[0],
        0.07
      );

    }


    async function openWip() {

      overlayOpen =
        true;


      document.body.classList.add(
        "wip-open"
      );


      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.pause();

      audio.currentTime =
        0;


      audio.volume =
        0.72;


      lastCollageChange =
        -Infinity;


      normalized =
        false;


      initializeMildCollage();


      try {

        await audio.play();

      }

      catch (error) {

        console.log(
          "Audio playback failed:",
          error
        );

      }


      cancelAnimationFrame(
        animationFrame
      );


      animationFrame =
        requestAnimationFrame(
          visualLoop
        );

    }


    function closeWip() {

      overlayOpen =
        false;


      document.body.classList.remove(
        "wip-open"
      );


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      audio.pause();

      audio.currentTime =
        0;


      cancelAnimationFrame(
        animationFrame
      );


      clearAllLayers();

    }


    /* =====================================================
       LINKS
       ===================================================== */

    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest("a");


        if (!link) {
          return;
        }


        /*
          Eventually add data-live-link
          to links that should navigate.
        */

        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();

        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>

</body>
