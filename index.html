  (() => {

    /* =====================================================
       HELPERS
       ===================================================== */

    const clamp = (value, min, max) =>
      Math.min(
        Math.max(value, min),
        max
      );


    const lerp = (a, b, t) =>
      a + ((b - a) * t);


    const random = (min, max) =>
      min + Math.random() * (max - min);


    const pick = array =>
      array[
        Math.floor(
          Math.random() * array.length
        )
      ];


    function shuffle(array) {

      const result =
        [...array];


      for (
        let i = result.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }


      return result;

    }


    function differentIndex(
      length,
      current
    ) {

      let next;


      do {

        next =
          Math.floor(
            Math.random() * length
          );

      }
      while (
        length > 1 &&
        next === current
      );


      return next;

    }


    function smoothStep(value) {

      const t =
        clamp(
          value,
          0,
          1
        );


      return (
        t *
        t *
        (3 - (2 * t))
      );

    }

    function fitWelcome() {

      welcomeWord.style.fontSize =
        "";


      const available =
        welcomeWord
          .parentElement
          .clientWidth;


      let size =
        parseFloat(
          getComputedStyle(
            welcomeWord
          ).fontSize
        );


      while (
        welcomeWord.scrollWidth >
        available &&
        size > 27
      ) {

        size -= 2;


        welcomeWord.style.fontSize =
          `${size}px`;

      }

    }


    function changeGreeting() {

      if (greetingBusy) {
        return;
      }


      greetingBusy =
        true;


      const nextGreeting =
        differentIndex(
          greetings.length,
          greetingIndex
        );


      const nextColor =
        differentIndex(
          welcomeColors.length,
          welcomeColorIndex
        );


      welcomeWord.classList.add(
        "is-fading"
      );


      window.setTimeout(() => {

        greetingIndex =
          nextGreeting;


        welcomeColorIndex =
          nextColor;


        welcomeWord.textContent =
          greetings[greetingIndex];


        welcomeWord.style.color =
          welcomeColors[
            welcomeColorIndex
          ];


        fitWelcome();


        welcomeWord.classList.remove(
          "is-fading"
        );


        window.setTimeout(() => {

          greetingBusy =
            false;

        }, 300);

      }, 250);

    /* =====================================================
       TEXTURE CACHE
       ===================================================== */

    let sessionTextures =
      [];


    let readyTextures =
      [];


    let recentTextures =
      [];


    function prepareTextures() {

      sessionTextures =
        shuffle(
          ALL_TEXTURES
        ).slice(
          0,
          28
        );


      readyTextures =
        [];


      sessionTextures.forEach(src => {

        const image =
          new Image();


        image.decoding =
          "async";


        image.onload =
          () => {

            if (
              !readyTextures.includes(
                src
              )
            ) {

              readyTextures.push(
                src
              );

            }

          };


        image.src =
          src;

      });

    }


    function chooseTexture() {

      const pool =
        readyTextures.length >= 8
          ? readyTextures
          : sessionTextures;


      let selected;


      let tries =
        0;


      do {

        selected =
          pick(pool);


        tries++;

      }
      while (
        recentTextures.includes(
          selected
        )
        &&
        tries < 15
      );


      recentTextures.push(
        selected
      );


      if (
        recentTextures.length > 9
      ) {

        recentTextures.shift();

      }


      return selected;

    }


    /* =====================================================

          paletteIndex
        );

        paletteIndex

      "color-burn",

      "hard-light",

      "overlay",

    /* =====================================================
       SLOT OBJECTS

       Every slot contains two frames.

       While one goes out, the other comes in.
       ===================================================== */

    function makeSlot(
      id,
      options
    ) {

      const element =
        document.getElementById(
          id
        );


      const frames =
        Array.from(
          element.querySelectorAll(
            ".morph-frame"
          )
        );


      return {

        element,
        frames,

        active:
          0,

        isColor:
          options.isColor || false,

        isOver:
          options.isOver || false,

        slowInterval:
          options.slowInterval,

        fastInterval:
          options.fastInterval,

        slowFade:
          options.slowFade,

        fastFade:
          options.fastFade,

        phase:
          options.phase || 0,

        nextChange:
          0

      };

    }


    const slots = [

      makeSlot(
        "under-slot-1",
        {
          isOver: false,
          slowInterval: 7.2,
          fastInterval: 1.15,
          slowFade: 4.8,
          fastFade: 0.65,

    /* =====================================================
       STATIC TEXTURE DESIGN
       ===================================================== */

    function tintGradient(
      palette
    ) {

      return `
        linear-gradient(
          ${random(0, 360)}deg,
          ${palette[0]} 0%,
          ${palette[1]} 48%,
          ${palette[2]} 100%
        )
      `;

    }


    function configureTextureFrame(
      frame,
      intensity,
      isOver
    ) {

      const src =
        chooseTexture();


      const palette =
        nextPalette();


      frame.style.backgroundImage =
        `
          ${tintGradient(palette)},
          url("${src}")
        `;


      frame.style.backgroundSize =
        "cover, cover";


      frame.style.backgroundPosition =
        `
          center,
          ${random(10, 90)}%
          ${random(10, 90)}%
        `;


      frame.style.backgroundRepeat =
        "no-repeat, no-repeat";


      frame.style.backgroundBlendMode =
        `
          ${pick(INTERNAL_BLEND)},
          normal
        `;


      frame.style.mixBlendMode =
        pick(
          isOver
            ? OVER_BLEND
            : UNDER_BLEND
        );


      /*
        Random once.
        Frozen while visible.
      */

      frame.style.transform =
        `
          translate(
            ${random(-3, 3)}%,
            ${random(-3, 3)}%
          )
          rotate(
            ${random(-3.5, 3.5)}deg
          )
          scale(
            ${random(1.07, 1.34)}
          )
        `;


      frame.style.filter =
        `
          contrast(
            ${random(1.08, 1.72)}
          )
          saturate(
            ${random(1.15, 2.15)}
          )
          brightness(
            ${random(0.74, 1.16)}
          )
        `;


      let opacity;


      if (isOver) {

        opacity =
          random(
            lerp(
              0.08,
              0.16,
              intensity
            ),
            lerp(
              0.24,
              0.47,
              intensity
            )
          );

      }

      else {

        opacity =
          random(
            lerp(
              0.28,
              0.38,
              intensity
            ),
            lerp(
              0.55,
              0.80,
              intensity
            )
          );

      }


      frame.dataset.targetOpacity =
        opacity.toFixed(3);

    }


    /* =====================================================
       COLOR FRAMES
       ===================================================== */

    function configureColorFrame(
      frame,
      intensity,
      isOver
    ) {

      const palette =
        nextPalette();


      const type =
        Math.floor(
          Math.random() * 3
        );


      if (type === 0) {

        frame.style.background =
          `
            linear-gradient(
              ${random(0, 360)}deg,
              ${palette[0]},
              ${palette[1]},
              ${palette[2]}
            )
          `;

      }

      else if (type === 1) {

        frame.style.background =
          `
            radial-gradient(
              circle at
              ${random(10, 90)}%
              ${random(10, 90)}%,
              ${palette[0]},
              transparent 55%
            ),
            radial-gradient(
              circle at
              ${random(10, 90)}%
              ${random(10, 90)}%,
              ${palette[1]},
              transparent 60%
            ),
            radial-gradient(
              circle at
              ${random(10, 90)}%
              ${random(10, 90)}%,
              ${palette[2]},
              transparent 62%
            )
          `;

      }

      else {

        frame.style.background =
          `
            conic-gradient(
              from ${random(0, 360)}deg
              at
              ${random(30, 70)}%
              ${random(30, 70)}%,
              ${palette[0]},
              ${palette[1]},
              ${palette[2]},
              ${palette[0]}
            )
          `;

      }


      frame.style.mixBlendMode =
        pick(
          isOver
            ? OVER_BLEND
            : UNDER_BLEND
        );


      frame.style.transform =
        `
          rotate(
            ${random(-3, 3)}deg
          )
          scale(
            ${random(1.02, 1.16)}
          )
        `;


      const opacity =
        isOver
          ? random(
              0.025,
              lerp(
                0.09,
                0.24,
                intensity
              )
            )
          : random(
              0.04,
              lerp(
                0.12,
                0.28,
                intensity
              )
            );


      frame.dataset.targetOpacity =
        opacity.toFixed(3);

    }


    /* =====================================================
       CROSSFADE

       This is the important new part.

       Incoming image fades up WHILE outgoing
       image fades away.
       ===================================================== */

    function morphSlot(
      slot,
      intensity,
      time
    ) {

      const outgoing =
        slot.frames[
          slot.active
        ];


      const incomingIndex =
        slot.active === 0
          ? 1
          : 0;


      const incoming =
        slot.frames[
          incomingIndex
        ];


      const duration =
        lerp(
          slot.slowFade,
          slot.fastFade,
          intensity
        );


      incoming.style.transitionDuration =
        `${duration}s`;


      outgoing.style.transitionDuration =
        `${duration}s`;


      /*
        Build incoming frame invisibly.
      */

      incoming.style.opacity =
        "0";


      if (
        slot.isColor
      ) {

        configureColorFrame(
          incoming,
          intensity,
          slot.isOver
        );

      }

      else {

        configureTextureFrame(
          incoming,
          intensity,
          slot.isOver
        );

      }


      /*
        Force layout before beginning dissolve.
      */

      incoming.offsetHeight;


      /*
        simultaneous crossfade
      */

      incoming.style.opacity =
        incoming.dataset.targetOpacity;


      outgoing.style.opacity =
        "0";


      slot.active =
        incomingIndex;


      /*
        independent slightly-random timing
      */

      const interval =
        lerp(
          slot.slowInterval,
          slot.fastInterval,
          intensity
        );


      slot.nextChange =
        time +
        random(
          interval * 0.84,
          interval * 1.16
        );

    }


    /* =====================================================
       INITIALIZE SLOT
       ===================================================== */

    function initializeSlot(
      slot,
      intensity,
      time
    ) {

      const first =
        slot.frames[0];


      const second =
        slot.frames[1];


      first.style.transitionDuration =
        "0s";


      second.style.transitionDuration =
        "0s";


      second.style.opacity =
        "0";


      if (
        slot.isColor
      ) {

        configureColorFrame(
          first,
          intensity,
          slot.isOver
        );

      }

      else {

        configureTextureFrame(
          first,
          intensity,
          slot.isOver
        );

      }


      first.style.opacity =
        first.dataset.targetOpacity;


      slot.active =
        0;


      slot.nextChange =
        time +
        slot.phase +
        random(
          slot.slowInterval * 0.6,
          slot.slowInterval
        );

    }


    /* =====================================================
       HORSE
       ===================================================== */

    let nextHorseChange =
      0;


    function changeHorse(
      intensity,
      time
    ) {

      const hue =
        random(
          -180,
          180
        );


      horseMain.style.mixBlendMode =
        pick(
          HORSE_BLEND
        );


      horseMain.style.filter =
        `
          hue-rotate(${hue}deg)
          saturate(
            ${random(1.2, 3.0)}
          )
          contrast(
            ${random(1.05, 1.8)}
          )
          brightness(
            ${random(0.76, 1.18)}
          )
        `;


      horseMain.style.opacity =
        random(
          0.62,
          0.94
        );


      horseOffset.style.mixBlendMode =
        pick(
          [
            "hard-light",
            "difference",
            "screen",
            "color-burn",
            "multiply",
            "exclusion"
          ]
        );


      horseOffset.style.filter =
        `
          hue-rotate(
            ${random(-180, 180)}deg
          )
          saturate(
            ${random(1.5, 3.4)}
          )
          contrast(
            ${random(1.1, 1.8)}
          )
        `;


      horseOffset.style.opacity =
        random(
          0.04,
          lerp(
            0.13,
            0.32,
            intensity
          )
        );


      horseOffset.style.transform =
        `
          translate(
            ${random(-4, 4)}px,
            ${random(-4, 4)}px
          )
        `;


      horseKey.style.opacity =
        lerp(
          0.28,
          0.48,
          intensity
        ).toFixed(3);


      const interval =
        lerp(
          6,
          1.15,
          intensity
        );


      nextHorseChange =
        time +
        random(
          interval * 0.85,
          interval * 1.15
        );

    }


    function normalHorse() {

      horseMain.style.mixBlendMode =
        "normal";


      horseMain.style.filter =
        "none";


      horseMain.style.opacity =
        "1";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";

    }


    /* =====================================================
       TIMELINE
       ===================================================== */

    const VISUAL_START =
      9;


    const VISUAL_FULL =
      25;


    const NORMAL_TIME =
      243;


    function revealAt(
      time
    ) {

      if (
        time < VISUAL_START
      ) {

        return 0;

      }


      return smoothStep(
        (
          time -
          VISUAL_START
        )
        /
        (
          VISUAL_FULL -
          VISUAL_START
        )
      );

    }


    function intensityAt(
      time
    ) {

      if (
        time < VISUAL_START ||
        time >= NORMAL_TIME
      ) {

        return 0;

      }


      /*
        restrained beginning
      */

      if (
        time < 75
      ) {

        return lerp(
          0.16,
          0.34,
          (
            time -
            VISUAL_START
          )
          /
          (
            75 -
            VISUAL_START
          )
        );

      }


      /*
        long gradual development
      */

      if (
        time < 175
      ) {

        return lerp(
          0.34,
          0.58,
          (
            time -
            75
          )
          /
          100
        );

      }


      /*
        tension begins accelerating
      */

      if (
        time < 220
      ) {

        return lerp(
          0.58,
          0.82,
          (
            time -
            175
          )
          /
          45
        );

      }


      /*
        final 23 seconds:
        increasingly manic
      */

      return lerp(
        0.82,
        1,
        (
          time -
          220
        )
        /
        23
      );

    }


    /* =====================================================
       STATE
       ===================================================== */

    let overlayOpen =
      false;


    let visualStarted =
      false;


    let normalState =
      false;


    let raf =
      null;


    function clearSlots() {

      slots.forEach(slot => {

        slot.frames.forEach(
          frame => {

            frame.style.opacity =
              "0";

          }
        );

      });

    }


    function startCollage(
      time,
      intensity
    ) {

      if (
        visualStarted
      ) {

        return;

      }


      visualStarted =
        true;


      slots.forEach(
        slot => {

          initializeSlot(
            slot,
            intensity,
            time
          );

        }
      );


      changeHorse(
        intensity,
        time
      );

    }


    function enterNormalState() {

      if (
        normalState
      ) {

        return;

      }


      normalState =
        true;


      clearSlots();


      normalHorse();


      stage.classList.add(
        "is-normal"
      );

    }


    /* =====================================================
       LOOP
       ===================================================== */

    function visualLoop() {

      if (
        !overlayOpen
      ) {

        return;

      }


      const time =
        audio.currentTime || 0;


      const reveal =
        revealAt(
          time
        );


      /*
        stage fades in
      */

      stage.style.setProperty(
        "--visual-reveal",
        reveal.toFixed(4)
      );


      /*
        background behind stage fades in
        at exactly the same pace
      */

      overlay.style.setProperty(
        "--overlay-reveal",
        reveal.toFixed(4)
      );


      /*
        homepage disappears as artwork arrives
      */

      pageShell.style.opacity =
        (
          1 -
          (
            reveal * 0.98
          )
        ).toFixed(4);


      /*
        first nine seconds:
        note only
      */

      if (
        time <
        VISUAL_START
      ) {

        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      const intensity =
        intensityAt(
          time
        );


      if (
        !visualStarted
      ) {

        startCollage(
          time,
          intensity
        );

      }


      /*
        4:03:
        remove everything except original GIF.
      */

      if (
        time >=
        NORMAL_TIME
      ) {

        enterNormalState();


        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      /*
        Every projector / collage channel
        evolves independently.
      */

      slots.forEach(slot => {

        if (
          time >=
          slot.nextChange
        ) {

          morphSlot(
            slot,
            intensity,
            time
          );

        }

      });


      /*
        Horse plate also gradually changes,
        with faster changes toward climax.
      */

      if (
        time >=
        nextHorseChange
      ) {

        changeHorse(
          intensity,
          time
        );

      }


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       OPEN / CLOSE
       ===================================================== */

    async function openWip() {

      overlayOpen =
        true;


      visualStarted =
        false;


      normalState =
        false;


      recentTextures =
        [];


      paletteIndex =
        Math.floor(
          Math.random() *
          PALETTES.length
        );


      nextHorseChange =
        VISUAL_START +
        3;


      clearSlots();


      normalHorse();


      stage.classList.remove(
        "is-normal"
      );


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      overlay.style.setProperty(
        "--overlay-reveal",
        "0"
      );


      pageShell.style.opacity =
        "1";


      prepareTextures();


      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.pause();


      audio.currentTime =
        0;


      audio.volume =
        0.72;


      try {

        await audio.play();

      }

      catch (error) {

        console.log(
          "Audio could not start:",
          error
        );

      }


      cancelAnimationFrame(
        raf
      );


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    function closeWip() {

      overlayOpen =
        false;


      cancelAnimationFrame(
        raf
      );


      audio.pause();


      audio.currentTime =
        0;


      clearSlots();


      normalHorse();


      pageShell.style.opacity =
        "1";


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );

    }


    /* =====================================================
       LINKS
       ===================================================== */

    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );


        if (!link) {
          return;
        }


        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
          &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>

</body>
