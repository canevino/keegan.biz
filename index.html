    const clamp = (value, min, max) =>
      Math.min(
        Math.max(value, min),
        max
      );


    const lerp = (a, b, t) =>
      a + ((b - a) * t);


    const random = (min, max) =>
      min + Math.random() * (max - min);


    const pick = array =>
      array[
        Math.floor(
          Math.random() * array.length
        )
      ];


    function shuffle(array) {

      const copy =
        [...array];


      for (
        let i = copy.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );


        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }


      return copy;

    }


    function differentIndex(
      length,
      current
    ) {

      let next;


      do {

        next =
          Math.floor(
            Math.random() * length
          );

      }
      while (
        length > 1 &&
        next === current
      );


      return next;

    }


    function smoothStep(value) {

      const t =
        clamp(
          value,
          0,
          1
        );


      return (
        t *
        t *
        (3 - (2 * t))
      );

    }

          welcomeColors.length,
          welcomeColorIndex

        welcomeWord.style.color =

    /* =====================================================
       TEXTURE PRELOADING
       ===================================================== */

    let sessionTextures =
      [];


    let readyTextures =
      [];


    let recentTextures =
      [];


    function markTextureReady(src) {

      if (
        !readyTextures.includes(
          src
        )
      ) {

        readyTextures.push(
          src
        );

      }

    }


    function prepareTextures() {

      sessionTextures =
        shuffle(
          ALL_TEXTURES
        ).slice(
          0,
          28
        );


      readyTextures =
        [];


      sessionTextures.forEach(src => {

        const image =
          new Image();


        image.decoding =
          "async";


        image.onload =
          () => {

            markTextureReady(
              src
            );

          };


        image.src =
          src;


        if (
          typeof image.decode ===
          "function"
        ) {

          image
            .decode()
            .then(() => {

              markTextureReady(
                src
              );

            })
            .catch(() => {});

        }

      });

    }


    function chooseTexture() {

      const pool =
        readyTextures.length >= 8
          ? readyTextures
          : sessionTextures;


      let selected;


      let tries =
        0;


      do {

        selected =
          pick(pool);


        tries++;

      }
      while (
        recentTextures.includes(
          selected
        ) &&
        tries < 16
      );


      recentTextures.push(
        selected
      );


      if (
        recentTextures.length > 9
      ) {

        recentTextures.shift();

      }


      return selected;

    }


    /* =====================================================

    /* =====================================================
       MORPH SLOT FACTORY
       ===================================================== */

    function makeSlot(
      id,
      options
    ) {

      const element =
        document.getElementById(
          id
        );


      const frames =
        Array.from(
          element.querySelectorAll(
            ".morph-frame"
          )
        );


      return {

        frames,

        active:
          0,

        isColor:
          options.isColor || false,

        isOver:
          options.isOver || false,

        slowFade:
          options.slowFade,

        fastFade:
          options.fastFade,

        phase:
          options.phase || 0,

        nextChange:
          Infinity,

        startTimer:
          null

      };

    }

    /* =====================================================
       NEUTRAL TEXTURE FRAME
       ===================================================== */

    function neutralGradient(
      palette
    ) {

      return `
        linear-gradient(
          ${random(0, 360)}deg,
          ${palette[0]} 0%,
          ${palette[1]} 48%,
          ${palette[2]} 100%
        )
      `;

    }


    function configureTextureFrame(
      frame,
      intensity,
      isOver
    ) {

      const src =
        chooseTexture();


      const palette =
        nextMonoPalette();


      frame.style.backgroundImage =
        `
          ${neutralGradient(palette)},
          url("${src}")
        `;


      frame.style.backgroundSize =
        "cover, cover";


      frame.style.backgroundPosition =
        `
          center,
          ${random(10, 90)}%
          ${random(10, 90)}%
        `;


      frame.style.backgroundRepeat =
        "no-repeat, no-repeat";


      frame.style.backgroundBlendMode =
        `
          ${pick(INTERNAL_BLEND)},
          normal
        `;


      frame.style.mixBlendMode =
        pick(
          isOver
            ? OVER_BLEND
            : UNDER_BLEND
        );


      /*
        Static crop.
        It never moves while visible.
      */

      frame.style.transform =
        `
          translate(
            ${random(-3, 3)}%,
            ${random(-3, 3)}%
          )
          rotate(
            ${random(-3.5, 3.5)}deg
          )
          scale(
            ${random(1.07, 1.34)}
          )
        `;


      /*
        Entire texture is explicitly desaturated.
      */

      frame.style.filter =
        `
          grayscale(1)
          saturate(0)
          contrast(
            ${random(1.08, 1.82)}
          )
          brightness(
            ${random(0.72, 1.14)}
          )
          sepia(
            ${random(0, 0.08)}
          )
        `;


      let opacity;


      if (isOver) {

        opacity =
          random(
            lerp(
              0.07,
              0.14,
              intensity
            ),
            lerp(
              0.18,
              0.36,
              intensity
            )
          );

      }

      else {

        opacity =
          random(
            lerp(
              0.24,
              0.36,
              intensity
            ),
            lerp(
              0.50,
              0.72,
              intensity
            )
          );

      }


      frame.dataset.targetOpacity =
        opacity.toFixed(3);

    }


    /* =====================================================

    function configureColorFrame(
      frame,

      const palette =
        nextMonoPalette();


      const dark =
        palette[0];


      const mid =

        palette[2];


      const type =
        Math.floor(
          Math.random() * 4
        );


      if (type === 0) {

        frame.style.background =
          `
            linear-gradient(
              ${random(0, 360)}deg,
              ${dark},
              ${mid},
              ${light}
            )
          `;

      }

      else if (type === 1) {

        frame.style.background =
          `
            radial-gradient(
              circle at
              ${random(10, 90)}%
              ${random(10, 90)}%,
              ${light},
              transparent 56%
            ),

            radial-gradient(
              circle at
              ${random(10, 90)}%
              ${random(10, 90)}%,
              ${mid},
              transparent 62%
            ),

            radial-gradient(
              circle at
              ${random(10, 90)}%
              ${random(10, 90)}%,
              ${dark},
              transparent 64%
            )
          `;

      }

      else if (type === 2) {

        frame.style.background =
          `
            conic-gradient(
              from
              ${random(0, 360)}deg
              at
              ${random(30, 70)}%
              ${random(30, 70)}%,
              ${dark},
              ${mid},
              ${light},
              ${dark}
            )
          `;

      }

      else {

        frame.style.background =
          `
            linear-gradient(
              ${random(0, 360)}deg,
              ${dark} 0%,
              transparent 32%,
              ${mid} 52%,
              transparent 72%,
              ${light} 100%
            )
          `;

      }


      frame.style.mixBlendMode =
        pick(
          isOver
            ? OVER_BLEND
            : UNDER_BLEND
        );


      frame.style.filter =
        `
          grayscale(1)
          saturate(0)
          contrast(
            ${random(1.0, 1.4)}
          )
        `;


      frame.style.transform =
        `
          rotate(
            ${random(-3, 3)}deg
          )
          scale(
            ${random(1.02, 1.16)}
          )
        `;


      const opacity =
        isOver
          ? random(
              0.02,
              lerp(
                0.06,
                0.15,
                intensity
              )
            )
          : random(
              0.03,
              lerp(
                0.08,
                0.18,
                intensity
              )
            );


      frame.dataset.targetOpacity =
        opacity.toFixed(3);

    }


    /* =====================================================
       INITIAL SLOT
       ===================================================== */

    function initializeSlot(
      slot,
      intensity,
      time
    ) {

      slot.frames.forEach(
        frame => {

          if (
            frame._fadeTimer
          ) {

            clearTimeout(
              frame._fadeTimer
            );


            frame._fadeTimer =
              null;

          }


          frame.style.transitionDuration =
            "0s";


          frame.style.opacity =
            "0";

        }
      );


      const first =
        slot.frames[0];


      if (
        slot.isColor
      ) {

        configureColorFrame(
          first,
          intensity,
          slot.isOver
        );

      }

      else {

        configureTextureFrame(
          first,
          intensity,
          slot.isOver
        );

      }


      const fadeDuration =
        slot.slowFade;


      const initialDelay =
        slot.phase * 0.45;


      first.style.transitionDuration =
        `${fadeDuration}s`;


      slot.active =
        0;


      slot.startTimer =
        window.setTimeout(
          () => {

            if (
              !overlayOpen ||
              normalState
            ) {

              return;

            }


            first.offsetHeight;


            requestAnimationFrame(() => {

              first.style.opacity =
                first.dataset.targetOpacity;

            });

          },
          initialDelay * 1000
        );


      /*
        Next image starts before this one
        has finished fading in.
      */

      slot.nextChange =
        time +
        initialDelay +
        (
          fadeDuration *
          0.62
        );

    }


    /* =====================================================
       CONTINUOUS CROSSFADE
       ===================================================== */

    function morphSlot(
      slot,
      intensity,
      time
    ) {

      const outgoingIndex =
        slot.active;


      const incomingIndex =
        (
          slot.active + 1
        )
        %
        slot.frames.length;


      const outgoing =
        slot.frames[
          outgoingIndex
        ];


      const incoming =
        slot.frames[
          incomingIndex
        ];


      if (
        incoming._fadeTimer
      ) {

        clearTimeout(
          incoming._fadeTimer
        );


        incoming._fadeTimer =
          null;

      }


      const fadeDuration =
        lerp(
          slot.slowFade,
          slot.fastFade,
          intensity
        );


      incoming.style.transitionDuration =
        `${fadeDuration}s`;


      outgoing.style.transitionDuration =
        `${fadeDuration}s`;


      incoming.style.opacity =
        "0";


      if (
        slot.isColor
      ) {

        configureColorFrame(
          incoming,
          intensity,
          slot.isOver
        );

      }

      else {

        configureTextureFrame(
          incoming,
          intensity,
          slot.isOver
        );

      }


      incoming.offsetHeight;


      requestAnimationFrame(() => {

        incoming.style.opacity =
          incoming.dataset.targetOpacity;

      });


      /*
        Incoming exists alongside outgoing
        before outgoing begins disappearing.
      */

      const fadeOutDelay =
        fadeDuration *
        random(
          0.28,
          0.42
        );


      if (
        outgoing._fadeTimer
      ) {

        clearTimeout(
          outgoing._fadeTimer
        );

      }


      outgoing._fadeTimer =
        window.setTimeout(
          () => {

            outgoing.style.opacity =
              "0";


            outgoing._fadeTimer =
              null;

          },
          fadeOutDelay * 1000
        );


      slot.active =
        incomingIndex;


      /*
        Next transformation begins while this
        transformation is still underway.
      */

      const overlap =
        lerp(
          0.62,
          0.50,
          intensity
        );


      slot.nextChange =
        time +
        (
          fadeDuration *
          overlap *
          random(
            0.92,
            1.08
          )
        );

    }


    /* =====================================================
       HORSE COLOR
       ===================================================== */

    let nextHorseChange =
      Infinity;


    function changeHorse(
      intensity,
      time
    ) {

      const color =
        nextHorseColor();


      const transition =
        lerp(
          4.5,
          0.9,
          intensity
        );


      /*
        Main horse color morphs gradually.
      */

      horseMain.style.transitionDuration =
        `${transition}s`;


      horseOffset.style.transitionDuration =
        `${transition}s`;


      horseKey.style.transitionDuration =
        `${transition}s`;


      horseMain.style.mixBlendMode =
        pick(
          HORSE_BLEND
        );


      /*
        sepia supplies chroma to the grayscale
        source; hue-rotate then chooses the color.
      */

      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(
            ${random(
              color.saturation,
              color.saturation + 2.5
            )}
          )
          hue-rotate(
            ${color.hue}deg
          )
          contrast(
            ${random(1.12, 1.52)}
          )
          brightness(
            ${random(0.88, 1.08)}
          )
        `;


      horseMain.style.opacity =
        random(
          0.80,
          0.98
        );


      /*
        Slight second color-print plate.
      */

      horseOffset.style.mixBlendMode =
        pick(
          [
            "multiply",
            "overlay",
            "hard-light",
            "screen"
          ]
        );


      horseOffset.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(
            ${random(
              color.saturation + 1,
              color.saturation + 4
            )}
          )
          hue-rotate(
            ${
              color.hue +
              random(-28, 28)
            }deg
          )
          contrast(
            ${random(1.1, 1.65)}
          )
        `;


      horseOffset.style.opacity =
        random(
          0.03,
          lerp(
            0.12,
            0.28,
            intensity
          )
        );


      /*
        Very small registration offset only.
        No continuous movement.
      */

      horseOffset.style.transform =
        `
          translate(
            ${random(-3, 3)}px,
            ${random(-3, 3)}px
          )
        `;


      /*
        Neutral line key prevents horse disappearing.
      */

      horseKey.style.opacity =
        lerp(
          0.16,
          0.30,
          intensity
        ).toFixed(3);


      const interval =
        lerp(
          9,
          1.7,
          intensity
        );


      nextHorseChange =
        time +
        random(
          interval * 0.88,
          interval * 1.12
        );

    }


    function cleanColoredHorse() {

      const color =
        nextHorseColor();


      horseMain.style.transitionDuration =
        "2.5s";


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(
            ${color.saturation}
          )
          hue-rotate(
            ${color.hue}deg
          )
          contrast(1.25)
          brightness(1.02)
        `;


      horseMain.style.opacity =
        "0";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";

    }


    function normalHorse() {

      horseMain.style.transitionDuration =
        "500ms";


      horseMain.style.mixBlendMode =
        "normal";


      horseMain.style.filter =
        "none";


      horseMain.style.opacity =
        "1";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";

    }


    /* =====================================================
       TIMELINE
       ===================================================== */

    const HORSE_START =
      12;


    const HORSE_FULL =
      20;


    const COLLAGE_START =
      30;


    const NORMAL_TIME =
      243;


    function horseRevealAt(
      time
    ) {

      if (
        time <
        HORSE_START
      ) {

        return 0;

      }


      return smoothStep(
        (
          time -
          HORSE_START
        )
        /
        (
          HORSE_FULL -
          HORSE_START
        )
      );

    }


    function intensityAt(
      time
    ) {

      if (
        time <
        COLLAGE_START ||
        time >=
        NORMAL_TIME
      ) {

        return 0;

      }


      if (
        time < 90
      ) {

        return lerp(
          0.08,
          0.28,
          (
            time -
            COLLAGE_START
          )
          /
          (
            90 -
            COLLAGE_START
          )
        );

      }


      if (
        time < 175
      ) {

        return lerp(
          0.28,
          0.55,
          (
            time -
            90
          )
          /
          85
        );

      }


      if (
        time < 220
      ) {

        return lerp(
          0.55,
          0.80,
          (
            time -
            175
          )
          /
          45
        );

      }


      return lerp(
        0.80,
        1,
        (
          time -
          220
        )
        /
        23
      );

    }


    /* =====================================================
       STATE
       ===================================================== */

    let overlayOpen =
      false;


    let collageStarted =
      false;


    let normalState =
      false;


    let horseColorStarted =
      false;


    let raf =
      null;


    function clearSlotTimers() {

      slots.forEach(slot => {

        if (
          slot.startTimer
        ) {

          clearTimeout(
            slot.startTimer
          );


          slot.startTimer =
            null;

        }


        slot.frames.forEach(
          frame => {

            if (
              frame._fadeTimer
            ) {

              clearTimeout(
                frame._fadeTimer
              );


              frame._fadeTimer =
                null;

            }

          }
        );

      });

    }


    function clearSlots(
      instant = true
    ) {

      clearSlotTimers();


      slots.forEach(slot => {

        slot.nextChange =
          Infinity;


        slot.frames.forEach(
          frame => {

            frame.style.transitionDuration =
              instant
                ? "0s"
                : "500ms";


            frame.style.opacity =
              "0";

          }
        );

      });

    }


    function startCollage(
      time,
      intensity
    ) {

      if (
        collageStarted
      ) {

        return;

      }


      collageStarted =
        true;


      slots.forEach(
        slot => {

          initializeSlot(
            slot,
            intensity,
            time
          );

        }
      );


      nextHorseChange =
        time + 3;

    }


    function enterNormalState() {

      if (
        normalState
      ) {

        return;

      }


      normalState =
        true;


      clearSlots(
        false
      );


      normalHorse();


      stage.classList.add(
        "is-normal"
      );

    }


    /* =====================================================
       MAIN LOOP
       ===================================================== */

    function visualLoop() {

      if (
        !overlayOpen
      ) {

        return;

      }


      const time =
        audio.currentTime || 0;


      const reveal =
        horseRevealAt(
          time
        );


      stage.style.setProperty(
        "--visual-reveal",
        reveal.toFixed(4)
      );


      /*
        0–12:
        message only.
      */

      if (
        time <
        HORSE_START
      ) {

        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      /*
        Begin with colored horse,
        but still no collage.
      */

      if (
        !horseColorStarted
      ) {

        horseColorStarted =
          true;


        cleanColoredHorse();

      }


      /*
        Manually follow reveal opacity during the
        initial clean-horse section.
      */

      if (
        time <
        COLLAGE_START
      ) {

        horseMain.style.opacity =
          reveal.toFixed(3);


        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      /*
        4:03:
        all treatment disappears;
        original GIF remains.
      */

      if (
        time >=
        NORMAL_TIME
      ) {

        enterNormalState();


        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      const intensity =
        intensityAt(
          time
        );


      if (
        !collageStarted
      ) {

        startCollage(
          time,
          intensity
        );


        changeHorse(
          intensity,
          time
        );

      }


      /*
        Six desaturated projector channels
        continuously dissolve.
      */

      slots.forEach(slot => {

        if (
          time >=
          slot.nextChange
        ) {

          morphSlot(
            slot,
            intensity,
            time
          );

        }

      });


      /*
        Only the horse changes color.
      */

      if (
        time >=
        nextHorseChange
      ) {

        changeHorse(
          intensity,
          time
        );

      }


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       OPEN
       ===================================================== */

    async function openWip() {

      if (
        overlayOpen
      ) {

        return;

      }


      overlayOpen =
        true;


      collageStarted =
        false;


      normalState =
        false;


      horseColorStarted =
        false;


      recentTextures =
        [];


      monoPaletteIndex =
        Math.floor(
          Math.random() *
          MONO_PALETTES.length
        );


      horseColorIndex =
        Math.floor(
          Math.random() *
          HORSE_COLORS.length
        );


      nextHorseChange =
        Infinity;


      clearSlots(
        true
      );


      normalHorse();


      stage.classList.remove(
        "is-normal"
      );


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      /*
        Start texture decoding immediately.

        Collage won't actually begin until 30 sec.
      */

      prepareTextures();


      /*
        Hide homepage instantly.
      */

      pageShell.classList.add(
        "is-hidden"
      );


      /*
        Show WIP screen immediately.
      */

      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      /*
        Restart soundtrack.
      */

      audio.pause();


      audio.currentTime =
        0;


      audio.volume =
        0.72;


      try {

        await audio.play();

      }

      catch (error) {

        console.log(
          "Audio could not start:",
          error
        );

      }


      cancelAnimationFrame(
        raf
      );


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       CLOSE
       ===================================================== */

    function closeWip() {

      overlayOpen =
        false;


      cancelAnimationFrame(
        raf
      );


      clearSlots(
        true
      );


      audio.pause();


      audio.currentTime =
        0;


      normalHorse();


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      window.setTimeout(() => {

        pageShell.classList.remove(
          "is-hidden"
        );

      }, 160);

    }


    /* =====================================================
       LINKS
       ===================================================== */

    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );


        if (!link) {
          return;
        }


        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape"
          &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>

</body>
