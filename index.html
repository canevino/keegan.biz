  <script>
  (() => {

    /* =====================================================
       HELPERS
       ===================================================== */

    const clamp = (value, min, max) =>
      Math.min(
        Math.max(value, min),
        max
      );


    const lerp = (a, b, t) =>
      a + ((b - a) * t);


    const random = (min, max) =>
      min + Math.random() * (max - min);


    const pick = array =>
      array[
        Math.floor(
          Math.random() *
          array.length
        )
      ];


    function shuffle(array) {

      const result =
        [...array];


      for (
        let i = result.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }


      return result;

    }


    function differentIndex(
      length,
      current
    ) {

      let next;


      do {

        next =
          Math.floor(
            Math.random() *
            length
          );

      }
      while (
        length > 1 &&
        next === current
      );


      return next;

    }


    function smoothStep(value) {

      const t =
        clamp(
          value,
          0,
          1
        );


      return (
        t *
        t *
        (
          3 -
          (2 * t)
        )
      );

    }


    /* =====================================================

    /* =====================================================

    const greetings = [

    const welcomeColors = [

    let greetingIndex =
      0;


    let welcomeColorIndex =
      1;


    let greetingBusy =
      false;


    function fitWelcome() {

      welcomeWord.style.fontSize =
        "";


      const available =
        welcomeWord
          .parentElement
          .clientWidth;


      let size =
        parseFloat(
          getComputedStyle(
            welcomeWord
          ).fontSize
        );


      while (
        welcomeWord.scrollWidth >
        available &&
        size > 27
      ) {

        size -= 2;


        welcomeWord.style.fontSize =
          `${size}px`;

      }

    }


    function changeGreeting() {

      if (greetingBusy) {
        return;
      }


      greetingBusy =
        true;


      const nextGreeting =
        differentIndex(
          greetings.length,
          greetingIndex
        );


      const nextColor =
        differentIndex(
          welcomeColors.length,
          welcomeColorIndex
        );


      welcomeWord.classList.add(
        "is-fading"
      );


      window.setTimeout(() => {

        greetingIndex =
          nextGreeting;


        welcomeColorIndex =
          nextColor;


        welcomeWord.textContent =
          greetings[
            greetingIndex
          ];


        welcomeWord.style.color =
          welcomeColors[
            welcomeColorIndex
          ];


        fitWelcome();


        welcomeWord.classList.remove(
          "is-fading"
        );


        window.setTimeout(() => {

          greetingBusy =
            false;

        }, 300);

      }, 250);

    }


    welcomeWord.style.color =
      welcomeColors[
        welcomeColorIndex
      ];


    fitWelcome();


    window.addEventListener(
      "resize",
      fitWelcome
    );


    window.setInterval(
      changeGreeting,
      2500
    );


    /* =====================================================

    /* =====================================================

      "Texturelabs_LensFX_251S.jpg",

      "Texturelabs_Paper_324S.jpg",

      file =>

    const DIRTY_TEXTURES =
      ALL_TEXTURES.filter(
        src =>
          /Grunge|Concrete|Soil|Stone|Wood|Metal|Film|Brick|Paper|InkPaint/i
            .test(src)
      );


    const SOFTER_TEXTURES =
      ALL_TEXTURES.filter(
        src =>
          !DIRTY_TEXTURES.includes(
            src
          )
      );


    /* =====================================================
       PRELOAD
       ===================================================== */

    let sessionTextures =
      [];


    let readyTextures =
      [];


    let recentTextures =
      [];


    function prepareTextures() {

      const dirtyCount =
        isMobile()
          ? 13
          : 18;


      const softCount =
        isMobile()
          ? 3
          : 6;


      sessionTextures = [

        ...shuffle(
          DIRTY_TEXTURES
        ).slice(
          0,
          dirtyCount
        ),

        ...shuffle(
          SOFTER_TEXTURES
        ).slice(
          0,
          softCount
        )

      ];


      readyTextures =
        [];


      sessionTextures.forEach(src => {

        const image =
          new Image();


        image.decoding =
          "async";


        image.onload =
          () => {

            if (
              !readyTextures.includes(
                src
              )
            ) {

              readyTextures.push(
                src
              );

            }

          };


        image.src =
          src;

      });

    }


    function chooseTexture() {

      const readyDirty =
        readyTextures.filter(
          src =>
            DIRTY_TEXTURES.includes(
              src
            )
        );


      const pool =
        (
          Math.random() < 0.82 &&
          readyDirty.length > 3
        )
          ? readyDirty
          : (
              readyTextures.length > 5
                ? readyTextures
                : sessionTextures
            );


      let result;


      let attempts =
        0;


      do {

        result =
          pick(pool);


        attempts++;

      }
      while (
        recentTextures.includes(
          result
        ) &&
        attempts < 14
      );


      recentTextures.push(
        result
      );


      if (
        recentTextures.length > 7
      ) {

        recentTextures.shift();

      }


      return result;

    }


    /* =====================================================
       HORSE PIGMENTS

       More chromatic than previous version,
       but still all natural / mineral / plant-like.
       ===================================================== */

          "burnt sienna",

        hue:
          -13,

        saturation:
          3.55,

        brightness:
          0.94,

        contrast:
          1.28
      },

        hue:
          69,

          2.85,

        brightness:
          0.84,

          1.24
      },

      {

          "ocean blue",

        hue:
          151,

        saturation:
          3.25,

        brightness:
          0.91,

        contrast:
          1.22
      },

      {

          "canyon red",

        hue:
          -28,

        saturation:
          3.65,

        brightness:
          0.89,

        contrast:
          1.30
      },

          "dirt brown",

          4,

          67,

          1.72,

          1.08,

        hue:
          187,

        saturation:
          3.05,

        brightness:
          0.82,

        contrast:
          1.27
      }

    ];


    /*
      Opening deliberately excludes the quietest
      earth tones.

      This is what fixes the weak beginning.
    */

    const OPENING_COLORS = [
      HORSE_COLORS[0],
      HORSE_COLORS[1],
      HORSE_COLORS[2],
      HORSE_COLORS[3],
      HORSE_COLORS[6]
    ];


    const EARLY_COLORS = [
      HORSE_COLORS[0],
      HORSE_COLORS[1],
      HORSE_COLORS[2],
      HORSE_COLORS[3],
      HORSE_COLORS[6]
    ];


    let horseColorIndex =
      0;


    let lastHorseColorName =
      "";


    function differentHorseColor(
      pool
    ) {

      let result;


      let attempts =
        0;


      do {

        result =
          pick(pool);


        attempts++;

      }
      while (
        result.name ===
          lastHorseColorName &&
        attempts < 12
      );


      lastHorseColorName =
        result.name;


      return result;

    }


    function nextHorseColor(
      time
    ) {

      /*
        First minute stays with the stronger
        pigments.

        Brown and sage enter later as contrast,
        rather than dominating the opening.
      */

      if (
        time < 75
      ) {

        return differentHorseColor(
          EARLY_COLORS
        );

      }


      return differentHorseColor(
        HORSE_COLORS
      );

    }


    /* =====================================================
       TEXTURE SLOTS
       ===================================================== */

    function makeSlot(
      id,
      options
    ) {

      const element =
        document.getElementById(
          id
        );


      return {

        element,

        frames:
          Array.from(
            element.querySelectorAll(
              ".morph-frame"
            )
          ),

        active:
          0,

        role:
          options.role,

        desktopBlend:
          options.desktopBlend,

        mobileBlend:
          options.mobileBlend,

        internalBlend:
          options.internalBlend,

        slowDuration:
          options.slowDuration,

        fastDuration:
          options.fastDuration,

        phase:
          options.phase,

        mobileEnabled:
          options.mobileEnabled !== false,

        nextChange:
          Infinity

      };

    }


    const slots = [

      makeSlot(
        "under-slot-1",
        {
          role:
            "foundation",

          desktopBlend:
            "multiply",

          mobileBlend:

    /* =====================================================
       TEXTURE DESIGN
       ===================================================== */

    function neutralTint() {

      const dark =
        pick([
          "#060605",
          "#11100e",
          "#1a1714",
          "#25211c"
        ]);


      const mid =
        pick([
          "#49443d",
          "#5a544b",
          "#6e665b",
          "#7a7164"
        ]);


      const light =
        pick([
          "#c5bdae",
          "#d2cabc",
          "#ded5c7",
          "#e8dfd1"
        ]);


      return `
        linear-gradient(
          ${random(0, 360)}deg,
          ${dark} 0%,
          ${mid} 52%,
          ${light} 100%
        )
      `;

    }


    function opacityForSlot(
      slot,
      intensity
    ) {

      if (
        slot.role ===
        "foundation"
      ) {

        return isMobile()
          ? random(
              lerp(
                0.48,
                0.56,
                intensity
              ),
              lerp(
                0.62,
                0.72,
                intensity
              )
            )
          : random(
              lerp(
                0.60,
                0.68,
                intensity
              ),
              lerp(
                0.78,
                0.88,
                intensity
              )
            );

      }


      if (
        slot.role ===
        "secondary"
      ) {

        return isMobile()
          ? random(
              0.24,
              lerp(
                0.35,
                0.48,
                intensity
              )
            )
          : random(
              0.34,
              lerp(
                0.50,
                0.64,
                intensity
              )
            );

      }


      return random(
        0.08,
        lerp(
          0.16,
          0.27,
          intensity
        )
      );

    }


    function configureFrame(
      frame,
      slot,
      intensity
    ) {

      const texture =
        chooseTexture();


      frame.style.backgroundImage =
        `
          ${neutralTint()},
          url("${texture}")
        `;


      frame.style.backgroundSize =
        "cover, cover";


      frame.style.backgroundRepeat =
        "no-repeat, no-repeat";


      frame.style.backgroundPosition =
        `
          center,
          ${random(12, 88)}%
          ${random(12, 88)}%
        `;


      frame.style.backgroundBlendMode =
        `
          ${slot.internalBlend},
          normal
        `;


      frame.style.mixBlendMode =
        isMobile()
          ? slot.mobileBlend
          : slot.desktopBlend;


      const rotation =
        isMobile()
          ? random(-0.8, 0.8)
          : random(-2, 2);


      const translate =
        isMobile()
          ? 1
          : 2.2;


      const scale =
        isMobile()
          ? random(1.05, 1.14)
          : random(1.07, 1.24);


      frame.style.transform =
        `
          translate(
            ${random(
              -translate,
              translate
            )}%,
            ${random(
              -translate,
              translate
            )}%
          )
          rotate(
            ${rotation}deg
          )
          scale(
            ${scale}
          )
        `;


      if (
        isMobile()
      ) {

        frame.style.filter =
          `
            grayscale(1)
            saturate(0)
            contrast(
              ${random(1.16, 1.42)}
            )
            brightness(
              ${random(0.74, 0.94)}
            )
          `;

      }

      else {

        frame.style.filter =
          `
            grayscale(1)
            saturate(0)
            contrast(
              ${random(1.28, 1.72)}
            )
            brightness(
              ${random(0.64, 0.92)}
            )
            sepia(
              ${random(0.02, 0.07)}
            )
          `;

      }


      frame.dataset.targetOpacity =
        opacityForSlot(
          slot,
          intensity
        ).toFixed(3);

    }


    /* =====================================================
       INITIAL TEXTURE
       ===================================================== */

    function initializeSlot(
      slot,
      intensity,
      time
    ) {

      if (
        isMobile() &&
        !slot.mobileEnabled
      ) {

        slot.element.style.display =
          "none";


        slot.nextChange =
          Infinity;


        return;

      }


      slot.element.style.display =
        "";


      slot.frames.forEach(
        frame => {

          frame.style.transitionDuration =
            "0s";


          frame.style.opacity =
            "0";

        }
      );


      slot.active =
        0;


      const first =
        slot.frames[0];


      configureFrame(
        first,
        slot,
        intensity
      );


      const initialFade =
        isMobile()
          ? 6
          : 7;


      first.style.transitionDuration =
        `${initialFade}s`;


      first.offsetHeight;


      window.setTimeout(
        () => {

          if (
            !overlayOpen ||
            normalState
          ) {

            return;

          }


          first.style.opacity =
            first.dataset.targetOpacity;

        },
        slot.phase * 1000
      );


      slot.nextChange =
        time +
        slot.phase +
        initialFade;

    }


    /* =====================================================
       CONTINUOUS CROSSFADE
       ===================================================== */

    function morphSlot(
      slot,
      intensity,
      time
    ) {

      const outgoing =
        slot.frames[
          slot.active
        ];


      const incomingIndex =
        slot.active === 0
          ? 1
          : 0;


      const incoming =
        slot.frames[
          incomingIndex
        ];


      let duration =
        lerp(
          slot.slowDuration,
          slot.fastDuration,
          intensity
        );


      if (
        isMobile()
      ) {

        duration =
          Math.max(
            duration,
            3.2
          );

      }


      incoming.style.transitionDuration =
        "0s";


      incoming.style.opacity =
        "0";


      configureFrame(
        incoming,
        slot,
        intensity
      );


      incoming.offsetHeight;


      incoming.style.transitionDuration =
        `${duration}s`;


      outgoing.style.transitionDuration =
        `${duration}s`;


      requestAnimationFrame(() => {

        incoming.style.opacity =
          incoming.dataset.targetOpacity;


        outgoing.style.opacity =
          "0";

      });


      slot.active =
        incomingIndex;


      slot.nextChange =
        time +
        (
          duration *
          0.96
        );

    }


    /* =====================================================
       HORSE COLOR
       ===================================================== */

    let nextHorseChange =
      Infinity;


    function applyHorseColor(
      color,
      intensity,
      time
    ) {

      /*
        Still gradual, but visibly chromatic.
      */

      const transition =
        lerp(
          5.8,
          isMobile()
            ? 3.4
            : 2.5,
          intensity
        );


      horseMain.style.transitionDuration =
        `${transition}s`;


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(
            ${
              color.saturation *
              random(
                0.97,
                1.10
              )
            }
          )
          hue-rotate(
            ${
              color.hue +
              random(-2.5, 2.5)
            }deg
          )
          contrast(
            ${
              color.contrast *
              random(
                0.98,
                1.04
              )
            }
          )
          brightness(
            ${
              color.brightness *
              random(
                0.99,
                1.03
              )
            }
          )
        `;


      /*
        Keep the colored linework strong.
      */

      horseMain.style.opacity =
        isMobile()
          ? "1"
          : random(
              0.95,
              1
            );


      if (
        isMobile()
      ) {

        horseOffset.style.opacity =
          "0";

      }

      else {

        horseOffset.style.transitionDuration =
          `${transition}s`;


        horseOffset.style.mixBlendMode =
          "multiply";


        horseOffset.style.filter =
          `
            grayscale(1)
            sepia(1)
            saturate(
              ${
                color.saturation *
                1.05
              }
            )
            hue-rotate(
              ${
                color.hue +
                random(-4, 4)
              }deg
            )
            contrast(
              ${color.contrast}
            )
            brightness(
              ${color.brightness}
            )
          `;


        horseOffset.style.transform =
          `
            translate(
              ${random(-1.2, 1.2)}px,
              ${random(-1.2, 1.2)}px
            )
          `;


        horseOffset.style.opacity =
          lerp(
            0.02,
            0.06,
            intensity
          ).toFixed(3);

      }


      horseKey.style.transitionDuration =
        `${transition}s`;


      horseKey.style.opacity =
        isMobile()
          ? lerp(
              0.08,
              0.14,
              intensity
            ).toFixed(3)
          : lerp(
              0.10,
              0.18,
              intensity
            ).toFixed(3);


      const interval =
        lerp(
          12,
          isMobile()
            ? 5.2
            : 4,
          intensity
        );


      nextHorseChange =
        time +
        interval;

    }


    function changeHorse(
      intensity,
      time
    ) {

      applyHorseColor(
        nextHorseColor(
          time
        ),
        intensity,
        time
      );

    }


    function prepareInitialHorse() {

      const color =
        differentHorseColor(
          OPENING_COLORS
        );


      horseMain.style.transitionDuration =
        "3.5s";


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(
            ${
              color.saturation *
              1.12
            }
          )
          hue-rotate(
            ${color.hue}deg
          )
          contrast(
            ${
              color.contrast *
              1.04
            }
          )
          brightness(
            ${
              color.brightness *
              1.03
            }
          )
        `;


      horseMain.style.opacity =
        "0";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";


      /*
        Change once while the horse is still
        completely clean.

        So the opening already demonstrates the
        pigment-changing idea.
      */

      nextHorseChange =
        24;

    }


    function normalHorse() {

      horseMain.style.transitionDuration =
        "500ms";


      horseMain.style.mixBlendMode =
        "normal";


      horseMain.style.filter =
        "none";


      horseMain.style.opacity =
        "1";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";

    }


    /* =====================================================
       TIMELINE
       ===================================================== */

    const HORSE_START =
      12;


    const HORSE_FULL =
      20;


    const COLLAGE_START =
      30;


    const NORMAL_TIME =
      243;


    function horseRevealAt(
      time
    ) {

      if (
        time < HORSE_START
      ) {

        return 0;

      }


      return smoothStep(
        (
          time -
          HORSE_START
        )
        /
        (
          HORSE_FULL -
          HORSE_START
        )
      );

    }


    function intensityAt(
      time
    ) {

      if (
        time < COLLAGE_START ||
        time >= NORMAL_TIME
      ) {

        return 0;

      }


      if (
        time < 90
      ) {

        return lerp(
          0.06,
          0.25,
          (
            time -
            COLLAGE_START
          )
          /
          60
        );

      }


      if (
        time < 175
      ) {

        return lerp(
          0.25,
          0.52,
          (
            time -
            90
          )
          /
          85
        );

      }


      if (
        time < 220
      ) {

        return lerp(
          0.52,
          0.79,
          (
            time -
            175
          )
          /
          45
        );

      }


      return lerp(
        0.79,
        1,
        (
          time -
          220
        )
        /
        23
      );

    }


    /* =====================================================
       STATE
       ===================================================== */

    let overlayOpen =
      false;


    let collageStarted =
      false;


    let horseStarted =
      false;


    let normalState =
      false;


    let raf =
      null;


    function clearSlots() {

      slots.forEach(slot => {

        slot.nextChange =
          Infinity;


        slot.frames.forEach(
          frame => {

            frame.style.transitionDuration =
              "0s";


            frame.style.opacity =
              "0";

          }
        );

      });

    }


    function startCollage(
      time,
      intensity
    ) {

      if (
        collageStarted
      ) {

        return;

      }


      collageStarted =
        true;


      slots.forEach(slot => {

        initializeSlot(
          slot,
          intensity,
          time
        );

      });

    }


    function enterNormalState() {

      if (
        normalState
      ) {

        return;

      }


      normalState =
        true;


      clearSlots();


      normalHorse();


      stage.classList.add(
        "is-normal"
      );

    }


    /* =====================================================
       LOOP
       ===================================================== */

    function visualLoop() {

      if (
        !overlayOpen
      ) {

        return;

      }


      const time =
        audio.currentTime || 0;


      const reveal =
        horseRevealAt(
          time
        );


      stage.style.setProperty(
        "--visual-reveal",
        reveal.toFixed(4)
      );


      /*
        0–12:
        message only.
      */

      if (
        time < HORSE_START
      ) {

        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      /*
        Introduce rich pigment horse.
      */

      if (
        !horseStarted
      ) {

        horseStarted =
          true;


        prepareInitialHorse();

      }


      /*
        12–30:
        clean horse only.

        It can still change pigment once.
      */

      if (
        time < COLLAGE_START
      ) {

        horseMain.style.opacity =
          reveal.toFixed(3);


        if (
          time >= nextHorseChange
        ) {

          changeHorse(
            0.08,
            time
          );

        }


        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      /*
        4:03:
        back to original GIF.
      */

      if (
        time >= NORMAL_TIME
      ) {

        enterNormalState();


        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      const intensity =
        intensityAt(
          time
        );


      if (
        !collageStarted
      ) {

        startCollage(
          time,
          intensity
        );


        /*
          Do not immediately recolor at 30 sec.
          Preserve whatever rich pigment the clean
          section has reached.
        */

        nextHorseChange =
          time + 8;

      }


      slots.forEach(slot => {

        if (
          isMobile() &&
          !slot.mobileEnabled
        ) {

          return;

        }


        if (
          time >=
          slot.nextChange
        ) {

          morphSlot(
            slot,
            intensity,
            time
          );

        }

      });


      if (
        time >=
        nextHorseChange
      ) {

        changeHorse(
          intensity,
          time
        );

      }


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       OPEN
       ===================================================== */

    async function openWip() {

      if (
        overlayOpen
      ) {

        return;

      }


      overlayOpen =
        true;


      collageStarted =
        false;


      horseStarted =
        false;


      normalState =
        false;


      recentTextures =
        [];


      lastHorseColorName =
        "";


      nextHorseChange =
        Infinity;


      clearSlots();


      normalHorse();


      stage.classList.remove(
        "is-normal"
      );


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      prepareTextures();


      pageShell.classList.add(
        "is-hidden"
      );


      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.pause();


      audio.currentTime =
        0;


      audio.volume =
        0.72;


      try {

        await audio.play();

      }

      catch (error) {

        console.log(
          "Audio could not start:",
          error
        );

      }


      cancelAnimationFrame(
        raf
      );


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       CLOSE
       ===================================================== */

    function closeWip() {

      overlayOpen =
        false;


      cancelAnimationFrame(
        raf
      );


      clearSlots();


      audio.pause();


      audio.currentTime =
        0;


      normalHorse();


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      window.setTimeout(() => {

        pageShell.classList.remove(
          "is-hidden"
        );

      }, 160);

    }


    /* =====================================================
       LINKS
       ===================================================== */

    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );


        if (!link) {
          return;
        }


        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape" &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>

</body>
