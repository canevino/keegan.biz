  (() => {

    /* =====================================================
       HELPERS
       ===================================================== */

    const clamp = (value, min, max) =>
      Math.min(
        Math.max(value, min),
        max
      );


    const lerp = (a, b, t) =>
      a + ((b - a) * t);


    const random = (min, max) =>
      min + Math.random() * (max - min);


    const pick = array =>
      array[
        Math.floor(
          Math.random() *
          array.length
        )
      ];


    function shuffle(array) {

      const result =
        [...array];


      for (
        let i = result.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }


      return result;

    }


    function differentIndex(
      length,
      current
    ) {

      let next;


      do {

        next =
          Math.floor(
            Math.random() *
            length
          );

      }
      while (
        length > 1 &&
        next === current
      );


      return next;

    }


    function smoothStep(value) {

      const t =
        clamp(
          value,
          0,
          1
        );


      return (
        t *
        t *
        (
          3 -
          (2 * t)
        )
      );

    }

    const welcomeColors = [

    let greetingIndex =

    let welcomeColorIndex =

    let greetingBusy =

    function fitWelcome() {

      welcomeWord.style.fontSize =
        "";


      const available =
        welcomeWord
          .parentElement
          .clientWidth;


      let size =
        parseFloat(
          getComputedStyle(
            welcomeWord
          ).fontSize
        );


      while (
        welcomeWord.scrollWidth >
        available &&
        size > 27
      ) {

        size -= 2;


        welcomeWord.style.fontSize =
          `${size}px`;

      }

    }


    function changeGreeting() {

      if (greetingBusy) {
        return;
      }


      greetingBusy =
        true;


      const nextGreeting =
        differentIndex(
          greetings.length,
          greetingIndex
        );


      const nextColor =
        differentIndex(
          welcomeColors.length,
          welcomeColorIndex
        );


      welcomeWord.classList.add(
        "is-fading"
      );


      window.setTimeout(() => {

        greetingIndex =
          nextGreeting;


        welcomeColorIndex =
          nextColor;


        welcomeWord.textContent =
          greetings[
            greetingIndex
          ];


        welcomeWord.style.color =
          welcomeColors[
            welcomeColorIndex
          ];


        fitWelcome();


        welcomeWord.classList.remove(
          "is-fading"
        );


        window.setTimeout(() => {

          greetingBusy =
            false;

        }, 300);

      }, 250);

    }


    welcomeWord.style.color =
      welcomeColors[
        welcomeColorIndex

    fitWelcome();

    /*
      Prioritize physical dirt.

      These are what give us most of the
      background character.
    */

    const DIRTY_TEXTURES =
      ALL_TEXTURES.filter(
        src =>
          /Grunge|Concrete|Soil|Stone|Wood|Metal|Film|Brick|Paper|InkPaint/i
            .test(src)
      );


    const SOFTER_TEXTURES =
      ALL_TEXTURES.filter(
        src =>
          !DIRTY_TEXTURES.includes(
            src
          )
      );


    /* =====================================================
       TEXTURE PRELOAD
       ===================================================== */

    let sessionTextures =
      [];


    let readyTextures =
      [];


    let recentTextures =
      [];


    function prepareTextures() {

      const dirtyCount =
        isMobile()
          ? 13
          : 18;


      const softCount =
        isMobile()
          ? 3
          : 6;


      sessionTextures = [

        ...shuffle(
          DIRTY_TEXTURES
        ).slice(
          0,
          dirtyCount
        ),

        ...shuffle(
          SOFTER_TEXTURES
        ).slice(
          0,
          softCount
        )

      ];


      readyTextures =
        [];


      sessionTextures.forEach(src => {

        const image =
          new Image();


        image.decoding =
          "async";


        image.onload =
          () => {

            if (
              !readyTextures.includes(
                src
              )
            ) {

              readyTextures.push(
                src
              );

            }

          };


        image.src =
          src;

      });

    }


    function chooseTexture() {

      const readyDirty =
        readyTextures.filter(
          src =>
            DIRTY_TEXTURES.includes(
              src
            )
        );


      const pool =
        (
          Math.random() < 0.82 &&
          readyDirty.length > 3
        )
          ? readyDirty
          : (
              readyTextures.length > 5
                ? readyTextures
                : sessionTextures
            );


      let result;


      let attempts =
        0;


      do {

        result =
          pick(pool);


        attempts++;

      }
      while (
        recentTextures.includes(
          result
        ) &&
        attempts < 14
      );


      recentTextures.push(
        result
      );


      if (
        recentTextures.length > 7
      ) {

        recentTextures.shift();

      }


      return result;

    }

    function nextHorseColor() {

      horseColorIndex =
        differentIndex(

      return HORSE_COLORS[

    /* =====================================================
       TEXTURE SLOTS

       Blend modes are FIXED by role.

       They do not jump around whenever an image
       changes.
       ===================================================== */

    function makeSlot(
      id,
      options
    ) {

      const element =
        document.getElementById(
          id
        );


      return {

        element,

        frames:
          Array.from(
            element.querySelectorAll(
              ".morph-frame"
            )
          ),

        active:
          0,

        role:
          options.role,

        desktopBlend:
          options.desktopBlend,

        mobileBlend:
          options.mobileBlend,

        internalBlend:
          options.internalBlend,

        slowDuration:
          options.slowDuration,

        fastDuration:
          options.fastDuration,

        phase:
          options.phase,

        mobileEnabled:
          options.mobileEnabled !== false,

        nextChange:
          Infinity

      };

    }


    const slots = [

      makeSlot(
        "under-slot-1",
        {
          role:
            "foundation",

          desktopBlend:
            "multiply",

          mobileBlend:
            "multiply",

          internalBlend:
            "multiply",

          slowDuration:
            11.5,

          fastDuration:
            2.5,

          phase:

    /* =====================================================
       TEXTURE DESIGN
       ===================================================== */

    function neutralTint() {

      const dark =
        pick([
          "#070706",
          "#11100e",
          "#1c1915",
          "#29251f"
        ]);


      const mid =
        pick([
          "#504b43",
          "#625c52",
          "#756d61",
          "#82796c"
        ]);


      const light =
        pick([
          "#ccc4b7",
          "#d9d1c4",
          "#e5ddcf",
          "#eee7da"
        ]);


      return `
        linear-gradient(
          ${random(0, 360)}deg,
          ${dark} 0%,
          ${mid} 52%,
          ${light} 100%
        )
      `;

    }


    function opacityForSlot(
      slot,
      intensity
    ) {

      if (
        slot.role ===
        "foundation"
      ) {

        if (
          isMobile()
        ) {

          return random(
            lerp(
              0.48,
              0.56,
              intensity
            ),
            lerp(
              0.62,
              0.72,
              intensity
            )
          );

        }


        return random(
          lerp(
            0.60,
            0.68,
            intensity
          ),
          lerp(
            0.78,
            0.88,
            intensity
          )
        );

      }


      if (
        slot.role ===
        "secondary"
      ) {

        if (
          isMobile()
        ) {

          return random(
            0.24,
            lerp(
              0.35,
              0.48,
              intensity
            )
          );

        }


        return random(
          0.34,
          lerp(
            0.50,
            0.64,
            intensity
          )
        );

      }


      /*
        Desktop overprint.
      */

      return random(
        0.08,
        lerp(
          0.16,
          0.27,
          intensity
        )
      );

    }


    function configureFrame(
      frame,
      slot,
      intensity
    ) {

      const texture =
        chooseTexture();


      frame.style.backgroundImage =
        `
          ${neutralTint()},
          url("${texture}")
        `;


      frame.style.backgroundSize =
        "cover, cover";


      frame.style.backgroundRepeat =
        "no-repeat, no-repeat";


      frame.style.backgroundPosition =
        `
          center,
          ${random(12, 88)}%
          ${random(12, 88)}%
        `;


      frame.style.backgroundBlendMode =
        `
          ${slot.internalBlend},
          normal
        `;


      frame.style.mixBlendMode =
        isMobile()
          ? slot.mobileBlend
          : slot.desktopBlend;


      /*
        Enough crop variation to feel handmade,
        but no violent geometric jumps.
      */

      const rotation =
        isMobile()
          ? random(-0.8, 0.8)
          : random(-2.0, 2.0);


      const translate =
        isMobile()
          ? 1
          : 2.2;


      const scale =
        isMobile()
          ? random(1.05, 1.14)
          : random(1.07, 1.24);


      frame.style.transform =
        `
          translate(
            ${random(-translate, translate)}%,
            ${random(-translate, translate)}%
          )
          rotate(
            ${rotation}deg
          )
          scale(
            ${scale}
          )
        `;


      /*
        Dense / dirty rather than pale.

        Still completely neutral.
      */

      if (
        isMobile()
      ) {

        frame.style.filter =
          `
            grayscale(1)
            saturate(0)
            contrast(
              ${random(1.16, 1.42)}
            )
            brightness(
              ${random(0.74, 0.94)}
            )
          `;

      }

      else {

        frame.style.filter =
          `
            grayscale(1)
            saturate(0)
            contrast(
              ${random(1.28, 1.72)}
            )
            brightness(
              ${random(0.64, 0.92)}
            )
            sepia(
              ${random(0.02, 0.07)}
            )
          `;

      }


      frame.dataset.targetOpacity =
        opacityForSlot(
          slot,
          intensity
        ).toFixed(3);

    }


    /* =====================================================
       INITIAL TEXTURE
       ===================================================== */

    function initializeSlot(
      slot,
      intensity,
      time
    ) {

      if (
        isMobile() &&
        !slot.mobileEnabled
      ) {

        slot.element.style.display =
          "none";


        slot.nextChange =
          Infinity;


        return;

      }


      slot.element.style.display =
        "";


      slot.frames.forEach(
        frame => {

          frame.style.transitionDuration =
            "0s";


          frame.style.opacity =
            "0";

        }
      );


      slot.active =
        0;


      const first =
        slot.frames[0];


      configureFrame(
        first,
        slot,
        intensity
      );


      /*
        The rough background itself gradually
        appears rather than suddenly arriving.
      */

      const initialFade =
        isMobile()
          ? 6
          : 7;


      first.style.transitionDuration =
        `${initialFade}s`;


      first.offsetHeight;


      window.setTimeout(
        () => {

          if (
            !overlayOpen ||
            normalState
          ) {

            return;

          }


          first.style.opacity =
            first.dataset.targetOpacity;

        },
        slot.phase * 1000
      );


      /*
        First true crossfade starts after the
        initial material has established itself.
      */

      slot.nextChange =
        time +
        slot.phase +
        initialFade;

    }


    /* =====================================================
       SMOOTH CROSSFADE

       Two plates only.

       A fades to B.
       Once complete, B immediately starts
       fading toward a newly prepared A.

       There is no blend-mode change.
       There is no blank frame.
       There is no hard reset.
       ===================================================== */

    function morphSlot(
      slot,
      intensity,
      time
    ) {

      const outgoing =
        slot.frames[
          slot.active
        ];


      const incomingIndex =
        slot.active === 0
          ? 1
          : 0;


      const incoming =
        slot.frames[
          incomingIndex
        ];


      let duration =
        lerp(
          slot.slowDuration,
          slot.fastDuration,
          intensity
        );


      /*
        Keep mobile from entering frantic
        sub-second territory.
      */

      if (
        isMobile()
      ) {

        duration =
          Math.max(
            duration,
            3.2
          );

      }


      /*
        Prepare invisible incoming plate.
      */

      incoming.style.transitionDuration =
        "0s";


      incoming.style.opacity =
        "0";


      configureFrame(
        incoming,
        slot,
        intensity
      );


      incoming.offsetHeight;


      /*
        Now both plates dissolve together.
      */

      incoming.style.transitionDuration =
        `${duration}s`;


      outgoing.style.transitionDuration =
        `${duration}s`;


      requestAnimationFrame(() => {

        incoming.style.opacity =
          incoming.dataset.targetOpacity;


        outgoing.style.opacity =
          "0";

      });


      slot.active =
        incomingIndex;


      /*
        No hold.

        As soon as this dissolve is effectively
        complete, the next one begins.
      */

      slot.nextChange =
        time +
        (
          duration * 0.96
        );

    }


    /* =====================================================
       HORSE COLOR

       Natural pigment, not RGB neon.
       ===================================================== */

    let nextHorseChange =
      Infinity;


    function applyHorseColor(
      color,
      intensity,
      time
    ) {

      const transition =
        lerp(
          6.5,
          isMobile()
            ? 3.8
            : 2.8,
          intensity
        );


      horseMain.style.transitionDuration =
        `${transition}s`;


      /*
        Multiply keeps the drawing feeling like
        pigment actually sitting in the paper.
      */

      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(
            ${
              color.saturation *
              random(
                0.92,
                1.06
              )
            }
          )
          hue-rotate(
            ${
              color.hue +
              random(-3, 3)
            }deg
          )
          contrast(
            ${
              color.contrast *
              random(
                0.97,
                1.03
              )
            }
          )
          brightness(
            ${
              color.brightness *
              random(
                0.98,
                1.02
              )
            }
          )
        `;


      horseMain.style.opacity =
        isMobile()
          ? 0.98
          : random(
              0.90,
              0.98
            );


      /*
        Very restrained registration ghost.

        Same basic pigment family.
        Desktop only.
      */

      if (
        isMobile()
      ) {

        horseOffset.style.opacity =
          "0";

      }

      else {

        horseOffset.style.transitionDuration =
          `${transition}s`;


        horseOffset.style.mixBlendMode =
          "multiply";


        horseOffset.style.filter =
          `
            grayscale(1)
            sepia(1)
            saturate(
              ${
                color.saturation *
                0.92
              }
            )
            hue-rotate(
              ${
                color.hue +
                random(-4, 4)
              }deg
            )
            contrast(
              ${color.contrast}
            )
            brightness(
              ${color.brightness}
            )
          `;


        horseOffset.style.transform =
          `
            translate(
              ${random(-1.4, 1.4)}px,
              ${random(-1.4, 1.4)}px
            )
          `;


        horseOffset.style.opacity =
          lerp(
            0.025,
            0.075,
            intensity
          ).toFixed(3);

      }


      /*
        Neutral ink key for readability.
      */

      horseKey.style.transitionDuration =
        `${transition}s`;


      horseKey.style.opacity =
        isMobile()
          ? lerp(
              0.11,
              0.17,
              intensity
            ).toFixed(3)
          : lerp(
              0.14,
              0.23,
              intensity
            ).toFixed(3);


      /*
        Color changes accelerate, but never
        become flickery.
      */

      const interval =
        lerp(
          13,
          isMobile()
            ? 5.5
            : 4.2,
          intensity
        );


      nextHorseChange =
        time +
        interval;

    }


    function changeHorse(
      intensity,
      time
    ) {

      applyHorseColor(
        nextHorseColor(),
        intensity,
        time
      );

    }


    function prepareInitialHorse() {

      const color =
        nextHorseColor();


      horseMain.style.transitionDuration =
        "4s";


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(
            ${color.saturation}
          )
          hue-rotate(
            ${color.hue}deg
          )
          contrast(
            ${color.contrast}
          )
          brightness(
            ${color.brightness}
          )
        `;


      horseMain.style.opacity =
        "0";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";

    }


    function normalHorse() {

      horseMain.style.transitionDuration =
        "500ms";


      horseMain.style.mixBlendMode =
        "normal";


      horseMain.style.filter =
        "none";


      horseMain.style.opacity =
        "1";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";

    }


    /* =====================================================
       TIMELINE
       ===================================================== */

    const HORSE_START =
      12;


    const HORSE_FULL =
      20;


    const COLLAGE_START =
      30;


    const NORMAL_TIME =
      243;


    function horseRevealAt(
      time
    ) {

      if (
        time < HORSE_START
      ) {

        return 0;

      }


      return smoothStep(
        (
          time -
          HORSE_START
        )
        /
        (
          HORSE_FULL -
          HORSE_START
        )
      );

    }


    function intensityAt(
      time
    ) {

      if (
        time < COLLAGE_START ||
        time >= NORMAL_TIME
      ) {

        return 0;

      }


      if (
        time < 90
      ) {

        return lerp(
          0.06,
          0.25,
          (
            time -
            COLLAGE_START
          )
          /
          60
        );

      }


      if (
        time < 175
      ) {

        return lerp(
          0.25,
          0.52,
          (
            time -
            90
          )
          /
          85
        );

      }


      if (
        time < 220
      ) {

        return lerp(
          0.52,
          0.79,
          (
            time -
            175
          )
          /
          45
        );

      }


      return lerp(
        0.79,
        1,
        (
          time -
          220
        )
        /
        23
      );

    }


    /* =====================================================
       STATE
       ===================================================== */

    let overlayOpen =
      false;


    let collageStarted =
      false;


    let horseStarted =
      false;


    let normalState =
      false;


    let raf =
      null;


    function clearSlots() {

      slots.forEach(slot => {

        slot.nextChange =
          Infinity;


        slot.frames.forEach(
          frame => {

            frame.style.transitionDuration =
              "0s";


            frame.style.opacity =
              "0";

          }
        );

      });

    }


    function startCollage(
      time,
      intensity
    ) {

      if (
        collageStarted
      ) {

        return;

      }


      collageStarted =
        true;


      slots.forEach(slot => {

        initializeSlot(
          slot,
          intensity,
          time
        );

      });


      /*
        Let rough material arrive before the
        first horse pigment change.
      */

      nextHorseChange =
        time + 7;

    }


    function enterNormalState() {

      if (
        normalState
      ) {

        return;

      }


      normalState =
        true;


      clearSlots();


      normalHorse();


      stage.classList.add(
        "is-normal"
      );

    }


    /* =====================================================
       LOOP
       ===================================================== */

    function visualLoop() {

      if (
        !overlayOpen
      ) {

        return;

      }


      const time =
        audio.currentTime || 0;


      const reveal =
        horseRevealAt(
          time
        );


      stage.style.setProperty(
        "--visual-reveal",
        reveal.toFixed(4)
      );


      /*
        message only
      */

      if (
        time < HORSE_START
      ) {

        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      /*
        establish initial natural-color horse
      */

      if (
        !horseStarted
      ) {

        horseStarted =
          true;


        prepareInitialHorse();

      }


      /*
        clean horse section
      */

      if (
        time < COLLAGE_START
      ) {

        horseMain.style.opacity =
          reveal.toFixed(3);


        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      /*
        back to completely original GIF
      */

      if (
        time >= NORMAL_TIME
      ) {

        enterNormalState();


        raf =
          requestAnimationFrame(
            visualLoop
          );


        return;

      }


      const intensity =
        intensityAt(
          time
        );


      if (
        !collageStarted
      ) {

        startCollage(
          time,
          intensity
        );

      }


      /*
        Independent continuous texture channels.
      */

      slots.forEach(slot => {

        if (
          isMobile() &&
          !slot.mobileEnabled
        ) {

          return;

        }


        if (
          time >= slot.nextChange
        ) {

          morphSlot(
            slot,
            intensity,
            time
          );

        }

      });


      /*
        Slow natural pigment evolution.
      */

      if (
        time >= nextHorseChange
      ) {

        changeHorse(
          intensity,
          time
        );

      }


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       OPEN
       ===================================================== */

    async function openWip() {

      if (
        overlayOpen
      ) {

        return;

      }


      overlayOpen =
        true;


      collageStarted =
        false;


      horseStarted =
        false;


      normalState =
        false;


      recentTextures =
        [];


      horseColorIndex =
        Math.floor(
          Math.random() *
          HORSE_COLORS.length
        );


      nextHorseChange =
        Infinity;


      clearSlots();


      normalHorse();


      stage.classList.remove(
        "is-normal"
      );


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      /*
        Texture decoding starts immediately,
        thirty seconds before collage is needed.
      */

      prepareTextures();


      /*
        Remove website immediately.
      */

      pageShell.classList.add(
        "is-hidden"
      );


      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.pause();


      audio.currentTime =
        0;


      audio.volume =
        0.72;


      try {

        await audio.play();

      }

      catch (error) {

        console.log(
          "Audio could not start:",
          error
        );

      }


      cancelAnimationFrame(
        raf
      );


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    /* =====================================================
       CLOSE
       ===================================================== */

    function closeWip() {

      overlayOpen =
        false;


      cancelAnimationFrame(
        raf
      );


      clearSlots();


      audio.pause();


      audio.currentTime =
        0;


      normalHorse();


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      window.setTimeout(() => {

        pageShell.classList.remove(
          "is-hidden"
        );

      }, 160);

    }


    /* =====================================================
       LINKS
       ===================================================== */

    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );


        if (!link) {
          return;
        }


        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape" &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>

</body>
