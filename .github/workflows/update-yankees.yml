name: Update Yankees sports data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch Yankees data
        run: node assets/sports/fetch-yankees.mjs

      - name: Commit sports data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sports/sports-data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Yankees sports data"
          git push
