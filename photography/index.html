<script>
(() => {
  const title = document.getElementById('photo-title');
  const colors = ['#c1272d','#006a44','#fdb913'];
  let current = 0;
  title.style.color = colors[current];
  setInterval(() => {
    let next;
    do next = Math.floor(Math.random()*colors.length); while (next === current);
    title.classList.add('is-fading');
    setTimeout(() => { current = next; title.style.color = colors[current]; title.classList.remove('is-fading'); }, 200);
  }, 2300);
})();
</script>

<script>
(() => {
  const WIDTH_MOBILE = window.matchMedia('(max-width: 700px)');
  const COARSE = window.matchMedia('(pointer: coarse)');
  const NO_HOVER = window.matchMedia('(hover: none)');
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)');
  const isMobile = () => WIDTH_MOBILE.matches || COARSE.matches;
  const touchWords = () => COARSE.matches || NO_HOVER.matches || 'ontouchstart' in window;
  const WORDS = {
    here: () => touchWords() ? 'tap here' : 'click here',
    again: () => touchWords() ? 'tap again!' : 'click again!',
    keep: () => touchWords() ? 'keep tapping!' : 'keep clicking!',
    off: () => touchWords() ? 'tap to turn off' : 'click to turn off',
    on: () => touchWords() ? 'tap to turn on' : 'click to turn on'
  };

  const artwork = document.getElementById('fuji-interactive');
  const base = document.getElementById('fuji-base');
  const tint = document.getElementById('fuji-photo-tint');
  const prompt = document.getElementById('fuji-click-prompt');
  const controls = document.getElementById('fuji-controls');
  const autoButton = document.getElementById('fuji-auto-song');
  const soundButton = document.getElementById('fuji-sound-toggle');
  const splashLayer = document.getElementById('fuji-splash-layer');
  const droneEl = document.getElementById('fuji-drone');
  const buildingEls = Array.from(document.querySelectorAll('.fuji-building'));
  const allLines = Array.from(document.querySelectorAll('.fuji-line-layer')).map(layer => ({
    layer,
    source: layer.querySelector('.fuji-line-source'),
    texture: layer.querySelector('.fuji-line-texture'),
    lineNumber: Number(layer.dataset.line),
    token: 0
  }));
  let activeBuildings = [];
  let validLines = [];

  const clamp = (v,min,max) => Math.min(Math.max(v,min),max);
  const rand = (min,max) => min + Math.random()*(max-min);
  const randInt = (min,max) => Math.floor(rand(min,max+1));
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  const unique = arr => [...new Set(arr)];
  function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  function weighted(items){
    const list = items.filter(x => x && x.weight > 0);
    if(!list.length) return null;
    let r = Math.random()*list.reduce((s,x)=>s+x.weight,0);
    for(const x of list){ r -= x.weight; if(r <= 0) return x; }
    return list[list.length-1];
  }
  const weightedValue = items => weighted(items)?.value ?? null;
  function softmaxPick(scored, temperature=1.15){
    if(!scored.length) return null;
    const top=[...scored].sort((a,b)=>b.score-a.score).slice(0,8);
    const max=top[0].score;
    return weighted(top.map(x=>({...x,weight:Math.exp((x.score-max)/temperature)})));
  }
  function waitImage(img){
    if(img.complete && img.naturalWidth>0) return Promise.resolve(img);
    return new Promise((resolve,reject)=>{ img.addEventListener('load',()=>resolve(img),{once:true}); img.addEventListener('error',reject,{once:true}); });
  }
  async function hydrate(img){ if(!img.getAttribute('src')) img.src=img.dataset.src; await waitImage(img); return img; }

  function hexToRgb(hex){ const h=hex.replace('#',''); return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}; }
  function rgbToHex(c){ const h=v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0'); return `#${h(c.r)}${h(c.g)}${h(c.b)}`; }
  function mixHex(a,b,t){ const x=hexToRgb(a), y=hexToRgb(b); return rgbToHex({r:x.r+(y.r-x.r)*t,g:x.g+(y.g-x.g)*t,b:x.b+(y.b-x.b)*t}); }

  async function revealBase(){ try{ await waitImage(base); }catch{} requestAnimationFrame(()=>artwork.classList.add('is-ready')); }
  function hasAlpha(img){
    try{
      const c=document.createElement('canvas'); c.width=96; c.height=Math.max(1,Math.round(96*img.naturalHeight/img.naturalWidth));
      const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height).data; let n=0; for(let i=3;i<d.length;i+=4) if(d[i]<235)n++;
      return n/(c.width*c.height)>.025;
    }catch{return false;}
  }
  async function prepareOverlayAssets(){
    activeBuildings = buildingEls.slice(0,isMobile()?2:4);
    buildingEls.slice(activeBuildings.length).forEach(el=>el.style.display='none');
    const selected = isMobile()?shuffle(allLines).slice(0,6):allLines;
    allLines.forEach(item=>{ if(!selected.includes(item)) item.layer.style.display='none'; });
    await Promise.allSettled(activeBuildings.map(hydrate));
    await Promise.allSettled(selected.map(item=>hydrate(item.source)));
    const w=base.naturalWidth,h=base.naturalHeight;
    validLines=selected.filter(item=>{
      if(item.source.naturalWidth!==w || item.source.naturalHeight!==h){ item.layer.style.display='none'; return false; }
      if(hasAlpha(item.source)){
        item.layer.classList.add('has-alpha');
        item.texture.style.webkitMaskImage=`url("${item.source.src}")`;
        item.texture.style.maskImage=`url("${item.source.src}")`;
      }else item.layer.classList.add('has-white-canvas');
      return true;
    });
    resetVisuals(true);
  }

  const tutorial={step:0,timers:[]};
  const clearTutorialTimers=()=>{ tutorial.timers.forEach(clearTimeout); tutorial.timers=[]; };
  function hidePrompt(){ prompt.classList.remove('is-visible'); prompt.setAttribute('aria-hidden','true'); }
  function showPrompt(text){ prompt.textContent=text; prompt.classList.add('is-visible'); prompt.setAttribute('aria-hidden','false'); }
  function showControls(){ controls.classList.add('is-visible'); controls.setAttribute('aria-hidden','false'); }
  function later(fn,ms){ const id=setTimeout(fn,ms); tutorial.timers.push(id); return id; }
  function advanceTutorial(){
    hidePrompt(); clearTutorialTimers();
    if(tutorial.step===0){
      tutorial.step=1;
      later(()=>showPrompt('turn up volume'),900);
      later(hidePrompt,2800);
      later(()=>showPrompt(WORDS.again()),5200);
      return;
    }
    if(tutorial.step===1){ tutorial.step=2; later(()=>showPrompt(WORDS.keep()),4100); return; }
    if(tutorial.step===2){ tutorial.step=3; later(showControls,650); }
  }

  const DESKTOP_TEXTURES=[
    '../assets/home/Texturelabs_Grunge_173S.jpg','../assets/home/Texturelabs_Grunge_279L.jpg','../assets/home/Texturelabs_Grunge_334S.jpg','../assets/home/Texturelabs_Grunge_341S.jpg',
    '../assets/home/Texturelabs_InkPaint_126S.jpg','../assets/home/Texturelabs_InkPaint_320S.jpg','../assets/home/Texturelabs_InkPaint_332S.jpg',
    '../assets/home/Texturelabs_Concrete_150S.jpg','../assets/home/Texturelabs_Concrete_155S.jpg','../assets/home/Texturelabs_Concrete_179S.jpg',
    '../assets/home/Texturelabs_Film_181S.jpg','../assets/home/Texturelabs_Film_183S.jpg','../assets/home/Texturelabs_Metal_129S.jpg','../assets/home/Texturelabs_Paper_280S.jpg','../assets/home/Texturelabs_Paper_286S.jpg','../assets/home/Texturelabs_Wood_135S.jpg'
  ];
  const MOBILE_TEXTURES=['../assets/home/Texturelabs_Grunge_341S.jpg','../assets/home/Texturelabs_Film_183S.jpg','../assets/home/Texturelabs_Paper_280S.jpg','../assets/home/Texturelabs_Concrete_155S.jpg'];
  const textures=()=>isMobile()?MOBILE_TEXTURES:DESKTOP_TEXTURES;

  const PITCH_VISUALS={
    D:{color:'#1f5b3d',second:'#6f8d67',hue:68,tension:.05},
    E:{color:'#91a66f',second:'#c0c68f',hue:76,tension:.17},
    F:{color:'#7c2440',second:'#a5485e',hue:-18,tension:.34},
    G:{color:'#536f31',second:'#82964f',hue:85,tension:.18},
    A:{color:'#8a6731',second:'#b88c4e',hue:11,tension:.10},
    B:{color:'#49677e',second:'#7890a0',hue:167,tension:.36},
    C:{color:'#974b34',second:'#bd6d50',hue:-2,tension:.27}
  };
  const INSTRUMENT_VISUALS={
    concertina:{tint:'#7b3346',hue:-11}, guitar:{tint:'#866b3d',hue:3}, mandolin:{tint:'#4c743d',hue:12}, harmonic:{tint:'#7b8783',hue:0}, cello:{tint:'#465b4a',hue:0}
  };
  const PITCH_LINES={D:[1,4,7,10,13],E:[2,5,8,11],F:[3,6,9,12],G:[1,5,9,13],A:[2,6,10],B:[3,7,11],C:[4,8,12]};
  const POST=['#fuji-posterize-3','#fuji-posterize-4','#fuji-posterize-6'];
  const THRESH=['#fuji-threshold-low','#fuji-threshold-mid','#fuji-threshold-high'];

  function visualForEvent(event){
    const pv=event.pitches.map(p=>PITCH_VISUALS[p]);
    const instruments=unique(event.instruments);
    let primary=pv[0]?.color||'#53643d', secondary=pv[Math.min(1,pv.length-1)]?.second||'#755c3d';
    instruments.forEach((name,i)=>{ const iv=INSTRUMENT_VISUALS[name]||INSTRUMENT_VISUALS.guitar; primary=mixHex(primary,iv.tint,i? .12:.22); secondary=mixHex(secondary,iv.tint,i?.10:.18); });
    const hue=(pv.reduce((s,x)=>s+x.hue,0)/Math.max(1,pv.length))+(instruments.reduce((s,n)=>s+(INSTRUMENT_VISUALS[n]?.hue||0),0)/Math.max(1,instruments.length));
    const intensity=event.type==='chord'?.93:event.type==='ensemble-dyad'?.80:event.type==='dyad'?.63:.38;
    return {primary,secondary,tertiary:mixHex(primary,secondary,.5),hue,intensity,texture:pick(textures())};
  }
  function processFilter(v,intensity){
    const mobile=isMobile();
    const mode=mobile?weightedValue([{value:'normal',weight:49},{value:'exposed',weight:30},{value:'hard',weight:16},{value:'poster',weight:5}]):weightedValue([{value:'normal',weight:32},{value:'exposed',weight:27},{value:'poster',weight:18},{value:'threshold',weight:4+intensity*9},{value:'hard',weight:10+intensity*5}]);
    const h=v.hue+rand(-4,4);
    if(mode==='poster'&&!mobile) return `grayscale(.14) sepia(.36) url("${pick(POST)}") hue-rotate(${h}deg) saturate(${rand(.76,1.02)}) contrast(${rand(1.08,1.34)})`;
    if(mode==='threshold'&&!mobile) return `grayscale(.22) sepia(.38) url("${pick(THRESH)}") hue-rotate(${h}deg) saturate(${rand(.74,.98)})`;
    if(mode==='hard') return `grayscale(.10) sepia(.33) hue-rotate(${h}deg) saturate(${rand(.76,1.03)}) brightness(${rand(.90,1.03)}) contrast(${rand(mobile?1.16:1.26,mobile?1.39:1.58)})`;
    if(mode==='exposed') return `grayscale(.08) sepia(.28) hue-rotate(${h}deg) saturate(${rand(.74,1.02)}) brightness(${rand(1,1.10+intensity*.08)}) contrast(${rand(1.03,1.23)})`;
    if(mode==='poster') return `grayscale(.12) sepia(.34) hue-rotate(${h}deg) saturate(${rand(.72,.98)}) brightness(${rand(.95,1.05)}) contrast(${rand(1.30,1.48)})`;
    return `grayscale(.08) sepia(.28) hue-rotate(${h}deg) saturate(${rand(.70,.98)}) brightness(${rand(.86,1.02)}) contrast(${rand(1.02,1.18)})`;
  }

  function configureLine(item,v,intensity,phase){
    const attack=phase==='attack';
    const whiteCanvas=item.layer.classList.contains('has-white-canvas');
    item.source.style.mixBlendMode=whiteCanvas
      ? weightedValue([{value:'multiply',weight:62},{value:'darken',weight:30},{value:'color-burn',weight:isMobile()?0:8}])
      : weightedValue([{value:'soft-light',weight:attack?15:28},{value:'overlay',weight:attack?27:24},{value:'multiply',weight:24},{value:'screen',weight:11},{value:'hard-light',weight:isMobile()?(attack?7:3):(attack?18:9)},{value:'color-burn',weight:isMobile()?0:(attack?7:3)}]);
    item.source.style.filter=processFilter(v,intensity);
    item.source.style.opacity=attack?rand(.48,.86):rand(.34,.67);
    if(item.layer.classList.contains('has-alpha')){
      item.texture.style.backgroundImage=`linear-gradient(${rand(0,360)}deg,${v.primary},${v.secondary},${v.tertiary}),url("${v.texture}")`;
      item.texture.style.backgroundSize='100% 100%,cover';
      item.texture.style.backgroundPosition='center,center';
      item.texture.style.backgroundBlendMode='normal,multiply';
      item.texture.style.mixBlendMode=weightedValue([{value:'soft-light',weight:34},{value:'overlay',weight:28},{value:'multiply',weight:22},{value:'screen',weight:10},{value:'hard-light',weight:isMobile()?2:6}]);
      item.texture.style.filter=`grayscale(${rand(.02,.10)}) contrast(${rand(1.04,isMobile()?1.22:1.34)}) saturate(${rand(.82,1.06)})`;
      item.texture.style.opacity=attack?rand(.18,.34+intensity*.12):rand(.11,.25+intensity*.08);
    }else{
      item.texture.style.backgroundImage='none';
      item.texture.style.opacity='0';
    }
    item.layer.dataset.targetOpacity=clamp(attack?rand(.38,.66+intensity*.19):rand(.25,.48+intensity*.12),.16,.84).toFixed(3);
  }
  function configureBuilding(el,v,intensity,phase){
    const attack=phase==='attack';
    el.style.mixBlendMode=weightedValue([{value:'soft-light',weight:attack?21:30},{value:'overlay',weight:attack?28:22},{value:'screen',weight:17},{value:'lighten',weight:14},{value:'multiply',weight:12},{value:'hard-light',weight:isMobile()?3:(attack?8:4)}]);
    el.style.filter=`grayscale(${rand(.16,.34)}) sepia(${rand(.20,.40)}) hue-rotate(${v.hue+rand(-5,5)}deg) saturate(${rand(.62,.92)}) brightness(${rand(attack?.96:.90,attack?1.09:1.02)}) contrast(${rand(1.03,attack?1.18:1.12)})`;
    el.style.transform=`translate3d(${rand(-.55,.55)}px,${rand(-.55,.55)}px,0)`;
    el.dataset.targetOpacity=clamp(attack?rand(.10,.20+intensity*.11):rand(.06,.15+intensity*.07),.04,.31).toFixed(3);
  }

  let tintToken=0;
  function resetVisuals(immediate=false){
    tintToken++; tint.style.transitionDuration=immediate?'0ms':'1200ms'; tint.style.opacity='0';
    validLines.forEach(item=>{ item.token++; item.layer.style.transitionDuration=immediate?'0ms':'1100ms'; item.layer.style.opacity='0'; });

        scheduleVoice(
          entry.sample,
          entry.buffer,
          start+spread,
          bus,
          (move.type==='chord'?.86:.94)*perVoice
        )
      ){
        scheduled++;
      }
    });

    if(!scheduled){
      try{bus.disconnect();}catch{}
      return null;
    }

    const ringMs=clamp(longest*1000,3300,7600);

    setTimeout(()=>{
      try{bus.disconnect();}catch{}
    },ringMs+1200);

    return {
      ringMs,
      voiceCount:scheduled
    };
  }

  function autoplayDelay(result){
    if(!result)return 2200;
    if(result.kind==='drone')return rand(6200,7600);
    const event=result.event;

    // Dissonance is allowed as color, but autoplay moves toward its resolution quickly.
    if(planner.resolutionDue>0)return rand(planner.resolutionDue===1?460:620,planner.resolutionDue===1?820:1050);

    if(planner.gesture?.type==='run'&&event.type==='note'){
      if(planner.arc==='build'||planner.arc==='darken')return rand(430,720);
      if(planner.arc==='release')return rand(690,1080);
      return rand(520,900);
    }
    if(planner.gesture?.type==='pair'&&(event.type==='dyad'||event.type==='ensemble-dyad'))return rand(720,1250);

    if(event.type==='chord'){
      const previous=planner.history.at(-2),consecutive=previous?.type==='chord';
      if(consecutive){
        if(planner.chordStreak>=3)return rand(2700,4200);
        if(planner.arc==='build'||planner.arc==='darken')return rand(1350,2350);
        if(planner.arc==='release')return rand(2100,3500);
        return rand(1750,2900);
      }
      if(planner.arc==='release')return rand(3400,5400);
      if(planner.arc==='build'||planner.arc==='darken')return rand(2000,3400);
      return rand(2600,4400);
    }

    if(event.type==='ensemble-dyad')return rand(1200,2200);
    if(event.type==='dyad')return rand(820,1600);
    if(planner.arc==='build'||planner.arc==='darken')return rand(520,1050);
    if(planner.arc==='release')return rand(900,1750);
    return rand(680,1450);
  }

  async function musicalAction(origin,point){
    const now=performance.now(); if(now-audioState.lastClick<AUDIO.clickCooldown||audioState.pending)return null;
    audioState.lastClick=now; audioState.pending=true; let result=null;
    try{
      const ctx=ensureContext();

      if(!ctx)return null;

      if(ctx.state!=='running'){
        try{
          await ctx.resume();
        }catch(error){
          console.warn('Audio context could not resume.',error);
          return null;
        }
      }
      if(audioState.muted){audioState.muted=false;updateMaster();updateSoundButton();}
      if(!audioState.droneStarted) result=await startDrone(point);
      else{
        const move=planNextMove(), playback=await playMove(move); if(!playback)return null; commitMove(move); createMark(move,point,playback.ringMs); driveVisuals(move,playback.ringMs); result={kind:'music',event:move,ringMs:playback.ringMs};
      }
      return result;
    }finally{
      audioState.pending=false;
      if(result&&origin==='manual')advanceTutorial();
      if(result&&origin==='manual'&&audioState.auto)scheduleAuto(result);
    }
  }

  function updateAutoButton(){ autoButton.textContent=audioState.auto?'stop randomly generating':'randomly generate a song'; }
  function scheduleAuto(previous){
    clearTimeout(audioState.autoTimer); if(!audioState.auto||audioState.overlayMuted)return;
    audioState.autoTimer=setTimeout(async()=>{ if(!audioState.auto||audioState.overlayMuted)return; const result=await musicalAction('auto',randomPoint()); scheduleAuto(result); },autoplayDelay(previous));
  }
  async function startAuto(){ audioState.auto=true; audioState.muted=false; updateMaster(); updateSoundButton(); updateAutoButton(); const result=await musicalAction('auto',randomPoint()); scheduleAuto(result); }
  function stopAuto(){ audioState.auto=false; clearTimeout(audioState.autoTimer); updateAutoButton(); }

  artwork.addEventListener('click',async event=>{ if(event.target.closest('.fuji-controls'))return; hidePrompt(); await musicalAction('manual',pointFromEvent(event)); });
  artwork.addEventListener('keydown',async event=>{ if(event.key!=='Enter'&&event.key!==' ')return; if(event.target.closest('.fuji-controls'))return; event.preventDefault(); hidePrompt(); await musicalAction('manual',{x:.5,y:.52}); });
  soundButton.addEventListener('click',event=>{ event.preventDefault(); event.stopPropagation(); audioState.muted=!audioState.muted; if(audioState.muted&&audioState.auto)stopAuto(); updateMaster(); updateSoundButton(); });
  autoButton.addEventListener('click',async event=>{ event.preventDefault(); event.stopPropagation(); if(audioState.auto)stopAuto(); else await startAuto(); });

  window.fujiAudio={setOverlayMuted(muted){ audioState.overlayMuted=Boolean(muted); updateMaster(); if(audioState.overlayMuted){clearTimeout(audioState.autoTimer);resetVisuals(false);}else if(audioState.auto)scheduleAuto(null); }};

  updateAutoButton(); updateSoundButton();
  revealBase().then(()=>{
    setTimeout(prepareOverlayAssets,isMobile()?520:240);
    tutorial.timers.push(setTimeout(()=>{ if(tutorial.step===0&&!audioState.droneStarted)showPrompt(WORDS.here()); },3200));
  });
})();
</script>

<script>
(() => {

  const clamp = (value, min, max) =>
    Math.min(
      Math.max(value, min),
      max
    );


  function smoothStep(value) {

    const t =
      clamp(
        value,
        0,
        1
      );


    return (
      t *
      t *
      (
        3 -
        (2 * t)
      )
    );

  }


  const pageShell =
    document.getElementById(
      "page-shell"
    );


  const overlay =
    document.getElementById(
      "wip-overlay"
    );


  const audio =
    document.getElementById(
      "wip-audio"
    );


  const closeButton =
    document.getElementById(
      "wip-close"
    );


  const stage =
    document.getElementById(
      "collage-stage"
    );


  const HORSE_START =
    12;


  const HORSE_FULL =
    20;


  let overlayOpen =
    false;


  let raf =
    null;


  let openedAt =
    0;


  function horseRevealAt(time) {

    if (
      time < HORSE_START
    ) {

      return 0;

    }


    return smoothStep(
      (
        time -
        HORSE_START
      )
      /
      (
        HORSE_FULL -
        HORSE_START
      )
    );

  }


  function visualLoop(now) {

    if (
      !overlayOpen
    ) {

      return;

    }


    /*
      Follow the cricket track when it is playing.

      The elapsed-time fallback keeps the horse fade working
      even if a browser refuses audio playback.
    */

    const elapsed =
      Math.max(
        0,
        (now - openedAt) / 1000
      );


    const time =
      audio.currentTime > 0
        ? audio.currentTime
        : elapsed;


    stage.style.setProperty(
      "--visual-reveal",
      horseRevealAt(
        time
      ).toFixed(4)
    );


    raf =
      requestAnimationFrame(
        visualLoop
      );

  }


  async function openWip() {

    if (
      overlayOpen
    ) {

      return;

    }


    overlayOpen =
      true;


    openedAt =
      performance.now();


    stage.style.setProperty(
      "--visual-reveal",
      "0"
    );


    /*
      Silence the photography composition while the
      unfinished-page overlay/crickets are active.
    */

    window.fujiAudio
      ?.setOverlayMuted(
        true
      );


    pageShell.classList.add(
      "is-hidden"
    );


    overlay.classList.add(
      "is-visible"
    );


    overlay.setAttribute(
      "aria-hidden",
      "false"
    );


    audio.pause();


    audio.currentTime =
      0;


    audio.volume =
      0.72;


    try {

      await audio.play();

    }

    catch (error) {

      console.log(
        "Audio could not start:",
        error
      );

    }


    cancelAnimationFrame(
      raf
    );


    raf =
      requestAnimationFrame(
        visualLoop
      );

  }


  function closeWip() {

    overlayOpen =
      false;


    cancelAnimationFrame(
      raf
    );


    audio.pause();


    audio.currentTime =
      0;


    stage.style.setProperty(
      "--visual-reveal",
      "0"
    );


    overlay.classList.remove(
      "is-visible"
    );


    overlay.setAttribute(
      "aria-hidden",
      "true"
    );


    pageShell.classList.remove(
      "is-hidden"
    );


    /*
      Restore the photography composition to its previous
      user-controlled sound state.
    */

    window.fujiAudio
      ?.setOverlayMuted(
        false
      );

  }


  document.addEventListener(
    "click",
    event => {

      const link =
        event.target.closest(
          "a"
        );


      if (
        !link ||
        link.hasAttribute(
          "data-live-link"
        )
      ) {

        return;

      }


      event.preventDefault();


      openWip();

    }
  );


  closeButton.addEventListener(
    "click",
    closeWip
  );


  document.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
          "Escape" &&
        overlayOpen
      ) {

        closeWip();

      }

    }
  );

})();
</script>
