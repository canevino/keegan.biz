  <script>
  (() => {

    const title =
      document.getElementById(
        "photo-title"
      );


    const colors = [
      "#c1272d",
      "#006a44",
      "#fdb913"
    ];


    let current = 0;


    function changeTitle() {

      let next;


      do {

        next =
          Math.floor(
            Math.random() *
            colors.length
          );

      }
      while (
        next === current
      );


      title.classList.add(
        "is-fading"
      );


      window.setTimeout(
        () => {

          current =
            next;


          title.style.color =
            colors[current];


          title.classList.remove(
            "is-fading"
          );

        },
        200
      );

    }


    title.style.color =
      colors[current];


    window.setInterval(
      changeTitle,
      2300
    );

  })();
  </script>

    const random =

    function shuffle(
      array
    ) {

      const result =
        [...array];


      for (
        let i =
          result.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (
              i + 1
            )
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }


      return result;

    }


    function weightedPick(
      entries
    ) {

      const usable =
        entries.filter(
          entry =>
            entry.weight > 0
        );


      const total =
        usable.reduce(
          (
            sum,
            item
          ) =>
            sum +
            item.weight,
          0
        );


      if (
        !usable.length ||
        total <= 0
      ) {

        return null;

      }


      let value =
        Math.random() *
        total;


      for (
        const item of usable
      ) {

        value -=
          item.weight;


        if (
          value <= 0
        ) {

          return item.value;

        }

      }


      return usable[
        usable.length - 1
      ].value;

    }


    function weightedObject(
      entries
    ) {

      const usable =
        entries.filter(
          entry =>
            entry.weight > 0
        );


      const total =
        usable.reduce(
          (
            sum,
            item
          ) =>
            sum +
            item.weight,
          0
        );


      let value =
        Math.random() *
        total;


      for (

        if (

      return usable[
        usable.length - 1

    function waitForImage(
      image
    ) {

      if (
        image.complete &&
        image.naturalWidth >
          0
      ) {

        return Promise.resolve();

      }


      return new Promise(
        (
          resolve,
          reject
        ) => {

          image.addEventListener(
            "load",
            resolve,
            {
              once: true
            }
          );


          image.addEventListener(

    ) {

      clickPrompt.classList.add(

      );


      clickPrompt.setAttribute(
        "aria-hidden",
        "false"
      );

    }


    function hidePrompt() {

      clickPrompt.classList.remove(
        "is-visible"
      );


      clickPrompt.setAttribute(
        "aria-hidden",
        "true"
      );

    }


    function schedulePrompt(
      text,
      delay
    ) {

      window.clearTimeout(
        tutorial.promptTimer
      );


      tutorial.promptTimer =
        window.setTimeout(
          () => {

            showPrompt(

    function revealControls() {

      hidePrompt();

        tutorial.promptTimer

      if (
        tutorial.step === 0

        tutorial.step =
          1;


        schedulePrompt(

      if (

        hue: [76, 104],
        brightness: [.90, 1.00],
        contrast: [1.04, 1.14],
        opacity: [.07, .19]
      },

      {
        blend: "lighten",
        weight: 16,
        grayscale: [.12, .25],
        sepia: [.28, .48],
        saturate: [.58, .88],
        hue: [5, 24],
        brightness: [.97, 1.08],
        contrast: [1.02, 1.11],
        opacity: [.07, .18]
      },

      {
        blend: "multiply",
        weight: 12,
        grayscale: [.08, .20],
        sepia: [.34, .54],
        saturate: [.70, 1.00],
        hue: [-8, 10],
        brightness: [.78, .91],
        contrast: [1.06, 1.16],
        opacity: [.05, .15]
      }

    ];


    /* =====================================================
       SPLASHES
       ===================================================== */

    const SPLASH_COLORS = [
      "#006a44",
      "#fdb913",
      "#c1272d"
    ];


    const SPLASH_BLENDS = [
      "overlay",
      "soft-light",
      "multiply"
    ];


    function eventPointFromMouse(
      event
    ) {

      const rect =
        artwork.getBoundingClientRect();


      return {

        x:
          clamp(
            (
              event.clientX -
              rect.left
            ) /
            rect.width,
            0,
            1
          ),

        y:
          clamp(
            (
              event.clientY -
              rect.top
            ) /
            rect.height,
            0,
            1
          )

      };

    }


    function randomEventPoint() {

      return {

        x:
          random(
            .20,
            .80
          ),

        y:
          random(
            .22,
            .80
          )

      };

    }


    function addSplashCircle(
      point,
      type,
      index
    ) {

      const circle =
        document.createElement(
          "span"
        );


      circle.className =
        `fuji-splash fuji-splash-${type}`;


      const cloud =
        type === "cloud";


      const drone =
        type === "drone";


      const size =
        cloud
          ? random(44, 78)
          : drone
            ? random(28, 48)
            : random(12, 23);


      const duration =
        cloud
          ? random(5.4, 7.8)
          : drone
            ? random(5.5, 8)
            : random(2.7, 4.2);


      const opacity =
        cloud
          ? random(.14, .25)
          : drone
            ? random(.09, .15)
            : random(.13, .21);


      const jitter =
        cloud
          ? .07
          : drone
            ? .04
            : .025;


      const x =
        clamp(
          point.x +
          random(
            -jitter,
            jitter
          ),
          .03,
          .97
        );


      const y =
        clamp(
          point.y +
          random(
            -jitter,
            jitter
          ),
          .03,
          .97
        );


      circle.style.setProperty(
        "--x",
        `${x * 100}%`
      );


      circle.style.setProperty(
        "--y",
        `${y * 100}%`
      );


      circle.style.setProperty(
        "--size",
        `${size}%`
      );


      circle.style.setProperty(
        "--splash-color",
        pick(
          SPLASH_COLORS
        )
      );


      circle.style.setProperty(
        "--splash-opacity",
        opacity.toFixed(3)
      );


      circle.style.setProperty(
        "--splash-duration",
        `${duration}s`
      );


      circle.style.setProperty(
        "--splash-delay",
        `${index * random(.05, .13)}s`
      );


      circle.style.mixBlendMode =
        pick(
          SPLASH_BLENDS
        );


      splashLayer.appendChild(
        circle
      );


      window.setTimeout(
        () => {

          circle.remove();

        },
        (
          duration +
          .6
        ) *
        1000
      );

    }


    function createSplash(
      type,
      point
    ) {

      if (
        reducedMotion.matches
      ) {

        return;

      }


      const origin =
        point ||
        randomEventPoint();


      const count =
        type === "cloud"
          ? randomInt(2, 3)
          : type === "drone"
            ? 2
            : 1;


      for (
        let i = 0;
        i < count;
        i++
      ) {

        addSplashCircle(
          origin,
          type,
          i
        );

      }

    }


    /* =====================================================
       IMAGE PREPARATION
       ===================================================== */

    function hasUsefulAlpha(
      image
    ) {

      try {

        const canvas =
          document.createElement(
            "canvas"
          );


        const width =
          120;


        const height =
          Math.max(
            1,
            Math.round(
              width *
              (
                image.naturalHeight /
                image.naturalWidth
              )
            )
          );


        canvas.width =
          width;


        canvas.height =
          height;


        const context =
          canvas.getContext(
            "2d",
            {
              willReadFrequently: true
            }
          );


        context.drawImage(
          image,
          0,
          0,
          width,
          height
        );


        const data =
          context.getImageData(
            0,
            0,
            width,
            height
          ).data;


        let translucent =
          0;


        for (
          let i = 3;
          i < data.length;
          i += 4
        ) {

          if (
            data[i] < 235
          ) {

            translucent++;

          }

        }


        return (
          translucent /
          (
            width *
            height
          )
        ) > .025;

      }

      catch {

        return false;

      }

    }


    let validLines =
      [];


    let buildingValid =
      true;


    async function prepareVisuals() {

      try {

        await Promise.all([

          waitForImage(
            base
          ),

          ...buildings.map(
            waitForImage
          ),

          ...lines.map(
            line =>
              waitForImage(
                line.source
              )
          )

        ]);

      }

      catch (error) {

        console.error(
          "One or more photography assets failed to load.",
          error
        );


        return;

      }


      const width =
        base.naturalWidth;


      const height =
        base.naturalHeight;


      validLines =
        lines.filter(
          item => {

            if (
              item.source.naturalWidth !== width ||
              item.source.naturalHeight !== height
            ) {

              item.layer.style.display =
                "none";


              return false;

            }


            if (
              hasUsefulAlpha(
                item.source
              )
            ) {

              item.layer.classList.add(
                "has-alpha"
              );


              item.texture.style.webkitMaskImage =
                `url("${item.source.src}")`;


              item.texture.style.maskImage =
                `url("${item.source.src}")`;

            }

            else {

              item.layer.classList.add(
                "has-white-canvas"
              );

            }


            return true;

          }
        );


      buildingValid =
        buildings.every(
          building =>
            building.naturalWidth === width &&
            building.naturalHeight === height
        );


      if (
        !buildingValid
      ) {

        buildings.forEach(
          building => {

            building.style.display =
              "none";

          }
        );

      }


      clearArtwork(
        true
      );

    }


    /* =====================================================
       LINES
       ===================================================== */

    function chooseLineBlend(
      item,
      intensity
    ) {

      if (
        item.layer.classList.contains(
          "has-white-canvas"
        )
      ) {

        return weightedPick([

          {
            value: "multiply",
            weight: 56
          },

          {
            value: "darken",
            weight: 28
          },

          {
            value: "color-burn",
            weight:
              7 +
              intensity *
              7
          }

        ]);

      }


      return weightedPick([

        {
          value: "soft-light",
          weight: 22
        },

        {
          value: "overlay",
          weight: 20
        },

        {
          value: "multiply",
          weight: 17
        },

        {
          value: "screen",
          weight: 13
        },

        {
          value: "hard-light",
          weight: 12
        },

        {
          value: "exclusion",
          weight:
            2 +
            intensity *
            3
        },

        {
          value: "difference",
          weight:
            1 +
            intensity *
            2
        }

      ]);

    }


    function chooseProcessing(
      intensity
    ) {

      return weightedPick([

        {
          value: "normal",
          weight: 29
        },

        {
          value: "exposed",
          weight: 25
        },

        {
          value: "posterize",
          weight:
            14 +
            intensity *
            8
        },

        {
          value: "threshold",
          weight:
            4 +
            intensity *
            10
        },

        {
          value: "hard",
          weight:
            10 +
            intensity *
            5
        },

        {
          value: "bleached",
          weight: 11
        }

      ]);

    }


    function filterFor(
      processing,
      intensity,
      palette
    ) {

      const hue =
        palette.hue +
        random(
          -7,
          7
        );


      if (
        processing === "posterize"
      ) {

        return `
          grayscale(.15)
          sepia(.38)
          url("${pick(POSTERIZE)}")
          hue-rotate(${hue}deg)
          saturate(${random(
            palette.saturate[0],
            palette.saturate[1] + .12
          )})
          brightness(${random(
            palette.brightness[0],
            palette.brightness[1]
          )})
          contrast(${random(1.08, 1.40)})
        `;

      }


      if (
        processing === "threshold"
      ) {

        return `
          grayscale(.20)
          sepia(.42)
          url("${pick(THRESHOLD)}")
          hue-rotate(${hue}deg)
          saturate(${random(
            palette.saturate[0],
            palette.saturate[1] + .12
          )})
          contrast(${random(1.12, 1.45)})
        `;

      }


      if (
        processing === "exposed"
      ) {

        return `
          grayscale(.10)
          sepia(.30)
          hue-rotate(${hue}deg)
          saturate(${random(
            palette.saturate[0],
            palette.saturate[1] + .14
          )})
          brightness(${random(
            1,
            1.18 +
            intensity *
            .12
          )})
          contrast(${random(1.05, 1.30)})
        `;

      }


      if (
        processing === "hard"
      ) {

        return `
          grayscale(.12)
          sepia(.34)
          hue-rotate(${hue}deg)
          saturate(${random(
            palette.saturate[0],
            palette.saturate[1] + .18
          )})
          brightness(${random(.88, 1.05)})
          contrast(${random(1.28, 1.68)})
        `;

      }


      if (
        processing === "bleached"
      ) {

        return `
          grayscale(.24)
          sepia(.20)
          hue-rotate(${hue}deg)
          saturate(${random(.54, .84)})
          brightness(${random(1.08, 1.23)})
          contrast(${random(.98, 1.15)})
        `;

      }


      return `
        grayscale(.10)
        sepia(.30)
        hue-rotate(${hue}deg)
        saturate(${random(
          palette.saturate[0],
          palette.saturate[1]
        )})
        brightness(${random(
          palette.brightness[0],
          palette.brightness[1]
        )})
        contrast(${random(1.02, 1.20)})
      `;

    }


    function configureLine(
      item,
      intensity
    ) {

      const palette =
        pick(
          LINE_PALETTES
        );


      const [
        colorA,
        colorB
      ] =
        palette.colors;


      const textureA =
        pick(
          VISUAL_TEXTURES
        );


      const textureB =
        pick(
          VISUAL_TEXTURES
        );


      item.source.style.mixBlendMode =
        chooseLineBlend(
          item,
          intensity
        );


      item.source.style.filter =
        filterFor(
          chooseProcessing(
            intensity
          ),
          intensity,
          palette
        );


      item.source.style.opacity =
        random(
          .34,
          .80
        );


      const angle =
        random(
          0,
          360
        );


      if (
        item.layer.classList.contains(
          "has-alpha"
        )
      ) {

        item.texture.style.backgroundImage =
          `
            linear-gradient(
              ${angle}deg,
              ${colorA},
              ${colorB}
            ),
            url("${textureA}"),
            url("${textureB}")
          `;


        item.texture.style.backgroundBlendMode =
          `
            normal,
            ${pick([
              "multiply",
              "soft-light",
              "overlay"
            ])},
            normal
          `;


        item.texture.style.mixBlendMode =
          weightedPick([

            {
              value: "soft-light",
              weight: 24
            },

            {
              value: "overlay",
              weight: 22
            },

            {
              value: "multiply",
              weight: 16
            },

            {
              value: "screen",
              weight: 14
            },

            {
              value: "hard-light",
              weight: 10
            },

            {
              value: "difference",
              weight:
                1 +
                intensity *
                2
            }

          ]);

      }

      else {

        item.texture.style.backgroundImage =
          `
            url("${item.source.src}"),
            linear-gradient(
              ${angle}deg,
              ${colorA},
              ${colorB}
            ),
            url("${textureA}"),
            url("${textureB}")
          `;


        item.texture.style.backgroundBlendMode =
          `
            multiply,
            screen,
            overlay,
            normal
          `;


        item.texture.style.mixBlendMode =
          "multiply";

      }


      item.texture.style.backgroundSize =
        `
          100% 100%,
          ${random(110, 160)}% ${random(110, 160)}%,
          cover,
          cover
        `;


      item.texture.style.backgroundPosition =
        `
          center,
          ${random(0, 100)}% ${random(0, 100)}%,
          ${random(0, 100)}% ${random(0, 100)}%,
          ${random(0, 100)}% ${random(0, 100)}%
        `;


      item.texture.style.filter =
        `
          grayscale(${random(.03, .13)})
          contrast(${random(1.05, 1.38)})
          saturate(${random(.88, 1.18)})
        `;


      item.texture.style.opacity =
        random(
          .14,
          .38 +
          intensity *
          .15
        );


      item.layer.dataset.targetOpacity =
        clamp(
          random(
            .27,
            .57 +
            intensity *
            .24
          ),
          .18,
          .86
        ).toFixed(
          3
        );


      item.layer.style.transform =
        "none";

    }


    /* =====================================================
       BUILDING
       ===================================================== */

    function configureBuildingLayer(
      building,
      intensity
    ) {

      const look =
        weightedObject(
          BUILDING_LOOKS
        );


      building.style.mixBlendMode =
        look.blend;


      building.style.filter =
        `
          grayscale(${random(
            look.grayscale[0],
            look.grayscale[1]
          )})
          sepia(${random(
            look.sepia[0],
            look.sepia[1]
          )})
          saturate(${random(
            look.saturate[0],
            look.saturate[1]
          )})
          hue-rotate(${random(
            look.hue[0],
            look.hue[1]
          )}deg)
          brightness(${random(
            look.brightness[0],
            look.brightness[1]
          ) + intensity * .025})
          contrast(${random(
            look.contrast[0],
            look.contrast[1]
          ) + intensity * .025})
        `;


      building.style.transform =
        `
          translate3d(
            ${random(-.65, .65)}px,
            ${random(-.65, .65)}px,
            0
          )
        `;


      building.dataset.targetOpacity =
        clamp(
          random(
            look.opacity[0],
            look.opacity[1] +
            intensity *
            .07
          ),
          .04,
          .32
        ).toFixed(
          3
        );

    }


    function wakeBuilding(
      intensity
    ) {

      if (
        !buildingValid
      ) {

        return;

      }


      const count =
        intensity < .34
          ? 1
          : intensity < .62
            ? 2
            : 3;


      const selected =
        shuffle(
          buildings
        ).slice(
          0,
          count
        );


      buildings.forEach(
        building => {

          if (
            selected.includes(
              building
            )
          ) {

            configureBuildingLayer(
              building,
              intensity
            );


            building.style.opacity =
              building.dataset
                .targetOpacity;

          }

          else {

            building.style.opacity =
              "0";

          }

        }
      );

    }


    /* =====================================================
       MOVEMENT VISUALS
       ===================================================== */

    let pointerInside =
      false;


    let lastPointer = {
      x: 0,
      y: 0,
      time: 0
    };


    let activeOrder =
      [];


    let visibleCount =
      0;


    let movementAccumulator =
      0;


    let lastMutationTime =
      0;


    let lastBuildingUpdateTime =
      0;


    const STILL_SPEED =
      .055;


    const FULL_SPEED =
      1.15;


    function normalizeSpeed(
      speed
    ) {

      return clamp(
        (
          speed -
          STILL_SPEED
        ) /
        (
          FULL_SPEED -
          STILL_SPEED
        ),
        0,
        1
      );

    }


    function revealNextLines(
      amount,
      intensity
    ) {

      if (
        !activeOrder.length
      ) {

        activeOrder =
          shuffle(
            validLines
          );

      }


      for (
        let i = 0;
        i < amount;
        i++
      ) {

        if (
          visibleCount >=
          activeOrder.length
        ) {

          break;

        }


        const item =
          activeOrder[
            visibleCount
          ];


        configureLine(
          item,
          intensity
        );


        item.visible =
          true;


        item.lastMutation =
          performance.now();


        item.layer.style.transitionDuration =
          `${random(160, 430)}ms`;


        item.layer.style.opacity =
          item.layer.dataset
            .targetOpacity;


        visibleCount++;

      }

    }


    function mutateVisibleLines(
      intensity,
      count
    ) {

      const now =
        performance.now();


      const available =
        validLines.filter(
          item =>
            item.visible &&
            (
              now -
              item.lastMutation
            ) >
            180
        );


      if (
        !available.length
      ) {

        return;

      }


      shuffle(
        available
      )
        .slice(
          0,
          Math.min(
            count,
            available.length
          )
        )
        .forEach(
          item => {

            configureLine(
              item,
              intensity
            );


            item.lastMutation =
              now;


            item.layer.style.transitionDuration =
              intensity > .72
                ? `${random(100, 220)}ms`
                : `${random(220, 500)}ms`;


            item.layer.style.opacity =
              item.layer.dataset
                .targetOpacity;

          }
        );

    }


    function processMovement(
      event
    ) {

      if (
        !pointerInside ||
        reducedMotion.matches
      ) {

        return;

      }


      const now =
        performance.now();


      if (
        !lastPointer.time
      ) {

        lastPointer = {

          x:
            event.clientX,

          y:
            event.clientY,

          time:
            now

        };


        return;

      }


      const dx =
        event.clientX -
        lastPointer.x;


      const dy =
        event.clientY -
        lastPointer.y;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      const elapsed =
        Math.max(
          16,
          now -
          lastPointer.time
        );


      const speed =
        distance /
        elapsed;


      lastPointer = {

        x:
          event.clientX,

        y:
          event.clientY,

        time:
          now

      };


      if (
        speed <
        STILL_SPEED
      ) {

        return;

      }


      const intensity =
        normalizeSpeed(
          speed
        );


      movementAccumulator +=
        distance *
        (
          .55 +
          intensity *
          1.55
        );


      const revealThreshold =
        95 -
        intensity *
        69;


      if (
        movementAccumulator >=
        revealThreshold
      ) {

        let amount =
          1;


        if (
          intensity > .68
        ) {

          amount =
            Math.random() < .42
              ? 2
              : 1;

        }


        if (
          intensity > .88
        ) {

          amount =
            Math.random() < .36
              ? 3
              : 2;

        }


        revealNextLines(
          amount,
          intensity
        );


        movementAccumulator =
          0;

      }


      const mutationGap =
        620 -
        intensity *
        535;


      if (
        now -
        lastMutationTime >=
        mutationGap
      ) {

        const count =
          intensity > .84
            ? (
                Math.random() < .35
                  ? 3
                  : 2
              )
            : 1;


        mutateVisibleLines(
          intensity,
          count
        );


        lastMutationTime =
          now;

      }


      const buildingGap =
        intensity > .75
          ? 150
          : intensity > .45
            ? 210
            : 280;


      if (
        now -
        lastBuildingUpdateTime >=
        buildingGap
      ) {

        wakeBuilding(
          intensity
        );


        lastBuildingUpdateTime =
          now;

      }

    }


    function clearArtwork(
      instant = false
    ) {

      movementAccumulator =
        0;


      visibleCount =
        0;


      lastMutationTime =
        0;


      lastBuildingUpdateTime =
        0;


      activeOrder =
        shuffle(
          validLines
        );


      validLines.forEach(
        item => {

          item.visible =
            false;


          item.lastMutation =
            0;


          item.layer.style.transitionDuration =
            instant
              ? "0ms"
              : "220ms";


          item.layer.style.opacity =
            "0";

        }
      );


      buildings.forEach(
        building => {

          building.style.transitionDuration =
            instant
              ? "0ms"
              : "220ms";


          building.style.opacity =
            "0";


          building.style.transform =
            "translate3d(0,0,0)";


          building.style.filter =
            "none";


          building.style.mixBlendMode =
            "normal";

        }
      );

    }


    function visualChordPulse() {

      if (
        reducedMotion.matches ||
        (
          finePointer.matches &&
          !pointerInside
        )
      ) {

        return;

      }


      if (
        visibleCount < 4
      ) {

        revealNextLines(
          3,
          .78
        );

      }

      else {

        revealNextLines(
          1,
          .78
        );

      }


      mutateVisibleLines(
        .82,
        3
      );


      wakeBuilding(
        .82
      );

    }


    function visualConnectionPulse() {

      if (
        reducedMotion.matches ||
        (
          finePointer.matches &&
          !pointerInside
        )
      ) {

        return;

      }


      if (
        visibleCount === 0
      ) {

        revealNextLines(
          1,
          .38
        );

      }

      else {

        mutateVisibleLines(
          .38,
          1
        );

      }


      if (
        Math.random() < .42
      ) {

        wakeBuilding(
          .34
        );

      }

    }


    artwork.addEventListener(
      "pointerenter",
      event => {

        if (
          !finePointer.matches ||

    /* =====================================================

    function ensureAudioContext() {

      if (
        audioState.context
      ) {

        return audioState.context;

      }


      const Context =
        window.AudioContext ||
        window.webkitAudioContext;


      if (
        !Context
      ) {

        return null;

      }


      const context =
        new Context();


      const masterBus =
        context.createGain();


      const compressor =
        context.createDynamicsCompressor();


      const masterGain =
        context.createGain();


      compressor.threshold.value =
        -12;


      compressor.knee.value =
        12;


      compressor.ratio.value =
        2.4;


      compressor.attack.value =
        .018;


      compressor.release.value =
        .32;


      masterGain.gain.value =
        AUDIO_CONFIG.masterGain;


      masterBus.connect(
        compressor
      );


      compressor.connect(
        masterGain
      );


      masterGain.connect(
        context.destination
      );


      audioState.context =
        context;


      audioState.masterBus =
        masterBus;


      audioState.compressor =
        compressor;


      audioState.masterGain =
        masterGain;


      return context;

    }

    function updateMasterGain() {

      if (

      const now =

      const target =
        (

          ? .0001
          : AUDIO_CONFIG.masterGain;


      audioState.masterGain.gain
        .cancelScheduledValues(
          now
        );


      audioState.masterGain.gain
        .setValueAtTime(
          Math.max(
            .0001,
            audioState.masterGain.gain
              .value
          ),
          now
        );


      audioState.masterGain.gain
        .exponentialRampToValueAtTime(
          target,
          now +
          .24
        );

    }

    async function loadBuffer(
      path
    ) {

      if (
        audioState.bufferCache.has(
          path
        )
      ) {

        return audioState.bufferCache.get(
          path
        );

      }


      if (
        audioState.loadPromises.has(
          path
        )
      ) {

        return audioState.loadPromises.get(
          path
        );

      }


      const context =
        ensureAudioContext();


      const promise =
        fetch(
          path
        )
          .then(
            response => {

              if (
                !response.ok
              ) {

                throw new Error(
                  `Failed to load ${path}`
                );

              }


              return response.arrayBuffer();

            }
          )
          .then(
            arrayBuffer =>
              context.decodeAudioData(
                arrayBuffer
              )
          )
          .then(
            buffer => {

              audioState.bufferCache.set(
                path,
                buffer
              );


              audioState.loadPromises.delete(
                path
              );


              return buffer;

            }
          )
          .catch(
            error => {

              audioState.loadPromises.delete(
                path
              );


              throw error;

            }
          );


      audioState.loadPromises.set(
        path,
        promise
      );


      return promise;

    }


    async function preloadAllSamples() {

      audioState.preloadStarted =

      const paths =

          sample =>
            sample.path
