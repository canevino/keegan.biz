      "Texturelabs_Wood_290S.jpg"

    ].map(
      file =>
        `../assets/home/${file}`
    );


    const DIRTY_TEXTURES =
      ALL_TEXTURES.filter(
        src =>
          /Grunge|Concrete|Soil|Stone|Wood|Metal|Film|Brick|Paper|InkPaint/i
            .test(src)
      );


    const SOFTER_TEXTURES =
      ALL_TEXTURES.filter(
        src =>
          !DIRTY_TEXTURES.includes(
            src
          )
      );


    let sessionTextures = [];
    let readyTextures = [];
    let recentTextures = [];


    function prepareTextures() {

      sessionTextures = [

        ...shuffle(
          DIRTY_TEXTURES
        ).slice(
          0,
          isMobile()
            ? 10
            : 18
        ),

        ...shuffle(
          SOFTER_TEXTURES
        ).slice(
          0,
          isMobile()
            ? 2
            : 6
        )

      ];


      readyTextures =
        [];


      sessionTextures.forEach(
        src => {

          const image =
            new Image();


          image.decoding =
            "async";


          image.onload =
            () => {

              if (
                !readyTextures.includes(
                  src
                )
              ) {

                readyTextures.push(
                  src
                );

              }

            };


          image.src =
            src;

        }
      );

    }


    function chooseTexture() {

      const dirty =
        readyTextures.filter(
          src =>
            DIRTY_TEXTURES.includes(
              src
            )
        );


      const pool =
        (
          Math.random() < .82 &&
          dirty.length > 3
        )
          ? dirty
          : (
              readyTextures.length > 5
                ? readyTextures
                : sessionTextures
            );


      let result;
      let attempts = 0;


      do {

        result =
          pick(
            pool
          );


        attempts++;

      }
      while (
        recentTextures.includes(
          result
        ) &&
        attempts < 14
      );


      recentTextures.push(
        result
      );


      if (
        recentTextures.length > 7
      ) {

        recentTextures.shift();

      }


      return result;

    }


    const HORSE_COLORS = [

      {
        name: "burnt sienna",
        hue: -13,
        saturation: 3.55,
        brightness: .94,
        contrast: 1.28
      },

      {
        name: "forest green",
        hue: 69,
        saturation: 2.85,
        brightness: .84,
        contrast: 1.24
      },

      {
        name: "ocean blue",
        hue: 151,
        saturation: 3.25,
        brightness: .91,
        contrast: 1.22
      },

      {
        name: "canyon red",
        hue: -28,
        saturation: 3.65,
        brightness: .89,
        contrast: 1.30
      },

      {
        name: "dirt brown",
        hue: 4,
        saturation: 1.95,
        brightness: .78,
        contrast: 1.24
      },

      {
        name: "pale sage",
        hue: 67,
        saturation: 1.72,
        brightness: 1.08,
        contrast: 1.05
      },

      {
        name: "blueberry",
        hue: 187,
        saturation: 3.05,
        brightness: .82,
        contrast: 1.27
      }

    ];


    const OPENING_COLORS = [
      HORSE_COLORS[0],
      HORSE_COLORS[1],
      HORSE_COLORS[2],
      HORSE_COLORS[3],
      HORSE_COLORS[6]
    ];


    let lastHorseColorName =
      "";


    function differentHorseColor(
      pool
    ) {

      let result;
      let attempts = 0;


      do {

        result =
          pick(
            pool
          );


        attempts++;

      }
      while (
        result.name ===
          lastHorseColorName &&
        attempts < 12
      );


      lastHorseColorName =
        result.name;


      return result;

    }


    function nextHorseColor(
      time
    ) {

      return differentHorseColor(
        time < 75
          ? OPENING_COLORS
          : HORSE_COLORS
      );

    }


    function makeSlot(
      id,
      options
    ) {

      const element =
        document.getElementById(
          id
        );


      return {

        element,

        frames:
          Array.from(
            element.querySelectorAll(
              ".morph-frame"
            )
          ),

        active: 0,

        ...options,

        nextChange:
          Infinity

      };

    }


    const slots = [

      makeSlot(
        "under-slot-1",
        {
          role: "foundation",
          desktopBlend: "multiply",
          mobileBlend: "multiply",
          internalBlend: "multiply",
          slowDuration: 11.5,
          fastDuration: 2.5,
          phase: 0,
          mobileEnabled: true
        }
      ),

      makeSlot(
        "under-slot-2",
        {
          role: "secondary",
          desktopBlend: "color-burn",
          mobileBlend: "soft-light",
          internalBlend: "overlay",
          slowDuration: 13.5,
          fastDuration: 3,
          phase: 2.4,
          mobileEnabled: true
        }
      ),

      makeSlot(
        "over-slot-1",
        {
          role: "overprint",
          desktopBlend: "hard-light",
          mobileBlend: "soft-light",
          internalBlend: "multiply",
          slowDuration: 9.5,
          fastDuration: 2.4,
          phase: 4.8,
          mobileEnabled: false
        }
      )

    ];


    function neutralTint() {

      return `
        linear-gradient(
          ${random(0, 360)}deg,
          ${pick([
            "#060605",
            "#11100e",
            "#1a1714",
            "#25211c"
          ])} 0%,
          ${pick([
            "#49443d",
            "#5a544b",
            "#6e665b",
            "#7a7164"
          ])} 52%,
          ${pick([
            "#c5bdae",
            "#d2cabc",
            "#ded5c7",
            "#e8dfd1"
          ])} 100%
        )
      `;

    }


    function opacityForSlot(
      slot,
      intensity
    ) {

      if (
        slot.role ===
        "foundation"
      ) {

        return isMobile()
          ? random(
              .48,
              .62 +
              intensity *
              .10
            )
          : random(
              .60,
              .78 +
              intensity *
              .10
            );

      }


      if (
        slot.role ===
        "secondary"
      ) {

        return isMobile()
          ? random(
              .24,
              .35 +
              intensity *
              .13
            )
          : random(
              .34,
              .50 +
              intensity *
              .14
            );

      }


      return random(
        .08,
        .16 +
        intensity *
        .11
      );

    }


    function configureFrame(
      frame,
      slot,
      intensity
    ) {

      frame.style.backgroundImage =
        `
          ${neutralTint()},
          url("${chooseTexture()}")
        `;


      frame.style.backgroundSize =
        "cover, cover";


      frame.style.backgroundRepeat =
        "no-repeat, no-repeat";


      frame.style.backgroundBlendMode =
        `${slot.internalBlend}, normal`;


      frame.style.mixBlendMode =
        isMobile()
          ? slot.mobileBlend
          : slot.desktopBlend;


      frame.style.transform =
        `
          translate(
            ${random(-2, 2)}%,
            ${random(-2, 2)}%
          )
          rotate(
            ${random(-1.5, 1.5)}deg
          )
          scale(
            ${random(1.06, 1.20)}
          )
        `;


      frame.style.filter =
        isMobile()
          ? `
              grayscale(1)
              saturate(0)
              contrast(${random(1.16, 1.42)})
              brightness(${random(.74, .94)})
            `
          : `
              grayscale(1)
              saturate(0)
              contrast(${random(1.28, 1.72)})
              brightness(${random(.64, .92)})
            `;


      frame.dataset.targetOpacity =
        opacityForSlot(
          slot,
          intensity
        ).toFixed(
          3
        );

    }


    function initializeSlot(
      slot,
      intensity,
      time
    ) {

      if (
        isMobile() &&
        !slot.mobileEnabled
      ) {

        slot.element.style.display =
          "none";


        return;

      }


      const first =
        slot.frames[0];


      configureFrame(
        first,
        slot,
        intensity
      );


      const fade =
        isMobile()
          ? 6
          : 7;


      first.style.transitionDuration =
        `${fade}s`;


      first.style.opacity =
        first.dataset
          .targetOpacity;


      slot.nextChange =
        time +
        slot.phase +
        fade;

    }


    function morphSlot(
      slot,
      intensity,
      time
    ) {

      const outgoing =
        slot.frames[
          slot.active
        ];


      const incomingIndex =
        slot.active === 0
          ? 1
          : 0;


      const incoming =
        slot.frames[
          incomingIndex
        ];


      let duration =
        lerp(
          slot.slowDuration,
          slot.fastDuration,
          intensity
        );


      if (
        isMobile()
      ) {

        duration =
          Math.max(
            duration,
            3.2
          );

      }


      incoming.style.opacity =
        "0";


      configureFrame(
        incoming,
        slot,
        intensity
      );


      incoming.offsetHeight;


      incoming.style.transitionDuration =
        `${duration}s`;


      outgoing.style.transitionDuration =
        `${duration}s`;


      requestAnimationFrame(
        () => {

          incoming.style.opacity =
            incoming.dataset
              .targetOpacity;


          outgoing.style.opacity =
            "0";

        }
      );


      slot.active =
        incomingIndex;


      slot.nextChange =
        time +
        duration *
        .96;

    }


    let nextHorseChange =
      Infinity;


    function applyHorseColor(
      color,
      intensity,
      time
    ) {

      const transition =
        lerp(
          5.8,
          isMobile()
            ? 3.4
            : 2.5,
          intensity
        );


      horseMain.style.transitionDuration =
        `${transition}s`;


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(${color.saturation})
          hue-rotate(${color.hue}deg)
          contrast(${color.contrast})
          brightness(${color.brightness})
        `;


      horseMain.style.opacity =
        "1";


      horseOffset.style.opacity =
        isMobile()
          ? "0"
          : lerp(
              .02,
              .06,
              intensity
            ).toFixed(
              3
            );


      horseKey.style.opacity =
        isMobile()
          ? lerp(
              .08,
              .14,
              intensity
            ).toFixed(
              3
            )
          : lerp(
              .10,
              .18,
              intensity
            ).toFixed(
              3
            );


      nextHorseChange =
        time +
        lerp(
          12,
          isMobile()
            ? 5.2
            : 4,
          intensity
        );

    }


    function prepareInitialHorse() {

      const color =
        differentHorseColor(
          OPENING_COLORS
        );


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(${color.saturation * 1.12})
          hue-rotate(${color.hue}deg)
          contrast(${color.contrast * 1.04})
          brightness(${color.brightness * 1.03})
        `;


      horseMain.style.opacity =
        "0";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";


      nextHorseChange =
        24;

    }


    function normalHorse() {

      horseMain.style.mixBlendMode =
        "normal";


      horseMain.style.filter =
        "none";


      horseMain.style.opacity =
        "1";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";

    }


    const HORSE_START = 12;
    const HORSE_FULL = 20;
    const COLLAGE_START = 30;
    const NORMAL_TIME = 243;


    function horseRevealAt(
      time
    ) {

      if (
        time < HORSE_START
      ) {

        return 0;

      }


      return smoothStep(
        (
          time -
          HORSE_START
        ) /
        (
          HORSE_FULL -
          HORSE_START
        )
      );

    }


    function intensityAt(
      time
    ) {

      if (
        time < COLLAGE_START ||
        time >= NORMAL_TIME
      ) {

        return 0;

      }


      return clamp(
        (
          time -
          COLLAGE_START
        ) /
        (
          NORMAL_TIME -
          COLLAGE_START
        ),
        0,
        1
      );

    }


    let overlayOpen = false;
    let collageStarted = false;
    let horseStarted = false;
    let normalState = false;
    let raf = null;


    function clearSlots() {

      slots.forEach(
        slot => {

          slot.nextChange =
            Infinity;


          slot.frames.forEach(
            frame => {

              frame.style.opacity =
                "0";

            }
          );

        }
      );

    }


    function visualLoop() {

      if (
        !overlayOpen
      ) {

        return;

      }


      const time =
        audio.currentTime ||
        0;


      stage.style.setProperty(
        "--visual-reveal",
        horseRevealAt(
          time
        ).toFixed(
          4
        )
      );


      if (
        time >= HORSE_START &&
        !horseStarted
      ) {

        horseStarted =
          true;


        prepareInitialHorse();

      }


      if (
        time >= HORSE_START &&
        time < COLLAGE_START
      ) {

        horseMain.style.opacity =
          horseRevealAt(
            time
          );


        if (
          time >= nextHorseChange
        ) {

          applyHorseColor(
            nextHorseColor(
              time
            ),
            .08,
            time
          );

        }

      }


      if (
        time >= COLLAGE_START &&
        time < NORMAL_TIME
      ) {

        const intensity =
          intensityAt(
            time
          );


        if (
          !collageStarted
        ) {

          collageStarted =
            true;


          slots.forEach(
            slot =>
              initializeSlot(
                slot,
                intensity,
                time
              )
          );


          nextHorseChange =
            time +
            8;

        }


        slots.forEach(
          slot => {

            if (
              time >= slot.nextChange
            ) {

              morphSlot(
                slot,
                intensity,
                time
              );

            }

          }
        );


        if (
          time >= nextHorseChange
        ) {

          applyHorseColor(
            nextHorseColor(
              time
            ),
            intensity,
            time
          );

        }

      }


      if (
        time >= NORMAL_TIME &&
        !normalState
      ) {

        normalState =
          true;


        clearSlots();


        normalHorse();


        stage.classList.add(
          "is-normal"
        );

      }


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    async function openWip() {

      if (
        overlayOpen
      ) {

        return;

      }


      overlayOpen =
        true;

      collageStarted =
        false;

      horseStarted =
        false;

      normalState =
        false;

      recentTextures =
        [];

      lastHorseColorName =
        "";


      clearSlots();


      normalHorse();


      stage.classList.remove(
        "is-normal"
      );


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      prepareTextures();


      if (
        window.fujiAudio
      ) {

        window.fujiAudio
          .setOverlayMuted(
            true
          );

      }


      pageShell.classList.add(
        "is-hidden"
      );


      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.currentTime =
        0;


      audio.volume =
        .72;


      try {

        await audio.play();

      }

      catch {}


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    function closeWip() {

      overlayOpen =
        false;


      cancelAnimationFrame(
        raf
      );


      audio.pause();


      audio.currentTime =
        0;


      clearSlots();


      normalHorse();


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      pageShell.classList.remove(
        "is-hidden"
      );


      if (
        window.fujiAudio
      ) {

        window.fujiAudio
          .setOverlayMuted(
            false
          );

      }

    }


    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );


        if (
          !link
        ) {

          return;

        }


        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>
