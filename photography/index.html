            id="fuji-base"

          <div class="fuji-lines" id="fuji-lines" aria-hidden="true">
            <div class="fuji-line" data-line="1" data-mask="assets/line1.png"></div>
            <div class="fuji-line" data-line="2" data-mask="assets/line2.png"></div>
            <div class="fuji-line" data-line="3" data-mask="assets/line3.png"></div>
            <div class="fuji-line" data-line="4" data-mask="assets/line4.png"></div>
            <div class="fuji-line" data-line="5" data-mask="assets/line5.png"></div>
            <div class="fuji-line" data-line="6" data-mask="assets/line6.png"></div>
            <div class="fuji-line" data-line="7" data-mask="assets/line7.png"></div>
            <div class="fuji-line" data-line="8" data-mask="assets/line8.png"></div>
            <div class="fuji-line" data-line="9" data-mask="assets/line9.png"></div>
            <div class="fuji-line" data-line="10" data-mask="assets/line10.png"></div>
            <div class="fuji-line" data-line="11" data-mask="assets/line11.png"></div>
            <div class="fuji-line" data-line="12" data-mask="assets/line12.png"></div>
            <div class="fuji-line" data-line="13" data-mask="assets/line13.png"></div>
          </div>

          <svg class="fuji-filter-defs" width="0" height="0" aria-hidden="true">
            <defs>
              <filter id="fuji-posterize-3" color-interpolation-filters="sRGB">
                <feComponentTransfer>
                  <feFuncR type="discrete" tableValues="0 .5 1" />
                  <feFuncG type="discrete" tableValues="0 .5 1" />
                  <feFuncB type="discrete" tableValues="0 .5 1" />

              <filter id="fuji-posterize-4" color-interpolation-filters="sRGB">
                <feComponentTransfer>
                  <feFuncR type="discrete" tableValues="0 .33 .66 1" />
                  <feFuncG type="discrete" tableValues="0 .33 .66 1" />
                  <feFuncB type="discrete" tableValues="0 .33 .66 1" />
                  <feFuncA type="identity" />
                </feComponentTransfer>
              </filter>

              <filter id="fuji-posterize-6" color-interpolation-filters="sRGB">
                <feComponentTransfer>
                  <feFuncR type="discrete" tableValues="0 .2 .4 .6 .8 1" />
                  <feFuncG type="discrete" tableValues="0 .2 .4 .6 .8 1" />
                  <feFuncB type="discrete" tableValues="0 .2 .4 .6 .8 1" />
                  <feFuncA type="identity" />
                </feComponentTransfer>
              </filter>

              <filter id="fuji-threshold-low" color-interpolation-filters="sRGB">
                <feComponentTransfer>
                  <feFuncR type="discrete" tableValues="0 1 1 1 1 1 1 1" />
                  <feFuncG type="discrete" tableValues="0 1 1 1 1 1 1 1" />
                  <feFuncB type="discrete" tableValues="0 1 1 1 1 1 1 1" />
                  <feFuncA type="identity" />
                </feComponentTransfer>
              </filter>

              <filter id="fuji-threshold-mid" color-interpolation-filters="sRGB">
                <feComponentTransfer>
                  <feFuncR type="discrete" tableValues="0 0 0 0 1 1 1 1" />
                  <feFuncG type="discrete" tableValues="0 0 0 0 1 1 1 1" />
                  <feFuncB type="discrete" tableValues="0 0 0 0 1 1 1 1" />
                  <feFuncA type="identity" />
                </feComponentTransfer>
              </filter>

              <filter id="fuji-threshold-high" color-interpolation-filters="sRGB">
                <feComponentTransfer>
                  <feFuncR type="discrete" tableValues="0 0 0 0 0 0 1 1" />
                  <feFuncG type="discrete" tableValues="0 0 0 0 0 0 1 1" />
                  <feFuncB type="discrete" tableValues="0 0 0 0 0 0 1 1" />
                  <feFuncA type="identity" />

  <script>
    (() => {
      const title = document.getElementById("photo-title");
      const titleColors = ["#c1272d", "#006a44", "#fdb913"];
      let titleIndex = 0;

      setInterval(() => {
        title.classList.add("is-fading");
        setTimeout(() => {
          titleIndex = (titleIndex + 1) % titleColors.length;
          title.style.color = titleColors[titleIndex];
          title.classList.remove("is-fading");
        }, 200);
      }, 2200);
    })();
  </script>

  <script>
    (() => {
      const artwork = document.getElementById("fuji-interactive");
      const base = document.getElementById("fuji-base");
      const buildingLayers = Array.from(document.querySelectorAll(".fuji-building"));
      const lineEls = Array.from(document.querySelectorAll(".fuji-line"));

      const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      const TEXTURES = [
        "../assets/home/Texturelabs_Grunge_173S.jpg",
        "../assets/home/Texturelabs_Grunge_279L.jpg",
        "../assets/home/Texturelabs_Grunge_334S.jpg",
        "../assets/home/Texturelabs_Grunge_341S.jpg",
        "../assets/home/Texturelabs_InkPaint_126S.jpg",
        "../assets/home/Texturelabs_InkPaint_320S.jpg",
        "../assets/home/Texturelabs_InkPaint_332S.jpg",
        "../assets/home/Texturelabs_InkPaint_356S.jpg",
        "../assets/home/Texturelabs_Concrete_150S.jpg",
        "../assets/home/Texturelabs_Concrete_155S.jpg",
        "../assets/home/Texturelabs_Concrete_179S.jpg",
        "../assets/home/Texturelabs_Concrete_205S.jpg",
        "../assets/home/Texturelabs_Concrete_207S.jpg",
        "../assets/home/Texturelabs_Film_181S.jpg",
        "../assets/home/Texturelabs_Film_183S.jpg",
        "../assets/home/Texturelabs_Film_187S.jpg",
        "../assets/home/Texturelabs_Metal_129S.jpg",
        "../assets/home/Texturelabs_Metal_165S.jpg",
        "../assets/home/Texturelabs_Paper_280S.jpg",
        "../assets/home/Texturelabs_Paper_286S.jpg",
        "../assets/home/Texturelabs_Wood_135S.jpg"
      ];

      const LINE_COLORS = [
        ["#ff335f", "#ff8c42"],
        ["#00d8ff", "#4f86ff"],
        ["#ff3dc8", "#8d4bff"],
        ["#00ffb3", "#7fff4a"],
        ["#ffd400", "#ff5b2e"],
        ["#ff4d6d", "#00d8ff"],
        ["#00ffcc", "#ff00a8"],
        ["#81ff3b", "#3b9bff"]
      ];

      const BUILDING_TINTS = [
        { hue: 190, sat: 1.45, bright: 1.15, contrast: 1.25 },
        { hue: 170, sat: 1.35, bright: 1.10, contrast: 1.30 },
        { hue: 220, sat: 1.55, bright: 1.10, contrast: 1.28 },
        { hue: 320, sat: 1.30, bright: 1.06, contrast: 1.22 },
        { hue: 35,  sat: 1.20, bright: 1.05, contrast: 1.18 }
      ];

      const POSTERIZE = [
        "#fuji-posterize-3",
        "#fuji-posterize-4",
        "#fuji-posterize-6"
      ];

      const THRESHOLD = [
        "#fuji-threshold-low",
        "#fuji-threshold-mid",
        "#fuji-threshold-high"
      ];

      const clamp = (v, min, max) => Math.min(Math.max(v, min), max);
      const random = (min, max) => min + Math.random() * (max - min);
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function weightedPick(entries) {
        const total = entries.reduce((sum, item) => sum + item.weight, 0);
        let r = Math.random() * total;
        for (const item of entries) {
          r -= item.weight;
          if (r <= 0) return item.value;
        }
        return entries[entries.length - 1].value;
      }

      function wait(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function waitForImage(img) {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve(img);
        return new Promise((resolve, reject) => {
          img.addEventListener("load", () => resolve(img), { once: true });
          img.addEventListener("error", reject, { once: true });
        });
      }

      const lineAssets = lineEls.map((el) => {
        const img = new Image();
        img.src = el.dataset.mask;
        return { el, img, src: el.dataset.mask };
      });

      let validLines = [];
      let buildingValid = true;
      let buildingCenter = { x: 0.58, y: 0.53 };

      async function validateAssets() {
        await Promise.all([
          waitForImage(base),
          ...buildingLayers.map(waitForImage),
          ...lineAssets.map((item) => waitForImage(item.img))
        ]);

        const width = base.naturalWidth;
        const height = base.naturalHeight;

        validLines = [];

        lineAssets.forEach((item) => {
          if (item.img.naturalWidth === width && item.img.naturalHeight === height) {
            item.el.style.setProperty("--line-mask", `url("${item.src}")`);
            validLines.push(item.el);
          } else {
            item.el.style.display = "none";
            console.warn(`${item.src} does not match the base canvas. I am not guessing its position.`);
          }
        });

        buildingValid = buildingLayers.every(
          (img) => img.naturalWidth === width && img.naturalHeight === height
        );

        if (!buildingValid) {
          buildingLayers.forEach((img) => {
            img.style.display = "none";
          });
          console.warn("building.png does not match the base canvas. I am not guessing its position.");
        }

        findBuildingCenter();
        if (reducedMotion.matches) {
          setReducedMotionState();
        } else {
          setRestState(true);
        }
      }

      function findBuildingCenter() {
        if (!buildingValid) return;

        try {
          const sample = buildingLayers[0];
          const canvas = document.createElement("canvas");
          const w = 240;
          const h = Math.round(w * (sample.naturalHeight / sample.naturalWidth));
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(sample, 0, 0, w, h);
          const data = ctx.getImageData(0, 0, w, h).data;

          let minX = w;
          let minY = h;
          let maxX = 0;
          let maxY = 0;
          let found = false;

          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const alpha = data[(y * w + x) * 4 + 3];
              if (alpha > 18) {
                found = true;
                minX = Math.min(minX, x);
                minY = Math.min(minY, y);
                maxX = Math.max(maxX, x);
                maxY = Math.max(maxY, y);
              }
            }
          }

          if (found) {
            buildingCenter = {
              x: ((minX + maxX) / 2) / w,
              y: ((minY + maxY) / 2) / h
            };
          }
        } catch (err) {}
      }

      function chooseLineState(energy, strong = false) {
        return weightedPick([
          { value: "normal", weight: 22 },
          { value: "exposed", weight: 22 },
          { value: "posterized", weight: 18 + energy * 6 },
          { value: "threshold", weight: 7 + energy * 10 + (strong ? 8 : 0) },
          { value: "bleached", weight: 10 },
          { value: "hard", weight: 11 + energy * 5 },
          { value: "invert", weight: 3 + (strong ? 6 : 0) }
        ]);
      }

      function chooseLineBlend(energy, strong = false) {
        return weightedPick([
          { value: "screen", weight: 18 },
          { value: "overlay", weight: 16 },
          { value: "hard-light", weight: 15 },
          { value: "color-dodge", weight: 8 + energy * 4 },
          { value: "difference", weight: 6 + energy * 5 + (strong ? 6 : 0) },
          { value: "exclusion", weight: 8 + energy * 4 },
          { value: "multiply", weight: 10 },
          { value: "lighten", weight: 10 },
          { value: "normal", weight: 9 }
        ]);
      }

      function chooseBuildingBlend(energy, strong = false) {
        return weightedPick([
          { value: "screen", weight: 18 },
          { value: "hard-light", weight: 17 },
          { value: "overlay", weight: 14 },
          { value: "lighten", weight: 10 },
          { value: "difference", weight: 8 + energy * 6 + (strong ? 8 : 0) },
          { value: "exclusion", weight: 9 + energy * 5 },
          { value: "color-dodge", weight: 8 + energy * 6 },
          { value: "color-burn", weight: 4 + energy * 3 },
          { value: "plus-lighter", weight: 4 + energy * 3 }
        ]);
      }

      function lineFilterFor(state, energy) {
        if (state === "normal") {
          return `brightness(${random(0.98, 1.18)}) contrast(${random(1.0, 1.25)}) saturate(${random(1.05, 1.35)})`;
        }

        if (state === "exposed") {
          return `brightness(${random(1.15, 1.75 + energy * 0.4)}) contrast(${random(1.05, 1.45)}) saturate(${random(1.1, 1.55)})`;
        }

        if (state === "posterized") {
          return `url("${pick(POSTERIZE)}") brightness(${random(1.0, 1.35)}) contrast(${random(1.1, 1.55)}) saturate(${random(1.05, 1.45)})`;
        }

        if (state === "threshold") {
          return `url("${pick(THRESHOLD)}") brightness(${random(0.95, 1.15)}) contrast(${random(1.05, 1.35)})`;
        }

        if (state === "bleached") {
          return `brightness(${random(1.25, 1.75)}) contrast(${random(0.95, 1.2)}) saturate(${random(0.5, 0.95)})`;
        }

        if (state === "hard") {
          return `brightness(${random(0.85, 1.10)}) contrast(${random(1.55, 2.2)}) saturate(${random(1.1, 1.7)})`;
        }

        return `invert(1) brightness(${random(0.9, 1.2)}) contrast(${random(1.2, 1.55)}) saturate(${random(1.0, 1.4)})`;
      }

      function configureLine(el, energy, strong = false) {
        const [c1, c2] = pick(LINE_COLORS);
        const t1 = pick(TEXTURES);
        const t2 = pick(TEXTURES);
        const state = chooseLineState(energy, strong);
        const blend = chooseLineBlend(energy, strong);

        const angle1 = random(0, 180).toFixed(1);
        const angle2 = random(0, 180).toFixed(1);

        el.style.mixBlendMode = blend;
        el.style.filter = lineFilterFor(state, energy);
        el.style.backgroundImage = `
          linear-gradient(${angle1}deg, ${c1} 0%, ${c2} 100%),
          linear-gradient(${angle2}deg, rgba(255,255,255,.28) 0%, rgba(0,0,0,.22) 100%),
          url("${t1}"),
          url("${t2}")
        `;
        el.style.backgroundBlendMode = `${pick(["normal","screen","overlay","hard-light"])}, ${pick(["overlay","soft-light","multiply"])}, ${pick(["multiply","screen","overlay","soft-light"])}, normal`;
        el.style.backgroundSize = `${random(120, 190)}% ${random(120, 190)}%, 100% 100%, cover, cover`;
        el.style.backgroundPosition = `${random(0, 100)}% ${random(0, 100)}%, center, ${random(0, 100)}% ${random(0, 100)}%, ${random(0, 100)}% ${random(0, 100)}%`;
        el.style.transform = `translate(${random(-2.6, 2.6)}px, ${random(-2.6, 2.6)}px) rotate(${random(-0.6, 0.6)}deg)`;
        el.dataset.targetOpacity = clamp(random(0.22, 0.72 + energy * 0.2), 0.14, 0.92).toFixed(3);
      }

      function configureBuildingLayer(layer, energy, strong = false) {
        const tint = pick(BUILDING_TINTS);
        layer.style.mixBlendMode = chooseBuildingBlend(energy, strong);
        layer.style.filter = `
          sepia(.22)
          saturate(${tint.sat})
          hue-rotate(${tint.hue}deg)
          brightness(${tint.bright + random(-0.05, 0.10)})
          contrast(${tint.contrast + random(-0.06, 0.10)})
        `;
        layer.dataset.restOpacity = random(0.02, 0.08).toFixed(3);
        layer.dataset.peakOpacity = clamp(random(0.16, 0.46 + energy * 0.28), 0.10, 0.74).toFixed(3);
        layer.dataset.dx = random(-3.5, 3.5).toFixed(2);
        layer.dataset.dy = random(-3.5, 3.5).toFixed(2);
      }

      function configureBuildingStack(energy, strong = false) {
        if (!buildingValid) return;
        buildingLayers.forEach((layer) => configureBuildingLayer(layer, energy, strong));
      }

      let pointerInside = false;
      let energy = 0;
      let targetEnergy = 0;
      let speedEnergy = 0;
      let lastPointer = { x: 0, y: 0, time: 0 };

      let active = false;
      let reconstructionToken = 0;
      let mutationTimer = null;
      let settleToken = 0;
      let lastBurst = 0;

      function updatePointerEnergy(event) {
        const rect = artwork.getBoundingClientRect();
        const x = clamp((event.clientX - rect.left) / rect.width, 0, 1);
        const y = clamp((event.clientY - rect.top) / rect.height, 0, 1);

        const dx = x - buildingCenter.x;
        const dy = y - buildingCenter.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const proximity = 1 - clamp(distance / 0.62, 0, 1);

        const now = performance.now();

        if (lastPointer.time > 0) {
          const pixelDX = event.clientX - lastPointer.x;
          const pixelDY = event.clientY - lastPointer.y;
          const elapsed = Math.max(16, now - lastPointer.time);
          const speed = Math.sqrt(pixelDX * pixelDX + pixelDY * pixelDY) / elapsed;
          speedEnergy = clamp(speed / 1.4, 0, 1);
        }

        lastPointer = {
          x: event.clientX,
          y: event.clientY,
          time: now
        };

        targetEnergy = clamp(0.14 + proximity * 0.76 + speedEnergy * 0.28, 0, 1);

        if (
          speedEnergy > 0.72 &&
          now - lastBurst > 550 &&
          active &&
          !reducedMotion.matches
        ) {
          lastBurst = now;
          shuffle(validLines).slice(0, Math.random() < 0.25 ? 2 : 1).forEach((line) => {
            mutateLine(line, true);
          });
          if (buildingValid) {
            configureBuildingStack(targetEnergy, true);
          }
        }
      }

      function renderEnergy() {
        const smoothing = pointerInside ? 0.11 : 0.05;
        energy += (targetEnergy - energy) * smoothing;
        speedEnergy *= 0.92;

        base.style.filter = `
          brightness(${1 + energy * 0.02})
          contrast(${1 + energy * 0.03})
          saturate(${1 - energy * 0.02})
        `;

        if (buildingValid) {
          buildingLayers.forEach((layer, index) => {
            const rest = parseFloat(layer.dataset.restOpacity || 0);
            const peak = parseFloat(layer.dataset.peakOpacity || 0.2);
            const dx = parseFloat(layer.dataset.dx || 0);
            const dy = parseFloat(layer.dataset.dy || 0);
            const opacity = rest + (peak - rest) * clamp(0.18 + energy * 0.92, 0, 1);

            layer.style.opacity = opacity.toFixed(3);
            layer.style.transform = `translate(${dx * (0.25 + energy)}px, ${dy * (0.25 + energy)}px)`;
          });
        }

        requestAnimationFrame(renderEnergy);
      }

      function scheduleMutation() {
        clearTimeout(mutationTimer);
        if (!active || !pointerInside || reducedMotion.matches) return;

        const delay = random(420, 1100 - energy * 260);

        mutationTimer = setTimeout(() => {
          if (!active || !pointerInside) return;

          const roll = Math.random();
          const count = roll < 0.68 ? 1 : (roll < 0.94 ? 2 : 3);
          shuffle(validLines).slice(0, count).forEach((line) => mutateLine(line, false));

          if (buildingValid && Math.random() < 0.48) {
            const layer = pick(buildingLayers);
            configureBuildingLayer(layer, energy, Math.random() < 0.18);
          }

          scheduleMutation();
        }, delay);
      }

      function mutateLine(line, strong = false) {
        const dip = random(100, 220);
        line.style.transitionDuration = `${dip}ms`;
        line.style.opacity = "0.06";

        setTimeout(() => {
          if (!active) return;
          configureLine(line, energy, strong);
          line.style.transitionDuration = `${random(220, 620)}ms`;
          line.style.opacity = line.dataset.targetOpacity;
        }, dip * 0.72);
      }

      async function reconstruct(startMutation = true) {
        if (!validLines.length) return;

        active = true;
        settleToken++;
        const token = ++reconstructionToken;
        clearTimeout(mutationTimer);

        configureBuildingStack(energy, false);

        validLines.forEach((line) => {
          line.style.transitionDuration = "260ms";
          line.style.opacity = "0";
        });

        await wait(220);
        if (token !== reconstructionToken) return;

        const order = shuffle(validLines);

        for (const line of order) {
          if (token !== reconstructionToken) return;

          configureLine(line, energy, false);
          line.style.transitionDuration = `${random(160, 520)}ms`;
          line.style.opacity = line.dataset.targetOpacity;

          let gap = random(50, 240);
          if (Math.random() < 0.16) gap += random(120, 260);
          await wait(gap);
        }

        if (startMutation && finePointer.matches && pointerInside && !reducedMotion.matches) {
          scheduleMutation();
        }
      }

      function setRestState(instant = false) {
        active = false;
        targetEnergy = 0;
        clearTimeout(mutationTimer);
        reconstructionToken++;

        configureBuildingStack(0.06, false);

        const visible = shuffle(validLines).slice(0, Math.min(3, validLines.length));

        validLines.forEach((line) => {
          const keep = visible.includes(line);
          line.style.transitionDuration = instant ? "0ms" : `${random(600, 1200)}ms`;

          if (keep) {
            configureLine(line, 0.06, false);
            line.style.opacity = random(0.03, 0.09);
          } else {
            line.style.opacity = "0";
          }
        });
      }

      function settleAfterLeave() {
        const token = ++settleToken;
        active = false;
        reconstructionToken++;
        clearTimeout(mutationTimer);
        targetEnergy = 0;

        const order = shuffle(validLines);

        order.forEach((line, index) => {
          const delay = random(0, 900) + index * random(10, 50);
          setTimeout(() => {
            if (token !== settleToken) return;
            line.style.transitionDuration = `${random(480, 1100)}ms`;
            line.style.opacity = "0";
          }, delay);
        });

        setTimeout(() => {
          if (token !== settleToken) return;
          setRestState(false);
        }, 1700);

        if (buildingValid) {
          setTimeout(() => configureBuildingStack(0.02, false), 350);
        }
      }

      function setReducedMotionState() {
        active = false;
        targetEnergy = 0;
        clearTimeout(mutationTimer);

        configureBuildingStack(0.05, false);

        validLines.forEach((line) => {
          line.style.opacity = "0";
          line.style.filter = "none";
        });

        shuffle(validLines).slice(0, Math.min(4, validLines.length)).forEach((line) => {
          configureLine(line, 0.08, false);
          line.style.opacity = random(0.06, 0.12);
        });
      }

      artwork.addEventListener("pointerenter", (event) => {
        if (!finePointer.matches || reducedMotion.matches) return;
        pointerInside = true;
        updatePointerEnergy(event);
        reconstruct(true);
      });

      artwork.addEventListener("pointermove", (event) => {
        if (!finePointer.matches || reducedMotion.matches) return;
        updatePointerEnergy(event);
      });

      artwork.addEventListener("pointerleave", () => {
        if (!finePointer.matches || reducedMotion.matches) return;
        pointerInside = false;
        lastPointer.time = 0;
        settleAfterLeave();
      });

      artwork.addEventListener("click", (event) => {
        if (finePointer.matches || reducedMotion.matches) return;
        event.preventDefault();
        targetEnergy = 0.6;
        reconstruct(false);
        setTimeout(() => {
          targetEnergy = 0.12;
        }, 1600);
      });

      artwork.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();

        if (reducedMotion.matches) {
          setReducedMotionState();
          return;
        }

        targetEnergy = 0.58;
        reconstruct(false);
        setTimeout(() => {
          targetEnergy = 0.12;
        }, 1600);
      });

      reducedMotion.addEventListener("change", () => {
        if (reducedMotion.matches) {
          setReducedMotionState();
        } else {
          setRestState(false);
        }
      });

      validateAssets().then(() => {
        requestAnimationFrame(renderEnergy);
      });
    })();
  </script>

  <script>
    (() => {
      const overlay = document.getElementById("wip-overlay");
      const closeBtn = document.getElementById("wip-close");
      const audio = document.getElementById("wip-audio");

      document.addEventListener("click", async (event) => {
        const link = event.target.closest("a");
        if (!link) return;
        if (link.hasAttribute("data-live-link")) return;
        event.preventDefault();

        overlay.classList.add("is-visible");
        overlay.setAttribute("aria-hidden", "false");

        try {
          audio.currentTime = 0;
          await audio.play();
        } catch (err) {}
      });

      closeBtn.addEventListener("click", () => {
        overlay.classList.remove("is-visible");
        overlay.setAttribute("aria-hidden", "true");
        audio.pause();
        audio.currentTime = 0;
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && overlay.classList.contains("is-visible")) {
          overlay.classList.remove("is-visible");
          overlay.setAttribute("aria-hidden", "true");
          audio.pause();
          audio.currentTime = 0;
        }
      });
    })();
  </script>
</body>
</html>
