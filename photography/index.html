  <script>
  (() => {

    const title =
      document.getElementById(
        "photo-title"
      );


    const colors = [
      "#c1272d",
      "#006a44",
      "#fdb913"
    ];


    let current = 0;


    function changeTitle() {

      let next;


      do {

        next =
          Math.floor(
            Math.random() *
            colors.length
          );

      }
      while (
        next === current
      );


      title.classList.add(
        "is-fading"
      );


      setTimeout(
        () => {

          current = next;

          title.style.color =
            colors[current];

          title.classList.remove(
            "is-fading"
          );

        },
        200
      );

    }


    title.style.color =
      colors[current];


    setInterval(
      changeTitle,
      2300
    );

  })();
  </script>

  <script>
  (() => {

    /* =====================================================
       ENVIRONMENT
       ===================================================== */

    const WIDTH_MOBILE =
      window.matchMedia(
        "(max-width: 700px)"
      );


    const COARSE_POINTER =
      window.matchMedia(
        "(pointer: coarse)"
      );


    const NO_HOVER =
      window.matchMedia(
        "(hover: none)"
      );


    const REDUCED_MOTION =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );


    function isMobileMode() {

      return (
        WIDTH_MOBILE.matches ||
        COARSE_POINTER.matches
      );

    }


    function isTouchLanguage() {

      return (
        COARSE_POINTER.matches ||
        NO_HOVER.matches ||
        "ontouchstart" in window
      );

    }


    const WORDS = {

      here:
        () =>
          isTouchLanguage()
            ? "tap here"
            : "click here",

      again:
        () =>
          isTouchLanguage()
            ? "tap again!"
            : "click again!",

      keep:
        () =>
          isTouchLanguage()
            ? "keep tapping!"
            : "keep clicking!",

      off:
        () =>
          isTouchLanguage()
            ? "tap to turn off"
            : "click to turn off",

      on:
        () =>
          isTouchLanguage()
            ? "tap to turn on"
            : "click to turn on"

    };


    /* =====================================================
       DOM
       ===================================================== */

    const artwork =
      document.getElementById(
        "fuji-interactive"
      );


    const base =
      document.getElementById(
        "fuji-base"
      );


    const prompt =
      document.getElementById(
        "fuji-click-prompt"
      );


    const controls =
      document.getElementById(
        "fuji-controls"
      );


    const soundToggle =
      document.getElementById(
        "fuji-sound-toggle"
      );


    const autoButton =
      document.getElementById(
        "fuji-auto-song"
      );


    const splashLayer =
      document.getElementById(
        "fuji-splash-layer"
      );


    const droneElement =
      document.getElementById(
        "fuji-drone"
      );


    const buildingElements =
      Array.from(
        document.querySelectorAll(
          ".fuji-building"
        )
      );


    const allLines =
      Array.from(
        document.querySelectorAll(
          ".fuji-line-layer"
        )
      ).map(
        layer => ({

          layer,

          source:
            layer.querySelector(
              ".fuji-line-source"
            ),

          texture:
            layer.querySelector(
              ".fuji-line-texture"
            ),

          visible: false

        })
      );


    let activeBuildings =
      [];


    let validLines =
      [];


    /* =====================================================
       HELPERS
       ===================================================== */

    const clamp =
      (
        value,
        min,
        max
      ) =>
        Math.min(
          Math.max(
            value,
            min
          ),
          max
        );


    const random =
      (
        min,
        max
      ) =>
        min +
        Math.random() *
        (
          max -
          min
        );


    const randomInt =
      (
        min,
        max
      ) =>
        Math.floor(
          random(
            min,
            max + 1
          )
        );


    const pick =
      array =>
        array[
          Math.floor(
            Math.random() *
            array.length
          )
        ];


    function shuffle(
      array
    ) {

      const copy =
        [...array];


      for (
        let i =
          copy.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (
              i + 1
            )
          );


        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }


      return copy;

    }


    function weightedObject(
      items
    ) {

      const valid =
        items.filter(
          item =>
            item.weight > 0
        );


      if (
        !valid.length
      ) {

        return null;

      }


      const total =
        valid.reduce(
          (
            sum,
            item
          ) =>
            sum +
            item.weight,
          0
        );


      let value =
        Math.random() *
        total;


      for (
        const item of valid
      ) {

        value -=
          item.weight;


        if (
          value <= 0
        ) {

          return item;

        }

      }


      return valid[
        valid.length - 1
      ];

    }


    function weightedPick(
      items
    ) {

      const result =
        weightedObject(
          items
        );


      return result
        ? result.value
        : null;

    }


    function waitForImage(
      image
    ) {

      if (
        image.complete &&
        image.naturalWidth > 0
      ) {

        return Promise.resolve(
          image
        );

      }


      return new Promise(
        (
          resolve,
          reject
        ) => {

          image.addEventListener(
            "load",
            () =>
              resolve(
                image
              ),
            {
              once: true
            }
          );


          image.addEventListener(
            "error",
            reject,
            {
              once: true
            }
          );

        }
      );

    }


    async function hydrateImage(
      image
    ) {

      if (
        !image.getAttribute(
          "src"
        )
      ) {

        image.src =
          image.dataset.src;

      }


      await waitForImage(
        image
      );


      return image;

    }


    /* =====================================================
       TRUE DEFERRED IMAGE LOADING
       ===================================================== */

    async function revealBase() {

      try {

        await waitForImage(
          base
        );

      }

      catch {}


      requestAnimationFrame(
        () => {

          artwork.classList.add(
            "is-ready"
          );

        }
      );

    }


    function hasUsefulAlpha(
      image
    ) {

      try {

        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          96;


        canvas.height =
          Math.max(
            1,
            Math.round(
              96 *
              image.naturalHeight /
              image.naturalWidth
            )
          );


        const ctx =
          canvas.getContext(
            "2d",
            {
              willReadFrequently:
                true
            }
          );


        ctx.drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );


        const pixels =
          ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
          ).data;


        let translucent =
          0;


        for (
          let i = 3;
          i < pixels.length;
          i += 4
        ) {

          if (
            pixels[i] < 235
          ) {

            translucent++;

          }

        }


        return (
          translucent /
          (
            canvas.width *
            canvas.height
          )
        ) > .025;

      }

      catch {

        return false;

      }

    }


    async function prepareOverlayAssets() {

      const mobile =
        isMobileMode();


      /*
        MOBILE MEMORY BUDGET

        Desktop:
          13 line PNGs
          4 building plates

        Mobile:
          6 line PNGs
          2 building plates

        The unused <img> elements never receive a src,
        therefore those large PNGs are never decoded.
      */

      activeBuildings =
        buildingElements.slice(
          0,
          mobile
            ? 2
            : 4
        );


      buildingElements
        .slice(
          activeBuildings.length
        )
        .forEach(
          image => {

            image.style.display =
              "none";

          }
        );


      const selectedLines =
        mobile
          ? shuffle(
              allLines
            ).slice(
              0,
              6
            )
          : allLines;


      allLines.forEach(
        item => {

          if (
            !selectedLines.includes(
              item
            )
          ) {

            item.layer.style.display =
              "none";

          }

        }
      );


      await Promise.allSettled(
        activeBuildings.map(
          hydrateImage
        )
      );


      await Promise.allSettled(
        selectedLines.map(
          item =>
            hydrateImage(
              item.source
            )
        )
      );


      const width =
        base.naturalWidth;


      const height =
        base.naturalHeight;


      validLines =
        selectedLines.filter(
          item => {

            if (
              item.source.naturalWidth !==
                width ||
              item.source.naturalHeight !==
                height
            ) {

              item.layer.style.display =
                "none";


              return false;

            }


            if (
              hasUsefulAlpha(
                item.source
              )
            ) {

              item.layer.classList.add(
                "has-alpha"
              );


              item.texture.style.webkitMaskImage =
                `url("${item.source.src}")`;


              item.texture.style.maskImage =
                `url("${item.source.src}")`;

            }

            else {

              item.layer.classList.add(
                "has-white-canvas"
              );

            }


            return true;

          }
        );


      resetVisuals(
        true
      );

    }


    /* =====================================================
       TUTORIAL
       ===================================================== */

    const tutorial = {

      step: 0,

      promptTimer: null,

      volumeTimer: null,

      hideVolumeTimer: null,

      nextTimer: null,

      controlsTimer: null

    };


    function clearTutorialTimers() {

      clearTimeout(
        tutorial.promptTimer

      clearTimeout(
        tutorial.volumeTimer

      clearTimeout(
        tutorial.hideVolumeTimer
      );

      clearTimeout(
        tutorial.nextTimer

      clearTimeout(
        tutorial.controlsTimer

    function showPrompt(

    /* =====================================================

    function lineFilter(
      intensity,
      palette
    ) {

      /*
        The SVG posterize/threshold filters are significantly
        heavier on a full-size transparent PNG.

        They remain possible on desktop.

        Mobile uses the simpler CSS processing path.
      */

      const processing =
        isMobileMode()
          ? weightedPick([

              {
                value: "normal",
                weight: 48
              },

              {
                value: "exposed",
                weight: 31
              },

              {
                value: "hard",
                weight: 16
              },

              {
                value: "posterized",
                weight: 5
              }

            ])
          : weightedPick([

              {
                value: "normal",
                weight: 34
              },

              {
                value: "exposed",
                weight: 28
              },

              {
                value: "posterized",
                weight: 17
              },

              {
                value: "threshold",
                weight:
                  4 +
                  intensity *
                  10
              },

              {
                value: "hard",
                weight:
                  10 +
                  intensity *
                  5
              }

            ]);


      const hue =
        palette.hue +
        random(
          -6,
          6
        );


      if (
        processing === "posterized" &&
        !isMobileMode()
      ) {

        return `
          grayscale(.14)
          sepia(.36)
          url("${pick(POSTERIZE)}")
          hue-rotate(${hue}deg)
          saturate(${random(
            palette.saturation[0],
            palette.saturation[1]
          )})
          contrast(${random(1.08, 1.38)})
        `;

      }


      if (
        processing === "threshold" &&
        !isMobileMode()
      ) {

        return `
          grayscale(.20)
          sepia(.40)
          url("${pick(THRESHOLD)}")
          hue-rotate(${hue}deg)
          saturate(${random(
            palette.saturation[0],
            palette.saturation[1]
          )})
        `;

      }


      if (
        processing === "hard"
      ) {

        return `
          grayscale(.10)
          sepia(.32)
          hue-rotate(${hue}deg)
          saturate(${random(
            palette.saturation[0],
            palette.saturation[1] + .10
          )})
          brightness(${random(.88, 1.04)})
          contrast(${random(
            isMobileMode()
              ? 1.18
              : 1.26,
            isMobileMode()
              ? 1.43
              : 1.62
          )})
        `;

      }


      if (
        processing === "exposed"
      ) {

        return `
          grayscale(.09)
          sepia(.28)
          hue-rotate(${hue}deg)
          saturate(${random(
            palette.saturation[0],
            palette.saturation[1]
          )})
          brightness(${random(
            1,
            1.14 +
            intensity *
            .08
          )})
          contrast(${random(1.04, 1.25)})
        `;

      }


      /*
        Mobile posterization becomes a lighter-weight
        high-contrast approximation.
      */

      if (
        processing === "posterized"
      ) {

        return `
          grayscale(.13)
          sepia(.34)
          hue-rotate(${hue}deg)
          saturate(${random(
            palette.saturation[0],
            palette.saturation[1]
          )})
          brightness(${random(.94, 1.06)})
          contrast(${random(1.34, 1.52)})
        `;

      }


      return `
        grayscale(.08)
        sepia(.28)
        hue-rotate(${hue}deg)
        saturate(${random(
          palette.saturation[0],
          palette.saturation[1]
        )})
        brightness(${random(
          palette.brightness[0],
          palette.brightness[1]
        )})
        contrast(${random(1.02, 1.18)})
      `;

    }


    function configureLine(
      item,
      intensity
    ) {

      const palette =
        pick(
          LINE_PALETTES
        );


      const [
        colorA,
        colorB
      ] =
        palette.colors;


      const texture =
        pick(
          activeTexturePool()
        );


      item.source.style.mixBlendMode =
        weightedPick([

          {
            value: "soft-light",
            weight: 26
          },

          {
            value: "overlay",
            weight: 23
          },

          {
            value: "multiply",
            weight: 22
          },

          {
            value: "screen",
            weight: 13
          },

          {
            value: "hard-light",
            weight:
              isMobileMode()
                ? 5
                : 11
          },

          {
            value: "color-burn",
            weight:
              isMobileMode()
                ? 0
                : 4 +
                  intensity *
                  4
          }

        ]);


      item.source.style.filter =
        lineFilter(
          intensity,
          palette
        );


      item.source.style.opacity =
        random(
          .34,
          .78
        );


      if (
        item.layer.classList.contains(
          "has-alpha"
        )

        item.texture.style.backgroundImage =

        item.texture.style.backgroundSize =
          `
            100% 100%,
            cover
          `;


        item.texture.style.backgroundPosition =
          `
            center,
            center
          `;


        item.texture.style.backgroundBlendMode =
          `
            normal,
            multiply
          `;

      }

      else {

        item.texture.style.backgroundImage =
          `
            url("${item.source.src}"),
            linear-gradient(
              ${random(0, 360)}deg,
              ${colorA},
              ${colorB}
            ),
            url("${texture}")
          `;


        item.texture.style.backgroundSize =
          `
            100% 100%,
            100% 100%,
            cover
          `;


        item.texture.style.backgroundPosition =
          `
            center,
            center,
            center
          `;


        item.texture.style.backgroundBlendMode =
          `
            multiply,
            screen,
            overlay
          `;

      }


      item.texture.style.mixBlendMode =
        weightedPick([

          {
            value: "soft-light",
            weight: 32
          },

          {
            value: "overlay",
            weight: 26
          },

          {
            value: "multiply",
            weight: 22
          },

          {
            value: "screen",
            weight: 12
          },

          {
            value: "hard-light",
            weight:
              isMobileMode()
                ? 2
                : 8
          }

        ]);


      item.texture.style.filter =
        `
          grayscale(${random(.03, .12)})
          contrast(${random(
            1.05,
            isMobileMode()
              ? 1.24
              : 1.36
          )})
          saturate(${random(.86, 1.10)})
        `;


      item.texture.style.opacity =
        random(
          .12,
          (
            isMobileMode()
              ? .24
              : .30
          ) +
          intensity *
          (
            isMobileMode()
              ? .10
              : .16
          )
        );


      item.layer.dataset.targetOpacity =
        clamp(
          random(
            .25,
            .52 +
            intensity *
            .27
          ),
          .16,
          .82
        ).toFixed(
          3
        );

    }


    function configureBuilding(

          )})

      building.style.transform =
        `
          translate3d(
            ${random(-.55, .55)}px,
            ${random(-.55, .55)}px,
            0
          )
        `;


      building.dataset.targetOpacity =
        clamp(
          random(
            look.opacity[0],
            look.opacity[1] +
            intensity *
            .06
          ),
          .04,
          .29
        ).toFixed(

    /* =====================================================
       MUSIC-DRIVEN VISUAL STATE
       ===================================================== */

    let visualOrder =
      [];


    let visibleLineCount =
      0;


    let visualSettleTimer =
      null;


    const visualTickTimers =
      new Set();


    function clearVisualTicks() {

      visualTickTimers.forEach(
        timer =>
          clearTimeout(
            timer
          )
      );


      visualTickTimers.clear();

    }


    function resetVisuals(
      immediate = false
    ) {

      clearVisualTicks();


      clearTimeout(
        visualSettleTimer
      );


      visualOrder =
        shuffle(
          validLines
        );


      visibleLineCount =
        0;


      validLines.forEach(
        item => {

          item.visible =
            false;


          item.layer.style.transitionDuration =
            immediate
              ? "0ms"
              : "1050ms";


          item.layer.style.opacity =
            "0";

        }
      );


      activeBuildings.forEach(
        building => {

          building.style.transitionDuration =
            immediate
              ? "0ms"
              : "1150ms";


          building.style.opacity =
            "0";

        }
      );

    }


    function revealMusicLines(
      amount,
      intensity
    ) {

      if (
        !validLines.length
      ) {

        return;

      }


      if (
        !visualOrder.length
      ) {

        visualOrder =
          shuffle(
            validLines
          );

      }


      for (
        let i = 0;
        i < amount;
        i++
      ) {

        if (
          visibleLineCount >=
          visualOrder.length
        ) {

          break;

        }


        const item =
          visualOrder[
            visibleLineCount
          ];


        configureLine(
          item,
          intensity
        );


        item.visible =
          true;


        item.layer.style.transitionDuration =
          `${random(220, 540)}ms`;


        item.layer.style.opacity =
          item.layer.dataset
            .targetOpacity;


        visibleLineCount++;

      }

    }


    function mutateMusicLines(
      amount,
      intensity
    ) {

      const available =
        validLines.filter(
          item =>
            item.visible
        );


      shuffle(
        available
      )
        .slice(
          0,
          Math.min(
            amount,
            available.length
          )
        )
        .forEach(
          item => {

            configureLine(
              item,
              intensity
            );


            item.layer.style.transitionDuration =
              `${random(180, 450)}ms`;


            item.layer.style.opacity =
              item.layer.dataset
                .targetOpacity;

          }
        );

    }


    function wakeBuilding(
      intensity
    ) {

      if (
        !activeBuildings.length
      ) {

        return;

      }


      const maxCount =
        isMobileMode()
          ? 2
          : 3;


      const count =
        clamp(
          intensity < .36
            ? 1
            : intensity < .68
              ? 2
              : 3,
          1,
          maxCount
        );


      const active =
        shuffle(
          activeBuildings
        ).slice(
          0,
          count
        );


      activeBuildings.forEach(
        building => {

          if (
            active.includes(
              building
            )
          ) {

            configureBuilding(
              building,
              intensity
            );


            building.style.transitionDuration =
              `${random(260, 610)}ms`;


            building.style.opacity =
              building.dataset
                .targetOpacity;

          }

          else {

            building.style.opacity =
              "0";

          }

        }
      );

    }


    function scheduleVisualSettle(
      delay
    ) {

      clearTimeout(
        visualSettleTimer
      );


      visualSettleTimer =
        setTimeout(
          () => {

            resetVisuals(
              false
            );

          },
          delay
        );

    }


    function musicalVisualEvent(
      type,
      noteCount,
      durationMs
    ) {

      clearTimeout(
        visualSettleTimer
      );


      if (
        type === "drone"
      ) {

        revealMusicLines(
          1,
          .17
        );


        wakeBuilding(
          .15
        );


        scheduleVisualSettle(
          7200
        );


        return;

      }


      if (
        type === "cloud"
      ) {

        revealMusicLines(
          randomInt(
            2,
            isMobileMode()
              ? 3
              : 4
          ),
          .78
        );


        mutateMusicLines(
          randomInt(
            2,
            isMobileMode()
              ? 3
              : 4
          ),
          .78
        );


        wakeBuilding(
          .76
        );


        scheduleVisualSettle(
          Math.max(
            6200,
            durationMs +
            4200
          )
        );


        return;

      }


      const energy =
        clamp(
          .25 +
          noteCount *
          .07,
          .28,
          .64
        );


      revealMusicLines(
        noteCount >= 4
          ? 2
          : 1,
        energy
      );


      mutateMusicLines(
        noteCount >= 4
          ? 2
          : 1,
        energy
      );


      wakeBuilding(
        energy *
        .72
      );


      scheduleVisualSettle(
        Math.max(
          3900,
          durationMs +
          2300
        )
      );

    }


    function schedulePhraseVisualTicks(
      offsets,
      intensity
    ) {

      offsets
        .slice(
          1
        )
        .forEach(
          offset => {

            const timer =
              setTimeout(
                () => {

                  visualTickTimers.delete(
                    timer
                  );


                  mutateMusicLines(
                    1,
                    intensity
                  );


                  if (
                    Math.random() <
                    .38
                  ) {

                    wakeBuilding(
                      intensity *
                      .64
                    );

                  }

                },
                offset
              );


            visualTickTimers.add(
              timer
            );

          }
        );

    }


    /* =====================================================
       SINGLE EVENT SPLASH
       ===================================================== */

    const SPLASH_COLORS = [
      "#006a44",
      "#fdb913",
      "#c1272d"
    ];


    function artworkPoint(
      event
    ) {

      const rect =
        artwork.getBoundingClientRect();


      return {

        x:
          clamp(
            (
              event.clientX -
              rect.left
            ) /
            rect.width,
            .04,
            .96
          ),

        y:
          clamp(
            (
              event.clientY -
              rect.top
            ) /
            rect.height,
            .04,
            .96
          )

      };

    }


    function randomArtworkPoint() {

      return {

        x:
          random(
            .18,
            .82
          ),

        y:
          random(
            .20,
            .80
          )

      };

    }


    function createSplash(
      type,
      point,
      noteCount = 1
    ) {

      if (
        REDUCED_MOTION.matches
      ) {

        return;

      }


      const splash =
        document.createElement(
          "span"
        );


      splash.className =
        `fuji-splash fuji-splash-${type}`;


      const origin =
        point ||
        randomArtworkPoint();


      const size =
        type === "cloud"
          ? random(15, 21)
          : type === "drone"
            ? random(11, 15)
            : random(6.5, 9) +
              Math.min(
                noteCount,
                5
              ) *
              .55;


      const duration =
        type === "cloud"
          ? random(4.8, 6.2)
          : type === "drone"
            ? random(4.6, 6)
            : random(2.6, 3.8);


      const opacity =
        type === "cloud"
          ? random(.13, .20)
          : type === "drone"
            ? random(.09, .14)
            : random(.12, .18);


      splash.style.setProperty(
        "--x",
        `${origin.x * 100}%`
      );


      splash.style.setProperty(
        "--y",
        `${origin.y * 100}%`
      );


      splash.style.setProperty(
        "--size",
        `${size}%`
      );


      splash.style.setProperty(
        "--splash-color",
        pick(
          SPLASH_COLORS
        )
      );


      splash.style.setProperty(
        "--splash-opacity",
        opacity
      );


      splash.style.setProperty(
        "--splash-duration",
        `${duration}s`
      );


      splash.style.mixBlendMode =
        weightedPick([

          {
            value: "soft-light",
            weight: 46
          },

          {
            value: "overlay",
            weight: 33
          },

          {
            value: "multiply",
            weight: 21
          }

        ]);


      splashLayer.appendChild(
        splash
      );


      /*
        Keep the page from accumulating dozens of animated
        DOM nodes during fast playing.
      */

      while (
        splashLayer.children.length >
        (
          isMobileMode()
            ? 3
            : 5
        )
      ) {

        splashLayer.firstElementChild
          ?.remove();

      }


      setTimeout(

    function ensureContext() {

      if (
        state.context

        return state.context;

      }


      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


      if (
        !AudioContextClass
      ) {

        return null;

      }


      const context =
        new AudioContextClass();


      const bus =
        context.createGain();


      const compressor =
        context.createDynamicsCompressor();


      const master =
        context.createGain();


      compressor.threshold.value =
        -12;


      compressor.knee.value =
        12;


      compressor.ratio.value =
        2.3;


      compressor.attack.value =
        .018;


      compressor.release.value =
        .34;


      master.gain.value =
        AUDIO_CONFIG.masterGain;


      bus.connect(
        compressor
      );


      compressor.connect(
        master
      );


      master.connect(
        context.destination
      );


      /*
        STREAMING DRONE

        MediaElementAudioSourceNode does not require decoding
        six minutes of MP3 into one giant AudioBuffer.

        context.createMediaElementSource(
          droneElement

      state.master.gain

      state.master.gain
        .setValueAtTime(
          Math.max(
            .0001,
            state.master.gain.value

      state.master.gain

          target,

    /* =====================================================

       ===================================================== */

    function rememberBuffer(
      path,
      buffer
    ) {

      if (
        state.buffers.has(
          path
        )
      ) {

        state.buffers.delete(
          path
        );

      }


      state.buffers.set(
        path,
        buffer
      );


      while (
        state.buffers.size >
        MAX_BUFFER_CACHE
      ) {

        const oldest =
          state.buffers
            .keys()
            .next()
            .value;


        state.buffers.delete(
          oldest
        );

      }

    }


    async function loadBuffer(
      path
    ) {

      if (
        state.buffers.has(
          path
        )
      ) {

        const buffer =
          state.buffers.get(
            path
          );


        state.buffers.delete(
          path
        );


        state.buffers.set(
          path,
          buffer
        );


        return buffer;

      }


      if (
        state.loads.has(
          path
        )
      ) {

        return state.loads.get(
          path
        );

      }


      const context =
        ensureContext();


      const promise =
        fetch(
          path
        )
          .then(
            response => {

              if (
                !response.ok
              ) {

                throw new Error(
                  `Failed to load ${path}`
                );

              }


              return response.arrayBuffer();

            }
          )
          .then(
            array =>
              context.decodeAudioData(
                array
              )
          )
          .then(
            buffer => {

              rememberBuffer(
                path,
                buffer
              );


              state.loads.delete(
                path
              );


              return buffer;

            }
          )
          .catch(
            error => {

              state.loads.delete(
                path
              );


              throw error;

            }
          );


      state.loads.set(
        path,
        promise
      );


      return promise;

    }

    /* =====================================================
       HARMONIC DIRECTION
       ===================================================== */

    function harmonySignature(
      harmony
    ) {

      return [...harmony.pitches]
        .sort()
        .join("-");

    }


    function scaleDistance(
      a,
      b
    ) {

      const ai =
        SCALE.indexOf(
          a
        );


      const bi =
        SCALE.indexOf(
          b
        );


      const distance =
        Math.abs(
          ai -
          bi
        );


      return Math.min(
        distance,
        SCALE.length -
        distance
      );

    }


    function sharedPitchCount(
      a,
      b
    ) {

      return a.pitches.filter(
        pitch =>
          b.pitches.includes(
            pitch
          )
      ).length;

    }


    function harmonyDistance(
      a,
      b
    ) {

      return b.pitches.reduce(
        (
          total,
          pitch
        ) => {

          const nearest =
            Math.min(
              ...a.pitches.map(
                source =>
                  scaleDistance(
                    source,
                    pitch
                  )
              )
            );


          return total +
            nearest;

        },
        0
      );

    }


    function chooseInitialHarmony() {

      return weightedObject(
        HARMONIES.filter(
          harmony =>
            harmony.tension <
            .40
        )
      );

    }


    function beginPhraseDirection(
      current
    ) {

      if (
        current.tension >
        .64
      ) {

        state.phraseMode =
          "release";


        state.phraseTarget =
          random(
            .09,
            .28
          );

      }

      else {

        state.phraseMode =
          weightedPick([

            {
              value: "hover",
              weight: 32
            },

            {
              value: "rise",
              weight: 28
            },

            {
              value: "settle",
              weight: 27
            },

            {
              value: "darken",
              weight: 13
            }

          ]);


        if (
          state.phraseMode ===
          "rise"
        ) {

          state.phraseTarget =
            random(
              Math.max(
                current.tension +
                .10,
                .34
              ),
              .66
            );

        }

        else if (
          state.phraseMode ===
          "darken"
        ) {

          state.phraseTarget =
            random(
              .50,
              .76
            );

        }

        else if (
          state.phraseMode ===
          "settle"
        ) {

          state.phraseTarget =
            random(
              .08,
              .27
            );

        }

        else {

          state.phraseTarget =
            clamp(
              current.tension +
              random(
                -.12,
                .12
              ),
              .12,
              .55
            );

        }

      }


      state.phraseSteps =
        randomInt(
          2,
          5
        );

    }


    function chooseNextHarmony(
      current
    ) {

      if (
        state.phraseSteps <= 0
      ) {

        beginPhraseDirection(
          current
        );

      }


      state.phraseSteps--;


      /*
        Sometimes hold a harmony instead of constantly
        changing it.
      */

      if (
        state.phraseMode ===
          "hover" &&
        current.tension <
          .55 &&
        Math.random() <
          .12
      ) {

        return current;

      }


      const currentSignature =
        harmonySignature(
          current
        );


      const candidates =
        HARMONIES.filter(
          harmony =>
            harmonySignature(
              harmony
            ) !==
            currentSignature
        );


      const scored =
        candidates.map(
          candidate => {

            const signature =
              harmonySignature(
                candidate
              );


            const shared =
              sharedPitchCount(
                current,
                candidate
              );


            const distance =
              harmonyDistance(
                current,
                candidate
              );


            const targetError =
              Math.abs(
                candidate.tension -
                state.phraseTarget
              );


            let weight =
              candidate.weight;


            weight *=
              1 +
              shared *
              .72;


            weight *=
              1 /
              (
                1 +
                distance *
                .28
              );


            weight *=
              .45 +
              Math.exp(
                -targetError *
                4
              );


            if (
              current.tension >
                .62 &&
              candidate.tension <
                current.tension
            ) {

              weight *=
                2.15;

            }


            if (
              current.tension <
                .24 &&
              candidate.tension >
                .68
            ) {

              weight *=
                .14;

            }


            if (
              candidate.pitches.includes(
                "D"
              )
            ) {

              weight *=
                1.12;

            }


            if (
              state.recentHarmonies.includes(
                signature
              )
            ) {

              weight *=
                .16;

            }


            return {

              ...candidate,

              weight:
                Math.max(
                  .005,
                  weight
                )

            };

          }
        );


      const selected =
        weightedObject(
          scored
        );


      state.recentHarmonies.push(
        harmonySignature(
          selected
        )
      );


      if (
        state.recentHarmonies.length >
        5
      ) {

        state.recentHarmonies.shift();

      }


      warmHarmony(
        selected
      );


      return selected;

    }


    function chooseConnectionCount(
      current,
      next
    ) {

      if (
        state.phraseMode ===
          "rise" ||
        state.phraseMode ===
          "darken"
      ) {

        return weightedPick([

          {
            value: 1,
            weight: 10
          },

          {
            value: 2,
            weight: 26
          },

          {
            value: 3,
            weight: 39
          },

          {
            value: 4,
            weight: 25
          }

        ]);

      }


      if (
        state.phraseMode ===
          "release" ||
        state.phraseMode ===
          "settle"
      ) {

        return weightedPick([

          {
            value: 1,
            weight: 49
          },

          {
            value: 2,
            weight: 35
          },

          {
            value: 3,
            weight: 14
          },

          {
            value: 4,
            weight: 2
          }

        ]);

      }


      return weightedPick([

        {
          value: 1,
          weight: 28
        },

        {
          value: 2,
          weight: 35
        },

        {
          value: 3,
          weight: 28
        },

        {
          value: 4,
          weight: 9
        }

      ]);

    }


    /* =====================================================
       SAMPLE CHOICE
       ===================================================== */

    function chooseSample(
      instrument,
      pitch,
      preferredRegister = null
    ) {

      const candidates =
        regularSamples(
          instrument,
          pitch
        );


      if (
        !candidates.length
      ) {

        return null;

      }


      return weightedObject(
        candidates.map(
          sample => ({

            ...sample,

            weight:
              preferredRegister ===
                sample.register
                ? 2
                : sample.register ===
                    1
                  ? 1
                  : .88

          })
        )
      );

    }


    function cloudSamples(
      harmony
    ) {

      const voices =
        [];


      const target =
        randomInt(
          AUDIO_CONFIG.cloud
            .minVoices,
          AUDIO_CONFIG.cloud
            .maxVoices
        );


      const counts =
        {};


      harmony.pitches.forEach(
        (
          pitch,
          index
        ) => {

          const instrument =
            INSTRUMENTS[
              index %
              INSTRUMENTS.length
            ];


          const sample =
            chooseSample(
              instrument,
              pitch,
              index === 0
                ? 1
                : 2
            );


          if (
            sample
          ) {

            voices.push(
              sample
            );


            counts[pitch] =
              1;

          }

        }
      );


      while (
        voices.length <
        target
      ) {

        const pitch =
          weightedObject(
            harmony.pitches.map(
              pitch => ({

                value: pitch,

                weight:
                  1 /
                  (
                    1 +
                    (
                      counts[pitch] ||
                      0
                    )
                  )

              })
            )
          ).value;


        const sample =
          chooseSample(
            pick(
              INSTRUMENTS
            ),
            pitch,
            Math.random() < .55
              ? 1
              : 2
          );


        if (
          !sample
        ) {

          break;

        }


        voices.push(
          sample
        );


        counts[pitch] =
          (
            counts[pitch] ||
            0
          ) +
          1;

      }


      if (
        Math.random() <
        AUDIO_CONFIG.cloud
          .harmonicChance
      ) {

        const harmonics =
          SAMPLE_MANIFEST.filter(
            sample =>
              sample.harmonic &&
              harmony.pitches.includes(
                sample.pitch
              )
          );


        if (
          harmonics.length
        ) {

          voices[
            voices.length - 1
          ] =
            pick(
              harmonics
            );

        }

      }


      return voices;

    }


    /* =====================================================
       PITCH PATHS
       ===================================================== */

    function scaleIndex(
      pitch
    ) {

      return SCALE.indexOf(
        pitch
      );

    }


    function stepPitch(
      pitch,
      amount
    ) {

      const index =
        scaleIndex(
          pitch
        );


      return SCALE[
        (
          index +
          amount +
          SCALE.length *
          10
        ) %
        SCALE.length
      ];

    }


    function nearestTarget(
      source,
      targets
    ) {

      return [...targets]
        .sort(
          (
            a,
            b
          ) =>
            scaleDistance(
              source,
              a
            ) -
            scaleDistance(
              source,
              b
            )
        )[0];

    }


    function directionToward(
      source,
      target
    ) {

      const sourceIndex =
        scaleIndex(
          source
        );


      const targetIndex =
        scaleIndex(
          target
        );


      const up =
        (
          targetIndex -
          sourceIndex +
          SCALE.length
        ) %
        SCALE.length;


      const down =
        (
          sourceIndex -
          targetIndex +
          SCALE.length
        ) %
        SCALE.length;


      return up <= down
        ? 1
        : -1;

    }


    function makeDirectedRun(
      current,
      next,
      length,
      arch = false
    ) {

      const start =
        pick(
          current.pitches
        );


      const target =
        nearestTarget(
          start,
          next.pitches
        );


      let direction =
        directionToward(
          start,
          target
        );


      let pitch =
        start;


      const sequence =
        [pitch];


      for (
        let i = 1;
        i < length;
        i++
      ) {

        if (
          arch &&
          i ===
          Math.ceil(
            length /
            2
          )
        ) {

          direction *=
            -1;

        }


        pitch =
          stepPitch(
            pitch,
            direction
          );


        sequence.push(
          pitch
        );

      }


      if (
        !arch &&
        sequence.length > 2
      ) {

        sequence[
          sequence.length - 1
        ] =
          target;

      }


      return sequence;

    }


    /* =====================================================
       PHRASE ENGINE
       ===================================================== */

    function chooseInstrument(
      repeatChance = .38
    ) {

      if (
        state.lastInstrument &&
        Math.random() <
        repeatChance
      ) {

        return state.lastInstrument;

      }


      return pick(
        INSTRUMENTS
      );

    }


    function chooseInstrumentPair() {

      if (
        state.lastPair &&
        Math.random() < .34
      ) {

        return [
          ...state.lastPair
        ];

      }


      const pair =
        shuffle(
          INSTRUMENTS
        ).slice(
          0,
          2
        );


      state.lastPair =
        [
          ...pair
        ];


      return pair;

    }


    function choosePhraseType(
      origin
    ) {

      const repeatChance =
        origin === "auto"
          ? .31
          : .20;


      if (
        state.lastPhrase &&
        Math.random() <
        repeatChance
      ) {

        return state.lastPhrase;

      }


      if (
        origin === "auto" &&
        (
          state.phraseMode ===
            "rise" ||
          state.phraseMode ===
            "darken"
        )
      ) {

        return weightedPick([

          {
            value: "single",
            weight: 6
          },

          {
            value: "short-run",
            weight: 23
          },

          {
            value: "repeat",
            weight: 17
          },

          {
            value: "arpeggio",
            weight: 15
          },

          {
            value: "duet",
            weight: 18
          },

          {
            value: "long-run",
            weight: 21
          }

        ]);

      }


      if (
        origin === "auto" &&
        (
          state.phraseMode ===
            "settle" ||
          state.phraseMode ===
            "release"
        )
      ) {

        return weightedPick([

          {
            value: "single",
            weight: 21
          },

          {
            value: "short-run",
            weight: 16
          },

          {
            value: "repeat",
            weight: 27
          },

          {
            value: "arpeggio",
            weight: 14
          },

          {
            value: "duet",
            weight: 15
          },

          {
            value: "long-run",
            weight: 7
          }

        ]);

      }


      return weightedPick([

        {
          value: "single",
          weight:
            origin === "auto"
              ? 11
              : 17
        },

        {
          value: "short-run",
          weight:
            origin === "auto"
              ? 23
              : 28
        },

        {
          value: "repeat",
          weight:
            origin === "auto"
              ? 22
              : 25
        },

        {
          value: "arpeggio",
          weight:
            origin === "auto"
              ? 16
              : 12
        },

        {
          value: "duet",
          weight:
            origin === "auto"
              ? 18
              : 14
        },

        {
          value: "long-run",
          weight:
            origin === "auto"
              ? 10
              : 4
        }

      ]);

    }


    function phraseEvent(
      sample,
      offset,
      gain = 1
    ) {

      return {
        sample,
        offset,
        gain
      };

    }


    function buildSinglePhrase(
      current,
      next
    ) {

      const source =
        pick(
          current.pitches
        );


      const target =
        nearestTarget(
          source,
          next.pitches
        );


      const pitch =
        Math.random() < .45
          ? target
          : stepPitch(
              source,
              directionToward(
                source,
                target
              )
            );


      const instrument =
        chooseInstrument(
          .46
        );


      state.lastInstrument =
        instrument;


      return {

        type: "single",

        events: [
          phraseEvent(
            chooseSample(
              instrument,
              pitch,
              Math.random() < .6
                ? 2
                : 1
            ),
            0
          )
        ]

      };

    }


    function buildShortRun(
      current,
      next,
      origin
    ) {

      const length =
        origin === "auto"
          ? randomInt(3, 5)
          : randomInt(3, 4);


      const sequence =
        makeDirectedRun(
          current,
          next,
          length,
          false
        );


      const fixedInstrument =
        Math.random() < .58;


      const instrument =
        chooseInstrument(
          .44
        );


      const pair =
        fixedInstrument
          ? null
          : chooseInstrumentPair();


      const spacing =
        random(
          260,
          430
        );


      const events =
        sequence.map(
          (
            pitch,
            index
          ) => {

            const chosen =
              fixedInstrument
                ? instrument
                : pair[
                    index %
                    pair.length
                  ];


            return phraseEvent(
              chooseSample(
                chosen,
                pitch,
                index <
                sequence.length /
                  2
                  ? 1
                  : 2
              ),
              index *
              spacing,
              random(.90, 1.03)
            );

          }
        );


      state.lastInstrument =
        instrument;


      return {
        type: "short-run",
        events
      };

    }


    function buildRepeatPhrase(
      current,
      next,
      origin
    ) {

      const count =
        origin === "auto"
          ? randomInt(3, 6)
          : randomInt(3, 4);


      const instrument =
        chooseInstrument(
          .60
        );


      const source =
        pick(
          current.pitches
        );


      const target =
        nearestTarget(
          source,
          next.pitches
        );


      const second =
        Math.random() < .46
          ? target
          : stepPitch(
              source,
              directionToward(
                source,
                target
              )
            );


      const oscillate =
        Math.random() < .52;


      const spacing =
        random(
          300,
          520
        );


      const mainSample =
        chooseSample(
          instrument,
          source,
          Math.random() < .55
            ? 1
            : 2
        );


      const events =
        [];


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const pitch =
          oscillate &&
          i % 2 === 1
            ? second
            : source;


        events.push(
          phraseEvent(
            pitch === source
              ? mainSample
              : chooseSample(
                  instrument,
                  pitch,
                  Math.random() < .5
                    ? 1
                    : 2
                ),
            i *
            spacing,
            i ===
              count - 1
              ? 1.04
              : random(.86, 1)
          )
        );

      }


      state.lastInstrument =
        instrument;


      return {
        type: "repeat",
        events
      };

    }


    function buildArpeggio(
      current,
      next,
      origin
    ) {

      const count =
        origin === "auto"
          ? randomInt(4, 7)
          : randomInt(3, 5);


      const notes =
        [
          ...new Set([
            ...current.pitches,
            ...next.pitches
          ])
        ];


      const fixed =
        Math.random() < .52;


      const instrument =
        chooseInstrument(
          .40
        );


      const pair =
        fixed
          ? null
          : chooseInstrumentPair();


      const spacing =
        random(
          300,
          480
        );


      const events =
        [];


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const pitch =
          notes[
            i %
            notes.length
          ];


        const chosen =
          fixed
            ? instrument
            : pair[
                i %
                pair.length
              ];


        events.push(
          phraseEvent(
            chooseSample(
              chosen,
              pitch,
              i <
              count /
                2
                ? 1
                : 2
            ),
            i *
            spacing,
            random(.88, 1.02)
          )
        );

      }


      state.lastInstrument =
        instrument;


      return {
        type: "arpeggio",
        events
      };

    }


    function buildDuet(
      current,
      next,
      origin
    ) {

      const count =
        origin === "auto"
          ? randomInt(5, 8)
          : randomInt(4, 6);


      const pair =
        chooseInstrumentPair();


      const sequence =
        makeDirectedRun(
          current,
          next,
          count,
          Math.random() < .38
        );


      const spacing =
        random(
          290,
          470
        );


      const events =
        sequence.map(
          (
            pitch,
            index
          ) =>
            phraseEvent(
              chooseSample(
                pair[
                  index % 2
                ],
                pitch,
                index <
                count /
                  2
                  ? 1
                  : 2
              ),
              index *
              spacing,
              random(.87, 1.02)
            )
        );


      state.lastPair =
        [
          ...pair
        ];


      return {
        type: "duet",
        events
      };

    }


    function buildLongRun(
      current,
      next,
      origin
    ) {

      const length =
        origin === "auto"
          ? randomInt(7, 11)
          : randomInt(6, 8);


      const instrument =
        chooseInstrument(
          .58
        );


      const sequence =
        makeDirectedRun(
          current,
          next,
          length,
          Math.random() < .68
        );


      const spacing =
        random(
          240,
          370
        );


      const events =
        sequence.map(
          (
            pitch,
            index
          ) => {

            const position =
              index /
              Math.max(
                1,
                sequence.length -
                1
              );


            return phraseEvent(
              chooseSample(
                instrument,
                pitch,
                position < .46
                  ? 1
                  : 2
              ),
              index *
              spacing,
              .86 +
              position *
              .17
            );

          }
        );


      state.lastInstrument =
        instrument;


      return {
        type: "long-run",
        events
      };

    }


    function buildConnectionPhrase(
      origin
    ) {

      const current =
        state.currentHarmony;


      const next =
        state.nextHarmony;


      const type =
        choosePhraseType(
          origin
        );


      let phrase;


      if (
        type === "single"
      ) {

        phrase =
          buildSinglePhrase(
            current,
            next
          );

      }

      else if (
        type === "repeat"
      ) {

        phrase =
          buildRepeatPhrase(
            current,
            next,
            origin
          );

      }

      else if (
        type === "arpeggio"
      ) {

        phrase =
          buildArpeggio(
            current,
            next,
            origin
          );

      }

      else if (
        type === "duet"
      ) {

        phrase =
          buildDuet(
            current,
            next,
            origin
          );

      }

      else if (
        type === "long-run"
      ) {

        phrase =
          buildLongRun(
            current,
            next,
            origin
          );

      }

      else {

        phrase =
          buildShortRun(
            current,
            next,
            origin
          );

      }


      phrase.events =
        phrase.events.filter(
          event =>
            event.sample
        );


      state.lastPhrase =
        phrase.type;


      return phrase;

    }


    /* =====================================================
       PLAYBACK
       ===================================================== */

    function gainRange(
      sample
    ) {

      return sample.harmonic
        ? AUDIO_CONFIG.gains
            .harmonic
        : AUDIO_CONFIG.gains[
            sample.instrument
          ];

    }


    function attackRange(
      sample
    ) {

      return sample.harmonic
        ? AUDIO_CONFIG.attacks
            .harmonic
        : AUDIO_CONFIG.attacks[
            sample.instrument
          ];

    }


    function panRange(
      sample
    ) {

      if (
        sample.harmonic
      ) {

        return .52;

      }


      return sample.register === 1
        ? .24
        : sample.register === 2
          ? .38
          : .50;

    }


    function scheduleSample(
      sample,
      buffer,
      start,
      destination,
      gainMultiplier = 1
    ) {

      if (
        state.activeSources.size >=
        AUDIO_CONFIG.maxVoices
      ) {

        return;

      }


      const source =
        state.context.createBufferSource();


      const gain =
        state.context.createGain();


      const pan =
        state.context.createStereoPanner();


      source.buffer =
        buffer;


      const volumeRange =
        gainRange(
          sample
        );


      const target =
        random(
          volumeRange[0],
          volumeRange[1]
        ) *
        gainMultiplier;


      const attacks =
        attackRange(
          sample
        );


      gain.gain.setValueAtTime(
        .0001,
        start
      );


      gain.gain.linearRampToValueAtTime(
        target,
        start +
        random(
          attacks[0],
          attacks[1]
        )
      );


      const width =
        panRange(
          sample
        );


      pan.pan.setValueAtTime(
        random(
          -width,
          width
        ),
        start
      );


      source.connect(
        gain
      );


      gain.connect(
        pan
      );


      pan.connect(
        destination
      );


      state.activeSources.add(
        source
      );


      source.onended =
        () => {

          state.activeSources.delete(
            source
          );


          try {

            source.disconnect();
            gain.disconnect();
            pan.disconnect();

          }

          catch {}

        };


      source.start(
        start
      );

    }


    async function playCloud(
      harmony
    ) {

      const samples =
        cloudSamples(
          harmony
        );


      const loaded =
        (
          await Promise.all(
            samples.map(
              async sample => {

                try {

                  return {

                    sample,

                    buffer:
                      await loadBuffer(
                        sample.path
                      )

                  };

                }

                catch {

                  return null;

                }

              }
            )
          )
        ).filter(
          Boolean
        );


      if (
        !loaded.length
      ) {

        return null;

      }


      const eventBus =
        state.context.createGain();


      eventBus.connect(
        state.bus
      );


      const start =
        state.context.currentTime +
        .06;


      eventBus.gain.setValueAtTime(
        .0001,
        start
      );


      eventBus.gain.linearRampToValueAtTime(
        1,
        start +
        random(
          .10,
          .16
        )
      );


      const offsets =
        [];


      let cursor =
        random(
          0,
          22
        );


      loaded.forEach(
        () => {

          offsets.push(
            cursor
          );


          cursor +=
            random(
              25,
              54
            );

        }
      );


      loaded.forEach(
        (
          voice,
          index
        ) => {

          scheduleSample(
            voice.sample,
            voice.buffer,
            start +
            Math.min(
              offsets[index],
              AUDIO_CONFIG.cloud
                .spread
            ) /
            1000,
            eventBus,
            .90
          );

        }
      );


      setTimeout(
        () => {

          try {

            eventBus.disconnect();

          }

          catch {}

        },
        15000
      );


      return {

        durationMs:
          Math.min(
            cursor,
            AUDIO_CONFIG.cloud.spread
          ) +
          500,

        noteCount:
          loaded.length

      };

    }


    async function playPhrase(
      phrase
    ) {

      const loaded =
        (
          await Promise.all(
            phrase.events.map(
              async event => {

                try {

                  return {

                    ...event,

                    buffer:
                      await loadBuffer(
                        event.sample.path
                      )

                  };

                }

                catch {

                  return null;

                }

              }
            )
          )
        ).filter(
          Boolean
        );


      if (
        !loaded.length
      ) {

        return null;

      }


      const start =
        state.context.currentTime +
        .055;


      loaded.forEach(
        event => {

          scheduleSample(
            event.sample,
            event.buffer,
            start +
            event.offset /
            1000,
            state.bus,
            event.gain
          );

        }
      );


      const lastOffset =
        Math.max(
          ...loaded.map(
            event =>
              event.offset
          )
        );


      schedulePhraseVisualTicks(
        loaded.map(
          event =>
            event.offset
        ),
        phrase.type === "long-run"
          ? .60
          : phrase.type === "duet"
            ? .52
            : .42
      );


      return {

        durationMs:
          lastOffset +
          450,

        noteCount:
          loaded.length

      };

    }


    /* =====================================================
       MUSICAL EVENTS
       ===================================================== */

    async function cloudEvent(
      point
    ) {

      if (
        !state.currentHarmony
      ) {

        state.currentHarmony =
          chooseInitialHarmony();

      }


      if (
        state.nextHarmony
      ) {

        state.currentHarmony =
          state.nextHarmony;

      }


      const playback =
        await playCloud(
          state.currentHarmony
        );


      if (
        !playback
      ) {

        return null;

      }


      state.nextHarmony =
        chooseNextHarmony(
          state.currentHarmony
        );


      state.connectionsRemaining =
        chooseConnectionCount(
          state.currentHarmony,
          state.nextHarmony
        );


      state.eventType =
        "connection";


      createSplash(
        "cloud",
        point,
        playback.noteCount
      );


      musicalVisualEvent(
        "cloud",
        playback.noteCount,
        playback.durationMs
      );


      return {

        kind:
          "cloud",

        durationMs:
          playback.durationMs,

        noteCount:
          playback.noteCount

      };

    }


    async function connectionEvent(
      point,
      origin
    ) {

      if (
        !state.currentHarmony ||
        !state.nextHarmony
      ) {

        return null;

      }


      const phrase =
        buildConnectionPhrase(
          origin
        );


      const playback =
        await playPhrase(
          phrase
        );


      if (
        !playback
      ) {

        return null;

      }


      state.connectionsRemaining--;


      state.eventType =
        state.connectionsRemaining > 0
          ? "connection"
          : "cloud";


      createSplash(
        "connection",
        point,
        playback.noteCount
      );


      musicalVisualEvent(
        "connection",
        playback.noteCount,
        playback.durationMs
      );


      return {

        kind:
          "connection",

        phraseType:
          phrase.type,

        durationMs:
          playback.durationMs,

        noteCount:
          playback.noteCount

      };

    }


    async function musicalAction(
      origin,
      point
    ) {

      const now =
        performance.now();


      if (
        now -
        state.lastClick <
        AUDIO_CONFIG.clickCooldown
      ) {

        return null;

      }


      if (
        state.pending
      ) {

        return null;

      }


      state.lastClick =
        now;


      state.pending =
        true;


      let result =
        null;


      try {

        const context =
          ensureContext();


        if (
          !context
        ) {

          return null;

        }


        await context.resume();


        if (
          state.muted
        ) {

          state.muted =
            false;


          updateMaster();


          updateSoundButton();

        }


        if (
          !state.droneStarted
        ) {

          result =
            await startDrone(
              point
            );

        }

        else if (
          state.eventType ===
          "cloud"
        ) {

          result =
            await cloudEvent(
              point
            );

        }

        else {

          result =
            await connectionEvent(
              point,
              origin
            );

        }


        return result;

      }

      finally {

        state.pending =
          false;


        if (
          result &&
          origin === "manual"
        ) {

          advanceTutorial();

        }


        if (
          result &&
          origin === "manual" &&
          state.auto
        ) {

          scheduleAuto(
            result
          );

        }

      }

    }


    /* =====================================================
       AUTOPLAY
       ===================================================== */

    function autoDelay(
      result
    ) {

      if (
        !result
      ) {

        return 2500;

      }


      if (
        result.kind === "drone"
      ) {

        return random(
          6200,
          7600
        );

      }


      if (
        result.kind === "cloud"
      ) {

        if (
          state.phraseMode ===
            "rise" ||
          state.phraseMode ===
            "darken"
        ) {

          return random(
            1750,
            3100
          );

        }


        if (
          state.phraseMode ===
            "release" ||
          state.phraseMode ===
            "settle"
        ) {

          return random(
            3800,
            6300
          );

        }


        return random(
          2700,
          4800
        );

      }


      let rest;


      if (
        state.phraseMode ===
          "rise" ||
        state.phraseMode ===
          "darken"
      ) {

        rest =
          random(
            500,
            1250
          );

      }

      else if (
        state.phraseMode ===
          "release" ||
        state.phraseMode ===
          "settle"
      ) {

        rest =
          random(
            1400,
            2800
          );

      }

      else {

        rest =
          random(
            900,
            1900
          );

      }


      if (
        result.phraseType ===
          "long-run"
      ) {

        rest +=
          random(
            900,
            1800
          );

      }


      else if (
        result.phraseType ===
          "duet"
      ) {

        rest +=
          random(
            500,
            1200
          );

      }


      return (
        result.durationMs +
        rest
      );

    }


    function updateAutoButton() {

      autoButton.textContent =
        state.auto
          ? "stop randomly generating"
          : "randomly generate a song";

    }


    function scheduleAuto(
      previousResult
    ) {

      clearTimeout(
        state.autoTimer
      );


      if (
        !state.auto ||
        state.overlayMuted
      ) {

        return;

      }


      state.autoTimer =
        setTimeout(
          async () => {

            if (
              !state.auto ||
              state.overlayMuted
            ) {

              return;

            }


            const result =
              await musicalAction(
                "auto",
                randomArtworkPoint()
              );


            scheduleAuto(
              result
            );

          },
          autoDelay(
            previousResult
          )
        );

    }


    async function startAuto() {

      state.auto =
        true;


      state.muted =
        false;


      updateMaster();


      updateSoundButton();


      updateAutoButton();


      const result =
        await musicalAction(
          "auto",
          randomArtworkPoint()
        );


      scheduleAuto(
        result
      );

    }


    function stopAuto() {

      state.auto =
        false;


      clearTimeout(
        state.autoTimer
      );


      updateAutoButton();

    }


    /* =====================================================
       INTERACTION
       ===================================================== */

    artwork.addEventListener(
      "click",
      async event => {

        if (
          event.target.closest(
            ".fuji-controls"
          )
        ) {

          return;

        }


        hidePrompt();


        await musicalAction(
          "manual",
          artworkPoint(
            event
          )
        );

      }
    );


    artwork.addEventListener(
      "keydown",
      async event => {

        if (
          event.key !== "Enter" &&
          event.key !== " "
        ) {

          return;

        }


        if (
          event.target.closest(
            ".fuji-controls"
          )
        ) {

          return;

        }


        event.preventDefault();


        hidePrompt();


        await musicalAction(
          "manual",
          {
            x: .5,
            y: .52
          }
        );

      }
    );


    soundToggle.addEventListener(
      "click",
      event => {

        event.preventDefault();


        event.stopPropagation();


        state.muted =
          !state.muted;


        if (
          state.muted &&
          state.auto
        ) {

          stopAuto();

        }


        updateMaster();


        updateSoundButton();

      }
    );


    autoButton.addEventListener(
      "click",
      async event => {

        event.preventDefault();


        event.stopPropagation();


        if (
          state.auto
        ) {

          stopAuto();

        }

        else {

          await startAuto();

        }

      }
    );


    /* =====================================================
       WIP INTERLOCK
       ===================================================== */

    window.fujiAudio = {

      setOverlayMuted(
        muted
      ) {

        state.overlayMuted =
          Boolean(
            muted
          );


        updateMaster();


        if (
          state.overlayMuted
        ) {

          clearTimeout(
            state.autoTimer
          );


          resetVisuals(
            false
          );

        }

        else if (
          state.auto
        ) {

          scheduleAuto(
            null
          );

        }

      }

    };


    /* =====================================================
       START
       ===================================================== */

    updateAutoButton();


    updateSoundButton();


    revealBase()
      .then(
        () => {

          /*
            Photograph first.

            THEN background-load the limited layer budget.
          */

          setTimeout(
            prepareOverlayAssets,
            isMobileMode()
              ? 500
              : 250
          );


          tutorial.promptTimer =
            setTimeout(
              () => {

                if (
                  tutorial.step === 0 &&
                  !state.droneStarted
                ) {

                  showPrompt(
                    WORDS.here()
                  );

                }

              },
              3200
            );

        }
      );

  })();
  </script>

  <script>
  (() => {

    const clamp =
      (
        value,
        min,
        max
      ) =>
        Math.min(
          Math.max(
            value,
            min
          ),
          max
        );


    const lerp =
      (
        a,
        b,
        t
      ) =>
        a +
        (
          (
            b -
            a
          ) *
          t
        );


    const random =
      (
        min,
        max
      ) =>
        min +
        Math.random() *
        (
          max -
          min
        );


    const pick =
      array =>
        array[
          Math.floor(
            Math.random() *
            array.length
          )
        ];


    function shuffle(
      array
    ) {

      const result =
        [...array];


      for (
        let i =
          result.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (
              i + 1
            )
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }


      return result;

    }


    function smoothStep(
      value
    ) {

      const t =
        clamp(
          value,
          0,
          1
        );


      return (
        t *
        t *
        (
          3 -
          2 *
          t
        )
      );

    }


    const mobileQuery =
      window.matchMedia(
        "(max-width: 700px)"
      );


    function isMobile() {

      return mobileQuery.matches;

    }


    const pageShell =

    const horseMain =

    const horseOffset =
      document.getElementById(

      );


    const horseKey =
      document.getElementById(
        "horse-key"
      );


    const ALL_TEXTURES = [

      "Texturelabs_Atmosphere_121S.jpg",

      "Texturelabs_Water_124S.jpg",
