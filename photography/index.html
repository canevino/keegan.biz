  <script>
  (() => {

    const title =
      document.getElementById(
        "photo-title"
      );

    const colors = [
      "#c1272d",
      "#006a44",
      "#fdb913"
    ];

    let current = 0;


    function changeTitle() {

      let next;

      do {

        next =
          Math.floor(
            Math.random() *
            colors.length
          );

      }
      while (
        next === current
      );


      title.classList.add(
        "is-fading"
      );


      window.setTimeout(
        () => {

          current = next;

          title.style.color =
            colors[current];

          title.classList.remove(
            "is-fading"
          );

        },
        200
      );

    }


    title.style.color =
      colors[current];


    window.setInterval(
      changeTitle,
      2300
    );

  })();
  </script>

      const result =
        [...array];


      for (
        let i =
          result.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (
              i + 1
            )
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      return result;

    function weightedPick(
      entries
    ) {

      const usable =
        entries.filter(
          entry =>
            entry.weight > 0
        );


      const total =
        usable.reduce(
          (
            sum,
            item
          ) =>
            sum +
            item.weight,
          0
        );


      if (
        !usable.length ||
        total <= 0
      ) {

        return null;

      }


      let value =
        Math.random() *
        total;


      for (
        const item of usable
      ) {

        value -=
          item.weight;


        if (
          value <= 0
        ) {

          return item.value;

        }

      }


      return usable[
        usable.length - 1
      ].value;

    }


    function weightedObject(
      entries
    ) {

        entries.filter(

    /* =====================================================
       ALPHA DETECTION
       ===================================================== */

    function hasUsefulAlpha(
      image
    ) {

      try {

        const canvas =
          document.createElement(
            "canvas"
          );


        const width =
          120;


        const height =
          Math.max(
            1,
            Math.round(
              width *
              (
                image.naturalHeight /
                image.naturalWidth
              )
            )
          );


        canvas.width =
          width;


        canvas.height =
          height;


        const context =
          canvas.getContext(
            "2d",
            {
              willReadFrequently: true
            }
          );


        context.drawImage(
          image,
          0,
          0,
          width,
          height
        );


        const data =
          context.getImageData(
            0,
            0,
            width,
            height
          ).data;


        let translucent =
          0;


        for (
          let i = 3;
          i < data.length;
          i += 4
        ) {

          if (
            data[i] < 235
          ) {

            translucent++;

          }

        }


        return (
          translucent /
          (
            width *
            height
          )
        ) > 0.025;

      }

      catch {

        return false;

      }

    }


    let validLines = [];
    let buildingValid = true;


    async function prepareVisuals() {

      try {

        await Promise.all([

          waitForImage(
            base
          ),

          ...buildings.map(
            waitForImage
          ),

          ...lines.map(
            line =>
              waitForImage(
                line.source
              )
          )

        ]);

      }

      catch (error) {

        console.error(
          "One or more photography assets failed to load.",
          error
        );


        return;

      }


      const width =
        base.naturalWidth;


      const height =
        base.naturalHeight;


      validLines =
        lines.filter(
          item => {

            if (
              item.source.naturalWidth !== width ||
              item.source.naturalHeight !== height
            ) {

              item.layer.style.display =
                "none";


              return false;

            }


            if (
              hasUsefulAlpha(
                item.source
              )
            ) {

              item.layer.classList.add(
                "has-alpha"
              );


              item.texture.style.webkitMaskImage =
                `url("${item.source.src}")`;


              item.texture.style.maskImage =
                `url("${item.source.src}")`;

            }

            else {

              item.layer.classList.add(
                "has-white-canvas"
              );

            }


            return true;

          }
        );


      buildingValid =
        buildings.every(
          building =>
            building.naturalWidth === width &&
            building.naturalHeight === height
        );


      if (
        !buildingValid

        buildings.forEach(
          building => {

            building.style.display =
              "none";

          }
        );

      }


      clearArtwork(
        true
      );

    }


    /* =====================================================
       LINE PROCESSING
       ===================================================== */

    function chooseLineBlend(
      item,
      intensity
    ) {

      if (
        item.layer.classList.contains(
          "has-white-canvas"
        )
      ) {

        return weightedPick([

          {
            value: "multiply",
            weight: 48
          },

          {
            value: "darken",
            weight: 30
          },

          {
            value: "color-burn",
            weight:
              10 +
              intensity *
              12
          }

        ]);

      }


      return weightedPick([

        {
          value: "screen",
          weight: 17
        },

        {
          value: "hard-light",
          weight: 17
        },

        {
          value: "overlay",
          weight: 16
        },

        {
          value: "multiply",
          weight: 14
        },

        {
          value: "difference",
          weight:
            3 +
            intensity *
            10
        },

        {
          value: "exclusion",
          weight:
            5 +
            intensity *
            7
        },

        {
          value: "color-dodge",
          weight:
            4 +
            intensity *
            8
        }

      ]);

    }


    function chooseProcessing(
      intensity
    ) {

      return weightedPick([

        {
          value: "normal",
          weight: 24
        },

        {
          value: "exposed",
          weight: 24
        },

        {
          value: "posterize",
          weight:
            13 +
            intensity *
            9
        },

        {
          value: "threshold",
          weight:
            4 +
            intensity *
            13
        },

        {
          value: "hard",
          weight:
            12 +
            intensity *
            6
        },

        {
          value: "bleached",
          weight: 10
        },

        {
          value: "invert",
          weight:
            intensity *
            5
        }

      ]);

    }


    function filterFor(
      processing,
      intensity
    ) {

      const hue =
        random(
          0,
          360
        );


      if (
        processing === "posterize"
      ) {

        return `
          url("${pick(POSTERIZE)}")
          hue-rotate(${hue}deg)
          saturate(${random(1.1, 2.2)})
          contrast(${random(1.05, 1.5)})
        `;

      }


      if (
        processing === "threshold"
      ) {

        return `
          url("${pick(THRESHOLD)}")
          hue-rotate(${hue}deg)
          saturate(${random(1.1, 2.3)})
        `;

      }


      if (
        processing === "exposed"
      ) {

        return `
          hue-rotate(${hue}deg)
          saturate(${random(1.2, 2.5)})
          brightness(${random(
            1.15,
            1.55 +
            intensity *
            0.45
          )})
          contrast(${random(1.05, 1.45)})
        `;

      }


      if (
        processing === "hard"
      ) {

        return `
          hue-rotate(${hue}deg)
          saturate(${random(1.3, 2.8)})
          brightness(${random(0.85, 1.15)})
          contrast(${random(1.5, 2.25)})
        `;

      }


      if (
        processing === "bleached"
      ) {

        return `
          hue-rotate(${hue}deg)
          saturate(${random(0.5, 1.2)})
          brightness(${random(1.3, 1.75)})
          contrast(${random(0.9, 1.2)})
        `;

      }


      if (
        processing === "invert"
      ) {

        return `
          invert(1)
          hue-rotate(${hue}deg)
          saturate(${random(1.1, 2.2)})
          contrast(${random(1.1, 1.5)})
        `;

      }


      return `
        hue-rotate(${hue}deg)
        saturate(${random(1.05, 2)})
        contrast(${random(1, 1.3)})
      `;

    }


    function configureLine(
      item,
      intensity
    ) {

      const [
        colorA,
        colorB
      ] =
        pick(
          LINE_COLORS
        );


      const textureA =
        pick(
          VISUAL_TEXTURES
        );


      const textureB =
        pick(
          VISUAL_TEXTURES
        );


      item.source.style.mixBlendMode =
        chooseLineBlend(
          item,
          intensity
        );


      item.source.style.filter =
        filterFor(
          chooseProcessing(
            intensity
          ),
          intensity
        );


      item.source.style.opacity =
        random(
          0.40,
          0.92
        );


      const angle =
        random(
          0,
          360
        );


      if (
        item.layer.classList.contains(
          "has-alpha"
        )
      ) {

        item.texture.style.backgroundImage =
          `
            linear-gradient(
              ${angle}deg,
              ${colorA},
              ${colorB}
            ),
            url("${textureA}"),
            url("${textureB}")
          `;


        item.texture.style.backgroundBlendMode =
          `
            ${pick([
              "normal",
              "overlay",
              "hard-light",
              "screen"
            ])},
            ${pick([
              "multiply",
              "overlay",
              "soft-light",
              "screen"
            ])},
            normal
          `;


        item.texture.style.mixBlendMode =
          weightedPick([

            {
              value: "screen",
              weight: 24
            },

            {
              value: "hard-light",
              weight: 22
            },

            {
              value: "overlay",
              weight: 20
            },

            {
              value: "difference",
              weight:
                3 +
                intensity *
                10
            },

            {
              value: "color-dodge",
              weight:
                5 +
                intensity *
                6
            }

          ]);

      }

      else {

        item.texture.style.backgroundImage =
          `
            url("${item.source.src}"),
            linear-gradient(
              ${angle}deg,
              ${colorA},
              ${colorB}
            ),
            url("${textureA}"),
            url("${textureB}")
          `;


        item.texture.style.backgroundBlendMode =
          `
            screen,
            screen,
            overlay
          `;


        item.texture.style.mixBlendMode =
          "multiply";

      }


      item.texture.style.backgroundSize =
        `
          100% 100%,
          ${random(120, 180)}% ${random(120, 180)}%,
          cover,
          cover
        `;


      item.texture.style.backgroundPosition =
        `
          center,
          ${random(0, 100)}% ${random(0, 100)}%,
          ${random(0, 100)}% ${random(0, 100)}%,
          ${random(0, 100)}% ${random(0, 100)}%
        `;


      item.texture.style.filter =
        `
          contrast(${random(1.05, 1.6)})
          saturate(${random(1, 1.6)})
        `;


      item.texture.style.opacity =
        random(
          0.16,
          0.48 +
          intensity *
          0.22
        );


      item.layer.dataset.targetOpacity =
        clamp(
          random(
            0.30,
            0.64 +
            intensity *
            0.27
          ),
          0.18,
          0.94
        ).toFixed(
          3
        );


      item.layer.style.transform =
        "none";

    }


    /* =====================================================
       NATURAL BUILDING PROCESSING
       ===================================================== */

    function configureBuildingLayer(
      building,
      intensity
    ) {

      const look =
        weightedObject(
          BUILDING_LOOKS
        );


      const grayscale =
        random(
          look.grayscale[0],
          look.grayscale[1]
        );


      const sepia =
        random(
          look.sepia[0],
          look.sepia[1]
        );


      const saturate =
        random(
          look.saturate[0],
          look.saturate[1]
        );


      const hue =
        random(
          look.hue[0],
          look.hue[1]
        );


      const brightness =
        random(
          look.brightness[0],
          look.brightness[1]
        ) +
        intensity *
        0.025;


      const contrast =
        random(
          look.contrast[0],
          look.contrast[1]
        ) +
        intensity *
        0.025;


      building.style.transitionDuration =
        "170ms";


      building.style.mixBlendMode =
        look.blend;


      building.style.filter =
        `
          grayscale(${grayscale})
          sepia(${sepia})
          saturate(${saturate})
          hue-rotate(${hue}deg)
          brightness(${brightness})
          contrast(${contrast})
        `;


      /*
        Extremely small print-registration deviation.
      */

      building.style.transform =
        `
          translate3d(
            ${random(-0.65, 0.65)}px,
            ${random(-0.65, 0.65)}px,
            0
          )
        `;


      building.dataset.targetOpacity =
        clamp(
          random(
            look.opacity[0],
            look.opacity[1] +
            intensity *
            0.07
          ),
          0.04,
          0.32
        ).toFixed(
          3
        );

    }


    function wakeBuilding(
      intensity
    ) {

      if (
        !buildingValid
      ) {

        return;

      }


      const count =
        intensity < 0.34
          ? 1
          : intensity < 0.62
            ? 2
            : 3;


      const selected =
        shuffle(
          buildings
        ).slice(
          0,
          count
        );


      buildings.forEach(
        building => {

          if (
            selected.includes(
              building
            )
          ) {

            configureBuildingLayer(
              building,
              intensity
            );


            building.style.opacity =
              building.dataset
                .targetOpacity;

          }

          else {

            building.style.opacity =
              "0";

          }

        }
      );

    }


    /* =====================================================
       MOVEMENT-DRIVEN VISUAL ENGINE
       ===================================================== */

    let pointerInside =
      false;


    let lastPointer = {
      x: 0,
      y: 0,
      time: 0
    };


    let currentSpeed =
      0;


    let activeOrder =
      [];


    let visibleCount =
      0;


    let movementAccumulator =
      0;


    let lastMutationTime =
      0;


    let lastBuildingUpdateTime =
      0;


    const STILL_SPEED =
      0.055;


    const FULL_SPEED =
      1.15;


    function normalizeSpeed(
      speed
    ) {

      return clamp(
        (
          speed -
          STILL_SPEED
        ) /
        (
          FULL_SPEED -
          STILL_SPEED
        ),
        0,
        1
      );

    }


    function revealNextLines(
      amount,
      intensity
    ) {

      if (
        !activeOrder.length
      ) {

        activeOrder =
          shuffle(
            validLines
          );

      }


      for (
        let i = 0;
        i < amount;
        i++
      ) {

        if (
          visibleCount >=
          activeOrder.length
        ) {

          break;

        }


        const item =
          activeOrder[
            visibleCount
          ];


        configureLine(
          item,
          intensity
        );


        item.visible =
          true;


        item.lastMutation =
          performance.now();


        item.layer.style.transitionDuration =
          `${random(
            160,
            430
          )}ms`;


        item.layer.style.opacity =
          item.layer.dataset
            .targetOpacity;


        visibleCount++;

      }

    }


    function mutateVisibleLines(
      intensity,
      count
    ) {

      const now =
        performance.now();


      const available =
        validLines.filter(
          item =>
            item.visible &&
            (
              now -
              item.lastMutation
            ) > 180
        );


      if (
        !available.length
      ) {

        return;

      }


      shuffle(
        available
      )
        .slice(
          0,
          Math.min(
            count,
            available.length
          )
        )
        .forEach(
          item => {

            configureLine(
              item,
              intensity
            );


            item.lastMutation =
              now;


            item.layer.style.transitionDuration =
              intensity > 0.72
                ? `${random(
                    100,
                    220
                  )}ms`
                : `${random(
                    220,
                    500
                  )}ms`;


            item.layer.style.opacity =
              item.layer.dataset
                .targetOpacity;

          }
        );

    }


    function processMovement(
      event
    ) {

      if (
        !pointerInside ||
        reducedMotion.matches
      ) {

        return;

      }


      const now =
        performance.now();


      if (
        !lastPointer.time
      ) {

        lastPointer = {

          x:
            event.clientX,

          y:
            event.clientY,

          time:
            now

        };


        return;

      }


      const dx =
        event.clientX -
        lastPointer.x;


      const dy =
        event.clientY -
        lastPointer.y;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      const elapsed =
        Math.max(
          16,
          now -
          lastPointer.time
        );


      currentSpeed =
        distance /
        elapsed;


      lastPointer = {

        x:
          event.clientX,

        y:
          event.clientY,

        time:
          now

      };


      /*
        If the pointer is nearly still, the entire
        current visual state freezes exactly as-is.
      */

      if (
        currentSpeed <
        STILL_SPEED
      ) {

        return;

      }


      const intensity =
        normalizeSpeed(
          currentSpeed
        );


      movementAccumulator +=
        distance *
        (
          0.55 +
          intensity *
          1.55
        );


      const revealThreshold =
        95 -
        intensity *
        69;


      if (
        movementAccumulator >=
        revealThreshold
      ) {

        let revealAmount =
          1;


        if (
          intensity > 0.68
        ) {

          revealAmount =
            Math.random() < 0.42
              ? 2
              : 1;

        }


        if (
          intensity > 0.88
        ) {

          revealAmount =
            Math.random() < 0.36
              ? 3
              : 2;

        }


        revealNextLines(
          revealAmount,
          intensity
        );


        movementAccumulator =
          0;

      }


      const minimumMutationGap =
        620 -
        intensity *
        535;


      if (
        now -
        lastMutationTime >=
        minimumMutationGap
      ) {

        let mutationCount =
          1;


        if (
          intensity > 0.62
        ) {

          mutationCount =
            Math.random() < 0.55
              ? 2
              : 1;

        }


        if (
          intensity > 0.84
        ) {

          mutationCount =
            Math.random() < 0.38
              ? 3
              : 2;

        }


        mutateVisibleLines(
          intensity,
          mutationCount
        );


        lastMutationTime =
          now;

      }


      /*
        Building has its own throttled update rate.
        This is deliberately slower than the line processing
        to reduce Chrome compositing flicker / instability.
      */

      const buildingGap =
        intensity > 0.75
          ? 150
          : intensity > 0.45
            ? 210
            : 280;


      if (
        now -
        lastBuildingUpdateTime >=
        buildingGap
      ) {

        wakeBuilding(
          intensity
        );


        lastBuildingUpdateTime =
          now;

      }

    }


    function clearArtwork(
      instant = false
    ) {

      currentSpeed =
        0;


      movementAccumulator =
        0;


      visibleCount =
        0;


      lastMutationTime =
        0;


      lastBuildingUpdateTime =
        0;


      activeOrder =
        shuffle(
          validLines
        );


      validLines.forEach(
        item => {

          item.visible =
            false;


          item.lastMutation =
            0;


          item.layer.style.transitionDuration =
            instant
              ? "0ms"
              : "220ms";


          item.layer.style.opacity =
            "0";


          item.layer.style.transform =
            "none";

        }
      );


      buildings.forEach(
        building => {

          building.style.transitionDuration =
            instant
              ? "0ms"
              : "220ms";


          building.style.opacity =
            "0";


          building.style.transform =
            "translate3d(0,0,0)";


          building.style.filter =
            "none";


          building.style.mixBlendMode =
            "normal";

        }
      );


      base.style.filter =
        "none";

    }

      if (

      if (

          0.78

      mutateVisibleLines(

      wakeBuilding(

        );

      if (

          ["E", "G", "B"],
        weight:
          6
      },

      {
        pitches:
          ["F", "A", "C"],
        weight:
          5
      },

      {
        pitches:
          ["A", "C", "E"],
        weight:
          5
      },

      {
        pitches:
          ["B", "D", "F"],
        weight:
          1
      }

    ];


    /* =====================================================
       AUDIO STATE
       ===================================================== */

    const audioState = {

      context:
        null,

      masterBus:
        null,

      compressor:
        null,

      masterGain:
        null,

      muted:
        false,

      overlayMuted:
        false,

      droneStarted:
        false,

      droneLoading:
        false,

      droneBuffer:
        null,

      droneNextStart:
        0,

      droneTimer:
        null,

      currentHarmony:
        null,

      nextHarmony:
        null,

      eventType:
        "drone",

      eventPending:
        false,

      lastClickTime:
        0,

      activeVoices:
        new Set(),

      bufferCache:
        new Map(),

      loadPromises:
        new Map(),

      preloadStarted:
        false

    };


    /* =====================================================
       AUDIO CONTEXT / MASTER CHAIN
       ===================================================== */

    function ensureAudioContext() {

      if (
        audioState.context
      ) {

        return audioState.context;

      }


      const Context =
        window.AudioContext ||
        window.webkitAudioContext;


      if (
        !Context
      ) {

        console.warn(
          "Web Audio API is not supported in this browser."
        );


        return null;

      }


      const context =
        new Context();


      const masterBus =
        context.createGain();


      const compressor =
        context.createDynamicsCompressor();


      const masterGain =
        context.createGain();


      compressor.threshold.value =
        -12;


      compressor.knee.value =
        12;


      compressor.ratio.value =
        2.4;


      compressor.attack.value =
        0.018;


      compressor.release.value =
        0.32;


      masterGain.gain.value =
        AUDIO_CONFIG.masterGain;


      masterBus.connect(
        compressor
      );


      compressor.connect(
        masterGain
      );


      masterGain.connect(
        context.destination
      );


      audioState.context =
        context;


      audioState.masterBus =
        masterBus;


      audioState.compressor =
        compressor;


      audioState.masterGain =
        masterGain;


      return context;

    }


    function updateMasterGain(
      immediate = false
    ) {

      if (
        !audioState.context ||
        !audioState.masterGain
      ) {

        return;

      }


      const now =
        audioState.context.currentTime;


      const shouldMute =
        audioState.muted ||
        audioState.overlayMuted;


      const target =
        shouldMute
          ? 0.0001
          : AUDIO_CONFIG.masterGain;


      audioState.masterGain.gain
        .cancelScheduledValues(
          now
        );


      audioState.masterGain.gain
        .setValueAtTime(
          Math.max(
            0.0001,
            audioState.masterGain.gain.value
          ),
          now
        );


      if (
        immediate
      ) {

        audioState.masterGain.gain
          .setValueAtTime(
            target,
            now
          );

      }

      else {

        audioState.masterGain.gain
          .exponentialRampToValueAtTime(
            target,
            now +
            0.24
          );

      }

    }


    /* =====================================================
       BUFFER LOADING
       ===================================================== */

    async function loadBuffer(
      path
    ) {

      if (
        audioState.bufferCache.has(
          path
        )
      ) {

        return audioState.bufferCache.get(
          path
        );

      }


      if (
        audioState.loadPromises.has(
          path
        )
      ) {

        return audioState.loadPromises.get(
          path
        );

      }


      const context =
        ensureAudioContext();


      if (
        !context
      ) {

        throw new Error(
          "No AudioContext available."
        );

      }


      const promise =
        fetch(
          path
        )
          .then(
            response => {

              if (
                !response.ok
              ) {

                throw new Error(
                  `Failed to load ${path}`
                );

              }


              return response.arrayBuffer();

            }
          )
          .then(
            arrayBuffer =>
              context.decodeAudioData(
                arrayBuffer
              )
          )
          .then(
            buffer => {

              audioState.bufferCache.set(
                path,
                buffer
              );


              audioState.loadPromises.delete(
                path
              );


              return buffer;

            }
          )
          .catch(
            error => {

              audioState.loadPromises.delete(
                path
              );


              console.warn(
                error
              );


              throw error;

            }
          );


      audioState.loadPromises.set(
        path,
        promise
      );


      return promise;

    }


    async function preloadAllSamples() {

      if (
        audioState.preloadStarted
      ) {

        return;

      }


      audioState.preloadStarted =
        true;


      const paths =
        SAMPLE_MANIFEST.map(
          sample =>
            sample.path
        );


      const concurrency =
        6;


      for (
        let i = 0;
        i < paths.length;
        i += concurrency
      ) {

        const group =
          paths.slice(
            i,
            i +
            concurrency
          );


        await Promise.allSettled(
          group.map(
            path =>
              loadBuffer(
                path
              )
          )
        );

      }

    }


    /* =====================================================
       DRONE
       ===================================================== */

    function scheduleDroneSegment(
      initial = false
    ) {

      if (
        !audioState.context ||
        !audioState.droneBuffer ||
        !audioState.droneStarted
      ) {

        return;

      }


      const context =
        audioState.context;


      const buffer =
        audioState.droneBuffer;


      const duration =
        buffer.duration;


      const crossfade =
        Math.min(
          AUDIO_CONFIG.drone
            .preferredCrossfade,
          Math.max(
            1,
            duration *
            0.22
          )
        );


      let startTime =
        audioState.droneNextStart;


      /*
        Recover cleanly if the tab was suspended and the
        scheduler wakes up late.
      */

      if (
        startTime <
        context.currentTime +
        0.05
      ) {

        startTime =
          context.currentTime +
          0.05;

      }


      const source =
        context.createBufferSource();


      const gain =
        context.createGain();


      source.buffer =
        buffer;


      const targetGain =
        random(
          AUDIO_CONFIG.gainRanges
            .cello[0],
          AUDIO_CONFIG.gainRanges
            .cello[1]
        );


      const fadeIn =
        initial
          ? AUDIO_CONFIG.drone
              .fadeIn
          : crossfade;


      const endTime =
        startTime +
        duration;


      const fadeOutStart =
        Math.max(
          startTime +
          fadeIn,
          endTime -
          crossfade
        );


      gain.gain.setValueAtTime(
        0.0001,
        startTime
      );


      gain.gain.linearRampToValueAtTime(
        targetGain,
        startTime +
        fadeIn
      );


      gain.gain.setValueAtTime(
        targetGain,
        fadeOutStart
      );


      gain.gain.linearRampToValueAtTime(
        0.0001,
        endTime
      );


      source.connect(
        gain
      );


      gain.connect(
        audioState.masterBus
      );


      source.start(
        startTime
      );


      source.stop(
        endTime +
        0.05
      );


      const nextStart =
        endTime -
        crossfade;


      audioState.droneNextStart =
        nextStart;


      window.clearTimeout(
        audioState.droneTimer
      );


      const schedulerDelay =
        Math.max(
          300,
          (
            nextStart -
            context.currentTime -
            0.75
          ) *
          1000
        );


      audioState.droneTimer =
        window.setTimeout(
          () => {

            scheduleDroneSegment(
              false
            );

          },
          schedulerDelay
        );

    }


    async function startDrone() {

      if (
        audioState.droneStarted ||
        audioState.droneLoading
      ) {

        return;

      }


      audioState.droneLoading =
        true;


      const context =
        ensureAudioContext();


      if (
        !context
      ) {

        return;

      }


      await context.resume();


      /*
        Begin loading the full instrument library in the
        background without blocking the drone.
      */

      preloadAllSamples();


      try {

        const buffer =
          await loadBuffer(
            DRONE_PATH
          );


        audioState.droneBuffer =
          buffer;


        audioState.droneStarted =
          true;


        audioState.droneLoading =
          false;


        audioState.droneNextStart =
          context.currentTime +
          0.05;


        scheduleDroneSegment(
          true
        );


        soundToggle.disabled =
          false;


        soundToggle.textContent =
          "sound: on";


        audioState.eventType =
          "cloud";

      }

      catch (error) {

        audioState.droneLoading =
          false;


        console.warn(
          "Unable to start cello drone.",
          error
        );

      }

    }


    /* =====================================================
       HARMONY HELPERS
       ===================================================== */

    function harmonySignature(
      harmony
    ) {

      return [...harmony]
        .sort()
        .join("-");

    }


    function sharedPitchCount(
      a,
      b
    ) {

      return a.filter(
        pitch =>
          b.includes(
            pitch
          )
      ).length;

    }


    function scaleDistance(
      a,
      b
    ) {

      const ai =
        SCALE.indexOf(
          a
        );


      const bi =
        SCALE.indexOf(
          b
        );


      const raw =
        Math.abs(
          ai -
          bi
        );


      return Math.min(
        raw,
        SCALE.length -
        raw
      );

    }


    function harmonyDistance(
      current,
      candidate
    ) {

      return candidate.reduce(
        (
          total,
          pitch
        ) => {

          const nearest =
            Math.min(
              ...current.map(
                currentPitch =>
                  scaleDistance(
                    currentPitch,
                    pitch
                  )
              )
            );


          return total +
            nearest;

        },
        0
      );

    }


    function chooseWeightedHarmony(
      candidates
    ) {

      return weightedObject(
        candidates
      ).pitches;

    }


    function chooseInitialHarmony() {

      return chooseWeightedHarmony(
        HARMONIES
      );

    }


    function chooseNextHarmony(
      current
    ) {

      const currentSignature =
        harmonySignature(
          current
        );


      const available =
        HARMONIES.filter(
          harmony =>
            harmonySignature(
              harmony.pitches
            ) !==
            currentSignature
        );


      const mode =
        weightedPick([

          {
            value: "shared",
            weight: 60
          },

          {
            value: "close",
            weight: 25
          },

          {
            value: "free",
            weight: 15
          }

        ]);


      if (
        mode === "shared"
      ) {

        const shared =
          available.filter(
            harmony =>
              sharedPitchCount(
                current,
                harmony.pitches
              ) > 0
          );


        if (
          shared.length
        ) {

          return chooseWeightedHarmony(
            shared.map(
              harmony => ({

                ...harmony,

                weight:
                  harmony.weight *
                  (
                    1 +
                    sharedPitchCount(
                      current,
                      harmony.pitches
                    ) *
                    0.30
                  )

              })
            )
          );

        }

      }


      if (
        mode === "close"
      ) {

        const ranked =
          [...available]
            .sort(
              (
                a,
                b
              ) =>
                harmonyDistance(
                  current,
                  a.pitches
                ) -
                harmonyDistance(
                  current,
                  b.pitches
                )
            )
            .slice(
              0,
              5
            );


        return chooseWeightedHarmony(
          ranked
        );

      }


      return chooseWeightedHarmony(
        available
      );

    }


    /* =====================================================
       SAMPLE SELECTION
       ===================================================== */

    function samplesForPitch(
      pitchClass,
      includeHarmonics = false
    ) {

      return SAMPLE_MANIFEST.filter(
        sample =>
          sample.pitchClass ===
            pitchClass &&
          (
            includeHarmonics ||
            !sample.isHarmonic
          )
      );

    }


    function weightedSample(
      samples,
      usedIds,
      instrumentCounts,
      preferredRegister = null
    ) {

      const candidates =
        samples.filter(
          sample =>
            !usedIds.has(
              sample.id
            ) &&
            (
              sample.isHarmonic ||
              (
                instrumentCounts[
                  sample.instrument
                ] || 0
              ) <
              AUDIO_CONFIG.cloud
                .maxSameInstrument
            )
        );


      if (
        !candidates.length
      ) {

        return null;

      }


      return weightedObject(
        candidates.map(
          sample => {

            let weight =
              AUDIO_CONFIG
                .instrumentWeights[
                  sample.instrument
                ] || 1;


            if (
              sample.isHarmonic
            ) {

              weight =
                0.45;

            }

            else {

              weight *=
                AUDIO_CONFIG
                  .registerWeights[
                    sample.register
                  ] || 1;

            }


            if (
              preferredRegister &&
              sample.register ===
                preferredRegister
            ) {

              weight *=
                1.8;

            }


            /*
              Mandolin naturally favors the upper part
              slightly; lower guitar/concertina provide body.
            */

            if (
              sample.instrument ===
                "mandolin" &&
              sample.register ===
                2
            ) {

              weight *=
                1.25;

            }


            if (
              (
                sample.instrument ===
                  "guitar" ||
                sample.instrument ===
                  "concertina"
              ) &&
              sample.register ===
                1
            ) {

              weight *=
                1.12;

            }


            return {
              ...sample,
              weight
            };

          }
        )
      );

    }


    function addVoice(
      voices,
      sample,
      pitchCounts,
      instrumentCounts,
      usedIds
    ) {

      if (
        !sample
      ) {

        return false;

      }


      voices.push(
        sample
      );


      usedIds.add(
        sample.id
      );


      pitchCounts[
        sample.pitchClass
      ] =
        (
          pitchCounts[
            sample.pitchClass
          ] || 0
        ) +
        1;


      instrumentCounts[
        sample.instrument
      ] =
        (
          instrumentCounts[
            sample.instrument
          ] || 0
        ) +
        1;


      return true;

    }


    function generateCloudVoicing(
      harmony
    ) {

      const targetVoices =
        randomInt(
          AUDIO_CONFIG.cloud
            .minVoices,
          AUDIO_CONFIG.cloud
            .maxVoices
        );


      const voices =
        [];


      const usedIds =
        new Set();


      const pitchCounts =
        {};


      const instrumentCounts =
        {};


      /*
        Guarantee each of the three pitch classes appears.
        Prefer a broad low / upper / mixed distribution.
      */

      harmony.forEach(
        (
          pitch,
          index
        ) => {

          const preferredRegister =
            index === 0
              ? 1
              : index === 1
                ? 2
                : (
                    Math.random() <
                      0.5
                      ? 1
                      : 2
                  );


          const sample =
            weightedSample(
              samplesForPitch(
                pitch,
                false
              ),
              usedIds,
              instrumentCounts,
              preferredRegister
            );


          addVoice(
            voices,
            sample,
            pitchCounts,
            instrumentCounts,
            usedIds
          );

        }
      );


      /*
        Reserve room for an occasional harmonic accent.
      */

      const harmonicCandidates =
        SAMPLE_MANIFEST.filter(
          sample =>
            sample.isHarmonic &&
            harmony.includes(
              sample.pitchClass
            )
        );


      const wantsHarmonic =
        harmonicCandidates.length > 0 &&
        Math.random() <
          AUDIO_CONFIG.cloud
            .harmonicChance;


      const normalTarget =
        wantsHarmonic
          ? Math.max(
              harmony.length,
              targetVoices -
              1
            )
          : targetVoices;


      let safety =
        0;


      while (
        voices.length <
          normalTarget &&
        safety <
          80
      ) {

        safety++;


        const eligiblePitches =
          harmony.filter(
            pitch =>
              (
                pitchCounts[
                  pitch
                ] || 0
              ) <
              AUDIO_CONFIG.cloud
                .maxSamePitch
          );


        if (
          !eligiblePitches.length
        ) {

          break;

        }


        /*
          Favor whichever chord tone currently has fewer
          representatives.
        */

        const pitch =
          weightedObject(
            eligiblePitches.map(
              pitchClass => ({

                value:
                  pitchClass,

                weight:
                  1 /
                  (
                    1 +
                    (
                      pitchCounts[
                        pitchClass
                      ] || 0
                    )
                  )

              })
            )
          ).value;


        const sample =
          weightedSample(
            samplesForPitch(
              pitch,
              false
            ),
            usedIds,
            instrumentCounts,
            null
          );


        if (
          !sample
        ) {

          continue;

        }


        addVoice(
          voices,
          sample,
          pitchCounts,
          instrumentCounts,
          usedIds
        );

      }


      if (
        wantsHarmonic &&
        voices.length <
          targetVoices
      ) {

        const availableHarmonics =
          harmonicCandidates.filter(
            sample =>
              !usedIds.has(
                sample.id
              )
          );


        if (
          availableHarmonics.length
        ) {

          const harmonic =
            pick(
              availableHarmonics
            );


          addVoice(
            voices,
            harmonic,
            pitchCounts,
            instrumentCounts,
            usedIds
          );

        }

      }


      return voices;

    }


    /* =====================================================
       CONNECTIVE PITCH GENERATOR
       ===================================================== */

    function unique(
      array
    ) {

      return [
        ...new Set(
          array
        )
      ];

    }


    function approachPitches(
      currentHarmony,
      nextHarmony
    ) {

      const approaches =
        [];


      currentHarmony.forEach(
        currentPitch => {

          const ci =
            SCALE.indexOf(
              currentPitch
            );


          nextHarmony.forEach(
            targetPitch => {

              const ti =
                SCALE.indexOf(
                  targetPitch
                );


              const forward =
                (
                  ti -
                  ci +
                  SCALE.length
                ) %
                SCALE.length;


              const backward =
                (
                  ci -
                  ti +
                  SCALE.length
                ) %
                SCALE.length;


              /*
                One Dorian scale tone between current and
                target: E -> F -> G, etc.
              */

              if (
                forward === 2
              ) {

                approaches.push(
                  SCALE[
                    (
                      ci +
                      1
                    ) %
                    SCALE.length
                  ]
                );

              }


              if (
                backward === 2
              ) {

                approaches.push(
                  SCALE[
                    (
                      ci -
                      1 +
                      SCALE.length
                    ) %
                    SCALE.length
                  ]
                );

              }

            }
          );

        }
      );


      return unique(
        approaches
      );

    }


    function chooseConnectionPitches(
      currentHarmony,
      nextHarmony
    ) {

      const common =
        currentHarmony.filter(
          pitch =>
            nextHarmony.includes(
              pitch
            )
        );


      const incoming =
        nextHarmony.filter(
          pitch =>
            !currentHarmony.includes(
              pitch
            )
        );


      const approaches =
        approachPitches(
          currentHarmony,
          nextHarmony
        );


      const strategy =
        weightedPick([

          {
            value: "incoming",
            weight: 34
          },

          {
            value: "common",
            weight:
              common.length
                ? 28
                : 0
          },

          {
            value: "approach",
            weight:
              approaches.length
                ? 26
                : 0
          },

          {
            value: "pair",
            weight: 12
          }

        ]);


      if (
        strategy === "common" &&
        common.length
      ) {

        return [
          pick(
            common
          )
        ];

      }


      if (
        strategy === "approach" &&
        approaches.length
      ) {

        return [
          pick(
            approaches
          )
        ];

      }


      if (
        strategy === "pair"
      ) {

        const firstPool =
          common.length
            ? common
            : approaches.length
              ? approaches
              : currentHarmony;


        const secondPool =
          incoming.length
            ? incoming
            : nextHarmony;


        return unique([
          pick(
            firstPool
          ),
          pick(
            secondPool
          )
        ]).slice(
          0,
          2
        );

      }


      return [
        pick(
          incoming.length
            ? incoming
            : nextHarmony
        )
      ];

    }


    function generateConnectionVoicing(
      pitches
    ) {

      const targetVoices =
        randomInt(
          Math.max(
            AUDIO_CONFIG.connection
              .minVoices,
            pitches.length
          ),
          AUDIO_CONFIG.connection
            .maxVoices
        );


      const voices =
        [];


      const usedIds =
        new Set();


      const pitchCounts =
        {};


      const instrumentCounts =
        {};


      pitches.forEach(
        pitch => {

          const regular =
            weightedSample(
              samplesForPitch(
                pitch,
                false
              ),
              usedIds,
              instrumentCounts,
              Math.random() < 0.68
                ? 2
                : 1
            );


          addVoice(
            voices,
            regular,
            pitchCounts,
            instrumentCounts,
            usedIds
          );

        }
      );


      /*
        Harmonics are more likely in the connective gesture.
      */

      if (
        voices.length <
          targetVoices &&
        Math.random() <
          AUDIO_CONFIG.connection
            .harmonicChance
      ) {

        const harmonicCandidates =
          SAMPLE_MANIFEST.filter(
            sample =>
              sample.isHarmonic &&
              pitches.includes(
                sample.pitchClass
              ) &&
              !usedIds.has(
                sample.id
              )
          );


        if (
          harmonicCandidates.length
        ) {

          addVoice(
            voices,
            pick(
              harmonicCandidates
            ),
            pitchCounts,
            instrumentCounts,
            usedIds
          );

        }

      }


      let safety =
        0;


      while (
        voices.length <
          targetVoices &&
        safety <
          40
      ) {

        safety++;


        const pitch =
          pick(
            pitches
          );


        const sample =
          weightedSample(
            samplesForPitch(
              pitch,
              false
            ),
            usedIds,
            instrumentCounts,
            Math.random() <
              0.62
              ? 2
              : null
          );


        if (
          !sample
        ) {

          continue;

        }


        addVoice(
          voices,
          sample,
          pitchCounts,
          instrumentCounts,
          usedIds
        );

      }


      return voices;

    }


    /* =====================================================
       SAMPLE PLAYBACK
       ===================================================== */

    function gainRangeForSample(
      sample
    ) {

      if (
        sample.isHarmonic
      ) {

        return AUDIO_CONFIG
          .gainRanges
          .harmonic;

      }


      return AUDIO_CONFIG
        .gainRanges[
          sample.instrument
        ];

    }


    function panRangeForSample(
      sample
    ) {

      if (
        sample.isHarmonic
      ) {

        return AUDIO_CONFIG
          .panRanges
          .harmonic;

      }


      return AUDIO_CONFIG
        .panRanges[
          sample.register
        ] || 0.30;

    }


    function scheduleBufferVoice(
      sample,
      buffer,
      startTime,
      gainScale = 1
    ) {

      if (
        audioState.activeVoices.size >=
        AUDIO_CONFIG.maxVoices
      ) {

        return false;

      }


      const context =
        audioState.context;


      const source =
        context.createBufferSource();


      const gain =
        context.createGain();


      const panner =
        context.createStereoPanner();


      source.buffer =
        buffer;


      source.playbackRate.value =
        1;


      const range =
        gainRangeForSample(
          sample
        );


      const sourceGain =
        random(
          range[0],
          range[1]
        ) *
        gainScale;


      gain.gain.setValueAtTime(
        sourceGain,
        startTime
      );


      const panRange =
        panRangeForSample(
          sample
        );


      panner.pan.setValueAtTime(
        random(
          -panRange,
          panRange
        ),
        startTime
      );


      source.connect(
        gain
      );


      gain.connect(
        panner
      );


      panner.connect(
        audioState.masterBus
      );


      audioState.activeVoices.add(
        source
      );


      source.onended =
        () => {

          audioState.activeVoices.delete(
            source
          );


          try {

            source.disconnect();
            gain.disconnect();
            panner.disconnect();

          }

          catch {}

        };


      source.start(
        startTime
      );


      return true;

    }


    async function playVoices(
      voices,
      spreadMs,
      gainScale = 1
    ) {

      if (
        !voices.length ||
        !audioState.context
      ) {

        return;

      }


      const results =
        await Promise.all(
          voices.map(
            async sample => {

              try {

                const buffer =
                  await loadBuffer(
                    sample.path
                  );


                return {
                  sample,
                  buffer
                };

              }

              catch {

                return null;

              }

            }
          )
        );


      const playable =
        results.filter(
          Boolean
        );


      if (
        !playable.length
      ) {

        return;

      }


      const baseStart =
        audioState.context
          .currentTime +
        0.055;


      /*
        Slightly ordered random offsets reduce the chance
        that eight samples all hit on precisely the same
        sample.
      */

      const offsets =
        playable
          .map(
            () =>
              random(
                0,
                spreadMs
              )
          )
          .sort(
            (
              a,
              b
            ) =>
              a -
              b
          );


      playable.forEach(
        (
          entry,
          index
        ) => {

          if (
            audioState.activeVoices.size >=
            AUDIO_CONFIG.maxVoices
          ) {

            return;

          }


          scheduleBufferVoice(
            entry.sample,
            entry.buffer,
            baseStart +
            offsets[index] /
            1000,
            gainScale
          );

        }
      );

    }


    /* =====================================================
       MUSICAL EVENTS
       ===================================================== */

    async function playCloudEvent() {

      if (
        !audioState.currentHarmony
      ) {

        audioState.currentHarmony =
          chooseInitialHarmony();

      }

      else if (
        audioState.nextHarmony
      ) {

        audioState.currentHarmony =
          audioState.nextHarmony;

      }


      const voices =
        generateCloudVoicing(
          audioState.currentHarmony
        );


      await playVoices(
        voices,
        AUDIO_CONFIG.cloud
          .entrySpreadMs,
        1
      );


      audioState.nextHarmony =
        chooseNextHarmony(
          audioState.currentHarmony
        );


      audioState.eventType =
        "connection";


      visualChordPulse();

    }


    async function playConnectionEvent() {

      if (
        !audioState.currentHarmony ||
        !audioState.nextHarmony
      ) {

        return;

      }


      const pitches =
        chooseConnectionPitches(
          audioState.currentHarmony,
          audioState.nextHarmony
        );


      const voices =
        generateConnectionVoicing(
          pitches
        );


      await playVoices(
        voices,
        AUDIO_CONFIG.connection
          .entrySpreadMs,
        0.92
      );


      audioState.eventType =
        "cloud";


      visualConnectionPulse();

    }


    async function handleMusicalClick() {

      const now =
        performance.now();


      if (
        now -
        audioState.lastClickTime <
        AUDIO_CONFIG.eventCooldownMs
      ) {

        return;

      }


      if (
        audioState.eventPending
      ) {

        return;

      }


      audioState.lastClickTime =
        now;


      audioState.eventPending =
        true;


      try {

        const context =
          ensureAudioContext();


        if (
          !context
        ) {

          return;

        }


        await context.resume();


        /*
          CLICK 1:
          cello drone only.
        */

        if (
          !audioState.droneStarted &&
          !audioState.droneLoading
        ) {

          await startDrone();


          return;

        }


        if (
          audioState.droneLoading
        ) {

          return;

        }


        /*
          Subsequent clicks:
          CLOUD → CONNECTION → CLOUD...
        */

        if (
          audioState.eventType ===
          "cloud"
        ) {

          await playCloudEvent();

        }

        else {

          await playConnectionEvent();

        }

      }

      finally {

        audioState.eventPending =
          false;

      }

    }


    /* =====================================================
       ARTWORK CLICK
       ===================================================== */

    artwork.addEventListener(
      "click",
      async event => {

        if (
          event.target.closest(
            ".fuji-sound-toggle"
          )
        ) {

          return;

        }


        await handleMusicalClick();

      }
    );


    /*
      Keyboard also progresses the musical state.
    */

    artwork.addEventListener(
      "keydown",
      async event => {

        if (
          event.key !== "Enter" &&
          event.key !== " "
        ) {

          return;

        }


        if (
          event.target ===
          soundToggle
        ) {

          return;

        }


        event.preventDefault();


        await handleMusicalClick();

      }
    );


    /* =====================================================
       TOUCH VISUAL RESPONSE

       Audio event itself supplies the major cloud/connection
       pulse. A touch does not create a second independent
       visual animation.
       ===================================================== */


    /* =====================================================
       MUTE CONTROL
       ===================================================== */

    soundToggle.addEventListener(
      "click",
      event => {

        event.preventDefault();
        event.stopPropagation();


        if (
          !audioState.droneStarted
        ) {

          return;

        }


        audioState.muted =
          !audioState.muted;


        updateMasterGain();


        soundToggle.textContent =
          audioState.muted
            ? "sound: off"
            : "sound: on";


        soundToggle.setAttribute(
          "aria-label",
          audioState.muted
            ? "Turn sound on"
            : "Turn sound off"
        );

      }
    );


    /* =====================================================
       API FOR WIP OVERLAY

       Prevents Fuji audio and cricket audio playing loudly
       on top of one another.
       ===================================================== */

    window.fujiAudio = {

      setOverlayMuted(
        muted
      ) {

        audioState.overlayMuted =
          Boolean(
            muted
          );


        updateMasterGain();

      }

    };


    /* =====================================================
       START VISUAL PREPARATION
       ===================================================== */

    prepareVisuals();

  })();
  </script>

    const clamp =
      (
        value,
        min,
        max
      ) =>
        Math.min(
          Math.max(
            value,
            min
          ),
          max
        );


    const lerp =
      (
        a,
        b,
        t
      ) =>
        a +
        (
          (
            b -
            a
          ) *
          t
        );


    const random =
      (
        min,
        max
      ) =>
        min +
        Math.random() *
        (
          max -
          min
        );


    const pick =
      array =>
        array[
          Math.floor(
            Math.random() *
            array.length
          )
        ];


    function shuffle(
      array
    ) {

      const result =
        [...array];


      for (
        let i =
          result.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (
              i + 1
            )
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }


      return result;

    }


    function smoothStep(
      value
    ) {

      const t =
        clamp(
          value,
          0,
          1
        );


      return (
        t *
        t *
        (
          3 -
          2 *
          t
        )
      );

    }

    let sessionTextures =

    let readyTextures =

    let recentTextures =

    function prepareTextures() {

      sessionTextures = [

        ...shuffle(
          DIRTY_TEXTURES
        ).slice(
          0,
          isMobile()
            ? 13
            : 18
        ),

        ...shuffle(
          SOFTER_TEXTURES
        ).slice(
          0,
          isMobile()
            ? 3
            : 6
        )

      ];


      readyTextures =
        [];


      sessionTextures.forEach(
        src => {

          const image =
            new Image();


          image.decoding =
            "async";


          image.onload =
            () => {

              if (
                !readyTextures.includes(
                  src
                )
              ) {

                readyTextures.push(
                  src
                );

              }

            };


          image.src =
            src;

        }
      );

    function chooseTexture() {

      const dirty =
        readyTextures.filter(
          src =>
            DIRTY_TEXTURES.includes(
              src
            )
        );


      const pool =
        (
          Math.random() < 0.82 &&
          dirty.length > 3
        )
          ? dirty
          : (
              readyTextures.length > 5
                ? readyTextures
                : sessionTextures
            );


      let result;


      let attempts =
        0;


      do {

        result =
          pick(
            pool
          );


        attempts++;

      }
      while (
        recentTextures.includes(
          result
        ) &&
        attempts < 14
      );


      recentTextures.push(
        result
      );


      if (
        recentTextures.length > 7
      ) {

        recentTextures.shift();

      }


      return result;

    }

          outgoing.style.opacity =

    const HORSE_START =
      12;


    const HORSE_FULL =
      20;


    const COLLAGE_START =
      30;


    const NORMAL_TIME =
      243;


    function horseRevealAt(
      time
    ) {

      if (
        time < HORSE_START
      ) {

        return 0;

      }


      return smoothStep(
        (
          time -
          HORSE_START
        ) /
        (
          HORSE_FULL -
          HORSE_START
        )
      );

    }


    function intensityAt(
      time
    ) {

      if (
        time < COLLAGE_START ||
        time >= NORMAL_TIME
      ) {

        return 0;

      }


      return clamp(
        (
          time -
          COLLAGE_START
        ) /
        (
          NORMAL_TIME -
          COLLAGE_START
        ),
        0,
        1
      );

    }


    let overlayOpen =
      false;


    let collageStarted =
      false;


    let horseStarted =
      false;


    let normalState =
      false;


    let raf =
      null;


    function clearSlots() {

      slots.forEach(
        slot => {

          slot.nextChange =
            Infinity;


          slot.frames.forEach(
            frame => {

              frame.style.opacity =
                "0";

            }
          );

        }
      );

    }


    function visualLoop() {

      if (
        !overlayOpen
      ) {

        return;

      }


      const time =
        audio.currentTime ||
        0;


      stage.style.setProperty(
        "--visual-reveal",
        horseRevealAt(
          time
        ).toFixed(
          4
        )
      );


      if (
        time >= HORSE_START &&
        !horseStarted
      ) {

        horseStarted =
          true;


        prepareInitialHorse();

      }


      if (
        time >= HORSE_START &&
        time < COLLAGE_START
      ) {

        horseMain.style.opacity =
          horseRevealAt(
            time
          );


        if (
          time >=
          nextHorseChange
        ) {

          applyHorseColor(
            nextHorseColor(
              time
            ),
            0.08,
            time
          );

        }

      }


      if (
        time >= COLLAGE_START &&
        time < NORMAL_TIME
      ) {

        const intensity =
          intensityAt(
            time
          );


        if (
          !collageStarted
        ) {

          collageStarted =
            true;


          slots.forEach(
            slot =>
              initializeSlot(
                slot,
                intensity,
                time
              )
          );


          nextHorseChange =
            time +
            8;

        }


        slots.forEach(
          slot => {

            if (
              time >=
              slot.nextChange
            ) {

              morphSlot(
                slot,
                intensity,
                time
              );

            }

          }
        );


        if (
          time >=
          nextHorseChange
        ) {

          applyHorseColor(
            nextHorseColor(
              time
            ),
            intensity,
            time
          );

        }

      }


      if (
        time >= NORMAL_TIME &&
        !normalState
      ) {

        normalState =
          true;


        clearSlots();


        normalHorse();


        stage.classList.add(
          "is-normal"
        );

      }


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    async function openWip() {

      if (
        overlayOpen
      ) {

        return;

      }


      overlayOpen =
        true;


      collageStarted =
        false;


      horseStarted =
        false;


      normalState =
        false;


      recentTextures =
        [];


      lastHorseColorName =
        "";


      clearSlots();


      normalHorse();


      stage.classList.remove(
        "is-normal"
      );


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      prepareTextures();


      /*
        Quiet the generative Fuji piece while the WIP
        soundtrack is running.
      */

      if (
        window.fujiAudio
      ) {

        window.fujiAudio
          .setOverlayMuted(
            true
          );

      }


      pageShell.classList.add(
        "is-hidden"
      );


      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.currentTime =
        0;


      audio.volume =
        0.72;


      try {

        await audio.play();

      }

      catch {}


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    function closeWip() {

      overlayOpen =
        false;


      cancelAnimationFrame(
        raf
      );


      audio.pause();


      audio.currentTime =
        0;


      clearSlots();


      normalHorse();


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      pageShell.classList.remove(
        "is-hidden"
      );


      if (
        window.fujiAudio
      ) {

        window.fujiAudio
          .setOverlayMuted(
            false
          );

      }

    }


    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );


        if (
          !link
        ) {

          return;

        }


        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>

</body>
