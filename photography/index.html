  <script>
  (() => {

    const title =
      document.getElementById(
        "photo-title"
      );


    const colors = [
      "#c1272d",
      "#006a44",
      "#fdb913"
    ];


    let current =
      0;


    function changeTitle() {

      let next;


      do {

        next =
          Math.floor(
            Math.random() *
            colors.length
          );

      }
      while (
        next === current
      );


      title.classList.add(
        "is-fading"
      );


      setTimeout(
        () => {

          current =
            next;


          title.style.color =
            colors[current];


          title.classList.remove(
            "is-fading"
          );

        },
        200
      );

    }


    title.style.color =
      colors[current];


    setInterval(
      changeTitle,
      2300
    );

  })();
  </script>


  <!-- =====================================================

  <script>
  (() => {

    /* =====================================================
       ELEMENTS
       ===================================================== */

    const artwork =
      document.getElementById(
        "fuji-interactive"
      );


    const base =
      document.getElementById(
        "fuji-base"
      );


    const buildings =
      Array.from(
        document.querySelectorAll(
          ".fuji-building"
        )
      );


    const lines =
      Array.from(
        document.querySelectorAll(
          ".fuji-line-layer"
        )
      ).map(
        layer => ({

          layer,

          source:
            layer.querySelector(
              ".fuji-line-source"
            ),

          texture:
            layer.querySelector(
              ".fuji-line-texture"
            ),

          visible:
            false

        })
      );


    const finePointer =
      window.matchMedia(
        "(hover: hover) and (pointer: fine)"
      );


    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );


    /* =====================================================
       MATERIAL
       ===================================================== */

    const TEXTURES = [

      "../assets/home/Texturelabs_Grunge_173S.jpg",
      "../assets/home/Texturelabs_Grunge_279L.jpg",
      "../assets/home/Texturelabs_Grunge_334S.jpg",
      "../assets/home/Texturelabs_Grunge_341S.jpg",

      "../assets/home/Texturelabs_InkPaint_126S.jpg",
      "../assets/home/Texturelabs_InkPaint_320S.jpg",
      "../assets/home/Texturelabs_InkPaint_332S.jpg",
      "../assets/home/Texturelabs_InkPaint_356S.jpg",

      "../assets/home/Texturelabs_Concrete_150S.jpg",
      "../assets/home/Texturelabs_Concrete_155S.jpg",
      "../assets/home/Texturelabs_Concrete_179S.jpg",
      "../assets/home/Texturelabs_Concrete_205S.jpg",

      "../assets/home/Texturelabs_Film_181S.jpg",
      "../assets/home/Texturelabs_Film_183S.jpg",
      "../assets/home/Texturelabs_Film_187S.jpg",

      "../assets/home/Texturelabs_Metal_129S.jpg",
      "../assets/home/Texturelabs_Metal_165S.jpg",

      "../assets/home/Texturelabs_Paper_280S.jpg",
      "../assets/home/Texturelabs_Paper_286S.jpg",

      "../assets/home/Texturelabs_Wood_135S.jpg",
      "../assets/home/Texturelabs_Wood_280S.jpg"

    ];


    const COLORS = [

      ["#ff214f", "#ff7538"],

      ["#00dfff", "#2868ff"],

      ["#ff29c8", "#7044ff"],

      ["#00efb2", "#7ee83b"],

      ["#ffe100", "#ff482a"],

      ["#ff355e", "#00c8ff"],

      ["#00ffd0", "#ed179b"],

      ["#9cff22", "#277dff"],

      ["#eaff00", "#ff254f"]

    ];


    const POSTERIZE = [
      "#fuji-posterize-3",
      "#fuji-posterize-4",
      "#fuji-posterize-6"
    ];


    const THRESHOLD = [
      "#fuji-threshold-low",
      "#fuji-threshold-mid",
      "#fuji-threshold-high"
    ];


    /* =====================================================
       HELPERS
       ===================================================== */

    const clamp =
      (
        value,
        min,
        max
      ) =>
        Math.min(
          Math.max(
            value,
            min
          ),
          max
        );


    const random =
      (
        min,
        max
      ) =>
        min +
        Math.random() *
        (
          max -
          min
        );


    const pick =
      array =>
        array[
          Math.floor(
            Math.random() *
            array.length
          )
        ];


    function shuffle(
      array
    ) {

      const result =
        [...array];


      for (
        let i =
          result.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (
              i + 1
            )
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }


      return result;

    }


    function weightedPick(
      choices
    ) {

      const total =
        choices.reduce(
          (
            sum,
            item
          ) =>
            sum +
            item.weight,
          0
        );


      let value =
        Math.random() *
        total;


      for (
        const item of choices
      ) {

        value -=
          item.weight;


        if (
          value <= 0
        ) {

          return item.value;

        }

      }


      return choices[
        choices.length - 1
      ].value;

    }


    function waitForImage(
      image
    ) {

      if (
        image.complete &&
        image.naturalWidth
      ) {

        return Promise.resolve();

      }


      return new Promise(
        (
          resolve,
          reject
        ) => {

          image.addEventListener(
            "load",
            resolve,
            {
              once: true
            }
          );


          image.addEventListener(
            "error",
            reject,
            {
              once: true
            }
          );

        }
      );

    }


    /* =====================================================
       ALPHA DETECTION
       ===================================================== */

    function hasUsefulAlpha(
      image
    ) {

      try {

        const canvas =
          document.createElement(
            "canvas"
          );


        const width =
          120;


        const height =
          Math.max(
            1,
            Math.round(
              width *
              (
                image.naturalHeight /
                image.naturalWidth
              )
            )
          );


        canvas.width =
          width;


        canvas.height =
          height;


        const context =
          canvas.getContext(
            "2d",
            {
              willReadFrequently:
                true
            }
          );


        context.drawImage(
          image,
          0,
          0,
          width,
          height
        );


        const data =
          context.getImageData(
            0,
            0,
            width,
            height
          ).data;


        let translucent =
          0;


        for (
          let i = 3;
          i < data.length;
          i += 4
        ) {

          if (
            data[i] <
            235
          ) {

            translucent++;

          }

        }


        return (
          translucent /
          (
            width *
            height
          )
        ) > 0.025;

      }

      catch {

        return false;

      }

    }


    /* =====================================================
       PREPARE
       ===================================================== */

    let validLines =
      [];


    let buildingValid =
      true;


    async function prepare() {

      try {

        await Promise.all([

          waitForImage(
            base
          ),

          ...buildings.map(
            waitForImage
          ),

          ...lines.map(
            line =>
              waitForImage(
                line.source
              )
          )

        ]);

      }

      catch (error) {

        console.error(
          "One or more photography assets failed to load.",
          error
        );


        return;

      }


      const width =
        base.naturalWidth;


      const height =
        base.naturalHeight;


      validLines =
        lines.filter(
          item => {

            if (
              item.source.naturalWidth !==
                width ||
              item.source.naturalHeight !==
                height
            ) {

              item.layer.style.display =
                "none";


              return false;

            }


            if (
              hasUsefulAlpha(
                item.source
              )
            ) {

              item.layer.classList.add(
                "has-alpha"
              );


              item.texture.style.webkitMaskImage =
                `url("${item.source.src}")`;


              item.texture.style.maskImage =
                `url("${item.source.src}")`;

            }

            else {

              item.layer.classList.add(
                "has-white-canvas"
              );

            }


            return true;

          }
        );


      buildingValid =
        buildings.every(
          building =>
            building.naturalWidth ===
              width &&
            building.naturalHeight ===
              height
        );


      if (
        !buildingValid
      ) {

        buildings.forEach(
          building => {

            building.style.display =
              "none";

          }
        );

      }


      clearArtwork(
        true
      );

    }


    /* =====================================================
       LINE DESIGN
       ===================================================== */

    function chooseLineBlend(
      item,
      intensity
    ) {

      if (
        item.layer.classList.contains(
          "has-white-canvas"
        )
      ) {

        return weightedPick([

          {
            value:
              "multiply",
            weight:
              48
          },

          {
            value:
              "darken",
            weight:
              30
          },

          {
            value:
              "color-burn",
            weight:
              10 +
              intensity *
              12
          }

        ]);

      }


      return weightedPick([

        {
          value:
            "screen",
          weight:
            17
        },

        {
          value:
            "hard-light",
          weight:
            17
        },

        {
          value:
            "overlay",
          weight:
            16
        },

        {
          value:
            "multiply",
          weight:
            14
        },

        {
          value:
            "difference",
          weight:
            3 +
            intensity *
            10
        },

        {
          value:
            "exclusion",
          weight:
            5 +
            intensity *
            7
        },

        {
          value:
            "color-dodge",
          weight:
            4 +
            intensity *
            8
        }

      ]);

    }


    function chooseProcessing(
      intensity
    ) {

      return weightedPick([

        {
          value:
            "normal",
          weight:
            24
        },

        {
          value:
            "exposed",
          weight:
            24
        },

        {
          value:
            "posterize",
          weight:
            13 +
            intensity *
            9
        },

        {
          value:
            "threshold",
          weight:
            4 +
            intensity *
            13
        },

        {
          value:
            "hard",
          weight:
            12 +
            intensity *
            6
        },

        {
          value:
            "bleached",
          weight:
            10
        },

        {
          value:
            "invert",
          weight:
            intensity *
            5
        }

      ]);

    }


    function filterFor(
      processing,
      intensity
    ) {

      const hue =
        random(
          0,
          360
        );


      if (
        processing ===
        "posterize"
      ) {

        return `
          url("${pick(POSTERIZE)}")
          hue-rotate(${hue}deg)
          saturate(${random(1.1, 2.2)})
          contrast(${random(1.05, 1.5)})
        `;

      }


      if (
        processing ===
        "threshold"
      ) {

        return `
          url("${pick(THRESHOLD)}")
          hue-rotate(${hue}deg)
          saturate(${random(1.1, 2.3)})
        `;

      }


      if (
        processing ===
        "exposed"
      ) {

        return `
          hue-rotate(${hue}deg)
          saturate(${random(1.2, 2.5)})
          brightness(${random(1.15, 1.55 + intensity * 0.45)})
          contrast(${random(1.05, 1.45)})
        `;

      }


      if (
        processing ===
        "hard"
      ) {

        return `
          hue-rotate(${hue}deg)
          saturate(${random(1.3, 2.8)})
          brightness(${random(0.85, 1.15)})
          contrast(${random(1.5, 2.25)})
        `;

      }


      if (
        processing ===
        "bleached"
      ) {

        return `
          hue-rotate(${hue}deg)
          saturate(${random(0.5, 1.2)})
          brightness(${random(1.3, 1.75)})
          contrast(${random(0.9, 1.2)})
        `;

      }


      if (
        processing ===
        "invert"
      ) {

        return `
          invert(1)
          hue-rotate(${hue}deg)
          saturate(${random(1.1, 2.2)})
          contrast(${random(1.1, 1.5)})
        `;

      }


      return `

    function configureLine(

    ) {

      const [

      item.source.style.mixBlendMode =

        filterFor(

        );


      item.source.style.opacity =
        random(

          0.92
        );


      const angle =
        random(

        );


      if (
        item.layer.classList.contains(

        )
      ) {

        item.texture.style.backgroundImage =
          `
            linear-gradient(

        item.texture.style.backgroundBlendMode =
          `

              "normal",
              "overlay",
              "hard-light",
              "screen"
            ])},
            ${pick([
              "multiply",
              "overlay",
              "soft-light",
              "screen"
            ])},

          `;


        item.texture.style.mixBlendMode =
          weightedPick([

            {
              value:

                24
            },

            {

            },

            {

                20
            },

            {
              value:

                3 +
                intensity *
                10
            },

            {
              value:
                "color-dodge",
              weight:
                5 +
                intensity *
                6
            }

          ]);

      }

      else {

        item.texture.style.backgroundImage =
          `
            url("${item.source.src}"),
            linear-gradient(
              ${angle}deg,
              ${colorA},
              ${colorB}
            ),
            url("${textureA}"),
            url("${textureB}")
          `;


        item.texture.style.backgroundBlendMode =
          `
            screen,
            screen,
            overlay
          `;


        item.texture.style.mixBlendMode =
          "multiply";

      }


      item.texture.style.backgroundSize =
        `
          100% 100%,
          ${random(120, 180)}%
          ${random(120, 180)}%,
          cover,
          cover
        `;


      item.texture.style.backgroundPosition =
        `
          center,
          ${random(0, 100)}%
          ${random(0, 100)}%,
          ${random(0, 100)}%
          ${random(0, 100)}%,
          ${random(0, 100)}%
          ${random(0, 100)}%
        `;


      item.texture.style.filter =
        `
          contrast(
            ${random(1.05, 1.6)}
          )
          saturate(
            ${random(1, 1.6)}
          )
        `;


      item.texture.style.opacity =
        random(
          0.16,
          0.48 +

          0.22
        );


      item.layer.dataset.targetOpacity =
        clamp(

            0.30,
            0.64 +

          ),

        ).toFixed(

        );


      /*

        exported from Photoshop.

    /* =====================================================
       BUILDING
       ===================================================== */

    function configureBuildingLayer(
      building,
      intensity
    ) {

      building.style.mixBlendMode =
        weightedPick([

          {
            value:
              "screen",
            weight:
              18
          },

          {
            value:
              "hard-light",
            weight:
              18
          },

          {
            value:
              "overlay",
            weight:
              15
          },

          {
            value:
              "lighten",
            weight:
              10
          },

          {
            value:
              "difference",
            weight:
              5 +
              intensity *
              12
          },

          {
            value:
              "exclusion",
            weight:
              7 +
              intensity *
              9
          },

          {
            value:
              "color-dodge",
            weight:
              6 +
              intensity *
              9
          },

          {
            value:
              "color-burn",
            weight:
              4
          }

        ]);


      building.style.filter =
        `
          hue-rotate(
            ${random(0, 360)}deg
          )
          saturate(
            ${random(
              1.05,
              1.6 +
              intensity
            )}
          )
          brightness(
            ${random(
              0.90,
              1.20 +
              intensity * 0.25
            )}
          )
          contrast(
            ${random(
              1,
              1.3 +
              intensity * 0.25
            )}
          )
        `;


      /*
        Tiny print-registration offset only.
      */

      building.style.transform =
        `
          translate(
            ${random(-1.2, 1.2)}px,
            ${random(-1.2, 1.2)}px
          )
        `;


      building.dataset.targetOpacity =
        clamp(
          random(
            0.10,
            0.24 +
            intensity *
            0.40
          ),
          0.06,
          0.70
        ).toFixed(
          3
        );

    }


    function wakeBuilding(
      intensity
    ) {

      if (
        !buildingValid
      ) {

        return;

      }


      /*
        Number of simultaneously-visible building copies
        rises with mouse speed.
      */

      const count =
        intensity < 0.30
          ? 1
          : intensity < 0.58
            ? 2
            : intensity < 0.82
              ? 3
              : 4;


      const selected =
        shuffle(
          buildings
        ).slice(
          0,
          count
        );


      buildings.forEach(
        building => {

          if (
            selected.includes(
              building
            )
          ) {

            configureBuildingLayer(
              building,
              intensity
            );


            building.style.opacity =
              building.dataset
                .targetOpacity;

          }

          else {

            building.style.opacity =
              "0";

          }

        }
      );

    }


    /* =====================================================
       MOVEMENT ENGINE

       NO AUTONOMOUS TIMER.

       Mouse movement is the clock.
       ===================================================== */

    let pointerInside =
      false;


    let lastPointer = {
      x: 0,
      y: 0,
      time: 0
    };


    let currentSpeed =
      0;


    let activeOrder =
      [];


    let visibleCount =
      0;


    let movementAccumulator =
      0;


    let lastMutationTime =
      0;


    /*
      Speed thresholds in px/ms.

      Extremely slow movement falls below STILL_SPEED and
      therefore does absolutely nothing.
    */

    const STILL_SPEED =
      0.055;


    const FULL_SPEED =
      1.15;


    function normalizeSpeed(
      speed
    ) {

      return clamp(
        (
          speed -
          STILL_SPEED
        ) /
        (
          FULL_SPEED -
          STILL_SPEED
        ),
        0,
        1
      );

    }


    function revealNextLines(
      amount,
      intensity
    ) {

      if (
        !activeOrder.length
      ) {

        activeOrder =
          shuffle(
            validLines
          );

      }


      for (
        let i = 0;
        i < amount;
        i++
      ) {

        if (
          visibleCount >=
          activeOrder.length
        ) {

          break;

        }


        const item =
          activeOrder[
            visibleCount
          ];


        configureLine(
          item,
          intensity
        );


        item.visible =
          true;


        item.layer.style.transitionDuration =
          `${random(
            160,
            430
          )}ms`;


        item.layer.style.opacity =
          item.layer.dataset
            .targetOpacity;


        visibleCount++;

      }

    }


    function mutateVisibleLines(
      intensity,
      count
    ) {

      const visible =
        validLines.filter(
          item =>
            item.visible
        );


      if (
        !visible.length
      ) {

        return;

      }


      shuffle(
        visible
      )
        .slice(
          0,
          Math.min(
            count,
            visible.length
          )
        )
        .forEach(
          item => {

            /*
              Change processing in place.

              No positional jumping.
            */

            configureLine(
              item,
              intensity
            );


            item.layer.style.transitionDuration =
              intensity > 0.72
                ? `${random(
                    90,
                    220
                  )}ms`
                : `${random(
                    220,
                    500
                  )}ms`;


            item.layer.style.opacity =
              item.layer.dataset
                .targetOpacity;

          }
        );

    }


    function processMovement(
      event
    ) {

      if (
        !pointerInside ||
        reducedMotion.matches
      ) {

        return;

      }


      const now =
        performance.now();


      if (
        !lastPointer.time
      ) {

        lastPointer = {
          x:
            event.clientX,

          y:
            event.clientY,

          time:
            now
        };


        return;

      }


      const dx =
        event.clientX -
        lastPointer.x;


      const dy =
        event.clientY -
        lastPointer.y;


      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );


      const elapsed =
        Math.max(
          16,
          now -
          lastPointer.time
        );


      currentSpeed =
        distance /
        elapsed;


      lastPointer = {
        x:
          event.clientX,

        y:
          event.clientY,

        time:
          now
      };


      /*
        CRITICAL:

        Slow mouse = FREEZE.

        No opacity updates.
        No mutations.
        No building changes.
        No line changes.
      */

      if (
        currentSpeed <
        STILL_SPEED
      ) {

        return;

      }


      const intensity =
        normalizeSpeed(
          currentSpeed
        );


      /*
        Physical mouse distance also matters.

        This means someone actually moving around the image
        gradually draws more of the architecture into view.
      */

      movementAccumulator +=
        distance *
        (
          0.55 +
          intensity *
          1.55
        );


      /*
        Reveal threshold becomes smaller at high speed.

        Slow deliberate movement:
        architecture arrives cautiously.

        Fast movement:
        several layers appear very quickly.
      */

      const revealThreshold =
        95 -
        (
          intensity *
          69
        );


      if (
        movementAccumulator >=
        revealThreshold
      ) {

        let revealAmount =
          1;


        if (
          intensity >
          0.68
        ) {

          revealAmount =
            Math.random() <
              0.42
              ? 2
              : 1;

        }


        if (
          intensity >
          0.88
        ) {

          revealAmount =
            Math.random() <
              0.36
              ? 3
              : 2;

        }


        revealNextLines(
          revealAmount,
          intensity
        );


        movementAccumulator =
          0;

      }


      /*
        MUTATION RATE IS ALSO DIRECTLY CONTROLLED BY SPEED.

        There is no setInterval ticking in the background.
      */

      const minimumMutationGap =
        620 -
        (
          intensity *
          535
        );


      if (
        now -
        lastMutationTime >=
        minimumMutationGap
      ) {

        let mutationCount =
          1;


        if (
          intensity >
          0.62
        ) {

          mutationCount =
            Math.random() <
              0.55
              ? 2
              : 1;

        }


        if (
          intensity >
          0.84
        ) {

          mutationCount =
            Math.random() <
              0.38
              ? 3
              : 2;

        }


        mutateVisibleLines(
          intensity,
          mutationCount
        );


        /*
          Building changes along with movement.

          Slow movement changes it infrequently.
          Fast movement reprocesses it rapidly.
        */

        if (
          Math.random() <
          (
            0.34 +
            intensity *
            0.55
          )
        ) {

          wakeBuilding(
            intensity
          );

        }


        lastMutationTime =
          now;

      }

    }


    /* =====================================================
       CLEAR

       Pointer leaves = photograph only.
       ===================================================== */

    function clearArtwork(
      instant =
        false
    ) {

      currentSpeed =
        0;


      movementAccumulator =
        0;


      visibleCount =
        0;


      lastMutationTime =
        0;


      activeOrder =
        shuffle(
          validLines
        );


      validLines.forEach(
        item => {

          item.visible =
            false;


          item.layer.style.transitionDuration =
            instant
              ? "0ms"
              : "220ms";


          item.layer.style.opacity =
            "0";


          item.layer.style.transform =
            "none";

        }
      );


      buildings.forEach(
        building => {

          building.style.transitionDuration =
            instant
              ? "0ms"
              : "220ms";


          building.style.opacity =
            "0";


          building.style.transform =
            "translate(0,0)";

        }
      );


      /*
        Base is always untouched once interaction ends.
      */

      base.style.filter =
        "none";

    }


    /* =====================================================
       DESKTOP EVENTS
       ===================================================== */

    artwork.addEventListener(
      "pointerenter",
      event => {

        if (
          !finePointer.matches ||
          reducedMotion.matches
        ) {

          return;

        }


        pointerInside =
          true;


        /*
          Entering by itself changes NOTHING.
        */

        lastPointer = {
          x:
            event.clientX,

          y:
            event.clientY,

          time:
            performance.now()
        };

      }
    );


    artwork.addEventListener(
      "pointermove",
      event => {

        if (
          !finePointer.matches
        ) {

          return;

        }


        processMovement(
          event
        );

      }
    );


    artwork.addEventListener(
      "pointerleave",
      () => {

        if (
          !finePointer.matches
        ) {

          return;

        }


        pointerInside =
          false;


        lastPointer.time =
          0;


        /*
          Everything except the photograph disappears.
        */

        clearArtwork(
          false
        );

      }
    );


    /* =====================================================
       TOUCH

       A tap acts as one medium-energy gesture.

       Repeated taps bring in more layers.
       ===================================================== */

    artwork.addEventListener(
      "click",
      event => {

        if (
          finePointer.matches ||
          reducedMotion.matches
        ) {

          return;

        }


        event.preventDefault();


        if (
          !activeOrder.length
        ) {

          activeOrder =
            shuffle(
              validLines
            );

        }


        revealNextLines(
          2,
          0.58
        );


        mutateVisibleLines(
          0.58,
          1
        );


        wakeBuilding(
          0.58
        );

      }
    );


    /* =====================================================
       KEYBOARD
       ===================================================== */

    artwork.addEventListener(
      "keydown",
      event => {

        if (
          event.key !==
            "Enter" &&
          event.key !==
            " "
        ) {

          return;

        }


        event.preventDefault();


        if (
          reducedMotion.matches
        ) {

          return;

        }


        revealNextLines(
          2,
          0.50
        );


        mutateVisibleLines(
          0.50,
          1
        );


        wakeBuilding(
          0.50
        );

      }
    );


    /* =====================================================
       REDUCED MOTION
       ===================================================== */

    reducedMotion.addEventListener(
      "change",
      () => {

        clearArtwork(
          false
        );

      }
    );


    /* =====================================================
       START
       ===================================================== */

    prepare();

  })();
  </script>

      );


      lastHorseColorName =
        result.name;

      return result;

    }


    function nextHorseColor(time) {

      return differentHorseColor(
        time < 75
          ? OPENING_COLORS
          : HORSE_COLORS
      );

    }


    function makeSlot(
      id,
      options
    ) {

      const element =
        document.getElementById(id);

      return {

        element,

        frames:
          Array.from(
            element.querySelectorAll(
              ".morph-frame"
            )
          ),

        active: 0,

        ...options,

        nextChange:
          Infinity

      };

    }


    const slots = [

      makeSlot(
        "under-slot-1",
        {
          role: "foundation",
          desktopBlend: "multiply",
          mobileBlend: "multiply",
          internalBlend: "multiply",
          slowDuration: 11.5,
          fastDuration: 2.5,
          phase: 0,
          mobileEnabled: true
        }
      ),

      makeSlot(
        "under-slot-2",
        {
          role: "secondary",
          desktopBlend: "color-burn",
          mobileBlend: "soft-light",
          internalBlend: "overlay",
          slowDuration: 13.5,
          fastDuration: 3,
          phase: 2.4,
          mobileEnabled: true
        }
      ),

      makeSlot(
        "over-slot-1",
        {
          role: "overprint",
          desktopBlend: "hard-light",
          mobileBlend: "soft-light",
          internalBlend: "multiply",
          slowDuration: 9.5,
          fastDuration: 2.4,
          phase: 4.8,
          mobileEnabled: false
        }
      )

    ];


    function neutralTint() {

      return `
        linear-gradient(
          ${random(0, 360)}deg,
          ${pick([
            "#060605",
            "#11100e",
            "#1a1714",
            "#25211c"
          ])} 0%,
          ${pick([
            "#49443d",
            "#5a544b",
            "#6e665b",
            "#7a7164"
          ])} 52%,
          ${pick([
            "#c5bdae",
            "#d2cabc",
            "#ded5c7",
            "#e8dfd1"
          ])} 100%
        )
      `;

    }


    function opacityForSlot(
      slot,
      intensity
    ) {

      if (
        slot.role === "foundation"
      ) {

        return isMobile()
          ? random(
              0.48,
              0.62 + intensity * 0.10
            )
          : random(
              0.60,
              0.78 + intensity * 0.10
            );

      }


      if (
        slot.role === "secondary"
      ) {

        return isMobile()
          ? random(
              0.24,
              0.35 + intensity * 0.13
            )
          : random(
              0.34,
              0.50 + intensity * 0.14
            );

      }


      return random(
        0.08,
        0.16 + intensity * 0.11
      );

    }


    function configureFrame(
      frame,
      slot,
      intensity
    ) {

      frame.style.backgroundImage =
        `
          ${neutralTint()},
          url("${chooseTexture()}")
        `;


      frame.style.backgroundSize =
        "cover, cover";


      frame.style.backgroundRepeat =
        "no-repeat, no-repeat";


      frame.style.backgroundBlendMode =
        `${slot.internalBlend}, normal`;


      frame.style.mixBlendMode =
        isMobile()
          ? slot.mobileBlend
          : slot.desktopBlend;


      frame.style.transform =
        `
          translate(
            ${random(-2, 2)}%,
            ${random(-2, 2)}%
          )
          rotate(
            ${random(-1.5, 1.5)}deg
          )
          scale(
            ${random(1.06, 1.20)}
          )
        `;


      frame.style.filter =
        isMobile()
          ? `
              grayscale(1)
              saturate(0)
              contrast(${random(1.16, 1.42)})
              brightness(${random(0.74, 0.94)})
            `
          : `
              grayscale(1)
              saturate(0)
              contrast(${random(1.28, 1.72)})
              brightness(${random(0.64, 0.92)})
            `;


      frame.dataset.targetOpacity =
        opacityForSlot(
          slot,
          intensity
        ).toFixed(3);

    }


    function initializeSlot(
      slot,
      intensity,
      time
    ) {

      if (
        isMobile() &&
        !slot.mobileEnabled
      ) {

        slot.element.style.display =
          "none";

        return;

      }


      const first =
        slot.frames[0];


      configureFrame(
        first,
        slot,
        intensity
      );


      const fade =
        isMobile() ? 6 : 7;


      first.style.transitionDuration =
        `${fade}s`;


      first.style.opacity =
        first.dataset.targetOpacity;


      slot.nextChange =
        time +
        slot.phase +
        fade;

    }


    function morphSlot(
      slot,
      intensity,
      time
    ) {

      const outgoing =
        slot.frames[
          slot.active
        ];


      const incomingIndex =
        slot.active === 0
          ? 1
          : 0;


      const incoming =
        slot.frames[
          incomingIndex
        ];


      let duration =
        lerp(
          slot.slowDuration,
          slot.fastDuration,
          intensity
        );


      if (
        isMobile()
      ) {

        duration =
          Math.max(
            duration,
            3.2
          );

      }


      incoming.style.opacity =
        "0";


      configureFrame(
        incoming,
        slot,
        intensity
      );


      incoming.offsetHeight;


      incoming.style.transitionDuration =
        `${duration}s`;


      outgoing.style.transitionDuration =
        `${duration}s`;


      requestAnimationFrame(
        () => {

          incoming.style.opacity =
            incoming.dataset.targetOpacity;

          outgoing.style.opacity =
            "0";

        }
      );


      slot.active =
        incomingIndex;


      slot.nextChange =
        time +
        duration * 0.96;

    }


    let nextHorseChange =
      Infinity;


    function applyHorseColor(
      color,
      intensity,
      time
    ) {

      const transition =
        lerp(
          5.8,
          isMobile()
            ? 3.4
            : 2.5,
          intensity
        );


      horseMain.style.transitionDuration =
        `${transition}s`;


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(${color.saturation})
          hue-rotate(${color.hue}deg)
          contrast(${color.contrast})
          brightness(${color.brightness})
        `;


      horseMain.style.opacity =
        "1";


      horseOffset.style.opacity =
        isMobile()
          ? "0"
          : lerp(
              0.02,
              0.06,
              intensity
            ).toFixed(3);


      horseKey.style.opacity =
        isMobile()
          ? lerp(
              0.08,
              0.14,
              intensity
            ).toFixed(3)
          : lerp(
              0.10,
              0.18,
              intensity
            ).toFixed(3);


      nextHorseChange =
        time +
        lerp(
          12,
          isMobile()
            ? 5.2
            : 4,
          intensity
        );

    }


    function prepareInitialHorse() {

      const color =
        differentHorseColor(
          OPENING_COLORS
        );


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(${color.saturation * 1.12})
          hue-rotate(${color.hue}deg)
          contrast(${color.contrast * 1.04})
          brightness(${color.brightness * 1.03})
        `;


      horseMain.style.opacity =
        "0";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";


      nextHorseChange =
        24;

    }


    function normalHorse() {

      horseMain.style.mixBlendMode =
        "normal";

      horseMain.style.filter =
        "none";

      horseMain.style.opacity =
        "1";

      horseOffset.style.opacity =
        "0";

      horseKey.style.opacity =
        "0";

    }


    const HORSE_START = 12;
    const HORSE_FULL = 20;
    const COLLAGE_START = 30;
    const NORMAL_TIME = 243;


    function horseRevealAt(time) {

      if (
        time < HORSE_START
      ) {

        return 0;

      }


      return smoothStep(
        (
          time -
          HORSE_START
        ) /
        (
          HORSE_FULL -
          HORSE_START
        )
      );

    }


    function intensityAt(time) {

      if (
        time < COLLAGE_START ||
        time >= NORMAL_TIME
      ) {

        return 0;

      }


      return clamp(
        (
          time -
          COLLAGE_START
        ) /
        (
          NORMAL_TIME -
          COLLAGE_START
        ),
        0,
        1
      );

    }


    let overlayOpen = false;
    let collageStarted = false;
    let horseStarted = false;
    let normalState = false;
    let raf = null;


    function clearSlots() {

      slots.forEach(
        slot => {

          slot.nextChange =
            Infinity;


          slot.frames.forEach(
            frame => {

              frame.style.opacity =
                "0";

            }
          );

        }
      );

    }


    function visualLoop() {

      if (
        !overlayOpen
      ) {

        return;

      }


      const time =
        audio.currentTime || 0;


      stage.style.setProperty(
        "--visual-reveal",
        horseRevealAt(
          time
        ).toFixed(4)
      );


      if (
        time >= HORSE_START &&
        !horseStarted
      ) {

        horseStarted = true;

        prepareInitialHorse();

      }


      if (
        time >= HORSE_START &&
        time < COLLAGE_START
      ) {

        horseMain.style.opacity =
          horseRevealAt(time);


        if (
          time >= nextHorseChange
        ) {

          applyHorseColor(
            nextHorseColor(time),
            0.08,
            time
          );

        }

      }


      if (
        time >= COLLAGE_START &&
        time < NORMAL_TIME
      ) {

        const intensity =
          intensityAt(time);


        if (
          !collageStarted
        ) {

          collageStarted =
            true;


          slots.forEach(
            slot =>
              initializeSlot(
                slot,
                intensity,
                time
              )
          );


          nextHorseChange =
            time + 8;

        }


        slots.forEach(
          slot => {

            if (
              time >= slot.nextChange
            ) {

              morphSlot(
                slot,
                intensity,
                time
              );

            }

          }
        );


        if (
          time >= nextHorseChange
        ) {

          applyHorseColor(
            nextHorseColor(time),
            intensity,
            time
          );

        }

      }


      if (
        time >= NORMAL_TIME &&
        !normalState
      ) {

        normalState =
          true;

        clearSlots();
        normalHorse();

        stage.classList.add(
          "is-normal"
        );

      }


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    async function openWip() {

      if (
        overlayOpen
      ) {

        return;

      }


      overlayOpen =
        true;

      collageStarted =
        false;

      horseStarted =
        false;

      normalState =
        false;

      recentTextures =
        [];

      lastHorseColorName =
        "";

      clearSlots();
      normalHorse();

      stage.classList.remove(
        "is-normal"
      );

      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );

      prepareTextures();

      pageShell.classList.add(
        "is-hidden"
      );

      overlay.classList.add(
        "is-visible"
      );

      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.currentTime =
        0;

      audio.volume =
        0.72;


      try {

        await audio.play();

      }

      catch {}


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    function closeWip() {

      overlayOpen =
        false;

      cancelAnimationFrame(
        raf
      );

      audio.pause();

      audio.currentTime =
        0;

      clearSlots();
      normalHorse();

      overlay.classList.remove(
        "is-visible"
      );

      overlay.setAttribute(
        "aria-hidden",
        "true"
      );

      pageShell.classList.remove(
        "is-hidden"
      );

    }


    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest("a");


        if (
          !link
        ) {

          return;

        }


        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();

        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>
