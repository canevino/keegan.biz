          <!-- =============================================
               SVG PROCESSING FILTERS

               These preserve alpha and create actual
               quantization rather than fake CSS threshold.
               ============================================= -->

          <svg
            class="fuji-filter-defs"
            aria-hidden="true"
            width="0"
            height="0"
          >

            <defs>

              <!-- posterize 3 -->

              <filter
                id="fuji-posterize-3"
                color-interpolation-filters="sRGB"
              >
                <feComponentTransfer>

                  <feFuncR
                    type="discrete"
                    tableValues="0 .5 1"
                  />

                  <feFuncG
                    type="discrete"
                    tableValues="0 .5 1"
                  />

                  <feFuncB
                    type="discrete"
                    tableValues="0 .5 1"
                  />

                  <feFuncA
                    type="identity"
                  />

                </feComponentTransfer>
              </filter>


              <!-- posterize 4 -->

              <filter
                id="fuji-posterize-4"
                color-interpolation-filters="sRGB"
              >
                <feComponentTransfer>

                  <feFuncR
                    type="discrete"
                    tableValues="0 .33 .66 1"
                  />

                  <feFuncG
                    type="discrete"
                    tableValues="0 .33 .66 1"
                  />

                  <feFuncB
                    type="discrete"
                    tableValues="0 .33 .66 1"
                  />

                  <feFuncA
                    type="identity"
                  />

                </feComponentTransfer>
              </filter>


              <!-- posterize 6 -->

              <filter
                id="fuji-posterize-6"
                color-interpolation-filters="sRGB"
              >
                <feComponentTransfer>

                  <feFuncR
                    type="discrete"
                    tableValues="0 .2 .4 .6 .8 1"
                  />

                  <feFuncG
                    type="discrete"
                    tableValues="0 .2 .4 .6 .8 1"
                  />

                  <feFuncB
                    type="discrete"
                    tableValues="0 .2 .4 .6 .8 1"
                  />

                    type="identity"

              </filter>


              <!-- threshold low -->

              <filter
                id="fuji-threshold-low"
                color-interpolation-filters="sRGB"
              >
                <feComponentTransfer>

                  <feFuncR
                    type="discrete"
                    tableValues="0 1 1 1 1 1 1 1"
                  />

                  <feFuncG
                    type="discrete"
                    tableValues="0 1 1 1 1 1 1 1"
                  />

                  <feFuncB
                    type="discrete"
                    tableValues="0 1 1 1 1 1 1 1"
                  />

                    type="identity"
                  />

              </filter>


              <!-- threshold middle -->

                id="fuji-threshold-mid"
                color-interpolation-filters="sRGB"

                    type="discrete"
                    tableValues="0 0 0 0 1 1 1 1"

                    type="discrete"
                    tableValues="0 0 0 0 1 1 1 1"

                    type="discrete"

  <!-- =====================================================

  <script>
  (() => {

    /* =====================================================
       TITLE COLOR
       ===================================================== */

    const photoTitle =
      document.getElementById(
        "photo-title"
      );


    const titleColors = [
      "#fdb913",
      "#006a44",
      "#c1272d"
    ];


    let titleColorIndex = 0;
    let titleBusy = false;


    function differentIndex(
      length,
      current
    ) {

      let next;

      do {

        next =
          Math.floor(
            Math.random() *
            length
          );

      }
      while (
        length > 1 &&
        next === current
      );

      return next;

    }


    function changeTitleColor() {

      if (titleBusy) {
        return;
      }


      titleBusy = true;


      const nextColor =
        differentIndex(
          titleColors.length,
          titleColorIndex
        );


      photoTitle.classList.add(
        "is-fading"
      );


      window.setTimeout(() => {

        titleColorIndex =
          nextColor;


        photoTitle.style.color =
          titleColors[
            titleColorIndex
          ];


        photoTitle.classList.remove(
          "is-fading"
        );


        window.setTimeout(() => {

          titleBusy = false;

        }, 300);

      }, 250);

    }


    photoTitle.style.color =
      titleColors[0];


    window.setInterval(
      changeTitleColor,
      2500
    );


    /* =====================================================
       FUJI ARTWORK
       ===================================================== */

    const artwork =
      document.getElementById(
        "fuji-interactive"
      );


    const base =
      document.getElementById(
        "fuji-base"
      );


    const lines =
      Array.from(
        document.querySelectorAll(
          ".fuji-line"
        )
      );


    const buildingScreen =
      document.getElementById(
        "fuji-building-screen"
      );


    const buildingHard =
      document.getElementById(
        "fuji-building-hard"
      );


    const buildingDifference =
      document.getElementById(
        "fuji-building-difference"
      );


    const buildings = [
      buildingScreen,
      buildingHard,
      buildingDifference
    ];


    const finePointer =
      window.matchMedia(
        "(hover: hover) and (pointer: fine)"
      );


    const reducedMotion =
      window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      );


    /* =====================================================
       HELPERS
       ===================================================== */

    const clamp = (value, min, max) =>
      Math.min(
        Math.max(value, min),
        max
      );


    const random = (min, max) =>
      min +
      (
        Math.random() *
        (max - min)
      );


    const pick = array =>
      array[
        Math.floor(
          Math.random() *
          array.length
        )
      ];


    function shuffle(array) {

      const result =
        [...array];


      for (
        let i = result.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }


      return result;

    }


    function weightedPick(entries) {

      const total =
        entries.reduce(
          (sum, item) =>
            sum + item.weight,
          0
        );


      let value =
        Math.random() *
        total;


      for (
        const item of entries
      ) {

        value -=
          item.weight;


        if (
          value <= 0
        ) {

          return item.value;

        }

      }


      return entries[
        entries.length - 1
      ].value;

    }


    function wait(ms) {

      return new Promise(
        resolve =>
          window.setTimeout(
            resolve,
            ms
          )
      );

    }


    function waitForImage(image) {

      if (
        image.complete &&
        image.naturalWidth > 0
      ) {

        return Promise.resolve(
          image
        );

      }


      return new Promise(
        (resolve, reject) => {

          image.addEventListener(
            "load",
            () => resolve(image),
            {
              once: true
            }
          );


          image.addEventListener(
            "error",
            reject,
            {
              once: true
            }
          );

        }
      );

    }


    /* =====================================================
       DIMENSION VALIDATION

       Do not guess positions for cropped layers.
       ===================================================== */

    let validLines = [];
    let buildingValid = false;


    async function validateLayers() {

      try {

        await Promise.all([
          waitForImage(base),
          ...lines.map(
            waitForImage
          ),
          waitForImage(
            buildingScreen
          )
        ]);

      }

      catch (error) {

        console.error(
          "One or more Fuji artwork assets failed to load.",
          error
        );

        return;

      }


      const width =
        base.naturalWidth;


      const height =
        base.naturalHeight;


      console.log(
        `Fuji base canvas: ${width} × ${height}`
      );


      validLines =
        lines.filter(line => {

          const valid =
            (
              line.naturalWidth ===
                width &&
              line.naturalHeight ===
                height
            );


          if (!valid) {

            line.style.display =
              "none";


            console.warn(
              `line${line.dataset.line}.png is ${line.naturalWidth} × ${line.naturalHeight}, not ${width} × ${height}. ` +
              `I am not guessing its position. I need Photoshop x, y, width and height for this layer.`
            );

          }


          return valid;

        });


      buildingValid =
        (
          buildingScreen.naturalWidth ===
            width &&
          buildingScreen.naturalHeight ===
            height
        );


      if (!buildingValid) {

        buildings.forEach(
          building => {

            building.style.display =
              "none";

          }
        );


        console.warn(
          `building.png is ${buildingScreen.naturalWidth} × ${buildingScreen.naturalHeight}, not ${width} × ${height}. ` +
          `I need its Photoshop x, y, width and height rather than guessing its placement.`
        );

      }


      if (
        validLines.length ===
        lines.length
      ) {

        console.log(
          "All 13 line PNGs match the base canvas and can be stacked at inset: 0."
        );

      }


      findBuildingCenter();


      if (
        reducedMotion.matches
      ) {

        setReducedMotionState();

      }

      else {

        setRestState(
          true
        );

      }

    }


    /* =====================================================
       BUILDING CENTER

       Infer architectural center from building alpha,
       rather than hard-coding a mouse hotspot.
       ===================================================== */

    let buildingCenter = {
      x: 0.5,
      y: 0.5
    };


    function findBuildingCenter() {

      if (
        !buildingValid
      ) {

        return;

      }


      try {

        const canvas =
          document.createElement(
            "canvas"
          );


        const sampleWidth =
          240;


        const sampleHeight =
          Math.round(
            sampleWidth *
            (
              buildingScreen.naturalHeight /
              buildingScreen.naturalWidth
            )
          );


        canvas.width =
          sampleWidth;


        canvas.height =
          sampleHeight;


        const context =
          canvas.getContext(
            "2d",
            {
              willReadFrequently: true
            }
          );


        context.drawImage(
          buildingScreen,
          0,
          0,
          sampleWidth,
          sampleHeight
        );


        const data =
          context.getImageData(
            0,
            0,
            sampleWidth,
            sampleHeight
          ).data;


        let minX =
          sampleWidth;


        let minY =
          sampleHeight;


        let maxX =
          0;


        let maxY =
          0;


        let found =
          false;


        for (
          let y = 0;
          y < sampleHeight;
          y++
        ) {

          for (
            let x = 0;
            x < sampleWidth;
            x++
          ) {

            const alpha =
              data[
                (
                  (
                    y *
                    sampleWidth
                  ) +
                  x
                ) *
                4 +
                3
              ];


            if (
              alpha > 18
            ) {

              found =
                true;


              minX =
                Math.min(
                  minX,
                  x
                );


              minY =
                Math.min(
                  minY,
                  y
                );


              maxX =
                Math.max(
                  maxX,
                  x
                );


              maxY =
                Math.max(
                  maxY,
                  y
                );

            }

          }

        }


        if (
          found
        ) {

          buildingCenter = {

            x:
              (
                (
                  minX +
                  maxX
                ) /
                2
              ) /
              sampleWidth,

            y:
              (
                (
                  minY +
                  maxY
                ) /
                2
              ) /
              sampleHeight

          };

        }

      }

      catch (error) {

        /*
          Cross-origin/security errors should not happen
          on GitHub Pages because these assets are local,
          but center fallback remains 0.5 / 0.5.
        */

      }

    }


    /* =====================================================
       LINE PROCESSING
       ===================================================== */

    const posterizeFilters = [
      "#fuji-posterize-3",
      "#fuji-posterize-4",
      "#fuji-posterize-6"
    ];


    const thresholdFilters = [
      "#fuji-threshold-low",
      "#fuji-threshold-mid",
      "#fuji-threshold-high"
    ];


    function chooseProcessing(
      energy,
      forceStrong = false
    ) {

      const boost =
        forceStrong
          ? 18
          : (
              energy *
              10
            );


      return weightedPick([

        {
          value:
            "exposed",
          weight:
            30
        },

        {
          value:
            "normal",
          weight:
            25
        },

        {
          value:
            "posterized",
          weight:
            18 +
            (
              energy *
              7
            )
        },

        {
          value:
            "threshold",
          weight:
            7 +
            boost
        },

        {
          value:
            "bleached",
          weight:
            9
        },

        {
          value:
            "hard",
          weight:
            7 +
            (
              energy *
              6
            )
        },

        {
          value:
            "inverted",
          weight:
            1 +
            (
              forceStrong
                ? 4
                : energy * 2
            )
        }

      ]);

    }


    function chooseBlendMode(
      energy,
      forceStrong = false
    ) {

      const extreme =
        forceStrong
          ? 14
          : (
              energy *
              8
            );


      return weightedPick([

        {
          value:
            "normal",
          weight:
            24
        },

        {
          value:
            "screen",
          weight:
            22
        },

        {
          value:
            "multiply",
          weight:
            19
        },

        {
          value:
            "hard-light",
          weight:
            16
        },

        {
          value:
            "overlay",
          weight:
            12
        },

        {
          value:
            "difference",
          weight:
            2 +
            extreme
        },

        {
          value:
            "exclusion",
          weight:
            3 +
            (
              energy *
              3
            )
        },

        {
          value:
            "color-dodge",
          weight:
            2 +
            (
              forceStrong
                ? 5
                : energy * 2
            )
        }

      ]);

    }


    function createFilter(
      state,
      energy
    ) {

      if (
        state ===
        "normal"
      ) {

        return `
          brightness(${random(0.96, 1.13)})
          contrast(${random(0.98, 1.20)})
          saturate(${random(0.88, 1.08)})
        `;

      }


      if (
        state ===
        "exposed"
      ) {

        return `
          brightness(${random(
            1.15,
            1.55 +
            (
              energy *
              0.55
            )
          )})
          contrast(${random(1.05, 1.45)})
          saturate(${random(0.82, 1.14)})
        `;

      }


      if (
        state ===
        "posterized"
      ) {

        return `
          url("${pick(
            posterizeFilters
          )}")
          brightness(${random(0.95, 1.35)})
          contrast(${random(1.05, 1.45)})
          saturate(${random(0.88, 1.14)})
        `;

      }


      if (
        state ===
        "threshold"
      ) {

        return `
          url("${pick(
            thresholdFilters
          )}")
          brightness(${random(0.90, 1.24)})
          contrast(${random(1.0, 1.28)})
        `;

      }


      if (
        state ===
        "bleached"
      ) {

        return `
          brightness(${random(1.30, 1.78)})
          contrast(${random(0.88, 1.14)})
          saturate(${random(0.42, 0.78)})
        `;

      }


      if (
        state ===
        "hard"
      ) {

        return `
          brightness(${random(0.82, 1.15)})
          contrast(${random(1.55, 2.35)})
          saturate(${random(0.88, 1.20)})
        `;

      }


      return `
        invert(1)
        brightness(${random(0.92, 1.15)})
        contrast(${random(1.12, 1.42)})
        saturate(${random(0.78, 1.10)})
      `;

    }


    function opacityForLine(
      blend,
      energy
    ) {

      let opacity =
        random(
          0.30,
          0.70 +
          (
            energy *
            0.18
          )
        );


      if (
        blend ===
        "difference" ||
        blend ===
        "color-dodge"
      ) {

        opacity *=
          random(
            0.50,
            0.76
          );

      }


      return clamp(
        opacity,
        0.16,
        0.92
      );

    }


    function configureLine(
      line,
      energy,
      forceStrong = false
    ) {

      const processing =
        chooseProcessing(
          energy,
          forceStrong
        );


      const blend =
        chooseBlendMode(
          energy,
          forceStrong
        );


      const opacity =
        opacityForLine(
          blend,
          energy
        );


      line.style.mixBlendMode =
        blend;


      line.style.filter =
        createFilter(
          processing,
          energy
        );


      line.dataset.targetOpacity =
        opacity.toFixed(3);


      line.dataset.processing =
        processing;


      line.dataset.blend =
        blend;

    }


    /* =====================================================
       ENERGY
       ===================================================== */

    let pointerInside =
      false;


    let energy =
      0;


    let targetEnergy =
      0;


    let speedEnergy =
      0;


    let lastPointer = {
      x: 0,
      y: 0,
      time: 0
    };


    let lastBurst =
      0;


    function updatePointerEnergy(
      event
    ) {

      const rect =
        artwork.getBoundingClientRect();


      const x =
        clamp(
          (
            event.clientX -
            rect.left
          ) /
          rect.width,
          0,
          1
        );


      const y =
        clamp(
          (
            event.clientY -
            rect.top
          ) /
          rect.height,
          0,
          1
        );


      const dx =
        x -
        buildingCenter.x;


      const dy =
        y -
        buildingCenter.y;


      const distance =
        Math.sqrt(
          (
            dx *
            dx
          ) +
          (
            dy *
            dy
          )
        );


      const proximity =
        1 -
        clamp(
          distance /
          0.62,
          0,
          1
        );


      const now =
        performance.now();


      if (
        lastPointer.time > 0
      ) {

        const pixelDX =
          event.clientX -
          lastPointer.x;


        const pixelDY =
          event.clientY -
          lastPointer.y;


        const elapsed =
          Math.max(
            16,
            now -
            lastPointer.time
          );


        const speed =
          (
            Math.sqrt(
              (
                pixelDX *
                pixelDX
              ) +
              (
                pixelDY *
                pixelDY
              )
            )
          ) /
          elapsed;


        speedEnergy =
          clamp(
            speed /
            1.45,
            0,
            1
          );

      }


      lastPointer = {
        x:
          event.clientX,

        y:
          event.clientY,

        time:
          now
      };


      targetEnergy =
        clamp(
          0.12 +
          (
            proximity *
            0.76
          ) +
          (
            speedEnergy *
            0.30
          ),
          0,
          1
        );


      /*
        Very fast movement can create one rare
        strong photographic interruption.
      */

      if (
        speedEnergy > 0.72 &&
        (
          now -
          lastBurst
        ) > 650 &&
        active &&
        !reducedMotion.matches
      ) {

        lastBurst =
          now;


        const candidates =
          shuffle(
            validLines
          ).slice(
            0,
            Math.random() < 0.22
              ? 2
              : 1
          );


        candidates.forEach(
          line => {

            mutateLine(
              line,
              true
            );

          }
        );

      }

    }


    /* =====================================================
       BUILDING / BASE RENDER LOOP
       ===================================================== */

    function renderEnergy() {

      const smoothing =
        pointerInside
          ? 0.085
          : 0.045;


      energy +=
        (
          targetEnergy -
          energy
        ) *
        smoothing;


      speedEnergy *=
        0.92;


      /*
        Photograph stays stable.
      */

      base.style.filter =
        `
          brightness(${1 + (energy * 0.025)})
          contrast(${1 + (energy * 0.045)})
          saturate(${1 - (energy * 0.03)})
        `;


      if (
        buildingValid
      ) {

        const screenOpacity =
          0.055 +
          (
            energy *
            0.30
          );


        const hardOpacity =
          Math.max(
            0,
            energy -
            0.16
          ) *
          0.66;


        const differenceOpacity =
          Math.max(
            0,
            energy -
            0.68
          ) *
          (
            finePointer.matches
              ? 0.54
              : 0.24
          );


        buildingScreen.style.opacity =
          screenOpacity.toFixed(3);


        buildingHard.style.opacity =
          hardOpacity.toFixed(3);


        buildingDifference.style.opacity =
          differenceOpacity.toFixed(3);


        /*
          Tiny registration error only.
        */

        const drift =
          energy *
          2.4;


        buildingScreen.style.transform =
          `translate(${(-drift * 0.35).toFixed(2)}px, ${(drift * 0.20).toFixed(2)}px)`;


        buildingHard.style.transform =
          `translate(${(drift * 0.55).toFixed(2)}px, ${(-drift * 0.25).toFixed(2)}px)`;


        buildingDifference.style.transform =
          `translate(${(-drift * 0.70).toFixed(2)}px, ${(-drift * 0.45).toFixed(2)}px)`;

      }


      requestAnimationFrame(
        renderEnergy
      );

    }


    requestAnimationFrame(
      renderEnergy
    );


    /* =====================================================
       RECONSTRUCTION
       ===================================================== */

    let active =
      false;


    let reconstructionToken =
      0;


    let mutationTimer =
      null;


    let settleToken =
      0;


    async function reconstruct(
      startMutationAfter = true
    ) {

      if (
        validLines.length === 0
      ) {

        return;

      }


      active =
        true;


      settleToken++;


      const token =
        ++reconstructionToken;


      clearTimeout(
        mutationTimer
      );


      /*
        Existing drawing sinks briefly back into
        the photograph before reconstructing.
      */

      validLines.forEach(
        line => {

          line.style.transitionDuration =
            "320ms";


          line.style.opacity =
            "0";

        }
      );


      await wait(280);


      if (
        token !==
        reconstructionToken
      ) {

        return;

      }


      const order =
        shuffle(
          validLines
        );


      for (
        const line of order
      ) {

        if (
          token !==
          reconstructionToken
        ) {

          return;

        }


        configureLine(
          line,
          energy,
          false
        );


        const transition =
          random(
            180,
            700
          );


        line.style.transitionDuration =
          `${transition}ms`;


        line.style.opacity =
          line.dataset.targetOpacity;


        let gap =
          random(
            60,
            320
          );


        /*
          Occasional breath in the sequence.
        */

        if (
          Math.random() < 0.13
        ) {

          gap +=
            random(
              180,
              420
            );

        }


        await wait(
          gap
        );

      }


      if (
        startMutationAfter &&
        finePointer.matches &&
        pointerInside &&
        !reducedMotion.matches
      ) {

        scheduleMutation();

      }

    }


    /* =====================================================
       CONTROLLED MUTATION
       ===================================================== */

    function mutateLine(
      line,
      forceStrong = false
    ) {

      if (
        !line ||
        reducedMotion.matches
      ) {

        return;

      }


      const currentOpacity =
        parseFloat(
          getComputedStyle(
            line
          ).opacity
        ) || 0;


      const dipDuration =
        random(
          120,
          230
        );


      line.style.transitionDuration =
        `${dipDuration}ms`;


      line.style.opacity =
        Math.min(
          currentOpacity * 0.55,
          0.24
        );


      window.setTimeout(
        () => {

          if (
            !active
          ) {

            return;

          }


          configureLine(
            line,
            energy,
            forceStrong
          );


          line.style.transitionDuration =
            `${random(260, 680)}ms`;


          line.style.opacity =
            line.dataset.targetOpacity;

        },
        dipDuration * 0.72
      );

    }


    function scheduleMutation() {

      clearTimeout(
        mutationTimer
      );


      if (
        !active ||
        !pointerInside ||
        reducedMotion.matches
      ) {

        return;

      }


      const delay =
        random(
          500,
          1400 -
          (
            energy *
            420
          )
        );


      mutationTimer =
        window.setTimeout(
          () => {

            if (
              !active ||
              !pointerInside
            ) {

              return;

            }


            const roll =
              Math.random();


            const count =
              roll < 0.76
                ? 1
                : (
                    roll < 0.96
                      ? 2
                      : 3
                  );


            const chosen =
              shuffle(
                validLines
              ).slice(
                0,
                count
              );


            chosen.forEach(
              line => {

                mutateLine(
                  line,
                  false
                );

              }
            );


            scheduleMutation();

          },
          delay
        );

    }


    /* =====================================================
       SETTLE / REST
       ===================================================== */

    function setRestState(
      instant = false
    ) {

      if (
        validLines.length === 0
      ) {

        return;

      }


      active =
        false;


      targetEnergy =
        0;


      clearTimeout(
        mutationTimer
      );


      reconstructionToken++;


      const visibleAtRest =
        shuffle(
          validLines
        ).slice(
          0,
          Math.min(
            3,
            validLines.length
          )
        );


      validLines.forEach(
        line => {

          const keep =
            visibleAtRest.includes(
              line
            );


          line.style.mixBlendMode =
            keep
              ? pick([
                  "screen",
                  "multiply",
                  "normal"
                ])
              : "normal";


          line.style.filter =
            keep
              ? `
                  brightness(${random(0.96, 1.10)})
                  contrast(${random(1.0, 1.16)})
                `
              : "none";


          line.style.transitionDuration =
            instant
              ? "0ms"
              : `${random(700, 1400)}ms`;


          line.style.opacity =
            keep
              ? random(
                  0.035,
                  0.095
                )
              : "0";

        }
      );

    }


    function settleAfterLeave() {

      const token =
        ++settleToken;


      active =
        false;


      reconstructionToken++;


      clearTimeout(
        mutationTimer
      );


      targetEnergy =
        0;


      const order =
        shuffle(
          validLines
        );


      order.forEach(
        (line, index) => {

          const delay =
            random(
              0,
              950
            ) +
            (
              index *
              random(
                20,
                65
              )
            );


          window.setTimeout(
            () => {

              if (
                token !==
                settleToken
              ) {

                return;

              }


              line.style.transitionDuration =
                `${random(650, 1300)}ms`;


              line.style.filter =
                `
                  brightness(${random(0.98, 1.07)})
                  contrast(${random(1, 1.10)})
                `;


              line.style.mixBlendMode =
                pick([
                  "normal",
                  "screen",
                  "multiply"
                ]);


              line.style.opacity =
                "0";

            },
            delay
          );

      });


      /*
        After the drawing has receded, leave a
        few faint traces rather than a hard reset.
      */

      window.setTimeout(
        () => {

          if (
            token !==
            settleToken
          ) {

            return;

          }


          setRestState(
            false
          );

        },
        2100
      );

    }


    /* =====================================================
       REDUCED MOTION
       ===================================================== */

    function setReducedMotionState() {

      reconstructionToken++;


      clearTimeout(
        mutationTimer
      );


      active =
        false;


      targetEnergy =
        0;


      validLines.forEach(
        line => {

          line.style.opacity =
            "0";


          line.style.filter =
            "none";


          line.style.mixBlendMode =
            "normal";

        }
      );


      shuffle(
        validLines
      )
        .slice(
          0,
          Math.min(
            4,
            validLines.length
          )
        )
        .forEach(
          (line, index) => {

            line.style.mixBlendMode =
              index % 2 === 0
                ? "screen"
                : "multiply";


            line.style.opacity =
              0.08 +
              (
                index *
                0.025
              );

          }
        );


      if (
        buildingValid
      ) {

        buildingScreen.style.opacity =
          "0.12";


        buildingHard.style.opacity =
          "0";


        buildingDifference.style.opacity =
          "0";

      }

    }


    /* =====================================================
       DESKTOP POINTER
       ===================================================== */

    artwork.addEventListener(
      "pointerenter",
      event => {

        if (
          !finePointer.matches ||
          reducedMotion.matches
        ) {

          return;

        }


        pointerInside =
          true;


        updatePointerEnergy(
          event
        );


        reconstruct(
          true
        );

      }
    );


    artwork.addEventListener(
      "pointermove",
      event => {

        if (
          !finePointer.matches ||
          reducedMotion.matches
        ) {

          return;

        }


        updatePointerEnergy(
          event
        );

      }
    );


    artwork.addEventListener(
      "pointerleave",
      () => {

        if (
          !finePointer.matches ||
          reducedMotion.matches
        ) {

          return;

        }


        pointerInside =
          false;


        lastPointer.time =
          0;


        settleAfterLeave();

      }
    );


    /* =====================================================
       TOUCH

       Tap reconstructs.
       No perpetual mutation loop.
       ===================================================== */

    artwork.addEventListener(
      "click",
      event => {

        if (
          finePointer.matches ||
          reducedMotion.matches
        ) {

          return;

        }


        event.preventDefault();


        targetEnergy =
          0.62;


        reconstruct(
          false
        );


        window.setTimeout(
          () => {

            targetEnergy =
              0.12;

          },
          1900
        );

      }
    );


    /* =====================================================
       KEYBOARD
       ===================================================== */

    artwork.addEventListener(
      "keydown",
      event => {

        if (
          event.key !== "Enter" &&
          event.key !== " "
        ) {

          return;

        }


        event.preventDefault();


        if (
          reducedMotion.matches
        ) {

          setReducedMotionState();

          return;

        }


        targetEnergy =
          0.55;


        reconstruct(
          false
        );


        window.setTimeout(
          () => {

            targetEnergy =
              0.12;

          },
          2000
        );

      }
    );


    reducedMotion.addEventListener(
      "change",
      () => {

        if (
          reducedMotion.matches
        ) {

          setReducedMotionState();

        }

        else {

          setRestState(
            false
          );

        }

      }
    );


    /* =====================================================
       START
       ===================================================== */

    validateLayers();

  })();
  </script>

        saturation: 1.95,
        brightness: 0.78,
        contrast: 1.24
      },

      {
        name: "pale sage",
        hue: 67,
        saturation: 1.72,
        brightness: 1.08,
        contrast: 1.05
      },

      {
        name: "blueberry",
        hue: 187,
        saturation: 3.05,
        brightness: 0.82,
        contrast: 1.27
      }

    ];


    const OPENING_COLORS = [
      HORSE_COLORS[0],
      HORSE_COLORS[1],
      HORSE_COLORS[2],
      HORSE_COLORS[3],
      HORSE_COLORS[6]
    ];


    const EARLY_COLORS = [
      HORSE_COLORS[0],
      HORSE_COLORS[1],
      HORSE_COLORS[2],
      HORSE_COLORS[3],
      HORSE_COLORS[6]
    ];


    let lastHorseColorName = "";


    function differentHorseColor(
      pool
    ) {

      let result;
      let attempts = 0;


      do {

        result =
          pick(pool);


        attempts++;

      }
      while (
        result.name ===
          lastHorseColorName &&
        attempts < 12
      );


      lastHorseColorName =
        result.name;


      return result;

    }


    function nextHorseColor(
      time
    ) {

      return differentHorseColor(
        time < 75
          ? EARLY_COLORS
          : HORSE_COLORS
      );

    }


    function makeSlot(
      id,
      options
    ) {

      const element =
        document.getElementById(
          id
        );


      return {

        element,

        frames:
          Array.from(
            element.querySelectorAll(
              ".morph-frame"
            )
          ),

        active: 0,

        ...options,

        nextChange:
          Infinity

      };

    }


    const slots = [

      makeSlot(
        "under-slot-1",
        {
          role: "foundation",
          desktopBlend: "multiply",
          mobileBlend: "multiply",
          internalBlend: "multiply",
          slowDuration: 11.5,
          fastDuration: 2.5,
          phase: 0,
          mobileEnabled: true
        }
      ),

      makeSlot(
        "under-slot-2",
        {
          role: "secondary",
          desktopBlend: "color-burn",
          mobileBlend: "soft-light",
          internalBlend: "overlay",
          slowDuration: 13.5,
          fastDuration: 3,
          phase: 2.4,
          mobileEnabled: true
        }
      ),

      makeSlot(
        "over-slot-1",
        {
          role: "overprint",
          desktopBlend: "hard-light",
          mobileBlend: "soft-light",
          internalBlend: "multiply",
          slowDuration: 9.5,
          fastDuration: 2.4,
          phase: 4.8,
          mobileEnabled: false
        }
      )

    ];


    function neutralTint() {

      return `
        linear-gradient(
          ${random(0, 360)}deg,
          ${pick([
            "#060605",
            "#11100e",
            "#1a1714",
            "#25211c"
          ])} 0%,
          ${pick([
            "#49443d",
            "#5a544b",
            "#6e665b",
            "#7a7164"
          ])} 52%,
          ${pick([
            "#c5bdae",
            "#d2cabc",
            "#ded5c7",
            "#e8dfd1"
          ])} 100%
        )
      `;

    }


    function opacityForSlot(
      slot,
      intensity
    ) {

      if (
        slot.role ===
        "foundation"
      ) {

        return isMobile()
          ? random(
              0.48,
              0.62 +
              (
                intensity *
                0.10
              )
            )
          : random(
              0.60,
              0.78 +
              (
                intensity *
                0.10
              )
            );

      }


      if (
        slot.role ===
        "secondary"
      ) {

        return isMobile()
          ? random(
              0.24,
              0.35 +
              (
                intensity *
                0.13
              )
            )
          : random(
              0.34,
              0.50 +
              (
                intensity *
                0.14
              )
            );

      }


      return random(
        0.08,
        0.16 +
        (
          intensity *
          0.11
        )
      );

    }


    function configureFrame(
      frame,
      slot,
      intensity
    ) {

      frame.style.backgroundImage =
        `
          ${neutralTint()},
          url("${chooseTexture()}")
        `;


      frame.style.backgroundSize =
        "cover, cover";


      frame.style.backgroundBlendMode =
        `${slot.internalBlend}, normal`;


      frame.style.mixBlendMode =
        isMobile()
          ? slot.mobileBlend
          : slot.desktopBlend;


      frame.style.transform =
        `
          translate(
            ${random(-2, 2)}%,
            ${random(-2, 2)}%
          )
          rotate(
            ${random(-1.5, 1.5)}deg
          )
          scale(
            ${random(1.06, 1.20)}
          )
        `;


      frame.style.filter =
        isMobile()
          ? `
              grayscale(1)
              saturate(0)
              contrast(${random(1.16, 1.42)})
              brightness(${random(0.74, 0.94)})
            `
          : `
              grayscale(1)
              saturate(0)
              contrast(${random(1.28, 1.72)})
              brightness(${random(0.64, 0.92)})
            `;


      frame.dataset.targetOpacity =
        opacityForSlot(
          slot,
          intensity
        ).toFixed(3);

    }


    function initializeSlot(
      slot,
      intensity,
      time
    ) {

      if (
        isMobile() &&
        !slot.mobileEnabled
      ) {

        slot.element.style.display =
          "none";

        return;

      }


      const first =
        slot.frames[0];


      configureFrame(
        first,
        slot,
        intensity
      );


      first.style.transitionDuration =
        `${isMobile() ? 6 : 7}s`;


      first.style.opacity =
        first.dataset.targetOpacity;


      slot.nextChange =
        time +
        slot.phase +
        (
          isMobile()
            ? 6
            : 7
        );

    }


    function morphSlot(
      slot,
      intensity,
      time
    ) {

      const outgoing =
        slot.frames[
          slot.active
        ];


      const incomingIndex =
        slot.active === 0
          ? 1
          : 0;


      const incoming =
        slot.frames[
          incomingIndex
        ];


      let duration =
        lerp(
          slot.slowDuration,
          slot.fastDuration,
          intensity
        );


      if (
        isMobile()
      ) {

        duration =
          Math.max(
            duration,
            3.2
          );

      }


      incoming.style.opacity =
        "0";


      configureFrame(
        incoming,
        slot,
        intensity
      );


      incoming.offsetHeight;


      incoming.style.transitionDuration =
        `${duration}s`;


      outgoing.style.transitionDuration =
        `${duration}s`;


      requestAnimationFrame(() => {

        incoming.style.opacity =
          incoming.dataset.targetOpacity;


        outgoing.style.opacity =
          "0";

      });


      slot.active =
        incomingIndex;


      slot.nextChange =
        time +
        (
          duration *
          0.96
        );

    }


    let nextHorseChange =
      Infinity;


    function applyHorseColor(
      color,
      intensity,
      time
    ) {

      const transition =
        lerp(
          5.8,
          isMobile()
            ? 3.4
            : 2.5,
          intensity
        );


      horseMain.style.transitionDuration =
        `${transition}s`;


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(${color.saturation})
          hue-rotate(${color.hue}deg)
          contrast(${color.contrast})
          brightness(${color.brightness})
        `;


      horseMain.style.opacity =
        "1";


      horseOffset.style.opacity =
        isMobile()
          ? "0"
          : lerp(
              0.02,
              0.06,
              intensity
            ).toFixed(3);


      horseKey.style.opacity =
        isMobile()
          ? lerp(
              0.08,
              0.14,
              intensity
            ).toFixed(3)
          : lerp(
              0.10,
              0.18,
              intensity
            ).toFixed(3);


      nextHorseChange =
        time +
        lerp(
          12,
          isMobile()
            ? 5.2
            : 4,
          intensity
        );

    }


    function prepareInitialHorse() {

      const color =
        differentHorseColor(
          OPENING_COLORS
        );


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(${color.saturation * 1.12})
          hue-rotate(${color.hue}deg)
          contrast(${color.contrast * 1.04})
          brightness(${color.brightness * 1.03})
        `;


      horseMain.style.opacity =
        "0";


      nextHorseChange =
        24;

    }


    function normalHorse() {

      horseMain.style.mixBlendMode =
        "normal";


      horseMain.style.filter =
        "none";


      horseMain.style.opacity =
        "1";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";

    }


    const HORSE_START = 12;
    const HORSE_FULL = 20;
    const COLLAGE_START = 30;
    const NORMAL_TIME = 243;


    function horseRevealAt(
      time
    ) {

      if (
        time < HORSE_START
      ) {

        return 0;

      }


      return smoothStep(
        (
          time -
          HORSE_START
        ) /
        (
          HORSE_FULL -
          HORSE_START
        )
      );

    }


    function intensityAt(
      time
    ) {

      if (
        time < COLLAGE_START ||
        time >= NORMAL_TIME
      ) {

        return 0;

      }


      return clamp(
        (
          time -
          COLLAGE_START
        ) /
        (
          NORMAL_TIME -
          COLLAGE_START
        ),
        0,
        1
      );

    }


    let overlayOpen = false;
    let collageStarted = false;
    let horseStarted = false;
    let normalState = false;
    let raf = null;


    function clearSlots() {

      slots.forEach(slot => {

        slot.nextChange =
          Infinity;


        slot.frames.forEach(
          frame => {

            frame.style.opacity =
              "0";

          }
        );

      });

    }


    function visualLoop() {

      if (
        !overlayOpen
      ) {

        return;

      }


      const time =
        audio.currentTime || 0;


      stage.style.setProperty(
        "--visual-reveal",
        horseRevealAt(
          time
        ).toFixed(4)
      );


      if (
        time >= HORSE_START &&
        !horseStarted
      ) {

        horseStarted =
          true;


        prepareInitialHorse();

      }


      if (
        time >= HORSE_START &&
        time < COLLAGE_START
      ) {

        horseMain.style.opacity =
          horseRevealAt(
            time
          );


        if (
          time >= nextHorseChange
        ) {

          applyHorseColor(
            nextHorseColor(
              time
            ),
            0.08,
            time
          );

        }

      }


      if (
        time >= COLLAGE_START &&
        time < NORMAL_TIME
      ) {

        const intensity =
          intensityAt(
            time
          );


        if (
          !collageStarted
        ) {

          collageStarted =
            true;


          slots.forEach(
            slot =>
              initializeSlot(
                slot,
                intensity,
                time
              )
          );


          nextHorseChange =
            time + 8;

        }


        slots.forEach(slot => {

          if (
            time >=
            slot.nextChange
          ) {

            morphSlot(
              slot,
              intensity,
              time
            );

          }

        });


        if (
          time >=
          nextHorseChange
        ) {

          applyHorseColor(
            nextHorseColor(
              time
            ),
            intensity,
            time
          );

        }

      }


      if (
        time >= NORMAL_TIME &&
        !normalState
      ) {

        normalState =
          true;


        clearSlots();


        normalHorse();


        stage.classList.add(
          "is-normal"
        );

      }


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    async function openWip() {

      if (
        overlayOpen
      ) {

        return;

      }


      overlayOpen =
        true;


      collageStarted =
        false;


      horseStarted =
        false;


      normalState =
        false;


      lastHorseColorName =
        "";


      clearSlots();


      normalHorse();


      stage.classList.remove(
        "is-normal"
      );


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      prepareTextures();


      pageShell.classList.add(
        "is-hidden"
      );


      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.currentTime =
        0;


      audio.volume =
        0.72;


      try {

        await audio.play();

      }

      catch (error) {}


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    function closeWip() {

      overlayOpen =
        false;


      cancelAnimationFrame(
        raf
      );


      audio.pause();


      audio.currentTime =
        0;


      clearSlots();


      normalHorse();


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      pageShell.classList.remove(
        "is-hidden"
      );

    }


    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );


        if (!link) {
          return;
        }


        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Escape" &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>
