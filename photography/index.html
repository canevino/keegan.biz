      for (
        let i = 0;
        i < paths.length;
        i += 6
      ) {

        await Promise.allSettled(
          paths
            .slice(
              i,
              i + 6
            )
            .map(
              path =>
                loadBuffer(
                  path
                )
            )
        );

      }

    }


    /* =====================================================
       ROBUST SIX-MINUTE DRONE LOOP
       ===================================================== */

    function scheduleOneDronePass(
      startTime,
      initial
    ) {

      const context =
        audioState.context;


      const buffer =
        audioState.droneBuffer;


      const duration =
        buffer.duration;


      const crossfade =
        Math.min(
          AUDIO_CONFIG.drone
            .crossfade,
          duration *
          .20
        );


      const source =
        context.createBufferSource();


      const gain =
        context.createGain();


      source.buffer =
        buffer;


      const level =
        random(
          AUDIO_CONFIG.gainRanges
            .cello[0],
          AUDIO_CONFIG.gainRanges
            .cello[1]
        );


      const fadeIn =
        initial
          ? AUDIO_CONFIG.drone
              .fadeIn
          : crossfade;


      const end =
        startTime +
        duration;


      gain.gain.setValueAtTime(
        .0001,
        startTime
      );


      gain.gain.linearRampToValueAtTime(
        level,
        startTime +
        fadeIn
      );


      gain.gain.setValueAtTime(
        level,
        Math.max(
          startTime +
          fadeIn,
          end -
          crossfade
        )
      );


      gain.gain.linearRampToValueAtTime(
        .0001,
        end
      );


      source.connect(
        gain
      );


      gain.connect(
        audioState.masterBus
      );


      source.start(
        startTime
      );


      source.stop(
        end +
        .10
      );


      audioState.droneNextStart =
        end -
        crossfade;


      audioState.droneHorizonEnd =
        end;

    }


    function ensureDroneScheduledAhead() {

      if (
        !audioState.droneStarted ||
        !audioState.droneBuffer ||
        !audioState.context
      ) {

        return;

      }


      const context =
        audioState.context;


      /*
        If a browser suspension somehow leaves us behind
        the Web Audio clock, recover from "now."
      */

      if (
        audioState.droneNextStart <
        context.currentTime -
        1
      ) {

        audioState.droneNextStart =
          context.currentTime +
          .05;


        audioState.droneHorizonEnd =
          context.currentTime;

      }


      const targetHorizon =
        context.currentTime +
        AUDIO_CONFIG.drone
          .scheduleAheadSeconds;


      let safety =
        0;


      while (
        audioState.droneHorizonEnd <
          targetHorizon &&
        safety <
          10
      ) {

        safety++;


        scheduleOneDronePass(
          audioState.droneNextStart,
          false
        );

      }

    }


    async function startDrone(
      point
    ) {

      if (
        audioState.droneStarted ||
        audioState.droneLoading
      ) {

        return false;

      }


      audioState.droneLoading =
        true;


      const context =
        ensureAudioContext();


      if (
        !context
      ) {

        audioState.droneLoading =
          false;


        return false;

      }


      await context.resume();


      try {

        const buffer =
          await loadBuffer(
            DRONE_PATH
          );


        audioState.droneBuffer =
          buffer;


        audioState.droneStarted =
          true;


        audioState.droneLoading =
          false;


        const firstStart =
          context.currentTime +
          .05;


        scheduleOneDronePass(
          firstStart,
          true
        );


        ensureDroneScheduledAhead();


        window.clearInterval(
          audioState.droneScheduler
        );


        audioState.droneScheduler =
          window.setInterval(
            ensureDroneScheduledAhead,
            AUDIO_CONFIG.drone
              .watchdogMs
          );


        updateSoundLabel();


        audioState.eventType =
          "cloud";


        createSplash(
          "drone",
          point
        );


        preloadAllSamples();


        return true;

      }

      catch (error) {

        audioState.droneLoading =
          false;


        console.warn(
          "Unable to start drone.",
          error
        );


        return false;

      }

    }


    /* =====================================================
       DIRECTED HARMONIC JOURNEY
       ===================================================== */

    function harmonySignature(
      harmony
    ) {

      return [...harmony.pitches]
        .sort()
        .join("-");

    }


    function sharedPitchCount(
      a,
      b
    ) {

      return a.pitches.filter(
        pitch =>
          b.pitches.includes(
            pitch
          )
      ).length;

    }


    function scaleDistance(
      a,
      b
    ) {

      const ai =
        SCALE.indexOf(
          a
        );


      const bi =
        SCALE.indexOf(
          b
        );


      const raw =
        Math.abs(
          ai -
          bi
        );


      return Math.min(
        raw,
        SCALE.length -
        raw
      );

    }


    function harmonyDistance(
      current,
      candidate
    ) {

      return candidate.pitches.reduce(
        (
          total,
          pitch
        ) => {

          const nearest =
            Math.min(
              ...current.pitches.map(
                source =>
                  scaleDistance(
                    source,
                    pitch
                  )
              )
            );


          return total +
            nearest;

        },
        0
      );

    }


    function chooseInitialHarmony() {

      const calm =
        HARMONIES.filter(
          harmony =>
            harmony.tension <
            .38
        );


      return weightedObject(
        calm
      );

    }


    function beginNewPhrase(
      current
    ) {

      let mode;


      if (
        current.tension >
        .62
      ) {

        mode =
          "release";

      }

      else {

        mode =
          weightedPick([

            {
              value: "hover",
              weight: 37
            },

            {
              value: "rise",
              weight: 26
            },

            {
              value: "settle",
              weight: 27
            },

            {
              value: "darken",
              weight: 10
            }

          ]);

      }


      if (
        mode === "release"
      ) {

        audioState.phraseTargetTension =
          random(
            .10,
            .30
          );

      }

      else if (
        mode === "rise"
      ) {

        audioState.phraseTargetTension =
          random(
            Math.max(
              .30,
              current.tension
            ),
            .64
          );

      }

      else if (
        mode === "darken"
      ) {

        audioState.phraseTargetTension =
          random(
            .50,
            .76
          );

      }

      else if (
        mode === "settle"
      ) {

        audioState.phraseTargetTension =
          random(
            .08,
            .30
          );

      }

      else {

        audioState.phraseTargetTension =
          clamp(
            current.tension +
            random(
              -.15,
              .15
            ),
            .12,
            .58
          );

      }


      audioState.phraseStepsRemaining =
        randomInt(
          2,
          4
        );

    }


    function chooseNextHarmony(
      current
    ) {

      if (
        audioState.phraseStepsRemaining <=
        0
      ) {

        beginNewPhrase(
          current
        );

      }


      audioState.phraseStepsRemaining--;


      const currentSignature =
        harmonySignature(
          current
        );


      const candidates =
        HARMONIES.filter(
          candidate =>
            harmonySignature(
              candidate
            ) !==
            currentSignature
        );


      const scored =
        candidates.map(
          candidate => {

            const signature =
              harmonySignature(
                candidate
              );


            const shared =
              sharedPitchCount(
                current,
                candidate
              );


            const distance =
              harmonyDistance(
                current,
                candidate
              );


            const tensionError =
              Math.abs(
                candidate.tension -
                audioState
                  .phraseTargetTension
              );


            let weight =
              candidate.weight;


            /*
              Smooth harmonic continuity.
            */

            weight *=
              1 +
              shared *
              .72;


            weight *=
              1 /
              (
                1 +
                distance *
                .27
              );


            /*
              Follow the current phrase's broad
              tension direction.
            */

            weight *=
              .48 +
              Math.exp(
                -tensionError *
                4
              );


            /*
              High tension generally wants somewhere
              calmer next.
            */

            if (
              current.tension >
                .62 &&
              candidate.tension <
                current.tension
            ) {

              weight *=
                1.9;

            }


            /*
              Avoid jumping from complete repose
              straight into the ugliest harmony.
            */

            if (
              current.tension <
                .24 &&
              candidate.tension >
                .68
            ) {

              weight *=
                .18;

            }


            /*
              The D pedal makes D-containing structures
              especially convincing without requiring them.
            */

            if (
              candidate.pitches.includes(
                "D"
              )
            ) {

              weight *=
                1.11;

            }


            /*
              Avoid recent repetition.
            */

            if (
              audioState
                .recentHarmonySignatures
                .includes(
                  signature
                )
            ) {

              weight *=
                .10;

            }


            /*
              Very remote moves remain possible,
              just uncommon.
            */

            if (
              shared === 0 &&
              distance >
                5
            ) {

              weight *=
                .42;

            }


            return {

              ...candidate,

              weight:
                Math.max(
                  .005,
                  weight
                )

            };

          }
        );


      const selected =
        weightedObject(
          scored
        );


      const signature =
        harmonySignature(
          selected
        );


      audioState
        .recentHarmonySignatures
        .push(
          signature
        );


      if (
        audioState
          .recentHarmonySignatures
          .length >
        5
      ) {

        audioState
          .recentHarmonySignatures
          .shift();

      }


      return selected;

    }


    /* =====================================================
       SAMPLE SELECTION
       ===================================================== */

    function samplesForPitch(
      pitch,
      includeHarmonics = false
    ) {

      return SAMPLE_MANIFEST.filter(
        sample =>
          sample.pitchClass ===
            pitch &&
          (
            includeHarmonics ||
            !sample.isHarmonic
          )
      );

    }


    function weightedSample(
      samples,
      usedIds,
      instrumentCounts,
      preferredRegister = null
    ) {

      const candidates =
        samples.filter(
          sample =>
            !usedIds.has(
              sample.id
            ) &&
            (
              sample.isHarmonic ||
              (
                instrumentCounts[
                  sample.instrument
                ] || 0
              ) <
              AUDIO_CONFIG.cloud
                .maxSameInstrument
            )
        );


      if (
        !candidates.length
      ) {

        return null;

      }


      return weightedObject(
        candidates.map(
          sample => {

            let weight =
              AUDIO_CONFIG
                .instrumentWeights[
                  sample.instrument
                ] || 1;


            if (
              sample.isHarmonic
            ) {

              weight =
                .45;

            }

            else {

              weight *=
                AUDIO_CONFIG
                  .registerWeights[
                    sample.register
                  ] || 1;

            }


            if (
              preferredRegister &&
              preferredRegister ===
                sample.register
            ) {

              weight *=
                1.7;

            }


            if (
              sample.instrument ===
                "mandolin" &&
              sample.register ===
                2
            ) {

              weight *=
                1.18;

            }


            return {

              ...sample,

              weight

            };

          }
        )
      );

    }


    function addVoice(
      voices,
      sample,
      pitchCounts,
      instrumentCounts,
      usedIds
    ) {

      if (
        !sample
      ) {

        return;

      }


      voices.push(
        sample
      );


      usedIds.add(
        sample.id
      );


      pitchCounts[
        sample.pitchClass
      ] =
        (
          pitchCounts[
            sample.pitchClass
          ] || 0
        ) +
        1;


      instrumentCounts[
        sample.instrument
      ] =
        (
          instrumentCounts[
            sample.instrument
          ] || 0
        ) +
        1;

    }


    function generateCloudVoicing(
      harmony
    ) {

      const target =
        randomInt(
          AUDIO_CONFIG.cloud
            .minVoices,
          AUDIO_CONFIG.cloud
            .maxVoices
        );


      const voices =
        [];


      const usedIds =
        new Set();


      const pitchCounts =
        {};


      const instrumentCounts =
        {};


      harmony.pitches.forEach(
        (
          pitch,
          index
        ) => {

          const preferred =
            index === 0
              ? 1
              : index === 1
                ? 2
                : (
                    Math.random() < .5
                      ? 1
                      : 2
                  );


          addVoice(
            voices,
            weightedSample(
              samplesForPitch(
                pitch
              ),
              usedIds,
              instrumentCounts,
              preferred
            ),
            pitchCounts,
            instrumentCounts,
            usedIds
          );

        }
      );


      const harmonicCandidates =
        SAMPLE_MANIFEST.filter(
          sample =>
            sample.isHarmonic &&
            harmony.pitches.includes(
              sample.pitchClass
            )
        );


      const wantsHarmonic =
        harmonicCandidates.length >
          0 &&
        Math.random() <
          AUDIO_CONFIG.cloud
            .harmonicChance;


      const normalTarget =
        wantsHarmonic
          ? Math.max(
              3,
              target -
              1
            )
          : target;


      let safety =
        0;


      while (
        voices.length <
          normalTarget &&
        safety <
          80
      ) {

        safety++;


        const eligible =
          harmony.pitches.filter(
            pitch =>
              (
                pitchCounts[
                  pitch
                ] || 0
              ) <
              AUDIO_CONFIG.cloud
                .maxSamePitch
          );


        if (
          !eligible.length
        ) {

          break;

        }


        /*
          Underrepresented chord tones get preference.
        */

        const pitch =
          weightedObject(
            eligible.map(
              candidate => ({

                value:
                  candidate,

                weight:
                  1 /
                  (
                    1 +
                    (
                      pitchCounts[
                        candidate
                      ] || 0
                    )
                  )

              })
            )
          ).value;


        addVoice(
          voices,
          weightedSample(
            samplesForPitch(
              pitch
            ),
            usedIds,
            instrumentCounts
          ),
          pitchCounts,
          instrumentCounts,
          usedIds
        );

      }


      if (
        wantsHarmonic &&
        voices.length <
          target
      ) {

        const candidates =
          harmonicCandidates.filter(
            sample =>
              !usedIds.has(
                sample.id
              )
          );


        if (
          candidates.length
        ) {

          addVoice(
            voices,
            pick(
              candidates
            ),
            pitchCounts,
            instrumentCounts,
            usedIds
          );

        }

      }


      return voices;

    }


    /* =====================================================
       CONNECTIVE MUSIC

       Uses the already-planned next harmony.
       ===================================================== */

    function unique(
      array
    ) {

      return [
        ...new Set(
          array
        )
      ];

    }


    function oneStepToward(
      source,
      target
    ) {

      const si =
        SCALE.indexOf(
          source
        );


      const ti =
        SCALE.indexOf(
          target
        );


      if (
        si === ti
      ) {

        return source;

      }


      const forward =
        (
          ti -
          si +
          SCALE.length
        ) %
        SCALE.length;


      const backward =
        (
          si -
          ti +
          SCALE.length
        ) %
        SCALE.length;


      if (
        forward <=
        backward
      ) {

        return SCALE[
          (
            si +
            1
          ) %
          SCALE.length
        ];

      }


      return SCALE[
        (
          si -
          1 +
          SCALE.length
        ) %
        SCALE.length
      ];

    }


    function connectionCandidates(
      current,
      next
    ) {

      const common =
        current.pitches.filter(
          pitch =>
            next.pitches.includes(
              pitch
            )
        );


      const incoming =
        next.pitches.filter(
          pitch =>
            !current.pitches.includes(
              pitch
            )
        );


      const approaches =
        [];


      current.pitches.forEach(
        source => {

          next.pitches.forEach(
            target => {

              approaches.push(
                oneStepToward(
                  source,
                  target
                )
              );

            }
          );

        }
      );


      return {

        common:
          unique(
            common
          ),

        incoming:
          unique(
            incoming
          ),

        approaches:
          unique(
            approaches
          )

      };

    }


    function chooseConnectionPitches(
      current,
      next
    ) {

      const pools =
        connectionCandidates(
          current,
          next
        );


      const strategy =
        weightedPick([

          {
            value: "common",
            weight:
              pools.common.length
                ? 31
                : 0
          },

          {
            value: "approach",
            weight:
              pools.approaches.length
                ? 31
                : 0
          },

          {
            value: "incoming",
            weight:
              pools.incoming.length
                ? 24
                : 0
          },

          {
            value: "pair",
            weight: 14
          }

        ]);


      if (
        strategy === "common"
      ) {

        return [
          pick(
            pools.common
          )
        ];

      }


      if (
        strategy === "approach"
      ) {

        return [
          pick(
            pools.approaches
          )
        ];

      }


      if (
        strategy === "incoming"
      ) {

        return [
          pick(
            pools.incoming
          )
        ];

      }


      return unique([

        pick(
          pools.common.length
            ? pools.common
            : pools.approaches
        ),

        pick(
          pools.incoming.length
            ? pools.incoming
            : next.pitches
        )

      ]).slice(
        0,
        2
      );

    }


    function generateConnectionVoicing(
      pitches
    ) {

      const target =
        randomInt(
          Math.max(
            1,
            pitches.length
          ),
          AUDIO_CONFIG.connection
            .maxVoices
        );


      const voices =
        [];


      const usedIds =
        new Set();


      const pitchCounts =
        {};


      const instrumentCounts =
        {};


      pitches.forEach(
        pitch => {

          addVoice(
            voices,
            weightedSample(
              samplesForPitch(
                pitch
              ),
              usedIds,
              instrumentCounts,
              Math.random() < .68
                ? 2
                : 1
            ),
            pitchCounts,
            instrumentCounts,
            usedIds
          );

        }
      );


      if (
        voices.length <
          target &&
        Math.random() <
          AUDIO_CONFIG.connection
            .harmonicChance
      ) {

        const harmonics =
          SAMPLE_MANIFEST.filter(
            sample =>
              sample.isHarmonic &&
              pitches.includes(
                sample.pitchClass
              ) &&
              !usedIds.has(
                sample.id
              )
          );


        if (
          harmonics.length
        ) {

          addVoice(
            voices,
            pick(
              harmonics
            ),
            pitchCounts,
            instrumentCounts,
            usedIds
          );

        }

      }


      let safety =
        0;


      while (
        voices.length <
          target &&
        safety <
          30
      ) {

        safety++;


        const pitch =
          pick(
            pitches
          );


        addVoice(
          voices,
          weightedSample(
            samplesForPitch(
              pitch
            ),
            usedIds,
            instrumentCounts,
            Math.random() < .62
              ? 2
              : null
          ),
          pitchCounts,
          instrumentCounts,
          usedIds
        );

      }


      return voices;

    }


    /* =====================================================
       PLAYBACK

       Two-stage attack softening:
       individual note ramp + event bus ramp.
       ===================================================== */

    function gainRangeForSample(
      sample
    ) {

      return sample.isHarmonic
        ? AUDIO_CONFIG
            .gainRanges
            .harmonic
        : AUDIO_CONFIG
            .gainRanges[
              sample.instrument
            ];

    }


    function attackRangeForSample(
      sample
    ) {

      return sample.isHarmonic
        ? AUDIO_CONFIG
            .attackRanges
            .harmonic
        : AUDIO_CONFIG
            .attackRanges[
              sample.instrument
            ];

    }


    function panRangeForSample(
      sample
    ) {

      return sample.isHarmonic
        ? AUDIO_CONFIG
            .panRanges
            .harmonic
        : AUDIO_CONFIG
            .panRanges[
              sample.register
            ] || .30;

    }


    function staggerOffsets(
      count,
      maxSpread
    ) {

      if (
        count <= 1
      ) {

        return [
          random(
            0,
            25
          )
        ];

      }


      const offsets =
        [];


      let current =
        random(
          0,
          22
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        offsets.push(
          Math.min(
            current,
            maxSpread
          )
        );


        current +=
          random(
            22,
            52
          );

      }


      return offsets;

    }


    function scheduleVoice(
      sample,
      buffer,
      startTime,
      gainScale,
      destination,
      eventType
    ) {

      if (
        audioState.activeVoices
          .size >=
        AUDIO_CONFIG.maxVoices
      ) {

        return;

      }


      const context =
        audioState.context;


      const source =
        context.createBufferSource();


      const gain =
        context.createGain();


      const panner =
        context.createStereoPanner();


      source.buffer =
        buffer;


      source.playbackRate.value =
        1;


      const range =
        gainRangeForSample(
          sample
        );


      const targetGain =
        random(
          range[0],
          range[1]
        ) *
        gainScale;


      const attackRange =
        attackRangeForSample(
          sample
        );


      let attack =
        random(
          attackRange[0],
          attackRange[1]
        );


      if (
        eventType ===
        "connection"
      ) {

        attack *=
          .82;

      }


      gain.gain.setValueAtTime(
        .0001,
        startTime
      );


      gain.gain.linearRampToValueAtTime(
        targetGain,
        startTime +
        attack
      );


      const panRange =
        panRangeForSample(
          sample
        );


      panner.pan.setValueAtTime(
        random(
          -panRange,
          panRange
        ),
        startTime
      );


      source.connect(
        gain
      );


      gain.connect(
        panner
      );


      panner.connect(
        destination
      );


      audioState.activeVoices.add(
        source
      );


      source.onended =
        () => {

          audioState.activeVoices.delete(
            source
          );


          try {

            source.disconnect();
            gain.disconnect();
            panner.disconnect();

          }

          catch {}

        };


      source.start(
        startTime
      );

    }


    async function playVoices(
      voices,
      spreadMs,
      gainScale,
      eventType
    ) {

      const results =
        await Promise.all(
          voices.map(
            async sample => {

              try {

                return {

                  sample,

                  buffer:
                    await loadBuffer(
                      sample.path
                    )

                };

              }

              catch {

                return null;

              }

            }
          )
        );


      const playable =
        results.filter(
          Boolean
        );


      if (
        !playable.length
      ) {

        return false;

      }


      const context =
        audioState.context;


      const eventBus =
        context.createGain();


      eventBus.connect(
        audioState.masterBus
      );


      const eventStart =
        context.currentTime +
        .06;


      const eventAttack =
        eventType === "cloud"
          ? random(.09, .15)
          : random(.045, .085);


      eventBus.gain.setValueAtTime(
        .0001,
        eventStart
      );


      eventBus.gain.linearRampToValueAtTime(
        1,
        eventStart +
        eventAttack
      );


      const offsets =
        staggerOffsets(
          playable.length,
          spreadMs
        );


      let longestDuration =
        0;


      playable.forEach(
        (
          entry,
          index
        ) => {

          longestDuration =
            Math.max(
              longestDuration,
              entry.buffer.duration
            );


          scheduleVoice(
            entry.sample,
            entry.buffer,
            eventStart +
            offsets[index] /
            1000,
            gainScale,
            eventBus,
            eventType
          );

        }
      );


      window.setTimeout(
        () => {

          try {

            eventBus.disconnect();

          }

          catch {}

        },
        (
          longestDuration +
          1
        ) *
        1000
      );


      return true;

    }


    /* =====================================================
       MUSICAL EVENTS
       ===================================================== */

    async function playCloudEvent(
      point
    ) {

      if (
        !audioState.currentHarmony
      ) {

        audioState.currentHarmony =
          chooseInitialHarmony();


        audioState
          .recentHarmonySignatures
          .push(
            harmonySignature(
              audioState.currentHarmony
            )
          );

      }

      else if (
        audioState.nextHarmony
      ) {

        audioState.currentHarmony =
          audioState.nextHarmony;

      }


      const played =
        await playVoices(
          generateCloudVoicing(
            audioState.currentHarmony
          ),
          AUDIO_CONFIG.cloud
            .entrySpreadMs,
          .90,
          "cloud"
        );


      if (
        !played
      ) {

        return false;

      }


      audioState.nextHarmony =
        chooseNextHarmony(
          audioState.currentHarmony
        );


      audioState.eventType =
        "connection";


      createSplash(
        "cloud",
        point
      );


      visualChordPulse();


      return true;

    }


    async function playConnectionEvent(
      point
    ) {

      if (
        !audioState.currentHarmony ||
        !audioState.nextHarmony
      ) {

        return false;

      }


      const pitches =
        chooseConnectionPitches(
          audioState.currentHarmony,
          audioState.nextHarmony
        );


      const played =
        await playVoices(
          generateConnectionVoicing(
            pitches
          ),
          AUDIO_CONFIG.connection
            .entrySpreadMs,
          .90,
          "connection"
        );


      if (
        !played
      ) {

        return false;

      }


      audioState.eventType =
        "cloud";


      createSplash(
        "connection",
        point
      );


      visualConnectionPulse();


      return true;

    }


    async function handleMusicalClick(
      origin,
      point
    ) {

      const now =
        performance.now();


      if (
        now -
        audioState.lastClickTime <
        AUDIO_CONFIG.eventCooldownMs
      ) {

        return false;

      }


      if (
        audioState.eventPending
      ) {

        return false;

      }


      audioState.lastClickTime =
        now;


      audioState.eventPending =
        true;


      let success =
        false;


      try {

        const context =
          ensureAudioContext();


        if (
          !context
        ) {

          return false;

        }


        await context.resume();


        if (
          audioState.muted
        ) {

          audioState.muted =
            false;


          updateMasterGain();


          updateSoundLabel();

        }


        if (
          !audioState.droneStarted
        ) {

          success =
            await startDrone(
              point
            );

        }

        else if (
          audioState.eventType ===
          "cloud"
        ) {

          success =
            await playCloudEvent(
              point
            );

        }

        else {

          success =
            await playConnectionEvent(
              point
            );

        }


        return success;

      }

      finally {

        audioState.eventPending =
          false;


        if (
          success &&
          origin === "manual"
        ) {

          advanceTutorial();

        }


        if (
          success &&
          origin === "manual" &&
          audioState.autoSongEnabled
        ) {

          scheduleAutoSong();

        }

      }

    }


    /* =====================================================
       RANDOM SONG
       ===================================================== */

    function updateAutoSongLabel() {

      autoSongButton.textContent =
        audioState.autoSongEnabled
          ? "stop randomly generating"
          : "randomly generate a song";

    }


    function nextAutoDelay() {

      /*
        The current musical state determines the pacing.

        A cloud needs more room to decay.
        A connective note can move sooner.
      */

      if (
        audioState.eventType ===
        "connection"
      ) {

        return random(
          3800,
          7000
        );

      }


      return random(
        2400,
        4700
      );

    }


    function scheduleAutoSong() {

      window.clearTimeout(
        audioState.autoSongTimer
      );


      if (
        !audioState.autoSongEnabled ||
        audioState.overlayMuted
      ) {

        return;

      }


      audioState.autoSongTimer =
        window.setTimeout(
          async () => {

            if (
              !audioState.autoSongEnabled ||
              audioState.overlayMuted
            ) {

              return;

            }


            await handleMusicalClick(
              "auto",
              randomEventPoint()
            );


            scheduleAutoSong();

          },
          nextAutoDelay()
        );

    }


    async function startAutoSong() {

      audioState.autoSongEnabled =
        true;


      audioState.muted =
        false;


      updateMasterGain();


      updateSoundLabel();


      updateAutoSongLabel();


      await handleMusicalClick(
        "auto",
        randomEventPoint()
      );


      scheduleAutoSong();

    }


    function stopAutoSong() {

      audioState.autoSongEnabled =
        false;


      window.clearTimeout(
        audioState.autoSongTimer
      );


      updateAutoSongLabel();

    }


    /* =====================================================
       USER EVENTS
       ===================================================== */

    artwork.addEventListener(
      "click",
      async event => {

        if (
          event.target.closest(
            ".fuji-controls"
          )
        ) {

          return;

        }


        /*
          Instruction disappears the instant the user acts.
          The next instruction waits until the sound event
          actually succeeds.
        */

        hidePrompt();


        await handleMusicalClick(
          "manual",
          eventPointFromMouse(
            event
          )
        );

      }
    );


    artwork.addEventListener(
      "keydown",
      async event => {

        if (
          event.key !== "Enter" &&
          event.key !== " "
        ) {

          return;

        }


        if (
          event.target.closest(
            ".fuji-controls"
          )
        ) {

          return;

        }


        event.preventDefault();


        hidePrompt();


        await handleMusicalClick(
          "manual",
          {
            x: .5,
            y: .55
          }
        );

      }
    );


    soundToggle.addEventListener(
      "click",
      event => {

        event.preventDefault();


        event.stopPropagation();


        if (
          !audioState.droneStarted
        ) {

          return;

        }


        audioState.muted =
          !audioState.muted;


        if (
          audioState.muted &&
          audioState.autoSongEnabled
        ) {

          stopAutoSong();

        }


        updateMasterGain();


        updateSoundLabel();

      }
    );


    autoSongButton.addEventListener(
      "click",
      async event => {

        event.preventDefault();


        event.stopPropagation();


        if (
          audioState.autoSongEnabled
        ) {

          stopAutoSong();

        }

        else {

          await startAutoSong();

        }

      }
    );


    /* =====================================================
       WIP INTERLOCK
       ===================================================== */

    window.fujiAudio = {

      setOverlayMuted(
        muted
      ) {

        audioState.overlayMuted =
          Boolean(
            muted
          );


        updateMasterGain();


        if (
          audioState.overlayMuted
        ) {

          window.clearTimeout(
            audioState.autoSongTimer
          );

        }

        else if (
          audioState.autoSongEnabled
        ) {

          scheduleAutoSong();

        }

      }

    };


    /* =====================================================
       START
       ===================================================== */

    updateAutoSongLabel();


    prepareVisuals()
      .then(
        () => {

          /*
            The image gets a few seconds of silence before
            telling the user what to do.
          */

          tutorial.promptTimer =
            window.setTimeout(
              () => {

                if (
                  tutorial.step === 0 &&
                  !audioState.droneStarted
                ) {

                  showPrompt(
                    "click here"
                  );

                }

              },
              3200
            );

        }
      );

  })();
  </script>


  <!-- =====================================================
       EXISTING HORSE / WIP
       ===================================================== -->

  <script>
  (() => {

    const clamp =
      (
        value,
        min,
        max
      ) =>
        Math.min(
          Math.max(
            value,
            min
          ),
          max
        );


    const lerp =
      (
        a,
        b,
        t
      ) =>
        a +
        (
          (
            b -
            a
          ) *
          t
        );


    const random =
      (
        min,
        max
      ) =>
        min +
        Math.random() *
        (
          max -
          min
        );


    const pick =
      array =>
        array[
          Math.floor(
            Math.random() *
            array.length
          )
        ];


    function shuffle(
      array
    ) {

      const result =
        [...array];


      for (
        let i =
          result.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (
              i + 1
            )
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }


      return result;

    }


    function smoothStep(
      value
    ) {

      const t =
        clamp(
          value,
          0,
          1
        );


      return (
        t *
        t *
        (
          3 -
          2 *
          t
        )
      );

    }


    const mobileQuery =
      window.matchMedia(
        "(max-width: 700px)"
      );


    function isMobile() {

      return mobileQuery.matches;

    }


    const pageShell =
      document.getElementById(
        "page-shell"
      );


    const overlay =
      document.getElementById(
        "wip-overlay"
      );


    const audio =
      document.getElementById(
        "wip-audio"
      );


    const closeButton =
      document.getElementById(
        "wip-close"
      );


    const stage =
      document.getElementById(
        "collage-stage"
      );


    const horseMain =
      document.getElementById(
        "horse-main"
      );


    const horseOffset =
      document.getElementById(
        "horse-offset"
      );


    const horseKey =
      document.getElementById(
        "horse-key"
      );


    const ALL_TEXTURES = [

      "Texturelabs_Atmosphere_121S.jpg",
      "Texturelabs_Atmosphere_127S.jpg",
      "Texturelabs_Atmosphere_130S.jpg",
      "Texturelabs_Atmosphere_135S.jpg",
      "Texturelabs_Atmosphere_201S.jpg",

      "Texturelabs_Brick_124S.jpg",
      "Texturelabs_Brick_158S.jpg",

      "Texturelabs_Concrete_150S.jpg",
      "Texturelabs_Concrete_155S.jpg",
      "Texturelabs_Concrete_179S.jpg",
      "Texturelabs_Concrete_205S.jpg",
      "Texturelabs_Concrete_207S.jpg",

      "Texturelabs_Fabric_123S.jpg",
      "Texturelabs_Fabric_144S.jpg",
      "Texturelabs_Fabric_172S.jpg",

      "Texturelabs_Film_181S.jpg",
      "Texturelabs_Film_183S.jpg",
      "Texturelabs_Film_187S.jpg",

      "Texturelabs_Glass_134S.jpg",
      "Texturelabs_Glass_155S.jpg",

      "Texturelabs_Grunge_173S.jpg",
      "Texturelabs_Grunge_279L.jpg",
      "Texturelabs_Grunge_334S.jpg",
      "Texturelabs_Grunge_341S.jpg",

      "Texturelabs_InkPaint_126S.jpg",
      "Texturelabs_InkPaint_320S.jpg",
      "Texturelabs_InkPaint_332S.jpg",
      "Texturelabs_InkPaint_356S.jpg",

      "Texturelabs_LensFX_251S.jpg",
      "Texturelabs_LensFX_256S.jpg",

      "Texturelabs_Metal_129S.jpg",
      "Texturelabs_Metal_165S.jpg",
      "Texturelabs_Metal_285S.jpg",
      "Texturelabs_Metal_294S.jpg",

      "Texturelabs_Paper_273S.jpg",
      "Texturelabs_Paper_278L.jpg",
      "Texturelabs_Paper_280S.jpg",
      "Texturelabs_Paper_286S.jpg",
      "Texturelabs_Paper_303S.jpg",
      "Texturelabs_Paper_324S.jpg",
      "Texturelabs_Paper_380L.jpg",
      "Texturelabs_Paper_380S.jpg",

      "Texturelabs_Sky_171S.jpg",

      "Texturelabs_Soil_146S.jpg",
      "Texturelabs_Soil_149S.jpg",

      "Texturelabs_Stone_167S.jpg",
      "Texturelabs_Stone_169S.jpg",

      "Texturelabs_Water_124S.jpg",
      "Texturelabs_Water_141S.jpg",

      "Texturelabs_Wood_135S.jpg",
      "Texturelabs_Wood_280S.jpg",
      "Texturelabs_Wood_290S.jpg"

    ].map(
      file =>
        `../assets/home/${file}`
    );


    const DIRTY_TEXTURES =
      ALL_TEXTURES.filter(
        src =>
          /Grunge|Concrete|Soil|Stone|Wood|Metal|Film|Brick|Paper|InkPaint/i
            .test(src)
      );


    const SOFTER_TEXTURES =
      ALL_TEXTURES.filter(
        src =>
          !DIRTY_TEXTURES.includes(
            src
          )
      );


    let sessionTextures = [];
    let readyTextures = [];
    let recentTextures = [];


    function prepareTextures() {

      sessionTextures = [

        ...shuffle(
          DIRTY_TEXTURES
        ).slice(
          0,
          isMobile()
            ? 13
            : 18
        ),

        ...shuffle(
          SOFTER_TEXTURES
        ).slice(
          0,
          isMobile()
            ? 3
            : 6
        )

      ];


      readyTextures =
        [];


      sessionTextures.forEach(
        src => {

          const image =
            new Image();


          image.decoding =
            "async";


          image.onload =
            () => {

              if (
                !readyTextures.includes(
                  src
                )
              ) {

                readyTextures.push(
                  src
                );

              }

            };


          image.src =
            src;

        }
      );

    }


    function chooseTexture() {

      const dirty =
        readyTextures.filter(
          src =>
            DIRTY_TEXTURES.includes(
              src
            )
        );


      const pool =
        (
          Math.random() < .82 &&
          dirty.length > 3
        )
          ? dirty
          : (
              readyTextures.length > 5
                ? readyTextures
                : sessionTextures
            );


      let result;
      let attempts = 0;


      do {

        result =
          pick(
            pool
          );


        attempts++;

      }
      while (
        recentTextures.includes(
          result
        ) &&
        attempts < 14
      );


      recentTextures.push(
        result
      );


      if (
        recentTextures.length > 7
      ) {

        recentTextures.shift();

      }


      return result;

    }


    const HORSE_COLORS = [

      {
        name: "burnt sienna",
        hue: -13,
        saturation: 3.55,
        brightness: .94,
        contrast: 1.28
      },

      {
        name: "forest green",
        hue: 69,
        saturation: 2.85,
        brightness: .84,
        contrast: 1.24
      },

      {
        name: "ocean blue",
        hue: 151,
        saturation: 3.25,
        brightness: .91,
        contrast: 1.22
      },

      {
        name: "canyon red",
        hue: -28,
        saturation: 3.65,
        brightness: .89,
        contrast: 1.30
      },

      {
        name: "dirt brown",
        hue: 4,
        saturation: 1.95,
        brightness: .78,
        contrast: 1.24
      },

      {
        name: "pale sage",
        hue: 67,
        saturation: 1.72,
        brightness: 1.08,
        contrast: 1.05
      },

      {
        name: "blueberry",
        hue: 187,
        saturation: 3.05,
        brightness: .82,
        contrast: 1.27
      }

    ];


    const OPENING_COLORS = [
      HORSE_COLORS[0],
      HORSE_COLORS[1],
      HORSE_COLORS[2],
      HORSE_COLORS[3],
      HORSE_COLORS[6]
    ];


    let lastHorseColorName =
      "";


    function differentHorseColor(
      pool
    ) {

      let result;
      let attempts = 0;


      do {

        result =
          pick(
            pool
          );


        attempts++;

      }
      while (
        result.name === lastHorseColorName &&
        attempts < 12
      );


      lastHorseColorName =
        result.name;


      return result;

    }


    function nextHorseColor(
      time
    ) {

      return differentHorseColor(
        time < 75
          ? OPENING_COLORS
          : HORSE_COLORS
      );

    }


    function makeSlot(
      id,
      options
    ) {

      const element =
        document.getElementById(
          id
        );


      return {

        element,

        frames:
          Array.from(
            element.querySelectorAll(
              ".morph-frame"
            )
          ),

        active: 0,

        ...options,

        nextChange:
          Infinity

      };

    }


    const slots = [

      makeSlot(
        "under-slot-1",
        {
          role: "foundation",
          desktopBlend: "multiply",
          mobileBlend: "multiply",
          internalBlend: "multiply",
          slowDuration: 11.5,
          fastDuration: 2.5,
          phase: 0,
          mobileEnabled: true
        }
      ),

      makeSlot(
        "under-slot-2",
        {
          role: "secondary",
          desktopBlend: "color-burn",
          mobileBlend: "soft-light",
          internalBlend: "overlay",
          slowDuration: 13.5,
          fastDuration: 3,
          phase: 2.4,
          mobileEnabled: true
        }
      ),

      makeSlot(
        "over-slot-1",
        {
          role: "overprint",
          desktopBlend: "hard-light",
          mobileBlend: "soft-light",
          internalBlend: "multiply",
          slowDuration: 9.5,
          fastDuration: 2.4,
          phase: 4.8,
          mobileEnabled: false
        }
      )

    ];


    function neutralTint() {

      return `
        linear-gradient(
          ${random(0, 360)}deg,
          ${pick([
            "#060605",
            "#11100e",
            "#1a1714",
            "#25211c"
          ])} 0%,
          ${pick([
            "#49443d",
            "#5a544b",
            "#6e665b",
            "#7a7164"
          ])} 52%,
          ${pick([
            "#c5bdae",
            "#d2cabc",
            "#ded5c7",
            "#e8dfd1"
          ])} 100%
        )
      `;

    }


    function opacityForSlot(
      slot,
      intensity
    ) {

      if (
        slot.role === "foundation"
      ) {

        return isMobile()
          ? random(
              .48,
              .62 +
              intensity *
              .10
            )
          : random(
              .60,
              .78 +
              intensity *
              .10
            );

      }


      if (
        slot.role === "secondary"
      ) {

        return isMobile()
          ? random(
              .24,
              .35 +
              intensity *
              .13
            )
          : random(
              .34,
              .50 +
              intensity *
              .14
            );

      }


      return random(
        .08,
        .16 +
        intensity *
        .11
      );

    }


    function configureFrame(
      frame,
      slot,
      intensity
    ) {

      frame.style.backgroundImage =
        `
          ${neutralTint()},
          url("${chooseTexture()}")
        `;


      frame.style.backgroundSize =
        "cover, cover";


      frame.style.backgroundRepeat =
        "no-repeat, no-repeat";


      frame.style.backgroundBlendMode =
        `${slot.internalBlend}, normal`;


      frame.style.mixBlendMode =
        isMobile()
          ? slot.mobileBlend
          : slot.desktopBlend;


      frame.style.transform =
        `
          translate(
            ${random(-2, 2)}%,
            ${random(-2, 2)}%
          )
          rotate(
            ${random(-1.5, 1.5)}deg
          )
          scale(
            ${random(1.06, 1.20)}
          )
        `;


      frame.style.filter =
        isMobile()
          ? `
              grayscale(1)
              saturate(0)
              contrast(${random(1.16, 1.42)})
              brightness(${random(.74, .94)})
            `
          : `
              grayscale(1)
              saturate(0)
              contrast(${random(1.28, 1.72)})
              brightness(${random(.64, .92)})
            `;


      frame.dataset.targetOpacity =
        opacityForSlot(
          slot,
          intensity
        ).toFixed(
          3
        );

    }


    function initializeSlot(
      slot,
      intensity,
      time
    ) {

      if (
        isMobile() &&
        !slot.mobileEnabled
      ) {

        slot.element.style.display =
          "none";


        return;

      }


      const first =
        slot.frames[0];


      configureFrame(
        first,
        slot,
        intensity
      );


      const fade =
        isMobile()
          ? 6
          : 7;


      first.style.transitionDuration =
        `${fade}s`;


      first.style.opacity =
        first.dataset.targetOpacity;


      slot.nextChange =
        time +
        slot.phase +
        fade;

    }


    function morphSlot(
      slot,
      intensity,
      time
    ) {

      const outgoing =
        slot.frames[
          slot.active
        ];


      const incomingIndex =
        slot.active === 0
          ? 1
          : 0;


      const incoming =
        slot.frames[
          incomingIndex
        ];


      let duration =
        lerp(
          slot.slowDuration,
          slot.fastDuration,
          intensity
        );


      if (
        isMobile()
      ) {

        duration =
          Math.max(
            duration,
            3.2
          );

      }


      incoming.style.opacity =
        "0";


      configureFrame(
        incoming,
        slot,
        intensity
      );


      incoming.offsetHeight;


      incoming.style.transitionDuration =
        `${duration}s`;


      outgoing.style.transitionDuration =
        `${duration}s`;


      requestAnimationFrame(
        () => {

          incoming.style.opacity =
            incoming.dataset.targetOpacity;


          outgoing.style.opacity =
            "0";

        }
      );


      slot.active =
        incomingIndex;


      slot.nextChange =
        time +
        duration *
        .96;

    }


    let nextHorseChange =
      Infinity;


    function applyHorseColor(
      color,
      intensity,
      time
    ) {

      const transition =
        lerp(
          5.8,
          isMobile()
            ? 3.4
            : 2.5,
          intensity
        );


      horseMain.style.transitionDuration =
        `${transition}s`;


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(${color.saturation})
          hue-rotate(${color.hue}deg)
          contrast(${color.contrast})
          brightness(${color.brightness})
        `;


      horseMain.style.opacity =
        "1";


      horseOffset.style.opacity =
        isMobile()
          ? "0"
          : lerp(
              .02,
              .06,
              intensity
            ).toFixed(
              3
            );


      horseKey.style.opacity =
        isMobile()
          ? lerp(
              .08,
              .14,
              intensity
            ).toFixed(
              3
            )
          : lerp(
              .10,
              .18,
              intensity
            ).toFixed(
              3
            );


      nextHorseChange =
        time +
        lerp(
          12,
          isMobile()
            ? 5.2
            : 4,
          intensity
        );

    }


    function prepareInitialHorse() {

      const color =
        differentHorseColor(
          OPENING_COLORS
        );


      horseMain.style.mixBlendMode =
        "multiply";


      horseMain.style.filter =
        `
          grayscale(1)
          sepia(1)
          saturate(${color.saturation * 1.12})
          hue-rotate(${color.hue}deg)
          contrast(${color.contrast * 1.04})
          brightness(${color.brightness * 1.03})
        `;


      horseMain.style.opacity =
        "0";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";


      nextHorseChange =
        24;

    }


    function normalHorse() {

      horseMain.style.mixBlendMode =
        "normal";


      horseMain.style.filter =
        "none";


      horseMain.style.opacity =
        "1";


      horseOffset.style.opacity =
        "0";


      horseKey.style.opacity =
        "0";

    }


    const HORSE_START = 12;
    const HORSE_FULL = 20;
    const COLLAGE_START = 30;
    const NORMAL_TIME = 243;


    function horseRevealAt(
      time
    ) {

      if (
        time < HORSE_START
      ) {

        return 0;

      }


      return smoothStep(
        (
          time -
          HORSE_START
        ) /
        (
          HORSE_FULL -
          HORSE_START
        )
      );

    }


    function intensityAt(
      time
    ) {

      if (
        time < COLLAGE_START ||
        time >= NORMAL_TIME
      ) {

        return 0;

      }


      return clamp(
        (
          time -
          COLLAGE_START
        ) /
        (
          NORMAL_TIME -
          COLLAGE_START
        ),
        0,
        1
      );

    }


    let overlayOpen = false;
    let collageStarted = false;
    let horseStarted = false;
    let normalState = false;
    let raf = null;


    function clearSlots() {

      slots.forEach(
        slot => {

          slot.nextChange =
            Infinity;


          slot.frames.forEach(
            frame => {

              frame.style.opacity =
                "0";

            }
          );

        }
      );

    }


    function visualLoop() {

      if (
        !overlayOpen
      ) {

        return;

      }


      const time =
        audio.currentTime ||
        0;


      stage.style.setProperty(
        "--visual-reveal",
        horseRevealAt(
          time
        ).toFixed(
          4
        )
      );


      if (
        time >= HORSE_START &&
        !horseStarted
      ) {

        horseStarted =
          true;


        prepareInitialHorse();

      }


      if (
        time >= HORSE_START &&
        time < COLLAGE_START
      ) {

        horseMain.style.opacity =
          horseRevealAt(
            time
          );


        if (
          time >= nextHorseChange
        ) {

          applyHorseColor(
            nextHorseColor(
              time
            ),
            .08,
            time
          );

        }

      }


      if (
        time >= COLLAGE_START &&
        time < NORMAL_TIME
      ) {

        const intensity =
          intensityAt(
            time
          );


        if (
          !collageStarted
        ) {

          collageStarted =
            true;


          slots.forEach(
            slot =>
              initializeSlot(
                slot,
                intensity,
                time
              )
          );


          nextHorseChange =
            time +
            8;

        }


        slots.forEach(
          slot => {

            if (
              time >= slot.nextChange
            ) {

              morphSlot(
                slot,
                intensity,
                time
              );

            }

          }
        );


        if (
          time >= nextHorseChange
        ) {

          applyHorseColor(
            nextHorseColor(
              time
            ),
            intensity,
            time
          );

        }

      }


      if (
        time >= NORMAL_TIME &&
        !normalState
      ) {

        normalState =
          true;


        clearSlots();


        normalHorse();


        stage.classList.add(
          "is-normal"
        );

      }


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    async function openWip() {

      if (
        overlayOpen
      ) {

        return;

      }


      overlayOpen =
        true;


      collageStarted =
        false;


      horseStarted =
        false;


      normalState =
        false;


      recentTextures =
        [];


      lastHorseColorName =
        "";


      clearSlots();


      normalHorse();


      stage.classList.remove(
        "is-normal"
      );


      stage.style.setProperty(
        "--visual-reveal",
        "0"
      );


      prepareTextures();


      if (
        window.fujiAudio
      ) {

        window.fujiAudio
          .setOverlayMuted(
            true
          );

      }


      pageShell.classList.add(
        "is-hidden"
      );


      overlay.classList.add(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "false"
      );


      audio.currentTime =
        0;


      audio.volume =
        .72;


      try {

        await audio.play();

      }

      catch {}


      raf =
        requestAnimationFrame(
          visualLoop
        );

    }


    function closeWip() {

      overlayOpen =
        false;


      cancelAnimationFrame(
        raf
      );


      audio.pause();


      audio.currentTime =
        0;


      clearSlots();


      normalHorse();


      overlay.classList.remove(
        "is-visible"
      );


      overlay.setAttribute(
        "aria-hidden",
        "true"
      );


      pageShell.classList.remove(
        "is-hidden"
      );


      if (
        window.fujiAudio
      ) {

        window.fujiAudio
          .setOverlayMuted(
            false
          );

      }

    }


    document.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );


        if (
          !link
        ) {

          return;

        }


        if (
          link.hasAttribute(
            "data-live-link"
          )
        ) {

          return;

        }


        event.preventDefault();


        openWip();

      }
    );


    closeButton.addEventListener(
      "click",
      closeWip
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          overlayOpen
        ) {

          closeWip();

        }

      }
    );

  })();
  </script>
