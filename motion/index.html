<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>motion — keegan.biz</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <div
    class="page-shell"
    id="page-shell"
  >

    <!-- =====================================================
         SCARF NAVIGATION
         ===================================================== -->

    <nav
      class="scarf-rack"
      aria-label="Sections"
    >

      <a
        class="scarf-item scarf-home"
        href="../"
        aria-label="Home"
      >
        <img
          src="../assets/home/home-scarf-update.png"
          alt=""
        >
      </a>


      <a
        class="scarf-item"
        href="../illustration/"
        aria-label="Illustration"
      >
        <img
          src="../assets/home/scarf-illustration.png"
          alt=""
        >
      </a>


      <a
        class="scarf-item"
        href="../photography/"
        aria-label="Photography"
      >
        <img
          src="../assets/home/scarf-photography.png"
          alt=""
        >
      </a>


      <a
        class="scarf-item"
        href="#"
        aria-label="Graphic Design"
      >
        <img
          src="../assets/home/scarf-design.png"
          alt=""
        >
      </a>


      <a
        class="scarf-item"
        href="#"
        aria-label="Music"
      >
        <img
          src="../assets/home/scarf-music.png"
          alt=""
        >
      </a>


      <a
        class="scarf-item"
        href="./"
        aria-current="page"
        aria-label="Motion"
      >
        <img
          src="../assets/home/scarf-motion.png"
          alt=""
        >
      </a>


      <a
        class="scarf-item"
        href="#"
        aria-label="Miscellaneous"
      >
        <img
          src="../assets/home/scarf-misc.png"
          alt=""
        >
      </a>


      <a
        class="scarf-item"
        href="#"
        aria-label="Gastronomy"
      >
        <img
          src="../assets/home/scarf-gastronomy.png"
          alt=""
        >
      </a>

    </nav>



    <!-- =====================================================
         MOTION PAGE
         ===================================================== -->

    <main class="motion-page">

      <header class="motion-header">

        <h1 class="motion-title">
          motion
        </h1>

      </header>


      <section
        class="motion-grid"
        aria-label="Motion work"
      >

        <figure class="motion-item">
          <video
            src="assets/bike_web.mp4"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
          ></video>
        </figure>


        <figure class="motion-item">
          <video
            src="assets/house_web.mp4"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
          ></video>
        </figure>


        <figure class="motion-item">
          <video
            src="assets/rocky_web.mp4"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
          ></video>
        </figure>


        <figure class="motion-item">
          <video
            src="assets/snow_web.mp4"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
          ></video>
        </figure>

      </section>

    </main>

  </div>

</body>

</html>
