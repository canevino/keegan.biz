  <script>
  (() => {

    /* =====================================================

    const files = [

      "animal-01.webp",
      "animal-02.webp",

      "city-01.webp",
      "city-02.webp",

      "face-01.webp",
      "face-02.webp",

      "figure-05.webp",

      "figure-08.webp",
      "figure-09.webp",
      "figure-10.webp",
      "figure-11.webp",
      "figure-12.webp",
      "figure-13.webp",

      "fishing-01.webp",
      "fishing-02.webp",

      "food-01.webp",
      "food-02.webp",
      "food-03.webp",
      "food-04.webp",
      "food-05.webp",
      "food-06.webp",
      "food-07.webp",
      "food-08.webp",

      "ghost-1.webp",
      "ghost-02.webp",

      "group-01.webp",

      "house-1.webp",
      "house-2.webp",
      "house-03.webp",
      "house-04.webp",

      "insect-01.webp",

      "kitchen-01.webp",
      "kitchen-02.webp",
      "kitchen-03.webp",
      "kitchen-04.webp",
      "kitchen-05.webp",
      "kitchen-06.webp",

      "misc-01.webp",

      "multiple-01.webp",
      "multiple-02.webp",
      "multiple-03.webp",
      "multiple-04.webp",
      "multiple-05.webp",

      "music-01.webp",
      "music-02.webp",
      "music-03.webp",
      "music-04.webp",

      "nature-01.webp",

      "object-1.webp",
      "object-2.webp",
      "object-03.webp",
      "object-04.webp",

      "perspective-01.webp",

      "vehicle-01.webp",
      "vehicle-02.webp",
      "vehicle-03.webp"

    ];



    /* =====================================================
       ELEMENTS
       ===================================================== */

    const viewport =
      document.getElementById(
        "sketchbook-viewport"
      );


    const paper =
      document.getElementById(
        "sketchbook-paper"
      );


    const field =
      document.getElementById(
        "sketchbook-field"
      );


    if (
      !viewport ||
      !paper ||
      !field
    ) {
      return;
    }



    /* =====================================================
       HELPERS
       ===================================================== */

    function clamp(
      value,
      min,
      max
    ) {

      return Math.min(
        Math.max(
          value,
          min
        ),
        max
      );

    }


    function randomBetween(
      min,
      max
    ) {

      return (
        min +
        Math.random() *
        (
          max -
          min
        )
      );

    }


    function shuffle(array) {

      const copy =
        [...array];


      for (
        let i = copy.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }


      return copy;

    }


    function categoryFromFilename(
      filename
    ) {

      return filename
        .split("-")[0]
        .toLowerCase();

    }


    function boxesOverlap(
      a,
      b,
      padding = 0
    ) {

      return !(
        a.right + padding <= b.left ||
        a.left >= b.right + padding ||
        a.bottom + padding <= b.top ||
        a.top >= b.bottom + padding
      );

    }



    /* =====================================================
       IMAGE LOADING
       ===================================================== */

    function loadImageData(
      filename
    ) {

      return new Promise(
        resolve => {

          const image =
            new Image();


          image.src =
            filename;


          image.decoding =
            "async";


          image.onload =
            () => {

              resolve({

                filename,

                category:
                  categoryFromFilename(
                    filename
                  ),

                width:
                  image.naturalWidth,

                height:
                  image.naturalHeight,

                area:
                  image.naturalWidth *
                  image.naturalHeight

              });

            };


          image.onerror =
            () => {

              console.warn(
                `Could not load ${filename}`
              );


              resolve(
                null
              );

            };

        }
      );

    }



    /* =====================================================
       DISPLAY SIZE

       Still proportional to source dimensions,
       but compressed into a manageable range.
       ===================================================== */

    function calculateDisplayWidth(
      item,
      minArea,
      maxArea
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const minWidth =
        mobile
          ? 44
          : 58;


      const maxWidth =
        mobile
          ? 132
          : 205;


      const itemRoot =
        Math.sqrt(
          item.area
        );


      const minRoot =
        Math.sqrt(
          minArea
        );


      const maxRoot =
        Math.sqrt(
          maxArea
        );


      let normalized =
        (
          itemRoot -
          minRoot
        )
        /
        Math.max(
          1,
          maxRoot -
          minRoot
        );


      normalized =
        clamp(
          normalized,
          0,
          1
        );


      normalized =
        Math.pow(
          normalized,
          0.78
        );


      return (
        minWidth +
        normalized *
        (
          maxWidth -
          minWidth
        )
      );

    }



    /* =====================================================
       ROTATED BOUNDING BOX

       Collision checking uses the real footprint of the
       rotated artwork rather than the original rectangle.
       ===================================================== */

    function rotatedBounds(
      width,
      height,
      degrees
    ) {

      const radians =
        degrees *
        Math.PI /
        180;


      const cos =
        Math.abs(
          Math.cos(
            radians
          )
        );


      const sin =
        Math.abs(
          Math.sin(
            radians
          )
        );


      return {

        width:
          width * cos +
          height * sin,

        height:
          width * sin +
          height * cos

      };

    }



    /* =====================================================
       PREPARE DRAWING
       ===================================================== */

    function prepareDrawing(
      item,
      minArea,
      maxArea
    ) {

      const width =
        calculateDisplayWidth(
          item,
          minArea,
          maxArea
        );


      const height =
        width *
        (
          item.height /
          item.width
        );


      /*
        Keep rotations restrained.

        Enough irregularity to feel placed by hand,
        but not enough to create large dead spaces.
      */

      const rotation =
        randomBetween(
          -3.4,
          3.4
        );


      const bounds =
        rotatedBounds(
          width,
          height,
          rotation
        );


      return {

        ...item,

        displayWidth:
          width,

        displayHeight:
          height,

        rotation,

        boxWidth:
          bounds.width,

        boxHeight:
          bounds.height

      };

    }



    /* =====================================================
       PACK ONE CATEGORY

       Each filename prefix gets its own tight cluster.

       Example:
       figure-* stays with figure-*
       food-* stays with food-*
       etc.
       ===================================================== */

    function packCategory(
      items
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const itemGap =
        mobile
          ? 2
          : 3;


      const placed =
        [];


      /*
        Largest pieces first gives the smaller drawings
        more opportunities to fill the gaps later.
      */

      const ordered =
        [...items]
          .sort(
            (a, b) =>
              (
                b.boxWidth *
                b.boxHeight
              )
              -
              (
                a.boxWidth *
                a.boxHeight
              )
          );


      ordered.forEach(
        (
          item,
          itemIndex
        ) => {

          /*
            First item starts at the local origin.
          */

          if (
            itemIndex === 0
          ) {

            placed.push({

              ...item,

              left:
                -item.boxWidth / 2,

              top:
                -item.boxHeight / 2,

              right:
                item.boxWidth / 2,

              bottom:
                item.boxHeight / 2

            });


            return;

          }


          let best =
            null;


          /*
            Golden-angle spiral.

            We test lots of extremely close candidate positions
            and accept the first collision-free one.
          */

          const GOLDEN_ANGLE =
            Math.PI *
            (
              3 -
              Math.sqrt(5)
            );


          for (
            let attempt = 0;
            attempt < 5000;
            attempt++
          ) {

            const radius =
              2.4 *
              Math.sqrt(
                attempt
              );


            const angle =
              attempt *
              GOLDEN_ANGLE +
              randomBetween(
                -0.10,
                0.10
              );


            const centerX =
              Math.cos(
                angle
              ) *
              radius;


            const centerY =
              Math.sin(
                angle
              ) *
              radius;


            const candidate = {

              left:
                centerX -
                item.boxWidth / 2,

              top:
                centerY -
                item.boxHeight / 2,

              right:
                centerX +
                item.boxWidth / 2,

              bottom:
                centerY +
                item.boxHeight / 2

            };


            const collision =
              placed.some(
                other =>
                  boxesOverlap(
                    candidate,
                    other,
                    itemGap
                  )
              );


            if (
              !collision
            ) {

              best =
                candidate;

              break;

            }

          }


          /*
            Very unlikely fallback.
          */

          if (
            !best
          ) {

            const furthestRight =
              Math.max(
                ...placed.map(
                  box =>
                    box.right
                )
              );


            best = {

              left:
                furthestRight +
                itemGap,

              top:
                -item.boxHeight / 2,

              right:
                furthestRight +
                itemGap +
                item.boxWidth,

              bottom:
                item.boxHeight / 2

            };

          }


          placed.push({

            ...item,
            ...best

          });

        }
      );



      /* ---------------------------------------------
         NORMALIZE CATEGORY TO 0 / 0
         --------------------------------------------- */

      const minX =
        Math.min(
          ...placed.map(
            item =>
              item.left
          )
        );


      const minY =
        Math.min(
          ...placed.map(
            item =>
              item.top
          )
        );


      const maxX =
        Math.max(
          ...placed.map(
            item =>
              item.right
          )
        );


      const maxY =
        Math.max(
          ...placed.map(
            item =>
              item.bottom
          )
        );


      const normalized =
        placed.map(
          item => ({

            ...item,

            left:
              item.left -
              minX,

            top:
              item.top -
              minY,

            right:
              item.right -
              minX,

            bottom:
              item.bottom -
              minY

          })
        );


      return {

        items:
          normalized,

        width:
          maxX -
          minX,

        height:
          maxY -
          minY

      };

    }



    /* =====================================================
       PACK CATEGORY GROUPS

       Same basic idea again, but now every object being
       packed is a complete category cluster.
       ===================================================== */

    function packGroups(
      groups
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const groupGap =
        mobile
          ? 12
          : 18;


      const ordered =
        shuffle(
          groups
        )
        .sort(
          (a, b) =>
            (
              b.width *
              b.height
            )
            -
            (
              a.width *
              a.height
            )
        );


      const placed =
        [];


      ordered.forEach(
        (
          group,
          index
        ) => {

          if (
            index === 0
          ) {

            placed.push({

              ...group,

              left:
                -group.width / 2,

              top:
                -group.height / 2,

              right:
                group.width / 2,

              bottom:
                group.height / 2

            });


            return;

          }


          let best =
            null;


          const GOLDEN_ANGLE =
            Math.PI *
            (
              3 -
              Math.sqrt(5)
            );


          for (
            let attempt = 0;
            attempt < 7000;
            attempt++
          ) {

            const radius =
              5.5 *
              Math.sqrt(
                attempt
              );


            const angle =
              attempt *
              GOLDEN_ANGLE +
              randomBetween(
                -0.18,
                0.18
              );


            /*
              Slight horizontal bias gives us something closer
              to an open sketchbook spread than a perfect circle.
            */

            const centerX =
              Math.cos(
                angle
              ) *
              radius *
              1.18;


            const centerY =
              Math.sin(
                angle
              ) *
              radius *
              0.90;


            const candidate = {

              left:
                centerX -
                group.width / 2,

              top:
                centerY -
                group.height / 2,

              right:
                centerX +
                group.width / 2,

              bottom:
                centerY +
                group.height / 2

            };


            const collision =
              placed.some(
                other =>
                  boxesOverlap(
                    candidate,
                    other,
                    groupGap
                  )
              );


            if (
              !collision
            ) {

              best =
                candidate;

              break;

            }

          }


          if (
            !best
          ) {

            const furthestRight =
              Math.max(
                ...placed.map(
                  box =>
                    box.right
                )
              );


            best = {

              left:
                furthestRight +
                groupGap,

              top:
                -group.height / 2,

              right:
                furthestRight +
                groupGap +
                group.width,

              bottom:
                group.height / 2

            };

          }


          placed.push({

            ...group,
            ...best

          });

        }
      );



      /* ---------------------------------------------
         FIND GLOBAL EXTENTS
         --------------------------------------------- */

      const minX =
        Math.min(
          ...placed.map(
            group =>
              group.left
          )
        );


      const minY =
        Math.min(
          ...placed.map(
            group =>
              group.top
          )
        );


      const maxX =
        Math.max(
          ...placed.map(
            group =>
              group.right
          )
        );


      const maxY =
        Math.max(
          ...placed.map(
            group =>
              group.bottom
          )
        );


      return {

        groups:
          placed.map(
            group => ({

              ...group,

              left:
                group.left -
                minX,

              top:
                group.top -
                minY

            })
          ),

        width:
          maxX -
          minX,

        height:
          maxY -
          minY

      };

    }



    /* =====================================================
       CREATE DRAWING DOM
       ===================================================== */

    function createDrawing(
      item
    ) {

      /*
        Outer wrapper is the ROTATED bounding box.
        This is what collision detection packed.
      */

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "drawing";


      wrapper.style.left =
        `${item.left}px`;


      wrapper.style.top =
        `${item.top}px`;


      wrapper.style.width =
        `${item.boxWidth}px`;


      wrapper.style.height =
        `${item.boxHeight}px`;



      /*
        Inner image uses the true artwork dimensions.
      */

      const image =
        document.createElement(
          "img"
        );


      image.className =
        "drawing-art";


      image.src =
        item.filename;


      image.alt =
        "";


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.draggable =
        false;


      image.style.width =
        `${item.displayWidth}px`;


      image.style.height =
        `${item.displayHeight}px`;


      image.style.transform =
        `translate(-50%, -50%) rotate(${item.rotation}deg)`;


      wrapper.appendChild(
        image
      );


      return wrapper;

    }



    /* =====================================================
       BUILD SKETCHBOOK
       ===================================================== */

    let paperWidth =
      0;


    let paperHeight =
      0;


    async function buildSketchbook() {

      field.innerHTML =
        "";


      const loaded =
        (
          await Promise.all(
            files.map(
              loadImageData
            )
          )
        )
        .filter(Boolean);


      if (
        !loaded.length
      ) {
        return;
      }



      const minArea =
        Math.min(
          ...loaded.map(
            item =>
              item.area
          )
        );


      const maxArea =
        Math.max(
          ...loaded.map(
            item =>
              item.area
          )
        );



      /* ---------------------------------------------
         PREPARE IMAGE DIMENSIONS + ROTATIONS
         --------------------------------------------- */

      const prepared =
        loaded.map(
          item =>
            prepareDrawing(
              item,
              minArea,
              maxArea
            )
        );



      /* ---------------------------------------------
         EXACT PREFIX GROUPS
         --------------------------------------------- */

      const byCategory =
        new Map();


      prepared.forEach(
        item => {

          if (
            !byCategory.has(
              item.category
            )
          ) {

            byCategory.set(
              item.category,
              []
            );

          }


          byCategory
            .get(
              item.category
            )
            .push(
              item
            );

        }
      );



      /* ---------------------------------------------
         PACK EACH CATEGORY SEPARATELY
         --------------------------------------------- */

      const groups =
        [];


      byCategory.forEach(
        (
          items,
          category
        ) => {

          const packed =
            packCategory(
              items
            );


          groups.push({

            category,

            ...packed

          });

        }
      );



      /* ---------------------------------------------
         PACK THE COMPLETE CATEGORY GROUPS
         --------------------------------------------- */

      const layout =
        packGroups(
          groups
        );



      /* ---------------------------------------------
         PAPER PADDING
         --------------------------------------------- */

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const paperPadding =
        mobile
          ? 42
          : 62;



      paperWidth =
        layout.width +
        paperPadding * 2;


      paperHeight =
        layout.height +
        paperPadding * 2;



      /*
        Ensure the sheet still feels like a larger physical
        surface that can be dragged a little even if the
        packed composition happens to be small.
      */

      paperWidth =
        Math.max(
          paperWidth,
          viewport.clientWidth *
          (
            mobile
              ? 1.35
              : 1.18
          )
        );


      paperHeight =
        Math.max(
          paperHeight,
          viewport.clientHeight *
          (
            mobile
              ? 1.35
              : 1.16
          )
        );


      paper.style.width =
        `${paperWidth}px`;


      paper.style.height =
        `${paperHeight}px`;



      /* ---------------------------------------------
         CENTER PACKED CONTENT ON PAPER
         --------------------------------------------- */

      const contentOffsetX =
        (
          paperWidth -
          layout.width
        )
        / 2;


      const contentOffsetY =
        (
          paperHeight -
          layout.height
        )
        / 2;



      layout.groups.forEach(
        group => {

          const groupElement =
            document.createElement(
              "div"
            );


          groupElement.className =
            "drawing-group";


          groupElement.dataset.category =
            group.category;


          groupElement.style.left =
            `${
              contentOffsetX +
              group.left
            }px`;


          groupElement.style.top =
            `${
              contentOffsetY +
              group.top
            }px`;


          groupElement.style.width =
            `${group.width}px`;


          groupElement.style.height =
            `${group.height}px`;


          group.items.forEach(
            item => {

              groupElement.appendChild(
                createDrawing(
                  item
                )
              );

            }
          );


          field.appendChild(
            groupElement
          );

        }
      );


      centerPaper();

    }



    /* =====================================================
       DRAG / PAN
       ===================================================== */

    const pan = {

      x:
        0,

      y:
        0,

      startX:
        0,

      startY:
        0,

      originX:
        0,

      originY:
        0,

      dragging:
        false

    };


    function clampPan(
      x,
      y
    ) {

      const viewportWidth =
        viewport.clientWidth;


      const viewportHeight =
        viewport.clientHeight;


      let minX;
      let maxX;
      let minY;
      let maxY;



      if (
        paperWidth <=
        viewportWidth
      ) {

        minX =
          maxX =
          (
            viewportWidth -
            paperWidth
          )
          / 2;

      }

      else {

        minX =
          viewportWidth -
          paperWidth;

        maxX =
          0;

      }



      if (
        paperHeight <=
        viewportHeight
      ) {

        minY =
          maxY =
          (
            viewportHeight -
            paperHeight
          )
          / 2;

      }

      else {

        minY =
          viewportHeight -
          paperHeight;

        maxY =
          0;

      }


      return {

        x:
          clamp(
            x,
            minX,
            maxX
          ),

        y:
          clamp(
            y,
            minY,
            maxY
          )

      };

    }


    function setPan(
      x,
      y
    ) {

      const next =
        clampPan(
          x,
          y
        );


      pan.x =
        next.x;


      pan.y =
        next.y;


      paper.style.transform =
        `translate3d(${pan.x}px, ${pan.y}px, 0)`;

    }


    function centerPaper() {

      const x =
        (
          viewport.clientWidth -
          paperWidth
        )
        / 2;


      const y =
        (
          viewport.clientHeight -
          paperHeight
        )
        / 2;


      setPan(
        x,
        y
      );

    }



    viewport.addEventListener(
      "pointerdown",
      event => {

        pan.dragging =
          true;


        pan.startX =
          event.clientX;


        pan.startY =
          event.clientY;


        pan.originX =
          pan.x;


        pan.originY =
          pan.y;


        viewport.classList.add(
          "is-dragging"
        );


        viewport.setPointerCapture(
          event.pointerId
        );

      }
    );


    viewport.addEventListener(
      "pointermove",
      event => {

        if (
          !pan.dragging
        ) {
          return;
        }


        const dx =
          event.clientX -
          pan.startX;


        const dy =
          event.clientY -
          pan.startY;


        setPan(
          pan.originX +
          dx,

          pan.originY +
          dy
        );

      }
    );


    function finishDrag() {

      pan.dragging =
        false;


      viewport.classList.remove(
        "is-dragging"
      );

    }


    viewport.addEventListener(
      "pointerup",
      finishDrag
    );


    viewport.addEventListener(
      "pointercancel",
      finishDrag
    );



    /* =====================================================
       RESIZE
       ===================================================== */

    let resizeTimer =
      null;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          window.setTimeout(
            buildSketchbook,
            160
          );

      }
    );



    /* =====================================================
       START
       ===================================================== */

    buildSketchbook();

  })();
  </script>

</body>
</html>
