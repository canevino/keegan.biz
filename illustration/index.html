  <script>
  (() => {

    /* =====================================================

    const files = [

      "food-08.webp",
      "food-09.webp",
      "food-10.webp",

      "ghost-1.webp",
      "ghost-02.webp",

      "group-01.webp",
      "group-02.webp",
      "group-03.webp",

      "house-1.webp",
      "house-2.webp",
      "house-03.webp",
      "house-04.webp",
      "house-5.webp",
      "house-6.webp",
      "house-07.webp",
      "house-08.webp",

      "insect-01.webp",
      "insect-02.webp",

      "kitchen-01.webp",
      "kitchen-02.webp",
      "kitchen-03.webp",
      "kitchen-04.webp",
      "kitchen-05.webp",
      "kitchen-06.webp",

      "misc-01.webp",

      "multiple-01.webp",
      "multiple-02.webp",
      "multiple-03.webp",
      "multiple-04.webp",
      "multiple-05.webp",

      "music-01.webp",
      "music-02.webp",
      "music-03.webp",
      "music-04.webp",

      "nature-01.webp",

      "object-1.webp",
      "object-2.webp",
      "object-03.webp",
      "object-04.webp",
      "object-05.webp",

      "perspective-01.webp",

      "vehicle-01.webp",
      "vehicle-02.webp",
      "vehicle-03.webp"

    ];



    /* =====================================================
       ELEMENTS
       ===================================================== */

    const viewport =
      document.getElementById(
        "sketchbook-viewport"
      );


    const paper =
      document.getElementById(
        "sketchbook-paper"
      );


    const field =
      document.getElementById(
        "sketchbook-field"
      );


    const zoomIn =
      document.getElementById(
        "zoom-in"
      );


    const zoomOut =
      document.getElementById(
        "zoom-out"
      );


    if (
      !viewport ||
      !paper ||
      !field
    ) {
      return;
    }



    /* =====================================================
       HELPERS
       ===================================================== */

    function clamp(
      value,
      min,
      max
    ) {

      return Math.min(
        Math.max(
          value,
          min
        ),
        max
      );

    }


    function randomBetween(
      min,
      max
    ) {

      return (
        min +
        Math.random() *
        (
          max -
          min
        )
      );

    }


    function shuffle(
      array
    ) {

      const copy =
        [...array];


      for (
        let i =
          copy.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }


      return copy;

    }


    function categoryFromFilename(
      filename
    ) {

      let category =
        filename
          .split("-")[0]
          .toLowerCase();


      if (
        category === "animals"
      ) {
        category =
          "animal";
      }


      return category;

    }



    /* =====================================================
       LOAD + ANALYZE VISIBLE CONTENT

       We estimate where the actual drawing is inside
       each WebP.

       Near-white pixels are treated as empty paper.

       This is important:
       collision detection will use the visible drawing,
       NOT the entire rectangular exported image.
       ===================================================== */

    function loadImageData(
      filename
    ) {

      return new Promise(
        resolve => {

          const image =
            new Image();


          image.src =
            filename;


          image.decoding =
            "async";


          image.onload =
            () => {

              const visibleBounds =
                analyzeVisibleBounds(
                  image
                );


              resolve({

                filename,

                category:
                  categoryFromFilename(
                    filename
                  ),

                width:
                  image.naturalWidth,

                height:
                  image.naturalHeight,

                area:
                  image.naturalWidth *
                  image.naturalHeight,

                visibleBounds

              });

            };


          image.onerror =
            () => {

              console.warn(
                `Could not load ${filename}`
              );


              resolve(
                null
              );

            };

        }
      );

    }



    function analyzeVisibleBounds(
      image
    ) {

      /*
        Analyze a small version.
        This keeps startup fast even with lots of images.
      */

      const maxSample =
        110;


      const ratio =
        Math.min(
          1,
          maxSample /
          Math.max(
            image.naturalWidth,
            image.naturalHeight
          )
        );


      const width =
        Math.max(
          1,
          Math.round(
            image.naturalWidth *
            ratio
          )
        );


      const height =
        Math.max(
          1,
          Math.round(
            image.naturalHeight *
            ratio
          )
        );


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        width;


      canvas.height =
        height;


      const context =
        canvas.getContext(
          "2d",
          {
            willReadFrequently:
              true
          }
        );


      context.drawImage(
        image,
        0,
        0,
        width,
        height
      );


      let data;


      try {

        data =
          context.getImageData(
            0,
            0,
            width,
            height
          ).data;

      }

      catch {

        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };

      }



      let minX =
        width;


      let minY =
        height;


      let maxX =
        -1;


      let maxY =
        -1;



      /*
        White / nearly-white pixels count as empty.
        Lower threshold = looser visible crop.
      */

      const WHITE_THRESHOLD =
        246;


      const ALPHA_THRESHOLD =
        18;



      for (
        let y = 0;
        y < height;
        y++
      ) {

        for (
          let x = 0;
          x < width;
          x++
        ) {

          const index =
            (
              y *
              width +
              x
            )
            *
            4;


          const r =
            data[index];


          const g =
            data[
              index + 1
            ];


          const b =
            data[
              index + 2
            ];


          const a =
            data[
              index + 3
            ];


          if (
            a <=
            ALPHA_THRESHOLD
          ) {
            continue;
          }


          const nearlyWhite =
            r >= WHITE_THRESHOLD &&
            g >= WHITE_THRESHOLD &&
            b >= WHITE_THRESHOLD;


          if (
            nearlyWhite
          ) {
            continue;
          }


          minX =
            Math.min(
              minX,
              x
            );


          minY =
            Math.min(
              minY,
              y
            );


          maxX =
            Math.max(
              maxX,
              x
            );


          maxY =
            Math.max(
              maxY,
              y
            );

        }

      }



      if (
        maxX < minX ||
        maxY < minY
      ) {

        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };

      }



      /*
        Tiny safety margin around detected marks.
      */

      const margin =
        2;


      minX =
        Math.max(
          0,
          minX -
          margin
        );


      minY =
        Math.max(
          0,
          minY -
          margin
        );


      maxX =
        Math.min(
          width - 1,
          maxX +
          margin
        );


      maxY =
        Math.min(
          height - 1,
          maxY +
          margin
        );


      return {

        left:
          minX /
          width,

        top:
          minY /
          height,

        right:
          (
            maxX + 1
          )
          /
          width,

        bottom:
          (
            maxY + 1
          )
          /
          height

      };

    }



    /* =====================================================
       SOURCE-DIMENSION SCALE

       Actual source dimensions remain the primary scale.
       ===================================================== */

    function calculateDisplaySize(
      item,
      referenceLinear
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const sourceLinear =
        Math.sqrt(
          item.width *
          item.height
        );


      const ratio =
        sourceLinear /
        Math.max(
          1,
          referenceLinear
        );


      const base =
        mobile
          ? 90
          : 122;


      /*
        Strong relationship to original dimensions.
      */

      let longest =
        base *
        Math.pow(
          ratio,
          .94
        );


      /*
        Safety only.
      */

      longest =
        clamp(
          longest,
          mobile
            ? 42
            : 52,
          mobile
            ? 230
            : 330
        );


      let width;
      let height;


      if (
        item.width >=
        item.height
      ) {

        width =
          longest;


        height =
          longest *
          (
            item.height /
            item.width
          );

      }

      else {

        height =
          longest;


        width =
          longest *
          (
            item.width /
            item.height
          );

      }


      return {
        width,
        height
      };

    }



    /* =====================================================
       PREPARE DRAWING
       ===================================================== */

    function prepareDrawing(
      item,
      referenceLinear
    ) {

      const display =
        calculateDisplaySize(
          item,
          referenceLinear
        );


      const rotation =
        randomBetween(
          -4.5,
          4.5
        );


      const visible =
        item.visibleBounds;


      return {

        ...item,

        displayWidth:
          display.width,

        displayHeight:
          display.height,

        rotation,

        visibleLeft:
          visible.left *
          display.width,

        visibleTop:
          visible.top *
          display.height,

        visibleWidth:
          (
            visible.right -
            visible.left
          )
          *
          display.width,

        visibleHeight:
          (
            visible.bottom -
            visible.top
          )
          *
          display.height

      };

    }



    /* =====================================================
       VISIBLE COLLISION BOX

       For packing, use actual visible drawing bounds.
       Rotation gets a small safety expansion.
       ===================================================== */

    function collisionBoxAt(
      item,
      x,
      y
    ) {

      const rotationSafety =
        Math.abs(
          item.rotation
        )
        /
        4.5 *
        4;


      return {

        left:
          x +
          item.visibleLeft -
          rotationSafety,

        top:
          y +
          item.visibleTop -
          rotationSafety,

        right:
          x +
          item.visibleLeft +
          item.visibleWidth +
          rotationSafety,

        bottom:
          y +
          item.visibleTop +
          item.visibleHeight +
          rotationSafety

      };

    }



    function boxesOverlap(
      a,
      b,
      gap = 0
    ) {

      return !(
        a.right + gap <= b.left ||
        a.left >= b.right + gap ||
        a.bottom + gap <= b.top ||
        a.top >= b.bottom + gap
      );

    }



    /* =====================================================
       CATEGORY CENTERS

       Categories are NOT containers.

       They only provide loose attraction points.

       Centers themselves are distributed irregularly
       around the spread, not in rows.
       ===================================================== */

    function createCategoryCenters(
      categories,
      width,
      height
    ) {

      const names =
        shuffle(
          [...categories]
        );


      const centers =
        new Map();


      /*
        Start from a staggered 2D constellation.
      */

      const cols =
        5;


      const rows =
        Math.ceil(
          names.length /
          cols
        );


      names.forEach(
        (
          name,
          index
        ) => {

          const column =
            index %
            cols;


          const row =
            Math.floor(
              index /
              cols
            );


          const cellWidth =
            width /
            cols;


          const cellHeight =
            height /
            rows;


          let x =
            (
              column +
              .5
            )
            *
            cellWidth;


          let y =
            (
              row +
              .5
            )
            *
            cellHeight;


          /*
            Destroy the grid visually.
          */

          x +=
            randomBetween(
              -cellWidth * .34,
              cellWidth * .34
            );


          y +=
            randomBetween(
              -cellHeight * .34,
              cellHeight * .34
            );


          /*
            Alternate rows sideways.
          */

          if (
            row % 2
          ) {

            x +=
              cellWidth *
              .22;

          }


          x =
            clamp(
              x,
              cellWidth * .25,
              width -
              cellWidth * .25
            );


          y =
            clamp(
              y,
              cellHeight * .22,
              height -
              cellHeight * .22
            );


          centers.set(
            name,
            {
              x,
              y
            }
          );

        }
      );


      return centers;

    }



    /* =====================================================
       PACK EVERYTHING INDIVIDUALLY

       No rows.
       No category boxes.
       No group rectangles.

       Each drawing searches outward from its category
       gravity point for the tightest available position.
       ===================================================== */

    function packDrawings(
      drawings
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      /*
        Wide sketchbook spread.
      */

      const paperWidth =
        mobile
          ? 1500
          : 2700;


      const paperHeight =
        mobile
          ? 930
          : 1350;


      const categories =
        new Set(
          drawings.map(
            item =>
              item.category
          )
        );


      const centers =
        createCategoryCenters(
          categories,
          paperWidth,
          paperHeight
        );


      const placed =
        [];


      /*
        Larger artwork first.
        Smaller work fills the gaps afterward.
      */

      const ordered =
        [...drawings]
          .sort(
            (a, b) =>

              (
                b.visibleWidth *
                b.visibleHeight
              )
              -
              (
                a.visibleWidth *
                a.visibleHeight
              )

          );



      ordered.forEach(
        item => {

          const center =
            centers.get(
              item.category
            );


          let winner =
            null;


          let winnerScore =
            Infinity;


          /*
            Golden-angle search outward from category center.

            Every image gets an independent position.
          */

          const GOLDEN_ANGLE =
            Math.PI *
            (
              3 -
              Math.sqrt(5)
            );


          for (
            let attempt = 0;
            attempt < 9000;
            attempt++
          ) {

            const radius =
              3.1 *
              Math.sqrt(
                attempt
              );


            const angle =
              attempt *
              GOLDEN_ANGLE +
              randomBetween(
                -.10,
                .10
              );


            /*
              Non-circular spread.
              Wider sideways, but still genuinely 2D.
            */

            const visibleCenterX =
              center.x +
              Math.cos(
                angle
              )
              *
              radius
              *
              1.18;


            const visibleCenterY =
              center.y +
              Math.sin(
                angle
              )
              *
              radius
              *
              .94;


            /*
              Convert desired VISIBLE center to full-image
              top-left position.
            */

            const x =
              visibleCenterX -
              (
                item.visibleLeft +
                item.visibleWidth / 2
              );


            const y =
              visibleCenterY -
              (
                item.visibleTop +
                item.visibleHeight / 2
              );


            const collision =
              collisionBoxAt(
                item,
                x,
                y
              );


            /*
              Keep actual visible artwork on the sheet.
            */

            const edge =
              24;


            if (
              collision.left < edge ||
              collision.top < edge ||
              collision.right >
                paperWidth - edge ||
              collision.bottom >
                paperHeight - edge
            ) {
              continue;
            }


            const hit =
              placed.some(
                other =>
                  boxesOverlap(
                    collision,
                    other.collision,
                    1
                  )
              );


            if (
              hit
            ) {
              continue;
            }


            /*
              Prefer positions very close to the
              category center, but add a little noise
              to avoid mathematical regularity.
            */

            const distance =
              Math.hypot(
                visibleCenterX -
                center.x,

                visibleCenterY -
                center.y
              );


            const score =
              distance +
              Math.random() *
              18;


            if (
              score <
              winnerScore
            ) {

              winnerScore =
                score;


              winner = {
                x,
                y,
                collision
              };

            }


            /*
              Once we're clearly getting farther out
              than the best solution, stop searching.
            */

            if (
              winner &&
              radius >
              winnerScore +
              80
            ) {
              break;
            }

          }



          /*
            Fallback anywhere on canvas.
          */

          if (
            !winner
          ) {

            for (
              let attempt = 0;
              attempt < 6000;
              attempt++
            ) {

              const x =
                randomBetween(
                  30 -
                  item.visibleLeft,
                  paperWidth -
                  item.visibleLeft -
                  item.visibleWidth -
                  30
                );


              const y =
                randomBetween(
                  30 -
                  item.visibleTop,
                  paperHeight -
                  item.visibleTop -
                  item.visibleHeight -
                  30
                );


              const collision =
                collisionBoxAt(
                  item,
                  x,
                  y
                );


              const hit =
                placed.some(
                  other =>
                    boxesOverlap(
                      collision,
                      other.collision,
                      1
                    )
                );


              if (
                !hit
              ) {

                winner = {
                  x,
                  y,
                  collision
                };

                break;

              }

            }

          }


          if (
            winner
          ) {

            placed.push({

              ...item,

              x:
                winner.x,

              y:
                winner.y,

              collision:
                winner.collision

            });

          }

        }
      );



      /* ===================================================
         GLOBAL COMPACTION

         Pull everything toward center/category center
         in many tiny steps.

         This removes large pockets of empty space.
         =================================================== */

      const spreadCenterX =
        paperWidth /
        2;


      const spreadCenterY =
        paperHeight /
        2;



      for (
        let pass = 0;
        pass < 85;
        pass++
      ) {

        const order =
          shuffle(
            placed
          );


        order.forEach(
          item => {

            const categoryCenter =
              centers.get(
                item.category
              );


            /*
              Blend global-center gravity and
              category-center gravity.
            */

            const targetX =
              categoryCenter.x *
              .68 +
              spreadCenterX *
              .32;


            const targetY =
              categoryCenter.y *
              .68 +
              spreadCenterY *
              .32;


            const visibleCenterX =
              (
                item.collision.left +
                item.collision.right
              )
              / 2;


            const visibleCenterY =
              (
                item.collision.top +
                item.collision.bottom
              )
              / 2;


            const dx =
              targetX -
              visibleCenterX;


            const dy =
              targetY -
              visibleCenterY;


            const distance =
              Math.hypot(
                dx,
                dy
              );


            if (
              distance <
              .01
            ) {
              return;
            }


            /*
              Tiny movement per pass.
            */

            const step =
              Math.min(
                5.5,
                distance *
                .12
              );


            const nextX =
              item.x +
              dx /
              distance *
              step;


            const nextY =
              item.y +
              dy /
              distance *
              step;


            const nextCollision =
              collisionBoxAt(
                item,
                nextX,
                nextY
              );


            const hit =
              placed.some(
                other => {

                  if (
                    other === item
                  ) {
                    return false;
                  }


                  return boxesOverlap(
                    nextCollision,
                    other.collision,
                    .5
                  );

                }
              );


            if (
              hit
            ) {
              return;
            }


            item.x =
              nextX;


            item.y =
              nextY;


            item.collision =
              nextCollision;

          }
        );

      }



      /* ===================================================
         CROP PAPER TO THE ACTUAL COMPOSITION

         This removes dead empty outer space.
         =================================================== */

      const minX =
        Math.min(
          ...placed.map(
            item =>
              item.collision.left
          )
        );


      const minY =
        Math.min(
          ...placed.map(
            item =>
              item.collision.top
          )
        );


      const maxX =
        Math.max(
          ...placed.map(
            item =>
              item.collision.right
          )
        );


      const maxY =
        Math.max(
          ...placed.map(
            item =>
              item.collision.bottom
          )
        );


      const outerPadding =
        mobile
          ? 38
          : 52;


      const cropLeft =
        minX -
        outerPadding;


      const cropTop =
        minY -
        outerPadding;


      const finalWidth =
        (
          maxX -
          minX
        )
        +
        outerPadding *
        2;


      const finalHeight =
        (
          maxY -
          minY
        )
        +
        outerPadding *
        2;


      placed.forEach(
        item => {

          item.x -=
            cropLeft;


          item.y -=
            cropTop;

        }
      );


      return {
        width:
          finalWidth,

        height:
          finalHeight,

        items:
          placed
      };

    }



    /* =====================================================
       CREATE DRAWING
       ===================================================== */

    function createDrawing(
      item
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "drawing";


      wrapper.style.left =
        `${item.x}px`;


      wrapper.style.top =
        `${item.y}px`;


      wrapper.style.width =
        `${item.displayWidth}px`;


      wrapper.style.height =
        `${item.displayHeight}px`;



      const image =
        document.createElement(
          "img"
        );


      image.className =
        "drawing-art";


      image.src =
        item.filename;


      image.alt =
        "";


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.draggable =
        false;


      image.style.transform =
        `rotate(${item.rotation}deg)`;


      wrapper.appendChild(
        image
      );


      return wrapper;

    }



    /* =====================================================
       BUILD
       ===================================================== */

    let paperWidth =
      0;


    let paperHeight =
      0;



    async function buildSketchbook() {

      field.innerHTML =
        "";


      const loaded =
        (
          await Promise.all(
            files.map(
              loadImageData
            )
          )
        )
        .filter(Boolean);


      if (
        !loaded.length
      ) {
        return;
      }



      /* ---------------------------------------------
         MEDIAN SOURCE DIMENSION
         --------------------------------------------- */

      const linear =
        loaded
          .map(
            item =>
              Math.sqrt(
                item.width *
                item.height
              )
          )
          .sort(
            (a, b) =>
              a - b
          );


      const midpoint =
        Math.floor(
          linear.length /
          2
        );


      const referenceLinear =
        linear.length % 2

          ? linear[
              midpoint
            ]

          : (
              linear[
                midpoint - 1
              ]
              +
              linear[
                midpoint
              ]
            )
            / 2;



      const prepared =
        loaded.map(
          item =>
            prepareDrawing(
              item,
              referenceLinear
            )
        );



      const layout =
        packDrawings(
          prepared
        );


      paperWidth =
        layout.width;


      paperHeight =
        layout.height;


      paper.style.width =
        `${paperWidth}px`;


      paper.style.height =
        `${paperHeight}px`;



      layout.items.forEach(
        item => {

          field.appendChild(
            createDrawing(
              item
            )
          );

        }
      );


      fitAll();

    }



    /* =====================================================
       VIEW STATE
       ===================================================== */

    const view = {

      x:
        0,

      y:
        0,

      zoom:
        1,

      minZoom:
        .1,

      maxZoom:
        4,

      startX:
        0,

      startY:
        0,

      originX:
        0,

      originY:
        0,

      dragging:
        false

    };



    function constrainPan(
      x,
      y,
      zoom
    ) {

      const width =
        paperWidth *
        zoom;


      const height =
        paperHeight *
        zoom;


      const vw =
        viewport.clientWidth;


      const vh =
        viewport.clientHeight;


      let minX;
      let maxX;
      let minY;
      let maxY;



      if (
        width <= vw
      ) {

        minX =
          maxX =
          (
            vw -
            width
          )
          / 2;

      }

      else {

        minX =
          vw -
          width;

        maxX =
          0;

      }



      if (
        height <= vh
      ) {

        minY =
          maxY =
          (
            vh -
            height
          )
          / 2;

      }

      else {

        minY =
          vh -
          height;

        maxY =
          0;

      }


      return {
        x:
          clamp(
            x,
            minX,
            maxX
          ),

        y:
          clamp(
            y,
            minY,
            maxY
          )
      };

    }



    function applyView() {

      paper.style.transform =
        `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.zoom})`;

    }



    function setView(
      x,
      y,
      zoom
    ) {

      view.zoom =
        clamp(
          zoom,
          view.minZoom,
          view.maxZoom
        );


      const position =
        constrainPan(
          x,
          y,
          view.zoom
        );


      view.x =
        position.x;


      view.y =
        position.y;


      applyView();

    }



    /* =====================================================
       FIT WHOLE SPREAD
       ===================================================== */

    function fitAll() {

      const margin =
        14;


      const zoomX =
        (
          viewport.clientWidth -
          margin * 2
        )
        /
        paperWidth;


      const zoomY =
        (
          viewport.clientHeight -
          margin * 2
        )
        /
        paperHeight;


      const zoom =
        Math.min(
          zoomX,
          zoomY
        );


      view.minZoom =
        zoom *
        .85;


      const width =
        paperWidth *
        zoom;


      const height =
        paperHeight *
        zoom;


      setView(

        (
          viewport.clientWidth -
          width
        )
        / 2,

        (
          viewport.clientHeight -
          height
        )
        / 2,

        zoom

      );

    }



    /* =====================================================
       ZOOM
       ===================================================== */

    function zoomAt(
      screenX,
      screenY,
      nextZoom
    ) {

      const worldX =
        (
          screenX -
          view.x
        )
        /
        view.zoom;


      const worldY =
        (
          screenY -
          view.y
        )
        /
        view.zoom;


      const zoom =
        clamp(
          nextZoom,
          view.minZoom,
          view.maxZoom
        );


      setView(

        screenX -
        worldX *
        zoom,

        screenY -
        worldY *
        zoom,

        zoom

      );

    }



    function zoomCenter(
      factor
    ) {

      zoomAt(

        viewport.clientWidth /
        2,

        viewport.clientHeight /
        2,

        view.zoom *
        factor

      );

    }



    zoomIn.addEventListener(
      "click",
      () =>
        zoomCenter(
          1.22
        )
    );


    zoomOut.addEventListener(
      "click",
      () =>
        zoomCenter(
          1 / 1.22
        )
    );



    viewport.addEventListener(
      "wheel",
      event => {

        event.preventDefault();


        const rect =
          viewport.getBoundingClientRect();


        const x =
          event.clientX -
          rect.left;


        const y =
          event.clientY -
          rect.top;


        /*
          Smooth mouse / trackpad zoom.
        */

        const factor =
          Math.exp(
            -event.deltaY *
            .00145
          );


        zoomAt(
          x,
          y,
          view.zoom *
          factor
        );

      },
      {
        passive:
          false
      }
    );



    /* =====================================================
       DRAG
       ===================================================== */

    viewport.addEventListener(
      "pointerdown",
      event => {

        if (
          event.target.closest(
            ".zoom-controls"
          )
        ) {
          return;
        }


        view.dragging =
          true;


        view.startX =
          event.clientX;


        view.startY =
          event.clientY;


        view.originX =
          view.x;


        view.originY =
          view.y;


        viewport.classList.add(
          "is-dragging"
        );


        viewport.setPointerCapture(
          event.pointerId
        );

      }
    );


    viewport.addEventListener(
      "pointermove",
      event => {

        if (
          !view.dragging
        ) {
          return;
        }


        setView(

          view.originX +
          event.clientX -
          view.startX,

          view.originY +
          event.clientY -
          view.startY,

          view.zoom

        );

      }
    );


    function finishDrag() {

      view.dragging =
        false;


      viewport.classList.remove(
        "is-dragging"
      );

    }


    viewport.addEventListener(
      "pointerup",
      finishDrag
    );


    viewport.addEventListener(
      "pointercancel",
      finishDrag
    );



    /* =====================================================
       RESIZE
       ===================================================== */

    let resizeTimer =
      null;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          window.setTimeout(
            buildSketchbook,
            180
          );

      }
    );



    /* =====================================================
       START
       ===================================================== */

    buildSketchbook();

  })();
  </script>

</body>
</html>
