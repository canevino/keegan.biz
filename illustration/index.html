    /* =====================================================
       ELEMENTS
       ===================================================== */

    const viewport =
      document.getElementById(
        "sketchbook-viewport"
      );

    const paper =
      document.getElementById(
        "sketchbook-paper"
      );

      document.getElementById(
        "sketchbook-field"
      );


    if (
      !viewport ||
      !paper ||
      !field
    ) {
      return;
    }



    /* =====================================================
       HELPERS
       ===================================================== */

    function clamp(
      value,
      min,
      max
    ) {
      return Math.min(
        Math.max(value, min),
        max
      );
    }


    function lerp(
      min,
      max,
      t
    ) {
      return min + (max - min) * t;
    }


    function randomBetween(
      min,
      max
    ) {
      return min + Math.random() * (max - min);
    }


    function shuffle(array) {

      const copy =
        [...array];

      for (
        let i = copy.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }

      return copy;

    }


    function prefixFromFilename(
      filename
    ) {

      return filename
        .split("-")[0]
        .toLowerCase();

    }


    function normalizeCategory(
      prefix
    ) {

      if (prefix === "animals") {
        return "animal";
      }

      return prefix;

    }


    function categoryFromFilename(
      filename
    ) {
      return normalizeCategory(
        prefixFromFilename(filename)
      );
    }


    function boxesOverlap(
      a,
      b,
      padding = 0
    ) {

      return !(
        a.right + padding <= b.left ||
        a.left >= b.right + padding ||
        a.bottom + padding <= b.top ||
        a.top >= b.bottom + padding
      );

    }


    function rotatedBounds(
      width,
      height,
      degrees
    ) {

      const radians =
        degrees *
        Math.PI /
        180;

      const cos =
        Math.abs(
          Math.cos(radians)
        );

      const sin =
        Math.abs(
          Math.sin(radians)
        );

      return {
        width:
          width * cos +
          height * sin,
        height:
          width * sin +
          height * cos
      };

    }



    /* =====================================================
       IMAGE LOADING
       ===================================================== */

    function loadImageData(
      filename
    ) {

      return new Promise(resolve => {

        const image =
          new Image();

        image.src =
          filename;

        image.decoding =
          "async";

        image.onload =
          () => {

            resolve({

              filename,

              category:
                categoryFromFilename(filename),

              width:
                image.naturalWidth,

              height:
                image.naturalHeight,

              area:
                image.naturalWidth *
                image.naturalHeight

            });

          };

        image.onerror =
          () => {

            console.warn(
              `Could not load ${filename}`
            );

            resolve(null);

          };

      });

    }



    /* =====================================================
       RENDER SIZE

       Larger source files still read larger, but:
       - very tall drawings do not become absurdly huge
       - tiny drawings do not disappear
       - everything sits in a tighter common family
       ===================================================== */

    function calculateDisplaySize(
      item,
      minArea,
      maxArea
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;

      const sqrtArea =
        Math.sqrt(item.area);

      const minRoot =
        Math.sqrt(minArea);

      const maxRoot =
        Math.sqrt(maxArea);

      let normalized =
        (
          sqrtArea -
          minRoot
        )
        /
        Math.max(
          1,
          maxRoot - minRoot
        );

      normalized =
        clamp(
          normalized,
          0,
          1
        );

      normalized =
        Math.pow(
          normalized,
          0.82
        );

      const baseLongest =
        mobile
          ? lerp(54, 150, normalized)
          : lerp(68, 225, normalized);

      const aspect =
        item.width / item.height;

      let longest =
        baseLongest;

      /*
        Restrain extreme aspect-ratio drawings
        such as very tall knives or very wide objects.
      */

      if (aspect < 0.48) {
        longest *= 0.86;
      }

      if (aspect > 2.5) {
        longest *= 0.88;
      }

      let displayWidth;
      let displayHeight;

      if (item.width >= item.height) {

        displayWidth =
          longest;

        displayHeight =
          longest *
          (
            item.height /
            item.width
          );

      }

      else {

        displayHeight =
          longest;

        displayWidth =
          longest *
          (
            item.width /
            item.height
          );

      }

      const maxRenderedHeight =
        mobile
          ? 170
          : 290;

      const minRenderedHeight =
        mobile
          ? 34
          : 44;

      if (
        displayHeight >
        maxRenderedHeight
      ) {

        const scale =
          maxRenderedHeight /
          displayHeight;

        displayWidth *= scale;
        displayHeight *= scale;

      }

      if (
        displayHeight <
        minRenderedHeight
      ) {

        const scale =
          minRenderedHeight /
          displayHeight;

        displayWidth *= scale;
        displayHeight *= scale;

      }

      return {
        width: displayWidth,
        height: displayHeight
      };

    }



    /* =====================================================
       PREPARE DRAWINGS
       ===================================================== */

    function prepareDrawing(
      item,
      minArea,
      maxArea
    ) {

      const size =
        calculateDisplaySize(
          item,
          minArea,
          maxArea
        );

      const rotation =
        randomBetween(
          -2.8,
          2.8
        );

      const bounds =
        rotatedBounds(
          size.width,
          size.height,
          rotation
        );

      return {

        ...item,

        displayWidth:
          size.width,

        displayHeight:
          size.height,

        rotation,

        boxWidth:
          bounds.width,

        boxHeight:
          bounds.height

      };

    }



    /* =====================================================
       TIGHT CATEGORY PACKING

       Each filename prefix gets its own dense little pile.
       ===================================================== */

    function packCategory(
      items
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;

      const itemGap =
        mobile
          ? 1
          : 2;

      const placed =
        [];

      const ordered =
        [...items].sort(
          (a, b) =>
            (
              b.boxWidth *
              b.boxHeight
            ) -
            (
              a.boxWidth *
              a.boxHeight
            )
        );

      ordered.forEach(
        (
          item,
          itemIndex
        ) => {

          if (itemIndex === 0) {

            placed.push({

              ...item,

              left:
                -item.boxWidth / 2,

              top:
                -item.boxHeight / 2,

              right:
                item.boxWidth / 2,

              bottom:
                item.boxHeight / 2

            });

            return;

          }

          const GOLDEN_ANGLE =
            Math.PI *
            (
              3 -
              Math.sqrt(5)
            );

          let best =
            null;

          let bestScore =
            Infinity;

          const existing =
            placed.map(box => ({
              left: box.left,
              top: box.top,
              right: box.right,
              bottom: box.bottom
            }));

          for (
            let attempt = 0;
            attempt < 2600;
            attempt++
          ) {

            const radius =
              2.1 *
              Math.sqrt(attempt);

            const angle =
              attempt *
              GOLDEN_ANGLE +
              randomBetween(
                -0.07,
                0.07
              );

            const centerX =
              Math.cos(angle) *
              radius;

            const centerY =
              Math.sin(angle) *
              radius;

            const candidate = {

              left:
                centerX -
                item.boxWidth / 2,

              top:
                centerY -
                item.boxHeight / 2,

              right:
                centerX +
                item.boxWidth / 2,

              bottom:
                centerY +
                item.boxHeight / 2

            };

            const collision =
              existing.some(
                other =>
                  boxesOverlap(
                    candidate,
                    other,
                    itemGap
                  )
              );

            if (collision) {
              continue;
            }

            let minX =
              candidate.left;

            let minY =
              candidate.top;

            let maxX =
              candidate.right;

            let maxY =
              candidate.bottom;

            existing.forEach(other => {
              minX =
                Math.min(minX, other.left);
              minY =
                Math.min(minY, other.top);
              maxX =
                Math.max(maxX, other.right);
              maxY =
                Math.max(maxY, other.bottom);
            });

            const unionWidth =
              maxX - minX;

            const unionHeight =
              maxY - minY;

            const unionArea =
              unionWidth *
              unionHeight;

            const distance =
              Math.hypot(
                centerX,
                centerY
              );

            const compactnessPenalty =
              unionArea +
              distance * 22;

            if (
              compactnessPenalty <
              bestScore
            ) {

              bestScore =
                compactnessPenalty;

              best =
                candidate;

            }

          }

          if (!best) {

            const furthestRight =
              Math.max(
                ...placed.map(
                  box => box.right
                )
              );

            best = {

              left:
                furthestRight +
                itemGap,

              top:
                -item.boxHeight / 2,

              right:
                furthestRight +
                itemGap +
                item.boxWidth,

              bottom:
                item.boxHeight / 2

            };

          }

          placed.push({
            ...item,
            ...best
          });

        }
      );

      const minX =
        Math.min(
          ...placed.map(
            item => item.left
          )
        );

      const minY =
        Math.min(
          ...placed.map(
            item => item.top
          )
        );

      const maxX =
        Math.max(
          ...placed.map(
            item => item.right
          )
        );

      const maxY =
        Math.max(
          ...placed.map(
            item => item.bottom
          )
        );

      return {

        items:
          placed.map(item => ({

            ...item,

            left:
              item.left - minX,

            top:
              item.top - minY,

            right:
              item.right - minX,

            bottom:
              item.bottom - minY

          })),

        width:
          maxX - minX,

        height:
          maxY - minY

      };

    }



    /* =====================================================
       GROUP ANCHORS

       These keep the overall spread wide and top-to-bottom,
       but still allow local randomness.
       ===================================================== */

    function buildAnchors() {

      return {

        vehicle: [0.07, 0.12],
        group: [0.18, 0.16],
        fishing: [0.88, 0.12],
        insect: [0.49, 0.13],

        figure: [0.40, 0.33],
        ghost: [0.52, 0.35],
        multiple: [0.63, 0.34],
        kitchen: [0.74, 0.33],

        animal: [0.16, 0.46],
        face: [0.10, 0.66],
        object: [0.67, 0.53],
        perspective: [0.83, 0.47],

        house: [0.21, 0.78],
        city: [0.86, 0.76],
        nature: [0.38, 0.84],
        food: [0.55, 0.80],

        music: [0.72, 0.88],
        misc: [0.92, 0.89]

      };

    }



    /* =====================================================
       PLACE GROUPS INTO A WIDE COMPOSITION
       ===================================================== */

    function placeGroupsIntoComposition(
      groups,
      compositionWidth,
      compositionHeight
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;

      const groupGap =
        mobile
          ? 8
          : 12;

      const anchorMap =
        buildAnchors();

      const placed =
        [];

      const renderOrder = [
        "vehicle",
        "group",
        "fishing",
        "insect",

        "figure",
        "ghost",
        "multiple",
        "kitchen",

        "animal",
        "face",
        "object",
        "perspective",

        "house",
        "city",
        "nature",
        "food",

        "music",
        "misc"
      ];

      const completeOrder =
        [
          ...renderOrder,
          ...groups
            .map(group => group.category)
            .filter(
              category =>
                !renderOrder.includes(category)
            )
        ];

      completeOrder.forEach(
        category => {

          const group =
            groups.find(
              item =>
                item.category === category
            );

          if (!group) {
            return;
          }

          const anchor =
            anchorMap[group.category] ||
            [0.5, 0.5];

          const anchorX =
            anchor[0] *
            compositionWidth;

          const anchorY =
            anchor[1] *
            compositionHeight;

          const GOLDEN_ANGLE =
            Math.PI *
            (
              3 -
              Math.sqrt(5)
            );

          let best =
            null;

          let bestScore =
            Infinity;

          for (
            let attempt = 0;
            attempt < 3500;
            attempt++
          ) {

            let centerX;
            let centerY;

            if (attempt === 0) {

              centerX =
                anchorX;

              centerY =
                anchorY;

            }

            else {

              const radius =
                5.8 *
                Math.sqrt(attempt);

              const angle =
                attempt *
                GOLDEN_ANGLE +
                randomBetween(
                  -0.16,
                  0.16
                );

              centerX =
                anchorX +
                Math.cos(angle) *
                radius *
                1.24;

              centerY =
                anchorY +
                Math.sin(angle) *
                radius *
                0.95;

            }

            const left =
              clamp(
                centerX -
                group.width / 2,
                0,
                compositionWidth - group.width
              );

            const top =
              clamp(
                centerY -
                group.height / 2,
                0,
                compositionHeight - group.height
              );

            const candidate = {

              left,
              top,
              right:
                left + group.width,
              bottom:
                top + group.height

            };

            const collision =
              placed.some(
                other =>
                  boxesOverlap(
                    candidate,
                    other,
                    groupGap
                  )
              );

            if (collision) {
              continue;
            }

            const distanceFromAnchor =
              Math.hypot(
                (
                  left + group.width / 2
                ) - anchorX,
                (
                  top + group.height / 2
                ) - anchorY
              );

            const score =
              distanceFromAnchor +
              attempt * 0.06;

            if (score < bestScore) {
              bestScore = score;
              best = candidate;
            }

          }

          if (!best) {

            const fallbackLeft =
              clamp(
                anchorX - group.width / 2,
                0,
                compositionWidth - group.width
              );

            const fallbackTop =
              clamp(
                anchorY - group.height / 2,
                0,
                compositionHeight - group.height
              );

            best = {
              left: fallbackLeft,
              top: fallbackTop,
              right:
                fallbackLeft + group.width,
              bottom:
                fallbackTop + group.height
            };

          }

          placed.push({
            ...group,
            ...best
          });

        }
      );

      return placed;

    }



    /* =====================================================
       DRAWING DOM
       ===================================================== */

    function createDrawingElement(
      item
    ) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "drawing";

      wrapper.style.left =
        `${item.left}px`;

      wrapper.style.top =
        `${item.top}px`;

      wrapper.style.width =
        `${item.boxWidth}px`;

      wrapper.style.height =
        `${item.boxHeight}px`;

      const image =
        document.createElement("img");

      image.className =
        "drawing-art";

      image.src =
        item.filename;

      image.alt =
        "";

      image.loading =
        "lazy";

      image.decoding =
        "async";

      image.draggable =
        false;

      image.style.width =
        `${item.displayWidth}px`;

      image.style.height =
        `${item.displayHeight}px`;

      image.style.transform =
        `translate(-50%, -50%) rotate(${item.rotation}deg)`;

      wrapper.appendChild(image);

      return wrapper;

    }



    /* =====================================================
       BUILD LAYOUT
       ===================================================== */

    let paperWidth = 0;
    let paperHeight = 0;

    let compositionWidth = 0;
    let compositionHeight = 0;

    async function buildSketchbook() {

      field.innerHTML =
        "";

      const loaded =
        (
          await Promise.all(
            files.map(loadImageData)
          )
        )
        .filter(Boolean);

      if (!loaded.length) {
        return;
      }

      const minArea =
        Math.min(
          ...loaded.map(
            item => item.area
          )
        );

      const maxArea =
        Math.max(
          ...loaded.map(
            item => item.area
          )
        );

      const prepared =
        loaded.map(item =>
          prepareDrawing(
            item,
            minArea,
            maxArea
          )
        );

      const byCategory =
        new Map();

      prepared.forEach(item => {

        if (
          !byCategory.has(item.category)
        ) {
          byCategory.set(
            item.category,
            []
          );
        }

        byCategory
          .get(item.category)
          .push(item);

      });

      const packedGroups =
        [];

      byCategory.forEach(
        (items, category) => {

          packedGroups.push({

            category,

            ...packCategory(items)

          });

        }
      );

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;

      /*
        Wide strip, more like the Photoshop composition.
      */

      compositionWidth =
        mobile
          ? Math.max(
              1350,
              viewport.clientWidth * 2.35
            )
          : Math.max(
              2900,
              viewport.clientWidth * 2.65
            );

      compositionHeight =
        mobile
          ? Math.max(
              760,
              viewport.clientHeight * 1.20
            )
          : Math.max(
              1120,
              viewport.clientHeight * 1.34
            );

      const placedGroups =
        placeGroupsIntoComposition(
          packedGroups,
          compositionWidth,
          compositionHeight
        );

      const padding =
        mobile
          ? 36
          : 54;

      paperWidth =
        compositionWidth +
        padding * 2;

      paperHeight =
        compositionHeight +
        padding * 2;

      paper.style.width =
        `${paperWidth}px`;

      paper.style.height =
        `${paperHeight}px`;

      placedGroups.forEach(group => {

        const groupElement =
          document.createElement("div");

        groupElement.className =
          "drawing-group";

        groupElement.dataset.category =
          group.category;

        groupElement.style.left =
          `${padding + group.left}px`;

        groupElement.style.top =
          `${padding + group.top}px`;

        groupElement.style.width =
          `${group.width}px`;

        groupElement.style.height =
          `${group.height}px`;

        group.items.forEach(item => {
          groupElement.appendChild(
            createDrawingElement(item)
          );
        });

        field.appendChild(groupElement);

      });

      setInitialView();

    }



    /* =====================================================
       PAN + ZOOM
       ===================================================== */

    const view = {
      x: 0,
      y: 0,
      zoom: 1,
      minZoom: 0.85,
      maxZoom: 2.15,
      startX: 0,
      startY: 0,
      originX: 0,
      originY: 0,
      dragging: false
    };


    function clampPan(
      x,
      y,
      zoom
    ) {

      const scaledWidth =
        paperWidth * zoom;

      const scaledHeight =
        paperHeight * zoom;

      const viewportWidth =
        viewport.clientWidth;

      const viewportHeight =
        viewport.clientHeight;

      let minX;
      let maxX;
      let minY;
      let maxY;

      if (
        scaledWidth <= viewportWidth
      ) {

        minX =
          maxX =
          (
            viewportWidth -
            scaledWidth
          ) / 2;

      }

      else {

        minX =
          viewportWidth -
          scaledWidth;

        maxX =
          0;

      }

      if (
        scaledHeight <= viewportHeight
      ) {

        minY =
          maxY =
          (
            viewportHeight -
            scaledHeight
          ) / 2;

      }

      else {

        minY =
          viewportHeight -
          scaledHeight;

        maxY =
          0;

      }

      return {
        x:
          clamp(x, minX, maxX),
        y:
          clamp(y, minY, maxY)
      };

    }


    function applyView() {

      paper.style.transform =
        `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.zoom})`;

    }


    function setView(
      nextX,
      nextY,
      nextZoom
    ) {

      view.zoom =
        clamp(
          nextZoom,
          view.minZoom,
          view.maxZoom
        );

      const clamped =
        clampPan(
          nextX,
          nextY,
          view.zoom
        );

      view.x =
        clamped.x;

      view.y =
        clamped.y;

      applyView();

    }


    function setInitialView() {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;

      const initialZoom =
        mobile
          ? 1.04
          : 1.15;

      const scaledWidth =
        paperWidth * initialZoom;

      const scaledHeight =
        paperHeight * initialZoom;

      const startX =
        (
          viewport.clientWidth -
          scaledWidth
        ) / 2;

      const startY =
        (
          viewport.clientHeight -
          scaledHeight
        ) / 2;

      setView(
        startX,
        startY,
        initialZoom
      );

    }



    /* =====================================================
       POINTER DRAGGING
       ===================================================== */

    viewport.addEventListener(
      "pointerdown",
      event => {

        view.dragging =
          true;

        view.startX =
          event.clientX;

        view.startY =
          event.clientY;

        view.originX =
          view.x;

        view.originY =
          view.y;

        viewport.classList.add(
          "is-dragging"
        );

        viewport.setPointerCapture(
          event.pointerId
        );

      }
    );


    viewport.addEventListener(
      "pointermove",
      event => {

        if (!view.dragging) {
          return;
        }

        const dx =
          event.clientX - view.startX;

        const dy =
          event.clientY - view.startY;

        setView(
          view.originX + dx,
          view.originY + dy,
          view.zoom
        );

      }
    );


    function finishDrag() {

      view.dragging =
        false;

      viewport.classList.remove(
        "is-dragging"
      );

    }


    viewport.addEventListener(
      "pointerup",
      finishDrag
    );

    viewport.addEventListener(
      "pointercancel",
      finishDrag
    );



    /* =====================================================
       WHEEL / TRACKPAD ZOOM
       ===================================================== */

    viewport.addEventListener(
      "wheel",
      event => {

        event.preventDefault();

        const rect =
          viewport.getBoundingClientRect();

        const pointerX =
          event.clientX - rect.left;

        const pointerY =
          event.clientY - rect.top;

        const contentX =
          (
            pointerX - view.x
          ) / view.zoom;

        const contentY =
          (
            pointerY - view.y
          ) / view.zoom;

        const zoomFactor =
          event.deltaY < 0
            ? 1.08
            : 1 / 1.08;

        const nextZoom =
          clamp(
            view.zoom * zoomFactor,
            view.minZoom,
            view.maxZoom
          );

        const nextX =
          pointerX -
          contentX * nextZoom;

        const nextY =
          pointerY -
          contentY * nextZoom;

        setView(
          nextX,
          nextY,
          nextZoom
        );

      },
      {
        passive: false
      }
    );



    /* =====================================================
       RESIZE
       ===================================================== */

    let resizeTimer =
      null;

    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );

        resizeTimer =
          window.setTimeout(
            buildSketchbook,
            160
          );

      }
    );



    /* =====================================================
       START
       ===================================================== */

    buildSketchbook();

  })();
  </script>

</body>
</html>
