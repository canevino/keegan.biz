    /* =====================================================
       ELEMENTS
       ===================================================== */

    const viewport =
      document.getElementById(
        "sketchbook-viewport"
      );


    const paper =
      document.getElementById(
        "sketchbook-paper"
      );


    const field =
      document.getElementById(
        "sketchbook-field"
      );


    if (
      !viewport ||
      !paper ||
      !field
    ) {
      return;
    }



    /* =====================================================
       HELPERS
       ===================================================== */

    function clamp(
      value,
      min,
      max
    ) {

      return Math.min(
        Math.max(value, min),
        max
      );

    }


    function randomBetween(
      min,
      max
    ) {

      return (
        min +
        Math.random() *
        (
          max -
          min
        )
      );

    }


    function shuffle(
      array
    ) {

      const copy =
        [...array];


      for (
        let i =
          copy.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }


      return copy;

    }


    function categoryFromFilename(
      filename
    ) {

      let category =
        filename
          .split("-")[0]
          .toLowerCase();


      /*
        Keep the accidentally plural filename
        with the rest of the animals.
      */

      if (
        category === "animals"
      ) {
        category =
          "animal";
      }


      return category;

    }


    function boxesOverlap(
      a,
      b,
      padding = 0
    ) {

      return !(
        a.right + padding <=
          b.left ||

        a.left >=
          b.right + padding ||

        a.bottom + padding <=
          b.top ||

        a.top >=
          b.bottom + padding
      );

    }


    function rotatedBounds(
      width,
      height,
      degrees
    ) {

      const radians =
        degrees *
        Math.PI /
        180;


      const cos =
        Math.abs(
          Math.cos(
            radians
          )
        );


      const sin =
        Math.abs(
          Math.sin(
            radians
          )
        );


      return {

        width:
          width * cos +
          height * sin,

        height:
          width * sin +
          height * cos

      };

    }


    function boundingBox(
      boxes
    ) {

      const left =
        Math.min(
          ...boxes.map(
            box =>
              box.left
          )
        );


      const top =
        Math.min(
          ...boxes.map(
            box =>
              box.top
          )
        );


      const right =
        Math.max(
          ...boxes.map(
            box =>
              box.right
          )
        );


      const bottom =
        Math.max(
          ...boxes.map(
            box =>
              box.bottom
          )
        );


      return {

        left,
        top,
        right,
        bottom,

        width:
          right - left,

        height:
          bottom - top

      };

    }



    /* =====================================================
       IMAGE LOADING
       ===================================================== */

    function loadImageData(
      filename
    ) {

      return new Promise(
        resolve => {

          const image =
            new Image();


          image.src =
            filename;


          image.decoding =
            "async";


          image.onload =
            () => {

              resolve({

                filename,

                category:
                  categoryFromFilename(
                    filename
                  ),

                width:
                  image.naturalWidth,

                height:
                  image.naturalHeight,

                area:
                  image.naturalWidth *
                  image.naturalHeight

              });

            };


          image.onerror =
            () => {

              console.warn(
                `Could not load ${filename}`
              );


              resolve(
                null
              );

            };

        }
      );

    }



    /* =====================================================
       ROBUST SIZE RANGE

       Use percentiles instead of absolute min/max.

       This stops one giant source file from making
       everything else microscopic.
       ===================================================== */

    function percentile(
      values,
      fraction
    ) {

      const sorted =
        [...values]
          .sort(
            (a, b) =>
              a - b
          );


      const index =
        (
          sorted.length - 1
        ) *
        fraction;


      const lower =
        Math.floor(index);


      const upper =
        Math.ceil(index);


      if (
        lower === upper
      ) {
        return sorted[lower];
      }


      const t =
        index - lower;


      return (
        sorted[lower] *
        (1 - t)
      )
      +
      (
        sorted[upper] *
        t
      );

    }



    /* =====================================================
       DISPLAY SIZE

       Source dimensions still matter, but subtly.

       The goal is one coherent sketchbook family,
       not dramatic differences in scale.
       ===================================================== */

    function calculateDisplaySize(
      item,
      lowArea,
      highArea
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const root =
        Math.sqrt(
          item.area
        );


      const lowRoot =
        Math.sqrt(
          lowArea
        );


      const highRoot =
        Math.sqrt(
          highArea
        );


      let t =
        (
          root -
          lowRoot
        )
        /
        Math.max(
          1,
          highRoot -
          lowRoot
        );


      t =
        clamp(
          t,
          0,
          1
        );


      /*
        Very compressed scale variation.
      */

      const longest =
        mobile
          ? 58 + t * 74
          : 70 + t * 105;


      let width;
      let height;


      if (
        item.width >=
        item.height
      ) {

        width =
          longest;


        height =
          longest *
          item.height /
          item.width;

      }

      else {

        height =
          longest;


        width =
          longest *
          item.width /
          item.height;

      }


      /*
        Stop ultra-tall/ultra-wide drawings dominating.
      */

      const maxHeight =
        mobile
          ? 150
          : 215;


      const maxWidth =
        mobile
          ? 165
          : 235;


      if (
        height >
        maxHeight
      ) {

        const scale =
          maxHeight /
          height;


        width *=
          scale;


        height *=
          scale;

      }


      if (
        width >
        maxWidth
      ) {

        const scale =
          maxWidth /
          width;


        width *=
          scale;


        height *=
          scale;

      }


      /*
        And don't let tiny aspect-ratio drawings disappear.
      */

      const minLongest =
        mobile
          ? 52
          : 64;


      if (
        Math.max(
          width,
          height
        )
        <
        minLongest
      ) {

        const scale =
          minLongest /
          Math.max(
            width,
            height
          );


        width *=
          scale;


        height *=
          scale;

      }


      return {
        width,
        height
      };

    }



    /* =====================================================
       PREPARE DRAWING
       ===================================================== */

    function prepareDrawing(
      item,
      lowArea,
      highArea
    ) {

      const size =
        calculateDisplaySize(
          item,
          lowArea,
          highArea
        );


      const rotation =
        randomBetween(
          -2.5,
          2.5
        );


      const bounds =
        rotatedBounds(
          size.width,
          size.height,
          rotation
        );


      return {

        ...item,

        displayWidth:
          size.width,

        displayHeight:
          size.height,

        rotation,

        boxWidth:
          bounds.width,

        boxHeight:
          bounds.height

      };

    }



    /* =====================================================
       CANDIDATE POSITIONS

       Instead of a spiral from one origin, each new item
       tries to attach itself to the side/corner of an
       EXISTING item.

       That's what creates a real clump.
       ===================================================== */

    function candidatesAroundBox(
      itemWidth,
      itemHeight,
      target,
      gap
    ) {

      const cx =
        (
          target.left +
          target.right
        )
        / 2;


      const cy =
        (
          target.top +
          target.bottom
        )
        / 2;


      const jitterX =
        () =>
          randomBetween(
            -10,
            10
          );


      const jitterY =
        () =>
          randomBetween(
            -10,
            10
          );


      return shuffle([

        /* right */

        {
          left:
            target.right +
            gap,

          top:
            cy -
            itemHeight / 2 +
            jitterY()
        },


        /* left */

        {
          left:
            target.left -
            gap -
            itemWidth,

          top:
            cy -
            itemHeight / 2 +
            jitterY()
        },


        /* below */

        {
          left:
            cx -
            itemWidth / 2 +
            jitterX(),

          top:
            target.bottom +
            gap
        },


        /* above */

        {
          left:
            cx -
            itemWidth / 2 +
            jitterX(),

          top:
            target.top -
            gap -
            itemHeight
        },


        /* lower-right */

        {
          left:
            target.right +
            gap,

          top:
            target.bottom -
            itemHeight *
            randomBetween(
              .20,
              .78
            )
        },


        /* upper-right */

        {
          left:
            target.right +
            gap,

          top:
            target.top -
            itemHeight *
            randomBetween(
              .20,
              .78
            )
        },


        /* lower-left */

        {
          left:
            target.left -
            gap -
            itemWidth,

          top:
            target.bottom -
            itemHeight *
            randomBetween(
              .20,
              .78
            )
        },


        /* upper-left */

        {
          left:
            target.left -
            gap -
            itemWidth,

          top:
            target.top -
            itemHeight *
            randomBetween(
              .20,
              .78
            )
        }

      ]);

    }



    /* =====================================================
       PACK ONE CATEGORY
       ===================================================== */

    function packCategory(
      items
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const gap =
        mobile
          ? 1
          : 2;


      const targetAspect =
        randomBetween(
          1.05,
          1.70
        );


      const ordered =
        [...items]
          .sort(
            (a, b) =>

              (
                b.boxWidth *
                b.boxHeight
              )
              -
              (
                a.boxWidth *
                a.boxHeight
              )

          );


      const placed =
        [];


      ordered.forEach(
        (
          item,
          index
        ) => {

          if (
            index === 0
          ) {

            placed.push({

              ...item,

              left:
                0,

              top:
                0,

              right:
                item.boxWidth,

              bottom:
                item.boxHeight

            });


            return;

          }


          let winner =
            null;


          let winnerScore =
            Infinity;


          /*
            Try attaching to every existing drawing.
          */

          shuffle(
            placed
          ).forEach(
            target => {

              const candidates =
                candidatesAroundBox(
                  item.boxWidth,
                  item.boxHeight,
                  target,
                  gap
                );


              candidates.forEach(
                candidate => {

                  const box = {

                    ...candidate,

                    right:
                      candidate.left +
                      item.boxWidth,

                    bottom:
                      candidate.top +
                      item.boxHeight

                  };


                  const collision =
                    placed.some(
                      other =>
                        boxesOverlap(
                          box,
                          other,
                          gap
                        )
                    );


                  if (
                    collision
                  ) {
                    return;
                  }


                  const testBoxes = [

                    ...placed,

                    box

                  ];


                  const bounds =
                    boundingBox(
                      testBoxes
                    );


                  const aspect =
                    bounds.width /
                    Math.max(
                      1,
                      bounds.height
                    );


                  const area =
                    bounds.width *
                    bounds.height;


                  const aspectPenalty =
                    Math.abs(
                      Math.log(
                        Math.max(
                          .01,
                          aspect /
                          targetAspect
                        )
                      )
                    )
                    *
                    6500;


                  /*
                    Prefer compactness strongly.
                  */

                  const score =
                    area +
                    aspectPenalty +
                    Math.random() *
                    1600;


                  if (
                    score <
                    winnerScore
                  ) {

                    winnerScore =
                      score;


                    winner =
                      box;

                  }

                }
              );

            }
          );


          /*
            Emergency fallback.
          */

          if (
            !winner
          ) {

            const bounds =
              boundingBox(
                placed
              );


            winner = {

              left:
                bounds.right +
                gap,

              top:
                bounds.top,

              right:
                bounds.right +
                gap +
                item.boxWidth,

              bottom:
                bounds.top +
                item.boxHeight

            };

          }


          placed.push({

            ...item,
            ...winner

          });

        }
      );



      /* ---------------------------------------------
         NORMALIZE
         --------------------------------------------- */

      const bounds =
        boundingBox(
          placed
        );


      const normalized =
        placed.map(
          item => ({

            ...item,

            left:
              item.left -
              bounds.left,

            top:
              item.top -
              bounds.top,

            right:
              item.right -
              bounds.left,

            bottom:
              item.bottom -
              bounds.top

          })
        );


      return {

        items:
          normalized,

        width:
          bounds.width,

        height:
          bounds.height

      };

    }



    /* =====================================================
       PACK CATEGORY CLUSTERS

       Same idea as individual artwork:
       groups attach to groups.

       No rows.
       ===================================================== */

    function packGroups(
      groups
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const gap =
        mobile
          ? 7
          : 11;


      /*
        Overall spread should be deliberately wide.
      */

      const TARGET_ASPECT =
        mobile
          ? 2.2
          : 3.15;


      const ordered =
        shuffle(
          groups
        )
        .sort(
          (a, b) =>

            (
              b.width *
              b.height
            )
            -
            (
              a.width *
              a.height
            )

        );


      const placed =
        [];


      ordered.forEach(
        (
          group,
          index
        ) => {

          if (
            index === 0
          ) {

            placed.push({

              ...group,

              left:
                0,

              top:
                0,

              right:
                group.width,

              bottom:
                group.height

            });


            return;

          }


          let winner =
            null;


          let winnerScore =
            Infinity;


          shuffle(
            placed
          ).forEach(
            target => {

              /*
                More candidate variations for whole groups.
              */

              for (
                let repeat = 0;
                repeat < 8;
                repeat++
              ) {

                const candidates =
                  candidatesAroundBox(
                    group.width,
                    group.height,
                    target,
                    gap
                  );


                candidates.forEach(
                  candidate => {

                    const box = {

                      ...candidate,

                      right:
                        candidate.left +
                        group.width,

                      bottom:
                        candidate.top +
                        group.height

                    };


                    const collision =
                      placed.some(
                        other =>
                          boxesOverlap(
                            box,
                            other,
                            gap
                          )
                      );


                    if (
                      collision
                    ) {
                      return;
                    }


                    const test =
                      [
                        ...placed,
                        box
                      ];


                    const bounds =
                      boundingBox(
                        test
                      );


                    const aspect =
                      bounds.width /
                      Math.max(
                        1,
                        bounds.height
                      );


                    const area =
                      bounds.width *
                      bounds.height;


                    /*
                      Encourage ~3:1 width,
                      but do NOT force rows.
                    */

                    const aspectPenalty =
                      Math.abs(
                        Math.log(
                          Math.max(
                            .01,
                            aspect /
                            TARGET_ASPECT
                          )
                        )
                      )
                      *
                      26000;


                    /*
                      Also reward using the full vertical field.
                    */

                    const tooFlatPenalty =
                      bounds.height <
                      bounds.width /
                      4.25

                        ? (
                            bounds.width /
                            4.25 -
                            bounds.height
                          )
                          *
                          750

                        : 0;


                    const score =
                      area +
                      aspectPenalty +
                      tooFlatPenalty +
                      Math.random() *
                      8000;


                    if (
                      score <
                      winnerScore
                    ) {

                      winnerScore =
                        score;


                      winner =
                        box;

                    }

                  }
                );

              }

            }
          );


          if (
            !winner
          ) {

            const bounds =
              boundingBox(
                placed
              );


            winner = {

              left:
                bounds.right +
                gap,

              top:
                bounds.top,

              right:
                bounds.right +
                gap +
                group.width,

              bottom:
                bounds.top +
                group.height

            };

          }


          placed.push({

            ...group,
            ...winner

          });

        }
      );


      const bounds =
        boundingBox(
          placed
        );


      return {

        groups:
          placed.map(
            group => ({

              ...group,

              left:
                group.left -
                bounds.left,

              top:
                group.top -
                bounds.top

            })
          ),

        width:
          bounds.width,

        height:
          bounds.height

      };

    }



    /* =====================================================
       DRAWING DOM
       ===================================================== */

    function createDrawing(
      item
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "drawing";


      wrapper.style.left =
        `${item.left}px`;


      wrapper.style.top =
        `${item.top}px`;


      wrapper.style.width =
        `${item.boxWidth}px`;


      wrapper.style.height =
        `${item.boxHeight}px`;



      const image =
        document.createElement(
          "img"
        );


      image.className =
        "drawing-art";


      image.src =
        item.filename;


      image.alt =
        "";


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.draggable =
        false;


      image.style.width =
        `${item.displayWidth}px`;


      image.style.height =
        `${item.displayHeight}px`;


      image.style.transform =
        `translate(-50%, -50%) rotate(${item.rotation}deg)`;


      wrapper.appendChild(
        image
      );


      return wrapper;

    }



    /* =====================================================
       BUILD
       ===================================================== */

    let paperWidth =
      0;


    let paperHeight =
      0;


    async function buildSketchbook() {

      field.innerHTML =
        "";


      const loaded =
        (
          await Promise.all(
            files.map(
              loadImageData
            )
          )
        )
        .filter(Boolean);


      if (
        !loaded.length
      ) {
        return;
      }



      /* ---------------------------------------------
         ROBUST SOURCE DIMENSION RANGE
         --------------------------------------------- */

      const areas =
        loaded.map(
          item =>
            item.area
        );


      const lowArea =
        percentile(
          areas,
          .10
        );


      const highArea =
        percentile(
          areas,
          .90
        );



      const prepared =
        loaded.map(
          item =>
            prepareDrawing(
              item,
              lowArea,
              highArea
            )
        );



      /* ---------------------------------------------
         GROUP EXACTLY BY NAME PREFIX
         --------------------------------------------- */

      const categories =
        new Map();


      prepared.forEach(
        item => {

          if (
            !categories.has(
              item.category
            )
          ) {

            categories.set(
              item.category,
              []
            );

          }


          categories
            .get(
              item.category
            )
            .push(
              item
            );

        }
      );



      /* ---------------------------------------------
         PACK EACH GROUP
         --------------------------------------------- */

      const groups =
        [];


      categories.forEach(
        (
          items,
          category
        ) => {

          groups.push({

            category,

            ...packCategory(
              items
            )

          });

        }
      );



      /* ---------------------------------------------
         PACK GROUPS TOGETHER
         --------------------------------------------- */

      const layout =
        packGroups(
          groups
        );



      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const padding =
        mobile
          ? 28
          : 40;



      paperWidth =
        layout.width +
        padding * 2;


      paperHeight =
        layout.height +
        padding * 2;



      /*
        Preserve a convincingly wide sheet,
        but let the content determine most dimensions.
      */

      const minimumAspect =
        mobile
          ? 2.15
          : 2.85;


      if (
        paperWidth /
        paperHeight <
        minimumAspect
      ) {

        paperWidth =
          paperHeight *
          minimumAspect;

      }



      paper.style.width =
        `${paperWidth}px`;


      paper.style.height =
        `${paperHeight}px`;



      const xOffset =
        (
          paperWidth -
          layout.width
        )
        / 2;


      const yOffset =
        (
          paperHeight -
          layout.height
        )
        / 2;



      layout.groups.forEach(
        group => {

          const element =
            document.createElement(
              "div"
            );


          element.className =
            "drawing-group";


          element.dataset.category =
            group.category;


          element.style.left =
            `${
              xOffset +
              group.left
            }px`;


          element.style.top =
            `${
              yOffset +
              group.top
            }px`;


          element.style.width =
            `${group.width}px`;


          element.style.height =
            `${group.height}px`;


          group.items.forEach(
            item => {

              element.appendChild(
                createDrawing(
                  item
                )
              );

            }
          );


          field.appendChild(
            element
          );

        }
      );


      setInitialView();

    }



    /* =====================================================
       PAN + ZOOM
       ===================================================== */

    const view = {

      x:
        0,

      y:
        0,

      zoom:
        1,

      minZoom:
        .45,

      maxZoom:
        2.8,

      startX:
        0,

      startY:
        0,

      originX:
        0,

      originY:
        0,

      dragging:
        false

    };



    function clampPan(
      x,
      y,
      zoom
    ) {

      const scaledWidth =
        paperWidth *
        zoom;


      const scaledHeight =
        paperHeight *
        zoom;


      const viewportWidth =
        viewport.clientWidth;


      const viewportHeight =
        viewport.clientHeight;



      let minX;
      let maxX;
      let minY;
      let maxY;



      if (
        scaledWidth <=
        viewportWidth
      ) {

        minX =
          maxX =
          (
            viewportWidth -
            scaledWidth
          )
          / 2;

      }

      else {

        minX =
          viewportWidth -
          scaledWidth;

        maxX =
          0;

      }



      if (
        scaledHeight <=
        viewportHeight
      ) {

        minY =
          maxY =
          (
            viewportHeight -
            scaledHeight
          )
          / 2;

      }

      else {

        minY =
          viewportHeight -
          scaledHeight;

        maxY =
          0;

      }


      return {
        x:
          clamp(
            x,
            minX,
            maxX
          ),

        y:
          clamp(
            y,
            minY,
            maxY
          )
      };

    }



    function applyView() {

      paper.style.transform =
        `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.zoom})`;

    }



    function setView(
      x,
      y,
      zoom
    ) {

      view.zoom =
        clamp(
          zoom,
          view.minZoom,
          view.maxZoom
        );


      const position =
        clampPan(
          x,
          y,
          view.zoom
        );


      view.x =
        position.x;


      view.y =
        position.y;


      applyView();

    }



    /* =====================================================
       INITIAL VIEW

       Scale by PAPER HEIGHT.

       So the sheet fills the viewport vertically,
       while its much greater width extends off-screen.

       This is the Photoshop-reference behavior.
       ===================================================== */

    function setInitialView() {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const verticalFill =
        mobile
          ? .96
          : .97;


      let zoom =
        (
          viewport.clientHeight *
          verticalFill
        )
        /
        paperHeight;


      /*
        Start a little more zoomed-in than "fit".
      */

      zoom *=
        mobile
          ? 1.08
          : 1.14;


      zoom =
        clamp(
          zoom,
          .58,
          1.55
        );


      /*
        Min zoom should still allow the user
        to pull back and see most of the spread.
      */

      view.minZoom =
        Math.max(
          .38,
          zoom * .68
        );


      const scaledWidth =
        paperWidth *
        zoom;


      const scaledHeight =
        paperHeight *
        zoom;


      const x =
        (
          viewport.clientWidth -
          scaledWidth
        )
        / 2;


      const y =
        (
          viewport.clientHeight -
          scaledHeight
        )
        / 2;


      setView(
        x,
        y,
        zoom
      );

    }



    /* =====================================================
       DRAG
       ===================================================== */

    viewport.addEventListener(
      "pointerdown",
      event => {

        view.dragging =
          true;


        view.startX =
          event.clientX;


        view.startY =
          event.clientY;


        view.originX =
          view.x;


        view.originY =
          view.y;


        viewport.classList.add(
          "is-dragging"
        );


        viewport.setPointerCapture(
          event.pointerId
        );

      }
    );


    viewport.addEventListener(
      "pointermove",
      event => {

        if (
          !view.dragging
        ) {
          return;
        }


        const dx =
          event.clientX -
          view.startX;


        const dy =
          event.clientY -
          view.startY;


        setView(
          view.originX +
          dx,

          view.originY +
          dy,

          view.zoom
        );

      }
    );


    function finishDrag() {

      view.dragging =
        false;


      viewport.classList.remove(
        "is-dragging"
      );

    }


    viewport.addEventListener(
      "pointerup",
      finishDrag
    );


    viewport.addEventListener(
      "pointercancel",
      finishDrag
    );



    /* =====================================================
       WHEEL / TRACKPAD ZOOM
       ===================================================== */

    viewport.addEventListener(
      "wheel",
      event => {

        event.preventDefault();


        const rect =
          viewport.getBoundingClientRect();


        const pointerX =
          event.clientX -
          rect.left;


        const pointerY =
          event.clientY -
          rect.top;


        const worldX =
          (
            pointerX -
            view.x
          )
          /
          view.zoom;


        const worldY =
          (
            pointerY -
            view.y
          )
          /
          view.zoom;


        const factor =
          event.deltaY < 0
            ? 1.075
            : 1 / 1.075;


        const nextZoom =
          clamp(
            view.zoom *
            factor,

            view.minZoom,
            view.maxZoom
          );


        const nextX =
          pointerX -
          worldX *
          nextZoom;


        const nextY =
          pointerY -
          worldY *
          nextZoom;


        setView(
          nextX,
          nextY,
          nextZoom
        );

      },
      {
        passive:
          false
      }
    );



    /* =====================================================
       RESIZE
       ===================================================== */

    let resizeTimer =
      null;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          window.setTimeout(
            buildSketchbook,
            180
          );

      }
    );



    /* =====================================================
       START
       ===================================================== */

    buildSketchbook();

  })();
  </script>

</body>
</html>
