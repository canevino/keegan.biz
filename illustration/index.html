    /* =====================================================
       ELEMENTS
       ===================================================== */

    const viewport =
      document.getElementById(
        "sketchbook-viewport"
      );


    const paper =
      document.getElementById(

      );


    const field =
      document.getElementById(

      );


    const zoomInButton =
      document.getElementById(

      );


    const zoomOutButton =
      document.getElementById(

      );


    if (
      !viewport ||
      !paper ||
      !field
    ) {
      return;
    }



    /* =====================================================
       HELPERS
       ===================================================== */

    function clamp(
      value,
      min,
      max
    ) {

      return Math.min(
        Math.max(value, min),
        max
      );

    }


    function randomBetween(
      min,
      max
    ) {

      return (
        min +
        Math.random() *
        (
          max -
          min
        )
      );

    }


    function shuffle(
      array
    ) {

      const copy =
        [...array];


      for (
        let i =
          copy.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }


      return copy;

    }


    function categoryFromFilename(
      filename
    ) {

      let category =
        filename
          .split("-")[0]
          .toLowerCase();


      if (
        category === "animals"
      ) {

        category =
          "animal";

      }


      return category;

    }


    function boxesOverlap(
      a,
      b,
      padding = 0
    ) {

      return !(
        a.right + padding <= b.left ||
        a.left >= b.right + padding ||
        a.bottom + padding <= b.top ||
        a.top >= b.bottom + padding
      );

    }


    function getBounds(
      boxes
    ) {

      const left =
        Math.min(
          ...boxes.map(
            box => box.left
          )
        );


      const top =
        Math.min(
          ...boxes.map(
            box => box.top
          )
        );


      const right =
        Math.max(
          ...boxes.map(
            box => box.right
          )
        );


      const bottom =
        Math.max(
          ...boxes.map(
            box => box.bottom
          )
        );


      return {

        left,
        top,
        right,
        bottom,

        width:
          right - left,

        height:
          bottom - top

      };

    }


    function rotatedBounds(
      width,
      height,
      degrees
    ) {

      const radians =
        degrees *
        Math.PI /
        180;


      const cos =
        Math.abs(
          Math.cos(
            radians
          )
        );


      const sin =
        Math.abs(
          Math.sin(
            radians
          )
        );


      return {

        width:
          width * cos +
          height * sin,

        height:
          width * sin +
          height * cos

      };

    }



    /* =====================================================
       LOAD IMAGES
       ===================================================== */

    function loadImageData(
      filename
    ) {

      return new Promise(
        resolve => {

          const image =
            new Image();


          image.src =
            filename;


          image.decoding =
            "async";


          image.onload =
            () => {

              resolve({

                filename,

                category:
                  categoryFromFilename(
                    filename
                  ),

                width:
                  image.naturalWidth,

                height:
                  image.naturalHeight,

                area:
                  image.naturalWidth *
                  image.naturalHeight

              });

            };


          image.onerror =
            () => {

              console.warn(
                `Could not load ${filename}`
              );


              resolve(
                null
              );

            };

        }
      );

    }



    /* =====================================================
       SOURCE-DIMENSION SCALE

       Actual file dimensions are the main determinant
       of visible scale.
       ===================================================== */

    function calculateDisplaySize(
      item,
      referenceLinear
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const sourceLinear =
        Math.sqrt(
          item.width *
          item.height
        );


      const ratio =
        sourceLinear /
        Math.max(
          referenceLinear,
          1
        );


      const averageLongest =
        mobile
          ? 88
          : 118;


      /*
        Strong source-size relationship.
      */

      let longest =
        averageLongest *
        Math.pow(
          ratio,
          .92
        );


      /*
        Just enough safety for extreme files.
      */

      longest =
        clamp(
          longest,
          mobile
            ? 42
            : 52,
          mobile
            ? 230
            : 330
        );


      let width;
      let height;


      if (
        item.width >=
        item.height
      ) {

        width =
          longest;


        height =
          longest *
          (
            item.height /
            item.width
          );

      }

      else {

        height =
          longest;


        width =
          longest *
          (
            item.width /
            item.height
          );

      }


      return {
        width,
        height
      };

    }



    /* =====================================================
       PREPARE DRAWING
       ===================================================== */

    function prepareDrawing(
      item,
      referenceLinear
    ) {

      const size =
        calculateDisplaySize(
          item,
          referenceLinear
        );


      const rotation =
        randomBetween(
          -4,
          4
        );


      const bounds =
        rotatedBounds(
          size.width,
          size.height,
          rotation
        );


      return {

        ...item,

        displayWidth:
          size.width,

        displayHeight:
          size.height,

        rotation,

        boxWidth:
          bounds.width,

        boxHeight:
          bounds.height

      };

    }



    /* =====================================================
       RANDOM CANDIDATES AROUND EXISTING OBJECT
       ===================================================== */

    function candidatesAround(
      width,
      height,
      target,
      gap,
      count
    ) {

      const targetWidth =
        target.right -
        target.left;


      const targetHeight =
        target.bottom -
        target.top;


      const centerX =
        (
          target.left +
          target.right
        )
        / 2;


      const centerY =
        (
          target.top +
          target.bottom
        )
        / 2;


      const candidates =
        [];


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const angle =
          randomBetween(
            0,
            Math.PI * 2
          );


        const radiusX =
          targetWidth / 2 +
          width / 2 +
          gap;


        const radiusY =
          targetHeight / 2 +
          height / 2 +
          gap;


        const x =
          centerX +
          Math.cos(angle) *
          radiusX;


        const y =
          centerY +
          Math.sin(angle) *
          radiusY;


        candidates.push({

          left:
            x -
            width / 2,

          top:
            y -
            height / 2

        });

      }


      return candidates;

    }



    /* =====================================================
       PACK ONE CATEGORY

       Tight irregular 2D cluster.
       ===================================================== */

    function packCategory(
      items
    ) {

      const gap =
        2;


      const ordered =
        shuffle(
          items
        )
        .sort(
          (a, b) =>
            (
              b.boxWidth *
              b.boxHeight
            )
            -
            (
              a.boxWidth *
              a.boxHeight
            )
        );


      const placed =
        [];


      ordered.forEach(
        (
          item,
          index
        ) => {

          if (
            index === 0
          ) {

            placed.push({

              ...item,

              left:
                0,

              top:
                0,

              right:
                item.boxWidth,

              bottom:
                item.boxHeight

            });


            return;

          }


          let winner =
            null;


          let winnerScore =
            Infinity;


          shuffle(
            placed
          ).forEach(
            target => {

              const candidates =
                candidatesAround(
                  item.boxWidth,
                  item.boxHeight,
                  target,
                  gap,
                  42
                );


              candidates.forEach(
                candidate => {

                  const box = {

                    left:
                      candidate.left,

                    top:
                      candidate.top,

                    right:
                      candidate.left +
                      item.boxWidth,

                    bottom:
                      candidate.top +
                      item.boxHeight

                  };


                  const collision =
                    placed.some(
                      other =>
                        boxesOverlap(
                          box,
                          other,
                          gap
                        )
                    );


                  if (
                    collision
                  ) {
                    return;
                  }


                  const bounds =
                    getBounds(
                      [
                        ...placed,
                        box
                      ]
                    );


                  const area =
                    bounds.width *
                    bounds.height;


                  const aspect =
                    bounds.width /
                    Math.max(
                      bounds.height,
                      1
                    );


                  /*
                    Category clusters should spread
                    in both X and Y — not become rows.
                  */

                  const shapePenalty =
                    Math.abs(
                      Math.log(
                        aspect /
                        1.25
                      )
                    )
                    *
                    1700;


                  const score =
                    area +
                    shapePenalty +
                    Math.random() *
                    700;


                  if (
                    score <
                    winnerScore
                  ) {

                    winnerScore =
                      score;


                    winner =
                      box;

                  }

                }
              );

            }
          );


          if (
            !winner
          ) {

            const bounds =
              getBounds(
                placed
              );


            winner = {

              left:
                bounds.right +
                gap,

              top:
                bounds.top,

              right:
                bounds.right +
                gap +
                item.boxWidth,

              bottom:
                bounds.top +
                item.boxHeight

            };

          }


          placed.push({

            ...item,
            ...winner

          });

        }
      );


      const bounds =
        getBounds(
          placed
        );


      return {

        width:
          bounds.width,

        height:
          bounds.height,

        items:
          placed.map(
            item => ({

              ...item,

              left:
                item.left -
                bounds.left,

              top:
                item.top -
                bounds.top

            })
          )

      };

    }



    /* =====================================================
       PLACE CATEGORY CLUSTERS ON A REAL 2D SPREAD

       Instead of building out infinitely from a single
       cluster, we create a finite rectangular sketchbook
       and scatter/pack clusters throughout it.
       ===================================================== */

    function placeGroupsInSpread(
      groups
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const TOTAL_GROUP_AREA =
        groups.reduce(
          (
            total,
            group
          ) =>
            total +
            group.width *
            group.height,
          0
        );


      /*
        Roughly landscape sketchbook proportions.
      */

      const targetAspect =
        mobile
          ? 1.9
          : 2.55;


      /*
        More than the literal occupied area so groups can
        weave together naturally without becoming one slab.
      */

      const density =
        .67;


      const targetArea =
        TOTAL_GROUP_AREA /
        density;


      let spreadWidth =
        Math.sqrt(
          targetArea *
          targetAspect
        );


      let spreadHeight =
        spreadWidth /
        targetAspect;


      /*
        Guarantee a reasonable physical field.
      */

      spreadWidth =
        Math.max(
          spreadWidth,
          mobile
            ? 1050
            : 1750
        );


      spreadHeight =
        Math.max(
          spreadHeight,
          mobile
            ? 620
            : 760
        );


      const groupGap =
        7;


      const ordered =
        shuffle(
          groups
        )
        .sort(
          (a, b) =>
            (
              b.width *
              b.height
            )
            -
            (
              a.width *
              a.height
            )
        );


      const placed =
        [];


      function attemptPlacement(
        group
      ) {

        let best =
          null;


        let bestScore =
          Infinity;


        /*
          Try many positions anywhere in the spread.
        */

        for (
          let attempt = 0;
          attempt < 3500;
          attempt++
        ) {

          const left =
            randomBetween(
              0,
              Math.max(
                0,
                spreadWidth -
                group.width
              )
            );


          const top =
            randomBetween(
              0,
              Math.max(
                0,
                spreadHeight -
                group.height
              )
            );


          const box = {

            left,
            top,

            right:
              left +
              group.width,

            bottom:
              top +
              group.height

          };


          const collision =
            placed.some(
              other =>
                boxesOverlap(
                  box,
                  other,
                  groupGap
                )
            );


          if (
            collision
          ) {
            continue;
          }


          /*
            Prefer positions near existing material,
            so we get one spread rather than isolated islands.
          */

          let nearestDistance =
            Infinity;


          const cx =
            left +
            group.width / 2;


          const cy =
            top +
            group.height / 2;


          if (
            placed.length
          ) {

            placed.forEach(
              other => {

                const otherX =
                  (
                    other.left +
                    other.right
                  )
                  / 2;


                const otherY =
                  (
                    other.top +
                    other.bottom
                  )
                  / 2;


                const distance =
                  Math.hypot(
                    cx -
                    otherX,

                    cy -
                    otherY
                  );


                nearestDistance =
                  Math.min(
                    nearestDistance,
                    distance
                  );

              }
            );

          }

          else {

            nearestDistance =
              0;

          }


          /*
            Slight preference for central positions,
            but not enough to make a circle.
          */

          const centerDistance =
            Math.hypot(

              cx -
              spreadWidth / 2,

              cy -
              spreadHeight / 2

            );


          const score =
            nearestDistance *
            .80
            +
            centerDistance *
            .09
            +
            Math.random() *
            40;


          if (
            score <
            bestScore
          ) {

            bestScore =
              score;


            best =
              box;

          }

        }


        return best;

      }



      ordered.forEach(
        group => {

          let position =
            attemptPlacement(
              group
            );


          /*
            If the sheet happened to be too tight,
            expand both dimensions and try again.
          */

          let expansions =
            0;


          while (
            !position &&
            expansions < 8
          ) {

            spreadWidth *=
              1.06;


            spreadHeight *=
              1.06;


            expansions++;


            position =
              attemptPlacement(
                group
              );

          }


          if (
            !position
          ) {

            position = {

              left:
                spreadWidth / 2 -
                group.width / 2,

              top:
                spreadHeight / 2 -
                group.height / 2,

              right:
                spreadWidth / 2 +
                group.width / 2,

              bottom:
                spreadHeight / 2 +
                group.height / 2

            };

          }


          placed.push({

            ...group,
            ...position

          });

        }
      );


      return {

        width:
          spreadWidth,

        height:
          spreadHeight,

        groups:
          placed

      };

    }



    /* =====================================================
       CREATE DRAWING
       ===================================================== */

    function createDrawing(
      item
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "drawing";


      wrapper.style.left =
        `${item.left}px`;


      wrapper.style.top =
        `${item.top}px`;


      wrapper.style.width =
        `${item.boxWidth}px`;


      wrapper.style.height =
        `${item.boxHeight}px`;



      const image =
        document.createElement(
          "img"
        );


      image.className =
        "drawing-art";


      image.src =
        item.filename;


      image.alt =
        "";


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.draggable =
        false;


      image.style.width =
        `${item.displayWidth}px`;


      image.style.height =
        `${item.displayHeight}px`;


      image.style.transform =
        `translate(-50%, -50%) rotate(${item.rotation}deg)`;


      wrapper.appendChild(
        image
      );


      return wrapper;

    }



    /* =====================================================
       BUILD
       ===================================================== */

    let paperWidth =
      0;


    let paperHeight =
      0;


    async function buildSketchbook() {

      field.innerHTML =
        "";


      const loaded =
        (
          await Promise.all(
            files.map(
              loadImageData
            )
          )
        )
        .filter(Boolean);


      if (
        !loaded.length
      ) {
        return;
      }



      /* ---------------------------------------------
         MEDIAN SOURCE SIZE
         --------------------------------------------- */

      const linearSizes =
        loaded
          .map(
            item =>
              Math.sqrt(
                item.width *
                item.height
              )
          )
          .sort(
            (a, b) =>
              a - b
          );


      const middle =
        Math.floor(
          linearSizes.length /
          2
        );


      const referenceLinear =
        linearSizes.length % 2

          ? linearSizes[
              middle
            ]

          : (
              linearSizes[
                middle - 1
              ]
              +
              linearSizes[
                middle
              ]
            )
            / 2;



      /* ---------------------------------------------
         PREPARE
         --------------------------------------------- */

      const prepared =
        loaded.map(
          item =>
            prepareDrawing(
              item,
              referenceLinear
            )
        );



      /* ---------------------------------------------
         GROUP BY NAME
         --------------------------------------------- */

      const categories =
        new Map();


      prepared.forEach(
        item => {

          if (
            !categories.has(
              item.category
            )
          ) {

            categories.set(
              item.category,
              []
            );

          }


          categories
            .get(
              item.category
            )
            .push(
              item
            );

        }
      );



      /* ---------------------------------------------
         PACK EACH CATEGORY
         --------------------------------------------- */

      const groups =
        [];


      categories.forEach(
        (
          items,
          category
        ) => {

          groups.push({

            category,

            ...packCategory(
              items
            )

          });

        }
      );



      /* ---------------------------------------------
         CREATE FULL SPREAD
         --------------------------------------------- */

      const layout =
        placeGroupsInSpread(
          groups
        );


      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const padding =
        mobile
          ? 30
          : 44;


      paperWidth =
        layout.width +
        padding * 2;


      paperHeight =
        layout.height +
        padding * 2;


      paper.style.width =
        `${paperWidth}px`;


      paper.style.height =
        `${paperHeight}px`;



      /* ---------------------------------------------
         RENDER GROUPS
         --------------------------------------------- */

      layout.groups.forEach(
        group => {

          const groupElement =
            document.createElement(
              "div"
            );


          groupElement.className =
            "drawing-group";


          groupElement.dataset.category =
            group.category;


          groupElement.style.left =
            `${
              padding +
              group.left
            }px`;


          groupElement.style.top =
            `${
              padding +
              group.top
            }px`;


          groupElement.style.width =
            `${group.width}px`;


          groupElement.style.height =
            `${group.height}px`;


          group.items.forEach(
            item => {

              groupElement.appendChild(
                createDrawing(
                  item
                )
              );

            }
          );


          field.appendChild(
            groupElement
          );

        }
      );


      fitEntireSketchbook();

    }



    /* =====================================================
       VIEW STATE
       ===================================================== */

    const view = {

      x:
        0,

      y:
        0,

      zoom:
        1,

      fitZoom:
        1,

      minZoom:
        .1,

      maxZoom:
        4,

      startX:
        0,

      startY:
        0,

      originX:
        0,

      originY:
        0,

      dragging:
        false

    };



    /* =====================================================
       VIEW HELPERS
       ===================================================== */

    function clampPan(
      x,
      y,
      zoom
    ) {

      const width =
        paperWidth *
        zoom;


      const height =
        paperHeight *
        zoom;


      const viewportWidth =
        viewport.clientWidth;


      const viewportHeight =
        viewport.clientHeight;


      let minX;
      let maxX;
      let minY;
      let maxY;



      if (
        width <=
        viewportWidth
      ) {

        minX =
          maxX =
          (
            viewportWidth -
            width
          )
          / 2;

      }

      else {

        minX =
          viewportWidth -
          width;

        maxX =
          0;

      }



      if (
        height <=
        viewportHeight
      ) {

        minY =
          maxY =
          (
            viewportHeight -
            height
          )
          / 2;

      }

      else {

        minY =
          viewportHeight -
          height;

        maxY =
          0;

      }


      return {
        x:
          clamp(
            x,
            minX,
            maxX
          ),

        y:
          clamp(
            y,
            minY,
            maxY
          )
      };

    }



    function applyView() {

      paper.style.transform =
        `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.zoom})`;

    }



    function setView(
      x,
      y,
      zoom
    ) {

      view.zoom =
        clamp(
          zoom,
          view.minZoom,
          view.maxZoom
        );


      const position =
        clampPan(
          x,
          y,
          view.zoom
        );


      view.x =
        position.x;


      view.y =
        position.y;


      applyView();

    }



    /* =====================================================
       FIT ENTIRE SKETCHBOOK

       INITIAL STATE:
       YOU CAN SEE THE WHOLE THING.
       ===================================================== */

    function fitEntireSketchbook() {

      const viewportWidth =
        viewport.clientWidth;


      const viewportHeight =
        viewport.clientHeight;


      const margin =
        18;


      const zoomX =
        (
          viewportWidth -
          margin * 2
        )
        /
        paperWidth;


      const zoomY =
        (
          viewportHeight -
          margin * 2
        )
        /
        paperHeight;


      const zoom =
        Math.min(
          zoomX,
          zoomY
        );


      view.fitZoom =
        zoom;


      /*
        Don't allow wheel/− button to go wildly smaller
        than the full-sheet view.
      */

      view.minZoom =
        zoom *
        .82;


      const scaledWidth =
        paperWidth *
        zoom;


      const scaledHeight =
        paperHeight *
        zoom;


      const x =
        (
          viewportWidth -
          scaledWidth
        )
        / 2;


      const y =
        (
          viewportHeight -
          scaledHeight
        )
        / 2;


      setView(
        x,
        y,
        zoom
      );

    }



    /* =====================================================
       ZOOM AROUND A SCREEN POINT
       ===================================================== */

    function zoomAt(
      screenX,
      screenY,
      nextZoom
    ) {

      const worldX =
        (
          screenX -
          view.x
        )
        /
        view.zoom;


      const worldY =
        (
          screenY -
          view.y
        )
        /
        view.zoom;


      const zoom =
        clamp(
          nextZoom,
          view.minZoom,
          view.maxZoom
        );


      const nextX =
        screenX -
        worldX *
        zoom;


      const nextY =
        screenY -
        worldY *
        zoom;


      setView(
        nextX,
        nextY,
        zoom
      );

    }



    /* =====================================================
       ZOOM BUTTONS

       Zoom around center of viewport.
       ===================================================== */

    function zoomFromCenter(
      factor
    ) {

      const centerX =
        viewport.clientWidth /
        2;


      const centerY =
        viewport.clientHeight /
        2;


      zoomAt(
        centerX,
        centerY,
        view.zoom *
        factor
      );

    }


    zoomInButton.addEventListener(
      "click",
      () => {

        zoomFromCenter(
          1.22
        );

      }
    );


    zoomOutButton.addEventListener(
      "click",
      () => {

        zoomFromCenter(
          1 / 1.22
        );

      }
    );



    /* =====================================================
       MOUSE / TRACKPAD ZOOM
       ===================================================== */

    viewport.addEventListener(
      "wheel",
      event => {

        event.preventDefault();


        const rect =
          viewport.getBoundingClientRect();


        const x =
          event.clientX -
          rect.left;


        const y =
          event.clientY -
          rect.top;


        /*
          Smaller factor makes trackpad zoom much smoother.
        */

        const factor =
          Math.exp(
            -event.deltaY *
            .0015
          );


        zoomAt(
          x,
          y,
          view.zoom *
          factor
        );

      },
      {
        passive:
          false
      }
    );



    /* =====================================================
       DRAG / PAN
       ===================================================== */

    viewport.addEventListener(
      "pointerdown",
      event => {

        /*
          Don't initiate drag when clicking zoom buttons.
        */

        if (
          event.target.closest(
            ".zoom-controls"
          )
        ) {
          return;
        }


        view.dragging =
          true;


        view.startX =
          event.clientX;


        view.startY =
          event.clientY;


        view.originX =
          view.x;


        view.originY =
          view.y;


        viewport.classList.add(
          "is-dragging"
        );


        viewport.setPointerCapture(
          event.pointerId
        );

      }
    );


    viewport.addEventListener(
      "pointermove",
      event => {

        if (
          !view.dragging
        ) {
          return;
        }


        const dx =
          event.clientX -
          view.startX;


        const dy =
          event.clientY -
          view.startY;


        setView(
          view.originX +
          dx,

          view.originY +
          dy,

          view.zoom
        );

      }
    );


    function finishDrag() {

      view.dragging =
        false;


      viewport.classList.remove(
        "is-dragging"
      );

    }


    viewport.addEventListener(
      "pointerup",
      finishDrag
    );


    viewport.addEventListener(
      "pointercancel",
      finishDrag
    );



    /* =====================================================
       RESIZE
       ===================================================== */

    let resizeTimer =
      null;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          window.setTimeout(
            buildSketchbook,
            180
          );

      }
    );



    /* =====================================================
       START
       ===================================================== */

    buildSketchbook();

  })();
  </script>

</body>
</html>
