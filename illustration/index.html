      "vehicle-03.webp"

    ];



    /* =====================================================
       ELEMENTS
       ===================================================== */

    const viewport =
      document.getElementById(
        "sketchbook-viewport"
      );


    const paper =
      document.getElementById(
        "sketchbook-paper"
      );


    const field =
      document.getElementById(
        "sketchbook-field"
      );


    if (
      !viewport ||
      !paper ||
      !field
    ) {
      return;
    }



    /* =====================================================
       HELPERS
       ===================================================== */

    function clamp(
      value,
      min,
      max
    ) {

      return Math.min(
        Math.max(value, min),
        max
      );

    }


    function randomBetween(
      min,
      max
    ) {

      return (
        min +
        Math.random() *
        (
          max -
          min
        )
      );

    }


    function shuffle(
      array
    ) {

      const copy =
        [...array];


      for (
        let i =
          copy.length - 1;

        i > 0;

        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }


      return copy;

    }


    function categoryFromFilename(
      filename
    ) {

      let category =
        filename
          .split("-")[0]
          .toLowerCase();


      if (
        category === "animals"
      ) {

        category =
          "animal";

      }


      return category;

    }


    function boxesOverlap(
      a,
      b,
      padding = 0
    ) {

      return !(
        a.right + padding <= b.left ||
        a.left >= b.right + padding ||
        a.bottom + padding <= b.top ||
        a.top >= b.bottom + padding
      );

    }


    function getBounds(
      boxes
    ) {

      const left =
        Math.min(
          ...boxes.map(
            box => box.left
          )
        );


      const top =
        Math.min(
          ...boxes.map(
            box => box.top
          )
        );


      const right =
        Math.max(
          ...boxes.map(
            box => box.right
          )
        );


      const bottom =
        Math.max(
          ...boxes.map(
            box => box.bottom
          )
        );


      return {

        left,
        top,
        right,
        bottom,

        width:
          right - left,

        height:
          bottom - top

      };

    }


    function rotatedBounds(
      width,
      height,
      degrees
    ) {

      const radians =
        degrees *
        Math.PI /
        180;


      const cos =
        Math.abs(
          Math.cos(
            radians
          )
        );


      const sin =
        Math.abs(
          Math.sin(
            radians
          )
        );


      return {

        width:
          width * cos +
          height * sin,

        height:
          width * sin +
          height * cos

      };

    }



    /* =====================================================
       IMAGE LOADING
       ===================================================== */

    function loadImageData(
      filename
    ) {

      return new Promise(
        resolve => {

          const image =
            new Image();


          image.src =
            filename;


          image.decoding =
            "async";


          image.onload =
            () => {

              resolve({

                filename,

                category:
                  categoryFromFilename(
                    filename
                  ),

                width:
                  image.naturalWidth,

                height:
                  image.naturalHeight,

                area:
                  image.naturalWidth *
                  image.naturalHeight

              });

            };


          image.onerror =
            () => {

              console.warn(
                `Could not load ${filename}`
              );


              resolve(
                null
              );

            };

        }
      );

    }



    /* =====================================================
       SOURCE-DIMENSION SCALING

       THIS IS THE MAIN SIZE SYSTEM.

       A file that is physically larger in pixel dimensions
       appears larger on the sketchbook.

       sqrt(width × height) gives us a linear-size value.

       We only soften extreme differences slightly.
       ===================================================== */

    function calculateDisplaySize(
      item,
      referenceLinear
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const sourceLinear =
        Math.sqrt(
          item.width *
          item.height
        );


      const ratio =
        sourceLinear /
        Math.max(
          1,
          referenceLinear
        );


      /*
        Average-size file lands around here.
      */

      const baseLongest =
        mobile
          ? 86
          : 112;


      /*
        Very close to proportional.

        .88 is only enough compression to stop
        extreme exports getting completely absurd.
      */

      let longest =
        baseLongest *
        Math.pow(
          ratio,
          .88
        );


      /*
        Tiny handmade variation.
      */

      longest *=
        randomBetween(
          .98,
          1.02
        );


      /*
        Emergency limits only.
      */

      longest =
        clamp(
          longest,
          mobile
            ? 42
            : 52,
          mobile
            ? 220
            : 320
        );


      let width;
      let height;


      if (
        item.width >=
        item.height
      ) {

        width =
          longest;


        height =
          longest *
          (
            item.height /
            item.width
          );

      }

      else {

        height =
          longest;


        width =
          longest *
          (
            item.width /
            item.height
          );

      }


      return {
        width,
        height
      };

    }



    /* =====================================================
       PREPARE DRAWING
       ===================================================== */

    function prepareDrawing(
      item,
      referenceLinear
    ) {

      const size =
        calculateDisplaySize(
          item,
          referenceLinear
        );


      const rotation =
        randomBetween(
          -4.5,
          4.5
        );


      const bounds =
        rotatedBounds(
          size.width,
          size.height,
          rotation
        );


      return {

        ...item,

        displayWidth:
          size.width,

        displayHeight:
          size.height,

        rotation,

        boxWidth:
          bounds.width,

        boxHeight:
          bounds.height

      };

    }



    /* =====================================================
       CANDIDATES AROUND AN EXISTING ITEM

       New drawings grow outward around drawings already
       placed, rather than along rows.
       ===================================================== */

    function candidatesAround(
      width,
      height,
      target,
      gap,
      count = 28
    ) {

      const cx =
        (
          target.left +
          target.right
        )
        / 2;


      const cy =
        (
          target.top +
          target.bottom
        )
        / 2;


      const targetWidth =
        target.right -
        target.left;


      const targetHeight =
        target.bottom -
        target.top;


      const candidates =
        [];


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const angle =
          randomBetween(
            0,
            Math.PI * 2
          );


        const radiusX =
          targetWidth / 2 +
          width / 2 +
          gap;


        const radiusY =
          targetHeight / 2 +
          height / 2 +
          gap;


        /*
          Pull candidates slightly inward.

          This produces a tighter pile while collision
          checking still prevents actual overlap.
        */

        const compression =
          randomBetween(
            .82,
            .98
          );


        const centerX =
          cx +
          Math.cos(angle) *
          radiusX *
          compression;


        const centerY =
          cy +
          Math.sin(angle) *
          radiusY *
          compression;


        candidates.push({

          left:
            centerX -
            width / 2,

          top:
            centerY -
            height / 2

        });

      }


      return candidates;

    }



    /* =====================================================
       PACK A CATEGORY

       Same-name drawings stay together.

       Example:
       figure-* = one cluster
       food-* = one cluster
       etc.
       ===================================================== */

    function packCategory(
      items
    ) {

      const gap =
        1;


      const ordered =
        shuffle(
          items
        )
        .sort(
          (a, b) =>

            (
              b.boxWidth *
              b.boxHeight
            )
            -
            (
              a.boxWidth *
              a.boxHeight
            )

        );


      const placed =
        [];


      ordered.forEach(
        (
          item,
          index
        ) => {

          if (
            index === 0
          ) {

            placed.push({

              ...item,

              left:
                0,

              top:
                0,

              right:
                item.boxWidth,

              bottom:
                item.boxHeight

            });


            return;

          }


          let winner =
            null;


          let winnerScore =
            Infinity;


          shuffle(
            placed
          ).forEach(
            target => {

              const candidates =
                candidatesAround(
                  item.boxWidth,
                  item.boxHeight,
                  target,
                  gap,
                  34
                );


              candidates.forEach(
                candidate => {

                  const box = {

                    left:
                      candidate.left,

                    top:
                      candidate.top,

                    right:
                      candidate.left +
                      item.boxWidth,

                    bottom:
                      candidate.top +
                      item.boxHeight

                  };


                  const collision =
                    placed.some(
                      other =>
                        boxesOverlap(
                          box,
                          other,
                          gap
                        )
                    );


                  if (
                    collision
                  ) {
                    return;
                  }


                  const bounds =
                    getBounds(
                      [
                        ...placed,
                        box
                      ]
                    );


                  /*
                    Prefer tight, approximately round/irregular
                    category clumps rather than mini rows.
                  */

                  const aspect =
                    bounds.width /
                    Math.max(
                      1,
                      bounds.height
                    );


                  const area =
                    bounds.width *
                    bounds.height;


                  const aspectPenalty =
                    Math.abs(
                      Math.log(
                        aspect /
                        1.15
                      )
                    )
                    *
                    1500;


                  const score =
                    area +
                    aspectPenalty +
                    Math.random() *
                    500;


                  if (
                    score <
                    winnerScore
                  ) {

                    winnerScore =
                      score;


                    winner =
                      box;

                  }

                }
              );

            }
          );


          if (
            !winner
          ) {

            const bounds =
              getBounds(
                placed
              );


            winner = {

              left:
                bounds.right +
                gap,

              top:
                bounds.top,

              right:
                bounds.right +
                gap +
                item.boxWidth,

              bottom:
                bounds.top +
                item.boxHeight

            };

          }


          placed.push({

            ...item,
            ...winner

          });

        }
      );


      const bounds =
        getBounds(
          placed
        );


      return {

        width:
          bounds.width,

        height:
          bounds.height,

        items:
          placed.map(
            item => ({

              ...item,

              left:
                item.left -
                bounds.left,

              top:
                item.top -
                bounds.top

            })
          )

      };

    }



    /* =====================================================
       PACK THE CATEGORY CLUSTERS

       The result should read like one wide sketchbook spread,
       not a grid of groups.
       ===================================================== */

    function packGroups(
      groups
    ) {

      const gap =
        4;


      const targetAspect =
        3.25;


      const ordered =
        shuffle(
          groups
        )
        .sort(
          (a, b) =>

            (
              b.width *
              b.height
            )
            -
            (
              a.width *
              a.height
            )

        );


      const placed =
        [];


      ordered.forEach(
        (
          group,
          index
        ) => {

          if (
            index === 0
          ) {

            placed.push({

              ...group,

              left:
                0,

              top:
                0,

              right:
                group.width,

              bottom:
                group.height

            });


            return;

          }


          let winner =
            null;


          let winnerScore =
            Infinity;


          shuffle(
            placed
          ).forEach(
            target => {

              const candidates =
                candidatesAround(
                  group.width,
                  group.height,
                  target,
                  gap,
                  48
                );


              candidates.forEach(
                candidate => {

                  const box = {

                    left:
                      candidate.left,

                    top:
                      candidate.top,

                    right:
                      candidate.left +
                      group.width,

                    bottom:
                      candidate.top +
                      group.height

                  };


                  const collision =
                    placed.some(
                      other =>
                        boxesOverlap(
                          box,
                          other,
                          gap
                        )
                    );


                  if (
                    collision
                  ) {
                    return;
                  }


                  const bounds =
                    getBounds(
                      [
                        ...placed,
                        box
                      ]
                    );


                  const aspect =
                    bounds.width /
                    Math.max(
                      1,
                      bounds.height
                    );


                  const area =
                    bounds.width *
                    bounds.height;


                  /*
                    Strongly favor a wide page,
                    but still allow clusters to move
                    above and below each other.
                  */

                  const aspectPenalty =
                    Math.abs(
                      Math.log(
                        aspect /
                        targetAspect
                      )
                    )
                    *
                    13500;


                  /*
                    Penalize overly flat layouts.
                  */

                  const desiredHeight =
                    bounds.width /
                    3.6;


                  const flatPenalty =
                    bounds.height <
                    desiredHeight

                      ? (
                          desiredHeight -
                          bounds.height
                        )
                        *
                        650

                      : 0;


                  const score =
                    area +
                    aspectPenalty +
                    flatPenalty +
                    Math.random() *
                    3000;


                  if (
                    score <
                    winnerScore
                  ) {

                    winnerScore =
                      score;


                    winner =
                      box;

                  }

                }
              );

            }
          );


          if (
            !winner
          ) {

            const bounds =
              getBounds(
                placed
              );


            winner = {

              left:
                bounds.right +
                gap,

              top:
                bounds.top,

              right:
                bounds.right +
                gap +
                group.width,

              bottom:
                bounds.top +
                group.height

            };

          }


          placed.push({

            ...group,
            ...winner

          });

        }
      );


      const bounds =
        getBounds(
          placed
        );


      return {

        width:
          bounds.width,

        height:
          bounds.height,

        groups:
          placed.map(
            group => ({

              ...group,

              left:
                group.left -
                bounds.left,

              top:
                group.top -
                bounds.top

            })
          )

      };

    }



    /* =====================================================
       CREATE DRAWING
       ===================================================== */

    function createDrawing(
      item
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "drawing";


      wrapper.style.left =
        `${item.left}px`;


      wrapper.style.top =
        `${item.top}px`;


      wrapper.style.width =
        `${item.boxWidth}px`;


      wrapper.style.height =
        `${item.boxHeight}px`;



      const image =
        document.createElement(
          "img"
        );


      image.className =
        "drawing-art";


      image.src =
        item.filename;


      image.alt =
        "";


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.draggable =
        false;


      image.style.width =
        `${item.displayWidth}px`;


      image.style.height =
        `${item.displayHeight}px`;


      image.style.transform =
        `translate(-50%, -50%) rotate(${item.rotation}deg)`;


      wrapper.appendChild(
        image
      );


      return wrapper;

    }



    /* =====================================================
       BUILD SKETCHBOOK
       ===================================================== */

    let paperWidth =
      0;


    let paperHeight =
      0;


    async function buildSketchbook() {

      field.innerHTML =
        "";


      const loaded =
        (
          await Promise.all(
            files.map(
              loadImageData
            )
          )
        )
        .filter(Boolean);


      if (
        !loaded.length
      ) {
        return;
      }



      /* ---------------------------------------------
         REFERENCE SOURCE DIMENSION

         Median linear source size.

         Every drawing then scales relative to this.
         --------------------------------------------- */

      const sourceLinearSizes =
        loaded
          .map(
            item =>
              Math.sqrt(
                item.width *
                item.height
              )
          )
          .sort(
            (a, b) =>
              a - b
          );


      const middle =
        Math.floor(
          sourceLinearSizes.length /
          2
        );


      const referenceLinear =
        sourceLinearSizes.length % 2

          ? sourceLinearSizes[
              middle
            ]

          : (
              sourceLinearSizes[
                middle - 1
              ]
              +
              sourceLinearSizes[
                middle
              ]
            )
            / 2;



      /* ---------------------------------------------
         PREPARE EACH DRAWING
         --------------------------------------------- */

      const prepared =
        loaded.map(
          item =>
            prepareDrawing(
              item,
              referenceLinear
            )
        );



      /* ---------------------------------------------
         GROUP BY FILENAME PREFIX
         --------------------------------------------- */

      const categories =
        new Map();


      prepared.forEach(
        item => {

          if (
            !categories.has(
              item.category
            )
          ) {

            categories.set(
              item.category,
              []
            );

          }


          categories
            .get(
              item.category
            )
            .push(
              item
            );

        }
      );



      /* ---------------------------------------------
         PACK EACH CATEGORY
         --------------------------------------------- */

      const groups =
        [];


      categories.forEach(
        (
          items,
          category
        ) => {

          groups.push({

            category,

            ...packCategory(
              items
            )

          });

        }
      );



      /* ---------------------------------------------
         PACK ALL GROUPS
         --------------------------------------------- */

      const layout =
        packGroups(
          groups
        );



      /* ---------------------------------------------
         PAPER
         --------------------------------------------- */

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const padding =
        mobile
          ? 26
          : 38;



      paperWidth =
        layout.width +
        padding * 2;


      paperHeight =
        layout.height +
        padding * 2;



      /*
        Keep the final sheet wide.

        If the random pack ended too square,
        add width as breathing room rather than
        rearranging everything into rows.
      */

      const minimumAspect =
        mobile
          ? 2.25
          : 3.0;


      if (
        paperWidth /
        paperHeight <
        minimumAspect
      ) {

        paperWidth =
          paperHeight *
          minimumAspect;

      }



      paper.style.width =
        `${paperWidth}px`;


      paper.style.height =
        `${paperHeight}px`;



      const offsetX =
        (
          paperWidth -
          layout.width
        )
        / 2;


      const offsetY =
        (
          paperHeight -
          layout.height
        )
        / 2;



      layout.groups.forEach(
        group => {

          const groupElement =
            document.createElement(
              "div"
            );


          groupElement.className =
            "drawing-group";


          groupElement.dataset.category =
            group.category;


          /*
            Very small displacement breaks the
            invisible category-box precision.
          */

          const nudgeX =
            randomBetween(
              -3,
              3
            );


          const nudgeY =
            randomBetween(
              -3,
              3
            );


          groupElement.style.left =
            `${
              offsetX +
              group.left +
              nudgeX
            }px`;


          groupElement.style.top =
            `${
              offsetY +
              group.top +
              nudgeY
            }px`;


          groupElement.style.width =
            `${group.width}px`;


          groupElement.style.height =
            `${group.height}px`;


          group.items.forEach(
            item => {

              groupElement.appendChild(
                createDrawing(
                  item
                )
              );

            }
          );


          field.appendChild(
            groupElement
          );

        }
      );


      setInitialView();

    }



    /* =====================================================
       PAN + ZOOM
       ===================================================== */

    const view = {

      x:
        0,

      y:
        0,

      zoom:
        1,

      minZoom:
        .35,

      maxZoom:
        3,

      startX:
        0,

      startY:
        0,

      originX:
        0,

      originY:
        0,

      dragging:
        false

    };



    function clampPan(
      x,
      y,
      zoom
    ) {

      const scaledWidth =
        paperWidth *
        zoom;


      const scaledHeight =
        paperHeight *
        zoom;


      const viewportWidth =
        viewport.clientWidth;


      const viewportHeight =
        viewport.clientHeight;


      let minX;
      let maxX;
      let minY;
      let maxY;



      if (
        scaledWidth <=
        viewportWidth
      ) {

        minX =
          maxX =
          (
            viewportWidth -
            scaledWidth
          )
          / 2;

      }

      else {

        minX =
          viewportWidth -
          scaledWidth;

        maxX =
          0;

      }



      if (
        scaledHeight <=
        viewportHeight
      ) {

        minY =
          maxY =
          (
            viewportHeight -
            scaledHeight
          )
          / 2;

      }

      else {

        minY =
          viewportHeight -
          scaledHeight;

        maxY =
          0;

      }


      return {
        x:
          clamp(
            x,
            minX,
            maxX
          ),

        y:
          clamp(
            y,
            minY,
            maxY
          )
      };

    }



    function applyView() {

      paper.style.transform =
        `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.zoom})`;

    }



    function setView(
      x,
      y,
      zoom
    ) {

      view.zoom =
        clamp(
          zoom,
          view.minZoom,
          view.maxZoom
        );


      const position =
        clampPan(
          x,
          y,
          view.zoom
        );


      view.x =
        position.x;


      view.y =
        position.y;


      applyView();

    }



    /* =====================================================
       INITIAL VIEW

       Paper fills viewport vertically.

       Because paper is much wider, you only see
       part of the sketchbook and drag left/right.
       ===================================================== */

    function setInitialView() {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      let zoom =
        (
          viewport.clientHeight *
          .94
        )
        /
        paperHeight;


      zoom *=
        mobile
          ? 1.06
          : 1.12;


      zoom =
        clamp(
          zoom,
          .48,
          1.75
        );


      view.minZoom =
        Math.max(
          .32,
          zoom *
          .58
        );


      const scaledWidth =
        paperWidth *
        zoom;


      const scaledHeight =
        paperHeight *
        zoom;


      const x =
        (
          viewport.clientWidth -
          scaledWidth
        )
        / 2;


      const y =
        (
          viewport.clientHeight -
          scaledHeight
        )
        / 2;


      setView(
        x,
        y,
        zoom
      );

    }



    /* =====================================================
       DRAG
       ===================================================== */

    viewport.addEventListener(
      "pointerdown",
      event => {

        view.dragging =
          true;


        view.startX =
          event.clientX;


        view.startY =
          event.clientY;


        view.originX =
          view.x;


        view.originY =
          view.y;


        viewport.classList.add(
          "is-dragging"
        );


        viewport.setPointerCapture(
          event.pointerId
        );

      }
    );


    viewport.addEventListener(
      "pointermove",
      event => {

        if (
          !view.dragging
        ) {
          return;
        }


        const dx =
          event.clientX -
          view.startX;


        const dy =
          event.clientY -
          view.startY;


        setView(
          view.originX +
          dx,

          view.originY +
          dy,

          view.zoom
        );

      }
    );


    function finishDrag() {

      view.dragging =
        false;


      viewport.classList.remove(
        "is-dragging"
      );

    }


    viewport.addEventListener(
      "pointerup",
      finishDrag
    );


    viewport.addEventListener(
      "pointercancel",
      finishDrag
    );



    /* =====================================================
       WHEEL / TRACKPAD ZOOM
       ===================================================== */

    viewport.addEventListener(
      "wheel",
      event => {

        event.preventDefault();


        const rect =
          viewport.getBoundingClientRect();


        const pointerX =
          event.clientX -
          rect.left;


        const pointerY =
          event.clientY -
          rect.top;


        const worldX =
          (
            pointerX -
            view.x
          )
          /
          view.zoom;


        const worldY =
          (
            pointerY -
            view.y
          )
          /
          view.zoom;


        const factor =
          event.deltaY < 0
            ? 1.07
            : 1 / 1.07;


        const nextZoom =
          clamp(
            view.zoom *
            factor,

            view.minZoom,
            view.maxZoom
          );


        const nextX =
          pointerX -
          worldX *
          nextZoom;


        const nextY =
          pointerY -
          worldY *
          nextZoom;


        setView(
          nextX,
          nextY,
          nextZoom
        );

      },
      {
        passive:
          false
      }
    );



    /* =====================================================
       RESIZE
       ===================================================== */

    let resizeTimer =
      null;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          window.setTimeout(
            buildSketchbook,
            180
          );

      }
    );



    /* =====================================================
       START
       ===================================================== */

    buildSketchbook();

  })();
  </script>

</body>
</html>
