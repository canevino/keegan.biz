    /* =====================================================

    const viewport =

    /* =====================================================
       HELPERS
       ===================================================== */

    function clamp(
      value,
      min,
      max
    ) {
      return Math.min(
        Math.max(
          value,
          min
        ),
        max
      );
    }



    function randomBetween(
      min,
      max
    ) {
      return (
        min +
        Math.random() *
        (
          max -
          min
        )
      );
    }



    function shuffle(
      array
    ) {
      const copy =
        [...array];


      for (
        let i =
          copy.length - 1;
        i > 0;
        i--
      ) {
        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );

        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];
      }


      return copy;
    }



    function categoryFromFilename(
      filename
    ) {
      let category =
        filename
          .split("-")[0]
          .toLowerCase();


      if (
        category === "animals"
      ) {
        category =
          "animal";
      }


      return category;
    }



    function boxesOverlap(
      a,
      b,
      gap = 0
    ) {
      return !(
        a.right + gap <= b.left ||
        a.left >= b.right + gap ||
        a.bottom + gap <= b.top ||
        a.top >= b.bottom + gap
      );
    }



    function getBounds(
      boxes
    ) {
      if (
        !boxes.length
      ) {
        return {
          left: 0,
          top: 0,
          right: 0,
          bottom: 0,
          width: 0,
          height: 0
        };
      }


      const left =
        Math.min(
          ...boxes.map(
            box =>
              box.left
          )
        );


      const top =
        Math.min(
          ...boxes.map(
            box =>
              box.top
          )
        );


      const right =
        Math.max(
          ...boxes.map(
            box =>
              box.right
          )
        );


      const bottom =
        Math.max(
          ...boxes.map(
            box =>
              box.bottom
          )
        );


      return {
        left,
        top,
        right,
        bottom,
        width:
          right -
          left,
        height:
          bottom -
          top
      };
    }



    /* =====================================================
       VISIBLE ART ANALYSIS
       ===================================================== */

    function analyzeVisibleBounds(
      image
    ) {
      const SAMPLE_LIMIT =
        120;


      const scale =
        Math.min(
          1,
          SAMPLE_LIMIT /
          Math.max(
            image.naturalWidth,
            image.naturalHeight
          )
        );


      const width =
        Math.max(
          1,
          Math.round(
            image.naturalWidth *
            scale
          )
        );


      const height =
        Math.max(
          1,
          Math.round(
            image.naturalHeight *
            scale
          )
        );


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        width;


      canvas.height =
        height;


      const context =
        canvas.getContext(
          "2d",
          {
            willReadFrequently:
              true
          }
        );


      if (
        !context
      ) {
        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };
      }


      context.drawImage(
        image,
        0,
        0,
        width,
        height
      );


      let pixels;


      try {
        pixels =
          context.getImageData(
            0,
            0,
            width,
            height
          ).data;
      }

      catch {
        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };
      }


      const WHITE_THRESHOLD =
        247;


      const ALPHA_THRESHOLD =
        12;


      let minX =
        width;


      let minY =
        height;


      let maxX =
        -1;


      let maxY =
        -1;



      for (
        let y = 0;
        y < height;
        y++
      ) {
        for (
          let x = 0;
          x < width;
          x++
        ) {
          const index =
            (
              y *
              width +
              x
            )
            *
            4;


          const red =
            pixels[index];


          const green =
            pixels[index + 1];


          const blue =
            pixels[index + 2];


          const alpha =
            pixels[index + 3];


          if (
            alpha <=
            ALPHA_THRESHOLD
          ) {
            continue;
          }


          if (
            red >=
            WHITE_THRESHOLD &&
            green >=
            WHITE_THRESHOLD &&
            blue >=
            WHITE_THRESHOLD
          ) {
            continue;
          }


          minX =
            Math.min(
              minX,
              x
            );


          minY =
            Math.min(
              minY,
              y
            );


          maxX =
            Math.max(
              maxX,
              x
            );


          maxY =
            Math.max(
              maxY,
              y
            );
        }
      }



      if (
        maxX <
        minX ||
        maxY <
        minY
      ) {
        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };
      }


      const margin =
        2;


      minX =
        Math.max(
          0,
          minX -
          margin
        );


      minY =
        Math.max(
          0,
          minY -
          margin
        );


      maxX =
        Math.min(
          width -
          1,
          maxX +
          margin
        );


      maxY =
        Math.min(
          height -
          1,
          maxY +
          margin
        );


      return {
        left:
          minX /
          width,
        top:
          minY /
          height,
        right:
          (
            maxX +
            1
          ) / width,
        bottom:
          (
            maxY +
            1
          ) / height
      };
    }



    /* =====================================================
       LOAD IMAGES
       ===================================================== */

    function loadImageData(
      filename
    ) {
      return new Promise(
        resolve => {
          const image =
            new Image();


          image.src =
            filename;


          image.decoding =
            "async";


          image.onload =
            () => {
              resolve({
                filename,
                category:
                  categoryFromFilename(
                    filename
                  ),
                width:
                  image.naturalWidth,
                height:
                  image.naturalHeight,
                visibleBounds:
                  analyzeVisibleBounds(
                    image
                  )
              });
            };


          image.onerror =
            () => {
              console.warn(
                `Could not load ${filename}`
              );

              resolve(null);
            };
        }
      );
    }



    /* =====================================================
       SIZE SYSTEM

       Source dimensions remain the primary scale.
       ===================================================== */

    function calculateDisplaySize(
      item,
      referenceLinear
    ) {
      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const sourceLinear =
        Math.sqrt(
          item.width *
          item.height
        );


      let ratio =
        sourceLinear /
        Math.max(
          referenceLinear,
          1
        );


      ratio =
        clamp(
          ratio,
          .45,
          2.55
        );


      const baseLongest =
        mobile
          ? 98
          : 138;


      const longest =
        baseLongest *
        Math.pow(
          ratio,
          .94
        );


      let width;
      let height;


      if (
        item.width >=
        item.height
      ) {
        width =
          longest;

        height =
          longest *
          (
            item.height /
            item.width
          );
      }

      else {
        height =
          longest;

        width =
          longest *
          (
            item.width /
            item.height
          );
      }


      return {
        width,
        height
      };
    }



    /* =====================================================
       PREPARE DRAWING
       ===================================================== */

    function prepareDrawing(
      item,
      referenceLinear
    ) {
      const size =
        calculateDisplaySize(
          item,
          referenceLinear
        );


      const rotation =
        randomBetween(
          -5,
          5
        );


      const visible =
        item.visibleBounds;


      return {
        ...item,
        displayWidth:
          size.width,
        displayHeight:
          size.height,
        rotation,
        visibleLeft:
          visible.left *
          size.width,
        visibleTop:
          visible.top *
          size.height,
        visibleWidth:
          Math.max(
            4,
            (
              visible.right -
              visible.left
            ) *
            size.width
          ),
        visibleHeight:
          Math.max(
            4,
            (
              visible.bottom -
              visible.top
            ) *
            size.height
          )
      };
    }



    /* =====================================================
       COLLISION BOX
       ===================================================== */

    function collisionBoxAt(
      item,
      x,
      y
    ) {
      const safety =
        2.5;


      return {
        left:
          x +
          item.visibleLeft -
          safety,
        top:
          y +
          item.visibleTop -
          safety,
        right:
          x +
          item.visibleLeft +
          item.visibleWidth +
          safety,
        bottom:
          y +
          item.visibleTop +
          item.visibleHeight +
          safety
      };
    }



    /* =====================================================
       CANDIDATE POSITIONS
       ===================================================== */

    function createCandidatesAround(
      item,
      target,
      count
    ) {
      const GAP =
        3;


      const ownBox =
        collisionBoxAt(
          item,
          0,
          0
        );


      const ownWidth =
        ownBox.right -
        ownBox.left;


      const ownHeight =
        ownBox.bottom -
        ownBox.top;


      const ownCenterOffsetX =
        (
          ownBox.left +
          ownBox.right
        ) / 2;


      const ownCenterOffsetY =
        (
          ownBox.top +
          ownBox.bottom
        ) / 2;


      const targetWidth =
        target.collision.right -
        target.collision.left;


      const targetHeight =
        target.collision.bottom -
        target.collision.top;


      const targetCenterX =
        (
          target.collision.left +
          target.collision.right
        ) / 2;


      const targetCenterY =
        (
          target.collision.top +
          target.collision.bottom
        ) / 2;


      const combinedWidth =
        targetWidth / 2 +
        ownWidth / 2 +
        GAP;


      const combinedHeight =
        targetHeight / 2 +
        ownHeight / 2 +
        GAP;


      const candidates =
        [];


      for (
        let i = 0;
        i < count;
        i++
      ) {
        const angle =
          randomBetween(
            0,
            Math.PI * 2
          );


        const cosine =
          Math.cos(angle);


        const sine =
          Math.sin(angle);


        const radiusX =
          combinedWidth /
          Math.max(
            Math.abs(cosine),
            .0001
          );


        const radiusY =
          combinedHeight /
          Math.max(
            Math.abs(sine),
            .0001
          );


        const radius =
          Math.min(
            radiusX,
            radiusY
          );


        const centerX =
          targetCenterX +
          cosine *
          radius;


        const centerY =
          targetCenterY +
          sine *
          radius;


        candidates.push({
          x:
            centerX -
            ownCenterOffsetX,
          y:
            centerY -
            ownCenterOffsetY
        });
      }


      return candidates;
    }



    /* =====================================================
       PACKING
       ===================================================== */

    function packDrawings(
      drawings
    ) {
      const COLLISION_GAP =
        1;


      const TARGET_ASPECT =
        1;


      const ordered =
        [...drawings]
          .sort(
            (a, b) =>
              (
                b.visibleWidth *
                b.visibleHeight
              ) -
              (
                a.visibleWidth *
                a.visibleHeight
              )
          );


      const placed =
        [];



      ordered.forEach(
        (
          item,
          index
        ) => {

          if (
            index === 0
          ) {
            const x =
              0;

            const y =
              0;


            placed.push({
              ...item,
              x,
              y,
              collision:
                collisionBoxAt(
                  item,
                  x,
                  y
                )
            });


            return;
          }



          let winner =
            null;

          let winnerScore =
            Infinity;



          const related =
            shuffle(
              placed.filter(
                other =>
                  other.category ===
                  item.category
              )
            );


          const others =
            shuffle(
              placed.filter(
                other =>
                  other.category !==
                  item.category
              )
            );


          const targets = [
            ...related,
            ...others
          ];



          targets.forEach(
            target => {

              const sameCategory =
                target.category ===
                item.category;


              const candidates =
                createCandidatesAround(
                  item,
                  target,
                  sameCategory
                    ? 72
                    : 28
                );


              candidates.forEach(
                candidate => {

                  const collision =
                    collisionBoxAt(
                      item,
                      candidate.x,
                      candidate.y
                    );


                  const overlaps =
                    placed.some(
                      other =>
                        boxesOverlap(
                          collision,
                          other.collision,
                          COLLISION_GAP
                        )
                    );


                  if (
                    overlaps
                  ) {
                    return;
                  }


                  const boxes = [
                    ...placed.map(
                      other =>
                        other.collision
                    ),
                    collision
                  ];


                  const bounds =
                    getBounds(
                      boxes
                    );


                  const width =
                    bounds.width;


                  const height =
                    bounds.height;


                  const area =
                    width *
                    height;


                  const ratio =
                    width /
                    Math.max(
                      height,
                      1
                    );


                  const squareDeviation =
                    Math.abs(
                      Math.log(
                        ratio /
                        TARGET_ASPECT
                      )
                    );


                  const squarePenalty =
                    area *
                    squareDeviation *
                    5.5;


                  const longest =
                    Math.max(
                      width,
                      height
                    );


                  const shortest =
                    Math.min(
                      width,
                      height
                    );


                  const imbalance =
                    longest /
                    Math.max(
                      shortest,
                      1
                    );


                  const imbalancePenalty =
                    imbalance >
                    1.20
                      ? area *
                        (
                          imbalance -
                          1.20
                        ) *
                        4
                      : 0;


                  const massCenterX =
                    (
                      bounds.left +
                      bounds.right
                    ) / 2;


                  const massCenterY =
                    (
                      bounds.top +
                      bounds.bottom
                    ) / 2;


                  const candidateX =
                    (
                      collision.left +
                      collision.right
                    ) / 2;


                  const candidateY =
                    (
                      collision.top +
                      collision.bottom
                    ) / 2;


                  const centerPenalty =
                    Math.hypot(
                      candidateX -
                      massCenterX,
                      candidateY -
                      massCenterY
                    ) *
                    20;


                  let categoryPenalty =
                    0;


                  if (
                    related.length
                  ) {
                    let nearest =
                      Infinity;


                    related.forEach(
                      relative => {

                        const x =
                          (
                            relative.collision.left +
                            relative.collision.right
                          ) / 2;


                        const y =
                          (
                            relative.collision.top +
                            relative.collision.bottom
                          ) / 2;


                        nearest =
                          Math.min(
                            nearest,
                            Math.hypot(
                              candidateX - x,
                              candidateY - y
                            )
                          );
                      }
                    );


                    categoryPenalty =
                      nearest *
                      38;
                  }


                  const categoryReward =
                    sameCategory
                      ? -3500
                      : 0;


                  const score =
                    area +
                    squarePenalty +
                    imbalancePenalty +
                    centerPenalty +
                    categoryPenalty +
                    categoryReward +
                    Math.random() *
                    900;


                  if (
                    score <
                    winnerScore
                  ) {
                    winnerScore =
                      score;

                    winner = {
                      x:
                        candidate.x,
                      y:
                        candidate.y,
                      collision
                    };
                  }
                }
              );
            }
          );



          if (
            !winner
          ) {
            const bounds =
              getBounds(
                placed.map(
                  other =>
                    other.collision
                )
              );


            const ownBox =
              collisionBoxAt(
                item,
                0,
                0
              );


            const ownWidth =
              ownBox.right -
              ownBox.left;


            const ownHeight =
              ownBox.bottom -
              ownBox.top;


            const ownOffsetX =
              (
                ownBox.left +
                ownBox.right
              ) / 2;


            const ownOffsetY =
              (
                ownBox.top +
                ownBox.bottom
              ) / 2;


            const centerX =
              (
                bounds.left +
                bounds.right
              ) / 2;


            const centerY =
              (
                bounds.top +
                bounds.bottom
              ) / 2;


            const GAP =
              8;


            let fallbackPoints;


            if (
              bounds.height >
              bounds.width
            ) {
              fallbackPoints = [
                {
                  x:
                    bounds.right +
                    GAP +
                    ownWidth / 2,
                  y:
                    centerY
                },
                {
                  x:
                    bounds.left -
                    GAP -
                    ownWidth / 2,
                  y:
                    centerY
                },
                {
                  x:
                    centerX,
                  y:
                    bounds.bottom +
                    GAP +
                    ownHeight / 2
                },
                {
                  x:
                    centerX,
                  y:
                    bounds.top -
                    GAP -
                    ownHeight / 2
                }
              ];
            }

            else {
              fallbackPoints = [
                {
                  x:
                    centerX,
                  y:
                    bounds.bottom +
                    GAP +
                    ownHeight / 2
                },
                {
                  x:
                    centerX,
                  y:
                    bounds.top -
                    GAP -
                    ownHeight / 2
                },
                {
                  x:
                    bounds.right +
                    GAP +
                    ownWidth / 2,
                  y:
                    centerY
                },
                {
                  x:
                    bounds.left -
                    GAP -
                    ownWidth / 2,
                  y:
                    centerY
                }
              ];
            }


            for (
              const point of
              fallbackPoints
            ) {
              const x =
                point.x -
                ownOffsetX;


              const y =
                point.y -
                ownOffsetY;


              const collision =
                collisionBoxAt(
                  item,
                  x,
                  y
                );


              const overlaps =
                placed.some(
                  other =>
                    boxesOverlap(
                      collision,
                      other.collision,
                      COLLISION_GAP
                    )
                );


              if (
                !overlaps
              ) {
                winner = {
                  x,
                  y,
                  collision
                };

                break;
              }
            }
          }



          if (
            !winner
          ) {
            const bounds =
              getBounds(
                placed.map(
                  other =>
                    other.collision
                )
              );


            const x =
              bounds.right +
              20;

            const y =
              bounds.bottom +
              20;


            winner = {
              x,
              y,
              collision:
                collisionBoxAt(
                  item,
                  x,
                  y
                )
            };
          }


          placed.push({
            ...item,
            x:
              winner.x,
            y:
              winner.y,
            collision:
              winner.collision
          });
        }
      );



      /* =====================================================
         COMPACTION
         ===================================================== */

      for (
        let pass = 0;
        pass < 260;
        pass++
      ) {
        const bounds =
          getBounds(
            placed.map(
              item =>
                item.collision
            )
          );


        const centerX =
          (
            bounds.left +
            bounds.right
          ) / 2;


        const centerY =
          (
            bounds.top +
            bounds.bottom
          ) / 2;


        shuffle(
          placed
        ).forEach(
          item => {
            const itemX =
              (
                item.collision.left +
                item.collision.right
              ) / 2;


            const itemY =
              (
                item.collision.top +
                item.collision.bottom
              ) / 2;


            const dx =
              centerX -
              itemX;


            const dy =
              centerY -
              itemY;


            const distance =
              Math.hypot(
                dx,
                dy
              );


            if (
              distance <
              .2
            ) {
              return;
            }


            const baseAngle =
              Math.atan2(
                dy,
                dx
              );


            const angles = [
              baseAngle,
              baseAngle + .14,
              baseAngle - .14,
              baseAngle + .3,
              baseAngle - .3,
              baseAngle + .55,
              baseAngle - .55
            ];


            const steps = [
              9,
              6,
              3,
              1.5,
              .75
            ];


            let moved =
              false;


            for (
              const step of
              steps
            ) {
              if (
                moved
              ) {
                break;
              }


              for (
                const angle of
                angles
              ) {
                const nextX =
                  item.x +
                  Math.cos(angle) *
                  step;


                const nextY =
                  item.y +
                  Math.sin(angle) *
                  step;


                const nextCollision =
                  collisionBoxAt(
                    item,
                    nextX,
                    nextY
                  );


                const overlaps =
                  placed.some(
                    other => {
                      if (
                        other === item
                      ) {
                        return false;
                      }

                      return boxesOverlap(
                        nextCollision,
                        other.collision,
                        .1
                      );
                    }
                  );


                if (
                  !overlaps
                ) {
                  item.x =
                    nextX;

                  item.y =
                    nextY;

                  item.collision =
                    nextCollision;

                  moved =
                    true;

                  break;
                }
              }
            }
          }
        );
      }



      /* =====================================================
         FINAL SQUARE PAPER
         ===================================================== */

      const finalBounds =
        getBounds(
          placed.map(
            item =>
              item.collision
          )
        );


      const CONTENT_PADDING =
        38;


      const contentWidth =
        finalBounds.width;


      const contentHeight =
        finalBounds.height;


      const squareContentSize =
        Math.max(
          contentWidth,
          contentHeight
        );


      const paperSize =
        squareContentSize +
        CONTENT_PADDING * 2;


      const extraX =
        (
          squareContentSize -
          contentWidth
        ) / 2;


      const extraY =
        (
          squareContentSize -
          contentHeight
        ) / 2;


      placed.forEach(
        item => {
          item.x =
            item.x -
            finalBounds.left +
            CONTENT_PADDING +
            extraX;


          item.y =
            item.y -
            finalBounds.top +
            CONTENT_PADDING +
            extraY;
        }
      );


      return {
        width:
          paperSize,
        height:
          paperSize,
        items:
          placed
      };
    }



    /* =====================================================
       CREATE DRAWING ELEMENT
       ===================================================== */

    function createDrawingElement(
      item
    ) {
      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "drawing";


      wrapper.style.left =
        `${item.x}px`;


      wrapper.style.top =
        `${item.y}px`;


      wrapper.style.width =
        `${item.displayWidth}px`;


      wrapper.style.height =
        `${item.displayHeight}px`;


      const image =
        document.createElement(
          "img"
        );


      image.className =
        "drawing-art";


      image.src =
        item.filename;


      image.alt =
        "";


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.draggable =
        false;


      image.style.transform =
        `rotate(${item.rotation}deg)`;


      wrapper.appendChild(
        image
      );


      return wrapper;
    }



    /* =====================================================
       BUILD
       ===================================================== */

    let paperWidth =
      1;

    let paperHeight =
      1;

    let buildGeneration =
      0;



    async function buildSketchbook() {
      const generation =
        ++buildGeneration;


      field.innerHTML =
        "";


      const loaded =
        (
          await Promise.all(
            files.map(
              loadImageData
            )
          )
        ).filter(Boolean);


      if (
        generation !==
        buildGeneration
      ) {
        return;
      }


      if (
        !loaded.length
      ) {
        return;
      }


      const linearSizes =
        loaded
          .map(
            item =>
              Math.sqrt(
                item.width *
                item.height
              )
          )
          .sort(
            (a, b) =>
              a - b
          );


      const midpoint =
        Math.floor(
          linearSizes.length /
          2
        );


      const referenceLinear =
        linearSizes.length % 2
          ? linearSizes[
              midpoint
            ]
          : (
              linearSizes[
                midpoint - 1
              ] +
              linearSizes[
                midpoint
              ]
            ) / 2;


      const prepared =
        loaded.map(
          item =>
            prepareDrawing(
              item,
              referenceLinear
            )
        );


      const layout =
        packDrawings(
          prepared
        );


      if (
        generation !==
        buildGeneration
      ) {
        return;
      }


      paperWidth =
        layout.width;

      paperHeight =
        layout.height;


      paper.style.width =
        `${paperWidth}px`;

      paper.style.height =
        `${paperHeight}px`;


      const fragment =
        document.createDocumentFragment();


      layout.items.forEach(
        item => {
          fragment.appendChild(
            createDrawingElement(
              item
            )
          );
        }
      );


      field.appendChild(
        fragment
      );


      setInitialView();
    }



    /* =====================================================
       VIEW STATE
       ===================================================== */

    const view = {
      x: 0,
      y: 0,
      zoom: 1,
      minZoom: .1,
      maxZoom: 4,
      dragging: false,
      startX: 0,
      startY: 0,
      originX: 0,
      originY: 0
    };



    /* =====================================================
       PAN CONSTRAINTS
       ===================================================== */

    function constrainPan(
      x,
      y,
      zoom
    ) {
      const scaledWidth =
        paperWidth *
        zoom;


      const scaledHeight =
        paperHeight *
        zoom;


      const viewportWidth =
        viewport.clientWidth;


      const viewportHeight =
        viewport.clientHeight;


      let minX;
      let maxX;
      let minY;
      let maxY;


      if (
        scaledWidth <=
        viewportWidth
      ) {
        minX =
          maxX =
          (
            viewportWidth -
            scaledWidth
          ) / 2;
      }

      else {
        minX =
          viewportWidth -
          scaledWidth;

        maxX =
          0;
      }


      if (
        scaledHeight <=
        viewportHeight
      ) {
        minY =
          maxY =
          (
            viewportHeight -
            scaledHeight
          ) / 2;
      }

      else {
        minY =
          viewportHeight -
          scaledHeight;

        maxY =
          0;
      }


      return {
        x:
          clamp(
            x,
            minX,
            maxX
          ),
        y:
          clamp(
            y,
            minY,
            maxY
          )
      };
    }



    /* =====================================================
       ZOOM BUTTON VISIBILITY
       ===================================================== */

    function updateZoomButtons() {
      const epsilon =
        .0005;


      zoomOutButton.classList.toggle(
        "is-hidden",
        view.zoom <=
        view.minZoom +
        epsilon
      );


      zoomInButton.classList.toggle(
        "is-hidden",
        view.zoom >=
        view.maxZoom -
        epsilon
      );
    }



    /* =====================================================
       APPLY VIEW
       ===================================================== */

    function applyView() {
      paper.style.transform =
        `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.zoom})`;

      updateZoomButtons();
    }



    /* =====================================================
       SET VIEW
       ===================================================== */

    function setView(
      x,
      y,
      zoom
    ) {
      view.zoom =
        clamp(
          zoom,
          view.minZoom,
          view.maxZoom
        );


      const constrained =
        constrainPan(
          x,
          y,
          view.zoom
        );


      view.x =
        constrained.x;

      view.y =
        constrained.y;


      applyView();
    }



    /* =====================================================
       INITIAL VIEW
       ===================================================== */

    function setInitialView() {
      const viewportWidth =
        viewport.clientWidth;


      const viewportHeight =
        viewport.clientHeight;


      const coverWidth =
        viewportWidth /
        paperWidth;


      const coverHeight =
        viewportHeight /
        paperHeight;


      const coverZoom =
        Math.max(
          coverWidth,
          coverHeight
        );


      view.minZoom =
        coverZoom *
        1.25;


      view.maxZoom =
        Math.max(
          view.minZoom *
          4.5,
          3.2
        );


      const initialZoom =
        Math.min(
          view.minZoom *
          1.38,
          view.maxZoom
        );


      const scaledWidth =
        paperWidth *
        initialZoom;


      const scaledHeight =
        paperHeight *
        initialZoom;


      const initialX =
        (
          viewportWidth -
          scaledWidth
        ) / 2;


      const initialY =
        (
          viewportHeight -
          scaledHeight
        ) / 2;


      setView(
        initialX,
        initialY,
        initialZoom
      );
    }



    /* =====================================================
       ZOOM AROUND POINT
       ===================================================== */

    function zoomAt(
      screenX,
      screenY,
      targetZoom
    ) {
      const worldX =
        (
          screenX -
          view.x
        ) / view.zoom;


      const worldY =
        (
          screenY -
          view.y
        ) / view.zoom;


      const zoom =
        clamp(
          targetZoom,
          view.minZoom,
          view.maxZoom
        );


      const nextX =
        screenX -
        worldX *
        zoom;


      const nextY =
        screenY -
        worldY *
        zoom;


      setView(
        nextX,
        nextY,
        zoom
      );
    }



    /* =====================================================
       CENTER ZOOM
       ===================================================== */

    function zoomCenter(
      factor
    ) {
      zoomAt(
        viewport.clientWidth / 2,
        viewport.clientHeight / 2,
        view.zoom * factor
      );
    }



    /* =====================================================
       ZOOM BUTTONS
       ===================================================== */

    zoomInButton.addEventListener(
      "click",
      () => {
        zoomCenter(
          1.22
        );
      }
    );


    zoomOutButton.addEventListener(
      "click",
      () => {
        zoomCenter(
          1 / 1.22
        );
      }
    );



    /* =====================================================
       TRACKPAD / MOUSE ZOOM
       ===================================================== */

    viewport.addEventListener(
      "wheel",
      event => {
        event.preventDefault();


        const rect =
          viewport.getBoundingClientRect();


        const screenX =
          event.clientX -
          rect.left;


        const screenY =
          event.clientY -
          rect.top;


        const factor =
          Math.exp(
            -event.deltaY *
            .00135
          );


        zoomAt(
          screenX,
          screenY,
          view.zoom *
          factor
        );
      },
      {
        passive:
          false
      }
    );



    /* =====================================================
       DRAG / PAN
       ===================================================== */

    viewport.addEventListener(
      "pointerdown",
      event => {
        if (
          event.target.closest(
            ".zoom-controls"
          )
        ) {
          return;
        }


        view.dragging =
          true;


        view.startX =
          event.clientX;


        view.startY =
          event.clientY;


        view.originX =
          view.x;


        view.originY =
          view.y;


        viewport.classList.add(
          "is-dragging"
        );


        try {
          viewport.setPointerCapture(
            event.pointerId
          );
        }

        catch {
          /* no-op */
        }
      }
    );



    viewport.addEventListener(
      "pointermove",
      event => {
        if (
          !view.dragging
        ) {
          return;
        }


        const dx =
          event.clientX -
          view.startX;


        const dy =
          event.clientY -
          view.startY;


        setView(
          view.originX +
          dx,
          view.originY +
          dy,
          view.zoom
        );
      }
    );



    function finishDrag() {
      view.dragging =
        false;

      viewport.classList.remove(
        "is-dragging"
      );
    }


    viewport.addEventListener(
      "pointerup",
      finishDrag
    );


    viewport.addEventListener(
      "pointercancel",
      finishDrag
    );


    window.addEventListener(
      "blur",
      finishDrag
    );



    /* =====================================================
       RESIZE
       ===================================================== */

    let resizeTimer =
      null;


    window.addEventListener(
      "resize",
      () => {
        clearTimeout(
          resizeTimer
        );

        resizeTimer =
          window.setTimeout(
            buildSketchbook,
            200
          );
      }
    );



    /* =====================================================
       START
       ===================================================== */

    buildSketchbook();

  })();
  </script>

</body>

</html>
