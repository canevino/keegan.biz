  (() => {

      "object-04.webp",
      "object-05.webp",

      "vehicle-02.webp",
      "vehicle-03.webp"

    ];



    /* =====================================================
       ELEMENTS
       ===================================================== */

    const viewport =
      document.getElementById(
        "sketchbook-viewport"
      );

    const paper =
      document.getElementById(
        "sketchbook-paper"
      );

    const field =
      document.getElementById(
        "sketchbook-field"
      );

    const zoomInButton =
      document.getElementById(
        "zoom-in"
      );

    const zoomOutButton =
      document.getElementById(
        "zoom-out"
      );


    if (
      !viewport ||
      !paper ||
      !field
    ) {
      return;
    }



    /* =====================================================
       HELPERS
       ===================================================== */

    function clamp(
      value,
      min,
      max
    ) {

      return Math.min(
        Math.max(
          value,
          min
        ),
        max
      );

    }


    function randomBetween(
      min,
      max
    ) {

      return (
        min +
        Math.random() *
        (
          max -
          min
        )
      );

    }


    function shuffle(
      array
    ) {

      const copy =
        [...array];


      for (
        let i = copy.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );


        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }


      return copy;

    }


    function categoryFromFilename(
      filename
    ) {

      let category =
        filename
          .split("-")[0]
          .toLowerCase();


      if (
        category === "animals"
      ) {
        category =
          "animal";
      }


      return category;

    }


    function boxesOverlap(
      a,
      b,
      gap = 0
    ) {

      return !(
        a.right + gap <= b.left ||
        a.left >= b.right + gap ||
        a.bottom + gap <= b.top ||
        a.top >= b.bottom + gap
      );

    }


    function getBounds(
      boxes
    ) {

      return {

        left:
          Math.min(
            ...boxes.map(
              box => box.left
            )
          ),

        top:
          Math.min(
            ...boxes.map(
              box => box.top
            )
          ),

        right:
          Math.max(
            ...boxes.map(
              box => box.right
            )
          ),

        bottom:
          Math.max(
            ...boxes.map(
              box => box.bottom
            )
          )

      };

    }



    /* =====================================================
       ANALYZE VISIBLE CONTENT

       Ignore near-white margins inside WebPs.
       ===================================================== */

    function analyzeVisibleBounds(
      image
    ) {

      const maxSample =
        120;


      const scale =
        Math.min(
          1,
          maxSample /
          Math.max(
            image.naturalWidth,
            image.naturalHeight
          )
        );


      const width =
        Math.max(
          1,
          Math.round(
            image.naturalWidth *
            scale
          )
        );


      const height =
        Math.max(
          1,
          Math.round(
            image.naturalHeight *
            scale
          )
        );


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        width;


      canvas.height =
        height;


      const ctx =
        canvas.getContext(
          "2d",
          {
            willReadFrequently: true
          }
        );


      ctx.drawImage(
        image,
        0,
        0,
        width,
        height
      );


      let data;


      try {

        data =
          ctx.getImageData(
            0,
            0,
            width,
            height
          ).data;

      }

      catch {

        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };

      }


      let minX =
        width;

      let minY =
        height;

      let maxX =
        -1;

      let maxY =
        -1;


      const white =
        247;


      for (
        let y = 0;
        y < height;
        y++
      ) {

        for (
          let x = 0;
          x < width;
          x++
        ) {

          const i =
            (
              y *
              width +
              x
            )
            *
            4;


          const r =
            data[i];

          const g =
            data[i + 1];

          const b =
            data[i + 2];

          const a =
            data[i + 3];


          if (
            a < 14
          ) {
            continue;
          }


          if (
            r >= white &&
            g >= white &&
            b >= white
          ) {
            continue;
          }


          minX =
            Math.min(
              minX,
              x
            );

          minY =
            Math.min(
              minY,
              y
            );

          maxX =
            Math.max(
              maxX,
              x
            );

          maxY =
            Math.max(
              maxY,
              y
            );

        }

      }


      if (
        maxX < minX ||
        maxY < minY
      ) {

        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };

      }


      return {

        left:
          Math.max(
            0,
            minX - 1
          )
          /
          width,

        top:
          Math.max(
            0,
            minY - 1
          )
          /
          height,

        right:
          Math.min(
            width,
            maxX + 2
          )
          /
          width,

        bottom:
          Math.min(
            height,
            maxY + 2
          )
          /
          height

      };

    }



    /* =====================================================
       LOAD
       ===================================================== */

    function loadImageData(
      filename
    ) {

      return new Promise(
        resolve => {

          const image =
            new Image();


          image.src =
            filename;


          image.decoding =
            "async";


          image.onload =
            () => {

              resolve({

                filename,

                category:
                  categoryFromFilename(
                    filename
                  ),

                width:
                  image.naturalWidth,

                height:
                  image.naturalHeight,

                visible:
                  analyzeVisibleBounds(
                    image
                  )

              });

            };


          image.onerror =
            () => {

              console.warn(
                `Could not load ${filename}`
              );


              resolve(null);

            };

        }
      );

    }



    /* =====================================================
       SIZE

       Primarily driven by actual source dimensions.

       Ratio clamp only restrains extreme outliers.
       ===================================================== */

    function calculateDisplaySize(
      item,
      referenceLinear
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const sourceLinear =
        Math.sqrt(
          item.width *
          item.height
        );


      let ratio =
        sourceLinear /
        Math.max(
          referenceLinear,
          1
        );


      ratio =
        clamp(
          ratio,
          .52,
          2.15
        );


      const base =
        mobile
          ? 88
          : 116;


      const longest =
        base *
        Math.pow(
          ratio,
          .92
        );


      let width;
      let height;


      if (
        item.width >=
        item.height
      ) {

        width =
          longest;


        height =
          longest *
          (
            item.height /
            item.width
          );

      }

      else {

        height =
          longest;


        width =
          longest *
          (
            item.width /
            item.height
          );

      }


      return {
        width,
        height
      };

    }



    /* =====================================================
       PREPARE
       ===================================================== */

    function prepareDrawing(
      item,
      referenceLinear
    ) {

      const size =
        calculateDisplaySize(
          item,
          referenceLinear
        );


      const rotation =
        randomBetween(
          -4.5,
          4.5
        );


      return {

        ...item,

        displayWidth:
          size.width,

        displayHeight:
          size.height,

        rotation,

        visibleLeft:
          item.visible.left *
          size.width,

        visibleTop:
          item.visible.top *
          size.height,

        visibleWidth:
          (
            item.visible.right -
            item.visible.left
          )
          *
          size.width,

        visibleHeight:
          (
            item.visible.bottom -
            item.visible.top
          )
          *
          size.height

      };

    }



    /* =====================================================
       COLLISION BOX
       ===================================================== */

    function collisionBoxAt(
      item,
      x,
      y
    ) {

      const safety =
        2;


      return {

        left:
          x +
          item.visibleLeft -
          safety,

        top:
          y +
          item.visibleTop -
          safety,

        right:
          x +
          item.visibleLeft +
          item.visibleWidth +
          safety,

        bottom:
          y +
          item.visibleTop +
          item.visibleHeight +
          safety

      };

    }



    /* =====================================================
       TANGENT CANDIDATES

       Candidate centers sit just OUTSIDE an existing
       rectangle rather than inside it.

       This is the bug fix that ensures every image
       can actually be placed.
       ===================================================== */

    function tangentCandidates(
      item,
      target,
      count
    ) {

      const result =
        [];


      const tcx =
        (
          target.collision.left +
          target.collision.right
        )
        / 2;


      const tcy =
        (
          target.collision.top +
          target.collision.bottom
        )
        / 2;


      const tw =
        target.collision.right -
        target.collision.left;


      const th =
        target.collision.bottom -
        target.collision.top;


      const iw =
        item.visibleWidth;


      const ih =
        item.visibleHeight;


      const halfW =
        (
          tw +
          iw
        )
        /
        2;


      const halfH =
        (
          th +
          ih
        )
        /
        2;



      for (
        let i = 0;
        i < count;
        i++
      ) {

        const angle =
          randomBetween(
            0,
            Math.PI * 2
          );


        const cos =
          Math.cos(
            angle
          );


        const sin =
          Math.sin(
            angle
          );


        /*
          Scale direction until AT LEAST one axis
          reaches rectangle-separation distance.

          This places the new box tangent to the old box.
        */

        const denominator =
          Math.max(
            Math.abs(cos),
            Math.abs(sin),
            .001
          );


        const scale =
          1 /
          denominator;


        const dx =
          cos *
          halfW *
          scale;


        const dy =
          sin *
          halfH *
          scale;


        const visibleCenterX =
          tcx +
          dx;


        const visibleCenterY =
          tcy +
          dy;


        const x =
          visibleCenterX -
          (
            item.visibleLeft +
            item.visibleWidth /
            2
          );


        const y =
          visibleCenterY -
          (
            item.visibleTop +
            item.visibleHeight /
            2
          );


        result.push({
          x,
          y
        });

      }



      /*
        Guaranteed cardinal candidates.
      */

      const cardinals = [

        {
          cx:
            tcx +
            halfW,
          cy:
            tcy
        },

        {
          cx:
            tcx -
            halfW,
          cy:
            tcy
        },

        {
          cx:
            tcx,
          cy:
            tcy +
            halfH
        },

        {
          cx:
            tcx,
          cy:
            tcy -
            halfH
        }

      ];


      cardinals.forEach(
        position => {

          result.push({

            x:
              position.cx -
              (
                item.visibleLeft +
                item.visibleWidth /
                2
              ),

            y:
              position.cy -
              (
                item.visibleTop +
                item.visibleHeight /
                2
              )

          });

        }
      );


      return result;

    }



    /* =====================================================
       PACK

       ONE SINGLE MASS.

       Categories only affect scoring.
       They never create their own region.
       ===================================================== */

    function packDrawings(
      drawings
    ) {

      const ordered =
        [...drawings]
          .sort(
            (a, b) =>
              (
                b.visibleWidth *
                b.visibleHeight
              )
              -
              (
                a.visibleWidth *
                a.visibleHeight
              )
          );


      const placed =
        [];


      const TARGET_ASPECT =
        2.05;



      ordered.forEach(
        (
          item,
          index
        ) => {

          if (
            index === 0
          ) {

            const x =
              0;


            const y =
              0;


            placed.push({

              ...item,

              x,
              y,

              collision:
                collisionBoxAt(
                  item,
                  x,
                  y
                )

            });


            return;

          }



          let winner =
            null;


          let winnerScore =
            Infinity;



          const sameCategoryTargets =
            shuffle(
              placed.filter(
                other =>
                  other.category ===
                  item.category
              )
            );


          const otherTargets =
            shuffle(
              placed.filter(
                other =>
                  other.category !==
                  item.category
              )
            );


          /*
            Same-category drawings get tested first,
            but unrelated drawings remain valid anchors.
          */

          const targets = [

            ...sameCategoryTargets,

            ...otherTargets

          ];



          targets.forEach(
            target => {

              const same =
                target.category ===
                item.category;


              const candidates =
                tangentCandidates(
                  item,
                  target,
                  same
                    ? 42
                    : 18
                );


              candidates.forEach(
                candidate => {

                  const collision =
                    collisionBoxAt(
                      item,
                      candidate.x,
                      candidate.y
                    );


                  const hit =
                    placed.some(
                      other =>
                        boxesOverlap(
                          collision,
                          other.collision,
                          .5
                        )
                    );


                  if (
                    hit
                  ) {
                    return;
                  }



                  const allBoxes = [

                    ...placed.map(
                      other =>
                        other.collision
                    ),

                    collision

                  ];


                  const bounds =
                    getBounds(
                      allBoxes
                    );


                  const width =
                    bounds.right -
                    bounds.left;


                  const height =
                    bounds.bottom -
                    bounds.top;


                  const area =
                    width *
                    height;


                  const aspect =
                    width /
                    Math.max(
                      1,
                      height
                    );


                  /*
                    Broad sketchbook shape,
                    not an ultra-wide row.
                  */

                  const aspectPenalty =
                    Math.abs(
                      Math.log(
                        aspect /
                        TARGET_ASPECT
                      )
                    )
                    *
                    5500;



                  /*
                    Encourage filling around the center
                    of the existing mass.
                  */

                  const centerX =
                    (
                      bounds.left +
                      bounds.right
                    )
                    / 2;


                  const centerY =
                    (
                      bounds.top +
                      bounds.bottom
                    )
                    / 2;


                  const cx =
                    (
                      collision.left +
                      collision.right
                    )
                    / 2;


                  const cy =
                    (
                      collision.top +
                      collision.bottom
                    )
                    / 2;


                  const centerPenalty =
                    Math.hypot(
                      cx -
                      centerX,
                      cy -
                      centerY
                    )
                    *
                    17;



                  /*
                    Related things still cluster.
                  */

                  let categoryPenalty =
                    0;


                  if (
                    sameCategoryTargets.length
                  ) {

                    let nearest =
                      Infinity;


                    sameCategoryTargets.forEach(
                      other => {

                        const ox =
                          (
                            other.collision.left +
                            other.collision.right
                          )
                          /
                          2;


                        const oy =
                          (
                            other.collision.top +
                            other.collision.bottom
                          )
                          /
                          2;


                        nearest =
                          Math.min(

                            nearest,

                            Math.hypot(
                              cx - ox,
                              cy - oy
                            )

                          );

                      }
                    );


                    categoryPenalty =
                      nearest *
                      55;

                  }



                  const sameReward =
                    same
                      ? -3500
                      : 0;


                  const score =
                    area +
                    aspectPenalty +
                    centerPenalty +
                    categoryPenalty +
                    sameReward +
                    Math.random() *
                    1800;


                  if (
                    score <
                    winnerScore
                  ) {

                    winnerScore =
                      score;


                    winner = {

                      x:
                        candidate.x,

                      y:
                        candidate.y,

                      collision

                    };

                  }

                }
              );

            }
          );



          /* ---------------------------------------------
             ABSOLUTE FALLBACK

             Always succeeds by placing outside
             the complete current bounds.
             --------------------------------------------- */

          if (
            !winner
          ) {

            const bounds =
              getBounds(
                placed.map(
                  other =>
                    other.collision
                )
              );


            const centerX =
              (
                bounds.left +
                bounds.right
              )
              /
              2;


            const centerY =
              (
                bounds.top +
                bounds.bottom
              )
              /
              2;


            const candidates = [

              {
                cx:
                  bounds.right +
                  item.visibleWidth /
                  2 +
                  2,

                cy:
                  centerY
              },

              {
                cx:
                  bounds.left -
                  item.visibleWidth /
                  2 -
                  2,

                cy:
                  centerY
              },

              {
                cx:
                  centerX,

                cy:
                  bounds.bottom +
                  item.visibleHeight /
                  2 +
                  2
              },

              {
                cx:
                  centerX,

                cy:
                  bounds.top -
                  item.visibleHeight /
                  2 -
                  2
              }

            ];


            for (
              const candidate of
              shuffle(
                candidates
              )
            ) {

              const x =
                candidate.cx -
                (
                  item.visibleLeft +
                  item.visibleWidth /
                  2
                );


              const y =
                candidate.cy -
                (
                  item.visibleTop +
                  item.visibleHeight /
                  2
                );


              const collision =
                collisionBoxAt(
                  item,
                  x,
                  y
                );


              const hit =
                placed.some(
                  other =>
                    boxesOverlap(
                      collision,
                      other.collision,
                      .5
                    )
                );


              if (
                !hit
              ) {

                winner = {
                  x,
                  y,
                  collision
                };

                break;

              }

            }

          }



          if (
            winner
          ) {

            placed.push({

              ...item,

              x:
                winner.x,

              y:
                winner.y,

              collision:
                winner.collision

            });

          }

        }
      );



      /* ===================================================
         COMPACT THE MASS

         Pull items inward repeatedly.

         Multiple directions are tested, which is much
         better at filling valleys than only moving toward
         the exact center.
         =================================================== */

      for (
        let pass = 0;
        pass < 180;
        pass++
      ) {

        const bounds =
          getBounds(
            placed.map(
              item =>
                item.collision
            )
          );


        const globalX =
          (
            bounds.left +
            bounds.right
          )
          /
          2;


        const globalY =
          (
            bounds.top +
            bounds.bottom
          )
          /
          2;



        shuffle(
          placed
        ).forEach(
          item => {

            const cx =
              (
                item.collision.left +
                item.collision.right
              )
              /
              2;


            const cy =
              (
                item.collision.top +
                item.collision.bottom
              )
              /
              2;



            const relatives =
              placed
                .filter(
                  other =>
                    other !== item &&
                    other.category ===
                    item.category
                );


            let categoryX =
              globalX;


            let categoryY =
              globalY;


            if (
              relatives.length
            ) {

              let nearest =
                null;


              let nearestDistance =
                Infinity;


              relatives.forEach(
                other => {

                  const ox =
                    (
                      other.collision.left +
                      other.collision.right
                    )
                    /
                    2;


                  const oy =
                    (
                      other.collision.top +
                      other.collision.bottom
                    )
                    /
                    2;


                  const d =
                    Math.hypot(
                      cx - ox,
                      cy - oy
                    );


                  if (
                    d <
                    nearestDistance
                  ) {

                    nearestDistance =
                      d;


                    nearest = {
                      x: ox,
                      y: oy
                    };

                  }

                }
              );


              if (
                nearest
              ) {

                categoryX =
                  nearest.x;


                categoryY =
                  nearest.y;

              }

            }



            const targetX =
              globalX *
              .74 +
              categoryX *
              .26;


            const targetY =
              globalY *
              .74 +
              categoryY *
              .26;



            const dx =
              targetX -
              cx;


            const dy =
              targetY -
              cy;


            const distance =
              Math.hypot(
                dx,
                dy
              );


            if (
              distance <
              1
            ) {
              return;
            }



            /*
              Also test slightly rotated movement vectors.

              This allows drawings to slide around blockers
              and fall into holes instead of getting stuck.
            */

            const baseAngle =
              Math.atan2(
                dy,
                dx
              );


            const angles = [

              baseAngle,

              baseAngle + .16,

              baseAngle - .16,

              baseAngle + .32,

              baseAngle - .32

            ];


            const steps = [
              8,
              5,
              3,
              1.5
            ];


            let moved =
              false;


            for (
              const step of steps
            ) {

              if (
                moved
              ) {
                break;
              }


              for (
                const angle of angles
              ) {

                const nextX =
                  item.x +
                  Math.cos(
                    angle
                  )
                  *
                  step;


                const nextY =
                  item.y +
                  Math.sin(
                    angle
                  )
                  *
                  step;


                const collision =
                  collisionBoxAt(
                    item,
                    nextX,
                    nextY
                  );


                const hit =
                  placed.some(
                    other => {

                      if (
                        other === item
                      ) {
                        return false;
                      }


                      return boxesOverlap(
                        collision,
                        other.collision,
                        .1
                      );

                    }
                  );


                if (
                  !hit
                ) {

                  item.x =
                    nextX;


                  item.y =
                    nextY;


                  item.collision =
                    collision;


                  moved =
                    true;


                  break;

                }

              }

            }

          }
        );

      }



      /* ===================================================
         CROP TO FINAL CONTENT
         =================================================== */

      const bounds =
        getBounds(
          placed.map(
            item =>
              item.collision
          )
        );


      const padding =
        38;


      placed.forEach(
        item => {

          item.x -=
            bounds.left -
            padding;


          item.y -=
            bounds.top -
            padding;

        }
      );


      return {

        width:
          (
            bounds.right -
            bounds.left
          )
          +
          padding *
          2,

        height:
          (
            bounds.bottom -
            bounds.top
          )
          +
          padding *
          2,

        items:
          placed

      };

    }



    /* =====================================================
       DRAW ELEMENT
       ===================================================== */

    function createDrawing(
      item
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "drawing";


      wrapper.style.left =
        `${item.x}px`;


      wrapper.style.top =
        `${item.y}px`;


      wrapper.style.width =
        `${item.displayWidth}px`;


      wrapper.style.height =
        `${item.displayHeight}px`;



      const image =
        document.createElement(
          "img"
        );


      image.className =
        "drawing-art";


      image.src =
        item.filename;


      image.alt =
        "";


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.draggable =
        false;


      image.style.transform =
        `rotate(${item.rotation}deg)`;


      wrapper.appendChild(
        image
      );


      return wrapper;

    }



    /* =====================================================
       BUILD
       ===================================================== */

    let paperWidth =
      0;


    let paperHeight =
      0;



    async function buildSketchbook() {

      field.innerHTML =
        "";


      const loaded =
        (
          await Promise.all(
            files.map(
              loadImageData
            )
          )
        )
        .filter(Boolean);


      if (
        !loaded.length
      ) {
        return;
      }



      const linear =
        loaded
          .map(
            item =>
              Math.sqrt(
                item.width *
                item.height
              )
          )
          .sort(
            (a, b) =>
              a - b
          );


      const middle =
        Math.floor(
          linear.length /
          2
        );


      const referenceLinear =
        linear.length %
        2

          ? linear[
              middle
            ]

          : (
              linear[
                middle - 1
              ]
              +
              linear[
                middle
              ]
            )
            /
            2;



      const prepared =
        loaded.map(
          item =>
            prepareDrawing(
              item,
              referenceLinear
            )
        );


      const layout =
        packDrawings(
          prepared
        );


      paperWidth =
        layout.width;


      paperHeight =
        layout.height;


      paper.style.width =
        `${paperWidth}px`;


      paper.style.height =
        `${paperHeight}px`;



      layout.items.forEach(
        item => {

          field.appendChild(
            createDrawing(
              item
            )
          );

        }
      );


      setInitialView();

    }



    /* =====================================================
       VIEW
       ===================================================== */

    const view = {

      x: 0,
      y: 0,

      zoom: 1,

      minZoom: .1,
      maxZoom: 4,

      startX: 0,
      startY: 0,

      originX: 0,
      originY: 0,

      dragging: false

    };



    function constrainPan(
      x,
      y,
      zoom
    ) {

      const scaledWidth =
        paperWidth *
        zoom;


      const scaledHeight =
        paperHeight *
        zoom;


      const viewportWidth =
        viewport.clientWidth;


      const viewportHeight =
        viewport.clientHeight;



      let minX;
      let maxX;
      let minY;
      let maxY;



      if (
        scaledWidth <=
        viewportWidth
      ) {

        minX =
          maxX =
          (
            viewportWidth -
            scaledWidth
          )
          /
          2;

      }

      else {

        minX =
          viewportWidth -
          scaledWidth;

        maxX =
          0;

      }



      if (
        scaledHeight <=
        viewportHeight
      ) {

        minY =
          maxY =
          (
            viewportHeight -
            scaledHeight
          )
          /
          2;

      }

      else {

        minY =
          viewportHeight -
          scaledHeight;

        maxY =
          0;

      }


      return {

        x:
          clamp(
            x,
            minX,
            maxX
          ),

        y:
          clamp(
            y,
            minY,
            maxY
          )

      };

    }



    function updateZoomButtons() {

      const threshold =
        .0005;


      zoomOutButton.classList.toggle(

        "is-hidden",

        view.zoom <=
        view.minZoom +
        threshold

      );


      zoomInButton.classList.toggle(

        "is-hidden",

        view.zoom >=
        view.maxZoom -
        threshold

      );

    }



    function applyView() {

      paper.style.transform =
        `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.zoom})`;


      updateZoomButtons();

    }



    function setView(
      x,
      y,
      zoom
    ) {

      view.zoom =
        clamp(
          zoom,
          view.minZoom,
          view.maxZoom
        );


      const position =
        constrainPan(
          x,
          y,
          view.zoom
        );


      view.x =
        position.x;


      view.y =
        position.y;


      applyView();

    }



    /* =====================================================
       INITIAL ZOOM

       Full spread remains minimum zoom.

       Start noticeably closer.
       ===================================================== */

    function setInitialView() {

      const margin =
        12;


      const fitX =
        (
          viewport.clientWidth -
          margin *
          2
        )
        /
        paperWidth;


      const fitY =
        (
          viewport.clientHeight -
          margin *
          2
        )
        /
        paperHeight;


      const fitZoom =
        Math.min(
          fitX,
          fitY
        );


      view.minZoom =
        fitZoom;


      view.maxZoom =
        Math.max(
          fitZoom *
          5,
          2.7
        );


      /*
        Starts significantly zoomed in.
      */

      const initialZoom =
        Math.min(
          fitZoom *
          1.55,
          view.maxZoom
        );


      const width =
        paperWidth *
        initialZoom;


      const height =
        paperHeight *
        initialZoom;


      setView(

        (
          viewport.clientWidth -
          width
        )
        /
        2,

        (
          viewport.clientHeight -
          height
        )
        /
        2,

        initialZoom

      );

    }



    /* =====================================================
       ZOOM
       ===================================================== */

    function zoomAt(
      x,
      y,
      targetZoom
    ) {

      const worldX =
        (
          x -
          view.x
        )
        /
        view.zoom;


      const worldY =
        (
          y -
          view.y
        )
        /
        view.zoom;


      const zoom =
        clamp(
          targetZoom,
          view.minZoom,
          view.maxZoom
        );


      setView(

        x -
        worldX *
        zoom,

        y -
        worldY *
        zoom,

        zoom

      );

    }



    function zoomCenter(
      factor
    ) {

      zoomAt(

        viewport.clientWidth /
        2,

        viewport.clientHeight /
        2,

        view.zoom *
        factor

      );

    }



    zoomInButton.addEventListener(
      "click",
      () => {

        zoomCenter(
          1.24
        );

      }
    );


    zoomOutButton.addEventListener(
      "click",
      () => {

        zoomCenter(
          1 /
          1.24
        );

      }
    );



    viewport.addEventListener(
      "wheel",
      event => {

        event.preventDefault();


        const rect =
          viewport.getBoundingClientRect();


        const x =
          event.clientX -
          rect.left;


        const y =
          event.clientY -
          rect.top;


        const factor =
          Math.exp(
            -event.deltaY *
            .00145
          );


        zoomAt(
          x,
          y,
          view.zoom *
          factor
        );

      },
      {
        passive: false
      }
    );



    /* =====================================================
       DRAG
       ===================================================== */

    viewport.addEventListener(
      "pointerdown",
      event => {

        if (
          event.target.closest(
            ".zoom-controls"
          )
        ) {
          return;
        }


        view.dragging =
          true;


        view.startX =
          event.clientX;


        view.startY =
          event.clientY;


        view.originX =
          view.x;


        view.originY =
          view.y;


        viewport.classList.add(
          "is-dragging"
        );


        viewport.setPointerCapture(
          event.pointerId
        );

      }
    );


    viewport.addEventListener(
      "pointermove",
      event => {

        if (
          !view.dragging
        ) {
          return;
        }


        setView(

          view.originX +
          event.clientX -
          view.startX,

          view.originY +
          event.clientY -
          view.startY,

          view.zoom

        );

      }
    );


    function finishDrag() {

      view.dragging =
        false;


      viewport.classList.remove(
        "is-dragging"
      );

    }


    viewport.addEventListener(
      "pointerup",
      finishDrag
    );


    viewport.addEventListener(
      "pointercancel",
      finishDrag
    );



    /* =====================================================
       RESIZE
       ===================================================== */

    let resizeTimer =
      null;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          window.setTimeout(
            buildSketchbook,
            180
          );

      }
    );



    /* =====================================================
       START
       ===================================================== */

    buildSketchbook();

  })();
  </script>

</body>
</html>
