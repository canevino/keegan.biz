  <script>
  (() => {

    "use strict";

    /* =====================================================

      "group-02.webp",
      "group-03.webp",

      "house-1.webp",

      "house-03.webp",
      "house-04.webp",
      "house-5.webp",
      "house-6.webp",

      "house-08.webp",

      "insect-01.webp",

      "kitchen-01.webp",
      "kitchen-02.webp",
      "kitchen-03.webp",
      "kitchen-04.webp",
      "kitchen-05.webp",
      "kitchen-06.webp",

      "misc-01.webp",

      "multiple-01.webp",
      "multiple-02.webp",
      "multiple-03.webp",
      "multiple-04.webp",
      "multiple-05.webp",

      "music-01.webp",
      "music-02.webp",
      "music-03.webp",
      "music-04.webp",

      "nature-01.webp",

      "object-1.webp",
      "object-2.webp",
      "object-03.webp",
      "object-04.webp",
      "object-05.webp",

      "perspective-01.webp",

      "vehicle-01.webp",
      "vehicle-02.webp",
      "vehicle-03.webp"

    ];



    /* =====================================================
       ELEMENTS
       ===================================================== */

    const viewport =
      document.getElementById("sketchbook-viewport");

    const paper =
      document.getElementById("sketchbook-paper");

    const field =
      document.getElementById("sketchbook-field");

    const zoomInButton =
      document.getElementById("zoom-in");

    const zoomOutButton =
      document.getElementById("zoom-out");

    if (
      !viewport ||
      !paper ||
      !field ||
      !zoomInButton ||
      !zoomOutButton
    ) {
      return;
    }



    /* =====================================================
       HELPERS
       ===================================================== */

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function shuffle(array) {
      const copy = [...array];

      for (let i = copy.length - 1; i > 0; i--) {
        const j =
          Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    function categoryFromFilename(filename) {
      let category =
        filename
          .split("-")[0]
          .toLowerCase();

      if (category === "animals") {
        category = "animal";
      }

      return category;
    }

    function boxesOverlap(a, b, gap = 0) {
      return !(
        a.right + gap <= b.left ||
        a.left >= b.right + gap ||
        a.bottom + gap <= b.top ||
        a.top >= b.bottom + gap
      );
    }

    function getBounds(boxes) {
      if (!boxes.length) {
        return {
          left: 0,
          top: 0,
          right: 0,
          bottom: 0,
          width: 0,
          height: 0
        };
      }

      const left =
        Math.min(...boxes.map(box => box.left));

      const top =
        Math.min(...boxes.map(box => box.top));

      const right =
        Math.max(...boxes.map(box => box.right));

      const bottom =
        Math.max(...boxes.map(box => box.bottom));

      return {
        left,
        top,
        right,
        bottom,
        width: right - left,
        height: bottom - top
      };
    }



    /* =====================================================
       VISIBLE BOUNDS
       ===================================================== */

    function analyzeVisibleBounds(image) {
      const SAMPLE_LIMIT = 120;

      const scale =
        Math.min(
          1,
          SAMPLE_LIMIT /
          Math.max(
            image.naturalWidth,
            image.naturalHeight
          )
        );

      const width =
        Math.max(
          1,
          Math.round(image.naturalWidth * scale)
        );

      const height =
        Math.max(
          1,
          Math.round(image.naturalHeight * scale)
        );

      const canvas =
        document.createElement("canvas");

      canvas.width = width;
      canvas.height = height;

      const context =
        canvas.getContext("2d", {
          willReadFrequently: true
        });

      if (!context) {
        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };
      }

      context.drawImage(
        image,
        0,
        0,
        width,
        height
      );

      let pixels;

      try {
        pixels =
          context.getImageData(
            0,
            0,
            width,
            height
          ).data;
      }

      catch (error) {
        console.warn(
          "Could not inspect image margins:",
          error
        );

        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };
      }

      const WHITE_THRESHOLD = 247;
      const ALPHA_THRESHOLD = 12;

      let minX = width;
      let minY = height;
      let maxX = -1;
      let maxY = -1;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const index =
            (y * width + x) * 4;

          const red = pixels[index];
          const green = pixels[index + 1];
          const blue = pixels[index + 2];
          const alpha = pixels[index + 3];

          if (alpha <= ALPHA_THRESHOLD) {
            continue;
          }

          const nearWhite =
            red >= WHITE_THRESHOLD &&
            green >= WHITE_THRESHOLD &&
            blue >= WHITE_THRESHOLD;

          if (nearWhite) {
            continue;
          }

          minX = Math.min(minX, x);
          minY = Math.min(minY, y);
          maxX = Math.max(maxX, x);
          maxY = Math.max(maxY, y);
        }
      }

      if (maxX < minX || maxY < minY) {
        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };
      }

      const margin = 2;

      minX =
        Math.max(0, minX - margin);

      minY =
        Math.max(0, minY - margin);

      maxX =
        Math.min(width - 1, maxX + margin);

      maxY =
        Math.min(height - 1, maxY + margin);

      return {
        left: minX / width,
        top: minY / height,
        right: (maxX + 1) / width,
        bottom: (maxY + 1) / height
      };
    }



    /* =====================================================
       LOAD IMAGES
       ===================================================== */

    function loadImageData(filename) {
      return new Promise(resolve => {
        const image = new Image();

        image.src = filename;
        image.decoding = "async";

        image.onload = () => {
          resolve({
            filename,
            category:
              categoryFromFilename(filename),
            width: image.naturalWidth,
            height: image.naturalHeight,
            area:
              image.naturalWidth *
              image.naturalHeight,
            visibleBounds:
              analyzeVisibleBounds(image)
          });
        };

        image.onerror = () => {
          console.warn(`Could not load ${filename}`);
          resolve(null);
        };
      });
    }



    /* =====================================================
       SIZE SYSTEM

       Larger file = larger displayed drawing.
       ===================================================== */

    function calculateDisplaySize(
      item,
      referenceLinear
    ) {
      const mobile =
        window.matchMedia("(max-width: 700px)").matches;

      const sourceLinear =
        Math.sqrt(item.width * item.height);

      let ratio =
        sourceLinear /
        Math.max(referenceLinear, 1);

      ratio =
        clamp(ratio, 0.45, 2.55);

      const baseLongest =
        mobile ? 98 : 138;

      let longest =
        baseLongest *
        Math.pow(ratio, 0.94);

      longest *=
        randomBetween(0.99, 1.02);

      let width;
      let height;

      if (item.width >= item.height) {
        width = longest;
        height =
          longest *
          (item.height / item.width);
      }

      else {
        height = longest;
        width =
          longest *
          (item.width / item.height);
      }

      return { width, height };
    }



    /* =====================================================
       PREPARE DRAWING
       ===================================================== */

    function prepareDrawing(
      item,
      referenceLinear
    ) {
      const size =
        calculateDisplaySize(
          item,
          referenceLinear
        );

      const rotation =
        randomBetween(-4, 4);

      const visible =
        item.visibleBounds;

      return {
        ...item,
        displayWidth: size.width,
        displayHeight: size.height,
        rotation,

        visibleLeft:
          visible.left * size.width,

        visibleTop:
          visible.top * size.height,

        visibleWidth:
          Math.max(
            4,
            (visible.right - visible.left) *
            size.width
          ),

        visibleHeight:
          Math.max(
            4,
            (visible.bottom - visible.top) *
            size.height
          )
      };
    }



    /* =====================================================
       COLLISION BOX
       ===================================================== */

    function collisionBoxAt(item, x, y) {
      const safety = 2.5;

      return {
        left:
          x + item.visibleLeft - safety,
        top:
          y + item.visibleTop - safety,
        right:
          x +
          item.visibleLeft +
          item.visibleWidth +
          safety,
        bottom:
          y +
          item.visibleTop +
          item.visibleHeight +
          safety
      };
    }



    /* =====================================================
       CREATE CANDIDATES AROUND EXISTING ITEM
       ===================================================== */

    function createCandidatesAround(
      item,
      target,
      count
    ) {
      const GAP = 3;

      const ownTest =
        collisionBoxAt(item, 0, 0);

      const ownWidth =
        ownTest.right - ownTest.left;

      const ownHeight =
        ownTest.bottom - ownTest.top;

      const ownOffsetX =
        (ownTest.left + ownTest.right) / 2;

      const ownOffsetY =
        (ownTest.top + ownTest.bottom) / 2;

      const targetWidth =
        target.collision.right -
        target.collision.left;

      const targetHeight =
        target.collision.bottom -
        target.collision.top;

      const targetCenterX =
        (
          target.collision.left +
          target.collision.right
        ) / 2;

      const targetCenterY =
        (
          target.collision.top +
          target.collision.bottom
        ) / 2;

      const halfCombinedWidth =
        targetWidth / 2 +
        ownWidth / 2 +
        GAP;

      const halfCombinedHeight =
        targetHeight / 2 +
        ownHeight / 2 +
        GAP;

      const candidates = [];

      for (let i = 0; i < count; i++) {
        const angle =
          randomBetween(0, Math.PI * 2);

        const cosine = Math.cos(angle);
        const sine = Math.sin(angle);

        const xDistance =
          halfCombinedWidth /
          Math.max(Math.abs(cosine), 0.0001);

        const yDistance =
          halfCombinedHeight /
          Math.max(Math.abs(sine), 0.0001);

        const radius =
          Math.min(xDistance, yDistance);

        const desiredCenterX =
          targetCenterX + cosine * radius;

        const desiredCenterY =
          targetCenterY + sine * radius;

        candidates.push({
          x:
            desiredCenterX - ownOffsetX,
          y:
            desiredCenterY - ownOffsetY
        });
      }

      [
        {
          x:
            targetCenterX +
            halfCombinedWidth,
          y:
            targetCenterY
        },
        {
          x:
            targetCenterX -
            halfCombinedWidth,
          y:
            targetCenterY
        },
        {
          x:
            targetCenterX,
          y:
            targetCenterY +
            halfCombinedHeight
        },
        {
          x:
            targetCenterX,
          y:
            targetCenterY -
            halfCombinedHeight
        }
      ].forEach(point => {
        candidates.push({
          x: point.x - ownOffsetX,
          y: point.y - ownOffsetY
        });
      });

      return candidates;
    }



    /* =====================================================
       PACK DRAWINGS

       Goal:
       - square / blocky spread
       - no rows
       - category proximity, but no category zones
       ===================================================== */

    function packDrawings(drawings) {
      const TARGET_ASPECT = 1.08;
      const COLLISION_GAP = 1;

      const ordered =
        [...drawings].sort(
          (a, b) =>
            (b.visibleWidth * b.visibleHeight) -
            (a.visibleWidth * a.visibleHeight)
        );

      const placed = [];

      ordered.forEach((item, index) => {
        if (index === 0) {
          const x = 0;
          const y = 0;

          placed.push({
            ...item,
            x,
            y,
            collision:
              collisionBoxAt(item, x, y)
          });

          return;
        }

        let winner = null;
        let winnerScore = Infinity;

        const related =
          shuffle(
            placed.filter(
              other =>
                other.category === item.category
            )
          );

        const unrelated =
          shuffle(
            placed.filter(
              other =>
                other.category !== item.category
            )
          );

        const targets = [
          ...related,
          ...unrelated
        ];

        targets.forEach(target => {
          const sameCategory =
            target.category === item.category;

          const candidates =
            createCandidatesAround(
              item,
              target,
              sameCategory ? 70 : 24
            );

          candidates.forEach(candidate => {
            const collision =
              collisionBoxAt(
                item,
                candidate.x,
                candidate.y
              );

            const overlaps =
              placed.some(
                other =>
                  boxesOverlap(
                    collision,
                    other.collision,
                    COLLISION_GAP
                  )
              );

            if (overlaps) {
              return;
            }

            const allBoxes = [
              ...placed.map(
                other => other.collision
              ),
              collision
            ];

            const bounds =
              getBounds(allBoxes);

            const width = bounds.width;
            const height = bounds.height;
            const area = width * height;

            const aspect =
              width / Math.max(1, height);

            const aspectPenalty =
              Math.abs(
                Math.log(
                  aspect / TARGET_ASPECT
                )
              ) * 18000;

            /*
              Very strong penalty against banner shapes.
            */
            const tooWidePenalty =
              width > height * 1.35
                ? (width - height * 1.35) * 320
                : 0;

            const tooTallPenalty =
              height > width * 1.35
                ? (height - width * 1.35) * 180
                : 0;

            /*
              Encourage using the middle of the mass.
            */
            const massCenterX =
              (bounds.left + bounds.right) / 2;

            const massCenterY =
              (bounds.top + bounds.bottom) / 2;

            const candidateCenterX =
              (collision.left + collision.right) / 2;

            const candidateCenterY =
              (collision.top + collision.bottom) / 2;

            const centerPenalty =
              Math.hypot(
                candidateCenterX - massCenterX,
                candidateCenterY - massCenterY
              ) * 24;

            /*
              Category proximity.
            */
            let categoryPenalty = 0;

            if (related.length) {
              let nearest = Infinity;

              related.forEach(relative => {
                const relativeX =
                  (
                    relative.collision.left +
                    relative.collision.right
                  ) / 2;

                const relativeY =
                  (
                    relative.collision.top +
                    relative.collision.bottom
                  ) / 2;

                nearest =
                  Math.min(
                    nearest,
                    Math.hypot(
                      candidateCenterX - relativeX,
                      candidateCenterY - relativeY
                    )
                  );
              });

              categoryPenalty =
                nearest * 40;
            }

            const categoryReward =
              sameCategory ? -4200 : 0;

            /*
              Mild reward for inward / compact growth.
            */
            const compactnessReward =
              -(Math.min(width, height) * 22);

            const score =
              area +
              aspectPenalty +
              tooWidePenalty +
              tooTallPenalty +
              centerPenalty +
              categoryPenalty +
              categoryReward +
              compactnessReward +
              Math.random() * 1100;

            if (score < winnerScore) {
              winnerScore = score;

              winner = {
                x: candidate.x,
                y: candidate.y,
                collision
              };
            }
          });
        });

        /* ------------------------------------------------
           Fallback positions:
           grow the whole cloud outward as a block,
           not as a horizontal strip.
           ------------------------------------------------ */

        if (!winner) {
          const bounds =
            getBounds(
              placed.map(
                other => other.collision
              )
            );

          const testBox =
            collisionBoxAt(item, 0, 0);

          const ownWidth =
            testBox.right - testBox.left;

          const ownHeight =
            testBox.bottom - testBox.top;

          const ownOffsetX =
            (testBox.left + testBox.right) / 2;

          const ownOffsetY =
            (testBox.top + testBox.bottom) / 2;

          const centerX =
            (bounds.left + bounds.right) / 2;

          const centerY =
            (bounds.top + bounds.bottom) / 2;

          const FALLBACK_GAP = 12;

          const fallbackPoints = shuffle([
            {
              x:
                centerX,
              y:
                bounds.bottom +
                FALLBACK_GAP +
                ownHeight / 2
            },
            {
              x:
                centerX,
              y:
                bounds.top -
                FALLBACK_GAP -
                ownHeight / 2
            },
            {
              x:
                bounds.right +
                FALLBACK_GAP +
                ownWidth / 2,
              y:
                centerY
            },
            {
              x:
                bounds.left -
                FALLBACK_GAP -
                ownWidth / 2,
              y:
                centerY
            }
          ]);

          for (const point of fallbackPoints) {
            const x =
              point.x - ownOffsetX;

            const y =
              point.y - ownOffsetY;

            const collision =
              collisionBoxAt(item, x, y);

            const overlaps =
              placed.some(
                other =>
                  boxesOverlap(
                    collision,
                    other.collision,
                    COLLISION_GAP
                  )
              );

            if (!overlaps) {
              winner = {
                x,
                y,
                collision
              };

              break;
            }
          }
        }

        if (!winner) {
          const bounds =
            getBounds(
              placed.map(
                other => other.collision
              )
            );

          const x = bounds.right + 50;
          const y = bounds.bottom + 50;

          winner = {
            x,
            y,
            collision:
              collisionBoxAt(item, x, y)
          };
        }

        placed.push({
          ...item,
          x: winner.x,
          y: winner.y,
          collision: winner.collision
        });
      });



      /* ===================================================
         COMPACTION

         Pull inward repeatedly so the composition becomes
         a dense spread instead of separated islands.
         =================================================== */

      for (let pass = 0; pass < 280; pass++) {
        const overallBounds =
          getBounds(
            placed.map(item => item.collision)
          );

        const overallCenterX =
          (
            overallBounds.left +
            overallBounds.right
          ) / 2;

        const overallCenterY =
          (
            overallBounds.top +
            overallBounds.bottom
          ) / 2;

        const passItems =
          shuffle(placed);

        passItems.forEach(item => {
          const itemCenterX =
            (
              item.collision.left +
              item.collision.right
            ) / 2;

          const itemCenterY =
            (
              item.collision.top +
              item.collision.bottom
            ) / 2;

          const relatives =
            placed.filter(
              other =>
                other !== item &&
                other.category === item.category
            );

          let targetX = overallCenterX;
          let targetY = overallCenterY;

          if (relatives.length) {
            let closest = null;
            let closestDistance = Infinity;

            relatives.forEach(relative => {
              const x =
                (
                  relative.collision.left +
                  relative.collision.right
                ) / 2;

              const y =
                (
                  relative.collision.top +
                  relative.collision.bottom
                ) / 2;

              const distance =
                Math.hypot(
                  itemCenterX - x,
                  itemCenterY - y
                );

              if (distance < closestDistance) {
                closestDistance = distance;
                closest = { x, y };
              }
            });

            if (closest) {
              targetX =
                overallCenterX * 0.82 +
                closest.x * 0.18;

              targetY =
                overallCenterY * 0.82 +
                closest.y * 0.18;
            }
          }

          const dx =
            targetX - itemCenterX;

          const dy =
            targetY - itemCenterY;

          const distance =
            Math.hypot(dx, dy);

          if (distance < 0.25) {
            return;
          }

          const baseAngle =
            Math.atan2(dy, dx);

          const angles = [
            baseAngle,
            baseAngle + 0.16,
            baseAngle - 0.16,
            baseAngle + 0.33,
            baseAngle - 0.33,
            baseAngle + 0.6,
            baseAngle - 0.6
          ];

          const steps = [
            11,
            7,
            4,
            2,
            1,
            0.5
          ];

          let moved = false;

          for (const step of steps) {
            if (moved) {
              break;
            }

            for (const angle of angles) {
              const nextX =
                item.x +
                Math.cos(angle) * step;

              const nextY =
                item.y +
                Math.sin(angle) * step;

              const collision =
                collisionBoxAt(
                  item,
                  nextX,
                  nextY
                );

              const overlaps =
                placed.some(other => {
                  if (other === item) {
                    return false;
                  }

                  return boxesOverlap(
                    collision,
                    other.collision,
                    0.1
                  );
                });

              if (overlaps) {
                continue;
              }

              item.x = nextX;
              item.y = nextY;
              item.collision = collision;
              moved = true;
              break;
            }
          }
        });
      }



      /* ===================================================
         FINAL CROP
         =================================================== */

      const finalBounds =
        getBounds(
          placed.map(
            item => item.collision
          )
        );

      const PAPER_PADDING = 42;

      placed.forEach(item => {
        item.x -=
          finalBounds.left - PAPER_PADDING;

        item.y -=
          finalBounds.top - PAPER_PADDING;
      });

      return {
        width:
          finalBounds.width +
          PAPER_PADDING * 2,

        height:
          finalBounds.height +
          PAPER_PADDING * 2,

        items: placed
      };
    }



    /* =====================================================
       CREATE DOM ELEMENT
       ===================================================== */

    function createDrawingElement(item) {
      const wrapper =
        document.createElement("div");

      wrapper.className = "drawing";
      wrapper.style.left = `${item.x}px`;
      wrapper.style.top = `${item.y}px`;
      wrapper.style.width = `${item.displayWidth}px`;
      wrapper.style.height = `${item.displayHeight}px`;

      const image =
        document.createElement("img");

      image.className = "drawing-art";
      image.src = item.filename;
      image.alt = "";
      image.loading = "lazy";
      image.decoding = "async";
      image.draggable = false;
      image.style.transform =
        `rotate(${item.rotation}deg)`;

      wrapper.appendChild(image);

      return wrapper;
    }



    /* =====================================================
       BUILD
       ===================================================== */

    let paperWidth = 1;
    let paperHeight = 1;
    let buildGeneration = 0;

    async function buildSketchbook() {
      const generation =
        ++buildGeneration;

      field.innerHTML = "";

      const loaded =
        (
          await Promise.all(
            files.map(loadImageData)
          )
        ).filter(Boolean);

      if (
        generation !== buildGeneration
      ) {
        return;
      }

      if (!loaded.length) {
        console.warn(
          "No illustration files loaded."
        );
        return;
      }

      console.info(
        `Loaded ${loaded.length} of ${files.length} illustration files.`
      );

      const linearSizes =
        loaded
          .map(
            item =>
              Math.sqrt(
                item.width * item.height
              )
          )
          .sort((a, b) => a - b);

      const midpoint =
        Math.floor(
          linearSizes.length / 2
        );

      const referenceLinear =
        linearSizes.length % 2
          ? linearSizes[midpoint]
          : (
              linearSizes[midpoint - 1] +
              linearSizes[midpoint]
            ) / 2;

      const prepared =
        loaded.map(item =>
          prepareDrawing(
            item,
            referenceLinear
          )
        );

      const layout =
        packDrawings(prepared);

      if (
        generation !== buildGeneration
      ) {
        return;
      }

      if (
        layout.items.length !== loaded.length
      ) {
        console.error(
          `Packing error: loaded ${loaded.length}, placed ${layout.items.length}.`
        );
      }

      paperWidth =
        Math.max(1, layout.width);

      paperHeight =
        Math.max(1, layout.height);

      paper.style.width =
        `${paperWidth}px`;

      paper.style.height =
        `${paperHeight}px`;

      const fragment =
        document.createDocumentFragment();

      layout.items.forEach(item => {
        fragment.appendChild(
          createDrawingElement(item)
        );
      });

      field.appendChild(fragment);

      setInitialView();
    }



    /* =====================================================
       VIEW STATE
       ===================================================== */

    const view = {
      x: 0,
      y: 0,
      zoom: 1,
      minZoom: 0.1,
      maxZoom: 4,
      dragging: false,
      startX: 0,
      startY: 0,
      originX: 0,
      originY: 0
    };



    /* =====================================================
       VIEW HELPERS
       ===================================================== */

    function constrainPan(x, y, zoom) {
      const scaledWidth =
        paperWidth * zoom;

      const scaledHeight =
        paperHeight * zoom;

      const viewportWidth =
        viewport.clientWidth;

      const viewportHeight =
        viewport.clientHeight;

      let minX;
      let maxX;
      let minY;
      let maxY;

      if (scaledWidth <= viewportWidth) {
        minX =
          maxX =
          (viewportWidth - scaledWidth) / 2;
      }

      else {
        minX =
          viewportWidth - scaledWidth;
        maxX = 0;
      }

      if (scaledHeight <= viewportHeight) {
        minY =
          maxY =
          (viewportHeight - scaledHeight) / 2;
      }

      else {
        minY =
          viewportHeight - scaledHeight;
        maxY = 0;
      }

      return {
        x: clamp(x, minX, maxX),
        y: clamp(y, minY, maxY)
      };
    }

    function updateZoomButtonState() {
      const epsilon = 0.0005;

      zoomOutButton.classList.toggle(
        "is-hidden",
        view.zoom <= view.minZoom + epsilon
      );

      zoomInButton.classList.toggle(
        "is-hidden",
        view.zoom >= view.maxZoom - epsilon
      );
    }

    function applyView() {
      paper.style.transform =
        `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.zoom})`;

      updateZoomButtonState();
    }

    function setView(x, y, zoom) {
      view.zoom =
        clamp(
          zoom,
          view.minZoom,
          view.maxZoom
        );

      const constrained =
        constrainPan(
          x,
          y,
          view.zoom
        );

      view.x = constrained.x;
      view.y = constrained.y;

      applyView();
    }



    /* =====================================================
       INITIAL VIEW

       Starts clearly zoomed in.
       ===================================================== */

    function setInitialView() {
      const OUTER_MARGIN = 14;

      const fitWidth =
        (
          viewport.clientWidth -
          OUTER_MARGIN * 2
        ) / paperWidth;

      const fitHeight =
        (
          viewport.clientHeight -
          OUTER_MARGIN * 2
        ) / paperHeight;

      const fitZoom =
        Math.min(fitWidth, fitHeight);

      view.minZoom = fitZoom;

      view.maxZoom =
        Math.max(
          fitZoom * 6.2,
          3.2
        );

      /*
        Start more zoomed in than before.
      */
      const initialZoom =
        Math.min(
          fitZoom * 2.15,
          view.maxZoom
        );

      const scaledWidth =
        paperWidth * initialZoom;

      const scaledHeight =
        paperHeight * initialZoom;

      setView(
        (viewport.clientWidth - scaledWidth) / 2,
        (viewport.clientHeight - scaledHeight) / 2,
        initialZoom
      );
    }



    /* =====================================================
       ZOOM
       ===================================================== */

    function zoomAt(
      screenX,
      screenY,
      nextZoom
    ) {
      const worldX =
        (screenX - view.x) / view.zoom;

      const worldY =
        (screenY - view.y) / view.zoom;

      const zoom =
        clamp(
          nextZoom,
          view.minZoom,
          view.maxZoom
        );

      const nextX =
        screenX - worldX * zoom;

      const nextY =
        screenY - worldY * zoom;

      setView(
        nextX,
        nextY,
        zoom
      );
    }

    function zoomAroundCenter(factor) {
      zoomAt(
        viewport.clientWidth / 2,
        viewport.clientHeight / 2,
        view.zoom * factor
      );
    }

    zoomInButton.addEventListener(
      "click",
      () => {
        zoomAroundCenter(1.22);
      }
    );

    zoomOutButton.addEventListener(
      "click",
      () => {
        zoomAroundCenter(1 / 1.22);
      }
    );

    viewport.addEventListener(
      "wheel",
      event => {
        event.preventDefault();

        const rect =
          viewport.getBoundingClientRect();

        const screenX =
          event.clientX - rect.left;

        const screenY =
          event.clientY - rect.top;

        const factor =
          Math.exp(-event.deltaY * 0.00135);

        zoomAt(
          screenX,
          screenY,
          view.zoom * factor
        );
      },
      {
        passive: false
      }
    );



    /* =====================================================
       DRAG
       ===================================================== */

    viewport.addEventListener(
      "pointerdown",
      event => {
        if (
          event.target.closest(".zoom-controls")
        ) {
          return;
        }

        view.dragging = true;
        view.startX = event.clientX;
        view.startY = event.clientY;
        view.originX = view.x;
        view.originY = view.y;

        viewport.classList.add("is-dragging");

        try {
          viewport.setPointerCapture(event.pointerId);
        }

        catch {
          /* no-op */
        }
      }
    );

    viewport.addEventListener(
      "pointermove",
      event => {
        if (!view.dragging) {
          return;
        }

        const dx =
          event.clientX - view.startX;

        const dy =
          event.clientY - view.startY;

        setView(
          view.originX + dx,
          view.originY + dy,
          view.zoom
        );
      }
    );

    function finishDrag() {
      view.dragging = false;
      viewport.classList.remove("is-dragging");
    }

    viewport.addEventListener(
      "pointerup",
      finishDrag
    );

    viewport.addEventListener(
      "pointercancel",
      finishDrag
    );

    window.addEventListener(
      "blur",
      finishDrag
    );



    /* =====================================================
       RESIZE
       ===================================================== */

    let resizeTimer = null;

    window.addEventListener(
      "resize",
      () => {
        clearTimeout(resizeTimer);

        resizeTimer =
          window.setTimeout(() => {
            buildSketchbook();
          }, 200);
      }
    );



    /* =====================================================
       START
       ===================================================== */

    buildSketchbook();

  })();
  </script>

</body>
</html>
