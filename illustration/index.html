    /* =====================================================
       DEVICE MODE
       ===================================================== */

    function isMobileLayout() {

      return window.matchMedia(
        "(max-width: 700px)"
      ).matches;

    }


    let currentMobileMode =
      isMobileLayout();



    /* =====================================================
       YIELD
       ===================================================== */

    function yieldToBrowser() {

      return new Promise(
        resolve => {

          requestAnimationFrame(
            () => {

              requestAnimationFrame(
                resolve
              );

            }
          );

        }
      );

    }



    /* =====================================================
       STABLE RANDOM
       ===================================================== */

    let randomState =
      0x8f31a7c9;


    function resetRandom() {

      randomState =
        0x8f31a7c9;

    }


    function random() {

      randomState |=
        0;


      randomState =
        randomState +
        0x6D2B79F5 |
        0;


      let t =
        randomState;


      t =
        Math.imul(
          t ^
          t >>> 15,
          t |
          1
        );


      t ^=
        t +
        Math.imul(
          t ^
          t >>> 7,
          t |
          61
        );


      return (
        (
          t ^
          t >>> 14
        )
        >>>
        0
      )
      /
      4294967296;

    }



    /* =====================================================
       HELPERS
       ===================================================== */

    function clamp(
      value,
      min,
      max
    ) {

      return Math.min(
        Math.max(
          value,
          min
        ),
        max
      );

    }



    function randomBetween(
      min,
      max
    ) {

      return (
        min +
        random() *
        (
          max -
          min
        )
      );

    }



    function shuffle(
      array
    ) {

      const copy =
        [...array];


      for (
        let i =
          copy.length -
          1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            random() *
            (
              i +
              1
            )
          );


        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }


      return copy;

    }



    function categoryFromFilename(
      filename
    ) {

      let category =
        filename
          .split("-")[0]
          .toLowerCase();


      if (
        category ===
        "animals"
      ) {

        category =
          "animal";

      }


      return category;

    }



    function boxesOverlap(
      a,
      b,
      gap = 0
    ) {

      return !(
        a.right + gap <= b.left ||
        a.left >= b.right + gap ||
        a.bottom + gap <= b.top ||
        a.top >= b.bottom + gap
      );

    }



    function getBounds(
      boxes
    ) {

      if (
        !boxes.length
      ) {

        return {
          left: 0,
          top: 0,
          right: 0,
          bottom: 0,
          width: 0,
          height: 0
        };

      }


      const left =
        Math.min(
          ...boxes.map(
            box =>
              box.left
          )
        );


      const top =
        Math.min(
          ...boxes.map(
            box =>
              box.top
          )
        );


      const right =
        Math.max(
          ...boxes.map(
            box =>
              box.right
          )
        );


      const bottom =
        Math.max(
          ...boxes.map(
            box =>
              box.bottom
          )
        );


      return {

        left,
        top,
        right,
        bottom,

        width:
          right -
          left,

        height:
          bottom -
          top

      };

    }



    function getItemCenter(
      item
    ) {

      return {

        x:
          (
            item.collision.left +
            item.collision.right
          )
          /
          2,

        y:
          (
            item.collision.top +
            item.collision.bottom
          )
          /
          2

      };

    }



    /* =====================================================
       VISIBLE BOUNDS CACHE
       ===================================================== */

    const boundsCache =
      new Map();



    /* =====================================================
       VISIBLE ART ANALYSIS
       ===================================================== */

    function analyzeVisibleBounds(
      image,
      filename
    ) {

      if (
        boundsCache.has(
          filename
        )
      ) {

        return boundsCache.get(
          filename
        );

      }


      const mobile =
        isMobileLayout();


      const SAMPLE_LIMIT =
        mobile
          ? 64
          : 110;


      const scale =
        Math.min(
          1,
          SAMPLE_LIMIT /
          Math.max(
            image.naturalWidth,
            image.naturalHeight
          )
        );


      const width =
        Math.max(
          1,
          Math.round(
            image.naturalWidth *
            scale
          )
        );


      const height =
        Math.max(
          1,
          Math.round(
            image.naturalHeight *
            scale
          )
        );


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        width;


      canvas.height =
        height;


      const context =
        canvas.getContext(
          "2d",
          {
            willReadFrequently:
              true,
            alpha:
              true
          }
        );


      if (
        !context
      ) {

        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };

      }


      context.drawImage(
        image,
        0,
        0,
        width,
        height
      );


      let pixels;


      try {

        pixels =
          context.getImageData(
            0,
            0,
            width,
            height
          ).data;

      }

      catch {

        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };

      }


      const WHITE_THRESHOLD =
        248;


      const ALPHA_THRESHOLD =
        10;


      let minX =
        width;


      let minY =
        height;


      let maxX =
        -1;


      let maxY =
        -1;


      const step =
        mobile
          ? 2
          : 1;


      for (
        let y =
          0;
        y <
        height;
        y +=
        step
      ) {

        for (
          let x =
            0;
          x <
          width;
          x +=
          step
        ) {

          const index =
            (
              y *
              width +
              x
            )
            *
            4;


          const red =
            pixels[
              index
            ];


          const green =
            pixels[
              index +
              1
            ];


          const blue =
            pixels[
              index +
              2
            ];


          const alpha =
            pixels[
              index +
              3
            ];


          if (
            alpha <=
            ALPHA_THRESHOLD
          ) {
            continue;
          }


          if (
            red >=
            WHITE_THRESHOLD &&
            green >=
            WHITE_THRESHOLD &&
            blue >=
            WHITE_THRESHOLD
          ) {
            continue;
          }


          minX =
            Math.min(
              minX,
              x
            );


          minY =
            Math.min(
              minY,
              y
            );


          maxX =
            Math.max(
              maxX,
              x
            );


          maxY =
            Math.max(
              maxY,
              y
            );

        }

      }



      let result;


      if (
        maxX <
        minX ||
        maxY <
        minY
      ) {

        result = {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };

      }

      else {

        const margin =
          2;


        minX =
          Math.max(
            0,
            minX -
            margin
          );


        minY =
          Math.max(
            0,
            minY -
            margin
          );


        maxX =
          Math.min(
            width -
            1,
            maxX +
            margin
          );


        maxY =
          Math.min(
            height -
            1,
            maxY +
            margin
          );


        result = {

          left:
            minX /
            width,

          top:
            minY /
            height,

          right:
            (
              maxX +
              1
            )
            /
            width,

          bottom:
            (
              maxY +
              1
            )
            /
            height

        };

      }


      boundsCache.set(
        filename,
        result
      );


      return result;

    }



    /* =====================================================
       IMAGE LOADING
       ===================================================== */

    function loadSingleImage(
      filename
    ) {

      return new Promise(
        resolve => {

          const image =
            new Image();


          image.decoding =
            "async";


          image.onload =
            () => {

              resolve({

                filename,

                category:
                  categoryFromFilename(
                    filename
                  ),

                width:
                  image.naturalWidth,

                height:
                  image.naturalHeight,

                visibleBounds:
                  analyzeVisibleBounds(
                    image,
                    filename
                  )

              });

            };


          image.onerror =
            () => {

              console.warn(
                `Could not load ${filename}`
              );


              resolve(
                null
              );

            };


          image.src =
            filename;

        }
      );

    }



    async function loadImagesInBatches() {

      const mobile =
        isMobileLayout();


      const batchSize =
        mobile
          ? 5
          : 12;


      const loaded =
        [];


      for (
        let i =
          0;
        i <
        files.length;
        i +=
        batchSize
      ) {

        const batch =
          files.slice(
            i,
            i +
            batchSize
          );


        const results =
          await Promise.all(
            batch.map(
              loadSingleImage
            )
          );


        results
          .filter(Boolean)
          .forEach(
            item => {

              loaded.push(
                item
              );

            }
          );


        await yieldToBrowser();

      }


      return loaded;

    }



    /* =====================================================
       DISPLAY SCALE
       ===================================================== */

    function calculateDisplaySize(
      item,
      dimensionStats
    ) {

      const mobile =
        isMobileLayout();


      const sourceLinear =
        Math.sqrt(
          item.width *
          item.height
        );


      const ratio =
        sourceLinear /
        dimensionStats.median;


      const BASE_LONGEST =
        mobile
          ? 76
          : 128;


      const MAX_LONGEST =
        mobile
          ? 132
          : 190;


      const MIN_LONGEST =
        mobile
          ? 32
          : 46;


      const longest =
        clamp(
          BASE_LONGEST *
          ratio,
          MIN_LONGEST,
          MAX_LONGEST
        );


      let width;
      let height;


      if (
        item.width >=
        item.height
      ) {

        width =
          longest;


        height =
          longest *
          (
            item.height /
            item.width
          );

      }

      else {

        height =
          longest;


        width =
          longest *
          (
            item.width /
            item.height
          );

      }


      return {
        width,
        height
      };

    }



    /* =====================================================
       PREPARE
       ===================================================== */

    function prepareDrawing(
      item,
      dimensionStats
    ) {

      const size =
        calculateDisplaySize(
          item,
          dimensionStats
        );


      const rotation =
        randomBetween(
          -5,
          5
        );


      const visible =
        item.visibleBounds;


      return {

        ...item,

        displayWidth:
          size.width,

        displayHeight:
          size.height,

        displayScale:
          Math.sqrt(
            size.width *
            size.height
          ),

        rotation,

        visibleLeft:
          visible.left *
          size.width,

        visibleTop:
          visible.top *
          size.height,

        visibleWidth:
          Math.max(
            2,
            (
              visible.right -
              visible.left
            )
            *
            size.width
          ),

        visibleHeight:
          Math.max(
            2,
            (
              visible.bottom -
              visible.top
            )
            *
            size.height
          )

      };

    }



    /* =====================================================
       COLLISION
       ===================================================== */

    function collisionBoxAt(
      item,
      x,
      y
    ) {

      const angle =
        Math.abs(
          item.rotation
        )
        *
        Math.PI /
        180;


      const rotationExpansionX =
        Math.sin(
          angle
        )
        *
        item.visibleHeight *
        .40;


      const rotationExpansionY =
        Math.sin(
          angle
        )
        *
        item.visibleWidth *
        .40;


      return {

        left:
          x +
          item.visibleLeft -
          2 -
          rotationExpansionX,

        top:
          y +
          item.visibleTop -
          2 -
          rotationExpansionY,

        right:
          x +
          item.visibleLeft +
          item.visibleWidth +
          2 +
          rotationExpansionX,

        bottom:
          y +
          item.visibleTop +
          item.visibleHeight +
          2 +
          rotationExpansionY

      };

    }



    /* =====================================================
       SIZE SIMILARITY
       ===================================================== */

    function sizeSimilarity(
      a,
      b
    ) {

      const large =
        Math.max(
          a.displayScale,
          b.displayScale
        );


      const small =
        Math.min(
          a.displayScale,
          b.displayScale
        );


      return large >
        0

        ? small /
          large

        : 1;

    }



    /* =====================================================
       CANDIDATES
       ===================================================== */

    function createCandidatesAround(
      item,
      target,
      count
    ) {

      const GAP =
        2;


      const ownBox =
        collisionBoxAt(
          item,
          0,
          0
        );


      const ownWidth =
        ownBox.right -
        ownBox.left;


      const ownHeight =
        ownBox.bottom -
        ownBox.top;


      const ownCenterOffsetX =
        (
          ownBox.left +
          ownBox.right
        )
        /
        2;


      const ownCenterOffsetY =
        (
          ownBox.top +
          ownBox.bottom
        )
        /
        2;


      const targetWidth =
        target.collision.right -
        target.collision.left;


      const targetHeight =
        target.collision.bottom -
        target.collision.top;


      const targetCenterX =
        (
          target.collision.left +
          target.collision.right
        )
        /
        2;


      const targetCenterY =
        (
          target.collision.top +
          target.collision.bottom
        )
        /
        2;


      const combinedWidth =
        targetWidth /
        2 +
        ownWidth /
        2 +
        GAP;


      const combinedHeight =
        targetHeight /
        2 +
        ownHeight /
        2 +
        GAP;


      const candidates =
        [];


      for (
        let i =
          0;
        i <
        count;
        i++
      ) {

        const angle =
          randomBetween(
            0,
            Math.PI *
            2
          );


        const cosine =
          Math.cos(
            angle
          );


        const sine =
          Math.sin(
            angle
          );


        const radiusX =
          combinedWidth /
          Math.max(
            Math.abs(
              cosine
            ),
            .0001
          );


        const radiusY =
          combinedHeight /
          Math.max(
            Math.abs(
              sine
            ),
            .0001
          );


        const radius =
          Math.min(
            radiusX,
            radiusY
          );


        const jitter =
          randomBetween(
            .98,
            1.07
          );


        candidates.push({

          x:
            targetCenterX +
            cosine *
            radius *
            jitter -
            ownCenterOffsetX,

          y:
            targetCenterY +
            sine *
            radius *
            jitter -
            ownCenterOffsetY

        });

      }


      return candidates;

    }



    /* =====================================================
       DENSITY
       ===================================================== */

    function getDensityScore(
      collision,
      placed
    ) {

      if (
        !placed.length
      ) {
        return 0;
      }


      const centerX =
        (
          collision.left +
          collision.right
        )
        /
        2;


      const centerY =
        (
          collision.top +
          collision.bottom
        )
        /
        2;


      const distances =
        placed
          .map(
            item => {

              const center =
                getItemCenter(
                  item
                );


              return Math.hypot(
                centerX -
                center.x,
                centerY -
                center.y
              );

            }
          )
          .sort(
            (
              a,
              b
            ) =>
              a -
              b
          );


      const nearest =
        distances.slice(
          0,
          Math.min(
            3,
            distances.length
          )
        );


      return nearest.reduce(
        (
          sum,
          value
        ) =>
          sum +
          value,
        0
      )
      /
      nearest.length;

    }



    /* =====================================================
       STAGGER OUTER EDGE

       Breaks the clean rectangle created by compaction.

       Only drawings already near the outer boundary are
       considered.

       They move predominantly OUTWARD, at different amounts,
       with a small tangential shift.

       Every proposed move is collision checked.
       ===================================================== */

    function staggerOuterEdge(
      placed
    ) {

      const mobile =
        isMobileLayout();


      const passes =
        mobile
          ? 1
          : 2;


      for (
        let pass =
          0;
        pass <
        passes;
        pass++
      ) {

        const bounds =
          getBounds(
            placed.map(
              item =>
                item.collision
            )
          );


        const edgeBandX =
          Math.max(
            35,
            bounds.width *
            .12
          );


        const edgeBandY =
          Math.max(
            35,
            bounds.height *
            .12
          );


        shuffle(
          placed
        ).forEach(
          item => {

            const collision =
              item.collision;


            const center =
              getItemCenter(
                item
              );


            const distanceLeft =
              center.x -
              bounds.left;


            const distanceRight =
              bounds.right -
              center.x;


            const distanceTop =
              center.y -
              bounds.top;


            const distanceBottom =
              bounds.bottom -
              center.y;


            const edges =
              [];


            if (
              distanceLeft <
              edgeBandX
            ) {

              edges.push(
                "left"
              );

            }


            if (
              distanceRight <
              edgeBandX
            ) {

              edges.push(
                "right"
              );

            }


            if (
              distanceTop <
              edgeBandY
            ) {

              edges.push(
                "top"
              );

            }


            if (
              distanceBottom <
              edgeBandY
            ) {

              edges.push(
                "bottom"
              );

            }


            if (
              !edges.length
            ) {
              return;
            }


            /*
              Don't move every edge item.
              Leaving some recessed is what creates the
              irregular silhouette.
            */

            if (
              random() <
              .27
            ) {
              return;
            }


            const edge =
              edges[
                Math.floor(
                  random() *
                  edges.length
                )
              ];


            /*
              Outward distances vary considerably.

              Some barely shift.
              Some visibly protrude.
            */

            const outward =
              mobile

                ? randomBetween(
                    3,
                    15
                  )

                : randomBetween(
                    4,
                    21
                  );


            const tangent =
              mobile

                ? randomBetween(
                    -5,
                    5
                  )

                : randomBetween(
                    -7,
                    7
                  );


            let nextX =
              item.x;


            let nextY =
              item.y;


            if (
              edge ===
              "left"
            ) {

              nextX -=
                outward;


              nextY +=
                tangent;

            }


            if (
              edge ===
              "right"
            ) {

              nextX +=
                outward;


              nextY +=
                tangent;

            }


            if (
              edge ===
              "top"
            ) {

              nextY -=
                outward;


              nextX +=
                tangent;

            }


            if (
              edge ===
              "bottom"
            ) {

              nextY +=
                outward;


              nextX +=
                tangent;

            }


            const nextCollision =
              collisionBoxAt(
                item,
                nextX,
                nextY
              );


            const overlaps =
              placed.some(
                other => {

                  if (
                    other ===
                    item
                  ) {
                    return false;
                  }


                  return boxesOverlap(
                    nextCollision,
                    other.collision,
                    .1
                  );

                }
              );


            if (
              overlaps
            ) {
              return;
            }


            item.x =
              nextX;


            item.y =
              nextY;


            item.collision =
              nextCollision;

          }
        );

      }

    }



    /* =====================================================
       PACKING
       ===================================================== */

    function packDrawings(
      drawings
    ) {

      const mobile =
        isMobileLayout();


      const TARGET_ASPECT =
        1;


      const COLLISION_GAP =
        .5;


      const MAX_TARGETS =
        mobile
          ? 12
          : 24;


      const COMPACTION_PASSES =
        mobile
          ? 65
          : 180;



      const sorted =
        [...drawings]
          .sort(
            (
              a,
              b
            ) =>
              b.displayScale -
              a.displayScale
          );


      const ordered =
        [];


      const BAND_SIZE =
        mobile
          ? 6
          : 8;


      for (
        let i =
          0;
        i <
        sorted.length;
        i +=
        BAND_SIZE
      ) {

        ordered.push(
          ...shuffle(
            sorted.slice(
              i,
              i +
              BAND_SIZE
            )
          )
        );

      }


      const placed =
        [];



      ordered.forEach(
        (
          item,
          index
        ) => {

          if (
            index ===
            0
          ) {

            placed.push({

              ...item,

              x:
                0,

              y:
                0,

              collision:
                collisionBoxAt(
                  item,
                  0,
                  0
                )

            });


            return;

          }



          let winner =
            null;


          let winnerScore =
            Infinity;



          const targets =
            [...placed]
              .sort(
                (
                  a,
                  b
                ) => {

                  const aCategory =
                    a.category ===
                    item.category
                      ? 1
                      : 0;


                  const bCategory =
                    b.category ===
                    item.category
                      ? 1
                      : 0;


                  const aRank =
                    sizeSimilarity(
                      item,
                      a
                    )
                    *
                    .72 +
                    aCategory *
                    .28;


                  const bRank =
                    sizeSimilarity(
                      item,
                      b
                    )
                    *
                    .72 +
                    bCategory *
                    .28;


                  return bRank -
                    aRank;

                }
              )
              .slice(
                0,
                MAX_TARGETS
              );



          targets.forEach(
            target => {

              const similarity =
                sizeSimilarity(
                  item,
                  target
                );


              const sameCategory =
                target.category ===
                item.category;


              let candidateCount =
                mobile
                  ? 9
                  : 15;


              if (
                similarity >
                .72
              ) {

                candidateCount +=
                  mobile
                    ? 6
                    : 14;

              }


              if (
                sameCategory
              ) {

                candidateCount +=
                  mobile
                    ? 5
                    : 12;

              }


              const candidates =
                createCandidatesAround(
                  item,
                  target,
                  candidateCount
                );



              candidates.forEach(
                candidate => {

                  const collision =
                    collisionBoxAt(
                      item,
                      candidate.x,
                      candidate.y
                    );


                  const overlaps =
                    placed.some(
                      other =>
                        boxesOverlap(
                          collision,
                          other.collision,
                          COLLISION_GAP
                        )
                    );


                  if (
                    overlaps
                  ) {
                    return;
                  }


                  const bounds =
                    getBounds([
                      ...placed.map(
                        other =>
                          other.collision
                      ),
                      collision
                    ]);


                  const width =
                    bounds.width;


                  const height =
                    bounds.height;


                  const area =
                    width *
                    height;


                  const ratio =
                    width /
                    Math.max(
                      height,
                      1
                    );


                  const squarePenalty =
                    area *
                    Math.abs(
                      Math.log(
                        ratio /
                        TARGET_ASPECT
                      )
                    )
                    *
                    5;


                  const longest =
                    Math.max(
                      width,
                      height
                    );


                  const shortest =
                    Math.min(
                      width,
                      height
                    );


                  const imbalance =
                    longest /
                    Math.max(
                      shortest,
                      1
                    );


                  const imbalancePenalty =
                    imbalance >
                    1.22

                      ? area *
                        (
                          imbalance -
                          1.22
                        )
                        *
                        4

                      : 0;


                  const densityPenalty =
                    getDensityScore(
                      collision,
                      placed
                    )
                    *
                    44;


                  const sizeReward =
                    -similarity *
                    3800;


                  const categoryReward =
                    sameCategory
                      ? -1700
                      : 0;


                  const score =
                    area +
                    squarePenalty +
                    imbalancePenalty +
                    densityPenalty +
                    sizeReward +
                    categoryReward +
                    random() *
                    950;


                  if (
                    score <
                    winnerScore
                  ) {

                    winnerScore =
                      score;


                    winner = {

                      x:
                        candidate.x,

                      y:
                        candidate.y,

                      collision

                    };

                  }

                }
              );

            }
          );



          /* =================================================
             FALLBACK
             ================================================= */

          if (
            !winner
          ) {

            const bounds =
              getBounds(
                placed.map(
                  other =>
                    other.collision
                )
              );


            const own =
              collisionBoxAt(
                item,
                0,
                0
              );


            const ownWidth =
              own.right -
              own.left;


            const ownHeight =
              own.bottom -
              own.top;


            const ownCenterX =
              (
                own.left +
                own.right
              )
              /
              2;


            const ownCenterY =
              (
                own.top +
                own.bottom
              )
              /
              2;


            const centerX =
              (
                bounds.left +
                bounds.right
              )
              /
              2;


            const centerY =
              (
                bounds.top +
                bounds.bottom
              )
              /
              2;


            const GAP =
              6;


            const points =
              shuffle([

                {
                  x:
                    bounds.right +
                    GAP +
                    ownWidth /
                    2,

                  y:
                    centerY +
                    randomBetween(
                      -bounds.height *
                      .15,
                      bounds.height *
                      .15
                    )
                },

                {
                  x:
                    bounds.left -
                    GAP -
                    ownWidth /
                    2,

                  y:
                    centerY +
                    randomBetween(
                      -bounds.height *
                      .15,
                      bounds.height *
                      .15
                    )
                },

                {
                  x:
                    centerX +
                    randomBetween(
                      -bounds.width *
                      .15,
                      bounds.width *
                      .15
                    ),

                  y:
                    bounds.bottom +
                    GAP +
                    ownHeight /
                    2
                },

                {
                  x:
                    centerX +
                    randomBetween(
                      -bounds.width *
                      .15,
                      bounds.width *
                      .15
                    ),

                  y:
                    bounds.top -
                    GAP -
                    ownHeight /
                    2
                }

              ]);


            for (
              const point of
              points
            ) {

              const x =
                point.x -
                ownCenterX;


              const y =
                point.y -
                ownCenterY;


              const collision =
                collisionBoxAt(
                  item,
                  x,
                  y
                );


              if (
                !placed.some(
                  other =>
                    boxesOverlap(
                      collision,
                      other.collision,
                      COLLISION_GAP
                    )
                )
              ) {

                winner = {
                  x,
                  y,
                  collision
                };


                break;

              }

            }

          }



          if (
            !winner
          ) {

            const bounds =
              getBounds(
                placed.map(
                  other =>
                    other.collision
                )
              );


            winner = {

              x:
                bounds.right +
                10,

              y:
                bounds.bottom +
                10,

              collision:
                collisionBoxAt(
                  item,
                  bounds.right +
                  10,
                  bounds.bottom +
                  10
                )

            };

          }



          placed.push({

            ...item,

            x:
              winner.x,

            y:
              winner.y,

            collision:
              winner.collision

          });

        }
      );



      /* =====================================================
         COMPACTION
         ===================================================== */

      for (
        let pass =
          0;
        pass <
        COMPACTION_PASSES;
        pass++
      ) {

        const bounds =
          getBounds(
            placed.map(
              item =>
                item.collision
            )
          );


        const centerX =
          (
            bounds.left +
            bounds.right
          )
          /
          2;


        const centerY =
          (
            bounds.top +
            bounds.bottom
          )
          /
          2;


        shuffle(
          placed
        ).forEach(
          item => {

            const itemCenter =
              getItemCenter(
                item
              );


            const baseAngle =
              Math.atan2(
                centerY -
                itemCenter.y,
                centerX -
                itemCenter.x
              );


            const angles = [

              baseAngle,
              baseAngle + .18,
              baseAngle - .18,
              baseAngle + .40,
              baseAngle - .40

            ];


            const steps =
              mobile

                ? [
                    5,
                    2,
                    .75
                  ]

                : [
                    7,
                    4,
                    2,
                    1,
                    .5
                  ];


            let moved =
              false;


            for (
              const step of
              steps
            ) {

              if (
                moved
              ) {
                break;
              }


              for (
                const angle of
                angles
              ) {

                const nextX =
                  item.x +
                  Math.cos(
                    angle
                  )
                  *
                  step;


                const nextY =
                  item.y +
                  Math.sin(
                    angle
                  )
                  *
                  step;


                const nextCollision =
                  collisionBoxAt(
                    item,
                    nextX,
                    nextY
                  );


                const overlaps =
                  placed.some(
                    other => {

                      if (
                        other ===
                        item
                      ) {
                        return false;
                      }


                      return boxesOverlap(
                        nextCollision,
                        other.collision,
                        .1
                      );

                    }
                  );


                if (
                  !overlaps
                ) {

                  item.x =
                    nextX;


                  item.y =
                    nextY;


                  item.collision =
                    nextCollision;


                  moved =
                    true;


                  break;

                }

              }

            }

          }
        );

      }



      /* =====================================================
         BREAK UP CLEAN EDGES
         ===================================================== */

      staggerOuterEdge(
        placed
      );



      /* =====================================================
         FINAL SQUARE
         ===================================================== */

      const finalBounds =
        getBounds(
          placed.map(
            item =>
              item.collision
          )
        );


      /*
        A little less border than previously.

        This lets the staggered outer drawings feel closer
        to the edge and makes the sketchbook composition less
        like a framed poster.
      */

      const CONTENT_PADDING =
        mobile
          ? 17
          : 25;


      const squareContentSize =
        Math.max(
          finalBounds.width,
          finalBounds.height
        );


      const paperSize =
        squareContentSize +
        CONTENT_PADDING *
        2;


      const extraX =
        (
          squareContentSize -
          finalBounds.width
        )
        /
        2;


      const extraY =
        (
          squareContentSize -
          finalBounds.height
        )
        /
        2;


      placed.forEach(
        item => {

          item.x =
            item.x -
            finalBounds.left +
            CONTENT_PADDING +
            extraX;


          item.y =
            item.y -
            finalBounds.top +
            CONTENT_PADDING +
            extraY;

        }
      );


      return {

        width:
          paperSize,

        height:
          paperSize,

        items:
          placed

      };

    }



    /* =====================================================
       DRAWING DOM
       ===================================================== */

    function createDrawingElement(
      item
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "drawing";


      wrapper.style.left =
        `${item.x}px`;


      wrapper.style.top =
        `${item.y}px`;


      wrapper.style.width =
        `${item.displayWidth}px`;


      wrapper.style.height =
        `${item.displayHeight}px`;


      const image =
        document.createElement(
          "img"
        );


      image.className =
        "drawing-art";


      image.src =
        item.filename;


      image.alt =
        "";


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.draggable =
        false;


      image.style.transform =
        `rotate(${item.rotation}deg)`;


      wrapper.appendChild(
        image
      );


      return wrapper;

    }



    /* =====================================================
       BUILD
       ===================================================== */

    let paperWidth =
      1;


    let paperHeight =
      1;


    let buildGeneration =
      0;


    let loadedImageData =
      null;



    async function buildSketchbook(
      forceReload =
        false
    ) {

      const generation =
        ++buildGeneration;


      resetRandom();


      loadingIndicator.classList.remove(
        "is-hidden"
      );


      viewport.classList.add(
        "is-loading"
      );


      field.innerHTML =
        "";


      await yieldToBrowser();



      if (
        !loadedImageData ||
        forceReload
      ) {

        loadedImageData =
          await loadImagesInBatches();

      }


      if (
        generation !==
        buildGeneration
      ) {
        return;
      }


      if (
        !loadedImageData.length
      ) {

        loadingIndicator.textContent =
          "couldn't load illustrations";

        return;

      }



      await yieldToBrowser();



      const sourceScales =
        loadedImageData
          .map(
            item =>
              Math.sqrt(
                item.width *
                item.height
              )
          )
          .sort(
            (
              a,
              b
            ) =>
              a -
              b
          );


      const midpoint =
        Math.floor(
          sourceScales.length /
          2
        );


      const medianDimension =
        sourceScales.length %
        2

          ? sourceScales[
              midpoint
            ]

          : (
              sourceScales[
                midpoint -
                1
              ]
              +
              sourceScales[
                midpoint
              ]
            )
            /
            2;



      const prepared =
        loadedImageData.map(
          item =>
            prepareDrawing(
              item,
              {
                median:
                  medianDimension
              }
            )
        );


      await yieldToBrowser();



      const layout =
        packDrawings(
          prepared
        );


      if (
        generation !==
        buildGeneration
      ) {
        return;
      }



      paperWidth =
        layout.width;


      paperHeight =
        layout.height;


      paper.style.width =
        `${paperWidth}px`;


      paper.style.height =
        `${paperHeight}px`;



      const fragment =
        document.createDocumentFragment();


      layout.items.forEach(
        item => {

          fragment.appendChild(
            createDrawingElement(
              item
            )
          );

        }
      );


      field.appendChild(
        fragment
      );


      await yieldToBrowser();



      setInitialView();


      viewport.classList.remove(
        "is-loading"
      );


      loadingIndicator.classList.add(
        "is-hidden"
      );

    }



    /* =====================================================
       VIEW STATE
       ===================================================== */

    const view = {

      x:
        0,

      y:
        0,

      zoom:
        1,

      minZoom:
        .1,

      maxZoom:
        4,

      dragging:
        false,

      pinching:
        false,

      startX:
        0,

      startY:
        0,

      originX:
        0,

      originY:
        0

    };



    /* =====================================================
       PAN CONSTRAINTS
       ===================================================== */

    function constrainPan(
      x,
      y,
      zoom
    ) {

      const scaledWidth =
        paperWidth *
        zoom;


      const scaledHeight =
        paperHeight *
        zoom;


      const viewportWidth =
        viewport.clientWidth;


      const viewportHeight =
        viewport.clientHeight;


      let minX;
      let maxX;
      let minY;
      let maxY;


      if (
        scaledWidth <=
        viewportWidth
      ) {

        minX =
          maxX =
          (
            viewportWidth -
            scaledWidth
          )
          /
          2;

      }

      else {

        minX =
          viewportWidth -
          scaledWidth;


        maxX =
          0;

      }


      if (
        scaledHeight <=
        viewportHeight
      ) {

        minY =
          maxY =
          (
            viewportHeight -
            scaledHeight
          )
          /
          2;

      }

      else {

        minY =
          viewportHeight -
          scaledHeight;


        maxY =
          0;

      }


      return {

        x:
          clamp(
            x,
            minX,
            maxX
          ),

        y:
          clamp(
            y,
            minY,
            maxY
          )

      };

    }



    /* =====================================================
       ZOOM BUTTONS
       ===================================================== */

    function updateZoomButtons() {

      const epsilon =
        .0005;


      zoomOutButton.classList.toggle(
        "is-hidden",
        view.zoom <=
        view.minZoom +
        epsilon
      );


      zoomInButton.classList.toggle(
        "is-hidden",
        view.zoom >=
        view.maxZoom -
        epsilon
      );

    }



    /* =====================================================
       VIEW
       ===================================================== */

    function applyView() {

      paper.style.transform =
        `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.zoom})`;


      updateZoomButtons();

    }



    function setView(
      x,
      y,
      zoom
    ) {

      view.zoom =
        clamp(
          zoom,
          view.minZoom,
          view.maxZoom
        );


      const constrained =
        constrainPan(
          x,
          y,
          view.zoom
        );


      view.x =
        constrained.x;


      view.y =
        constrained.y;


      applyView();

    }



    /* =====================================================
       INITIAL VIEW
       ===================================================== */

    function setInitialView() {

      const viewportWidth =
        viewport.clientWidth;


      const viewportHeight =
        viewport.clientHeight;


      const coverZoom =
        Math.max(
          viewportWidth /
          paperWidth,
          viewportHeight /
          paperHeight
        );


      const minimumMultiplier =
        isMobileLayout()
          ? 1.12
          : 1.25;


      const initialMultiplier =
        isMobileLayout()
          ? 1.20
          : 1.38;


      view.minZoom =
        coverZoom *
        minimumMultiplier;


      view.maxZoom =
        Math.max(
          view.minZoom *
          4.25,
          3
        );


      const initialZoom =
        Math.min(
          view.minZoom *
          initialMultiplier,
          view.maxZoom
        );


      const scaledWidth =
        paperWidth *
        initialZoom;


      const scaledHeight =
        paperHeight *
        initialZoom;


      setView(

        (
          viewportWidth -
          scaledWidth
        )
        /
        2,

        (
          viewportHeight -
          scaledHeight
        )
        /
        2,

        initialZoom

      );

    }



    /* =====================================================
       RESIZE VIEW
       ===================================================== */

    function refreshViewAfterResize() {

      if (
        paperWidth <=
        1
      ) {
        return;
      }


      const oldMin =
        view.minZoom;


      const relativeZoom =
        oldMin >
        0

          ? view.zoom /
            oldMin

          : 1;


      const oldViewportWidth =
        viewport.clientWidth;


      const oldViewportHeight =
        viewport.clientHeight;


      const oldCenterWorldX =
        (
          oldViewportWidth /
          2 -
          view.x
        )
        /
        view.zoom;


      const oldCenterWorldY =
        (
          oldViewportHeight /
          2 -
          view.y
        )
        /
        view.zoom;


      const coverZoom =
        Math.max(
          viewport.clientWidth /
          paperWidth,
          viewport.clientHeight /
          paperHeight
        );


      view.minZoom =
        coverZoom *
        (
          isMobileLayout()
            ? 1.12
            : 1.25
        );


      view.maxZoom =
        Math.max(
          view.minZoom *
          4.25,
          3
        );


      const nextZoom =
        clamp(
          view.minZoom *
          relativeZoom,
          view.minZoom,
          view.maxZoom
        );


      setView(

        viewport.clientWidth /
        2 -
        oldCenterWorldX *
        nextZoom,

        viewport.clientHeight /
        2 -
        oldCenterWorldY *
        nextZoom,

        nextZoom

      );

    }



    /* =====================================================
       ZOOM
       ===================================================== */

    function zoomAt(
      screenX,
      screenY,
      targetZoom
    ) {

      const worldX =
        (
          screenX -
          view.x
        )
        /
        view.zoom;


      const worldY =
        (
          screenY -
          view.y
        )
        /
        view.zoom;


      const zoom =
        clamp(
          targetZoom,
          view.minZoom,
          view.maxZoom
        );


      setView(

        screenX -
        worldX *
        zoom,

        screenY -
        worldY *
        zoom,

        zoom

      );

    }



    function zoomCenter(
      factor
    ) {

      zoomAt(

        viewport.clientWidth /
        2,

        viewport.clientHeight /
        2,

        view.zoom *
        factor

      );

    }



    zoomInButton.addEventListener(
      "click",
      () => {

        zoomCenter(
          1.22
        );

      }
    );


    zoomOutButton.addEventListener(
      "click",
      () => {

        zoomCenter(
          1 /
          1.22
        );

      }
    );



    /* =====================================================
       DESKTOP TRACKPAD / MOUSE WHEEL
       ===================================================== */

    viewport.addEventListener(
      "wheel",
      event => {

        event.preventDefault();


        const rect =
          viewport.getBoundingClientRect();


        zoomAt(

          event.clientX -
          rect.left,

          event.clientY -
          rect.top,

          view.zoom *
          Math.exp(
            -event.deltaY *
            .00135
          )

        );

      },
      {
        passive:
          false
      }
    );



    /* =====================================================
       MOBILE / POINTER GESTURES

       1 finger = pan
       2 fingers = pinch zoom + pan
       ===================================================== */

    const activePointers =
      new Map();


    let pinchStartDistance =
      0;


    let pinchStartZoom =
      1;


    let pinchWorldX =
      0;


    let pinchWorldY =
      0;



    function pointerLocalPosition(
      event
    ) {

      const rect =
        viewport.getBoundingClientRect();


      return {

        x:
          event.clientX -
          rect.left,

        y:
          event.clientY -
          rect.top

      };

    }



    function getPinchData() {

      const points =
        Array.from(
          activePointers.values()
        );


      if (
        points.length <
        2
      ) {
        return null;
      }


      const a =
        points[0];


      const b =
        points[1];


      return {

        midpointX:
          (
            a.x +
            b.x
          )
          /
          2,

        midpointY:
          (
            a.y +
            b.y
          )
          /
          2,

        distance:
          Math.hypot(
            b.x -
            a.x,
            b.y -
            a.y
          )

      };

    }



    function startPinch() {

      const pinch =
        getPinchData();


      if (
        !pinch ||
        pinch.distance <=
        0
      ) {
        return;
      }


      view.pinching =
        true;


      view.dragging =
        false;


      pinchStartDistance =
        pinch.distance;


      pinchStartZoom =
        view.zoom;


      /*
        World coordinate currently underneath midpoint.
      */

      pinchWorldX =
        (
          pinch.midpointX -
          view.x
        )
        /
        view.zoom;


      pinchWorldY =
        (
          pinch.midpointY -
          view.y
        )
        /
        view.zoom;


      viewport.classList.add(
        "is-dragging"
      );

    }



    viewport.addEventListener(
      "pointerdown",
      event => {

        if (
          event.target.closest(
            ".zoom-controls"
          )
        ) {
          return;
        }


        const point =
          pointerLocalPosition(
            event
          );


        activePointers.set(
          event.pointerId,
          point
        );


        try {

          viewport.setPointerCapture(
            event.pointerId
          );

        }

        catch {
          /* no-op */
        }


        if (
          activePointers.size ===
          1
        ) {

          view.pinching =
            false;


          view.dragging =
            true;


          view.startX =
            point.x;


          view.startY =
            point.y;


          view.originX =
            view.x;


          view.originY =
            view.y;


          viewport.classList.add(
            "is-dragging"
          );

        }


        if (
          activePointers.size >=
          2
        ) {

          startPinch();

        }

      }
    );



    viewport.addEventListener(
      "pointermove",
      event => {

        if (
          !activePointers.has(
            event.pointerId
          )
        ) {
          return;
        }


        const point =
          pointerLocalPosition(
            event
          );


        activePointers.set(
          event.pointerId,
          point
        );


        /* ---------------------------------------------
           PINCH
           --------------------------------------------- */

        if (
          activePointers.size >=
          2
        ) {

          if (
            !view.pinching
          ) {

            startPinch();

          }


          const pinch =
            getPinchData();


          if (
            !pinch ||
            pinchStartDistance <=
            0
          ) {
            return;
          }


          const ratio =
            pinch.distance /
            pinchStartDistance;


          const nextZoom =
            clamp(
              pinchStartZoom *
              ratio,
              view.minZoom,
              view.maxZoom
            );


          /*
            Keep original world point under the live
            midpoint.

            Since the midpoint itself can move, this gives
            normal two-finger zoom + pan behavior.
          */

          const nextX =
            pinch.midpointX -
            pinchWorldX *
            nextZoom;


          const nextY =
            pinch.midpointY -
            pinchWorldY *
            nextZoom;


          setView(
            nextX,
            nextY,
            nextZoom
          );


          return;

        }



        /* ---------------------------------------------
           SINGLE-FINGER PAN
           --------------------------------------------- */

        if (
          view.dragging &&
          activePointers.size ===
          1
        ) {

          setView(

            view.originX +
            point.x -
            view.startX,

            view.originY +
            point.y -
            view.startY,

            view.zoom

          );

        }

      }
    );



    function releasePointer(
      event
    ) {

      activePointers.delete(
        event.pointerId
      );


      /*
        Pinch ended but one finger remains.

        Seamlessly turn that finger into a new pan gesture.
      */

      if (
        activePointers.size ===
        1
      ) {

        const remaining =
          Array.from(
            activePointers.values()
          )[0];


        view.pinching =
          false;


        view.dragging =
          true;


        view.startX =
          remaining.x;


        view.startY =
          remaining.y;


        view.originX =
          view.x;


        view.originY =
          view.y;


        return;

      }


      if (
        activePointers.size ===
        0
      ) {

        view.pinching =
          false;


        view.dragging =
          false;


        viewport.classList.remove(
          "is-dragging"
        );

      }

    }



    viewport.addEventListener(
      "pointerup",
      releasePointer
    );


    viewport.addEventListener(
      "pointercancel",
      releasePointer
    );


    window.addEventListener(
      "blur",
      () => {

        activePointers.clear();


        view.pinching =
          false;


        view.dragging =
          false;


        viewport.classList.remove(
          "is-dragging"
        );

      }
    );



    /* =====================================================
       RESIZE
       ===================================================== */

    let resizeTimer =
      null;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          window.setTimeout(
            async () => {

              const nextMobileMode =
                isMobileLayout();


              if (
                nextMobileMode !==
                currentMobileMode
              ) {

                currentMobileMode =
                  nextMobileMode;


                await buildSketchbook(
                  false
                );

              }

              else {

                refreshViewAfterResize();

              }

            },
            180
          );

      }
    );



    /* =====================================================
       START
       ===================================================== */

    buildSketchbook();

  })();
  </script>

</body>

</html>
