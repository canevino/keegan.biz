<!DOCTYPE html>
<html lang="en">

<body>

  <div

        >
      </a>


      <a
        class="scarf-item"
        href="../photography/"
        data-live-link
        aria-label="Photography"
      >
        <img
          src="../assets/home/scarf-photography.png"
          alt=""
        >
      </a>


      <a
        class="scarf-item"
        href="#"
        aria-label="Graphic Design"
      >
        <img
          src="../assets/home/scarf-design.png"

        >
      </a>


      <a

        <img

        >
      </a>


      <a

      <a

      <a

    </nav>



    <!-- =====================================================
         ILLUSTRATION PAGE
         ===================================================== -->

    <main class="illustration-page">

      <header class="illustration-header">
        <h1 class="illustration-title">
          illustration
        </h1>
      </header>


      <section
        class="sketchbook-stage"
        aria-label="Illustration sketchbook"
      >

        <div
          class="sketchbook-viewport"
          id="sketchbook-viewport"
        >

          <div
            class="sketchbook-paper"
            id="sketchbook-paper"
          >

            <div
              class="sketchbook-field"
              id="sketchbook-field"
            ></div>

          </div>

        </div>

      </section>

    </main>

  </div>



  <script>
  (() => {

    /* =====================================================
       FILES
       ===================================================== */

    const files = [

      "animal-01.webp",
      "animal-02.webp",

      "city-01.webp",
      "city-02.webp",

      "face-01.webp",
      "face-02.webp",
      "face-03.webp",
      "face-04.webp",
      "face-05.webp",

      "figure-01.webp",
      "figure-02.webp",
      "figure-03.webp",
      "figure-04.webp",
      "figure-05.webp",
      "figure-06.webp",
      "figure-07.webp",
      "figure-08.webp",
      "figure-09.webp",
      "figure-10.webp",
      "figure-11.webp",
      "figure-12.webp",
      "figure-13.webp",
      "figure-14.webp",

      "fishing-01.webp",
      "fishing-02.webp",

      "food-01.webp",
      "food-02.webp",
      "food-03.webp",
      "food-04.webp",
      "food-05.webp",
      "food-06.webp",
      "food-07.webp",
      "food-08.webp",

      "ghost-1.webp",
      "ghost-02.webp",

      "group-01.webp",

      "house-1.webp",
      "house-2.webp",
      "house-03.webp",
      "house-04.webp",

      "insect-01.webp",

      "kitchen-01.webp",
      "kitchen-02.webp",
      "kitchen-03.webp",
      "kitchen-04.webp",
      "kitchen-05.webp",
      "kitchen-06.webp",

      "misc-01.webp",

      "multiple-01.webp",
      "multiple-02.webp",
      "multiple-03.webp",
      "multiple-04.webp",
      "multiple-05.webp",

      "music-01.webp",
      "music-02.webp",
      "music-03.webp",
      "music-04.webp",

      "nature-01.webp",

      "object-1.webp",
      "object-2.webp",
      "object-03.webp",
      "object-04.webp",

      "perspective-01.webp",

      "vehicle-01.webp",
      "vehicle-02.webp",
      "vehicle-03.webp"

    ];



    /* =====================================================
       ELEMENTS
       ===================================================== */

    const viewport =
      document.getElementById(
        "sketchbook-viewport"
      );

    const paper =
      document.getElementById(
        "sketchbook-paper"
      );

    const field =
      document.getElementById(
        "sketchbook-field"
      );


    if (
      !viewport ||
      !paper ||
      !field
    ) {
      return;
    }



    /* =====================================================
       HELPERS
       ===================================================== */

    function clamp(
      value,
      min,
      max
    ) {
      return Math.min(
        Math.max(value, min),
        max
      );
    }


    function randomBetween(
      min,
      max
    ) {
      return min + Math.random() * (max - min);
    }


    function shuffle(array) {

      const copy =
        [...array];

      for (
        let i = copy.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }

      return copy;

    }


    function categoryFromFilename(filename) {

      return filename
        .split("-")[0]
        .toLowerCase();

    }


    function overlaps(
      a,
      b,
      padding
    ) {

      return !(
        a.right + padding < b.left ||
        a.left > b.right + padding ||
        a.bottom + padding < b.top ||
        a.top > b.bottom + padding
      );

    }



    /* =====================================================
       CATEGORY ANCHORS

       These are only general zones.
       Final position is randomized around them.
       ===================================================== */

    const categoryAnchors = {
      figure: [0.20, 0.21],
      face: [0.15, 0.44],
      group: [0.35, 0.24],
      multiple: [0.33, 0.47],

      city: [0.58, 0.18],
      house: [0.79, 0.21],
      perspective: [0.72, 0.43],
      vehicle: [0.87, 0.32],

      food: [0.20, 0.67],
      kitchen: [0.41, 0.66],
      object: [0.51, 0.80],

      nature: [0.74, 0.71],
      animal: [0.61, 0.57],
      insect: [0.58, 0.82],
      fishing: [0.85, 0.58],

      music: [0.69, 0.87],
      ghost: [0.15, 0.87],
      misc: [0.88, 0.84]
    };



    /* =====================================================
       IMAGE LOADING
       ===================================================== */

    function loadImageData(filename) {

      return new Promise(resolve => {

        const image =
          new Image();

        image.src =
          filename;

        image.decoding =
          "async";

        image.onload =
          () => {

            resolve({

              filename,

              category:
                categoryFromFilename(
                  filename
                ),

              width:
                image.naturalWidth,

              height:
                image.naturalHeight,

              area:
                image.naturalWidth *
                image.naturalHeight

            });

          };

        image.onerror =
          () => {

            console.warn(
              `Could not load ${filename}`
            );

            resolve(null);

          };

      });

    }



    /* =====================================================
       SIZE SYSTEM

       Larger exports display larger, but everything
       stays within a relatively tight sketchbook range.
       ===================================================== */

    function calculateDisplayWidth(
      item,
      minArea,
      maxArea
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;

      const minWidth =
        mobile
          ? 48
          : 62;

      const maxWidth =
        mobile
          ? 150
          : 235;

      const areaRoot =
        Math.sqrt(item.area);

      const minRoot =
        Math.sqrt(minArea);

      const maxRoot =
        Math.sqrt(maxArea);

      let normalized =
        (
          areaRoot -
          minRoot
        )
        /
        Math.max(
          1,
          maxRoot -
          minRoot
        );

      normalized =
        clamp(
          normalized,
          0,
          1
        );

      normalized =
        Math.pow(
          normalized,
          0.80
        );

      return (
        minWidth +
        normalized *
        (
          maxWidth -
          minWidth
        )
      );

    }



    /* =====================================================
       PAPER SIZE
       ===================================================== */

    let paperWidth = 0;
    let paperHeight = 0;


    function updatePaperDimensions() {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;

      const viewportWidth =
        viewport.clientWidth;

      const viewportHeight =
        viewport.clientHeight;

      paperWidth =
        mobile
          ? Math.max(
              viewportWidth * 1.55,
              1200
            )
          : Math.max(
              viewportWidth * 1.50,
              2000
            );

      paperHeight =
        mobile
          ? Math.max(
              viewportHeight * 1.85,
              1700
            )
          : Math.max(
              viewportHeight * 1.55,
              1550
            );

      paper.style.width =
        `${paperWidth}px`;

      paper.style.height =
        `${paperHeight}px`;

    }



    /* =====================================================
       RANDOM ORGANIC PLACEMENT
       ===================================================== */

    function getAnchorForCategory(category) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;

      const base =
        categoryAnchors[category] ||
        [0.5, 0.5];

      const anchorJitter =
        mobile
          ? 0.035
          : 0.05;

      const x =
        clamp(
          base[0] + randomBetween(-anchorJitter, anchorJitter),
          0.10,
          0.90
        ) * paperWidth;

      const y =
        clamp(
          base[1] + randomBetween(-anchorJitter, anchorJitter),
          0.10,
          0.90
        ) * paperHeight;

      return { x, y };

    }


    function findPositionForItem(
      item,
      anchor,
      placedBoxes,
      minArea,
      maxArea
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;

      const width =
        calculateDisplayWidth(
          item,
          minArea,
          maxArea
        );

      const height =
        width *
        (
          item.height /
          item.width
        );

      const margin =
        mobile
          ? 28
          : 38;

      const collisionPadding =
        mobile
          ? 5
          : 7;

      const baseSpreadX =
        mobile
          ? 80
          : 125;

      const baseSpreadY =
        mobile
          ? 65
          : 100;

      const maxSpreadX =
        mobile
          ? 290
          : 470;

      const maxSpreadY =
        mobile
          ? 250
          : 390;

      for (
        let attempt = 0;
        attempt < 240;
        attempt++
      ) {

        const progress =
          attempt / 239;

        const radiusX =
          randomBetween(
            baseSpreadX,
            baseSpreadX +
            progress * maxSpreadX
          );

        const radiusY =
          randomBetween(
            baseSpreadY,
            baseSpreadY +
            progress * maxSpreadY
          );

        const angle =
          randomBetween(
            0,
            Math.PI * 2
          );

        const centerX =
          anchor.x +
          Math.cos(angle) * radiusX +
          randomBetween(-14, 14);

        const centerY =
          anchor.y +
          Math.sin(angle) * radiusY +
          randomBetween(-14, 14);

        const left =
          clamp(
            centerX - width / 2,
            margin,
            paperWidth - width - margin
          );

        const top =
          clamp(
            centerY - height / 2,
            margin,
            paperHeight - height - margin
          );

        const box = {
          left,
          top,
          right: left + width,
          bottom: top + height
        };

        const hit =
          placedBoxes.some(
            other =>
              overlaps(
                box,
                other,
                collisionPadding
              )
          );

        if (!hit) {

          return {
            left,
            top,
            width,
            height
          };

        }

      }


      /*
        Fallback scan if random attempts fail.
      */

      const step =
        mobile
          ? 16
          : 20;

      for (
        let y = margin;
        y <= paperHeight - height - margin;
        y += step
      ) {

        for (
          let x = margin;
          x <= paperWidth - width - margin;
          x += step
        ) {

          const box = {
            left: x,
            top: y,
            right: x + width,
            bottom: y + height
          };

          const hit =
            placedBoxes.some(
              other =>
                overlaps(
                  box,
                  other,
                  collisionPadding
                )
            );

          if (!hit) {

            return {
              left: x,
              top: y,
              width,
              height
            };

          }

        }

      }


      return {
        left: margin,
        top: margin,
        width,
        height
      };

    }



    /* =====================================================
       CREATE DRAWING
       ===================================================== */

    function createDrawingElement(
      item,
      placement
    ) {

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "drawing";

      wrapper.style.left =
        `${placement.left}px`;

      wrapper.style.top =
        `${placement.top}px`;

      wrapper.style.width =
        `${placement.width}px`;

      wrapper.style.setProperty(
        "--rotation",
        `${randomBetween(-4.5, 4.5).toFixed(2)}deg`
      );

      const image =
        document.createElement(
          "img"
        );

      image.src =
        item.filename;

      image.alt =
        "";

      image.loading =
        "lazy";

      image.decoding =
        "async";

      image.draggable =
        false;

      wrapper.appendChild(
        image
      );

      return wrapper;

    }



    /* =====================================================
       BUILD SKETCHBOOK
       ===================================================== */

    async function buildSketchbook() {

      field.innerHTML =
        "";

      updatePaperDimensions();

      const loaded =
        (
          await Promise.all(
            files.map(
              loadImageData
            )
          )
        )
        .filter(Boolean);

      if (!loaded.length) {
        return;
      }

      const minArea =
        Math.min(
          ...loaded.map(
            item => item.area
          )
        );

      const maxArea =
        Math.max(
          ...loaded.map(
            item => item.area
          )
        );

      const byCategory =
        new Map();

      loaded.forEach(item => {

        if (
          !byCategory.has(
            item.category
          )
        ) {
          byCategory.set(
            item.category,
            []
          );
        }

        byCategory
          .get(item.category)
          .push(item);

      });

      const renderOrder = [
        "figure",
        "face",
        "group",
        "multiple",

        "city",
        "house",
        "perspective",
        "vehicle",

        "food",
        "kitchen",
        "object",

        "nature",
        "animal",
        "insect",
        "fishing",

        "music",
        "ghost",
        "misc"
      ];

      byCategory.forEach(
        (items, category) => {

          if (
            !renderOrder.includes(category)
          ) {
            renderOrder.push(category);
          }

        }
      );

      const placedBoxes =
        [];

      renderOrder.forEach(category => {

        const items =
          byCategory.get(category);

        if (
          !items ||
          !items.length
        ) {
          return;
        }

        const anchor =
          getAnchorForCategory(
            category
          );

        const sorted =
          shuffle(items).sort(
            (a, b) =>
              b.area - a.area
          );

        sorted.forEach(item => {

          const placement =
            findPositionForItem(
              item,
              anchor,
              placedBoxes,
              minArea,
              maxArea
            );

          const box = {
            left: placement.left,
            top: placement.top,
            right: placement.left + placement.width,
            bottom: placement.top + placement.height
          };

          placedBoxes.push(
            box
          );

          field.appendChild(
            createDrawingElement(
              item,
              placement
            )
          );

        });

      });

      centerPaper();

    }



    /* =====================================================
       DRAG / PAN
       ===================================================== */

    const pan = {
      x: 0,
      y: 0,
      startX: 0,
      startY: 0,
      originX: 0,
      originY: 0,
      dragging: false
    };


    function clampPan(
      x,
      y
    ) {

      const viewportWidth =
        viewport.clientWidth;

      const viewportHeight =
        viewport.clientHeight;

      let minX;
      let maxX;
      let minY;
      let maxY;

      if (
        paperWidth <= viewportWidth
      ) {
        minX =
          maxX =
          (viewportWidth - paperWidth) / 2;
      }

      else {
        minX =
          viewportWidth - paperWidth - 18;
        maxX =
          18;
      }

      if (
        paperHeight <= viewportHeight
      ) {
        minY =
          maxY =
          (viewportHeight - paperHeight) / 2;
      }

      else {
        minY =
          viewportHeight - paperHeight - 18;
        maxY =
          18;
      }

      return {
        x: clamp(x, minX, maxX),
        y: clamp(y, minY, maxY)
      };

    }


    function setPan(
      x,
      y
    ) {

      const next =
        clampPan(x, y);

      pan.x =
        next.x;

      pan.y =
        next.y;

      paper.style.transform =
        `translate3d(${pan.x}px, ${pan.y}px, 0)`;

    }


    function centerPaper() {

      const viewportWidth =
        viewport.clientWidth;

      const viewportHeight =
        viewport.clientHeight;

      const x =
        (viewportWidth - paperWidth) / 2;

      const y =
        (viewportHeight - paperHeight) / 2;

      setPan(x, y);

    }


    viewport.addEventListener(
      "pointerdown",
      event => {

        pan.dragging =
          true;

        pan.startX =
          event.clientX;

        pan.startY =
          event.clientY;

        pan.originX =
          pan.x;

        pan.originY =
          pan.y;

        viewport.classList.add(
          "is-dragging"
        );

        viewport.setPointerCapture(
          event.pointerId
        );

      }
    );


    viewport.addEventListener(
      "pointermove",
      event => {

        if (
          !pan.dragging
        ) {
          return;
        }

        const dx =
          event.clientX - pan.startX;

        const dy =
          event.clientY - pan.startY;

        setPan(
          pan.originX + dx,
          pan.originY + dy
        );

      }
    );


    function endDrag() {

      pan.dragging =
        false;

      viewport.classList.remove(
        "is-dragging"
      );

    }


    viewport.addEventListener(
      "pointerup",
      endDrag
    );

    viewport.addEventListener(
      "pointercancel",
      endDrag
    );

    viewport.addEventListener(
      "pointerleave",
      event => {

        if (
          event.pointerType === "mouse" &&
          pan.dragging
        ) {
          endDrag();
        }

      }
    );



    /* =====================================================
       RESIZE
       ===================================================== */

    let resizeTimer =
      null;

    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );

        resizeTimer =
          window.setTimeout(
            buildSketchbook,
            120
          );

      }
    );



    /* =====================================================
       START
       ===================================================== */

    buildSketchbook();

  })();
  </script>

</body>
</html>
