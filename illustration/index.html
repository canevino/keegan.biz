  <script>
  (() => {

    /* =====================================================

    const files = [

      "ghost-1.webp",
      "ghost-02.webp",

      "group-01.webp",
      "group-02.webp",
      "group-03.webp",

      "house-1.webp",
      "house-2.webp",
      "house-03.webp",
      "house-04.webp",
      "house-5.webp",
      "house-6.webp",
      "house-07.webp",
      "house-08.webp",

      "insect-01.webp",
      "insect-02.webp",

      "kitchen-01.webp",
      "kitchen-02.webp",
      "kitchen-03.webp",
      "kitchen-04.webp",
      "kitchen-05.webp",
      "kitchen-06.webp",

      "misc-01.webp",

      "multiple-01.webp",
      "multiple-02.webp",
      "multiple-03.webp",
      "multiple-04.webp",
      "multiple-05.webp",

      "music-01.webp",
      "music-02.webp",
      "music-03.webp",
      "music-04.webp",

      "nature-01.webp",

      "object-1.webp",
      "object-2.webp",
      "object-03.webp",
      "object-04.webp",
      "object-05.webp",

      "perspective-01.webp",

      "vehicle-01.webp",
      "vehicle-02.webp",
      "vehicle-03.webp"

    ];



    /* =====================================================
       ELEMENTS
       ===================================================== */

    const viewport =
      document.getElementById(
        "sketchbook-viewport"
      );

    const paper =
      document.getElementById(
        "sketchbook-paper"
      );

    const field =
      document.getElementById(
        "sketchbook-field"
      );

    const zoomInButton =
      document.getElementById(
        "zoom-in"
      );

    const zoomOutButton =
      document.getElementById(
        "zoom-out"
      );


    if (
      !viewport ||
      !paper ||
      !field
    ) {
      return;
    }



    /* =====================================================
       HELPERS
       ===================================================== */

    function clamp(
      value,
      min,
      max
    ) {

      return Math.min(
        Math.max(
          value,
          min
        ),
        max
      );

    }


    function randomBetween(
      min,
      max
    ) {

      return (
        min +
        Math.random() *
        (
          max -
          min
        )
      );

    }


    function shuffle(
      array
    ) {

      const copy =
        [...array];

      for (
        let i = copy.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );

        [
          copy[i],
          copy[j]
        ] = [
          copy[j],
          copy[i]
        ];

      }

      return copy;

    }


    function categoryFromFilename(
      filename
    ) {

      let category =
        filename
          .split("-")[0]
          .toLowerCase();

      if (
        category === "animals"
      ) {
        category =
          "animal";
      }

      return category;

    }


    function boxesOverlap(
      a,
      b,
      gap = 0
    ) {

      return !(
        a.right + gap <= b.left ||
        a.left >= b.right + gap ||
        a.bottom + gap <= b.top ||
        a.top >= b.bottom + gap
      );

    }


    function getBounds(
      boxes
    ) {

      return {

        left:
          Math.min(
            ...boxes.map(
              box => box.left
            )
          ),

        top:
          Math.min(
            ...boxes.map(
              box => box.top
            )
          ),

        right:
          Math.max(
            ...boxes.map(
              box => box.right
            )
          ),

        bottom:
          Math.max(
            ...boxes.map(
              box => box.bottom
            )
          )

      };

    }



    /* =====================================================
       ANALYZE VISIBLE ARTWORK
       ===================================================== */

    function analyzeVisibleBounds(
      image
    ) {

      const maxSample =
        120;

      const ratio =
        Math.min(
          1,
          maxSample /
          Math.max(
            image.naturalWidth,
            image.naturalHeight
          )
        );

      const width =
        Math.max(
          1,
          Math.round(
            image.naturalWidth *
            ratio
          )
        );

      const height =
        Math.max(
          1,
          Math.round(
            image.naturalHeight *
            ratio
          )
        );

      const canvas =
        document.createElement(
          "canvas"
        );

      canvas.width =
        width;

      canvas.height =
        height;

      const context =
        canvas.getContext(
          "2d",
          {
            willReadFrequently:
              true
          }
        );

      context.drawImage(
        image,
        0,
        0,
        width,
        height
      );


      let data;

      try {

        data =
          context.getImageData(
            0,
            0,
            width,
            height
          ).data;

      }

      catch {

        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };

      }


      let minX =
        width;

      let minY =
        height;

      let maxX =
        -1;

      let maxY =
        -1;


      const WHITE_THRESHOLD =
        247;

      const ALPHA_THRESHOLD =
        14;


      for (
        let y = 0;
        y < height;
        y++
      ) {

        for (
          let x = 0;
          x < width;
          x++
        ) {

          const i =
            (
              y *
              width +
              x
            )
            *
            4;

          const r =
            data[i];

          const g =
            data[i + 1];

          const b =
            data[i + 2];

          const a =
            data[i + 3];


          if (
            a <=
            ALPHA_THRESHOLD
          ) {
            continue;
          }


          if (
            r >= WHITE_THRESHOLD &&
            g >= WHITE_THRESHOLD &&
            b >= WHITE_THRESHOLD
          ) {
            continue;
          }


          minX =
            Math.min(
              minX,
              x
            );

          minY =
            Math.min(
              minY,
              y
            );

          maxX =
            Math.max(
              maxX,
              x
            );

          maxY =
            Math.max(
              maxY,
              y
            );

        }

      }


      if (
        maxX < minX ||
        maxY < minY
      ) {

        return {
          left: 0,
          top: 0,
          right: 1,
          bottom: 1
        };

      }


      const margin =
        1;


      minX =
        Math.max(
          0,
          minX - margin
        );

      minY =
        Math.max(
          0,
          minY - margin
        );

      maxX =
        Math.min(
          width - 1,
          maxX + margin
        );

      maxY =
        Math.min(
          height - 1,
          maxY + margin
        );


      return {

        left:
          minX /
          width,

        top:
          minY /
          height,

        right:
          (
            maxX + 1
          )
          /
          width,

        bottom:
          (
            maxY + 1
          )
          /
          height

      };

    }



    /* =====================================================
       LOAD IMAGES
       ===================================================== */

    function loadImageData(
      filename
    ) {

      return new Promise(
        resolve => {

          const image =
            new Image();

          image.src =
            filename;

          image.decoding =
            "async";


          image.onload =
            () => {

              resolve({

                filename,

                category:
                  categoryFromFilename(
                    filename
                  ),

                width:
                  image.naturalWidth,

                height:
                  image.naturalHeight,

                area:
                  image.naturalWidth *
                  image.naturalHeight,

                visibleBounds:
                  analyzeVisibleBounds(
                    image
                  )

              });

            };


          image.onerror =
            () => {

              console.warn(
                `Could not load ${filename}`
              );

              resolve(null);

            };

        }
      );

    }



    /* =====================================================
       SOURCE-DIMENSION SCALE

       Original file dimensions are still the main
       determinant of size.

       We only restrain extreme ratios enough to stop
       a single file from dominating the whole spread.
       ===================================================== */

    function calculateDisplaySize(
      item,
      referenceLinear
    ) {

      const mobile =
        window.matchMedia(
          "(max-width: 700px)"
        ).matches;


      const sourceLinear =
        Math.sqrt(
          item.width *
          item.height
        );


      let ratio =
        sourceLinear /
        Math.max(
          1,
          referenceLinear
        );


      /*
        Actual dimensions still drive the hierarchy.

        Guardrails only affect very extreme outliers.
      */

      ratio =
        clamp(
          ratio,
          .48,
          2.35
        );


      const base =
        mobile
          ? 90
          : 122;


      const longest =
        base *
        Math.pow(
          ratio,
          .90
        );


      let width;
      let height;


      if (
        item.width >=
        item.height
      ) {

        width =
          longest;

        height =
          longest *
          (
            item.height /
            item.width
          );

      }

      else {

        height =
          longest;

        width =
          longest *
          (
            item.width /
            item.height
          );

      }


      return {
        width,
        height
      };

    }



    /* =====================================================
       PREPARE DRAWING
       ===================================================== */

    function prepareDrawing(
      item,
      referenceLinear
    ) {

      const size =
        calculateDisplaySize(
          item,
          referenceLinear
        );


      const rotation =
        randomBetween(
          -4.8,
          4.8
        );


      const visible =
        item.visibleBounds;


      return {

        ...item,

        displayWidth:
          size.width,

        displayHeight:
          size.height,

        rotation,

        visibleLeft:
          visible.left *
          size.width,

        visibleTop:
          visible.top *
          size.height,

        visibleWidth:
          (
            visible.right -
            visible.left
          )
          *
          size.width,

        visibleHeight:
          (
            visible.bottom -
            visible.top
          )
          *
          size.height

      };

    }



    /* =====================================================
       COLLISION BOX

       Uses visible marks, not blank image canvas.
       ===================================================== */

    function collisionBoxAt(
      item,
      x,
      y
    ) {

      /*
        Rotation safety is deliberately small.

        Slight visual interlocking is desirable.
      */

      const safety =
        1.5 +
        (
          Math.abs(
            item.rotation
          )
          /
          4.8
        )
        *
        2;


      return {

        left:
          x +
          item.visibleLeft -
          safety,

        top:
          y +
          item.visibleTop -
          safety,

        right:
          x +
          item.visibleLeft +
          item.visibleWidth +
          safety,

        bottom:
          y +
          item.visibleTop +
          item.visibleHeight +
          safety

      };

    }



    /* =====================================================
       CANDIDATES AROUND EXISTING DRAWING

       New work is attached directly to the existing mass.
       ===================================================== */

    function candidatesAroundPlaced(
      item,
      target,
      count = 48
    ) {

      const targetCX =
        (
          target.collision.left +
          target.collision.right
        )
        / 2;

      const targetCY =
        (
          target.collision.top +
          target.collision.bottom
        )
        / 2;


      const targetW =
        target.collision.right -
        target.collision.left;

      const targetH =
        target.collision.bottom -
        target.collision.top;


      const ownW =
        item.visibleWidth;

      const ownH =
        item.visibleHeight;


      const results =
        [];


      for (
        let i = 0;
        i < count;
        i++
      ) {

        const angle =
          randomBetween(
            0,
            Math.PI * 2
          );


        /*
          Almost touching.

          Slight inward pressure means the collision
          check itself determines the final boundary.
        */

        const compression =
          randomBetween(
            .74,
            .95
          );


        const radiusX =
          (
            targetW / 2 +
            ownW / 2 +
            1
          )
          *
          compression;


        const radiusY =
          (
            targetH / 2 +
            ownH / 2 +
            1
          )
          *
          compression;


        const visibleCX =
          targetCX +
          Math.cos(
            angle
          )
          *
          radiusX;


        const visibleCY =
          targetCY +
          Math.sin(
            angle
          )
          *
          radiusY;


        const x =
          visibleCX -
          (
            item.visibleLeft +
            item.visibleWidth / 2
          );


        const y =
          visibleCY -
          (
            item.visibleTop +
            item.visibleHeight / 2
          );


        results.push({
          x,
          y
        });

      }


      return results;

    }



    /* =====================================================
       GLOBAL PACK

       NO CATEGORY REGIONS.

       Every drawing attaches to the same mass.

       Same-category drawings receive a score bonus for
       remaining near one another, but categories never
       create walls or empty valleys.
       ===================================================== */

    function packDrawings(
      drawings
    ) {

      const ordered =
        [...drawings]
          .sort(
            (a, b) =>
              (
                b.visibleWidth *
                b.visibleHeight
              )
              -
              (
                a.visibleWidth *
                a.visibleHeight
              )
          );


      const placed =
        [];


      /*
        Slightly wide target — sketchbook spread,
        not panorama.
      */

      const TARGET_ASPECT =
        2.15;


      ordered.forEach(
        (
          item,
          index
        ) => {

          if (
            index === 0
          ) {

            const x =
              0;

            const y =
              0;


            placed.push({

              ...item,

              x,
              y,

              collision:
                collisionBoxAt(
                  item,
                  x,
                  y
                )

            });


            return;

          }



          let winner =
            null;

          let winnerScore =
            Infinity;



          /*
            Attach candidates to every existing drawing.

            We favor targets from the same category,
            but also test unrelated drawings so groups
            interlock rather than form islands.
          */

          const targets =
            shuffle(
              placed
            );


          targets.forEach(
            target => {

              const sameCategory =
                target.category ===
                item.category;


              const candidates =
                candidatesAroundPlaced(
                  item,
                  target,
                  sameCategory
                    ? 72
                    : 26
                );


              candidates.forEach(
                candidate => {

                  const collision =
                    collisionBoxAt(
                      item,
                      candidate.x,
                      candidate.y
                    );


                  const hit =
                    placed.some(
                      other =>
                        boxesOverlap(
                          collision,
                          other.collision,
                          .35
                        )
                    );


                  if (
                    hit
                  ) {
                    return;
                  }


                  const boxes = [

                    ...placed.map(
                      other =>
                        other.collision
                    ),

                    collision

                  ];


                  const bounds =
                    getBounds(
                      boxes
                    );


                  const width =
                    bounds.right -
                    bounds.left;


                  const height =
                    bounds.bottom -
                    bounds.top;


                  const area =
                    width *
                    height;


                  const aspect =
                    width /
                    Math.max(
                      1,
                      height
                    );


                  /*
                    Keep the overall cloud wide,
                    but never force horizontal bands.
                  */

                  const aspectPenalty =
                    Math.abs(
                      Math.log(
                        aspect /
                        TARGET_ASPECT
                      )
                    )
                    *
                    8500;



                  /* -----------------------------------------
                     CATEGORY PROXIMITY

                     Same-name images prefer one another,
                     but this is a preference, not territory.
                     ----------------------------------------- */

                  const sameItems =
                    placed.filter(
                      other =>
                        other.category ===
                        item.category
                    );


                  let categoryPenalty =
                    0;


                  if (
                    sameItems.length
                  ) {

                    const cx =
                      (
                        collision.left +
                        collision.right
                      )
                      / 2;


                    const cy =
                      (
                        collision.top +
                        collision.bottom
                      )
                      / 2;


                    let nearest =
                      Infinity;


                    sameItems.forEach(
                      other => {

                        const ox =
                          (
                            other.collision.left +
                            other.collision.right
                          )
                          / 2;


                        const oy =
                          (
                            other.collision.top +
                            other.collision.bottom
                          )
                          / 2;


                        nearest =
                          Math.min(

                            nearest,

                            Math.hypot(
                              cx - ox,
                              cy - oy
                            )

                          );

                      }
                    );


                    categoryPenalty =
                      nearest *
                      175;

                  }



                  /*
                    Encourage using the existing mass,
                    especially interior pockets.
                  */

                  const globalCenterX =
                    (
                      bounds.left +
                      bounds.right
                    )
                    / 2;


                  const globalCenterY =
                    (
                      bounds.top +
                      bounds.bottom
                    )
                    / 2;


                  const candidateCenterX =
                    (
                      collision.left +
                      collision.right
                    )
                    / 2;


                  const candidateCenterY =
                    (
                      collision.top +
                      collision.bottom
                    )
                    / 2;


                  const centerPenalty =
                    Math.hypot(

                      candidateCenterX -
                      globalCenterX,

                      candidateCenterY -
                      globalCenterY

                    )
                    *
                    28;


                  /*
                    Same-category target gets an additional
                    reward without creating a rigid cluster.
                  */

                  const sameCategoryReward =
                    sameCategory
                      ? -14500
                      : 0;


                  const score =
                    area +
                    aspectPenalty +
                    categoryPenalty +
                    centerPenalty +
                    sameCategoryReward +
                    Math.random() *
                    4200;


                  if (
                    score <
                    winnerScore
                  ) {

                    winnerScore =
                      score;


                    winner = {

                      x:
                        candidate.x,

                      y:
                        candidate.y,

                      collision

                    };

                  }

                }
              );

            }
          );



          /*
            Fallback if required.
          */

          if (
            !winner
          ) {

            const bounds =
              getBounds(
                placed.map(
                  other =>
                    other.collision
                )
              );


            for (
              let attempt = 0;
              attempt < 5000;
              attempt++
            ) {

              const centerX =
                randomBetween(
                  bounds.left,
                  bounds.right
                );


              const centerY =
                randomBetween(
                  bounds.top,
                  bounds.bottom
                );


              const x =
                centerX -
                (
                  item.visibleLeft +
                  item.visibleWidth / 2
                );


              const y =
                centerY -
                (
                  item.visibleTop +
                  item.visibleHeight / 2
                );


              const collision =
                collisionBoxAt(
                  item,
                  x,
                  y
                );


              const hit =
                placed.some(
                  other =>
                    boxesOverlap(
                      collision,
                      other.collision,
                      .35
                    )
                );


              if (
                !hit
              ) {

                winner = {
                  x,
                  y,
                  collision
                };

                break;

              }

            }

          }


          if (
            winner
          ) {

            placed.push({

              ...item,

              x:
                winner.x,

              y:
                winner.y,

              collision:
                winner.collision

            });

          }

        }
      );



      /* ===================================================
         COMPACTION PASSES

         Pull every drawing toward the overall center.

         Because every movement is collision checked,
         drawings slide into available valleys until they
         physically cannot move closer.
         =================================================== */

      for (
        let pass = 0;
        pass < 140;
        pass++
      ) {

        const bounds =
          getBounds(
            placed.map(
              item =>
                item.collision
            )
          );


        const centerX =
          (
            bounds.left +
            bounds.right
          )
          / 2;


        const centerY =
          (
            bounds.top +
            bounds.bottom
          )
          / 2;



        shuffle(
          placed
        ).forEach(
          item => {

            const cx =
              (
                item.collision.left +
                item.collision.right
              )
              / 2;


            const cy =
              (
                item.collision.top +
                item.collision.bottom
              )
              / 2;


            /*
              Main pull: global center.
            */

            let targetX =
              centerX;


            let targetY =
              centerY;



            /*
              Mild same-category pull.

              This keeps related material nearby without
              opening gaps between categories.
            */

            const relatives =
              placed.filter(
                other =>
                  other !== item &&
                  other.category ===
                    item.category
              );


            if (
              relatives.length
            ) {

              let nearest =
                null;

              let nearestDistance =
                Infinity;


              relatives.forEach(
                other => {

                  const ox =
                    (
                      other.collision.left +
                      other.collision.right
                    )
                    / 2;


                  const oy =
                    (
                      other.collision.top +
                      other.collision.bottom
                    )
                    / 2;


                  const distance =
                    Math.hypot(
                      cx - ox,
                      cy - oy
                    );


                  if (
                    distance <
                    nearestDistance
                  ) {

                    nearestDistance =
                      distance;

                    nearest =
                      {
                        x: ox,
                        y: oy
                      };

                  }

                }
              );


              if (
                nearest
              ) {

                targetX =
                  centerX *
                  .66 +
                  nearest.x *
                  .34;


                targetY =
                  centerY *
                  .66 +
                  nearest.y *
                  .34;

              }

            }



            const dx =
              targetX -
              cx;


            const dy =
              targetY -
              cy;


            const distance =
              Math.hypot(
                dx,
                dy
              );


            if (
              distance <
              .5
            ) {
              return;
            }


            /*
              Several step sizes are attempted.

              Large first, then smaller,
              so objects settle into narrow pockets.
            */

            const steps = [
              7,
              4,
              2,
              1
            ];


            for (
              const step of steps
            ) {

              const amount =
                Math.min(
                  step,
                  distance
                );


              const nextX =
                item.x +
                dx /
                distance *
                amount;


              const nextY =
                item.y +
                dy /
                distance *
                amount;


              const nextCollision =
                collisionBoxAt(
                  item,
                  nextX,
                  nextY
                );


              const hit =
                placed.some(
                  other => {

                    if (
                      other === item
                    ) {
                      return false;
                    }


                    return boxesOverlap(
                      nextCollision,
                      other.collision,
                      .15
                    );

                  }
                );


              if (
                !hit
              ) {

                item.x =
                  nextX;

                item.y =
                  nextY;

                item.collision =
                  nextCollision;

                break;

              }

            }

          }
        );

      }



      /* ===================================================
         CROP TO ACTUAL MASS
         =================================================== */

      const finalBounds =
        getBounds(
          placed.map(
            item =>
              item.collision
          )
        );


      const padding =
        42;


      placed.forEach(
        item => {

          item.x -=
            finalBounds.left -
            padding;


          item.y -=
            finalBounds.top -
            padding;

        }
      );


      return {

        width:
          (
            finalBounds.right -
            finalBounds.left
          )
          +
          padding *
          2,

        height:
          (
            finalBounds.bottom -
            finalBounds.top
          )
          +
          padding *
          2,

        items:
          placed

      };

    }



    /* =====================================================
       CREATE DRAWING
       ===================================================== */

    function createDrawing(
      item
    ) {

      const wrapper =
        document.createElement(
          "div"
        );


      wrapper.className =
        "drawing";


      wrapper.style.left =
        `${item.x}px`;


      wrapper.style.top =
        `${item.y}px`;


      wrapper.style.width =
        `${item.displayWidth}px`;


      wrapper.style.height =
        `${item.displayHeight}px`;



      const image =
        document.createElement(
          "img"
        );


      image.className =
        "drawing-art";


      image.src =
        item.filename;


      image.alt =
        "";


      image.loading =
        "lazy";


      image.decoding =
        "async";


      image.draggable =
        false;


      image.style.transform =
        `rotate(${item.rotation}deg)`;


      wrapper.appendChild(
        image
      );


      return wrapper;

    }



    /* =====================================================
       BUILD
       ===================================================== */

    let paperWidth =
      0;

    let paperHeight =
      0;



    async function buildSketchbook() {

      field.innerHTML =
        "";


      const loaded =
        (
          await Promise.all(
            files.map(
              loadImageData
            )
          )
        )
        .filter(Boolean);


      if (
        !loaded.length
      ) {
        return;
      }



      /* ---------------------------------------------
         MEDIAN SOURCE SIZE
         --------------------------------------------- */

      const linear =
        loaded
          .map(
            item =>
              Math.sqrt(
                item.width *
                item.height
              )
          )
          .sort(
            (a, b) =>
              a - b
          );


      const middle =
        Math.floor(
          linear.length /
          2
        );


      const referenceLinear =
        linear.length % 2

          ? linear[
              middle
            ]

          : (
              linear[
                middle - 1
              ]
              +
              linear[
                middle
              ]
            )
            / 2;



      const prepared =
        loaded.map(
          item =>
            prepareDrawing(
              item,
              referenceLinear
            )
        );


      const layout =
        packDrawings(
          prepared
        );


      paperWidth =
        layout.width;


      paperHeight =
        layout.height;


      paper.style.width =
        `${paperWidth}px`;


      paper.style.height =
        `${paperHeight}px`;


      layout.items.forEach(
        item => {

          field.appendChild(
            createDrawing(
              item
            )
          );

        }
      );


      setInitialView();

    }



    /* =====================================================
       VIEW
       ===================================================== */

    const view = {

      x:
        0,

      y:
        0,

      zoom:
        1,

      minZoom:
        .1,

      maxZoom:
        4,

      startX:
        0,

      startY:
        0,

      originX:
        0,

      originY:
        0,

      dragging:
        false

    };



    function constrainPan(
      x,
      y,
      zoom
    ) {

      const width =
        paperWidth *
        zoom;


      const height =
        paperHeight *
        zoom;


      const vw =
        viewport.clientWidth;


      const vh =
        viewport.clientHeight;


      let minX;
      let maxX;
      let minY;
      let maxY;



      if (
        width <= vw
      ) {

        minX =
          maxX =
          (
            vw -
            width
          )
          / 2;

      }

      else {

        minX =
          vw -
          width;

        maxX =
          0;

      }



      if (
        height <= vh
      ) {

        minY =
          maxY =
          (
            vh -
            height
          )
          / 2;

      }

      else {

        minY =
          vh -
          height;

        maxY =
          0;

      }


      return {
        x:
          clamp(
            x,
            minX,
            maxX
          ),

        y:
          clamp(
            y,
            minY,
            maxY
          )
      };

    }



    function updateZoomButtons() {

      const epsilon =
        .0005;


      const atMin =
        view.zoom <=
        view.minZoom +
        epsilon;


      const atMax =
        view.zoom >=
        view.maxZoom -
        epsilon;


      zoomOutButton.classList.toggle(
        "is-hidden",
        atMin
      );


      zoomInButton.classList.toggle(
        "is-hidden",
        atMax
      );

    }



    function applyView() {

      paper.style.transform =
        `translate3d(${view.x}px, ${view.y}px, 0) scale(${view.zoom})`;


      updateZoomButtons();

    }



    function setView(
      x,
      y,
      zoom
    ) {

      view.zoom =
        clamp(
          zoom,
          view.minZoom,
          view.maxZoom
        );


      const position =
        constrainPan(
          x,
          y,
          view.zoom
        );


      view.x =
        position.x;


      view.y =
        position.y;


      applyView();

    }



    /* =====================================================
       INITIAL VIEW

       Fit all first, then move in substantially.

       So you begin seeing the whole concept,
       but already close enough to enjoy the drawings.
       ===================================================== */

    function setInitialView() {

      const margin =
        15;


      const fitX =
        (
          viewport.clientWidth -
          margin *
          2
        )
        /
        paperWidth;


      const fitY =
        (
          viewport.clientHeight -
          margin *
          2
        )
        /
        paperHeight;


      const fitZoom =
        Math.min(
          fitX,
          fitY
        );


      /*
        Minimum zoom = true full-spread view.
      */

      view.minZoom =
        fitZoom;


      /*
        Maximum is relative to natural fitted view,
        so controls remain useful on different screens.
      */

      view.maxZoom =
        Math.max(
          fitZoom *
          5.2,
          2.5
        );


      /*
        Start pretty zoomed in.
      */

      const initialZoom =
        Math.min(
          fitZoom *
          1.38,
          view.maxZoom
        );


      const width =
        paperWidth *
        initialZoom;


      const height =
        paperHeight *
        initialZoom;


      setView(

        (
          viewport.clientWidth -
          width
        )
        / 2,

        (
          viewport.clientHeight -
          height
        )
        / 2,

        initialZoom

      );

    }



    /* =====================================================
       ZOOM AROUND POINT
       ===================================================== */

    function zoomAt(
      x,
      y,
      nextZoom
    ) {

      const worldX =
        (
          x -
          view.x
        )
        /
        view.zoom;


      const worldY =
        (
          y -
          view.y
        )
        /
        view.zoom;


      const zoom =
        clamp(
          nextZoom,
          view.minZoom,
          view.maxZoom
        );


      setView(

        x -
        worldX *
        zoom,

        y -
        worldY *
        zoom,

        zoom

      );

    }



    function zoomCenter(
      factor
    ) {

      zoomAt(

        viewport.clientWidth /
        2,

        viewport.clientHeight /
        2,

        view.zoom *
        factor

      );

    }



    zoomInButton.addEventListener(
      "click",
      () => {

        zoomCenter(
          1.24
        );

      }
    );


    zoomOutButton.addEventListener(
      "click",
      () => {

        zoomCenter(
          1 / 1.24
        );

      }
    );



    /* =====================================================
       TRACKPAD / MOUSE ZOOM
       ===================================================== */

    viewport.addEventListener(
      "wheel",
      event => {

        event.preventDefault();


        const rect =
          viewport.getBoundingClientRect();


        const x =
          event.clientX -
          rect.left;


        const y =
          event.clientY -
          rect.top;


        const factor =
          Math.exp(
            -event.deltaY *
            .00145
          );


        zoomAt(
          x,
          y,
          view.zoom *
          factor
        );

      },
      {
        passive:
          false
      }
    );



    /* =====================================================
       DRAG
       ===================================================== */

    viewport.addEventListener(
      "pointerdown",
      event => {

        if (
          event.target.closest(
            ".zoom-controls"
          )
        ) {
          return;
        }


        view.dragging =
          true;


        view.startX =
          event.clientX;


        view.startY =
          event.clientY;


        view.originX =
          view.x;


        view.originY =
          view.y;


        viewport.classList.add(
          "is-dragging"
        );


        viewport.setPointerCapture(
          event.pointerId
        );

      }
    );


    viewport.addEventListener(
      "pointermove",
      event => {

        if (
          !view.dragging
        ) {
          return;
        }


        setView(

          view.originX +
          event.clientX -
          view.startX,

          view.originY +
          event.clientY -
          view.startY,

          view.zoom

        );

      }
    );


    function finishDrag() {

      view.dragging =
        false;


      viewport.classList.remove(
        "is-dragging"
      );

    }


    viewport.addEventListener(
      "pointerup",
      finishDrag
    );


    viewport.addEventListener(
      "pointercancel",
      finishDrag
    );



    /* =====================================================
       RESIZE
       ===================================================== */

    let resizeTimer =
      null;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          window.setTimeout(
            buildSketchbook,
            180
          );

      }
    );



    /* =====================================================
       START
       ===================================================== */

    buildSketchbook();

  })();
  </script>

</body>
</html>
