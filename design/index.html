<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ece7d7">
  <meta name="description" content="Graphic design, public art identities, printed matter, and digital work by Keegan Andrulis.">
  <title>design | keegan.biz</title>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/design/design.css?v=20261116-overhaul-1">
  <script defer src="/design/portfolio-data.js?v=20261116-overhaul-1"></script>
  <script defer src="/design/design.js?v=20261116-overhaul-1"></script>
</head>
<body class="design-page">
  <div class="page-shell">
    <header class="design-header">
      <a class="design-home" href="/" aria-label="Return home">
        <img src="/assets/home/home-scarf-update.png" alt="" width="267" height="80">
      </a>
      <nav class="design-navigation" aria-label="Site sections">
        <a href="/illustration/">illustration</a>
        <a href="/photography/">photography</a>
        <a href="/design/" aria-current="page">design</a>
        <a href="/motion/">motion</a>
        <a href="/misc/">misc</a>
      </nav>
    </header>

    <main id="main">
      <section id="overview" class="overview" aria-labelledby="page-title">
        <div class="overview-heading">
          <h1 id="page-title">design</h1>
          <p>Identities, printed matter, and digital work</p>
        </div>
        <div class="overview-layout">
          <nav class="work-index" id="work-index" aria-label="Design projects"></nav>
          <div class="overview-feature">
            <button id="feature-open" class="feature-open" type="button" aria-label="Open selected project">
              <img id="feature-image" src="/design/assets/more%20connection.png" alt="More Connection campaign poster" decoding="async">
            </button>
            <div class="feature-bottom">
              <p id="feature-description">Visual identity across Boston’s public art exhibition</p>
              <button type="button" class="text-action" id="feature-action">view project <span aria-hidden="true">↗</span></button>
            </div>
          </div>
        </div>
      </section>

      <section id="study" class="study" aria-labelledby="study-title" hidden>
        <div class="study-bar">
          <button class="text-action" type="button" id="all-work"><span aria-hidden="true">←</span> all projects</button>
          <button class="text-action" type="button" id="next-project">next project <span aria-hidden="true">→</span></button>
        </div>
        <div class="study-layout">
          <aside class="study-copy">
            <h2 id="study-title"></h2>
            <p class="study-tagline" id="study-tagline"></p>
            <nav id="chapter-navigation" class="chapter-navigation" aria-label="Project sections"></nav>
            <div class="study-description">
              <p id="chapter-summary"></p>
              <details id="project-notes">
                <summary>more about this work</summary>
                <div id="project-notes-copy"></div>
              </details>
            </div>
          </aside>
          <div class="study-media">
            <div class="media-heading">
              <h3 id="media-title"></h3>
              <div class="media-actions" id="media-actions"></div>
            </div>
            <div class="media-stage" id="media-stage" aria-live="off"></div>
            <div class="media-footer">
              <p id="media-caption"></p>
              <div class="media-arrows">
                <button type="button" id="previous-art" aria-label="Previous artwork"><span aria-hidden="true">←</span> previous</button>
                <button type="button" id="next-art" aria-label="Next artwork">next <span aria-hidden="true">→</span></button>
              </div>
            </div>
            <nav id="media-thumbnails" class="media-thumbnails" aria-label="Artwork in this section"></nav>
          </div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="art-dialog" class="art-dialog" aria-label="Larger artwork view">
    <button class="art-dialog-close" type="button" id="art-dialog-close" aria-label="Close enlarged artwork">×</button>
    <img alt="" id="art-dialog-image">
  </dialog>

  <dialog id="wip-dialog" class="wip-dialog" aria-label="Work in progress notice">
    <button type="button" class="wip-close" data-wip-dismiss aria-label="Close notice">×</button>
    <p>Thanks for visiting, this page is a work in progress. Please forgive the appearance.</p>
  </dialog>
</body>
</html>
