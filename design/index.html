<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>design — keegan.biz</title>

  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="design.css">
</head>

<body class="design-page">

  <div class="page-shell">

    <nav data-site-nav></nav>

    <main class="design-main">

      <section class="design-intro">

        <div class="design-intro-mark">
          <span>design</span>
        </div>

        <div class="design-intro-copy">
          <p>
            identities, campaigns, print,
            environmental graphics and other
            graphic work.
          </p>
        </div>

        <div
          class="design-ornament"
          aria-hidden="true"
        >
          <span class="ornament-line"></span>
          <span class="ornament-leaf ornament-leaf-a"></span>
          <span class="ornament-leaf ornament-leaf-b"></span>
          <span class="ornament-dot"></span>
        </div>

      </section>

      <section class="project-index" aria-label="Graphic design projects">

        <article class="project-row">

          <div class="project-number" aria-hidden="true">
            01
          </div>

          <a
            class="project-main"
            href="./more/"
          >

            <header class="project-header">
              <h2>More ____</h2>

              <p class="project-client">
                Boston Public Art Triennial
              </p>
            </header>

            <div class="project-image">
              <div class="project-placeholder">
                image
              </div>
            </div>

            <footer class="project-meta">
              <span>campaign · print · environmental</span>
              <span>2025</span>
            </footer>

          </a>

        </article>

        <article class="project-row project-row-reverse">

          <div class="project-number" aria-hidden="true">
            02
          </div>

          <a
            class="project-main"
            href="./better-angels/"
          >

            <header class="project-header">
              <h2>Better Angels</h2>

              <p class="project-client">
                Boston Public Art Triennial
              </p>
            </header>

            <div class="project-image">
              <div class="project-placeholder">
                image
              </div>
            </div>

            <footer class="project-meta">
              <span>identity · collateral · signage</span>
              <span>2025</span>
            </footer>

          </a>

        </article>

      </section>

    </main>

  </div>

  <script src="/assets/site-nav.js" defer></script>

</body>

</html>
