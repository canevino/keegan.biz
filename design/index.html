<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ece7d7">
  <meta name="description" content="Graphic design, public art identities, printed matter, and digital work by Keegan Andrulis.">
  <title>Design portfolio | keegan.biz</title>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/design/design.css?v=20261118-job-portfolio">
  <script defer src="/design/portfolio-data.js?v=20261118-job-portfolio"></script>
  <script defer src="/design/design.js?v=20261118-job-portfolio"></script>
</head>
<body class="design-page">
  <div class="page-shell">
    <header class="design-header">
      <a class="design-home" href="/" aria-label="Return home">
        <img src="/assets/home/home-scarf-update.png" alt="" width="267" height="80">
      </a>
      <nav class="design-navigation" aria-label="Site sections">
        <a href="/illustration/">illustration</a>
        <a href="/photography/">photography</a>
        <a href="/design/" aria-current="page">design</a>
        <a href="/motion/">motion</a>
        <a href="/misc/">misc</a>
      </nav>
    </header>

    <main id="main">
      <section id="overview" class="overview" aria-labelledby="page-title">
        <div class="overview-heading">
          <h1 id="page-title">design portfolio</h1>
          <p>Identities, printed matter, and digital work</p>
        </div>
        <div class="overview-layout">
          <nav class="work-index" id="work-index" aria-label="Design projects"></nav>
          <div class="overview-feature">
            <button id="feature-open" class="feature-open" type="button" aria-label="Open selected project">
              <img id="feature-image" src="/design/assets/more%20connection.png" alt="More Connection campaign poster" decoding="async">
            </button>
            <div class="feature-bottom">
              <p id="feature-description">Visual identity across Boston’s public art exhibition</p>
              <button type="button" class="text-action" id="feature-action">view project</button>
            </div>
          </div>
        </div>
      </section>

      <section id="study" class="study" aria-labelledby="study-title" hidden>
        <div class="study-utility"><button type="button" class="text-action return-link" id="all-work">all projects</button><button type="button" class="text-action" id="study-next-project">next project</button></div>
        <div class="study-intro">
          <div class="study-heading">
            <h2 id="study-title"></h2>
            <p id="study-tagline"></p>
          </div>
          <details class="project-notes" id="project-notes" hidden>
            <summary>about this work</summary>
            <div id="project-notes-copy"></div>
          </details>
        </div>
        <div class="project-gallery" id="project-gallery" aria-label="Project artwork carousel"></div>
      </section>
    </main>
  </div>

  <dialog id="art-dialog" class="art-dialog" aria-label="Larger artwork view">
    <button class="art-dialog-close" type="button" id="art-dialog-close" aria-label="Close enlarged artwork">×</button>
    <div class="art-dialog-stage"><img alt="" id="art-dialog-image"></div>
    <div class="art-dialog-footer"><button type="button" class="text-action" id="art-dialog-prev">previous</button><p id="art-dialog-caption"></p><button type="button" class="text-action" id="art-dialog-next">next</button></div>
  </dialog>


</body>
</html>
