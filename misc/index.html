<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ece7d7">
  <title>misc | keegan.biz</title>
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/misc/style.css">
</head>
<body>
<div class="page-shell">
  <nav data-site-nav></nav>
  <main class="misc-shell">
    <header class="misc-heading"><span>misc / 01</span><h1>misc<span class="colored-dot">.</span></h1></header>
    <section class="machine" aria-labelledby="machine-name">
      <header class="machine-heading"><h2 id="machine-name">ornament machine</h2></header>
      <div class="machine-layout">
        <div class="drawing-side">
          <div class="drawing-meta"><span id="mode-description">botanical ornament</span><span id="seed-label">seed 472818</span></div>
          <div class="drawing-stage" id="drawing-stage" role="img" aria-label="Procedurally generated botanical ornament">
            <div id="drawing" class="drawing"></div>
          </div>
          <div class="drawing-actions">
            <button id="regenerate" type="button" class="action primary">something else ↗</button>
            <button id="export-svg" type="button" class="action">save svg ↗</button>
            <button id="export-png" type="button" class="action">save png ↗</button>
            <label class="tiny-check"><input id="grid" type="checkbox"> grid</label>
          </div>
        </div>
        <form class="drawing-controls" id="controls" novalidate>
          <p class="control-header">make a change</p>
          <label>growth pattern
            <select id="pattern">
              <option value="random">chance / random structure</option>
              <option value="single">single wandering stem</option>
              <option value="crescent">crescent growth</option>
              <option value="diagonal">diagonal overgrowth</option>
              <option value="radiating">radiating shoots</option>
              <option value="meander">winding tendrils</option>
              <option value="cluster">dense thicket</option>
            </select>
          </label>
          <label>botanical species
            <select id="species">
              <option value="random">mixed species / random</option>
              <option value="holly">holly</option>
              <option value="hazel">hazel</option>
              <option value="ivy">ivy</option>
              <option value="hawthorn">hawthorn</option>
              <option value="oak">oak</option>
              <option value="dogrose">dog rose</option>
              <option value="honeysuckle">honeysuckle</option>
              <option value="bramble">bramble</option>
              <option value="fern">ferns</option>
              <option value="acanthus">acanthus</option>
              <option value="hybrid">ornamental hybrid</option>
            </select>
          </label>
          <label>season
            <select id="season">
              <option value="spring">spring</option>
              <option value="summer" selected>summer</option>
              <option value="autumn">autumn</option>
              <option value="winter">winter</option>
            </select>
          </label>
          <label>pigments
            <select id="palette">
              <option value="kells">insular / mineral</option>
              <option value="jewel">lapis / vermilion</option>
              <option value="earth">earth / iron</option>
              <option value="site">red / green / yellow</option>
              <option value="monochrome">black / sepia</option>
            </select>
          </label>
          <div class="fields-pair one-up"><label>seed <input type="number" id="seed" min="1" max="4294967295" inputmode="numeric" value="472818"></label></div>
          <div class="control-sep"></div>
          <label class="sliding">foliage <output for="foliage" id="foliage-value">70</output><input type="range" id="foliage" min="0" max="100" value="70"></label>
          <label class="sliding">small details <output for="detail" id="detail-value">52</output><input type="range" id="detail" min="0" max="100" value="52"></label>
          <label class="sliding">pigment variation <output for="pigment" id="pigment-value">46</output><input type="range" id="pigment" min="0" max="100" value="46"></label>
          <label class="sliding">branch movement <output for="distortion" id="distortion-value">20</output><input type="range" id="distortion" min="0" max="100" value="20"></label>
          <label class="sliding">print wear <output for="wear" id="wear-value">35</output><input type="range" id="wear" min="0" max="100" value="35"></label>
          <label class="sliding">ink spread <output for="spread" id="spread-value">46</output><input type="range" id="spread" min="0" max="100" value="46"></label>
          <label class="sliding">color registration <output for="registration" id="registration-value">28</output><input type="range" id="registration" min="0" max="100" value="28"></label>
          <div class="control-sep"></div>
          <label class="check"><input type="checkbox" id="bleed" checked> ink bleed</label>
          <label class="check"><input type="checkbox" id="transparent" checked> transparent export</label>
          <button type="button" class="action reset" id="reset">reset ↗</button>
        </form>
      </div>
    </section>
  </main>
</div>
<script src="/assets/site-nav.js" defer></script>
<script src="/misc/js/core.js" defer></script>
<script src="https://cdn.jsdelivr.net/gh/rvanwijnen/spectral.js@3.0.0/spectral.min.js" defer></script>
<script src="/misc/js/pigment.js" defer></script>
<script src="/misc/js/finish.js" defer></script>
<script src="/misc/js/composition.js" defer></script>
<script src="/misc/js/species.js" defer></script>
<script src="/misc/js/botany.js" defer></script>
<script src="/misc/js/render.js" defer></script>
<script src="/misc/js/app.js" defer></script>
</body>
</html>
