<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ece7d7">
  <title>misc · keegan.biz</title>
  <meta name="description" content="misc section with an interactive ornament machine.">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="misc-page">
  <div class="page-shell">
    <nav data-site-nav></nav>
    <main class="misc-main">
      <header class="misc-intro">
        <p class="micro">misc / drawing systems</p>
        <h1>misc<span class="dot">.</span></h1>
      </header>

      <section class="experiment" id="ornament-machine" aria-labelledby="experiment-title">
        <div class="experiment-header">
          <div class="experiment-rail">
            <p class="experiment-number">01 / generative art</p>
          </div>
          <div class="experiment-heading">
            <h2 id="experiment-title">ornament machine<span class="arrow"> ↗</span></h2>
            <p class="experiment-description">interlace, manuscript letters, distortion, pigment, vines.</p>
          </div>
        </div>

        <div class="studio">
          <div class="art-column">
            <div class="art-meta"><span id="state-name">botanical marginalia</span><span id="seed-label">seed 472818</span></div>
            <div class="art-workspace" id="workspace" aria-label="Generated ornament" role="img">
              <div id="artwork" class="artwork"></div>
            </div>
            <div class="art-actions">
              <button type="button" class="text-action main-action" id="regenerate">something else ↗</button>
              <button type="button" class="text-action" id="save-svg">save svg ↗</button>
              <button type="button" class="text-action" id="save-png">save png ↗</button>
              <label class="small-check"><input type="checkbox" id="show-grid"> transparency grid</label>
            </div>
          </div>

          <form class="studio-controls" id="studio-controls">
            <div class="control-intro">make a change</div>
            <label>arrangement
              <select id="mode">
                <option value="marginalia">botanical marginalia</option>
                <option value="initial">decorated initial</option>
                <option value="interlace">interlaced illumination</option>
                <option value="chromatic">distorted pigments</option>
              </select>
            </label>
            <label>inks
              <select id="palette">
                <option value="medieval">lapis / vermilion / gold</option>
                <option value="insular">verdigris / madder</option>
                <option value="site">red / green / yellow</option>
                <option value="monochrome">black / iron</option>
                <option value="random">chance</option>
              </select>
            </label>
            <div class="control-pair">
              <label>initial <input id="initial" type="text" maxlength="1" value="A" autocapitalize="characters" aria-label="Decorated initial"></label>
              <label>seed <input id="seed" type="number" inputmode="numeric" min="1" max="4294967295" value="472818"></label>
            </div>
            <div class="control-divider"></div>
            <label class="slider">foliage <span id="foliage-out">72</span><input id="foliage" type="range" min="0" max="100" value="72"></label>
            <label class="slider">knotwork <span id="knots-out">56</span><input id="knots" type="range" min="0" max="100" value="56"></label>
            <label class="slider">letter fragments <span id="letters-out">23</span><input id="letters" type="range" min="0" max="100" value="23"></label>
            <label class="slider">pigment / mosaic <span id="pigment-out">40</span><input id="pigment" type="range" min="0" max="100" value="40"></label>
            <label class="slider">broken print <span id="wear-out">19</span><input id="wear" type="range" min="0" max="100" value="19"></label>
            <div class="control-divider"></div>
            <label class="checkline"><input type="checkbox" id="initial-visible" checked> decorated letter</label>
            <label class="checkline"><input type="checkbox" id="bleed" checked> uneven ink / bleed</label>
            <label class="checkline"><input type="checkbox" id="transparent" checked> transparent export</label>
            <button type="button" id="reset" class="reset-button">restore starting settings ↗</button>
          </form>
        </div>
      </section>
    </main>
  </div>
  <script src="/assets/site-nav.js" defer></script>
  <script src="./js/core.js" defer></script>
  <script src="./js/knot.js" defer></script>
  <script src="./js/ornament.js" defer></script>
  <script src="./js/app.js" defer></script>
</body>
</html>
